    finding: "TraitCode invariant said 'set at inception and immutable' but verification says traits accumulate via rotation"
    resolution: "keripy confirms: Kever.config() called only in __init__ (inception), never in update() (rotation). v2.0 wire format admits c in rot but it has no behavioral effect. Fixed invariant to 'inception-only, persists for lifetime'."
    oracle: "keripy eventing.py:2070-2086 — config() never called in update()"

  - id: "L1-C2"
