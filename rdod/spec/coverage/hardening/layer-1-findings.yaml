# KEY ORACLE RESOLUTIONS (not yet applied as edits)
# ──────────────────────────────────────

oracle_resolutions:
  - question: "Pre-rotation digest — what bytes are hashed?"
    answer: "qb64b (CESR-qualified base-64 encoding as UTF-8 bytes), NOT raw binary key bytes"
    source: "keripy eventing.py:2657 — Diger(ser=siger.verfer.qb64b, code=diger.code)"
    impact: "identity/key-commitment verification should specify 'digest of qb64 encoding'"

  - question: "Version string size field scope"
    answer: "Body only — serialized event dict, NOT including attachment groups"
    source: "keripy coring.py:88-89 — size = len(dumps(ked, kind))"
    impact: "cesr/composition types should clarify 'body size only'"

  - question: "BADA acceptance precedence"
    answer: "sn-first for transferable (higher sn wins regardless of datetime); datetime-only for non-transferable"
    source: "keripy routing.py:336-362"
    impact: "identity/state BADA port contract needs explicit precedence rule"

  - question: "Non-transferable AIDs and ixn events"
    answer: "CONFLICT — keripy blocks ALL post-inception events (eventing.py:2130); KeriChat says ixn allowed"
    source: "keripy is definitive: Kever.update() raises ValidationError for any event on non-transferable kever"
    impact: "DDD spec should follow keripy: non-transferable AIDs accept NO post-inception events"

  - question: "E-prefix transferability"
    answer: "Determined by n field content, not prefix code. E-prefix + n=[] = non-transferable"
    source: "keripy coring.py:1251 (Prefixer.transferable) + eventing.py:1820 (Kever.transferable)"
    impact: "identity/key-commitment transferability port postcondition needs correction"

  - question: "Superseded ixn seals"
    answer: "Preserved in event store but demoted — legally void, must be re-anchored post-recovery"
    source: "keripy eventing.py:3366 (addOn inserts dup, doesn't remove old)"
    impact: "identity/anchoring should document seal voiding on supersession"

  - question: "DEL storage"
    answer: "SAID index (ldes) + full events in event store (db.evts) — not SAIDs-only"
    source: "keripy eventing.py:5376-5377, basing.py:613-614"
    impact: "integrity/detection DuplicityEvidence type correctly stores SAIDs; full events are in the event store"

  - question: "PSE timeout"
    answer: "Implementation default (3600s), not normative — Kevery class attribute, changeable via subclassing"
    source: "keripy eventing.py:46"
    impact: "identity/thresholds verification should not hardcode 3600s"

  - question: "Delegation Rule B2 seal index"
    answer: "Ordinal position (0-based) in the delegating event's 'a' array. Higher index = supersedes."
    source: "keripy eventing.py:3106-3121"
    impact: "delegation/recovery DelegatingEventRef needs seal_index field"

  - question: "CESR genus override scope"
    answer: "Lexically scoped to enclosing overrideable group — reverts on group exit (stack semantics)"
    source: "KeriChat — medium confidence, inferred from spec framing language"
    impact: "cesr/composition UL should specify genus context as stack-based"

