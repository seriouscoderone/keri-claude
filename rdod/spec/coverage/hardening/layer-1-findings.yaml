    resolution: "keripy eventing.py:2285-2290 confirms asymmetric guard: rot requires sn > lastEst.s, drt requires sn >= lastEst.s. Split into separate transitions for rot and drt with correct guards."
    oracle: "keripy — rot stale if sn <= lastEst.s; drt stale if sn < lastEst.s"

