resolved:
  - id: "L2-C1"
    category: naming
    domain: "identity/establishment"
    file: "types.yaml"
    finding: "Type named 'Serder' — keripy class name not in KERI spec vocabulary"
    resolution: "Renamed to 'KeyEventBody' — spec says 'key event message body'; keripy class is SerderKERI"
    oracle: "keripy serdering.py:2118 confirms SerderKERI(Serder) is the KERI-specific subclass"

# ──────────────────────────────────────
# KEY ORACLE RESOLUTIONS
# ──────────────────────────────────────

oracle_resolutions:
  - question: "Pre-rotation binding failure — escrow or reject?"
    answer: "keripy treats it as PSE (partially-signed escrow) — non-matching keys are silently skipped, reducing exposed indices. If remaining signatures satisfy threshold, event succeeds; otherwise PSE."
    source: "keripy eventing.py:2646-2661 (exposeds), 2531 (threshold check)"
    impact: "The FSM routing pre_rotation_checked → escrowed_pse is CORRECT per keripy. PreRotationBindingError severity should be changed from 'fatal' to 'recoverable'."

  - question: "TEL event validation — full body or SAID lookup?"
    answer: "Full event body (Serder) + anchor reference (seqner + saider) passed into Tever.issue()/revoke()"
    source: "keripy vdr/eventing.py:1505-1568"
    impact: "credential-lifecycle/status authorize port input type must be full TELEvent, not TelEventUnion (SAID-only)"

  - question: "Superseding recovery → credential notification?"
    answer: "keripy does NOT proactively notify TEL/credential system. Anchor validity is lazily checked on verifyAnchor() calls."
    source: "keripy eventing.py:2279-2318 — no tvy interaction on recovery path"
    impact: "Cross-domain gap confirmed. DDD spec should note TEL verification is pull-based. StatusService invariant: anchor validity contingent on current winning KEL."

  - question: "Delegable escrow distinct from PDE?"
    answer: "Yes — fully separate db.delegables table with 1200s timeout, entered when delegated event is fully signed/witnessed but delegator approval missing"
    source: "keripy eventing.py:3413-3445 (escrowDelegableEvent), 6460-6539 (processEscrowDelegables)"
    impact: "identity/establishment FSM needs escrowed_delegable state distinct from escrowed_pde"

  - question: "ValidationError cross-domain ref"
    answer: "Defined in errors.yaml not types.yaml — identity/state reference types://identity/establishment#ValidationError is broken"
    source: "identity/establishment/errors.yaml vs types.yaml"
    impact: "Fix reference to errors:// or add error type alias in types.yaml"

