  - id: ACDC-Z3-002
    zoom: Z3
    heading: "Basic Bulk Issuance Procedure"
    score: awkward
    description: >
      No UL term for hierarchical deterministic derivation paths used in bulk
      issuance UUID generation.
    proposed_term: "HierarchicalDerivation"
    proposed_definition: >
      A deterministic key/UUID derivation mechanism using hierarchical paths
      indexed by bulk copy index and block position, enabling the Issuee to
      regenerate any bulk-issued ACDC instance from a Shared Secret Salt and
      index without storing all copies.
    route: types
    route_domain: privacy/blinding
    route_reason: "Derivation mechanism type — lives alongside SharedSecretSalt"

  # === Z4 ===
  - id: ACDC-Z4-001
    zoom: Z4
    heading: "Blinded Attribute Block field details"
    score: awkward
    description: >
      No UL term for virtual-labeled (non-serialized label) fixed-field blocks —
      a structural distinction from normal SAD field maps.
    proposed_term: "FixedFieldBlock"
    proposed_definition: >
      A CESR data structure whose fields follow a fixed positional order with
      virtual (mnemonic-only, never serialized) labels, in contrast to labeled
      SAD field maps. Used for Blinded Attribute Blocks and Bound Blinded
      Attribute Blocks.
    route: types
    route_domain: cesr
    route_reason: "CESR structural type — the encoding pattern, not the credential concept"

  - id: ACDC-Z4-002
    zoom: Z4
    heading: "Calculating SAID of serialized Blinded Attribute Block"
    score: awkward
    description: >
      The BLID computation is a specialization of SAID computation for fixed-field
      blocks. The UL has SAID and BLID but no term linking them as variants of
      the same self-addressing protocol.
    proposed_term: null
    proposed_action: "Enrich existing BLID term to explicitly note it as a fixed-field SAID computation variant"
    route: ul_term
    route_domain: privacy/blinding
    route_reason: "Enrich existing term definition"
