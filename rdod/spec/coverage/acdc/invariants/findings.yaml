  # ══════════════════════════════════════════════════════════════════════════
  # CLUSTER 1: ACDC Structural Invariants — credential-lifecycle
  # ══════════════════════════════════════════════════════════════════════════
  - id: ACDC-INVF-001
    cluster: "ACDC Structure"
    domain: credential-lifecycle
    verification_file: verification.yaml
    rules_covered: 19
    representative_spec_lines: [382, 412, 417, 458, 469, 489, 516, 605, 624]
    precision: pbt-ready
    proposed_invariant:
      term: "ACDC Structure"
      technique: property-based
      invariant: >
        Top-level fields MUST appear in order [v, t, d, u, i, rd, s, a, A, e, r].
        Fields [v, d, i, s] are REQUIRED. Version string v MUST be first.
        Protocol field in version string MUST be 'ACDC'. Field labels MUST be
        1-2 characters. Insertion-ordered serialization is canonical. The d field
        MUST be a valid SAID. The i field MUST be a valid AID. The dt field,
        when present, MUST be ISO-8601 with microseconds and UTC offset.
      formal: |
        @given(acdc=acdc_strategy())
        def test_acdc_structure(acdc):
            fields = list(acdc.keys())
            canonical = ['v', 't', 'd', 'u', 'i', 'rd', 's', 'a', 'A', 'e', 'r']
            present = [f for f in canonical if f in fields]
            assert fields[:len(present)] == present, "Field ordering violation"
            for req in ['v', 'd', 'i', 's']:
                assert req in acdc, f"Required field {req} missing"
            assert fields[0] == 'v', "v must be first field"
            assert parse_version_string(acdc['v']).protocol == 'ACDC'
            assert is_valid_said(acdc['d'])
            assert is_valid_aid(acdc['i'])
            if 'dt' in acdc:
                assert matches_rfc3339_microsecond_utc(acdc['dt'])

