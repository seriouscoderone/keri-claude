  # CLUSTER 2: Schema Invariants — credential-lifecycle
  # ══════════════════════════════════════════════════════════════════════════
  - id: ACDC-INVF-002
    cluster: "Schema Validation"
    domain: credential-lifecycle
    verification_file: verification.yaml
    rules_covered: 15
    representative_spec_lines: [946, 952, 957, 972, 992, 1032, 1072, 1104, 1117, 1122, 1150, 1168]
    precision: z3-ready
    proposed_invariant:
      term: "TypeIsSchema"
      technique: smt
      invariant: >
        Schema $id MUST equal said_compute(schema) (bare SAID, no URI scheme).
        ACDC s field MUST equal schema $id. Schema MUST be a SAD. No dynamic
        $ref or $vocabulary. $schema MUST be 'https://json-schema.org/draft/2020-12/schema'.
        Schema MUST have a 'version' field with semantic version string.
        Backward-incompatible schema MUST have higher major version.
        Schema digest MUST have >= 128 bits cryptographic strength.
      formal: |
        # Z3: schema self-addressing
        s = Solver()
        schema_id, schema_said = Strings('schema_id schema_said')
        s.add(schema_id == schema_said)  # $id == SAID
        s.add(is_bare_said(schema_id))
        assert s.check() == sat

        # PBT: schema validation
        @given(schema=acdc_schema_strategy())
        def test_schema_invariants(schema):
            assert schema['$id'] == said_compute(schema), "$id must be SAID"
            assert is_bare_said(schema['$id']), "$id must be bare SAID"
            assert schema.get('$schema') == 'https://json-schema.org/draft/2020-12/schema'
            assert 'version' in schema
            assert matches_semver(schema['version'])
            assert not has_dynamic_refs(schema), "No dynamic $ref allowed"

  # ══════════════════════════════════════════════════════════════════════════
  # CLUSTER 3: Edge Section Structural Rules — credential-lifecycle
  # ══════════════════════════════════════════════════════════════════════════
  - id: ACDC-INVF-003
    cluster: "Edge Structure"
    domain: credential-lifecycle
    verification_file: verification.yaml
    rules_covered: 12
    representative_spec_lines: [2507, 2591, 2595, 2619, 2637, 2680, 2685, 2708, 2712, 2719, 2766]
    precision: z3-ready
    proposed_invariant:
      term: "CredentialEdge / EdgeGroup"
      technique: smt
      invariant: >
        Edge MUST have n field; EdgeGroup MUST NOT have n field. Edge field
        order: [d,u,n,s,o,w]. EdgeGroup field order: [d,u,o,w]. SAID d field
        MUST be first when present; value MUST equal said_compute(block). UUID
        u field MUST be second with >= 128 bits entropy. Top-level EdgeGroup
        MUST NOT have w field. Default EdgeGroup operator is AND. Labeled
        nested fields MUST follow all reserved fields and be locally unique.
        No nested block may have a type field.
      formal: |
        # Z3: Edge/EdgeGroup discriminant
        n_present = Bool('n_present')
        is_edge, is_edge_group = Bools('is_edge is_edge_group')
        s = Solver()
        s.add(is_edge == n_present)
        s.add(is_edge_group == Not(n_present))
        s.add(Not(And(is_edge, is_edge_group)))  # mutually exclusive
        assert s.check() == sat

  - id: ACDC-INVF-004
    cluster: "Edge Operator Semantics"
    domain: credential-lifecycle
    verification_file: verification.yaml
    rules_covered: 6
    representative_spec_lines: [2889, 2891, 2898, 2902, 2911, 2920]
    precision: z3-ready
    proposed_invariant:
      term: "CredentialEdge"
      technique: smt
      invariant: >
        I2I: issuer_aid(near_acdc) MUST equal issuee_aid(far_acdc); far node
        MUST be TargetedACDC. NI2I: no AID constraint between near issuer and
        far issuee. DI2I: issuer_aid(near_acdc) MUST be issuee_aid(far_acdc)
        OR a delegated AID thereof; far node MUST be TargetedACDC. Default
        operator for targeted far-node is I2I; for untargeted is NI2I.
      formal: |
        # Z3: I2I operator
        near_issuer, far_issuee = Consts('near_issuer far_issuee', AIDSort)
        is_targeted = Bool('is_targeted')
        s = Solver()
        s.add(Implies(And(i2i_active, is_targeted),
              near_issuer == far_issuee))
        s.add(Implies(i2i_active, is_targeted))  # far must be targeted
        assert s.check() == sat

  - id: ACDC-INVF-005
    cluster: "Edge Validation Workflow"
    domain: credential-lifecycle
    verification_file: verification.yaml
    rules_covered: 4
    representative_spec_lines: [2831, 2833, 2835, 2850]
    precision: pbt-ready
    proposed_invariant:
      term: "CredentialEdge"
      technique: property-based
      invariant: >
        Validator MUST confirm: (1) said_compute(far_node) == edge.n,
        (2) far_node validates against its own schema, (3) if edge.s present,
        far_node also validates against edge.s schema, (4) if edge.s SAID
        differs from far_node schema SAID, two validation runs MUST execute.
      formal: |
        @given(near=acdc_with_edges(), far=acdc_strategy())
        def test_edge_validation(near, far):
            for edge in near.edges:
                assert said_compute(far) == edge['n'], "Far-node SAID mismatch"
                assert validates_schema(far, far['s']), "Far-node self-schema fail"
                if 's' in edge:
                    assert validates_schema(far, edge['s']), "Edge schema fail"

