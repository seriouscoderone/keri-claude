  # CLUSTER 4: Rule Section Structural Rules — credential-lifecycle
  # ══════════════════════════════════════════════════════════════════════════
  - id: ACDC-INVF-006
    cluster: "Rule Structure"
    domain: credential-lifecycle
    verification_file: verification.yaml
    rules_covered: 8
    representative_spec_lines: [3082, 3094, 3114, 3117, 3124, 3138, 3155, 3157]
    precision: z3-ready
    proposed_invariant:
      term: "Rule Section"
      technique: smt
      invariant: >
        Rule MUST have l field; MUST NOT have fields beyond {d, u, l}. Rule-group
        field order: [d,u,l] then labeled nested fields. SAID d MUST be first
        when present; value = said_compute(block). Labeled nested Rules/Rule-groups
        MUST be locally unique, non-reserved, no type field.
      formal: |
        # Z3: Rule field set restriction
        rule_fields = Set('rule_fields', StringSort())
        allowed = SetUnion(SetAdd(SetAdd(EmptySet(StringSort()), StringVal('d')),
                  StringVal('u')), SetAdd(EmptySet(StringSort()), StringVal('l')))
        s = Solver()
        s.add(IsSubset(rule_fields, allowed))
        s.add(IsMember(StringVal('l'), rule_fields))  # l required
        assert s.check() == sat

