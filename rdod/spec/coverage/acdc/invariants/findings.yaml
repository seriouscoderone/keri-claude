  # CLUSTER 5: TEL Event Field Structure — credential-lifecycle
  # ══════════════════════════════════════════════════════════════════════════
  - id: ACDC-INVF-007
    cluster: "TEL Event Structure"
    domain: credential-lifecycle
    verification_file: verification.yaml
    rules_covered: 4
    representative_spec_lines: [4406, 4414, 4420, 4430]
    precision: pbt-ready
    proposed_invariant:
      term: "TEL Event Type Pattern"
      technique: property-based
      invariant: >
        rip field order: [v, t, d, u, i, n, dt], all required, t='rip'.
        bup field order: [v, t, d, rd, n, p, dt, b], all required, t='bup'.
        upd field order: [v, t, d, rd, n, p, dt, ta, ts], all required, t='upd'.
        Version string protocol MUST be 'ACDC' for all TEL events.
      formal: |
        @given(tel_event=tel_event_strategy())
        def test_tel_event_structure(event):
            expected_order = {
                'rip': ['v', 't', 'd', 'u', 'i', 'n', 'dt'],
                'bup': ['v', 't', 'd', 'rd', 'n', 'p', 'dt', 'b'],
                'upd': ['v', 't', 'd', 'rd', 'n', 'p', 'dt', 'ta', 'ts'],
            }
            fields = list(event.keys())
            assert fields == expected_order[event['t']]
            assert parse_version_string(event['v']).protocol == 'ACDC'

