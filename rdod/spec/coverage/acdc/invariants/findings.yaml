  # CLUSTER 8: Disclosure Protocol Rules — privacy
  # ══════════════════════════════════════════════════════════════════════════
  - id: ACDC-INVF-011
    cluster: "Disclosure Protocol"
    domain: privacy
    verification_file: verification.yaml
    rules_covered: 3
    representative_spec_lines: [3946, 3958, 6140]
    precision: vague
    proposed_invariant:
      term: "Contractually Protected Disclosure"
      technique: property-based
      invariant: >
        Chain-link terms MUST propagate: each subsequent Discloser MUST apply
        original terms to each subsequent Disclosee. Contingent Disclosure:
        when contingency is met, obligated party MUST disclose. Bulk issuance
        aggregate B MUST be anchored in Issuer's KEL.
      formal: |
        # These are behavioral/temporal — full PBT requires multi-party exchange simulation
        @given(chain=disclosure_chain_strategy())
        def test_chain_propagation(chain):
            original_terms = chain[0].terms
            for step in chain[1:]:
                assert step.applied_terms == original_terms
      notes: >
        The chain-propagation and contingent disclosure rules are the hardest
        to formalize because they span multiple independent exchanges. The
        existing chain-link gating invariant covers the single-exchange case
        but not cross-exchange propagation.
