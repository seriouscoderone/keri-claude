  # CLUSTER 6: CESR Codec Constraints — privacy/blinding + credential-lifecycle
  # ══════════════════════════════════════════════════════════════════════════
  - id: ACDC-INVF-008
    cluster: "CESR Codec"
    domain: privacy/blinding
    verification_file: verification.yaml
    rules_covered: 6
    representative_spec_lines: [4576, 5294, 4662, 4673, 5319, 5347]
    precision: pbt-ready
    proposed_invariant:
      term: "Shielded Attribute Block"
      technique: property-based
      invariant: >
        Shielded Attribute Block MUST use count code BlindedStateQuadruples (-a##).
        Bound Shielded Attribute Block MUST use BoundStateSextuples (-b##).
        Placeholder td/ts fields MUST encode as CESR Empty (1AAP).
        Placeholder bn MUST encode as CESR integer 0 (MAAA).
        Placeholder bd MUST encode as CESR Empty (1AAP).
      formal: |
        @given(block=shielded_block_strategy())
        def test_cesr_encoding(block):
            if is_placeholder(block['td']):
                assert block['td'] == '1AAP'
            if is_placeholder(block['ts']):
                assert block['ts'] == '1AAP'
            if is_bound(block):
                if is_placeholder(block['bn']):
                    assert block['bn'] == 'MAAA'
                if is_placeholder(block['bd']):
                    assert block['bd'] == '1AAP'

  - id: ACDC-INVF-009
    cluster: "CESR Native Message Format"
    domain: credential-lifecycle
    verification_file: verification.yaml
    rules_covered: 4
    representative_spec_lines: [6724, 6726, 6744, 6745]
    precision: pbt-ready
    proposed_invariant:
      term: "ACDC Message Types"
      technique: property-based
      invariant: >
        acm field map: count code -G## or --G#####; fields in order
        [v, t, d, u, i, rd, s, a, A, e, r]. acm fixed field: count code -F##
        or --F#####; values in same order. a and A MUST NOT both be non-empty.
        Message type t MUST appear in all CESR native messages.
      formal: |
        @given(msg=acdc_cesr_message_strategy())
        def test_cesr_native_format(msg):
            if msg.is_field_map:
                assert msg.count_code in ['-G', '--G']
            else:
                assert msg.count_code in ['-F', '--F']
            canonical = ['v','t','d','u','i','rd','s','a','A','e','r']
            assert msg.field_order == [f for f in canonical if f in msg.fields]

  # ══════════════════════════════════════════════════════════════════════════
  # CLUSTER 7: Bound Block Key State Binding — privacy/blinding
  # ══════════════════════════════════════════════════════════════════════════
  - id: ACDC-INVF-010
    cluster: "Bound Block Validation"
    domain: privacy/blinding
    verification_file: verification.yaml
    rules_covered: 4
    representative_spec_lines: [5308, 5309, 5339, 5346]
    precision: pbt-ready
    proposed_invariant:
      term: "Bound Shielded Attribute Block"
      technique: property-based
      invariant: >
        bn MUST equal the s field (sequence number) of the Issuee's current KEL
        key event at bup publication time. bd MUST equal the d field (SAID) of
        that same key event. Both are temporal cross-log bindings.
      formal: |
        @given(bup_event=bup_strategy(), issuee_kel=kel_strategy())
        def test_bound_block_key_state(bup_event, issuee_kel):
            block = bup_event.bound_block
            if not is_placeholder(block['bn']):
                current_key_event = issuee_kel.current_event()
                assert block['bn'] == current_key_event['s']
                assert block['bd'] == current_key_event['d']

