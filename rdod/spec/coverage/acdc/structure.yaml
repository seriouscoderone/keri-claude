sections:
  # Z0
  - heading: "Authentic Chained Data Containers (ACDC)"
    zoom: Z0
    line: 1
    sentence: >
      An ACDC is a cryptographically verifiable, Schema-enforced data container bound to an
      Issuer AID via KERI key state, where chains of ACDCs linked through the Edge Section
      form a distributed property graph enabling granular proof-of-authorship — and, combined
      with Graduated Disclosure and Rule Section contractual terms, extensible to
      proof-of-authority for entitlements and permissions.
    score: awkward
    finding_id: ACDC-Z0-001

  # Z1 — Capabilities
  - heading: "Introduction"
    zoom: Z1
    line: 34
    sentence: >
      The ACDC specification defines a cryptographically verifiable data container (ACDC)
      issued by an Issuer AID, supporting Graduated Disclosure — from Metadata Disclosure
      through Compact Disclosure, Partial Disclosure, Selective Disclosure, and Full Disclosure
      gated by Contractually Protected Disclosure — where ACDCs chain via the Edge Section
      into an authenticated directed acyclic graph enabling both proof-of-authorship and
      proof-of-authority for entitlements, with 128-bit security throughout.
    score: awkward
    finding_id: [ACDC-Z1-001, ACDC-Z1-002]
  - heading: "Scope"
    zoom: Z1
    line: 155
    sentence: >
      The Scope section defines the boundaries of the ACDC specification: ACDC structure and
      Credential Type Dimensions, Schema (type-is-schema principle, oneOf Composition),
      Graduated Disclosure mechanisms (Disclosure Form Taxonomy, Contractually Protected
      Disclosure, Selective Disclosure, Bulk-Issued Instance Disclosure), IPEX (Apply, Offer,
      Agree, Grant, Admit, Spurn), and TELs (Registry, Registry Inception, Update Event,
      Blindable Update, Blindable vs Non-Blindable modes).
    score: fluent
    finding_id: null
  - heading: "ACDC Structure"
    zoom: Z1
    line: 348
    sentence: >
      An ACDC is an ordered nested field map with required top-level fields — version string,
      SAID (d), Issuer AID (i), and Schema (s) — and optional fields including top-level UUID
      (u, for Private ACDC blinding), Registry SAID (rd), Attribute Section (a), Aggregate
      Section (A), Edge Section (e), and Rule Section (r); the top-level SAID is computed via
      the Most Compact Form algorithm applied depth-first through the credential tree.
    score: fluent
    finding_id: null
  - heading: "ACDC Variants"
    zoom: Z1
    line: 677
    sentence: >
      ACDCs come in four variants determined by the presence and value of the top-level UUID
      field: Public ACDC (no UUID), Private ACDC (high-entropy UUID >= 128 bits — blinded
      commitment), Metadata ACDC (empty UUID — commitment to schema and rules without content
      correlation), and Compact ACDC (any variant in its Most Compact Form with all sections
      replaced by their SAIDs).
    score: fluent
    finding_id: null
  - heading: "Top-level ACDC Sections"
    zoom: Z1
    line: 910
    sentence: >
      An ACDC has five top-level sections: Schema (s — static, SAIDified JSON Schema 2020-12
      with oneOf Composition variants), Attribute Section (a — direct attribute disclosure with
      optional Issuee AID for targeted credentials), Aggregate Section (A — AGID enabling
      Selective Disclosure via Inclusion Proof over Blinded Attribute Blocks), Edge Section (e —
      directed edges with edge operators forming an authenticated property graph), and Rule
      Section (r — Ricardian contract clauses providing Chain-Link Confidentiality terms).
    score: fluent
    finding_id: null
  - heading: "Disclosure Mechanisms and Exploitation Protection"
    zoom: Z1
    line: 3582
    sentence: >
      Disclosure and exploitation protection bind ACDC state to Issuer key state via Transaction
      Event Seals in the Issuer's KEL; the TEL Registrar publishes Credential State (issued/revoked)
      observable by a TEL Observer; data privacy is enforced through Graduated Disclosure — Private
      ACDC blinding, Contractually Protected Disclosure via Rule Section terms, Selective Disclosure
      via AGID and Inclusion Proofs, and Blindable vs Non-Blindable Registry modes using the
      Shared Secret Salt and Blinded Attribute Block (BLID); the three-party exploitation model
      is addressed by Bespoke ACDC composition enabling presentation-specific contractual wrapping.
    score: awkward
    finding_id: [ACDC-Z1-003, ACDC-Z1-004]
  - heading: "Issuance and Presentation Exchange (IPEX)"
    zoom: Z1
    line: 3977
    sentence: >
      IPEX is a uniform protocol modeling both credential issuance and credential presentation as
      Graduated Disclosure from a Discloser to a Disclosee, using the IPEX Message Type Pattern
      (Apply → Offer → Agree → Grant → Admit, with Spurn at any step) authenticated via KRAM;
      a Grant carries Credential Artifacts (the ACDC, its Update Event or Blindable Update, and
      the Transaction Event Seal) providing the Disclosee with Proof of Issuance and Proof of
      Disclosure without additional round-trips; the Discloser may issue a Bespoke ACDC to add
      presentation-specific contractual terms before granting.
    score: fluent
    finding_id: null
  - heading: "Transaction Event Logs (TELs) as ACDC State Registries"
    zoom: Z1
    line: 4259
    sentence: >
      A TEL is a hash-chained sequence of transaction events tracking Credential State for ACDCs;
      a Registry is initialized by a Registry Inception (rip) event whose SAID becomes the REGID;
      state changes are recorded via Update Events (non-blindable, publicly observable) or
      Blindable Updates (bup events using Blinded Attribute Blocks and BLID for private state
      observation by entities holding the Shared Secret Salt); the Registry operates in
      Non-Blindable or Blindable Registry Mode; TEL events are sealed in the Issuer's KEL via
      Transaction Event Seals, making Credential State verifiable by any TEL Observer.
    score: fluent
    finding_id: null

