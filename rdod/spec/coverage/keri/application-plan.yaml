    finding_ids: ["KERI-Z2-010", "KERI-Z2-008c", "KERI-Z2-008e"]
    tier: 1
    description: >
      The adopter-facing concept for recovering from key compromise.
      Collapses SupersedingRecovery, Reconciliation, Trunk, DisputedBranch,
      ReserveRotation, SQAR into one parent concept. The mechanisms become
      types underneath.
    decision: accepted  # accepted / rejected / modified

  - id: 2
    term: Controller
    domain: identity
    file: ubiquitous-language.yaml
    finding_ids: ["KERI-Z1-002"]
    tier: 1
    description: >
      Entity holding private keys for an AID. Primary protocol actor.
      Spec term used hundreds of times.
    decision: accepted

  - id: 3
    term: End-Verifiability
    domain: identity
    file: ubiquitous-language.yaml
    finding_ids: ["KERI-Z0-001"]
    tier: 1
    description: >
      The property that any Verifier can independently verify cryptographic
      control over an AID without intermediary infrastructure. KERI's
      core value proposition. Spec defines precisely at §5.3.
    decision: accepted

  - id: 4
    term: Verifier
    domain: identity
    file: ubiquitous-language.yaml
    finding_ids: ["KERI-Z1-007"]
    tier: 1
    description: >
      Role that checks event structure and signatures against Key State.
      Distinct from Validator. Spec §A.2.1.
    decision: accepted

  - id: 5
    term: Validator
    domain: identity
    file: ubiquitous-language.yaml
    finding_ids: ["KERI-Z1-007"]
    tier: 1
    description: >
      Role that first verifies, then applies policy constraints (TOAD,
      delegation) before accepting events into KEL. Spec §A.2.2.
    decision: accepted

  - id: 6
    term: Key Event
    domain: identity
    file: ubiquitous-language.yaml
    finding_ids: ["KERI-Z1-004"]
    tier: 1
    description: >
      Umbrella term for any event in a KEL — inception, rotation,
      interaction, and their delegated variants. Two classes:
      Establishment Events and Non-Establishment Events.
    decision: accepted

