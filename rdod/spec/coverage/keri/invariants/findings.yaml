  - id: KERI-INV-015
    cluster: "JIT/NTK + Replay Detection"
    domain: discovery
    rules_covered: 3
    spec_lines: [6580, 6582, 6687]
    precision: pbt-ready
    description: >
      Data MUST be verified before exchange. Proofs MUST be pre-available.
      Digest/signature copies MUST be retained for replay detection.

  # ══════════════════════════════════════════════════════════════════
  # CLUSTER E: Rotation Edge Cases (8 rules)
  # ══════════════════════════════════════════════════════════════════

  - id: KERI-INV-016
    cluster: "SQAR/Custodial Zero-Weight Keys"
    domain: identity/thresholds
    rules_covered: 2
    spec_lines: [3935, 3920]
    precision: z3-ready
    description: >
      In SQAR/custodial rotation, exposed prior-next keys MUST have weight 0
      in current signing threshold (rotation authority only, no signing).
      Post-quantum signing keys MUST be used for resultant signing authority.

  - id: KERI-INV-017
    cluster: "Dual Threshold Joint Satisfiability"
    domain: identity/key-commitment
    rules_covered: 3
    spec_lines: [3684, 3690, 3721]
    precision: z3-ready
    description: >
      Current key list MUST be satisfiable w.r.t. BOTH prior-next threshold
      AND new current threshold simultaneously. Validator MUST perform set
      operations when lists differ. Permuted key ordering must be handled.

  - id: KERI-INV-018
