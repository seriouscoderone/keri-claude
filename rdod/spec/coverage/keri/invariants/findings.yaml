    domain: accountability
    rules_covered: 3
    spec_lines: [3002, 3070, 3085]
    precision: pbt-ready
    description: >
      Witnesses MUST use only non-transferable AIDs. Non-indexed signatures
      MUST use CESR group codes. Endorsement MUST include AID + key state ref.

