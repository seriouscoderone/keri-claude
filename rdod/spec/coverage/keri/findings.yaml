  - id: KERI-Z0-001
    zoom: Z0
    spec_section: "§1 Key Event Receipt Infrastructure (KERI)"
    spec_line: 1
    score: awkward

    attempted_sentence: >
      KERI enables an adopter to establish and rotate cryptographic control
      over Autonomic Identifiers through an append-only Key Event Log,
      providing end-verifiable secure attribution without reliance on
      trusted third parties.

    problem: >
      The UL names the infrastructure (AID, KEL, Inception Event, Rotation Event)
      but not the value it delivers. "End-verifiability" — the property that any
      party can independently verify cryptographic control without relying on
      intermediary infrastructure — is KERI's defining value proposition. It appears
      50+ times across the spec (Introduction, Scope, OOBI section). "Secure
      attribution" — the ability to cryptographically attribute data to its source —
      is the practical consequence. Neither concept has a UL term.

    proposed_fix:
      domain: identity
      file: ubiquitous-language.yaml
      action: add_term
      term: End-Verifiability
      definition: >
        The property that any recipient can independently verify the
        cryptographic control authority over an AID at any point in time,
        using only the KEL and cryptographic libraries, without depending
        on any intermediary infrastructure or trusted third party. This is
        KERI's fundamental security guarantee and the basis for ambient
        verifiability.
      invariants:
        - "Verification requires only the KEL and standard cryptographic libraries"
        - "No trusted third party or intermediary infrastructure is needed"
        - "Verification is possible by anyone, anywhere, at any time (ambient)"
      related_terms: ["AID", "KEL", "Key State", "Verifier"]

    alternatives_considered:
      - name: Ambient Verifiability
        rejected_because: >
          More specific to the "anyone, anywhere, at any time" property.
          Could be a synonym rather than the primary term. The spec uses
          "end-verifiable" more frequently than "ambient."
      - name: Secure Attribution
        rejected_because: >
          This is the consequence of end-verifiability, not the property
          itself. Could be a related term or separate entry.

    simplifies:
      - "Z0 mission statement becomes fully fluent"
      - "Z1 Introduction sentences can reference the value proposition by name"
      - "OOBI section (§A.8) repeatedly says 'everything in KERI is end-verifiable' — term gives this a UL anchor"
    depends_on: []
    revisions: []

  - id: KERI-Z1-001
    zoom: Z1
    spec_section: "§2 Introduction"
    spec_line: 43
    score: gap

    attempted_sentence: >
      KERI provides an identifier system security overlay through
      Self-Certifying Identifiers as a cryptographic root-of-trust,
      formalized as Autonomic Identifiers with control provenance
      tracked in a Key Event Log.

    problem: >
      Self-Certifying Identifier (SCID) is the foundational concept from
      which AID derives. The Introduction uses it 10+ times. The spec
      defines SCID as an identifier cryptographically bound to a keypair
      at inception (self-contained unless transferred). AID is a variant
      of SCID with transferable control via KEL. The UL has AID but not
      SCID, which means the conceptual foundation is missing.

    proposed_fix:
      domain: identity
      file: ubiquitous-language.yaml
      action: add_term
      term: Self-Certifying Identifier
      synonyms: ["SCID"]
      definition: >
        An identifier that is cryptographically bound to a keypair at
        inception, requiring no external authority to establish the binding.
        The identifier is derived from the public key or a digest thereof,
        making the binding self-evident and independently verifiable.
        An AID is a variant of SCID that extends self-certification with
        transferable control provenance via a Key Event Log.
      invariants:
        - "The binding between identifier and initial keypair is self-evident from the identifier's derivation"
        - "No trusted third party is needed to establish or verify the binding"
      related_terms: ["AID", "Inception Event", "End-Verifiability"]

    alternatives_considered:
      - name: Cryptographic Root-of-Trust
        rejected_because: >
          Too generic — describes a property, not the specific identifier concept.
          SCID is the spec's own well-established term.

    simplifies:
      - "Introduction sentences become fluent"
      - "Explains the AID → SCID derivation chain"
      - "Clarifies why non-transferable AIDs exist (they are pure SCIDs)"
    depends_on: []
    revisions: []

  - id: KERI-Z1-002
    zoom: Z1
    spec_section: "§3 Scope"
    spec_line: 112
    score: awkward

    attempted_sentence: >
      KERI manages the Key State of an AID — the binding between an
      identifier, its controlling keypairs, the Controller entity, and the
      KEL that records state transitions.

    problem: >
      "Controller" is referenced in the AID definition and used extensively
      throughout the spec (the entity that holds private keys and controls
      the AID), but it is not a standalone UL term. At Z1 and Z2, nearly
      every process description needs to name the actor who initiates events,
      and "Controller" is that actor. Without it as a first-class term,
      sentences awkwardly refer to "the entity that controls the AID" or
      just "the adopter."

    proposed_fix:
      domain: identity
      file: ubiquitous-language.yaml
      action: add_term
      term: Controller
      definition: >
        The entity (or set of entities in multi-sig) that holds the private
        signing keys for an AID and is authorized to generate and sign Key Events.
        The Controller is the primary actor in the KERI protocol — the one who
        establishes, rotates, delegates, and abandons identifiers.
      invariants:
        - "A Controller MUST hold the current private signing keys for the AID"
        - "In multi-sig, the Controller is the collective set of key holders"
        - "The Controller is identified by the AID it controls, not by any external identity"
      related_terms: ["AID", "Key State", "Signing Threshold", "Event Processor"]

    alternatives_considered:
      - name: Key Holder
        rejected_because: >
          Too passive — the Controller actively manages the AID, not just holds keys.
      - name: Identity Owner
        rejected_because: >
          "Owner" implies property rights. The Controller has cryptographic
          control, which is a technical relationship, not a legal one.

    simplifies:
      - "Every Z2 workflow sentence can name the actor: 'The Controller does X through ServiceY'"
      - "Clarifies multi-sig: the Controller is the collective, not any individual"
      - "Parallels spec terminology exactly"
    depends_on: []
    revisions: []

  - id: KERI-Z1-003
    zoom: Z1
    spec_section: "§3 Scope"
    spec_line: 112
    score: awkward

    attempted_sentence: >
      KERI manages the Key State of an AID — the binding between an
      identifier, its controlling keypairs, the Controller entity, and the
      KEL that records state transitions.

    problem: >
      The Scope section describes "strong bindings" between four elements:
      identifier, keypairs, controller, and data structure (KEL). The spec
      later formalizes these as "Tetrad bindings" (§5.5.2, line 1031).
      This four-way binding is the fundamental invariant of KERI — break
      any binding and the system fails. The UL has Key State (which
      captures the keypair-to-identifier binding) but not the full
      tetrad concept.

    proposed_fix:
      domain: identity
      file: ubiquitous-language.yaml
      action: add_term
      term: Control Authority Binding
      synonyms: ["Tetrad Binding"]
      definition: >
        The cryptographically enforced four-way binding between an AID,
        its current controlling keypairs (Key State), the Controller entity
        that holds the private keys, and the KEL that records the history
        of state transitions. This binding is KERI's fundamental security
        invariant — all four elements must be consistent for the AID to
        be considered under valid control.
      invariants:
        - "The AID is derived from or anchored to the initial keypair (SCID property)"
        - "The Key State tracks the current authoritative keypairs"
        - "The KEL provides a verifiable history of all state transitions"
        - "The Controller holds the private keys corresponding to the current Key State"
      related_terms: ["AID", "Key State", "KEL", "Controller", "Self-Certifying Identifier"]

    alternatives_considered:
      - name: Tetrad Binding
        rejected_because: >
          "Tetrad" is spec jargon. The adopter concept is about establishing
          and maintaining control authority. However, keeping "Tetrad Binding"
          as a synonym preserves the spec cross-reference.
      - name: Identifier Security Binding
        rejected_because: >
          Too generic — doesn't convey the specific four-element structure.

    simplifies:
      - "Scope section becomes fluent: 'KERI maintains the Control Authority Binding for each AID'"
      - "Security analysis (attacks) can reference which binding is being attacked"
      - "Gives Z3 invariant statements a named concept to anchor against"
    depends_on: ["KERI-Z1-002"]
    revisions: []

  - id: KERI-Z1-004
    zoom: Z1
    spec_section: "§5 KERI foundational overview"
    spec_line: 391
    score: gap

    attempted_sentence: >
      The Controller manages an AID through five functions: keypair
      generation, keypair storage, Key Event generation, event signing,
      and event validation — all mediated through the Event Processor.

    problem: >
      "Key Event" as a general category — encompassing Inception Events,
      Rotation Events, Interaction Events, and their delegated variants —
      has no UL term. The UL has specific event types (Inception Event,
      Rotation Event, Establishment Event) but no umbrella term. The spec
      uses "key event" hundreds of times as a general concept.

      Additionally, "Interaction Event" (ixn) — the non-establishment event
      that anchors data to the KEL via seals — is not in the UL despite
      being one of only three core event types.

    proposed_fix:
      domain: identity
      file: ubiquitous-language.yaml
      action: add_term
      term: Key Event
      definition: >
        Any event in the Key Event Log. Key Events divide into two classes:
        Establishment Events (Inception Event, Rotation Event, and their
        delegated variants) that change Key State, and Non-Establishment
        Events (Interaction Events) that anchor data commitments without
        changing Key State. Every Key Event has a sequence number, a SAID,
        and must be signed by the current Controller.
      invariants:
        - "Every Key Event has a unique sequence number within its KEL"
        - "Every Key Event has a SAID computed over its content"
        - "Establishment Events change Key State; Non-Establishment Events do not"
      related_terms: ["KEL", "Establishment Event", "Interaction Event", "SAID"]

    proposed_fix_2:
      domain: identity
      file: ubiquitous-language.yaml
      action: add_term
      term: Interaction Event
      synonyms: ["Non-Establishment Event"]
      definition: >
        A Key Event that anchors data commitments (seals/authorizations) to
        the KEL without changing the Key State. Interaction Events allow a
        Controller to commit to external data, authorize credential operations,
        or record other verifiable commitments, all under the current Key State.
      invariants:
        - "Does NOT change Key State (signing keys, rotation keys, witness set remain the same)"
        - "Carries a seal list for data commitments"
        - "Sequence number is one greater than the prior event"
      related_terms: ["Key Event", "Establishment Event", "KEL"]

    simplifies:
      - "Every sentence that currently says 'inception, rotation, or interaction event' can say 'Key Event'"
      - "The Establishment vs Non-Establishment distinction becomes nameable"
      - "Z2 workflow sentences can describe 'the Controller generates a Key Event' without enumerating types"
    depends_on: []
    revisions: []

  - id: KERI-Z1-005
