    proposed_fix:
      domain: keri-messaging
      file: ubiquitous-language.yaml
      action: add_term
      term: Key Event Message
      definition: >
        The serialized wire-format representation of a Key Event, composed
        of the event body (KERI Field Map) plus attached signatures, witness
        receipts, and other cryptographic qualifications. A Key Event Message
        is what is transmitted; the Key Event within it is what is validated
        and stored in the KEL.
      invariants:
        - "Contains exactly one Key Event body"
        - "Includes attached signature groups (indexed or non-indexed)"
        - "May include attached receipt groups"
      related_terms: ["Key Event", "KERI Field Map", "KERI Message Types"]

    simplifies:
      - "Clarifies the event vs message distinction throughout the spec"
      - "Z3 validation rules can reference 'the Key Event within the message'"
    depends_on: ["KERI-Z1-004"]
    revisions: []

