  - id: KERI-Z1-007
    zoom: Z1
    spec_section: "§A.2 Validation"
    spec_line: 4584
    score: gap

    attempted_sentence: >
      A Verifier establishes the Key State at event issuance and checks
      structural validity plus signature verification. A Validator extends
      this with Witness receipt checks and delegation validation before
      accepting events into the KEL.

    problem: >
      Verifier and Validator are two of the most important roles in the
      KERI spec, with precise and distinct definitions (§A.2.1, §A.2.2):

      - Verifier: checks event structure (SAID, field appearance, prior
        digests) and signature validity against the Key State at issuance.
      - Validator: first acts as Verifier, then applies additional
        constraints (witnessing, delegation) before accepting into KEL.

      The UL has "Event Processor" (identity domain) which partially
      overlaps with Validator but conflates the two-stage process. The
      spec's distinction is important because: (a) a Verifier can operate
      without a full KEL (just needs the inception event for non-transferable
      AIDs), (b) Validation is the gateway to KEL acceptance, and
      (c) different roles (witness, watcher, controller) may verify
      without fully validating.

    proposed_fix:
      domain: identity
      file: ubiquitous-language.yaml
      action: add_term
      term: Verifier
      definition: >
        A component or role that cryptographically verifies an event's
        structure and signatures. Verification includes: checking the event's
        SAID, validating field structure, confirming prior event digest chain,
        and verifying signatures against the Key State at the time of issuance.
        A Verifier establishes control authority but does not accept events
        into the KEL.
      invariants:
        - "Must determine the controlling Key State at the time of event issuance"
        - "For non-transferable AIDs, only the Inception Event is needed"
        - "For transferable AIDs, the complete sequence of Establishment Events is needed"
      related_terms: ["Validator", "Key State", "Establishment Event"]

    proposed_fix_2:
      domain: identity
      file: ubiquitous-language.yaml
      action: add_term
      term: Validator
      definition: >
        A component or role that determines whether a verified event should
        be accepted into the KEL. A Validator first acts as a Verifier
        (structural and signature checks), then applies additional constraints:
        witness receipt sufficiency (TOAD), delegation authorization, and
        any other policy rules. Validation is the gateway to KEL acceptance.
      invariants:
        - "Must first verify the event (act as Verifier)"
        - "Must check witness receipt threshold (TOAD) for witnessed identifiers"
        - "Must check delegation authorization for delegated identifiers"
        - "Acceptance into KEL is the final act of successful validation"
      related_terms: ["Verifier", "KEL", "TOAD", "Event Processor"]

    simplifies:
      - "Z2 workflow sentences can distinguish who does what: 'Verifier checks, Validator accepts'"
      - "Z3 validation rules can reference the correct role"
      - "Annex A (§A.2-A.4) becomes describable — currently the largest gap"
      - "Event Processor can be defined in terms of Validator (it IS the Validator implementation)"
    depends_on: []
    revisions: []

  - id: KERI-Z1-008
    zoom: Z1
    spec_section: "§A.9 BADA"
    spec_line: 6615
    score: awkward

    attempted_sentence: >
      The BADA policy governs data acceptance: KEL-anchored updates have
      highest trust, Endpoint Authorization tracks authorized service
      endpoints per Role, and the First-Seen Rule provides monotonic
      data acceptance.

    problem: >
      BADA distinguishes two update categories with different trust levels:
      (1) KEL-anchored updates — data changes sealed to the KEL via an
      Interaction Event, providing full auditability, and (2) signed-but-
      not-anchored updates — signed by the Controller but not sealed to
      the KEL, providing authentication without auditability. The UL has
      BADA as a term but doesn't name these two categories, which are
      central to BADA's trust model.

    proposed_fix:
      domain: discovery
      file: ubiquitous-language.yaml
      action: add_term
      term: Anchored Update
      synonyms: ["KEL-Anchored Update"]
      definition: >
        A data update that is committed to the Controller's KEL via an
        Interaction Event seal, providing both authentication (signed by
        Controller) and auditability (recorded in the append-only log).
        Anchored updates have the highest trust level under BADA policy.
      invariants:
        - "Must be sealed to the KEL via an Interaction Event"
        - "Supersedes any prior signed-only update for the same data"
      related_terms: ["BADA", "Interaction Event", "Signed Update"]

    proposed_fix_2:
      domain: discovery
      file: ubiquitous-language.yaml
      action: add_term
      term: Signed Update
      synonyms: ["Signed-Not-Anchored Update"]
      definition: >
        A data update signed by the Controller but not committed to the KEL.
        Provides authentication but not auditability. Under BADA policy,
        signed updates are accepted when no anchored update exists, but are
        superseded by any anchored update.
      invariants:
        - "Must be signed by a current or prior Controller Key State"
        - "Superseded by any Anchored Update for the same data"
      related_terms: ["BADA", "Anchored Update", "Key State"]

    simplifies:
      - "BADA rules become statable: 'An Anchored Update supersedes any Signed Update'"
      - "OKEA endpoint authorization becomes clearer at Z3"
    depends_on: ["KERI-Z1-004"]
    revisions: []

