    spec_section: "§A.8.5 RUN off the CRUD"
    spec_line: 6769
    score: gap
    route: ul_term
    route_domain: discovery
    problem: >
      RUN (Read, Update, Nullify) is the peer-to-peer data management paradigm
      replacing CRUD. No Create (only Update of vacuous records), no Delete
      (only Nullify — mark invalid without erasing). This underpins all BADA
      data management. An operator running KERI infrastructure operates
      within this paradigm.
    proposed_terms: ["RUN"]
    depends_on: []

