# verification.yaml
domain_ref: "accountability/consensus"

# Verification properties are language-agnostic invariants.
# Code examples use Python/pytest syntax for illustration — implementations
# in other languages should express equivalent assertions in their native testing framework.

properties:
  # KAWA Consensus invariants
  - invariant: "An event MUST be accepted as fully witnessed when verified_witness_receipts >= TOAD AND TOAD > 0 AND TOAD <= len(witnesses). If any of these three conditions fails, the event MUST NOT transition to accepted."
    term: "Accountability Threshold"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        toad, receipts, n_witnesses = Ints('toad receipts n_witnesses')
        accepted = Bool('accepted')
        s = Solver()
        s.add(accepted == And(receipts >= toad, toad > 0, toad <= n_witnesses))
        # Prove: if accepted, then all three conditions hold
        s.add(accepted)
        s.add(Or(receipts < toad, toad <= 0, toad > n_witnesses))
        assert s.check() == unsat
    notes: "Three-part conjunction: receipt count, TOAD positivity, TOAD within witness list bounds."

  # TOAD Boundary Conditions
  - invariant: "If TOAD == 0 AND witness list is non-empty, the configuration MUST be rejected as invalid. TOAD == 0 is only valid when the witness list is also empty (unwitnessed identifier)."
    term: "Accountability Threshold"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(witnesses=st.lists(st.from_type(AID), min_size=0, max_size=10),
               toad=st.just(0))
        def test_toad_zero_boundary(witnesses, toad):
            if len(witnesses) > 0:
                assert not is_valid_toad_config(toad, witnesses), (
                    f"TOAD=0 with {len(witnesses)} witnesses MUST be invalid"
                )
            else:
                assert is_valid_toad_config(toad, witnesses), (
                    "TOAD=0 with empty witness list is valid (unwitnessed)"
                )
    strategy: "st.lists of witnesses (0..10), TOAD fixed at 0"
    notes: "TOAD=0 + non-empty witnesses = invalid. TOAD=0 + empty witnesses = valid unwitnessed identifier."

  - invariant: "If TOAD > len(witnesses), the configuration MUST be rejected as invalid — it is impossible to collect more receipts than there are witnesses."
    term: "Accountability Threshold"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        toad, n_witnesses = Ints('toad n_witnesses')
        valid_config = Bool('valid_config')
        s = Solver()
        s.add(n_witnesses >= 0)
        s.add(valid_config == And(
            Implies(n_witnesses > 0, And(toad >= 1, toad <= n_witnesses)),
            Implies(n_witnesses == 0, toad == 0)
        ))
        # Prove: TOAD > witnesses is always invalid
        s.add(toad > n_witnesses, n_witnesses > 0, valid_config)
        assert s.check() == unsat
    notes: "TOAD cannot exceed witness count. Over-threshold = structurally impossible to satisfy."

  # First-seen Rule invariants
  - invariant: "Once a witness receipts event E at (prefix, sn), that witness MUST NOT receipt a different event E' at the same (prefix, sn) where E'.said != E.said. The first-seen event is permanent for that witness at that location."
    term: "First-seen Rule"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(witness=witness_strategy(),
               aid=aid_strategy(),
               sn=st.integers(min_value=0, max_value=1000),
               event1=key_event_strategy(),
               event2=key_event_strategy())
        def test_first_seen_immutability(witness, aid, sn, event1, event2):
            assume(event1.said != event2.said)
            # First event is accepted
            result1 = witness.process_event(aid, sn, event1)
            assert result1.is_accepted()
            # Different event at same location MUST be rejected
            result2 = witness.process_event(aid, sn, event2)
            assert result2.is_rejected(), (
                f"Witness MUST NOT accept different event at ({aid}, {sn}) "
                f"after first-seeing {event1.said}"
            )
    strategy: "witness, aid, sn, two distinct events"
    notes: "First seen, always seen, never unseen. Exception: superseding recovery rotation."

  - invariant: "If the same event (identical SAID) is resubmitted to a witness at the same (prefix, sn), the witness MUST treat it as idempotent — not an error, not duplicity. The witness returns success or already-seen, never rejection."
    term: "First-seen Rule"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(witness=witness_strategy(),
               aid=aid_strategy(),
               sn=st.integers(min_value=0, max_value=1000),
               event=key_event_strategy())
        def test_duplicate_receipt_idempotent(witness, aid, sn, event):
            result1 = witness.process_event(aid, sn, event)
            assert result1.is_accepted()
            # Same event resubmitted — idempotent, not an error
            result2 = witness.process_event(aid, sn, event)
            assert result2.is_accepted() or result2.is_already_seen(), (
                "Duplicate receipt of same event MUST be idempotent"
            )
            assert not result2.is_rejected(), (
                "Duplicate receipt of same event MUST NOT be rejected"
            )
    strategy: "witness, aid, sn, single event submitted twice"
    notes: "Receipts are idempotent — duplicate receipt from same witness is ignored, not an error."

  # Witness Receipt Accumulation invariants
  - invariant: "Witness receipts accumulate toward the TOAD threshold. For each unique witness that provides a valid receipt for event E at (prefix, sn), the receipt count increments by exactly 1. Duplicate receipts from the same witness MUST NOT increment the count."
    term: "Accountability Threshold"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(witnesses=st.lists(witness_strategy(), min_size=1, max_size=10, unique_by=lambda w: w.aid),
               event=key_event_strategy())
        def test_receipt_accumulation(witnesses, event):
            receipt_set = set()
            for witness in witnesses:
                receipt = witness.create_receipt(event)
                receipt_set.add(receipt.witness_aid)
                assert len(receipt_set) == len(set(r for r in receipt_set))
            # Each unique witness contributes exactly 1
            assert len(receipt_set) == len(witnesses)
            # Submitting same witness receipt again does not increase count
            duplicate_receipt = witnesses[0].create_receipt(event)
            receipt_set.add(duplicate_receipt.witness_aid)
            assert len(receipt_set) == len(witnesses), (
                "Duplicate witness receipt MUST NOT increment count"
            )
    strategy: "st.lists of unique witnesses, single event"
    notes: "Receipt set uses witness AID as key — duplicates are absorbed, count is stable."

  # Immune Constraint invariants
  - invariant: "The immune constraint is expressed as: M > (N + F + 1) / 2 where M is the accountability threshold, N is the total witness count, and F is the number of faulty witnesses (F < M). When satisfied, the service MUST NOT produce multiple divergent proper KERLs."
    term: "Immune Constraint"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        M, N, F = Ints('M N F')
        immune = Bool('immune')
        s = Solver()
        s.add(M > 0, N > 0, F >= 0, F < M)
        s.add(immune == (M > (N + F + 1) / 2))
        # When immune, two proper KERLs cannot diverge
        kerl_a_receipts, kerl_b_receipts = Ints('kerl_a_receipts kerl_b_receipts')
        s.add(immune)
        s.add(kerl_a_receipts >= M, kerl_b_receipts >= M)
        # Prove overlap: sum of receipts exceeds N + F, so at least one honest witness in common
        s.add(kerl_a_receipts + kerl_b_receipts <= N + F)
        assert s.check() == unsat  # Cannot have two M-receipt sets without honest overlap
    notes: "Z3 verifies the pigeonhole argument — two quorum-sized sets must share an honest witness."

  - invariant: "When the immune constraint is satisfied, for any two proper KERLs kerl_a and kerl_b verified by the same witness set under the same threshold, kerl_a MUST equal kerl_b at every common sequence number."
    term: "Immune Constraint"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        M, N, F = Ints('M N F')
        s = Solver()
        s.add(M > 0, N > 0, F >= 0, F < M)
        s.add(M > (N + F + 1) / 2)
        # Two proper KERLs each have >= M receipts
        # By pigeonhole, at least one honest witness receipted both
        # An honest witness applies first-seen, so cannot receipt two different events at same sn
        # Therefore the two KERLs must agree at every sn
        overlap = Int('overlap')
        s.add(overlap >= 2 * M - N)  # minimum overlap by pigeonhole
        s.add(overlap <= 0)  # try to find zero overlap
        assert s.check() == unsat  # overlap must be > 0
    notes: "The core immunity theorem — under the constraint, proper KERLs cannot diverge."

  # BFT Quorum invariants
  - invariant: "For n witnesses, the ample() function computes the minimum accountability threshold as: ceil((n + 1 + floor((n-1)/3)) / 2) for n > 0, and 0 for n == 0. This ensures any two quorum-sized subsets of witnesses share at least one honest member."
    term: "BFT Quorum"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(n=st.integers(min_value=0, max_value=1000))
        def test_ample_formula(n):
            expected = math.ceil((n + 1 + (n - 1) // 3) / 2) if n > 0 else 0
            assert ample(n) == expected, (
                f"ample({n}) = {ample(n)}, expected {expected}"
            )
    strategy: "st.integers(min_value=0, max_value=1000)"
    notes: "Cross-check ample() against the BFT formula for all reasonable witness counts."

  - invariant: "For any n >= 1, the quorum size m = ample(n) MUST satisfy: 1 <= m <= n. For n == 0, m MUST be 0."
    term: "BFT Quorum"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        n = Int('n')
        m = Int('m')
        s = Solver()
        s.add(n >= 1)
        s.add(m == (n + 1 + (n - 1) / 3 + 1) / 2)  # ceiling approx
        s.add(Or(m < 1, m > n))
        assert s.check() == unsat  # m is always in [1, n]
    notes: "Quorum size is always at least 1 and at most n."

  - invariant: "For any two quorum-sized subsets A, B of an n-witness set where |A| >= ample(n) and |B| >= ample(n), the intersection |A intersect B| MUST be >= 1. This is the quorum overlap property."
    term: "BFT Quorum"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        N, m, size_a, size_b, overlap = Ints('N m size_a size_b overlap')
        s = Solver()
        s.add(N >= 1)
        s.add(m >= 1, m <= N)
        s.add(size_a >= m, size_b >= m)
        s.add(size_a <= N, size_b <= N)
        # By inclusion-exclusion: overlap >= size_a + size_b - N
        s.add(overlap == size_a + size_b - N)
        # With m > N/2 (which ample guarantees for f=0), overlap > 0
        s.add(m > N / 2)
        s.add(overlap <= 0)
        assert s.check() == unsat  # overlap must be positive
    notes: "The quorum overlap property — any two quorum-sized subsets must share at least one member."

contracts:
  - port_ref: "port://accountability/consensus/inbound/quorum-evaluation"
    preconditions:
      - formal:
          language: python
          expression: "lambda witness_count: isinstance(witness_count, int) and witness_count >= 0"
        description: "Witness count must be a non-negative integer"
      - formal:
          language: python
          expression: |
            lambda m, n, f: (
                isinstance(m, int) and isinstance(n, int) and isinstance(f, int)
                and m >= 0 and n >= 0 and f >= 0 and f < n
            )
        description: "check_immune inputs must be non-negative integers with f < n"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda witness_count, result: (
                result == 0 if witness_count == 0
                else (1 <= result <= witness_count)
            )
        description: "compute_ample returns 0 for 0 witnesses, else a value in [1, witness_count]"
      - formal:
          language: python
          expression: |
            lambda m, n, f, result: (
                result == True if (m > (n + f + 1) / 2 and f < m)
                else result == False
            )
        description: "check_immune returns true iff the immune constraint is satisfied"

  - port_ref: "port://accountability/consensus/inbound/first-seen-check"
    preconditions:
      - formal:
          language: python
          expression: |
            lambda witness_id, aid, sn: (
                witness_id is not None
                and aid is not None
                and isinstance(sn, int)
                and sn >= 0
            )
        description: "Witness ID and AID must be valid identifiers, sequence number must be non-negative integer"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda witness_id, aid, sn, event_said, result: (
                result.is_accepted() implies (
                    not witness_has_first_seen_before(witness_id, aid, sn)
                    or witness_first_seen(witness_id, aid, sn) == event_said
                )
            )
        description: "apply_first_seen succeeds only if no prior first-seen exists at (aid, sn) or the same event is resubmitted (idempotent)"
      - formal:
          language: python
          expression: |
            lambda witness_id, aid, sn, event_said, result: (
                result.is_rejected() implies (
                    witness_has_first_seen(witness_id, aid, sn)
                    and witness_first_seen(witness_id, aid, sn) != event_said
                )
            )
        description: "apply_first_seen rejects iff a DIFFERENT event is already first-seen at that (aid, sn)"

state_machines:
  - name: "first-seen-lifecycle"
    term: "First-seen Rule"
    states: ["unseen", "first-seen", "receipted", "accountable"]
    transitions:
      - from: "unseen"
        to: "first-seen"
        trigger: "apply_first_seen(witness_id, aid, sn, event_said)"
        guard: "No prior event at (aid, sn) for this witness"
      - from: "first-seen"
        to: "first-seen"
        trigger: "apply_first_seen(witness_id, aid, sn, same_event_said)"
        guard: "event_said == first_seen_said — idempotent resubmission, no state change"
      - from: "first-seen"
        to: "receipted"
        trigger: "EventReceipted — witness signs and stores the receipt"
        guard: "Event signatures verified and consistent with prior KEL"
      - from: "receipted"
        to: "accountable"
        trigger: "AccountabilityThresholdMet — verified_receipts >= TOAD AND TOAD > 0 AND TOAD <= len(witnesses)"
        guard: "receipt_count >= accountability_threshold"
    invariants:
      - "Once in first-seen, the event SAID at (aid, sn) MUST NOT change (except via superseding recovery rotation)"
      - "Transitions are irreversible under normal operation — no backtracking from receipted to first-seen"
      - "The accountable state means verified_receipts >= TOAD — the controller accepts accountability"
      - "A different event at the same (aid, sn) MUST be rejected, not queued or escrowed"
      - "Duplicate receipt of the same event is idempotent — absorbed without state transition or error"
    initial_state: "unseen"
    terminal_states: ["accountable"]
