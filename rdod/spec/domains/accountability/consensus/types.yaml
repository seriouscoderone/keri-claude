domain_ref: "accountability/consensus"

types:
  - name: "Receipt"
    description: "A witness's signed acknowledgment that a specific event was first-seen and accepted. The receipt message body (rct) identifies the receipted event via {v, t, d, i, s}. Witness signatures are CESR attachments, not body fields — each witness signs the referenced event (not the receipt body) and its signature index corresponds to its position in the effective witness list."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the identifier whose event was receipted (i field)"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the receipted event (s field)"
          - name: "said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the receipted event (d field)"
          - name: "witness_indexed_signatures"
            type: "array[types://cesr/primitives#IndexedSignature]"
            required: true
            description: "Indexed signatures from witnesses — each signature's index is the witness's position in the effective witness list. Witnesses are non-transferable but use indexed signatures (Indexed Signature), not unindexed (Unindexed Signature)."
        invariants:
          - "Witnesses MUST be non-transferable AIDs — transferable AIDs MUST NOT appear in the witness list"
          - "Each witness signature's index corresponds to its position in the effective witness list at the receipted event's key state"
          - "Signatures are on the referenced key event's serialization, NOT on the receipt body"
          - "The receipted event must have been first-seen by the witness before signing"
          - "A receipt is immutable once issued — first seen, always seen, never unseen"
          - "Duplicate receipts (same witness, same event SAID) are absorbed idempotently"
          - "Non-witness receipts from non-transferable identifiers use unindexed signatures (Unindexed Signature couples) — handled by accountability/receipting, not consensus"

  - name: "QuorumRequest"
    description: "Input for quorum evaluation — the numeric parameters needed to compute BFT thresholds and check immune constraints."
    variants:
      - name: "default"
        fields:
          - name: "witness_count"
            type: "integer"
            required: true
            description: "Total number of designated witnesses for the identifier"
            constraints:
              min: 0
          - name: "proposed_toad"
            type: "integer"
            required: true
            description: "The proposed accountability threshold (TOAD) to evaluate"
            constraints:
              min: 0
        invariants:
          - "witness_count must be a non-negative integer"
          - "proposed_toad must be a non-negative integer"

  - name: "QuorumResult"
    description: "Outcome of quorum evaluation — whether the proposed TOAD satisfies BFT immunity, plus the computed ample threshold for reference."
    variants:
      - name: "default"
        fields:
          - name: "ample_threshold"
            type: "integer"
            required: true
            description: "The BFT-safe minimum threshold computed from witness_count via ample(n)"
          - name: "immune"
            type: "boolean"
            required: true
            description: "Whether the proposed TOAD satisfies the immune constraint (TOAD > (N + F + 1) / 2 with F < TOAD)"
          - name: "valid"
            type: "boolean"
            required: true
            description: "Whether the proposed TOAD is structurally valid (0 < TOAD <= witness_count for witnessed identifiers, or TOAD == 0 for unwitnessed)"
        invariants:
          - "ample_threshold == 0 when witness_count == 0, else 1 <= ample_threshold <= witness_count"
          - "immune == true implies valid == true (an immune configuration is always structurally valid)"
          - "valid == false when proposed_toad > witness_count or when proposed_toad == 0 with witness_count > 0"

  - name: "FirstSeenQuery"
    description: "Input for checking whether an event at a given (aid, sn) has already been first-seen. Provides the full event identity triple."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The identifier prefix"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the event to check"
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the candidate event"
        invariants:
          - "The triple (aid, sn, event_said) uniquely identifies an event"
          - "If no event at (aid, sn) has been first-seen, the event is new"
          - "If an event at (aid, sn) has been first-seen with the SAME said, the check is idempotent"
          - "If an event at (aid, sn) has been first-seen with a DIFFERENT said, this raises FirstSeenConflictError"

  - name: "AlreadySeen"
    description: "Result when a witness or validator has already first-seen an event at the given sequence number."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The identifier prefix"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number that was already occupied"
          - name: "first_seen_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the event that was first-seen at this (aid, sn)"
        invariants:
          - "Any new event at the same (aid, sn) with a different SAID is rejected"
          - "The first-seen record is immutable once written"
