# ports.yaml
domain_ref: "accountability/consensus"

ports:
  # Inbound — what clients call
  - id: "port://accountability/consensus/inbound/quorum-evaluation"
    type: inbound
    name: "Quorum Evaluation"
    description: >
      Pure computation: given a witness count and proposed TOAD, compute the BFT-safe ample
      threshold and evaluate whether the proposed TOAD satisfies the immune constraint.
      No identifier lookup — caller provides numeric inputs directly.
    semantics: query
    idempotent: true
    contract:
      input: "types://accountability/consensus#QuorumRequest"
      output: "types://accountability/consensus#QuorumResult"
      errors:
        - "errors://accountability/consensus#InsufficientWitnessesError"
        - "errors://accountability/consensus#TOADExceedsWitnessCountError"
    refs: ["domain://accountability"]

  - id: "port://accountability/consensus/inbound/first-seen-check"
    type: inbound
    name: "First-seen Check"
    description: >
      Guard: When a second event at the same (aid, sn) arrives with a different SAID, check
      superseding rules (A0-C1) before accepting — superseding creates a fork, not a first-seen
      override. Idempotency refinement: same SAID is idempotent (accumulate signatures, no state
      change to event status); different SAID is non-idempotent (may trigger duplicity detection
      or superseding evaluation).
    semantics: command
    idempotent: false
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://accountability/consensus#AlreadySeen"
      errors:
        - "errors://accountability/consensus#FirstSeenConflictError"
    refs: ["domain://accountability"]
