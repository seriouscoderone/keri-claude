# ports.yaml
domain_ref: "accountability/consensus"

ports:
  # Inbound — what clients call
  - id: "port://accountability/consensus/inbound/quorum-evaluation"
    type: inbound
    name: "Quorum Evaluation"
    semantics: query
    idempotent: true
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://accountability/consensus#AlreadySeen"
      errors:
        - "errors://accountability/consensus#InsufficientWitnessesError"
        - "errors://accountability/consensus#TOADExceedsWitnessCountError"
    refs: ["domain://accountability"]

  - id: "port://accountability/consensus/inbound/first-seen-check"
    type: inbound
    name: "First-seen Check"
    semantics: command
    idempotent: false
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://accountability/consensus#AlreadySeen"
      errors:
        - "errors://accountability/consensus#FirstSeenConflictError"
      guard: "When a second event at the same (aid, sn) arrives with a different SAID, check superseding rules (A0-C1) before accepting — superseding creates a fork, not a first-seen override"
      idempotency_refinement:
        same_said: "Idempotent — accumulate signatures, no state change to event status"
        different_said: "Non-idempotent — may trigger duplicity detection or superseding evaluation"
    refs: ["domain://accountability"]
