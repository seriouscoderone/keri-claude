# domain.yaml

template_version: "2.0"

id: "accountability"

name: "KERI Accountability"

description: >
  Others can verify your identity claims through witness receipting, consensus, and dissemination.
  KERI's Algorithm for Witness Agreement (KAWA) — a Byzantine Fault Tolerant agreement
  algorithm that uses a designated set of N witnesses to provide highly available, consistent
  promulgation of an AID's key event history. Unlike multi-phase BFT consensus, KAWA uses
  single-phase agreement because the controller is the sole source of truth for event creation.
  Witnesses verify, receipt (sign), store, and disseminate events under the first-seen rule.
  The controller designates a threshold M of N witnesses for accountability, ensuring that
  at most one sufficient agreement exists despite faulty witnesses. The resulting Key Event
  Receipt Log (KERL) is the receipted form of the KEL used in indirect mode.

  Boundary guide — accountability vs witness-service: accountability defines the PROTOCOL
  RULES (first-seen policy, KAWA consensus, TOAD thresholds, receipt semantics).
  witness-service defines the DEPLOYED INFRASTRUCTURE (HTTP endpoint, storage, receipt
  generation). Accountability says "what a witness must do." Witness-service says "how to
  run one." An implementor building witness logic reads accountability. An operator deploying
  a witness reads witness-service.

  File guide — errors live in child subdomains (receipting, consensus,
  dissemination). No protocols.yaml because cross-domain flows that involve
  accountability (e.g., witness receipt collection) are defined in
  identity/protocols.yaml where those flows originate.

version: "0.1.0"
tier: "domain"

source_material:
  - type: document
    reference: "keri-specification.md — sections: KERI's Algorithm for Witness Agreement (KAWA), Witness Designation, Witnessing Policy, Immunity and Availability, Security Properties"
  - type: document
    reference: "KERI_WP_2.x.web.md — sections: KAWA, Witnesses, Indirect Mode, KERL"
  - type: document
    reference: "KERI_SecurityDeepDive.web.md — sections: KERI Ecosystem Components, Witnesses and Watchers, Ambient Verifiability"
  - type: implementation
    reference: "keripy — src/keri/core/coring.py (Toader), src/keri/core/eventing.py (ample())"
  - type: implementation
    reference: "keriox — keriox_core/src/event/sections/threshold.rs (tally), components/witness/src/"

published_language:
  - term: "Witness"
    description: "Designated accountability node — referenced by service and accountability domains"
  - term: "Witness Threshold Check"
    description: "Validation step checking if witness receipt count meets TOAD"

domain_clients:
  - ref: "domain://identity"
    relationship: "Parent domain drives witness receipting and consensus for indirect mode"
    via_port: "port://accountability/inbound/receipting"

subdomains:
  - ref: "domain://accountability/consensus"
    relationship: "Mathematical and algorithmic foundations — first-seen rule, immune constraint, accountability thresholds, proper KERL properties, BFT quorum calculations"
  - ref: "domain://accountability/receipting"
    relationship: "Receipt lifecycle — receipt creation, receipt types, receipt escrows, witness receipt generator, KERL as receipted KEL"
  - ref: "domain://accountability/dissemination"
    relationship: "Event and receipt propagation — round-robin and gossip protocols, witness designation, witnessing policy, direct/indirect operational modes"

kernels:
  - ref: "kernel://cesr"
    source: "domain://cesr"
    relationship: "CESR primitives (Cigar, Siger, Verfer, AID) adopted natively for receipt signatures and witness identification"
  - ref: "external://cryptographic-primitives"
    source: "Ed25519 (witness receipt signatures), Blake3-256/SHA-256 (event verification)"
    relationship: "Witness receipt signatures and event digest verification use kernel cryptographic types directly"

adjacents: []

externals:
  - name: "Network Transport"
    abstraction: "Adapter"
    ref: "port://accountability/outbound/transport"
    implementation_notes: "Message delivery for events, receipts, and gossip between controller, witnesses, and validators. Implementations: HTTP, TCP, WebSocket, round-robin, gossip protocol"

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    This domain orchestrates three subdomains: consensus (rules and quorum math),
    receipting (receipt creation/storage/escrow), and dissemination (network propagation).
    KAWA is implemented by the witness component. In keripy, witnessing is handled by the
    Witness class and the receipting logic in Kevery. In keriox, the witness component lives
    under components/witness/. The TOAD (Toader in keripy, tally in keriox) bridges all
    three subdomains — it is the accountability threshold that consensus validates,
    receipting counts against, and dissemination targets.

issues: []

tags: ["witness", "consensus", "bft", "receipt", "availability", "indirect-mode"]
