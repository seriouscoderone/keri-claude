# verification.yaml
domain_ref: "accountability/dissemination"

properties:
  - invariant: "Round-robin dissemination MUST complete in at most 2*N exchanges where N is the number of witnesses; for N=1 the maximum is 2 exchanges; for N=0 (direct mode) no exchanges occur"
    term: "Round-robin Dissemination"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        N, exchanges = Ints('N exchanges')
        s = Solver()
        s.add(N >= 0)
        s.add(exchanges >= 0)
        s.add(exchanges <= 2 * N)
        # Boundary: N=0 means 0 exchanges
        s2 = Solver()
        s2.add(N == 0, exchanges > 0, exchanges <= 2 * N)
        assert s2.check() == unsat
        # Boundary: N=1 means at most 2 exchanges
        s3 = Solver()
        s3.add(N == 1, exchanges > 2, exchanges <= 2 * N)
        assert s3.check() == unsat
    notes: "Upper bound on round-robin exchanges is 2*N. Boundary: N=0 means zero exchanges, N=1 means at most 2."

  - invariant: "For any witness count N >= 1, the total number of round-robin exchanges MUST be <= 2*N; for gossip, the total bandwidth MUST be <= N * ceil(log2(N+1)); gossip bandwidth MUST exceed round-robin bandwidth for N < 4"
    term: "Round-robin Dissemination"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(n=st.integers(min_value=1, max_value=100))
        def test_exchange_bounds(n):
            rr_exchanges = simulate_round_robin(n)
            assert rr_exchanges <= 2 * n, (
                f"Round-robin for {n} witnesses: {rr_exchanges} exchanges exceeds 2*{n}={2*n}"
            )
            gossip_bw = simulate_gossip_bandwidth(n)
            assert gossip_bw <= n * math.ceil(math.log2(n + 1)), (
                f"Gossip for {n} witnesses: {gossip_bw} exceeds N*log(N+1) bound"
            )
    strategy: "st.integers(1..100) for witness count"
    notes: "Both strategies have provable upper bounds. Gossip trades bandwidth for lower latency at large N."

  - invariant: "Witnesses MUST be designated by the controller in the b field of an establishment event signed by the controller; a witness AID MUST NOT appear in the b field without the controller's signature; the b field MUST be a list of unique non-transferable AIDs"
    term: "Witness Designation"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(est_event=establishment_event_strategy())
        def test_witness_designation_requires_controller_sig(est_event):
            assert est_event.signed_by_controller(), (
                "Establishment event with witness list must be controller-signed"
            )
            assert est_event.b is not None
            # All witness AIDs must be non-transferable (B prefix)
            for w_aid in est_event.b:
                assert w_aid.startswith('B'), (
                    f"Witness AID {w_aid} must be non-transferable (B prefix)"
                )
            # Uniqueness
            assert len(est_event.b) == len(set(est_event.b)), "Witness AIDs must be unique"
    strategy: "establishment_event_strategy()"
    notes: "Witness presence in the b field requires controller signature — self-designation is impossible."

  - invariant: "The SAID of the establishment event cryptographically commits to the witness list; modifying the b field (adding, removing, or reordering witnesses) MUST produce a different SAID"
    term: "Witness Designation"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(est_event=establishment_event_strategy())
        def test_witness_list_committed_by_said(est_event):
            original_said = est_event.said
            # Tamper with witness list
            modified = copy(est_event)
            if len(modified.b) > 0:
                modified.b = modified.b[1:]  # Remove a witness
            else:
                modified.b = [generate_witness_aid()]  # Add a witness
            modified_said = compute_said(modified)
            assert original_said != modified_said, (
                "Modifying the witness list must change the SAID"
            )
    strategy: "establishment_event_strategy()"
    notes: "The SAID commits to the witness list — any modification is detectable."

  - invariant: "When a witness accepts a first-seen event, it MUST atomically perform all three actions: sign a receipt, store the event, and acknowledge receipt to the controller; if any action fails, none of the three MUST persist"
    term: "Witnessing Policy"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(event=valid_key_event_strategy())
        def test_witnessing_atomicity(event):
            witness = create_witness()
            result = witness.accept(event)
            if result.is_ok():
                assert result.receipt_signed, "Accepted event must have signed receipt"
                assert witness.has_stored(event), "Accepted event must be stored"
                assert result.acknowledged, "Accepted event must be acknowledged"
            else:
                # All-or-nothing: if acceptance failed, nothing persists
                assert not witness.has_stored(event), "Failed acceptance must not store event"
    strategy: "valid_key_event_strategy()"
    notes: "Atomic witnessing: all three actions (sign, store, acknowledge) succeed or none persist."

  - invariant: "Direct mode (bt == 0 and len(b) == 0): no witnesses are required; controller events are accepted without receipts; the controller is solely responsible for event dissemination"
    term: "Direct Mode"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(config=mode_config_strategy())
        def test_direct_mode_no_witnesses(config):
            if config.mode == 'direct':
                assert len(config.witnesses) == 0, "Direct mode must have zero witnesses"
                assert config.bt == 0, "Direct mode must have bt == 0"
    strategy: "mode_config_strategy() filtered for direct mode"
    notes: "Direct mode is defined by the absence of witnesses and a zero accountability threshold."

  - invariant: "Indirect mode: MUST have len(b) >= 1 witnesses AND bt >= 1 (accountability threshold); bt MUST be <= len(b); configuring indirect mode with zero witnesses or zero threshold MUST be rejected"
    term: "Indirect Mode"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(n_witnesses=st.integers(min_value=0, max_value=10),
               bt=st.integers(min_value=0, max_value=10))
        def test_indirect_mode_requirements(n_witnesses, bt):
            if n_witnesses >= 1 and bt >= 1 and bt <= n_witnesses:
                config = build_indirect_config(n_witnesses, bt)
                assert config.mode == 'indirect'
            else:
                with pytest.raises(ValidationError):
                    build_indirect_config(n_witnesses, bt)
    strategy: "st.integers for witness count and threshold"
    notes: "Indirect mode requires at least one witness and a positive threshold not exceeding witness count."

contracts:
  - port_ref: "port://accountability/dissemination/inbound/event-propagation"
    preconditions:
      - formal:
          language: python
          expression: "lambda event, receipts, witnesses, strategy: event.valid() and len(witnesses) > 0 and strategy in ('round_robin', 'gossip')"
        description: "Event must be valid, at least one witness endpoint, and a recognized dissemination strategy"
    postconditions:
      - formal:
          language: python
          expression: "lambda report: report.witnesses_contacted >= 1 and report.strategy_applied in ('round_robin', 'gossip')"
        description: "At least one witness was contacted and the chosen strategy was applied"
      - formal:
          language: python
          expression: "lambda aid, sn, result: len(result.witnesses) >= 0 and result.tally >= 0 and result.tally <= len(result.witnesses)"
        description: "get_witness_set returns a valid witness list and tally within bounds"

  - port_ref: "port://accountability/dissemination/inbound/witness-management"
    preconditions:
      - formal:
          language: python
          expression: "lambda witnesses, tally: len(witnesses) > 0 and tally >= 1 and tally <= len(witnesses)"
        description: "At least one witness, and tally must be between 1 and witness count"
    postconditions:
      - formal:
          language: python
          expression: "lambda config: len(config.witnesses) > 0 and config.tally <= len(config.witnesses) and config.tally >= 1"
        description: "Returned config has a non-empty witness set and a valid tally"
      - formal:
          language: python
          expression: "lambda prune, graft, new_tally, config: all(w not in config.witnesses for w in prune) and all(w in config.witnesses for w in graft)"
        description: "After amend_witnesses, pruned witnesses are absent and grafted witnesses are present"

  - port_ref: "port://accountability/dissemination/outbound/transport"
    preconditions:
      - formal:
          language: python
          expression: "lambda endpoint, event: endpoint is not None and event.valid()"
        description: "Transport endpoint must be non-null and event must be structurally valid"
    postconditions:
      - formal:
          language: python
          expression: "lambda result: result.is_ok() or result.is_transport_error()"
        description: "Transport operations either succeed or return a transport-specific error"
