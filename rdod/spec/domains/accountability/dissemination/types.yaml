domain_ref: "accountability/dissemination"

types:
  - name: "DisseminationReport"
    description: "Outcome of propagating an event to witnesses and collecting receipts."
    variants:
      - name: "default"
        fields:
          - name: "witnesses_contacted"
            type: "integer"
            required: true
            description: "Number of witnesses the event was sent to"
          - name: "receipts_collected"
            type: "integer"
            required: true
            description: "Number of witness receipts received"
          - name: "mode"
            type: "string"
            required: true
            description: "Dissemination strategy used"
        invariants:
          - "receipts_collected <= witnesses_contacted"
          - "Event is considered accountable when receipts_collected >= TOAD"

  - name: "DisseminationRequest"
    description: "Complete input for event propagation — bundles the serialized event, resolved witness endpoints, and the chosen dissemination strategy."
    variants:
      - name: "default"
        fields:
          - name: "event_bytes"
            type: "bytes"
            required: true
            description: "The fully serialized and signed event to disseminate (CESR stream bytes)"
          - name: "witness_endpoints"
            type: "array[string]"
            required: true
            description: "Resolved network endpoint URLs for each witness — caller is responsible for OOBI resolution before calling dissemination"
          - name: "strategy"
            type: "types://accountability/dissemination#DisseminationStrategy"
            required: true
            description: "The dissemination strategy to use (RoundRobin or Broadcast)"
        invariants:
          - "event_bytes must be a valid CESR-encoded signed event"
          - "witness_endpoints must be non-empty (direct mode with no witnesses bypasses dissemination entirely)"
          - "Each endpoint must be reachable — unreachable endpoints produce WitnessUnreachableError"

  - name: "DisseminationStrategy"
    description: "Strategy for propagating events to the witness pool."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            constraints:
              enum: ["RoundRobin", "Broadcast"]
        invariants:
          - "RoundRobin: controller sends to each witness in sequence, collecting and redistributing receipts at each step (KERI spec's 2N exchange model)"
          - "Broadcast: controller sends to all witnesses simultaneously, then collects receipts in parallel — distinct from the spec's Gossip Protocol (witness-to-witness forwarding), Broadcast is a controller-to-witness parallel send"
          - "Direct mode (bt=0, b=[]) has no witnesses and bypasses dissemination entirely — it is NOT a strategy, it is the absence of one"

  - name: "WitnessConfig"
    description: "Witness set and tally for an identifier's accountability configuration."
    variants:
      - name: "default"
        fields:
          - name: "witnesses"
            type: "array[types://cesr/primitives#AID]"
            required: true
            description: "Ordered list of designated witness AIDs"
          - name: "tally"
            type: "integer"
            required: true
            description: "TOAD — minimum witness receipts needed for accountability"
            constraints:
              min: 0
        invariants:
          - "tally <= len(witnesses)"
          - "Witnesses must be non-transferable AIDs"
          - "Modified via rotation events (witness add/cut lists)"
