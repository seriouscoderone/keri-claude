# ubiquitous-language.yaml
domain_ref: "accountability/dissemination"

terms:
  - term: "Round-robin Dissemination"
    synonyms: []
    definition: "An efficient receipt dissemination protocol where the controller exchanges events and receipts with each witness in turn, requiring at most 2*N acknowledged exchanges for full dissemination."
    invariants:
      - "Controller visits each witness, sending events and collecting receipts"
      - "On each visit, controller also sends receipts collected from prior witnesses"
      - "At most two passes through all N witnesses for full dissemination"
      - "Network load scales linearly with N"
    examples:
      - "With 5 witnesses: first pass sends event and collects receipts; second pass ensures all witnesses have all receipts"
    related_terms: ["Gossip Protocol", "Witnessing Policy"]

  - term: "Gossip Protocol"
    synonyms: []
    definition: "A theoretical receipt dissemination protocol where witnesses forward receipts to each other, providing lower latency than round-robin but higher bandwidth usage. Note: keripy implements Broadcast (controller-to-witness parallel send) instead of true witness-to-witness gossip. The DisseminationStrategy type uses 'Broadcast' for keripy's actual pattern."
    invariants:
      - "Bandwidth scales with N * log(N) versus 2*N for round-robin"
      - "May use a directed acyclic graph to determine what needs to be gossiped"
      - "Provides lower latency than round-robin for large witness sets"
    examples:
      - "Witnesses broadcasting receipts to random subsets of other witnesses"
    related_terms: ["Round-robin Dissemination", "Witnessing Policy"]

  - term: "Witness Designation"
    synonyms: []
    definition: "The act of a controller specifying its witness set and accountability threshold in establishment events. Initial designation occurs at inception; modifications at rotation."
    invariants:
      - "Witnesses are designated by the controller — not self-selected"
      - "Initial witness set and tally designated in the inception event (b and bt fields)"
      - "Subsequent rotations may amend witnesses via br (pruned) and ba (grafted) fields and change the tally"
      - "Designation is a cryptographic commitment via inclusion in a verifiable establishment event"
    examples:
      - "Inception with b=['W1', 'W2', 'W3', 'W4'], bt='3'"
      - "Rotation removing W4 and adding W5: br=['W4'], ba=['W5'], bt='3'"
    related_terms: ["Witnessing Policy", "Direct Mode", "Indirect Mode"]

  - term: "Witnessing Policy"
    synonyms: []
    definition: "The operational rules governing how a witness processes events: verify signatures and consistency, apply first-seen rule, sign and store receipts, and optionally disseminate to other witnesses."
    invariants:
      - "First verified version of an event is witnessed (signed, stored, acknowledged)"
      - "All other versions at the same location are discarded"
      - "Exception: a superseding rotation event (per rules A0/B1-B3) may replace a previously first-seen event at the same sn — this is the ONLY case where first-seen ordering changes"
      - "Consistent receipts from other witnesses are appended to the KERL entry"
      - "Inconsistent receipts (different event version at same location) are discarded from KERL"
    examples:
      - "Witness receives event E at sn=3, verifies controller signatures, signs receipt, stores in KERL, returns receipt to controller"
      - "Witness receives different event E' at sn=3 — discards E' (first-seen E wins)"
    related_terms: ["Witness Designation", "Round-robin Dissemination", "Direct Mode"]

  # Inherits: "Direct Mode" from domain://identity
  - term: "Direct Mode"
    synonyms: []
    specializes: "Direct Mode"
    definition: "In the context of dissemination, direct mode is the trust modality where the controller sends events directly to the validator without witnesses. The validator acts as an implicit witness. Specializes the parent definition with the dissemination perspective: no witness pool is required and trust is established via direct signature exchange."
    invariants:
      - "The validator acts as an implicit witness — verifies controller signatures directly"
      - "No dissemination infrastructure needed"
      - "Auto-selected when the witness list is empty — caller does not need to specify Direct explicitly"
    examples:
      - "Two parties exchanging signed messages directly over a secure channel"
      - "Identifier with b=[] and bt='0' — Direct mode auto-selected, no witness round-trip"
    related_terms: ["Indirect Mode", "Witnessing Policy"]

  # Inherits: "Indirect Mode" from domain://identity
  - term: "Indirect Mode"
    synonyms: []
    specializes: "Indirect Mode"
    definition: "In the context of dissemination, indirect mode is the trust modality where events are receipted by a designated witness pool, creating a KERL as a secondary root-of-trust. Specializes the parent definition with the dissemination perspective: receipt dissemination protocols (round-robin, gossip) are the operational mechanism for achieving witness agreement."
    invariants:
      - "KERL serves as a secondary root-of-trust for validating events"
      - "Validators may not be among the designated witnesses"
      - "Receipt dissemination (round-robin or gossip) is the operational mechanism"
    examples:
      - "A public AID with 5 witnesses and threshold 3 — any validator can obtain and verify the KERL"
    related_terms: ["Direct Mode", "Witness Designation", "Round-robin Dissemination"]

events:
  - name: "ReceiptDisseminated"
    payload: "aid: AID, sn: int, from_witness: WitnessAID, to_witness: WitnessAID"
    triggers: "A receipt is forwarded from one witness to another during dissemination"

  - name: "WitnessSetChanged"
    payload: "aid: AID, sn: int, pruned: [WitnessAID], grafted: [WitnessAID], new_tally: int"
    triggers: "A rotation event modifies the witness set via br/ba fields or changes the tally"

rules:
  - "Witnesses are designated by the controller, not self-selected"
  - "The local-event-only rule (witness MUST only accept local/protected events from the controller) is enforced by the witness upon receipt, NOT by the dissemination domain — dissemination propagates events; the witness validates the source"
  - "Network load for receipt dissemination scales linearly (round-robin) or N*log(N) (gossip)"
  - "In direct mode, the validator acts as an implicit witness — no witness pool needed"
  - "In indirect mode, validators may require M receipts before accepting an event"
