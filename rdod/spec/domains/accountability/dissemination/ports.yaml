# ports.yaml
domain_ref: "accountability/dissemination"

ports:
  # Inbound — what clients call
  - id: "port://accountability/dissemination/inbound/event-propagation"
    type: inbound
    name: "Event Propagation"
    contract: "disseminate_event(event: KeyEvent, receipts: [Receipt], witnesses: [ServiceEndpoint], strategy: DisseminationStrategy) -> Result<DisseminationReport, DisseminationTimeoutError>; get_witness_set(aid: AID, sn: int) -> {witnesses: [WitnessAID], tally: int}; select_mode(witness_count: int) -> Mode"
    protocol: "method-call"
    refs: ["domain://accountability"]

  - id: "port://accountability/dissemination/inbound/witness-management"
    type: inbound
    name: "Witness Management"
    contract: "designate_witnesses(witnesses: [WitnessAID], tally: int) -> WitnessConfig; amend_witnesses(prune: [WitnessAID], graft: [WitnessAID], new_tally: int) -> WitnessConfig; resolve_witness_endpoints(witnesses: [WitnessAID]) -> [ServiceEndpoint]"
    protocol: "method-call"
    refs: ["domain://accountability"]

  # Outbound — what dissemination calls
  - id: "port://accountability/dissemination/outbound/transport"
    type: outbound
    name: "Network Transport"
    contract: "send_event(endpoint: Endpoint, event: KeyEvent, receipts: [Receipt]) -> Result; send_receipt(endpoint: Endpoint, receipt: Receipt) -> Result; gossip_receipts(witnesses: [Endpoint], receipts: [Receipt]) -> Result"
    protocol: "method-call"
    refs: ["transport"]
