# ports.yaml
domain_ref: "accountability/dissemination"

ports:
  # Inbound — what clients call
  - id: "port://accountability/dissemination/inbound/event-propagation"
    type: inbound
    name: "Event Propagation"
    semantics: command
    idempotent: false
    contract:
      input: "types://accountability/dissemination#DisseminationStrategy"
      output: "types://accountability/dissemination#DisseminationReport"
      errors:
        - "errors://accountability/dissemination#DisseminationTimeoutError"
        - "errors://accountability/dissemination#WitnessUnreachableError"
        - "errors://accountability/dissemination#WitnessRejectionError"
    refs: ["domain://accountability"]

  - id: "port://accountability/dissemination/inbound/witness-management"
    type: inbound
    name: "Witness Management"
    semantics: command
    idempotent: false
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://accountability/dissemination#WitnessConfig"
      errors: []
    refs: ["domain://accountability"]

  # Outbound — what dissemination calls
  - id: "port://accountability/dissemination/outbound/transport"
    type: outbound
    name: "Network Transport"
    semantics: command
    idempotent: false
    contract:
      input: "types://accountability/consensus#Receipt"
      output: "types://accountability/dissemination#DisseminationReport"
      errors:
        - "errors://accountability/dissemination#WitnessUnreachableError"
        - "errors://accountability/dissemination#DisseminationTimeoutError"
    refs: ["domain://externals/transport"]
