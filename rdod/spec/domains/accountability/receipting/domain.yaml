# domain.yaml
template_version: "2.0"
id: "accountability/receipting"
name: "Witness Receipting"
description: >
  The receipt lifecycle — receipt creation, receipt types (non-transferable couple, transferable
  quadruple, witness indexed), receipt escrows for premature receipts, the witness receipt
  generator, and the KERL as the receipted KEL. This subdomain owns everything about how
  receipts are produced, typed, escrowed, and attached to events. It does not own the
  consensus rules (first-seen, quorum) or the network propagation of receipts.
version: "0.1.0"
tier: "domain"

source_material:
  - type: document
    reference: "keri-specification.md — sections: Receipt Message, Receipt Types, KERL, Witness Receipting"
  - type: document
    reference: "KERI_WP_2.x.web.md — sections: KERL, Witness Receipts, Escrows"
  - type: implementation
    reference: "keripy — src/keri/core/eventing.py (Receiptor, Kevery.processEscrowUnverWitness, processEscrowUnverNonTrans, processEscrowUnverTrans), src/keri/core/coring.py (Cigar, Siger), src/keri/app/storing.py (.rcts, .vrcs, .wigs, .uwes, .ures, .vres)"
  - type: implementation
    reference: "keriox — components/witness/src/witness_receipt_generator.rs (WitnessReceiptGenerator), keriox_core/src/processor/notification.rs (KeyEventAdded notification)"

domain_clients:
  - ref: "domain://accountability"
    relationship: "Parent orchestrates witness agreement; receipting provides the receipt creation, typing, escrowing, and KERL assembly mechanics"
    via_port: "port://accountability/receipting/inbound/receipt-lifecycle"

subdomains: []

kernels: []

adjacents:
  - ref: "domain://keri-messaging"
    pattern: "conformist"
    relationship: "Publishes and consumes domain events for cross-domain coordination"

externals:
  - ref: "domain://externals/persistence"
    relationship: "Typed receipt storage for verified and unverified receipts — the persistence outbound port delegates to this external"

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    Receipts are generated after witnessing a key event. Premature receipts (arriving before
    the receipted event) are escrowed and drained when the event arrives. Receipt type
    selection depends on the signer's AID type (transferable vs. non-transferable) and role
    (witness vs. validator). Internal coordination for escrow reprocessing is implementation-defined.

issues: []

tags: ["receipt", "kerl", "escrow", "rct", "witness-receipt", "receipt-types"]
