domain_ref: "accountability/receipting"

types:
  - name: "ReceiptType"
    description: "Classification of witness receipt by the witness's transferability."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            constraints:
              enum: ["NonTransferable", "Transferable", "WitnessIndexed"]
        invariants:
          - "NonTransferable: unindexed signature (UnindexedSignature) from a non-transferable witness"
          - "Transferable: indexed signature group (IndexedSignature) with event seal from a transferable witness"
          - "WitnessIndexed: indexed by witness position in the witness list"

  - name: "SigningKeys"
    description: "Key set used by a witness for generating receipts."
    variants:
      - name: "default"
        fields:
          - name: "keys"
            type: "array[types://cesr/primitives#Primitive]"
            required: true
            description: "Public keys (VerificationKey) for receipt verification"
          - name: "threshold"
            type: "types://cesr/primitives#SigningThreshold"
            required: true
            description: "Signing threshold for multi-key witnesses"
        invariants:
          - "For non-transferable witnesses, keys has exactly one entry"
          - "threshold must be satisfiable by the available keys"

  - name: "KERL"
    description: "Key Event Receipt Log — a KEL augmented with witness receipts. A KERL contains every event plus the witness receipts that make each event accountable."
    variants:
      - name: "default"
        fields:
          - name: "prefix"
            type: "string"
            required: true
            description: "The AID this KERL belongs to"
          - name: "events"
            type: "array[KeyEvent]"
            required: true
            description: "Ordered sequence of key events"
          - name: "receipts"
            type: "map[string, array[WitnessReceipt]]"
            required: true
            description: "Map from event SAID to list of witness receipts for that event"
        invariants:
          - "Every event in events has at least TOAD receipts in the receipts map"
          - "Events are ordered by sequence number with no gaps"
          - "KERL = KEL + receipts — the KEL is extractable by removing receipts"
