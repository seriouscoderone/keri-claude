# errors.yaml
domain_ref: "accountability/receipting"

# Error catalog for the Accountability Receipting domain.
# Maps to exception classes in keripy/src/keri/kering.py and
# raise sites in keripy/src/keri/core/eventing.py (Kevery.processReceipt,
# Kevery.processReceiptCouples, Kevery.processReceiptQuadruples,
# Kevery.processReceiptWitness, and escrow processing methods).
#
# Severity levels:
#   transient  — condition may self-resolve (escrow and retry)
#   recoverable — requires operator or protocol-level action
#   fatal      — unrecoverable; receipt is permanently rejected

errors:
  - name: "UnverifiedReceiptError"
    description: "Non-transferable receipt cannot be verified because the receipted event is not yet in the KEL"
    cause: "Receipt references an event at (prefix, sn) that has not yet been accepted into the local KEL — the receipted event must arrive before the receipt can be verified"
    recovery: "escrow"
    recovery_target: "URE"
    severity: "transient"
    context:
      - field: "prefix"
        type: "types://cesr/primitives#AID"
        description: "The AID prefix of the receipted event"
      - field: "sn"
        type: "integer"
        description: "The sequence number of the receipted event"
      - field: "receipt_said"
        type: "types://cesr/primitives#SAID"
        description: "The digest/SAID in the receipt"
    related_port: "port://accountability/receipting/inbound/receipt-lifecycle"

  - name: "UnverifiedWitnessReceiptError"
    description: "Witness receipt cannot be verified because the receipted event is not yet in the KEL"
    cause: "A witness receipt (wiger) references an event that has not yet been accepted — the receipt arrived before the event it covers"
    recovery: "escrow"
    recovery_target: "UWE"
    severity: "transient"
    context:
      - field: "prefix"
        type: "types://cesr/primitives#AID"
        description: "The AID prefix of the receipted event"
      - field: "sn"
        type: "integer"
        description: "The sequence number of the receipted event"
      - field: "witness_aid"
        type: "types://cesr/primitives#AID"
        description: "The witness AID that signed the receipt"
    related_port: "port://accountability/receipting/inbound/receipt-lifecycle"

  - name: "UnverifiedTransferableReceiptError"
    description: "Transferable receipt cannot be verified because the receipter's establishment event or the receipted event is missing"
    cause: "A transferable receipt quadruple (Identifier Prefix, Fixed-Width Ordinal, SAID Primitive, Indexed Signature) references either a receipted event not yet in the local KEL or a receipter establishment event that has not been received"
    recovery: "escrow"
    recovery_target: "VRE"
    severity: "transient"
    context:
      - field: "receipter_prefix"
        type: "types://cesr/primitives#AID"
        description: "The transferable receipter (validator) AID prefix"
      - field: "receipter_sn"
        type: "integer"
        description: "The sequence number of the receipter's establishment event referenced in the quadruple"
      - field: "receipter_said"
        type: "types://cesr/primitives#SAID"
        description: "The SAID of the receipter's establishment event referenced in the quadruple"
      - field: "receipted_prefix"
        type: "types://cesr/primitives#AID"
        description: "The AID prefix of the event being receipted"
      - field: "receipted_sn"
        type: "integer"
        description: "The sequence number of the receipted event"
    related_port: "port://accountability/receipting/inbound/receipt-lifecycle"

  - name: "StaleReceiptError"
    description: "Receipt references an event that has been superseded"
    cause: "Receipt's SAID does not match the accepted event at the given (prefix, sn) — the receipt covers a stale or replaced event"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "prefix"
        type: "types://cesr/primitives#AID"
        description: "The AID prefix"
      - field: "sn"
        type: "integer"
        description: "The sequence number in the receipt"
      - field: "receipt_said"
        type: "types://cesr/primitives#SAID"
        description: "The SAID in the receipt"
      - field: "accepted_said"
        type: "types://cesr/primitives#SAID"
        description: "The SAID of the currently accepted event at this sn"
    related_port: "port://accountability/receipting/inbound/receipt-lifecycle"

  - name: "UnknownWitnessError"
    description: "Receipt signed by an AID not in the witness set at the receipted event's sequence number"
    cause: "The signing AID is not in the witness list at the receipted event's sn — receipt from a non-witness cannot contribute to accountability. Witness set is resolved historically (at the receipted event's sn), not from the current key state."
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "witness_aid"
        type: "types://cesr/primitives#AID"
        description: "The AID claiming to be a witness"
      - field: "prefix"
        type: "types://cesr/primitives#AID"
        description: "The AID prefix of the receipted event"
      - field: "witnesses_at_sn"
        type: "array[types://cesr/primitives#AID]"
        description: "The witness set at the receipted event's sequence number (historical, not current)"
    related_port: "port://accountability/receipting/inbound/receipt-lifecycle"

  - name: "EscrowTimeoutError"
    description: "Escrowed receipt exceeded the maximum escrow duration"
    cause: "Receipt has been in escrow longer than the timeout (default 3600 seconds) without the blocking condition resolving"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "prefix"
        type: "types://cesr/primitives#AID"
        description: "The AID prefix of the escrowed receipt"
      - field: "sn"
        type: "integer"
        description: "The sequence number of the escrowed receipt"
      - field: "escrow_type"
        type: "types://accountability/receipting#EscrowType"
        description: "The escrow queue (URE, UWE, VRE)"
      - field: "age_seconds"
        type: "integer"
        description: "How long the receipt was escrowed before timeout"
    related_port: "port://accountability/receipting/inbound/receipt-lifecycle"
