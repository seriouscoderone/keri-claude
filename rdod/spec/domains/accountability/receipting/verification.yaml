# verification.yaml
domain_ref: "accountability/receipting"

properties:
  - invariant: "A witness MUST only create a receipt after verifying: (1) the controller's signatures on the event are valid, (2) the event is consistent with the witness's view of the KEL (correct sn, valid hash chain); the receipt's witness_aid MUST be in the event's witness set (b field), and receipt.event_said MUST equal the event's SAID"
    term: "Receipt"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(receipt=receipt_strategy(), event=key_event_strategy())
        def test_receipt_references_verified_event(receipt, event):
            assert receipt.witness_aid in event.witness_set, (
                f"Receipt witness {receipt.witness_aid} must be in event witness set"
            )
            assert receipt.event_said == event.said, (
                f"Receipt SAID {receipt.event_said} must match event SAID {event.said}"
            )
            assert event.signatures_verified(), (
                "Receipt must not exist for an event with invalid signatures"
            )
    strategy: "receipt_strategy() x key_event_strategy()"
    notes: "A receipt is proof that the witness verified the event — no receipts for unverified events."

  - invariant: "Receipt signatures MUST be CESR-encoded using a recognized attachment code; the attachment_code MUST be one of the valid CESR group codes; non-CESR-encoded signatures MUST be rejected"
    term: "Receipt"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(receipt=receipt_strategy())
        def test_receipt_cesr_encoded(receipt):
            assert receipt.signature.is_cesr_encoded(), (
                "Receipt signature must be CESR-encoded"
            )
            assert receipt.signature.attachment_code in VALID_ATTACHMENT_CODES, (
                f"Attachment code '{receipt.signature.attachment_code}' must be a valid CESR code"
            )
    strategy: "receipt_strategy()"
    notes: "All receipt signatures use CESR encoding — this ensures portability across implementations."

  - invariant: "Non-transferable receipt MUST be a couple: (Prefixer with non-transferable AID, Cigar with unindexed signature); the Prefixer MUST NOT be transferable; the signature type MUST be Cigar (unindexed), not Siger (indexed)"
    term: "Receipt Types"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(receipt=non_transferable_receipt_strategy())
        def test_non_transferable_receipt_structure(receipt):
            assert receipt.type == 'non_transferable'
            assert isinstance(receipt.sig, Cigar), (
                f"Non-transferable receipt must use Cigar, got {type(receipt.sig).__name__}"
            )
            assert isinstance(receipt.prefix, Prefixer)
            assert not receipt.prefix.transferable, (
                "Non-transferable receipt prefix must not be transferable"
            )
    strategy: "non_transferable_receipt_strategy()"
    notes: "Non-transferable receipts: (Prefixer, Cigar) couple. Witnesses use this form."

  - invariant: "Transferable receipt MUST be a quadruple: (Prefixer with transferable AID, Seqner for sn, Saider for digest, Siger with indexed signature); all four components MUST be present; the Prefixer MUST be transferable"
    term: "Receipt Types"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(receipt=transferable_receipt_strategy())
        def test_transferable_receipt_structure(receipt):
            assert receipt.type == 'transferable'
            assert isinstance(receipt.sig, Siger), (
                f"Transferable receipt must use Siger, got {type(receipt.sig).__name__}"
            )
            assert hasattr(receipt, 'seqner') and receipt.seqner is not None, (
                "Transferable receipt must have seqner"
            )
            assert hasattr(receipt, 'saider') and receipt.saider is not None, (
                "Transferable receipt must have saider"
            )
            assert receipt.prefix.transferable, (
                "Transferable receipt prefix must be transferable"
            )
    strategy: "transferable_receipt_strategy()"
    notes: "Transferable receipts: (Prefixer, Seqner, Saider, Siger) quadruple. Validators use this form."

  # Receipt signature verification mechanics
  - invariant: "Receipt signature verification: the signature in a receipt is verified against the SERIALIZATION OF THE REFERENCED EVENT, not the receipt envelope itself. For non-transferable witnesses (AID = public key), verify(witness_aid, signature, event_serialization) — no KEL lookup needed. For transferable receipters, the validator MUST have the receipter's KEL to determine their current key state for verification."
    term: "Receipt"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(receipt=receipt_strategy(), event=key_event_strategy())
        def test_receipt_verified_against_event_serialization(receipt, event):
            # Receipt signature is over the EVENT, not the receipt message
            event_ser = serialize(event)
            if not receipt.prefix.transferable:
                # Non-transferable: AID IS the public key — direct verify
                assert verify(receipt.prefix.raw, receipt.sig.raw, event_ser), (
                    "Non-transferable receipt: verify(witness_pubkey=AID, sig, event_ser)"
                )
            else:
                # Transferable: need receipter's KEL for current key state
                receipter_key_state = get_key_state(receipt.prefix)
                assert receipter_key_state is not None, (
                    "Transferable receipt: must have receipter's KEL"
                )
                verfer = receipter_key_state.verfer_at(receipt.seqner.sn)
                assert verify(verfer.raw, receipt.sig.raw, event_ser)
    strategy: "receipt_strategy() x key_event_strategy()"
    notes: "Critical distinction: receipt sig is over the event serialization, not the receipt envelope. Non-transferable witnesses are efficient (AID = pubkey, no KEL needed). Transferable receipters require full KEL chain verification."

  - invariant: "Receipt verification is a two-phase process: (1) Event must be accepted into the KEL BEFORE receipts for it can be verified — receipts for unknown events are escrowed. (2) Once the event exists, receipt signatures are verified and counted toward the TOAD threshold. Receipts may arrive before, during, or after event acceptance."
    term: "Receipt"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(receipt=receipt_strategy(), event_accepted=st.booleans())
        def test_two_phase_receipt_verification(receipt, event_accepted):
            if not event_accepted:
                result = process_receipt(receipt)
                assert result.escrowed, "Receipt for unknown event must be escrowed"
            else:
                result = process_receipt(receipt)
                assert result.verified or result.rejected, (
                    "Receipt for known event must be verified or rejected (not escrowed)"
                )
    strategy: "receipt_strategy() x event_accepted boolean"
    notes: "Asynchronous design: events and receipts arrive independently. Escrow bridges the gap."

  - invariant: "Default timeout: 3600 seconds — escrowed receipts are pruned after expiry"
    term: "Receipt Escrows"
    technique: smt
    formal:
      language: z3
      expression: "And(timeout == 3600, Implies(age > timeout, pruned == True), Implies(age <= timeout, pruned == False))"
    notes: "Exact boundary verification — ensure no off-by-one in timeout pruning"

  - invariant: "When a missing event arrives, escrowed receipts MUST be promoted to verified storage if and only if all three match: escrow.aid == event.aid AND escrow.sn == event.sn AND escrow.event_said == event.said; if any field differs, the escrowed receipt MUST NOT be promoted"
    term: "Receipt Escrows"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(escrow=escrowed_receipt_strategy(), event=key_event_strategy(),
               match_aid=st.booleans(), match_sn=st.booleans(), match_said=st.booleans())
        def test_escrow_promotion_requires_triple_match(escrow, event, match_aid, match_sn, match_said):
            if match_aid:
                escrow.aid = event.aid
            if match_sn:
                escrow.sn = event.sn
            if match_said:
                escrow.event_said = event.said
            all_match = match_aid and match_sn and match_said
            assert escrow.promotable_with(event) == all_match, (
                f"Promotion requires all three match: aid={match_aid}, sn={match_sn}, said={match_said}"
            )
    strategy: "escrowed_receipt_strategy() x key_event_strategy() x st.booleans x3"
    notes: "All three criteria must match for promotion — partial matches are ignored."

  - invariant: "KERL is strictly append-only: existing entries MUST NOT be modified by any operation; after any operation, all entries that existed before MUST be byte-identical in the resulting KERL"
    term: "KERL"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kerl=kerl_strategy(), new_event=key_event_strategy())
        def test_kerl_append_only(kerl, new_event):
            snapshot_before = [e.copy() for e in kerl.events]
            kerl.append(new_event)
            for i, original in enumerate(snapshot_before):
                assert kerl.events[i] == original, (
                    f"KERL entry at index {i} was modified after append"
                )
            assert len(kerl.events) == len(snapshot_before) + 1
    strategy: "kerl_strategy() x key_event_strategy()"
    notes: "No existing entry in the KERL may be modified — only append operations are valid."

  - invariant: "Receipts must satisfy the accountability threshold (M of N witnesses) for the event to be considered sufficiently accountable"
    term: "KERL"
    technique: smt
    formal:
      language: z3
      expression: "Implies(accountable == True, receipt_count >= M)"
    notes: "Accountability requires at least M receipts — this is the TOAD constraint on KERLs"

contracts:
  - port_ref: "port://accountability/receipting/inbound/receipt-lifecycle"
    preconditions:
      - formal:
          language: python
          expression: "lambda event, witness_keys: event.signatures_verified() and witness_keys.valid()"
        description: "Event must be verified and witness keys must be valid before receipt creation"
      - formal:
          language: python
          expression: "lambda signer_aid, signer_role: signer_aid is not None and signer_role in ('witness', 'validator')"
        description: "Receipt classification requires a valid signer AID and recognized role"
    postconditions:
      - formal:
          language: python
          expression: "lambda receipt: receipt.signature.verifies() and receipt.event_said is not None"
        description: "Created receipt has a valid signature and references a specific event SAID"
      - formal:
          language: python
          expression: "lambda signer_aid, role, receipt_type: (not signer_aid.transferable and role == 'witness') implies receipt_type == 'non_transferable_couple'"
        description: "Non-transferable witness AIDs produce non-transferable receipt couples"

  - port_ref: "port://accountability/receipting/inbound/kerl-assembly"
    preconditions:
      - formal:
          language: python
          expression: "lambda kerl, receipt: receipt.event_said in [e.said for e in kerl.events]"
        description: "Receipt can only be attached to an event already in the KERL"
    postconditions:
      - formal:
          language: python
          expression: "lambda kerl_before, receipt, kerl_after: len(kerl_after.receipts_for(receipt.event_said)) == len(kerl_before.receipts_for(receipt.event_said)) + 1"
        description: "Attaching a receipt increases the receipt count for that event by exactly one"

  - port_ref: "port://accountability/receipting/outbound/persistence"
    preconditions:
      - formal:
          language: python
          expression: "lambda receipt, db_name: receipt is not None and db_name in ('.rcts', '.vrcs', '.wigs')"
        description: "Receipt must be non-null and db_name must be a valid receipt store"
    postconditions:
      - formal:
          language: python
          expression: "lambda receipt, db_name, result: result.is_ok() implies load_receipts(receipt.aid, receipt.sn, db_name).contains(receipt)"
        description: "After successful store, the receipt is retrievable from the same database"

  - port_ref: "port://accountability/receipting/inbound/receipt-lifecycle"
    preconditions:
      - description: "Receipt must reference an event that exists in the local KEL"
        formal:
          language: "pseudocode"
          expression: "db.get_event(receipt.i, receipt.s) != null"
      - description: "Receipt signature must verify against the witness's current public key"
        formal:
          language: "pseudocode"
          expression: "witness_verfer.verify(receipt_signature, event_raw) == true"
    postconditions:
      - description: "On success: receipt stored, witness count incremented for this event"
        formal:
          language: "pseudocode"
          expression: "witness_receipt_count(event.i, event.s) == prior_count + 1 OR prior_count (if duplicate)"
      - description: "If receipt meets TOAD: event transitions from PWE to accepted"
        formal:
          language: "pseudocode"
          expression: "witness_receipt_count(event.i, event.s) >= toad implies event_fully_witnessed(event.i, event.s)"

state_machines:
  - name: "receipt-escrow-lifecycle"
    term: "Receipt Escrows"
    states: ["received", "escrowed", "promoted", "pruned"]
    transitions:
      - from: "received"
        to: "escrowed"
        trigger: "ReceiptEscrowed — receipt arrives for an event not yet in the KEL"
        guard: "No matching event at (aid, sn) in the KEL"
      - from: "escrowed"
        to: "promoted"
        trigger: "EscrowDrained — missing event arrives and matching receipts are promoted"
        guard: "Matching event at (aid, sn, said) now exists in the KEL"
      - from: "escrowed"
        to: "pruned"
        trigger: "Timeout exceeded (3600 seconds)"
        guard: "current_time - escrow_time > 3600"
    invariants:
      - "An escrowed receipt either gets promoted (event arrives) or pruned (timeout) — never stays permanently"
      - "Promotion requires matching AID, sn, and SAID between the escrowed receipt and the arriving event"
      - "Pruned receipts are permanently removed — they cannot be re-escrowed or promoted"
    initial_state: "received"
    terminal_states: ["promoted", "pruned"]
