# ports.yaml
domain_ref: "accountability/receipting"

ports:
  # Inbound — what clients call
  - id: "port://accountability/receipting/inbound/receipt-lifecycle"
    type: inbound
    name: "Receipt Lifecycle"
    contract: "create_receipt(event: KeyEvent, witness_keys: SigningKeys) -> Receipt; classify_receipt(signer_aid: AID, signer_role: Role) -> ReceiptType; escrow_receipt(receipt: Receipt, escrow_type: EscrowType) -> Result<Escrowed, UnverifiedReceiptError>; drain_escrow(aid: AID, sn: int, event_said: SAID) -> [Receipt]"
    protocol: "method-call"
    refs: ["domain://accountability"]

  - id: "port://accountability/receipting/inbound/kerl-assembly"
    type: inbound
    name: "KERL Assembly"
    contract: "attach_receipt(kerl: KERL, receipt: Receipt) -> KERL; get_kerl(aid: AID) -> KERL; get_receipted_event(aid: AID, sn: int) -> {event: KeyEvent, receipts: [Receipt]}"
    protocol: "method-call"
    refs: ["domain://accountability"]

  # Outbound — Repository interface for persistence
  - id: "port://accountability/receipting/outbound/persistence"
    type: outbound
    name: "Receipt Repository"
    contract: "store_receipt(aid: AID, sn: int, event_said: SAID, receipt: Receipt) -> void; get_receipts(aid: AID, sn: int, event_said: SAID) -> [Receipt]; escrow_receipt(aid: AID, sn: int, event_said: SAID, receipt: Receipt, escrowed_at: datetime) -> void; get_escrowed_receipts(aid: AID, sn: int) -> [Receipt]; remove_escrowed_receipts(aid: AID, sn: int, event_said: SAID) -> void"
    protocol: "repository"
    refs: ["persistence"]
    invariants:
      - "Stored receipts are append-only — once written, they accumulate and are never overwritten"
      - "Escrowed receipts are temporary — promoted to stored receipts or discarded"
      - "Removal of escrowed receipts is idempotent"
      - "Receipts are keyed by AID, sequence number, and event SAID"
