domain_ref: "accountability"

types:
  - name: "WitnessReceipt"
    description: "Cryptographic proof that a witness has observed and first-seen an event. Two variants: non-transferable (cigar — unindexed signature) and transferable (indexed signature group with seal)."
    variants:
      - name: "non-transferable"
        fields:
          - name: "witness_aid"
            type: "string"
            required: true
            description: "Non-transferable AID of the witness (public key IS the identifier)"
          - name: "cigar"
            type: "types://cesr/primitives#Primitive"
            required: true
            description: "Unindexed signature (UnindexedSignature — Primitive subtype) — the witness's signature over the receipted event's raw bytes"
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the event being receipted"
          - name: "event_sn"
            type: "integer"
            required: true
            description: "Sequence number of the receipted event"
          - name: "event_prefix"
            type: "string"
            required: true
            description: "AID prefix of the identifier whose event was receipted"
        invariants:
          - "witness_aid must be non-transferable — its public key can be derived directly from the prefix"
          - "cigar.verify(event_raw, witness_public_key) must return True"
          - "A witness MUST NOT receipt two different events at the same (prefix, sn) — first-seen rule"
      - name: "transferable"
        fields:
          - name: "witness_aid"
            type: "string"
            required: true
            description: "Transferable AID of the witness"
          - name: "seal"
            type: "types://cesr/primitives#Seal"
            required: true
            description: "Event seal referencing the witness's latest establishment event"
          - name: "sigers"
            type: "array[types://cesr/primitives#Primitive]"
            required: true
            description: "Indexed signatures (IndexedSignature — Primitive subtype) from the witness's current key set"
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the receipted event"
          - name: "event_sn"
            type: "integer"
            required: true
            description: "Sequence number of the receipted event"
          - name: "event_prefix"
            type: "string"
            required: true
            description: "AID prefix of the receipted event"
        invariants:
          - "Seal must reference the witness's current establishment event"
          - "Signatures must verify against the witness's current key state"
          - "Same first-seen constraint applies"

  - name: "Backer"
    description: "The umbrella term for components that provide accountability support for a KEL. Backers express support for key events, providing additional trust beyond the Controller's own signatures. Two variants: Witness (signature-based) and Registrar Backer (ledger-based)."
    variants:
      - name: "default"
        invariants:
          - "Backers are designated in the backer list (b field) of Establishment Events"
          - "The backer threshold (bt/TOAD) determines how many backers must support an event"

  - name: "RegistrarBacker"
    description: "A Backer that expresses support for key events by anchoring them on an associated ledger, rather than by signing receipts like a Witness. Activated by the RB configuration trait."
    variants:
      - name: "default"
        invariants:
          - "Uses ledger anchoring instead of signatures"
          - "Activated by the RB config trait in establishment events"
          - "Deactivated by the NRB config trait"

  # L67-O1: WitnessReceipt vs Receipt type unification note
  # WitnessReceipt (this file) is the canonical domain type — it is the adopter-centric concept.
  # Receipt (types://accountability/consensus#Receipt) is the consensus subdomain's view of the
  # same concept, used within the KAWA algorithm. They represent the same artifact from different angles:
  # - WitnessReceipt: the witness's signed proof of observation (what the witness produces)
  # - Receipt: the consensus-validated artifact (what KAWA counts toward TOAD)
  # A future revision SHOULD unify these into a single canonical type. For now, WitnessReceipt
  # in accountability/types.yaml is the source of truth; accountability/consensus#Receipt aliases it.

  - name: "ReceiptMessage"
    description: "The receipt message (rct) that conveys witness signatures as proof of first-seen observation."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["rct"]
            description: "Message type — receipt"
          - name: "d"
            type: "string"
            required: true
            description: "SAID of the receipted event (NOT the receipt itself). Note: the receipt body is NOT SAIDified — d refers to the EVENT being receipted, not this message."
          - name: "i"
            type: "string"
            required: true
            description: "AID prefix of the receipted event"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number of the receipted event"
        invariants:
          - "d matches the SAID of the original event — the receipt references the event by content hash"
          - "Witness signatures are attached as CESR attachments, not in the body"
          - "Receipt body is NOT SAIDified itself — d is the referenced event's SAID, not a self-SAID"
          # L67-O3: Verification property for SAID inversion
          - "VERIFICATION: verify(ReceiptMessage.d == referenced_event.said) must hold; d is the FOREIGN SAID of the event being receipted, not a self-referential SAID of the receipt message"

  # L67-O4: RegistrarBacker — deferred to v0.2
  # RegistrarBacker is spec-inert in v0.1: the KERI spec defines it and the RB/NRB config
  # traits activate/deactivate it, but the full ledger-anchoring protocol for RegistrarBacker
  # is not implemented in keripy or keriox as of this writing. The type definition above
  # captures the structural definition; the behavioral specification (how anchoring works,
  # what the ledger records, how validators check it) is deferred to v0.2.
  # See: KERI spec sections on Backer Registrar, RB/NRB config traits.
