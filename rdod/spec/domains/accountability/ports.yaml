# ports.yaml
domain_ref: "accountability"

ports:
  # Inbound — what clients call
  - id: "port://accountability/inbound/receipting"
    type: inbound
    name: "Receipting"
    semantics: command
    idempotent: false
    description: >
      Process an incoming receipt from a witness. The input is a Receipt (the witness's
      signed proof of observation), not a raw key event. The receipting subdomain verifies
      the receipt's signature and stores it; the KERL is assembled incrementally.
    contract:
      # L67-O2: Clarification note — the input IS a Receipt (witness's signed artifact),
      # NOT a key event. The receipting port receives already-arrived receipts for events
      # that may or may not be in the KEL. The distinction matters:
      # - Key events arrive via the identity domain's event processing pipeline
      # - Receipts arrive separately and are correlated to events by SAID
      input: "types://accountability/consensus#Receipt"
      output: "types://accountability/receipting#KerlAssemblyResult"
      errors:
        - "errors://accountability/receipting#UnverifiedWitnessReceiptError"
        - "errors://accountability/receipting#UnverifiedReceiptError"
        - "errors://accountability/receipting#StaleReceiptError"
    delegates_to: ["port://accountability/receipting/inbound/receipt-lifecycle"]
    refs: ["domain://identity"]

  - id: "port://accountability/inbound/kerl-query"
    type: inbound
    name: "KERL Query"
    semantics: query
    idempotent: true
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://accountability/receipting#KERL"
      errors: []
    delegates_to: ["port://accountability/receipting/inbound/kerl-assembly"]
    refs: ["domain://identity"]

  # Outbound — what accountability calls
  - id: "port://accountability/outbound/transport"
    type: outbound
    name: "Receipt Transport"
    semantics: command
    idempotent: false
    contract:
      input: "types://accountability/consensus#Receipt"
      output: "types://accountability/dissemination#DisseminationReport"
      errors:
        - "errors://accountability/dissemination#WitnessUnreachableError"
        - "errors://accountability/dissemination#DisseminationTimeoutError"
    delegates_to: ["port://accountability/dissemination/inbound/event-propagation"]
    refs: ["domain://externals/transport"]
