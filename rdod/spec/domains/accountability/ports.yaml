# ports.yaml
domain_ref: "accountability"

ports:
  # Inbound — what clients call
  - id: "port://accountability/inbound/receipting"
    type: inbound
    name: "Receipting"
    semantics: command
    idempotent: false
    contract:
      input: "types://accountability/consensus#Receipt"
      output: "types://accountability/receipting#KERL"
      errors:
        - "errors://accountability/receipting#UnverifiedWitnessReceiptError"
        - "errors://accountability/receipting#UnverifiedReceiptError"
        - "errors://accountability/receipting#StaleReceiptError"
    refs: ["domain://identity"]

  - id: "port://accountability/inbound/kerl-query"
    type: inbound
    name: "KERL Query"
    semantics: query
    idempotent: true
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://accountability/receipting#KERL"
      errors: []
    refs: ["domain://identity"]

  # Outbound — what accountability calls
  - id: "port://accountability/outbound/transport"
    type: outbound
    name: "Receipt Transport"
    semantics: command
    idempotent: false
    contract:
      input: "types://accountability/consensus#Receipt"
      output: "types://accountability/dissemination#DisseminationReport"
      errors:
        - "errors://accountability/dissemination#WitnessUnreachableError"
        - "errors://accountability/dissemination#DisseminationTimeoutError"
    refs: ["transport"]
