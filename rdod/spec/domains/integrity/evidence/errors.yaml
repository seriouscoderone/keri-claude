# errors.yaml
domain_ref: "integrity/evidence"

# Error catalog for the Duplicity Evidence domain.
# Covers fork detection, duplicity evidence validation,
# LDE (Likely Duplicitous Escrow), DEL (Duplicitous Event Log),
# and internal coordination for escrow reprocessing.
#
# Severity levels:
#   transient  — condition may self-resolve (escrow and retry)
#   recoverable — requires operator or protocol-level action
#   fatal      — unrecoverable; event is permanently rejected

errors:
  - name: "NotDuplicityError"
    description: "Two events at the same (prefix, sn) have identical SAIDs — this is a duplicate, not duplicity"
    cause: "The events are the same event resubmitted, not a fork. Duplicates are normal (late-arriving signatures); duplicity requires different SAIDs."
    recovery: "abort"
    severity: "recoverable"
    context:
      - field: "prefix"
        type: "string"
        description: "The AID"
      - field: "sn"
        type: "integer"
        description: "The sequence number"
      - field: "said"
        type: "string"
        description: "The shared SAID (proves same event)"
    related_port: "port://integrity/evidence/inbound/evidence-management"

  - name: "InvalidEvidenceError"
    description: "Duplicity evidence is not valid — one or both events have invalid signatures"
    cause: "To be valid evidence, both events must have verifiable signatures against the key state at the claimed sn"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "prefix"
        type: "string"
        description: "The AID"
      - field: "sn"
        type: "integer"
        description: "The claimed sequence number"
      - field: "invalid_event"
        type: "string"
        description: "Which event has invalid signatures (event_a, event_b, or both)"
    related_port: "port://integrity/evidence/inbound/evidence-management"

  - name: "DELAppendError"
    description: "Failed to append evidence to the Duplicitous Event Log"
    cause: "Storage failure when attempting to permanently record duplicity evidence in the DEL store (.dels)"
    recovery: "retry"
    severity: "transient"
    context:
      - field: "prefix"
        type: "string"
        description: "The AID whose DEL failed to update"
    related_port: "port://integrity/evidence/outbound/escrow-storage"

  - name: "InsufficientEvidenceError"
    description: "Duplicity evidence contains fewer than two events"
    cause: "Valid duplicity evidence requires at least two events at the same (prefix, sn) with different SAIDs — only one event was provided"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "prefix"
        type: "string"
        description: "The AID"
      - field: "sn"
        type: "integer"
        description: "The claimed sequence number"
      - field: "event_count"
        type: "integer"
        description: "Number of events provided (must be >= 2)"
    related_port: "port://integrity/evidence/inbound/evidence-management"

  - name: "LDETimeoutError"
    description: "Likely Duplicitous Escrow entry exceeded the 3600-second timeout"
    cause: "A suspected duplicity entry in the LDE (.ldes) was not confirmed or resolved within the TTL and has been pruned"
    recovery: "abort"
    severity: "recoverable"
    context:
      - field: "prefix"
        type: "string"
        description: "The AID"
      - field: "sn"
        type: "integer"
        description: "The sequence number of the expired entry"
      - field: "age_seconds"
        type: "integer"
        description: "How long the entry was held before pruning"
    related_port: "port://integrity/evidence/outbound/escrow-storage"

  - name: "DuplicateEscrowError"
    description: "Event is already present in the Likely Duplicitous Escrow"
    cause: "The same conflicting event (same SAID) has already been escrowed in the LDE (.ldes) for this (prefix, sn) — duplicate submission"
    recovery: "abort"
    severity: "recoverable"
    context:
      - field: "prefix"
        type: "string"
        description: "The AID"
      - field: "sn"
        type: "integer"
        description: "The sequence number"
      - field: "event_said"
        type: "string"
        description: "The SAID of the already-escrowed event"
    related_port: "port://integrity/evidence/inbound/evidence-management"
    # L5-O10: These errors handle edge cases at the evidence-management boundary:
    # NotDuplicityError = same SAID (not a fork); DuplicateEscrowError = resubmission guard;
    # InvalidEvidenceError = signature verification failure. All are guard conditions, not contradictions.

  - name: "NotificationDeliveryError"
    description: "Failed to deliver a notification to one or more subscribers via internal coordination"
    cause: "A KeyEventAdded or other notification could not be delivered to a registered subscriber — subscriber may have been removed or is unresponsive"
    recovery: "retry"
    severity: "transient"
    context:
      - field: "notification_type"
        type: "string"
        description: "The type of notification that failed delivery"
      - field: "subscriber_count"
        type: "integer"
        description: "Number of subscribers that failed to receive the notification"
    related_port: "port://integrity/evidence/inbound/notification"
