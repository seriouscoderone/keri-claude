# domain.yaml
template_version: "1.0"
id: "integrity/evidence"
name: "Duplicity Evidence"
description: >
  Detection and storage of duplicitous events — fork detection, evidence collection, the Likely
  Duplicitous Escrow (temporary holding), and the Duplicitous Event Log (permanent forensic evidence).
  When an incoming event conflicts with an already-accepted event at the same (prefix, sn), this
  subdomain detects the fork, stages the evidence in the Likely Duplicitous Escrow,
  promotes confirmed duplicity to the Duplicitous Event Log, and triggers
  reprocessing of dependent components.
version: "0.1.0"

source_material:
  - type: document
    reference: "keri-specification.md — sections: Duplicity, First Seen Policy, Validation Rules"
  - type: document
    reference: "KERI_WP_2.x.web.md — sections: Duplicity Detection, Recovery"
  - type: implementation
    reference: "keripy — src/keri/core/eventing.py (Kevery.processEscrowLikelyDuplicitous), src/keri/app/storing.py (.ldes, .dels), src/keri/core/eventing.py (processCues, cues deque)"
  - type: implementation
    reference: "keriox — keriox_core/src/processor/escrow.rs (DuplicitousEvents escrow), keriox_core/src/processor/notification.rs (NotificationBus, KeyEventAdded)"

domain_clients:
  - ref: "domain://integrity"
    relationship: "Parent domain drives evidence collection when duplicity is suspected during event processing"
    via_port: "port://integrity/evidence/inbound/evidence-management"

subdomains: []

kernels:
  - ref: "kernel://keri-messaging"
    source: "domain://keri-messaging"
    relationship: "Publishes and consumes domain events for cross-domain coordination"

adjacents: []

externals:
  - ref: "external://persistence"
    source: "Escrow storage (Likely Duplicitous Escrow temporary, Duplicitous Event Log permanent)"
    relationship: "Evidence lifecycle requires persistent storage — temporary escrow with timeout for likely duplicitous events, permanent append-only storage for confirmed duplicity evidence"

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    Fork detection occurs when an incoming event at an occupied (prefix, sn) has a different
    digest than the accepted event. Likely duplicitous events are stored in a temporary escrow
    and processed by the escrow processing loop with a configurable timeout. Confirmed duplicity
    is promoted to the permanent Duplicitous Event Log.

    Internal coordination for escrow reprocessing is implementation-defined — the spec only requires that escrow reprocessing occurs when blocking conditions resolve.

issues: []

tags: ["evidence", "fork-detection", "escrow", "notification", "ldes", "dels"]
