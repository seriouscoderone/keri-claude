# ubiquitous-language.yaml
domain_ref: "integrity/evidence"

imports:
  - term: "Domain Event Bus"
    from: "domain://keri-messaging"
    usage: "Publishes domain events when significant state changes occur; consumes events to trigger escrow reprocessing"

terms:
  - term: "Duplicity Evidence"
    synonyms: ["Conflicting Events"]
    definition: "The pair of verified but different events at the same sequence number that proves duplicity occurred. Non-repudiable because both events bear valid signatures."
    invariants:
      - "Consists of at least two different verified events at the same sn for the same AID"
      - "Non-repudiable — the signatures on both events are cryptographic proof of duplicity"
      - "The controller is responsible for any duplicitous events signed by its keys"
      - "Evidence can be stored and presented to any party for independent verification"
    examples:
      - "Event A at sn=3 and Event B at sn=3, both signed by keys authorized at sn=2, but with different content"
    related_terms: ["Fork Detection", "Duplicitous Event Log", "Likely Duplicitous Escrow"]

  - term: "Fork Detection"
    synonyms: []
    definition: "The process of identifying when multiple events exist at the same (prefix, sequence number) with different digests. A fork is proof of controller duplicity — only the controller can sign events, so two valid events at the same sn means the controller signed both."
    invariants:
      - "A fork requires two events with the same AID prefix and sequence number but different SAIDs"
      - "Both events must have valid signatures against the key state at that sn"
      - "Only the controller holds signing keys, so a fork is non-repudiable evidence of duplicity (or key compromise)"
      - "Fork detection occurs during event processing when an incoming event conflicts with an already-accepted event"
      - "Detected forks trigger escrow to the Likely Duplicitous Escrow for further investigation"
    examples:
      - "Event E1 at (AID, sn=5) with SAID=X already accepted; Event E2 at (AID, sn=5) with SAID=Y arrives — fork detected"
      - "During event processing, an incoming event at an occupied sn with a different digest triggers duplicity handling"
    related_terms: ["Duplicity Evidence", "Likely Duplicitous Escrow"]

  - term: "Likely Duplicitous Escrow"
    synonyms: ["LDE"]
    definition: "Temporary storage for events that appear duplicitous but haven't been fully confirmed. Events land here when a fork is detected during event processing."
    invariants:
      - "Events are placed here when a conflicting event at the same (prefix, sn) is detected"
      - "Timeout: 3600 seconds — escrowed events are pruned after expiry"
      - "Events may be promoted to the confirmed Duplicitous Event Log (DEL) after investigation"
      - "Distinguished from the DEL — LDE holds suspected duplicity, DEL holds confirmed duplicity"
    examples:
      - "An event at sn=5 arrives that conflicts with the accepted event at sn=5 — placed in the Likely Duplicitous escrow for investigation"
      - "After timeout or confirmation, event is either promoted to the DEL or pruned"
    related_terms: ["Fork Detection", "Duplicitous Event Log", "Duplicity Evidence"]

  - term: "Duplicitous Event Log"
    synonyms: ["DEL"]
    definition: "Permanent storage of confirmed duplicitous events. Unlike other escrows, entries are never automatically deleted — they serve as forensic evidence of controller misbehavior. Stored separately from the valid KEL."
    invariants:
      - "Contains confirmed duplicitous events — events verified as forks at the same (prefix, sn)"
      - "Entries are never automatically pruned or timed out — they are permanent evidence"
      - "Stored separately from the KEL — the DEL is a forensic log, not an event history"
      - "Distinct from the Likely Duplicitous Escrow (LDE) which holds suspected duplicity"
      - "Used by judges and watchers to make trust decisions"
    examples:
      - "Two confirmed conflicting rotation events at sn=3, both with valid signatures — stored permanently in the DEL"
      - "A judge queries the DEL for an AID and finds confirmed duplicity evidence — revokes trust"
    related_terms: ["Likely Duplicitous Escrow", "Fork Detection", "Duplicity Evidence"]

events:
  - name: "ForkDetected"
    payload: "aid: AID, sn: int, accepted_event: KeyEvent, conflicting_event: KeyEvent"
    triggers: "An incoming event at an already-occupied (prefix, sn) has a different SAID than the accepted event"

  - name: "EvidenceEscrowed"
    payload: "aid: AID, sn: int, conflicting_event: KeyEvent"
    triggers: "A detected fork causes the conflicting event to be placed in the Likely Duplicitous Escrow"

  - name: "EvidencePromoted"
    payload: "aid: AID, sn: int, evidence: DuplicityEvidence"
    triggers: "Likely duplicitous evidence is confirmed and promoted from the Likely Duplicitous Escrow to the permanent DEL"

  - name: "EvidenceExpired"
    payload: "aid: AID, sn: int, conflicting_event: KeyEvent"
    triggers: "A likely duplicitous escrow entry exceeds its 3600s timeout and is pruned"

  - name: "KeyEventAdded"
    payload: "aid: AID, sn: int, digest: SAID"
    triggers: "An event is accepted into the KEL — triggers escrow reprocessing of dependent events"

rules:
  - "A fork at (prefix, sn) is non-repudiable evidence of duplicity — only the controller can sign events"
  - "Likely duplicitous events are escrowed for 3600 seconds before being pruned or promoted"
  - "Confirmed duplicity evidence in the DEL is never automatically deleted — it is permanent forensic record"
  - "Event acceptance triggers downstream evidence processing — implementations decouple this via internal coordination mechanisms"
  - "Fork detection compares SAIDs, not event content — different SAIDs at the same (prefix, sn) is sufficient"
