# ports.yaml
domain_ref: "integrity/evidence"

ports:
  # Inbound — what clients call
  - id: "port://integrity/evidence/inbound/evidence-management"
    type: inbound
    name: "Evidence Management"
    contract: "detect_fork(aid: AID, sn: int, incoming_event: KeyEvent, accepted_event: KeyEvent) -> ForkDetected; escrow_likely_duplicitous(aid: AID, sn: int, event: KeyEvent) -> Escrowed; promote_to_del(aid: AID, sn: int, evidence: DuplicityEvidence) -> Promoted; get_evidence(aid: AID) -> [DuplicityEvidence]"
    protocol: "method-call"
    refs: ["domain://integrity"]

  - id: "port://integrity/evidence/inbound/notification"
    type: inbound
    name: "Internal Coordination"
    contract: "subscribe(notification_type: NotificationType, observer: Observer) -> Subscription; notify(notification: Notification) -> void; drain_cues() -> [Cue]"
    protocol: "pub-sub"
    refs: ["domain://integrity"]

  # Outbound — Repository interface for persistence
  - id: "port://integrity/evidence/outbound/escrow-storage"
    type: outbound
    name: "Duplicity Evidence Repository"
    contract: >
      escrow_likely_duplicitous(aid: AID, sn: int, event: KeyEvent, escrowed_at: datetime) -> void;
      get_likely_duplicitous(aid: AID) -> [KeyEvent];
      prune_expired(max_age_seconds: int) -> int;
      record_duplicity_evidence(aid: AID, sn: int, evidence: DuplicityEvidence) -> void;
      get_duplicity_evidence(aid: AID) -> [DuplicityEvidence]
    protocol: "repository"
    refs: ["persistence"]
    invariants:
      - "Likely-duplicitous escrow is temporary — events are promoted to confirmed evidence or pruned at timeout"
      - "Confirmed duplicity evidence is append-only — once recorded, it is permanent"
      - "prune_expired removes all escrowed events older than max_age_seconds and returns the count removed"
      - "Duplicity evidence pairs the conflicting events at the same AID and sequence number"
