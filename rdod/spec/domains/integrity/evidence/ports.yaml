# ports.yaml
domain_ref: "integrity/evidence"

ports:
  # Inbound — what clients call
  - id: "port://integrity/evidence/inbound/evidence-management"
    type: inbound
    name: "Evidence Management"
    semantics: command
    idempotent: false
    contract:
      input: "types://integrity/evidence#ForkDetected"
      output: "types://integrity/detection#DuplicityEvidence"
      errors:
        - "errors://integrity/evidence#NotDuplicityError"
        - "errors://integrity/evidence#InvalidEvidenceError"
        - "errors://integrity/evidence#InsufficientEvidenceError"
        - "errors://integrity/evidence#DuplicateEscrowError"
    refs: ["domain://integrity"]

  - id: "port://integrity/evidence/inbound/notification"
    type: inbound
    name: "Internal Coordination"
    semantics: event
    idempotent: false
    contract:
      input: "types://integrity/evidence#NotificationType"
      output: "types://integrity/evidence#NotificationType"
      errors:
        - "errors://integrity/evidence#NotificationDeliveryError"
    refs: ["domain://integrity"]

  # Outbound — Repository interface for persistence
  - id: "port://integrity/evidence/outbound/escrow-storage"
    type: outbound
    name: "Duplicity Evidence Repository"
    semantics: command
    idempotent: false
    contract:
      input: "types://integrity/detection#DuplicityEvidence"
      output: "types://integrity#DuplicityEventLog"
      errors:
        - "errors://integrity/evidence#DELAppendError"
        - "errors://integrity/evidence#LDETimeoutError"
    refs: ["persistence"]
    invariants:
      - "Likely-duplicitous escrow is temporary — events are promoted to confirmed evidence or pruned at timeout"
      - "Confirmed duplicity evidence is append-only — once recorded, it is permanent"
      - "prune_expired removes all escrowed events older than max_age_seconds and returns the count removed"
      - "Duplicity evidence pairs the conflicting events at the same AID and sequence number"
