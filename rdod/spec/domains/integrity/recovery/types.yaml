domain_ref: "integrity/recovery"

types:
  - name: "SupersedingRecoveryEvent"
    description: "A rotation event that recovers from detected duplicity by superseding the compromised key state. Uses pre-rotation keys committed before the compromise."
    variants:
      - name: "default"
        fields:
          - name: "rotation_event"
            type: "types://identity/establishment#RotationEvent"
            required: true
            description: "The recovery rotation event (rot or drt)"
          - name: "recovery_sn"
            type: "integer"
            required: true
            description: "The sequence number where recovery occurs — must be >= fork point"
          - name: "fork_point_sn"
            type: "integer"
            required: true
            description: "The sequence number where the KEL forked (duplicity began)"
        invariants:
          - "recovery_sn >= fork_point_sn — can recover at or after the fork"
          - "Recovery keys must match pre-rotation commitments from the LAST establishment event BEFORE the fork"
          - "Superseding rotation has priority over the forked branch because it uses authentic pre-rotated keys"
          - "After recovery, all events from the forked branch at sn >= fork_point are invalidated"

  - name: "SupersedingRule"
    description: "The canonical superseding recovery rule enum — defines when a new event can displace an existing one in the KEL. A-rules (non-delegated), B-rules (delegated), and C/C1 (recursive delegation). This is the single source of truth; delegation/recovery imports these rules."
    variants:
      - name: "A0"
        fields: []
        invariants:
          - "Any rotation event may supersede an interaction event at the same sn where that interaction event is not before any other rotation event — this enables recovery of live exploit"
      - name: "A1"
        fields: []
        invariants:
          - "A non-delegated rotation may not supersede another rotation at the same sn"
      - name: "A2"
        fields: []
        invariants:
          - "An interaction event may not supersede any event"
      - name: "B1"
        fields: []
        invariants:
          - "The superseding rotation's delegating event has a higher sn in the delegator's KEL than the superseded event's delegating event — comparison uses sn (sequence number), NOT fn (first-seen number); sn is protocol-assigned and produces universal agreement"
      - name: "B2"
        fields: []
        invariants:
          - "Both delegations appear in the same delegating event, and the superseding seal appears later in the seal list"
      - name: "B3"
        fields: []
        invariants:
          - "The superseding rotation's delegating event is a rotation AND the superseded rotation's delegating event is an interaction, at the same sn in the delegator's KEL — this is an event-type comparison, NOT a SAID lexicographic tiebreaker"
      - name: "C"
        fields: []
        invariants:
          - "Recursive application up the delegation chain: (1) at current level, attempt A or B rules; (2) if neither satisfied, move up to the delegator's KEL and compare delegating events using A and B; (3) repeat until satisfied or root non-delegated KEL reached; (4) at root, only A-rules apply"
      - name: "C1"
        fields: []
        invariants:
          - "Termination rule: if recursion reaches the root non-delegated KEL without resolution, the superseding rotation is discarded — the incumbent (first-seen) wins"

  - name: "NotSuperseding"
    description: "Result when a superseding check determines the candidate event does NOT supersede the existing one."
    variants:
      - name: "default"
        fields:
          - name: "rule_checked"
            type: "string"
            required: true
            description: "The superseding rule that was evaluated (e.g., A1, B2, C)"
          - name: "reason"
            type: "string"
            required: true
            description: "Why the candidate event does not supersede"
        invariants:
          - "The existing event remains authoritative"
          - "The candidate event may be escrowed or discarded depending on context"

  - name: "DisputedBranch"
    description: "A branch of events displaced by superseding recovery — equivalent to types://integrity#DisputedBranch."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "The AID whose KEL forked"
          - name: "fork_sn"
            type: "integer"
            required: true
            description: "Sequence number where the branch diverges from the authoritative KEL"
          - name: "branch_events"
            type: "array[string]"
            required: true
            description: "SAIDs of the events on the displaced branch, in order"
        invariants:
          - "All events are from sn >= fork_sn"
          - "Branch events are retained in the DEL, not discarded"

  - name: "SupersedingRecovery"
    description: "The mechanism by which a legitimate Controller replaces a previously accepted event at the same sequence number with a Rotation Event, forking the KEL. The superseded events go to a Disputed Branch; the superseding events form the new Trunk."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "AID of the identifier being recovered"
          - name: "superseding_sn"
            type: "integer"
            required: true
            description: "Sequence number at which the superseding rotation is placed"
          - name: "rule_applied"
            type: "types://integrity/recovery#SupersedingRule"
            required: true
            description: "The superseding rule that authorized this recovery"
        invariants:
          - "Can only supersede the latest-seen event at a given sn"
          - "Governed by formal Superseding Rules (A, B, C)"

  - name: "Reconciliation"
    description: "The process of determining the undisputed path (Trunk) through a KEL after Superseding Recovery has created forks. A KEL is reconcilable when every Validator can find the same Trunk."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "AID of the identifier whose KEL is being reconciled"
          - name: "trunk_tip_sn"
            type: "integer"
            required: true
            description: "Sequence number of the tip of the reconciled trunk"
          - name: "disputed_branches"
            type: "array[types://integrity/recovery#DisputedBranch]"
            required: true
            description: "All disputed branches displaced during reconciliation"
        invariants:
          - "Reconciliation produces exactly one trunk — the undisputed path"
          - "All events not on the trunk are in disputed branches"
          - "If no universal trunk can be determined, the KEL is irreconcilable"

  - name: "Trunk"
    description: "The authoritative branch of a KEL after Superseding Recovery (also known as the Undisputed Path). Events on the Trunk are the accepted, non-superseded events."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "AID of the identifier"
          - name: "events"
            type: "array[string]"
            required: true
            description: "SAIDs of the events on the trunk, in sequence order"
        invariants:
          - "There is exactly one trunk per KEL"
          - "Superseding events create the trunk by displacing compromised events to branches"
          - "All events not on the trunk are in disputed branches"

  - name: "SQAR"
    description: "Surprise Quantum Attack Recovery — pre-positioning quantum-resistant key commitments so that recovery from a future quantum computing attack is possible without advance warning. Uses Reserve Keys from pre-rotation commitments."
    variants:
      - name: "default"
        fields:
          - name: "reserve_key_digests"
            type: "array[string]"
            required: true
            description: "Digests of quantum-resistant reserve keys committed in prior establishment events"
            constraints:
              min_length: 1
          - name: "commitment_sn"
            type: "integer"
            required: true
            description: "Sequence number of the establishment event where the reserve keys were committed"
        invariants:
          - "Reserve keys must be committed BEFORE the quantum attack — post-hoc commitment is useless"
          - "Uses the same pre-rotation mechanism but with quantum-resistant key types"
          - "Recovery is possible only if the attacker has not also compromised the reserve keys"
