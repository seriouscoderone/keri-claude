domain_ref: "integrity/recovery"

types:
  - name: "SupersedingRecoveryEvent"
    description: "A rotation event that recovers from detected duplicity by superseding the compromised key state. Uses pre-rotation keys committed before the compromise."
    variants:
      - name: "default"
        fields:
          - name: "rotation_event"
            type: "types://identity/establishment#RotationEvent"
            required: true
            description: "The recovery rotation event (rot or drt)"
          - name: "recovery_sn"
            type: "integer"
            required: true
            description: "The sequence number where recovery occurs — must be >= fork point"
          - name: "fork_point_sn"
            type: "integer"
            required: true
            description: "The sequence number where the KEL forked (duplicity began)"
        invariants:
          - "recovery_sn >= fork_point_sn — can recover at or after the fork"
          - "Recovery keys must match pre-rotation commitments from the LAST establishment event BEFORE the fork"
          - "Superseding rotation has priority over the forked branch because it uses authentic pre-rotated keys"
          - "After recovery, all events from the forked branch at sn >= fork_point are invalidated"

  - name: "SupersedingRule"
    description: "The specific superseding recovery rule being applied — each rule defines when a new event can displace an existing one in the KEL. Rules A0-A2 apply to non-delegated identifiers; B1-B3 apply to delegated identifiers; C applies recursively up the delegation chain."
    variants:
      - name: "A0"
        fields: []
        invariants:
          - "Any rotation event may supersede an interaction event at the same sn where that interaction event is not before any other rotation event — this enables recovery of live exploit"
      - name: "A1"
        fields: []
        invariants:
          - "A non-delegated rotation may not supersede another rotation at the same sn"
      - name: "A2"
        fields: []
        invariants:
          - "An interaction event may not supersede any event"
      - name: "B1"
        fields: []
        invariants:
          - "The superseding rotation's delegating event has a higher sn in the delegator's KEL than the superseded event's delegating event"
      - name: "B2"
        fields: []
        invariants:
          - "Both delegations appear in the same delegating event, and the superseding seal appears later in the seal list"
      - name: "B3"
        fields: []
        invariants:
          - "Same delegating sn, but the superseding delegation's event is a rotation and the superseded's is an interaction"
      - name: "C"
        fields: []
        invariants:
          - "Recursive application up the delegation chain to the root undelegated KEL — delegated superseding is resolved by applying the non-delegated rules at each level"

  - name: "NotSuperseding"
    description: "Result when a superseding check determines the candidate event does NOT supersede the existing one."
    variants:
      - name: "default"
        fields:
          - name: "rule_checked"
            type: "string"
            required: true
            description: "The superseding rule that was evaluated (e.g., A1, B2, C)"
          - name: "reason"
            type: "string"
            required: true
            description: "Why the candidate event does not supersede"
        invariants:
          - "The existing event remains authoritative"
          - "The candidate event may be escrowed or discarded depending on context"

  - name: "DisputedBranch"
    description: "A branch of events displaced by superseding recovery — equivalent to types://integrity#DisputedBranch."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "The AID whose KEL forked"
          - name: "fork_sn"
            type: "integer"
            required: true
            description: "Sequence number where the branch diverges from the authoritative KEL"
          - name: "branch_events"
            type: "array[string]"
            required: true
            description: "SAIDs of the events on the displaced branch, in order"
        invariants:
          - "All events are from sn >= fork_sn"
          - "Branch events are retained in the DEL, not discarded"
