# ports.yaml
domain_ref: "integrity/recovery"

ports:
  # Inbound — what clients call
  - id: "port://integrity/recovery/inbound/superseding-rules"
    type: inbound
    name: "Superseding Rules"
    semantics: query
    idempotent: true
    contract:
      input: "types://integrity#SupersedingRecoveryEvent"
      output: "types://integrity/recovery#SupersedingRule"
      errors:
        - "errors://integrity/recovery#InvalidRecoveryRotationError"
        - "errors://integrity/recovery#RecoveryNotPossibleError"
    refs: ["domain://integrity"]

  - id: "port://integrity/recovery/inbound/reconciliation"
    type: inbound
    name: "Reconciliation"
    semantics: command
    idempotent: false
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://integrity/recovery#DisputedBranch"
      errors:
        - "errors://integrity/recovery#IrreconcilableError"
        - "errors://integrity/recovery#SupersedingConflictError"
    refs: ["domain://integrity"]
