# domain.yaml
template_version: "2.0"
id: "integrity/recovery"
name: "Superseding Recovery"
description: >
  The mechanics of recovering from key compromise via superseding rotation. Defines the superseding
  rules (A0-A2 for non-delegated, B1-B3 for delegated, C for recursive delegation), the
  reconciliation process that determines the authoritative trunk, and the trunk/disputed-branch
  model that preserves both the recovered path and the forensic record of compromised events.
  This is pure protocol logic — no cryptography, no persistence, no networking.
version: "0.1.0"
tier: "domain"

source_material:
  - type: document
    reference: "keri-specification.md — sections: Superseding Recovery and Reconciliation, Superseding Rules, Dead-Attacks, Live-Attacks"
  - type: document
    reference: "KERI_WP_2.x.web.md — sections: Recovery, Superseding Rotation"
  - type: document
    reference: "KERI_SecurityDeepDive.web.md — sections: Survivability, Superseding Recovery"

domain_clients:
  - ref: "domain://integrity"
    relationship: "Parent domain invokes superseding recovery when a validator receives a superseding rotation event"
    via_port: "port://integrity/recovery/inbound/superseding-rules"

subdomains: []

kernels: []

adjacents:
  - ref: "domain://integrity/detection"
    relationship: "Recovery consumes DuplicityNotice events from detection as inbound triggers — detection only detects duplicity and emits evidence; recovery evaluates whether superseding is possible and executes it"

externals: []

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    This is a leaf domain — pure protocol logic with no kernel or external dependencies.
    The superseding rules define an ordering relation over events at the same sn. In keripy,
    the superseding logic is embedded in Kevery's event processing pipeline. In keriox, it is
    part of the validator module. Reconciliation applies the superseding rules to determine
    which path through the KEL DAG is the undisputed trunk. The trunk/disputed-branch model
    is a logical partitioning — implementations may store both paths and mark branch membership.

issues: []

tags: ["recovery", "superseding", "reconciliation", "trunk", "disputed-branch", "protocol-logic"]
