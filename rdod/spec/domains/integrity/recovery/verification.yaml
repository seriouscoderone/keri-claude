# verification.yaml
domain_ref: "integrity/recovery"

properties:
  - invariant: "Superseding Rule A0 (Authority): when two competing events exist at the same sn, the event signed by authentic pre-rotated keys (matching the last establishment event's next key commitments) takes precedence over the event signed by compromised keys. Pre-rotation authority is the ultimate arbiter — it cannot be overridden by witness count, first-seen ordering, or any other criterion."
    term: "Superseding Recovery"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=keri_prefix_strategy(), sn=st.integers(min_value=1, max_value=100))
        def test_rule_a0_authority(prefix, sn):
            rot = build_rotation_event(prefix, sn)
            ixn = build_interaction_event(prefix, sn)
            # Pre-rotation authority: rot supersedes ixn
            assert can_supersede(rot, ixn), (
                f"Rule A0: rot at sn={sn} MUST supersede ixn at sn={sn} — "
                f"pre-rotation authority is the ultimate arbiter"
            )
            # Inverse MUST NOT hold — ixn cannot override rot
            assert not can_supersede(ixn, rot), (
                f"Rule A0: ixn MUST NOT supersede rot — "
                f"pre-rotation authority cannot be overridden"
            )
            # A0 cannot be overridden by witness count
            ixn_high_witness = build_interaction_event(prefix, sn, witness_count=100)
            rot_low_witness = build_rotation_event(prefix, sn, witness_count=1)
            assert can_supersede(rot_low_witness, ixn_high_witness), (
                "Rule A0: pre-rotation authority overrides witness count"
            )
            # A0 cannot be overridden by first-seen ordering
            assert can_supersede(rot, ixn), (
                "Rule A0: pre-rotation authority overrides first-seen ordering"
            )
    strategy: "keri_prefix_strategy() x st.integers for sn"
    notes: "Rule A0: pre-rotation authority is the ultimate arbiter. Cannot be overridden by witness count, first-seen ordering, or any other criterion."

  - invariant: "Rule A1: A non-delegated rotation MUST NOT supersede another non-delegated rotation at the same sn; if both candidate and incumbent are non-delegated rotations, the result MUST be NotSuperseding (the fork is irreconcilable)"
    term: "Superseding Rules"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=keri_prefix_strategy(), sn=st.integers(min_value=1, max_value=100))
        def test_rule_a1_rot_vs_rot_irreconcilable(prefix, sn):
            rot_a = build_rotation_event(prefix, sn, is_delegated=False)
            rot_b = build_rotation_event(prefix, sn, is_delegated=False)
            assume(rot_a.said != rot_b.said)
            assert not can_supersede(rot_a, rot_b), (
                "Rule A1: non-delegated rot must NOT supersede another non-delegated rot"
            )
            assert not can_supersede(rot_b, rot_a), (
                "Rule A1 is symmetric for non-delegated rotations"
            )
    strategy: "keri_prefix_strategy() x st.integers for sn"
    notes: "Non-delegated rotation vs rotation fork is irreconcilable — no superseding possible."

  - invariant: "Rule A2: An interaction event (ixn) MUST NOT supersede any event type; apply_superseding_rules(ixn, any_event) MUST always return NotSuperseding regardless of the incumbent's type"
    term: "Superseding Rules"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(incumbent_type=st.sampled_from(['icp', 'rot', 'ixn', 'dip', 'drt']),
               sn=st.integers(min_value=0, max_value=100))
        def test_rule_a2_ixn_never_supersedes(incumbent_type, sn):
            prefix = generate_prefix()
            ixn = build_interaction_event(prefix, sn)
            incumbent = build_event(prefix, sn, event_type=incumbent_type)
            assert not can_supersede(ixn, incumbent), (
                f"Rule A2: ixn must NOT supersede {incumbent_type} at any sn"
            )
    strategy: "st.sampled_from for all event types x st.integers for sn"
    notes: "Interaction events have no key commitment — they can never supersede any event type."

  - invariant: "Superseding decision cascade: B1 (higher delegating sn wins) -> B2 (same delegating event, later seal index wins) -> B3 (same delegating sn, rotation delegating event supersedes interaction delegating event) -> if none satisfied, apply Rule C (recurse up delegation chain). B3 is an event-type comparison, NOT a SAID lexicographic tiebreaker."
    term: "Superseding Rules"
    technique: smt
    formal:
      language: z3
      expression: |
        # B1: higher delegating sn wins (comparison uses sn, not fn)
        b1 = Implies(And(is_delegated(candidate), is_delegated(incumbent),
                         delegating_sn(candidate) > delegating_sn(incumbent)),
                     supersedes(candidate, incumbent))
        # B2: same delegating sn, later seal index wins
        b2 = Implies(And(is_delegated(candidate), is_delegated(incumbent),
                         delegating_sn(candidate) == delegating_sn(incumbent),
                         seal_index(candidate) > seal_index(incumbent)),
                     supersedes(candidate, incumbent))
        # B3: same delegating sn — rotation delegating event supersedes interaction delegating event
        b3 = Implies(And(is_delegated(candidate), is_delegated(incumbent),
                         delegating_sn(candidate) == delegating_sn(incumbent),
                         delegating_type(candidate) == ROT,
                         delegating_type(incumbent) == IXN),
                     supersedes(candidate, incumbent))
        # If B1-B3 produce no winner, Rule C applies (recurse up delegation chain)
        # If recursion reaches root without resolution, C1 applies (discard superseding rotation)
    notes: "Decision cascade: B1 (delegating sn) -> B2 (seal index) -> B3 (event-type: rot beats ixn). If no B rule resolves, recurse via Rule C. B3 is NOT a SAID tiebreaker."

  - invariant: "B2: Same delegating event, but superseding seal appears later in the seal list"
    term: "Superseding Rules"
    technique: smt
    formal:
      language: z3
      expression: "Implies(And(is_delegated(candidate), is_delegated(incumbent), delegating_sn(candidate) == delegating_sn(incumbent), seal_index(candidate) > seal_index(incumbent)), supersedes(candidate, incumbent))"
    notes: "Rule B2 uses seal ordering within the same delegating event — position in the seal list breaks ties"

  - invariant: "B3: Same sn delegating events, but superseding event's delegating event is a rotation superseding the superseded event's delegating interaction"
    term: "Superseding Rules"
    technique: smt
    formal:
      language: z3
      expression: "Implies(And(is_delegated(candidate), is_delegated(incumbent), delegating_sn(candidate) == delegating_sn(incumbent), delegating_type(candidate) == ROT, delegating_type(incumbent) == IXN), supersedes(candidate, incumbent))"
    notes: "Rule B3 applies rule A0 recursively — a rot in the delegator's KEL supersedes an ixn at the same sn"

  - invariant: "Reconciliation MUST produce exactly one trunk (the undisputed path). Zero-trunk error: reconciliation produced zero trunks — this is a fatal implementation bug indicating the reconciliation algorithm failed to identify any undisputed path. MUST raise ReconciliationError with context {prefix, sn_range, evidence_count}. Multi-trunk error: reconciliation produced multiple trunks — this is a fatal implementation bug indicating the decision cascade is not total. MUST raise ReconciliationError with context {prefix, trunk_count, competing_saids}."
    term: "Trunk"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel_dag=kel_dag_strategy())
        def test_exactly_one_trunk(kel_dag):
            trunks = find_trunks(kel_dag)
            if len(trunks) == 0:
                raise ReconciliationError(
                    "Zero trunks: fatal implementation bug — no undisputed path found",
                    context={
                        'prefix': kel_dag.prefix,
                        'sn_range': (kel_dag.min_sn, kel_dag.max_sn),
                        'evidence_count': len(kel_dag.all_events)
                    }
                )
            if len(trunks) > 1:
                raise ReconciliationError(
                    "Multiple trunks: fatal implementation bug — decision cascade is not total",
                    context={
                        'prefix': kel_dag.prefix,
                        'trunk_count': len(trunks),
                        'competing_saids': [t.events[-1].said for t in trunks]
                    }
                )
            assert len(trunks) == 1, (
                f"Reconciliation MUST produce exactly 1 trunk, got {len(trunks)}"
            )
            # Trunk must start from inception (sn=0)
            assert trunks[0].events[0].sn == 0, "Trunk must start from inception"
            # Trunk events must be in strictly ascending sn order
            for i in range(len(trunks[0].events) - 1):
                assert trunks[0].events[i].sn < trunks[0].events[i + 1].sn
    strategy: "kel_dag_strategy()"
    notes: "Zero trunks = fatal bug (no path). Multiple trunks = fatal bug (cascade not total). Both MUST raise ReconciliationError with diagnostic context."

  - invariant: "Recovery audit trail: superseded events are preserved in the KEL database indexed by their first-seen ordinal (fn). They are NOT in the active KEL (the trunk) but are queryable via fn-indexed access. Storage guarantee: superseded events MUST NOT be deleted — they serve as permanent forensic evidence that recovery occurred."
    term: "Disputed Branch"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel_dag=kel_dag_with_branches_strategy())
        def test_recovery_audit_trail(kel_dag):
            branches = find_disputed_branches(kel_dag)
            trunk = get_trunk(kel_dag)
            for branch in branches:
                for event in branch.events:
                    # Superseded events MUST still exist in storage
                    assert event_exists(kel_dag, event), (
                        f"Superseded event {event.said} at sn={event.sn} MUST NOT be deleted — "
                        f"permanent forensic evidence of recovery"
                    )
                    # Superseded events are NOT in the active KEL (trunk)
                    assert event not in trunk.events, (
                        f"Superseded event {event.said} MUST NOT be on the trunk"
                    )
                    # Superseded events are queryable by first-seen ordinal (fn)
                    assert event.fn is not None, (
                        f"Superseded event MUST have a first-seen ordinal (fn)"
                    )
                    fn_lookup = kel_dag.get_by_fn(event.fn)
                    assert fn_lookup is not None and fn_lookup.said == event.said, (
                        f"Superseded event MUST be queryable via fn-indexed access"
                    )
    strategy: "kel_dag_with_branches_strategy() containing at least one disputed branch"
    notes: "Superseded events: off the trunk, queryable by fn, MUST NOT be deleted. Permanent forensic evidence of recovery."

  - invariant: "A superseding rotation's prior event reference (p field) MUST reference the SAID of the event at sn-1 on the trunk, NOT the SAID of the superseded event. Both the superseded and superseding events share the same parent — they diverge from the same point in the identity log."
    term: "Superseding Recovery"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(recovery=superseding_recovery_strategy())
        def test_superseding_rotation_prior_event_reference(recovery):
            trunk = get_trunk(recovery.kel_dag)
            parent_event = trunk.event_at_sn(recovery.sn - 1)
            # Superseding rotation's p field references the parent on the trunk
            assert recovery.superseding_event.prior_event_said == parent_event.said, (
                f"Superseding rotation's prior event reference MUST be the SAID of "
                f"the event at sn-1 on the trunk ({parent_event.said}), "
                f"not the SAID of the superseded event ({recovery.superseded_event.said})"
            )
            # Superseded event also references the same parent
            assert recovery.superseded_event.prior_event_said == parent_event.said, (
                f"Both superseded and superseding events MUST share the same parent "
                f"at sn-1 ({parent_event.said})"
            )
    strategy: "superseding_recovery_strategy()"
    notes: "The p field anchors both competing events to the same parent. The fork is at sn, not sn-1."

  - invariant: "After superseding recovery, the superseded event MUST be moved off the trunk to a disputed branch; the superseding event MUST take its place on the trunk; the superseded event MUST still exist in storage (not deleted)"
    term: "Superseding Recovery"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(recovery=superseding_recovery_strategy())
        def test_superseding_moves_event_to_branch(recovery):
            kel_dag = apply_superseding(recovery)
            trunk = get_trunk(kel_dag)
            all_events = get_all_events(kel_dag)
            # Superseded event is off trunk but still exists
            assert recovery.superseded_event not in trunk.events, (
                "Superseded event must be removed from trunk"
            )
            assert recovery.superseded_event in all_events, (
                "Superseded event must still exist in storage"
            )
            # Superseding event is on trunk
            assert recovery.superseding_event in trunk.events, (
                "Superseding event must be on the trunk"
            )
    strategy: "superseding_recovery_strategy()"
    notes: "Superseding moves the displaced event to a disputed branch — it is never deleted."

contracts:
  - port_ref: "port://integrity/recovery/inbound/superseding-rules"
    preconditions:
      - formal:
          language: python
          expression: "lambda candidate, incumbent: candidate.sn == incumbent.sn and candidate.aid == incumbent.aid and candidate.said != incumbent.said"
        description: "Candidate and incumbent must be at the same (aid, sn) with different SAIDs"
    postconditions:
      - formal:
          language: python
          expression: "lambda candidate, incumbent, result: result.is_superseding() implies (candidate.type == 'rot' or candidate.type == 'drt')"
        description: "Only rotation events (rot, drt) can supersede — interaction events never produce a Supersedes result"
      - formal:
          language: python
          expression: "lambda candidate, incumbent, result: (candidate.type == 'ixn') implies result == NotSuperseding"
        description: "Rule A2: interaction events always return NotSuperseding"
      - formal:
          language: python
          expression: "lambda candidate, incumbent, result: (candidate.type == 'rot' and incumbent.type == 'rot' and not candidate.is_delegated) implies result == NotSuperseding"
        description: "Rule A1: non-delegated rotation vs rotation always returns NotSuperseding"

  - port_ref: "port://integrity/recovery/inbound/reconciliation"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid, kel_dag: aid is not None and kel_dag.has_events_for(aid)"
        description: "AID must be valid and the KEL DAG must contain events for it"
      - formal:
          language: python
          expression: "lambda aid, kel_dag: any(len(kel_dag.events_at_sn(aid, sn)) >= 2 and len(set(e.said for e in kel_dag.events_at_sn(aid, sn))) >= 2 for sn in kel_dag.sn_range(aid))"
        description: "At least two events with different SAIDs must exist at some sn for this AID — reconciliation requires a genuine fork to resolve"
    postconditions:
      - formal:
          language: python
          expression: "lambda result: result.is_trunk() implies (len(result.events) >= 1 and result.events[0].sn == 0)"
        description: "A valid trunk starts from the inception event (sn=0)"
      - formal:
          language: python
          expression: "lambda result: result.is_trunk() implies all(result.events[i].sn < result.events[i+1].sn for i in range(len(result.events)-1))"
        description: "Trunk events are in strictly ascending sequence number order"

state_machines:
  - name: "superseding-recovery"
    term: "Superseding Recovery"
    states: ["intact", "compromised", "fork-detected", "conflict-detected", "recovery-applied", "reconciled", "irreconcilable"]
    transitions:
      - from: "intact"
        to: "compromised"
        trigger: "Key compromise detected — attacker signs conflicting event"
        guard: "Attacker has access to signing keys or pre-rotated keys"
      - from: "compromised"
        to: "fork-detected"
        trigger: "ForkDetected — conflicting events at same (aid, sn) discovered"
        guard: "Two verified events with different SAIDs at the same (aid, sn)"
      - from: "fork-detected"
        to: "recovery-applied"
        trigger: "SupersedingRecoveryApplied — rotation supersedes compromised event"
        guard: "Superseding rules (A0, B1-B3, C) are satisfied for the candidate rotation"
      - from: "fork-detected"
        to: "conflict-detected"
        trigger: "CompetingRecoveryDetected — two valid recovery rotations at same sn"
        guard: "Two valid competing recovery rotations exist at the same sn for this AID"
      - from: "conflict-detected"
        to: "reconciled"
        trigger: "JudgeAdjudicated — judge adjudicates in favor of one branch"
        guard: "Judge adjudicates in favor of one branch using superseding rules (B1-B3, C)"
      - from: "conflict-detected"
        to: "irreconcilable"
        trigger: "NoValidResolution — no superseding rule can resolve the conflict"
        guard: "No valid resolution possible (e.g., two non-delegated rotations per rule A1)"
      - from: "recovery-applied"
        to: "reconciled"
        trigger: "TrunkReconciled — validators determine the new trunk"
        guard: "All validators find the same trunk via superseding rules"
      - from: "fork-detected"
        to: "irreconcilable"
        trigger: "Reconciliation fails — no universal trunk can be determined"
        guard: "Superseding rules cannot determine a unique winner between the forked events"
    invariants:
      - "A non-delegated rotation vs rotation fork is always irreconcilable (rule A1)"
      - "Recovery is only possible if the controller has access to uncommitted pre-rotated keys"
      - "The controller remains accountable for harm caused by events on disputed branches even after recovery"
      - "Once reconciled, the trunk is the single authoritative path forward"
    initial_state: "intact"
    terminal_states: ["reconciled", "irreconcilable"]
