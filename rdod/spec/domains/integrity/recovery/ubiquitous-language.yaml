# ubiquitous-language.yaml
domain_ref: "integrity/recovery"

terms:
  - term: "Superseding Recovery"
    synonyms: ["Recovery", "Superseding Rotation"]
    definition: "The process of recovering control of a KEL after key compromise by issuing a rotation event that supersedes a compromised event at the same sequence number. Creates a fork with a recovered trunk and a disputed branch."
    invariants:
      - "A rotation event can supersede an interaction event at the same sn (rule A0)"
      - "A non-delegated rotation cannot supersede another rotation (rule A1)"
      - "An interaction event cannot supersede any event (rule A2)"
      - "Delegated rotations have additional superseding rules (B1, B2, B3) involving delegator approval ordering"
      - "Superseded events are shunted to a disputed branch — they still exist but are no longer on the trunk"
      - "The controller is still accountable for harm caused by compromised events"
    examples:
      - "Attacker signs a fraudulent ixn at sn=5. Controller issues rot at sn=5 using pre-committed keys — the rot supersedes the ixn"
      - "After superseding, the KEL forks: trunk continues from the recovery rotation, disputed branch contains the compromised events"
    related_terms: ["Superseding Rules", "Reconciliation", "Trunk", "Disputed Branch"]

  - term: "Superseding Rules"
    synonyms: ["Superseding Validation Acceptance Rules"]
    definition: "The formal rules that determine when one event can supersede another at the same sequence number. Organized into rules A (non-delegated), B (delegated), and C (recursive delegation)."
    invariants:
      - "A0: Any rotation may supersede an interaction at the same sn (if the ixn is not before another rotation)"
      - "A1: A non-delegated rotation may NOT supersede another rotation"
      - "A2: An interaction may NOT supersede any event"
      - "B1: Delegated rotation supersedes if its delegating event has higher sn in delegator's KEL — comparison uses sn (sequence number), NOT fn (first-seen number); sn is protocol-assigned and produces universal agreement"
      - "B2: Same delegating event but superseding seal appears later in the seal list"
      - "B2 tiebreaker: if both seals appear in the same delegating event, the seal with the higher index (later position) supersedes the earlier one — last-writer-wins within a single event"
      - "B3: Same sn delegating events but superseding event's delegating event is a rotation AND the superseded's is an interaction — this is an event-type comparison, NOT a SAID lexicographic tiebreaker"
      - "C: Recursive application of A and B up the delegation chain to the root non-delegated KEL"
      - "C base case: the root of the delegation chain is a non-delegated AID — apply rules A0/A1/A2"
      - "C recursive case: for a delegated AID at level N, first check B1/B2/B3 at level N. If no B rule resolves the conflict, recurse to level N-1 (the delegator's KEL) and apply superseding rules there"
      - "C termination: recursion always terminates because delegation chains are finite and the root is always non-delegated"
      - "C default: if no rule at any level resolves the conflict, the incumbent (first-seen) wins — this is the conservative default"
    examples:
      - "Rule A0: rot at sn=5 supersedes ixn at sn=5 — recovery from signing key compromise"
      - "Rule B1: delegated rot approved at delegator sn=10 supersedes delegated rot approved at delegator sn=8"
    related_terms: ["Superseding Recovery", "Reconciliation"]

  - term: "Reconciliation"
    synonyms: []
    definition: "The process of determining the undisputed path (trunk) through a KEL when superseding events create forks. Applied by validators using the superseding validation acceptance rules."
    invariants:
      - "Determines the trunk — the single undisputed path through the KEL DAG"
      - "Applied by processing superseding events against the existing KEL"
      - "If every validator cannot universally find the same trunk, the KEL is irreconcilable"
      - "Recovery (superseding) enables KEL repair — future validators see only the recovered trunk"
    examples:
      - "Validator receives a superseding rotation, applies rules, determines the new trunk, shunts compromised events to disputed branch"
    related_terms: ["Superseding Recovery", "Trunk", "Disputed Branch"]

  - term: "Trunk"
    synonyms: ["Undisputed Path"]
    definition: "The single authoritative path through the KEL directed acyclic graph (DAG). All events on the trunk are the accepted, undisputed history of the AID."
    invariants:
      - "There is exactly one trunk — the undisputed path"
      - "Superseding events create the trunk by displacing compromised events to branches"
      - "All events not on the trunk are in disputed branches"
    examples:
      - "After recovery: [icp(s=0), ixn(s=1), rot-recovery(s=2), ixn(s=3)] is the trunk; the compromised ixn at s=2 is on a disputed branch"
    related_terms: ["Disputed Branch", "Reconciliation", "Superseding Recovery"]

  - term: "Disputed Branch"
    synonyms: ["Fork", "Superseded Branch"]
    definition: "A branch of the KEL DAG containing events that have been superseded during recovery. Events on a disputed branch still exist in the database but are no longer on the authoritative trunk."
    invariants:
      - "Created when a superseding event displaces the first-seen event at a location"
      - "Events on disputed branches still exist — viewable via first-seen number ordering"
      - "The controller remains accountable for events on disputed branches (non-repudiation)"
      - "Contains all events subsequent to the superseded event in the original chain"
    examples:
      - "After rot supersedes ixn at sn=5: the ixn and all events following it form the disputed branch"
    related_terms: ["Trunk", "Superseding Recovery"]

  - term: "Recursive Superseding Evaluation"
    synonyms: ["Rule C Algorithm"]
    definition: "The algorithm for evaluating superseding in delegation chains: (1) at current level, attempt A or B rules; (2) if neither satisfied, move up to the delegator's KEL and compare delegating events using A and B; (3) repeat until satisfied or root non-delegated KEL reached; (4) at root, only A-rules apply; if unsatisfied, discard the superseding rotation (Rule C1). Termination guaranteed because delegation chains are finite and roots are non-delegated."
    invariants:
      - "Signature: supersedes(event1, event2, kel) -> bool with upward chain walk"
      - "At each level, try A-rules (if non-delegated) or B-rules (if delegated)"
      - "If no rule resolves at current level, recurse to the delegator's KEL"
      - "Root is always non-delegated — only A-rules apply at root"
      - "C1: if no rule at any level resolves, the superseding rotation is discarded"
      - "Termination is guaranteed — delegation chains are finite with non-delegated roots"
    examples:
      - "Three-level chain: try B1-B3 at level 3, no winner -> recurse to level 2, try B1-B3, no winner -> recurse to level 1 (root), try A0-A2"
    related_terms: ["Superseding Rules", "Delegated Superseding Rules"]

  - term: "Latest-Seen"
    synonyms: []
    definition: "The most recent event at a given sn observed by a specific validator. This is validator-local, not globally consistent — different validators may have different latest-seen events at the same sn. Convergence is eventual, not immediate. This is by design, not a defect."
    invariants:
      - "Validator-local: each validator tracks its own latest-seen independently"
      - "Different validators may disagree on latest-seen at any point in time"
      - "Convergence is eventual — as superseding events propagate, validators converge"
      - "Not a global property — there is no protocol-level 'latest-seen' oracle"
    related_terms: ["Superseding Recovery", "Reconciliation"]

  - term: "Irreconcilable KEL"
    definition: "A KEL state where validators cannot universally agree on a single undisputed path (trunk) through the event history. This occurs when superseding rules cannot definitively resolve competing event versions — the identifier has lost integrity beyond recovery. Irreconcilable is truly terminal — there is NO recovery path. The only recourse is key rotation by any remaining honest party (if pre-rotation keys are intact) or abandoning the AID."
    invariants:
      - "Terminal state — an irreconcilable KEL cannot be recovered; no transitions out"
      - "The identifier loses value to all validators who detect the irreconcilability"
      - "Caused by successful attacks that superseding recovery cannot resolve"
      - "Different from reconcilable duplicity where superseding rules produce a clear trunk"
      - "Only recourse: pre-rotation by an honest party (if keys intact) or AID abandonment"
    related_terms: ["Superseding Recovery", "Reconciliation", "Duplicity Evidence"]

  - term: "Superseding Conflict"
    synonyms: []
    definition: "The condition where two competing superseding rotations BOTH satisfy superseding rules — each supersedes the other from different validators' perspectives. Requires judge adjudication. Occurs when B1-B3 produce no winner and both candidates are valid."
    invariants:
      - "Both competing rotations satisfy superseding rules from their respective validators' viewpoints"
      - "Cannot be resolved algorithmically — requires judge adjudication"
      - "Distinct from irreconcilable: irreconcilable means NO superseding is possible; conflict means BOTH candidates are valid"
    related_terms: ["Superseding Rules", "Judge", "Irreconcilable KEL"]

  - term: "Identity Recovery"
    synonyms: ["Key Compromise Recovery"]
    definition: "The adopter-facing concept for recovering from key compromise. Encompasses the set of mechanisms by which a legitimate Controller regains control over an AID after its signing or pre-rotated keys have been compromised. The specific mechanisms (Superseding Recovery, Reserve Rotation, SQAR, Reconciliation) are the implementation-level types under this umbrella."
    invariants:
      - "Recovery requires that the Controller still controls some unexposed keys (pre-rotated or reserve)"
      - "Recovery produces a fork in the KEL — compromised events go to a Disputed Branch, recovered events form the Trunk"
      - "Recovery is only possible for the latest compromised rotation — earlier compromises cannot be superseded"
    examples:
      - "A Controller whose signing keys were stolen rotates to pre-committed next keys, superseding the attacker's forged events"
      - "Reserve Rotation using keys held back from an earlier establishment event"
    related_terms: ["Superseding Recovery", "Reconciliation", "Trunk", "Disputed Branch", "Reserve Rotation", "SQAR", "Duplicity"]

events:
  - name: "SupersedingRecoveryApplied"
    payload: "aid: AID, sn: int, superseding_event: RotationEvent, superseded_event: KeyEvent, rule_applied: SupersedingRule"
    triggers: "A superseding rotation event is accepted, forking the KEL and creating a recovered trunk"

  - name: "BranchDisputed"
    payload: "aid: AID, branch_root_sn: int, superseded_events: [KeyEvent]"
    triggers: "Events displaced by a superseding rotation are shunted to a disputed branch"

  - name: "TrunkReconciled"
    payload: "aid: AID, trunk_tip_sn: int, recovery_event: RotationEvent"
    triggers: "Reconciliation determines the new undisputed trunk path after a superseding recovery"

rules:
  - "A rotation event can supersede an interaction at the same sn — the primary recovery mechanism (A0)"
  - "A non-delegated rotation cannot supersede another rotation — rotations are final against rotations (A1)"
  - "An interaction event cannot supersede any event (A2)"
  - "Delegated rotations supersede based on delegating event ordering in the delegator's KEL (B1-B3)"
  - "Recursive rule C applies up the delegation chain to the root non-delegated KEL"
  - "Superseded events are shunted to disputed branches — they still exist but are not on the trunk"
  - "The controller remains accountable for harm caused by events on disputed branches"
  - "If reconciliation cannot determine a universal trunk, the KEL is irreconcilable"
