domain_ref: "integrity/recovery"

errors:
  - name: "InvalidRecoveryRotationError"
    description: "Recovery rotation does not use valid pre-rotation keys from before the fork point"
    cause: "The rotation event's new keys do not match the next key digest commitments from the last establishment event before the fork point"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "fork_point_sn"
        type: "integer"
        description: "Sequence number where the fork was detected"
      - field: "last_good_establishment_sn"
        type: "integer"
        description: "Sequence number of the last trusted establishment event"
      - field: "reason"
        type: "string"
        description: "Which key digest commitments did not match"

  - name: "RecoveryNotPossibleError"
    description: "The compromised identifier cannot be recovered"
    cause: "The identifier is non-transferable, abandoned, or the pre-rotation keys are also compromised"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "prefix"
        type: "string"
        description: "The identifier that cannot be recovered"
      - field: "reason"
        type: "string"
        description: "Why recovery is not possible (non-transferable, abandoned, all next keys compromised)"

  - name: "IrreconcilableError"
    description: "Conflicting KEL branches cannot be reconciled — superseding recovery rules do not permit resolution"
    cause: "Both branches have equal authority and no superseding rule applies"
    recovery: "escalate"
    severity: "fatal"
    context:
      - field: "prefix"
        type: "string"
        description: "The identifier with irreconcilable branches"
      - field: "fork_point_sn"
        type: "integer"
        description: "The sequence number where the branches diverge"
      - field: "branch_a_said"
        type: "string"
        description: "SAID of the event from branch A at the fork point"
      - field: "branch_b_said"
        type: "string"
        description: "SAID of the event from branch B at the fork point"
    related_port: "port://integrity/recovery/inbound/reconciliation"

  - name: "SupersedingConflictError"
    description: "Two competing superseding rotations exist at the same recovery point"
    cause: "Multiple recovery rotations at the same sn with different keys — requires judge adjudication"
    recovery: "escalate"
    severity: "recoverable"
    context:
      - field: "prefix"
        type: "string"
        description: "The identifier with competing recoveries"
      - field: "recovery_sn"
        type: "integer"
        description: "The sequence number of the competing rotations"
      - field: "said_a"
        type: "string"
        description: "First recovery rotation SAID"
      - field: "said_b"
        type: "string"
        description: "Competing recovery rotation SAID"
