domain_ref: "integrity"

protocols:
  - name: "DuplicityCheck"
    description: "A watcher cross-checks KEL copies from multiple witnesses to detect duplicity (forked event logs). If the same identifier has different events at the same sequence number across witnesses, duplicity is flagged."
    participants:
      - domain: "domain://integrity/detection"
        role: "Compares events across witness sources, detects forks"
      - domain: "domain://integrity/evidence"
        role: "Records duplicity evidence in the DEL"
      - domain: "domain://identity/state"
        role: "Provides current key state for the monitored identifier"
      - domain: "domain://discovery"
        role: "Resolves witness OOBIs to fetch their KEL copies"
    trigger: "Periodic watcher sweep or on-demand duplicity adjudication request"
    steps:
      - seq: 1
        domain: "domain://discovery"
        action: "resolve_witness_endpoints"
        port: "port://discovery/inbound/discovery"
        input:
          description: "AID prefix + its witness list from key state"
          types:
            - ref: "types://discovery#OOBI/witness"
              fields: ["aid", "role"]
        output:
          description: "Resolvable URLs for each designated witness"
          type: "types://discovery#LocationScheme"
      - seq: 2
        domain: "domain://integrity/detection"
        action: "fetch_kel_from_witnesses"
        port: "port://integrity/detection/outbound/kel-sources"
        input:
          description: "Witness endpoints for the monitored AID"
        output:
          description: "KEL copy from each witness"
        depends_on: [1]
        on_failure:
          - error: "OOBIResolutionError"
            ref: "errors://discovery#OOBIResolutionTimeoutError"
            action: "retry"
            compensation: "Retry unreachable witnesses, proceed with available copies"
      - seq: 3
        domain: "domain://integrity/detection"
        action: "compare_events_by_sn"
        port: "port://integrity/detection/inbound/monitoring-lifecycle"
        input:
          description: "Multiple KEL copies"
        output:
          description: "List of (prefix, sn) positions where SAIDs differ across witnesses"
        depends_on: [2]
        preconditions:
          - "verification://integrity/detection#Watcher"
      - seq: 4
        domain: "domain://integrity/evidence"
        action: "record_duplicity_evidence"
        port: "port://integrity/evidence/inbound/evidence-management"
        input:
          description: "Conflicting events with their signatures"
        output:
          description: "DuplicityEvidence entries stored permanently in DEL"
        depends_on: [3]
        preconditions:
          - "verification://integrity/evidence#Duplicity Evidence"
        on_failure:
          - error: "NoDuplicity"
            ref: "errors://integrity/evidence#NotDuplicityError"
            action: "abort"
            compensation: "No duplicity found — normal case, nothing to record"
      - seq: 5
        domain: "domain://integrity/detection"
        action: "alert_validators"
        port: "port://integrity/evidence/inbound/notification"
        input:
          description: "Duplicity evidence"
        output:
          description: "Cue with kin='duplicity' sent to interested parties"
        depends_on: [4]
    timeout: "60s per witness fetch"
    terminal_states:
      success: "Duplicity detected and recorded in DEL, validators alerted"
      failure: "No duplicity found (this is the normal, good outcome)"

  - name: "SupersedingRecovery"
    description: "Recover from detected duplicity by submitting a superseding rotation event. The honest controller uses their pre-rotated keys (committed before the compromise) to rotate to fresh keys, invalidating the compromised branch."
    participants:
      - domain: "domain://integrity/evidence"
        role: "Provides duplicity evidence proving the fork exists"
      - domain: "domain://integrity/recovery"
        role: "Validates the superseding rotation against recovery rules"
      - domain: "domain://identity/establishment"
        role: "Processes the superseding rotation event"
      - domain: "domain://identity/key-commitment"
        role: "Verifies recovery keys match pre-commitments from before the fork"
      - domain: "domain://accountability/receipting"
        role: "Witnesses receipt the recovery rotation"
    trigger: "Honest controller detects duplicity and initiates recovery"
    steps:
      - seq: 1
        domain: "domain://integrity/evidence"
        action: "verify_duplicity_exists"
        port: "port://integrity/evidence/inbound/evidence-management"
        input:
          description: "AID prefix, conflicting events at the same sn"
        output:
          description: "Confirmed DuplicityEvidence entry in DEL"
        preconditions:
          - "verification://integrity/evidence#Duplicity Evidence"
        on_failure:
          - error: "NotDuplicityError"
            ref: "errors://integrity/evidence#NotDuplicityError"
            action: "abort"
            compensation: "Events are duplicates not duplicity — no recovery needed"
      - seq: 2
        domain: "domain://integrity/recovery"
        action: "determine_fork_point"
        port: "port://integrity/recovery/inbound/reconciliation"
        input:
          description: "DEL entries for this AID"
        output:
          description: "Fork point sn and last trusted establishment event before fork"
        depends_on: [1]
      - seq: 3
        domain: "domain://identity/key-commitment"
        action: "verify_recovery_keys"
        port: "port://identity/key-commitment/inbound/key-commitment"
        input:
          description: "New keys must match next key digests from last establishment event BEFORE fork"
        output:
          description: "Pre-rotation binding confirmed for recovery keys"
        depends_on: [2]
        preconditions:
          - "verification://identity/key-commitment#Pre-rotation Commitment"
        on_failure:
          - error: "PreRotationBindingError"
            ref: "errors://identity/key-commitment#PreRotationBindingError"
            action: "abort"
            compensation: "Recovery keys don't match pre-commitments — cannot recover"
      - seq: 4
        domain: "domain://identity/establishment"
        action: "process_superseding_rotation"
        port: "port://identity/establishment/inbound/validate-rotation"
        input:
          description: "Rotation event at recovery_sn >= fork_point_sn with verified recovery keys"
          types:
            - ref: "types://identity#RotationEvent/non-delegated"
              fields: ["k", "n", "s"]
        output:
          description: "Superseding rotation accepted — key state updated, forked branch invalidated"
          type: "types://identity#KeyState"
        depends_on: [3]
        preconditions:
          - "verification://integrity/recovery#Superseding Recovery"
        on_failure:
          - error: "InvalidRecoveryRotationError"
            ref: "errors://integrity/recovery#InvalidRecoveryRotationError"
            action: "abort"
            compensation: "Recovery rotation itself is invalid"
      - seq: 5
        domain: "domain://accountability/receipting"
        action: "collect_witness_receipts"
        port: "port://accountability/receipting/inbound/receipt-lifecycle"
        input:
          description: "Superseding rotation event"
        output:
          description: "Witness receipts — recovery is now accountable"
        depends_on: [4]
      - seq: 6
        domain: "domain://integrity/recovery"
        action: "reconcile_kel"
        port: "port://integrity/recovery/inbound/reconciliation"
        input:
          description: "Superseding rotation accepted and receipted"
        output:
          description: "KEL reconciled — forked events at sn >= fork_point removed, recovery branch is the new trunk"
        depends_on: [5]
        preconditions:
          - "verification://integrity/recovery#Trunk"
    timeout: "No timeout — recovery can happen at any point after duplicity detection"
    compensation: "If recovery fails, duplicity evidence remains in DEL — the AID is flagged but not recovered"
    terminal_states:
      success: "AID recovered — new keys active, forked branch invalidated, DEL evidence preserved"
      failure: "Recovery failed — AID remains compromised, duplicity evidence in DEL"
