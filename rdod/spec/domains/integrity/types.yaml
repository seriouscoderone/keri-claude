domain_ref: "integrity"

types:
  - name: "DuplicityEvidence"
    description: "Proof that two different events exist at the same (prefix, sn) — evidence of potential key compromise or Byzantine behavior."
    variants:
      - name: "default"
        fields:
          - name: "prefix"
            type: "string"
            required: true
            description: "The AID with detected duplicity"
          - name: "sn"
            type: "integer"
            required: true
            description: "The conflicting sequence number"
          - name: "event_a"
            type: "map"
            required: true
            description: "First event body (full serialized event)"
          - name: "said_a"
            type: "string"
            required: true
            description: "SAID of the first event"
          - name: "signatures_a"
            type: "array"
            required: true
            description: "Signatures on the first event (prove it was validly signed)"
          - name: "event_b"
            type: "map"
            required: true
            description: "Conflicting event body"
          - name: "said_b"
            type: "string"
            required: true
            description: "SAID of the conflicting event"
          - name: "signatures_b"
            type: "array"
            required: true
            description: "Signatures on the conflicting event"
          - name: "detected_at"
            type: "string"
            required: true
            description: "ISO 8601 datetime when duplicity was detected"
          - name: "source"
            type: "string"
            required: false
            description: "How duplicity was detected (witness comparison, watcher report, etc.)"
        invariants:
          - "said_a != said_b — if SAIDs match, this is a duplicate not duplicity"
          - "Both events must have the same prefix and sn"
          - "Both events must have valid signatures verifiable against the key state at that sn"
          - "Evidence is immutable — once recorded in the DEL, never modified or deleted"

  - name: "DuplicityEventLog"
    description: "The Duplicity Event Log (DEL) — permanent forensic record of detected duplicity for an identifier."
    variants:
      - name: "default"
        fields:
          - name: "prefix"
            type: "string"
            required: true
            description: "The AID this DEL tracks"
          - name: "entries"
            type: "array[DuplicityEvidence]"
            required: true
            description: "Chronologically ordered duplicity evidence entries"
        invariants:
          - "Append-only — entries are never removed, modified, or reordered"
          - "Each entry is independently verifiable (both events have valid signatures)"
          - "DEL may be empty (no duplicity detected) — this is the normal case"

  - name: "SupersedingRecoveryEvent"
    description: "A rotation event that recovers from detected duplicity by superseding the compromised key state. Uses pre-rotation keys committed before the compromise."
    variants:
      - name: "default"
        fields:
          - name: "rotation_event"
            type: "types://identity#RotationEvent"
            required: true
            description: "The recovery rotation event (rot or drt)"
          - name: "recovery_sn"
            type: "integer"
            required: true
            description: "The sequence number where recovery occurs — must be >= fork point"
          - name: "fork_point_sn"
            type: "integer"
            required: true
            description: "The sequence number where the KEL forked (duplicity began)"
        invariants:
          - "recovery_sn >= fork_point_sn — can recover at or after the fork"
          - "Recovery keys must match pre-rotation commitments from the LAST establishment event BEFORE the fork"
          - "Superseding rotation has priority over the forked branch because it uses authentic pre-rotated keys"
          - "After recovery, all events from the forked branch at sn >= fork_point are invalidated"
