# ports.yaml
domain_ref: "integrity"

ports:
  # Inbound — what clients call (delegates to subdomains)
  - id: "port://integrity/inbound/monitoring"
    type: inbound
    name: "Duplicity Monitoring"
    semantics: command
    idempotent: false
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://integrity/detection#MonitorHandle"
      errors:
        - "errors://integrity/detection#LikelyDuplicitousError"
        - "errors://integrity/detection#KELForkDetectedError"
    delegates_to: ["port://integrity/detection/inbound/monitoring-lifecycle", "port://integrity/evidence/inbound/evidence-management"]
    refs: ["domain://identity"]

  - id: "port://integrity/inbound/recovery"
    type: inbound
    name: "Superseding Recovery"
    semantics: command
    idempotent: false
    contract:
      input: "types://integrity#SupersedingRecoveryEvent"
      output: "types://integrity#RecoveryApplied"
      errors:
        - "errors://integrity/recovery#SupersedingConflictError"
        - "errors://integrity/recovery#IrreconcilableError"
        - "errors://integrity/recovery#InvalidRecoveryRotationError"
        - "errors://integrity/recovery#RecoveryNotPossibleError"
    delegates_to: ["port://integrity/recovery/inbound/superseding-rules", "port://integrity/recovery/inbound/reconciliation"]
    refs: ["domain://identity"]

  - id: "port://integrity/inbound/evidence-query"
    type: inbound
    name: "Evidence Query"
    semantics: query
    idempotent: true
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://integrity/detection#DuplicityEvidence"
      errors: []
    delegates_to: ["port://integrity/evidence/inbound/evidence-management", "port://integrity/recovery/inbound/reconciliation"]
    refs: ["domain://identity"]
