# ports.yaml
domain_ref: "integrity"

ports:
  # Inbound — what clients call (delegates to subdomains)
  - id: "port://integrity/inbound/monitoring"
    type: inbound
    name: "Duplicity Monitoring"
    semantics: command
    idempotent: false
    description: >
      Start duplicity monitoring for an AID against a specified set of witness sources.
      Delegates to monitoring-lifecycle and evidence-management subdomains.
    contract:
      # L67-O13: Added sources parameter — mirrors the fix in detection/ports.yaml
      input: "types://integrity/detection#MonitoringRequest"
      output: "types://integrity/detection#MonitorHandle"
      errors:
        - "errors://integrity/detection#LikelyDuplicitousError"
        - "errors://integrity/detection#KELForkDetectedError"
        - "errors://integrity/detection#InsufficientDiversityError"
    delegates_to: ["port://integrity/detection/inbound/monitoring-lifecycle", "port://integrity/evidence/inbound/evidence-management"]
    refs: ["domain://identity"]

  - id: "port://integrity/inbound/recovery"
    type: inbound
    name: "Superseding Recovery"
    semantics: command
    idempotent: false
    contract:
      input: "types://integrity/recovery#SupersedingRecoveryEvent"
      output: "types://integrity#RecoveryApplied"
      errors:
        - "errors://integrity/recovery#SupersedingConflictError"
        - "errors://integrity/recovery#IrreconcilableError"
        - "errors://integrity/recovery#InvalidRecoveryRotationError"
        - "errors://integrity/recovery#RecoveryNotPossibleError"
    delegates_to: ["port://integrity/recovery/inbound/superseding-rules", "port://integrity/recovery/inbound/reconciliation"]
    refs: ["domain://identity"]

  - id: "port://integrity/inbound/evidence-query"
    type: inbound
    name: "Evidence Query"
    semantics: query
    idempotent: true
    description: >
      Return all duplicity evidence collected for an AID. An AID may have multiple
      evidence entries (one per conflicting sn). Returns an empty array if no duplicity
      has been detected.
    contract:
      input: "types://cesr/primitives#AID"
      # L67-O14: Changed from singular DuplicityEvidence to array — an AID may have
      # evidence at multiple sequence numbers
      output: "array[types://integrity/detection#DuplicityEvidence]"
      errors: []
    delegates_to: ["port://integrity/evidence/inbound/evidence-management", "port://integrity/recovery/inbound/disputed-branch-query"]
    refs: ["domain://identity"]
