domain_ref: "integrity/detection"

types:
  - name: "DuplicityEventLog"
    description: "The Duplicity Event Log (DEL) — permanent forensic record of detected duplicity for an identifier."
    variants:
      - name: "default"
        fields:
          - name: "prefix"
            type: "string"
            required: true
            description: "The AID this DEL tracks"
          - name: "entries"
            type: "array[DuplicityEvidence]"
            required: true
            description: "Chronologically ordered duplicity evidence entries"
        invariants:
          - "Append-only — entries are never removed, modified, or reordered"
          - "Each entry is independently verifiable (both events have valid signatures)"
          - "DEL may be empty (no duplicity detected) — this is the normal case"

  - name: "MonitorHandle"
    description: "Reference to an active monitoring subscription for a specific AID. Returned when monitoring begins; used to track or cancel the subscription."
    variants:
      - name: "default"
        fields:
          - name: "monitored_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The AID being monitored for duplicity"
          - name: "sources"
            type: "array[types://cesr/primitives#AID]"
            required: true
            description: "Witness AIDs being polled for KEL comparison"
          - name: "active"
            type: "boolean"
            required: true
            description: "Whether this monitoring subscription is currently active"
        invariants:
          - "At least 2 sources from distinct operators must be present"
          - "Monitoring remains active until explicitly cancelled or duplicity confirmed"

  - name: "DuplicityEvidence"
    description: "Evidence of conflicting events for the same AID at the same sequence number, collected from multiple witness sources."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The AID for which duplicity was detected"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number where the fork occurs"
          - name: "first_event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the first-seen (incumbent) event"
          - name: "conflicting_event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the conflicting (challenger) event"
          - name: "first_source"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the witness that provided the first event"
          - name: "conflicting_source"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the witness that provided the conflicting event"
        invariants:
          - "first_event_said != conflicting_event_said — identical SAIDs is not duplicity"
          - "Both events must be at the same (aid, sn) — different sn is not duplicity"
          - "Evidence is permanent — stored in the DEL, never deleted"

  - name: "TrustDecision"
    description: "The judge's verdict on whether to trust an AID after evaluating duplicity evidence. Three possible outcomes: trust granted, trust denied, or reconciliation pending."
    variants:
      - name: "trust"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The AID that was evaluated"
          - name: "reason"
            type: "string"
            required: true
            description: "Why trust was granted (e.g., confirmed superseding recovery)"
        invariants:
          - "Requires evidence of superseding recovery or confirmed false positive"
      - name: "no_trust"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The AID that was evaluated"
          - name: "reason"
            type: "string"
            required: true
            description: "Why trust was denied (e.g., confirmed unrecoverable duplicity)"
        invariants:
          - "Issued when duplicity is confirmed with no viable recovery path"
      - name: "reconcile"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The AID under continued investigation"
          - name: "reason"
            type: "string"
            required: true
            description: "Why the decision is deferred"
        invariants:
          - "Issued when duplicity evidence is present but resolution is ambiguous"
          - "Re-evaluated when new evidence (recovery rotation, witness update) arrives"

  - name: "NoDuplicity"
    description: "Result when no duplicity is found for an AID — identical to the parent integrity domain type."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "The AID that was checked"
          - name: "checked_at"
            type: "string"
            required: true
            description: "ISO 8601 datetime when the check completed"
        invariants:
          - "All known witnesses returned consistent events at every sn"
          - "Equivalent to types://integrity#NoDuplicity"

  - name: "TrustReconciled"
    description: "Trust restored for an AID after duplicity investigation — the judge determined the AID is trustworthy again."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "The AID whose trust was restored"
          - name: "resolution"
            type: "string"
            required: true
            description: "How the duplicity was resolved (e.g., superseding recovery, false positive)"
        invariants:
          - "Requires prior duplicity evidence that has been addressed"
          - "Resolution must reference a concrete recovery event or investigation outcome"

  - name: "TrustRevoked"
    description: "Trust permanently revoked for an AID — duplicity was confirmed and no recovery occurred."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "The AID whose trust was revoked"
          - name: "reason"
            type: "string"
            required: true
            description: "Human-readable explanation of why trust was revoked"
          - name: "evidence_said"
            type: "string"
            required: true
            description: "SAID of the duplicity evidence that triggered revocation"
        invariants:
          - "Revocation is permanent — cannot be reversed"
          - "Evidence must be independently verifiable via the DEL"
