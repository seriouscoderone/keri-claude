# domain.yaml
template_version: "1.0"
id: "agent"
name: "Agent Infrastructure [DEPRECATED]"
description: >
  DEPRECATED — replaced by three-tier architecture:
  - APPLICATIONS: domain://signify-client (thin wallet), domain://local-agent (fat wallet)
  - SERVICES: domain://cloud-agent-service, domain://witness-service, domain://watcher-service
  The "agent" concept conflated deployment topology with protocol semantics.
  Retained for reference only — all terms moved to replacement domains.
version: "0.0.0-deprecated"

source_material:
  - type: document
    reference: "KERIArchGroupIssuance.md — group issuance architecture"
  - type: document
    reference: "keridoc-llms-full.md — KERIA/Signify documentation"
  - type: user-input
    reference: "CLAUDE.md — KERIA service architecture, Signify protocol"

ubiquitous_language:
  - term: "KERIA"
    definition: "Cloud agent hosting service — manages AIDs, processes events, stores KELs, coordinates multi-sig, but never holds private signing keys"
    invariants:
      - "Never has access to private keys or decryption keys"
      - "All signing operations are delegated to the edge client"
      - "Exposes three endpoints: boot (3903), admin (3901), message router (3902)"

  - term: "Signify"
    definition: "Edge signing protocol — the controller's client library that holds private keys and performs all cryptographic signing operations"
    invariants:
      - "Private keys never leave the edge client"
      - "All operations are signed at the edge before being sent to the agent"
      - "Implementations: signify-ts (TypeScript), signifypy (Python)"

  - term: "Edge Signing"
    definition: "The principle that all sensitive cryptographic operations occur on the controller's device, not on the cloud agent"
    invariants:
      - "Signing at the edge is the fundamental security guarantee of the Signify protocol"
      - "The agent is untrusted with respect to key material"

  - term: "Signify Protocol"
    definition: "The contract between edge signing and cloud hosting — defines how the controller drives the agent via KRAM-authenticated requests while retaining all key material locally"
    invariants:
      - "Edge drives, cloud serves — the agent can never initiate signing"
      - "KRAM authenticates all admin requests"
      - "Protocol messages (via message router) use KERI signatures, not KRAM"

domain_clients: []

subdomains:
  - ref: "domain://agent/edge-signing"
    relationship: "Agent drives edge-signing as the controller-side component — holds keys, signs operations"
    via_port: "port://agent/edge-signing/inbound/signing-operations"
  - ref: "domain://agent/cloud-hosting"
    relationship: "Agent drives cloud-hosting as the server-side component — hosts AIDs, coordinates, routes"
    via_port: "port://agent/cloud-hosting/inbound/admin-api"

kernels: []

adjacents:
  - ref: "domain://keri"
    relationship: "Customer-Supplier — agent consumes KERI protocol for identifier lifecycle, event processing, and key state management"
    via_port: "port://keri/inbound/identifier-lifecycle"
    is_cross_cutting: false
  - ref: "domain://acdc"
    relationship: "Customer-Supplier — agent consumes ACDC for credential issuance, presentation, and exchange"
    via_port: "port://acdc/inbound/credential-lifecycle"
    is_cross_cutting: false
  - ref: "domain://oobi"
    relationship: "Customer-Supplier — agent uses OOBIs for discovery and endpoint management"
    via_port: "port://oobi/inbound/discovery"
    is_cross_cutting: false

externals:
  - name: "Agent Persistence"
    abstraction: "Repository"
    ref: "port://agent/outbound/agent-store"
    implementation_notes: "Stores agent state, credential wallets, contact books. Implementations: LMDB (keria), DynamoDB (serious-keri)"
  - name: "HTTP Server"
    abstraction: "Adapter"
    ref: "port://agent/outbound/http-server"
    implementation_notes: "Exposes boot, admin, and message router endpoints. Implementations: Falcon/hio (keria), Lambda (serious-keri)"

implementation_guidance:
  suggested_type: "service"
  language_affinity: "any"
  notes: >
    Reference implementation is keria (Python, Falcon + hio). Serverless implementation
    is serious-keri (TypeScript, AWS Lambda + DynamoDB). Edge signing clients: signify-ts
    (TypeScript), signifypy (Python). Browser integration: signify-browser-extension (React).

issues: []

tags: ["infrastructure", "cloud-agent", "edge-signing", "signify"]
