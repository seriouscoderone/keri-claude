# ubiquitous-language.yaml
domain_ref: "agent"

terms:
  - term: "Edge/Cloud Separation"
    synonyms: ["Agent Architecture"]
    definition: "The fundamental architectural principle: private keys live on the controller's device (edge), while identifier hosting and coordination live on a cloud service. The two halves communicate via the Signify protocol."
    invariants:
      - "Edge holds keys; cloud never does"
      - "Edge drives; cloud serves"
      - "Compromise of the cloud does not compromise signing keys"
    examples:
      - "Controller on a phone (signify-ts) ↔ KERIA in AWS (cloud agent)"
    related_terms: ["Signify Protocol", "Edge Signing", "KERIA"]

  - term: "Signify Protocol"
    synonyms: []
    definition: "The contract between edge signing and cloud hosting — defines how the controller drives the agent via KRAM-authenticated requests while retaining all key material locally."
    invariants:
      - "Edge initiates all operations; cloud cannot push to edge"
      - "KRAM authenticates admin requests; protocol messages use KERI signatures"
      - "The protocol is implementation-agnostic — any edge client can drive any cloud agent"
    examples:
      - "signify-ts client → KRAM-signed POST /identifiers → KERIA creates AID"
    related_terms: ["Edge/Cloud Separation", "KRAM"]

  - term: "Edge Signing"
    synonyms: ["Signing at the Edge"]
    definition: "The security principle that all cryptographic signing occurs on the controller's device, never on the cloud agent."
    invariants:
      - "The agent can request a signature but cannot produce one"
      - "Key material zeroed from memory when session ends"
    examples:
      - "Controller signs a rotation event on their phone → sends signed event to KERIA"
    related_terms: ["Signify Protocol", "Edge/Cloud Separation"]

  - term: "KRAM"
    synonyms: ["KERI Request Authentication Method"]
    definition: "HTTP signature-based authentication using KERI identifiers. The authentication mechanism that binds edge to cloud."
    invariants:
      - "Signature covers HTTP method, path, and body digest"
      - "Cloud agent verifies against controller AID's current key state"
      - "Used for admin API (port 3901); message router (port 3902) uses KERI protocol signatures instead"
    examples:
      - "Signify-ts header: Signature: keyid=AID;created=timestamp;..."
    related_terms: ["Signify Protocol", "Admin API"]

events:
  - name: "EdgeConnected"
    payload: "controller_aid: AID, agent_url: URL"
    triggers: "Signify client establishes connection with cloud agent"

  - name: "EdgeDisconnected"
    payload: "controller_aid: AID, reason: timeout | explicit"
    triggers: "Signify client session ends"

rules:
  - "Private keys NEVER leave the edge client under any circumstances"
  - "The cloud agent is untrusted with respect to key material"
  - "Edge drives all operations; cloud serves but cannot initiate signing"
  - "KRAM for admin API; KERI signatures for protocol messages — two distinct auth models"
  - "The Signify protocol is the only contract between edge and cloud — implementations are interchangeable"
