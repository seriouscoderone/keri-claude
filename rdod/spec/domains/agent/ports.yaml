# ports.yaml
domain_ref: "agent"

ports:
  # The parent agent domain's inbound port — external systems interact with the agent architecture
  - id: "port://agent/inbound/agent-operations"
    type: inbound
    name: "Agent Operations"
    contract: "connect(url, passcode) -> Session; create_identifier(config) -> AID; rotate(aid) -> Event; issue_credential(schema, attributes) -> SAID; present_credential(said, recipient) -> Result"
    protocol: "method-call"
    refs: []
