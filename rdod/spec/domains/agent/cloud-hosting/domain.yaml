# domain.yaml
template_version: "1.0"
id: "agent/cloud-hosting"
name: "Cloud Hosting (KERIA)"
description: >
  Server-side cloud agent that hosts KERI identifiers on behalf of controllers.
  Manages AIDs, processes events, coordinates multi-sig, stores credentials,
  routes protocol messages — but never holds private signing keys. All signing
  is delegated to the controller's edge client via the Signify protocol.
  Three service endpoints: boot (agency), admin API, message router.
version: "0.1.0"

source_material:
  - type: document
    reference: "KERIArchGroupIssuance.md — group issuance and multi-sig coordination"
  - type: document
    reference: "keridoc-llms-full.md — KERIA architecture documentation"
  - type: user-input
    reference: "CLAUDE.md — KERIA service architecture (ports 3901/3902/3903)"

ubiquitous_language:
  - term: "KERIA"
    definition: "Cloud agent hosting service — the server-side component that manages AIDs, processes events, and coordinates operations without ever holding private keys"
    invariants:
      - "Zero access to private signing or decryption keys"
      - "Can store, forward, and assemble — but never sign"
      - "One agent instance per controller AID"

  - term: "Agency"
    definition: "The boot service (port 3903) that provisions and destroys agent instances for Signify clients"
    invariants:
      - "Handles POST /boot to create agent instances"
      - "Each provisioning requires a valid inception event from the edge client"
      - "One-time operation per controller — idempotent on retry"

  - term: "Admin API"
    definition: "The management endpoint (port 3901) for all agent operations — identifier lifecycle, credential management, OOBI resolution, state queries"
    invariants:
      - "All requests authenticated via KRAM — unsigned requests rejected"
      - "Scoped to the authenticated controller's agent instance"

  - term: "Message Router"
    definition: "The protocol endpoint (port 3902) receiving external KERI messages from other agents, witnesses, and watchers"
    invariants:
      - "Handles inbound multi-sig coordination, credential exchange, event receipts"
      - "Routes messages to the correct agent instance based on the target AID"
      - "No KRAM required — messages are protocol-authenticated (KERI signatures)"

  - term: "Agent Instance"
    definition: "A provisioned agent representing a single controller — contains the controller's managed AIDs, credential wallet, contact book, and pending operations"
    invariants:
      - "Bound to exactly one controller AID (the authentication anchor)"
      - "Isolated from other agent instances"

  - term: "Credential Wallet"
    definition: "Server-hosted storage of credentials held by the controller — received ACDCs, their schemas, and presentation history"
    invariants:
      - "Credential content is not secret to the agent (ACDC metadata is readable)"
      - "Credential presentation requires edge-signed authorization"
      - "Wallet is scoped to the agent instance"

  - term: "Contact Book"
    definition: "Agent-managed directory of resolved OOBIs — known AIDs with their verified key state and endpoint URLs"
    invariants:
      - "Populated by OOBI resolution via admin API"
      - "Entries include AID, key state snapshot, and endpoint URLs"
      - "Used for addressing protocol messages and verifying signatures"

  - term: "Multi-sig Assembly"
    definition: "The process of collecting partial signatures from multiple edge clients for a group AID event, assembling them when the threshold is satisfied"
    invariants:
      - "Each partial signature arrives independently via message router"
      - "Assembly is threshold-aware — event is complete when kt is satisfied"
      - "Timeout/escrow for incomplete signature sets"

  - term: "Notification"
    definition: "A message queued for the edge client indicating a pending action — multi-sig request, credential offer, exchange message"
    invariants:
      - "Notifications are polled by the edge client via admin API"
      - "The agent cannot push to the edge — the edge pulls"

domain_clients:
  - ref: "domain://agent"
    relationship: "Parent agent domain drives cloud-hosting as the server-side component of the agent architecture"
    via_port: "port://agent/cloud-hosting/inbound/admin-api"

subdomains: []

kernels: []

adjacents:
  - ref: "domain://agent/edge-signing"
    relationship: "Customer-Supplier — edge-signing drives cloud-hosting via KRAM-authenticated requests. Cloud-hosting serves edge-signing but cannot initiate."
    via_port: "port://agent/cloud-hosting/inbound/admin-api"
    is_cross_cutting: false
  - ref: "domain://keri"
    relationship: "Customer-Supplier — cloud-hosting consumes KERI for event processing, key state verification, and KEL management"
    via_port: "port://keri/inbound/identifier-lifecycle"
    is_cross_cutting: false
  - ref: "domain://acdc"
    relationship: "Customer-Supplier — cloud-hosting consumes ACDC for credential storage, exchange, and TEL state tracking"
    via_port: "port://acdc/inbound/credential-lifecycle"
    is_cross_cutting: false
  - ref: "domain://oobi"
    relationship: "Customer-Supplier — cloud-hosting uses OOBIs for contact discovery and endpoint resolution"
    via_port: "port://oobi/inbound/discovery"
    is_cross_cutting: false

externals:
  - name: "Agent Persistence"
    abstraction: "Repository"
    ref: "port://agent/cloud-hosting/outbound/agent-store"
    implementation_notes: "Stores agent instances, credential wallets, contact books, pending operations. Implementations: LMDB (keria), DynamoDB (serious-keri)"
  - name: "HTTP Server"
    abstraction: "Adapter"
    ref: "port://agent/cloud-hosting/outbound/http-server"
    implementation_notes: "Exposes boot (3903), admin (3901), and message router (3902) endpoints. Implementations: Falcon/hio (keria), API Gateway+Lambda (serious-keri)"

implementation_guidance:
  suggested_type: "service"
  language_affinity: "any"
  notes: >
    Reference implementation is keria (Python, Falcon + hio, LMDB). Serverless
    implementation is serious-keri (TypeScript, AWS Lambda + DynamoDB). The three
    endpoints (boot, admin, message router) are ports on the same service, not
    separate services — they share agent state and persistence.

issues: []

tags: ["cloud-agent", "keria", "hosting", "multi-sig"]
