# conventions.yaml — Cross-cutting conventions for the KERI DDD spec
#
# This file defines: URI reference schemes, contract type patterns,
# external abstractions, file template rules, and file placement rules.

# URI reference schemes used across all spec files.
# Each scheme resolves to a specific file and element within the spec tree.

uri_schemes:
  - scheme: "domain://"
    grammar: "domain://{domain_id}"
    resolves_to: "{domain_id}/domain.yaml"
    example: "domain://identity"
    notes: "References a domain. The domain_id is the directory path relative to the spec root."

  - scheme: "kernel://"
    grammar: "kernel://{domain_id}"
    resolves_to: "{domain_id}/domain.yaml (domain must be declared as a kernel)"
    example: "kernel://cesr"
    notes: "Declares adoption of a domain as a native kernel. Used in kernels: sections of domain.yaml. The same domain may also be referenced via domain:// in imports and specializations — both are valid in different contexts."

  - scheme: "port://"
    grammar: "port://{domain_id}/{direction}/{port_name}"
    resolves_to: "{domain_id}/ports.yaml -> ports[id == full_uri]"
    example: "port://identity/inbound/event-processing"
    notes: "Direction is inbound or outbound. Port name is kebab-case."

  - scheme: "types://"
    grammar: "types://{domain_id}#{type_name}"
    resolves_to: "{domain_id}/types.yaml -> types[name == {type_name}]"
    example: "types://cesr/primitives#AID"
    notes: "Fragment (#) is required and names the type. No variant selection in the URI — use the type's variants list."

  - scheme: "errors://"
    grammar: "errors://{domain_id}#{error_name}"
    resolves_to: "{domain_id}/errors.yaml -> errors[name == {error_name}]"
    example: "errors://identity/establishment#OutOfOrderError"
    notes: "Fragment (#) names the error."

  - scheme: "verification://"
    grammar: "verification://{domain_id}#{term_or_constraint}"
    resolves_to: "{domain_id}/verification.yaml -> properties or validation_constraints matching the fragment"
    example: "verification://identity/establishment#Event Validation Pipeline"
    notes: "Fragment names a verification term, invariant, or constraint."

  - scheme: "protocols://"
    grammar: "protocols://{domain_id}#{protocol_name}"
    resolves_to: "{domain_id}/protocols.yaml -> protocols[name == {protocol_name}]"
    example: "protocols://credential-lifecycle#CredentialIssuance"
    notes: "Fragment names the protocol."

  - scheme: "external://"
    grammar: "external://{external_name}"
    resolves_to: "conventions.yaml -> external_abstractions[name == full_uri] (or abstract — no file)"
    example: "external://cryptographic-primitives"
    notes: "Externals are adapter interfaces, not domains. They have no directory. Documented in this file's external_abstractions section."

contract_conventions:
  - pattern: "Result<T, E>"
    description: "An operation that returns either success value T or error E. Not a domain type — use the language's native error handling."
    implementations:
      - language: "Rust"
        equivalent: "Result<T, E>"
      - language: "TypeScript"
        equivalent: "T | E (union type) or Promise<T> with thrown E"
      - language: "Python"
        equivalent: "returns T, raises E as exception"
      - language: "Go"
        equivalent: "(T, error)"
    invariants:
      - "Every Result<T, E> in a port contract names both the success and error types"
      - "The error type E is always defined in the domain's errors.yaml"
      - "Implementations MUST handle the error case — silent swallowing is a bug"

  - pattern: "void"
    description: "An operation with no meaningful return value. Side effect only."
    implementations:
      - language: "Rust"
        equivalent: "()"
      - language: "TypeScript"
        equivalent: "void"
      - language: "Python"
        equivalent: "None"

  - pattern: "[T]"
    description: "An ordered collection of T. Implementations use their language's native list/array/vector."

  - pattern: "Map<K, V>"
    description: "A key-value mapping. Implementations use their language's native dictionary/hashmap."

  - pattern: "Iterator<T>"
    description: "A lazy sequence of T. Implementations use their language's native iterator/generator."

  - pattern: "bool"
    description: "Boolean true/false."

  - pattern: "int"
    description: "Integer (arbitrary precision unless constrained)."

  - pattern: "string"
    description: "UTF-8 text."

  - pattern: "bytes"
    description: "Raw byte sequence."

  - pattern: "datetime"
    description: "ISO 8601 timestamp with timezone. Format: YYYY-MM-DDTHH:MM:SS.ffffff+HH:MM"

  - pattern: "map"
    description: "Untyped key-value mapping (when the structure varies by context)."

# External abstractions referenced by multiple domains but intentionally
# not formalized as domain directories. These are adapter interfaces —
# implementations choose the concrete technology.

external_abstractions:
  - name: "external://transport"
    description: "Network transport for sending CESR-encoded messages between services. Referenced by ~10 domains as an outbound adapter."
    interface:
      - "send(endpoint: Endpoint, payload: bytes) -> Result<Sent, TransportError>"
      - "receive(listen_address: string) -> AsyncStream<bytes>"
    implementations:
      - "HTTP/HTTPS — most common for cloud deployments (KERIA, witness HTTP API)"
      - "TCP — bare metal CESR streams for high-throughput local deployments"
      - "UDP — lightweight for receipt dissemination"
      - "WebSocket — bidirectional for browser extension communication"
    invariants:
      - "Transport is payload-agnostic — it delivers bytes, the domain parses them"
      - "CESR framing handles message boundaries — transport does not need to delimit"
      - "Implementations MUST support at least HTTP; other transports are optional"

  - name: "external://cryptographic-primitives"
    description: "Platform-provided cryptographic algorithms. Referenced by ~20 domains as a kernel external."
    interface:
      - "sign(private_key: bytes, message: bytes) -> bytes"
      - "verify(public_key: bytes, signature: bytes, message: bytes) -> bool"
      - "digest(algorithm: DigestAlgorithm, data: bytes) -> bytes"
      - "generate_keypair(algorithm: string) -> (public_key, private_key)"
      - "derive_key(salt: bytes, path: string, algorithm: string) -> bytes"
    implementations:
      - "libsodium — Ed25519 signing, X25519 key exchange, Blake2b hashing"
      - "blake3 — Blake3-256 hashing"
      - "argon2 — password-based key stretching for Signify salts"
    invariants:
      - "Algorithm selection is determined by the CESR code — not a runtime choice"
      - "Implementations MUST support Ed25519 and Blake3-256 at minimum"
      - "Key material MUST be zeroed after use (ZeroizeOnDrop pattern)"

  - name: "external://persistence"
    description: "Generic persistence backend. Each domain defines its own Repository interface; this external provides the underlying storage engine."
    implementations:
      - "LMDB — memory-mapped key-value store (keripy)"
      - "redb — embedded Rust key-value store (keriox)"
      - "DynamoDB — serverless key-value store (serious-keri)"
      - "SQLite/PostgreSQL — relational alternatives"
      - "In-memory — for testing"
    invariants:
      - "Repository interfaces define the contract — the persistence external implements it"
      - "Implementations MUST satisfy the invariants on each Repository port (append-only, idempotent, etc.)"

# Domain file placement rules

file_template:
  required:
    - "domain.yaml — identity, relationships, published language"
    - "ubiquitous-language.yaml — terms, imports, specializations, events, rules"
    - "ports.yaml — inbound/outbound interfaces with contracts"
  optional:
    - "verification.yaml — formalized invariants, state machines, validation constraints"
    - "errors.yaml — error taxonomy with cause, recovery, severity, recovery_target"
    - "types.yaml — formal data structures with variants, fields, constraints"
    - "protocols.yaml — cross-domain orchestration sequences with failure paths"
  special:
    - "conventions.yaml — cross-cutting type patterns (this file, spec root only)"
    - "integration-scenarios.yaml — cross-domain end-state assertions (spec root only)"
    - "context-map.html — generated visualization (spec root only)"
  notes:
    - "A missing optional file means intentionally omitted, not incomplete"
    - "All 47 domains have the 3 required files"
    - "verification.yaml is present in 47/47 — effectively required for this spec"
    - "template_version '1.0' in domain.yaml refers to the RDOD template schema version"

  domain_clients:
    rule: "domain_clients lists only direct, designed-for consumers — domains this domain was built to serve. It is NOT an exhaustive list of all transitive consumers. For full dependency analysis, use the generated build-order files."
    examples:
      - "cesr/domain.yaml lists identity and credential-lifecycle as clients — these are the primary consumers cesr was designed for. The 30+ other domains that transitively depend on cesr are not listed."
      - "accountability/domain.yaml lists identity as its client — identity drives the accountability domain's witness agreement protocol."

file_placement:
  errors_yaml:
    rule: "Parent domains with subdomains MAY have their own errors.yaml for orchestration-level errors that occur BEFORE subdomain dispatch. Subdomain-specific errors live in the subdomain's errors.yaml. A parent with no orchestration errors does not need errors.yaml."
    examples:
      - "delegation/errors.yaml has DelegationChainError — a cross-subdomain error that occurs before delegation/authorization or delegation/lifecycle is invoked"
      - "identity/ has no errors.yaml — all errors occur within establishment/, state/, thresholds/, etc."
      - "accountability/ has no errors.yaml — all errors occur within receipting/, consensus/, dissemination/"
