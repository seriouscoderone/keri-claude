domain_ref: "externals/transport"

imports: []

terms:
  - term: "Endpoint"
    definition: "A network address where a KERI participant listens for incoming messages"
    invariants:
      - "Endpoint is a URL (scheme + host + port + optional path)"
      - "Transport protocol is determined by the URL scheme (http, tcp, ws)"
    examples:
      - "http://witness1.example.com:5632/ — HTTP witness endpoint"
      - "tcp://10.0.0.1:5631 — TCP direct connection"

events: []
rules: []
