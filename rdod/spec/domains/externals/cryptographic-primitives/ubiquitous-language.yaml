domain_ref: "externals/cryptographic-primitives"

imports: []

terms:
  - term: "Signing Algorithm"
    definition: "An asymmetric cryptographic algorithm that produces a fixed-size signature from a private key and message"
    invariants:
      - "Algorithm selection is determined by the CESR code, not a runtime parameter"
      - "Supported: Ed25519 (64-byte sig), ECDSA secp256k1 (64-byte sig), ECDSA secp256r1 (64-byte sig), Ed448 (114-byte sig)"
    examples:
      - "Ed25519 — the default and most widely used in KERI implementations"

  - term: "Digest Algorithm"
    definition: "A cryptographic hash function that produces a fixed-size digest from arbitrary input"
    invariants:
      - "Algorithm selection is determined by the CESR code"
      - "Supported: Blake3-256, Blake2b-256, SHA2-256, SHA3-256, and their 512-bit variants"
    examples:
      - "Blake3-256 — the default for SAID computation in KERI"

  - term: "Key Derivation"
    definition: "Deterministic derivation of cryptographic keys from a salt, path, or password"
    invariants:
      - "argon2 is used for passcode-to-key derivation (Signify edge client)"
      - "HKDF is used for UUID and BLID derivation (privacy/blinding)"

events: []
rules: []
