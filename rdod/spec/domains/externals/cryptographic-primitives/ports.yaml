domain_ref: "externals/cryptographic-primitives"

ports:
  - id: "port://externals/cryptographic-primitives/inbound/sign-verify"
    type: inbound
    name: "Sign and Verify"
    semantics: command
    idempotent: true
    contract:
      input: "private_key (bytes) + message (bytes) | public_key (bytes) + signature (bytes) + message (bytes)"
      output: "signature (bytes) | boolean"
      errors:
        - "errors://externals/cryptographic-primitives#SigningError"
        - "errors://externals/cryptographic-primitives#VerificationError"
    refs: []
    invariants:
      - "sign(private_key, message) produces a deterministic signature for Ed25519"
      - "verify(public_key, signature, message) returns true iff the signature is valid"
      - "Key material MUST be zeroed after use"

  - id: "port://externals/cryptographic-primitives/inbound/digest"
    type: inbound
    name: "Digest"
    semantics: query
    idempotent: true
    contract:
      input: "algorithm (DigestAlgorithm) + data (bytes)"
      output: "digest (bytes)"
      errors: []
    refs: []
    invariants:
      - "Deterministic — same input always produces same digest"
      - "Algorithm determines output size (256-bit or 512-bit)"

  - id: "port://externals/cryptographic-primitives/inbound/key-generation"
    type: inbound
    name: "Key Generation and Derivation"
    semantics: command
    idempotent: false
    contract:
      input: "algorithm (string) | salt (bytes) + path (string)"
      output: "(public_key, private_key) bytes"
      errors:
        - "errors://externals/cryptographic-primitives#KeyDerivationError"
    refs: []
    invariants:
      - "generate_keypair produces a fresh random keypair"
      - "derive_key from salt + path is deterministic (same salt + path = same key)"
      - "argon2 key stretching parameters are determined by KeyTier (low/med/high)"
