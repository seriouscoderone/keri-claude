# ports.yaml
domain_ref: "witness-service"

ports:
  # Inbound ports are defined in subdomain:
  #   - api: port://witness-service/api/inbound/event-submission (event receipt)
  #   - api: port://witness-service/api/inbound/kerl-query (KERL queries)
  #   - api: port://witness-service/api/inbound/oobi-resolution (OOBI resolution)

  # Outbound — repository and HTTP server
  - id: "port://witness-service/outbound/witness-repository"
    type: outbound
    name: "Witness Repository"
    description: >
      Append-only store for receipted key event logs. A witness records each event
      it has seen (with its own receipt) and serves the receipted KEL back to requesters.
    contract: "store_kerl_event(aid: AID, event: KeyEvent, receipt: Receipt) -> Result; get_kerl(aid: AID) -> [ReceiptedEvent]; get_receipt(aid: AID, event_said: SAID) -> Receipt; has_event(aid: AID, sn: SequenceNumber) -> bool"
    protocol: "method-call"
    refs: ["persistence"]

  - id: "port://witness-service/outbound/http-server"
    type: outbound
    name: "HTTP Server"
    contract: "listen(port) -> Server — serves event receipt, KERL query, and OOBI endpoints"
    protocol: "method-call"
    refs: ["transport"]
