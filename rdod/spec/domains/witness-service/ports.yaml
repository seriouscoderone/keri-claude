# ports.yaml
domain_ref: "witness-service"

ports:
  # Inbound ports are defined in subdomain:
  #   - api: port://witness-service/api/inbound/event-submission (event receipt)
  #   - api: port://witness-service/api/inbound/kerl-query (KERL queries)
  #   - api: port://witness-service/api/inbound/oobi-resolution (OOBI resolution)

  # Outbound — storage and HTTP server
  - id: "port://witness-service/outbound/witness-store"
    type: outbound
    name: "Witness Storage"
    contract: "append_event(aid, event, receipt) -> Result; get_kerl(aid, sn_range?) -> KERL; has_event(aid, sn) -> bool"
    protocol: "method-call"
    refs: ["persistence"]

  - id: "port://witness-service/outbound/http-server"
    type: outbound
    name: "HTTP Server"
    contract: "listen(port) -> Server — serves event receipt, KERL query, and OOBI endpoints"
    protocol: "method-call"
    refs: ["transport"]
