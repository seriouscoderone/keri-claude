domain_ref: "witness-service"

errors:
  - name: "WitnessOverloadError"
    description: "Witness is at capacity and cannot accept new identifiers"
    cause: "Maximum number of managed identifiers reached"
    recovery: "abort"
    severity: "fatal"
    related_port: "port://witness-service/api/inbound/event-submission"
    context:
      - field: "current_count"
        type: "integer"
        description: "Number of identifiers currently managed"
      - field: "max_count"
        type: "integer"
        description: "Maximum configured capacity"
