# domain.yaml
template_version: "2.0"
id: "witness-service"
name: "Witness Service"
description: >
  Service-tier domain for witness node infrastructure. Deploys witness nodes that receipt
  key events under the first-seen rule, store KERLs, and disseminate receipts. Shared
  infrastructure — a single witness service serves many controllers. Does not hold
  private signing keys for any controller. Implementation: keriox components/witness,
  keripy witness module.
version: "0.1.0"
tier: "service"

source_material:
  - type: document
    reference: "keri-specification.md — KERI witness protocol (first-seen rule, receipting)"
  - type: document
    reference: "KERI_WP_2.x.web.md — witness architecture and agreement algorithm"
  - type: user-input
    reference: "CLAUDE.md — keriox components/witness, keripy witness module"

domain_clients:
  - ref: "domain://signify-client"
    relationship: "Indirect — Signify clients access witnesses via cloud-agent-service proxy"
    via_port: "port://witness-service/api/inbound/event-submission"
  - ref: "domain://local-agent"
    relationship: "Direct HTTP connection for local agent witness interactions"
    via_port: "port://witness-service/api/inbound/event-submission"
  - ref: "domain://cloud-agent-service"
    relationship: "Forwards events to witnesses and collects receipts on behalf of controllers"
    via_port: "port://witness-service/api/inbound/event-submission"

subdomains:
  - ref: "domain://witness-service/api"
    relationship: "Inbound message boundary — receives key events, verifies signatures, applies first-seen rule, returns receipts"
    via_port: "port://witness-service/api/inbound/event-submission"

kernels: []

adjacents:
  - ref: "domain://identity"
    relationship: "Conformist — implements accountability protocol (first-seen rule, receipting, KERL dissemination)"
    pattern: "Conformist"
    via_port: "port://identity/inbound/identity-management"
    is_cross_cutting: false

externals:
  - ref: "domain://externals/cryptographic-primitives"
    source: "Ed25519 for receipt signatures — witnesses sign with their own non-transferable keys"
    relationship: "Cryptographic signing primitives used directly in receipt generation"
  - ref: "domain://externals/persistence"
    relationship: "Append-only KERL persistence for event logs and receipts per monitored AID — the witness-repository outbound port delegates to this external"
  - ref: "domain://externals/transport"
    relationship: "HTTP endpoints for event submission, OOBI resolution, and queries — the http-server outbound port delegates to this external"

implementation_guidance:
  suggested_type: "service"
  language_affinity: "any"
  notes: >
    Primary implementation is keriox components/witness (Rust, axum). Python implementation
    available in keripy witness module. Witnesses are operationally independent — no shared
    state between witness nodes. Geographic and administrative diversity recommended for
    witness pool deployments.

issues: []

tags: ["witness", "service", "receipting", "first-seen", "infrastructure"]

# --- Application-Layer Open Items (deferred to design0-ecosystem) ---
# These items are intentionally deferred. This domain's spec is thin by design —
# full specification will be produced by the design0-ecosystem skill when
# ecosystem-level service design is performed.
#
# [L67-O16] EventSubmissionResult.receipted only models UnindexedSignature —
#           witness receipts use non-transferable identifier signatures, but
#           the type hardcodes UnindexedSignature; TransferableReceiptCouples
#           (for delegated witnesses) are not modelled
# [L67-O17] KERLResponse references undefined ReceiptedEvent — the KERL query
#           response type contains an array of ReceiptedEvent which is not
#           defined in this domain or any referenced kernel
# [L67-O18] No OOBI verification properties — the witness exposes an OOBI
#           endpoint for discovery, but the domain has no invariant or port
#           contract covering OOBI construction or validation
# [L67-O19] Duplicate witness query ports — the api subdomain declares two ports
#           that both model KERL queries from watchers; one should be removed or
#           the distinction (e.g., full KERL vs. latest receipt) made explicit
# [L67-O20] No witness-to-witness dissemination port — the KERI spec says
#           witnesses MAY disseminate receipts to each other (OPTIONAL per
#           individual witness policy — broadcast, gossip, or not at all);
#           no outbound port models this optional peer-to-peer dissemination
# [L67-O21] No KERL persistence port — the witness stores KERLs but there is no
#           outbound port modelling the append-only KERL write contract; the
#           witness-repository external is referenced but not typed
# [L811-O4] FirstSeenRecord stores SAID not raw bytes — the first-seen log
#           records the SAID of each event, but the KERI spec requires the raw
#           event bytes to be recoverable; storing only the SAID is insufficient
#           if the witness is the only custodian of that event
# [L811-O5] Receipt prefix check fragile (hardcodes 'B') — the receipt
#           generation logic checks whether the witness prefix starts with 'B'
#           to determine the key type; this is brittle and should use a CESR
#           code table lookup
# [L811-O6] No witness pool coordination model — the domain describes a single
#           witness node; how witness pool members are discovered by controllers
#           (via OOBI), how threshold receipting works across the pool, and
#           how the controller waits for m-of-n receipts are all unspecified
