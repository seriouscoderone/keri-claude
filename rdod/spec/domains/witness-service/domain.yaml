# domain.yaml
template_version: "2.0"
id: "witness-service"
name: "Witness Service"
description: >
  Service-tier domain for witness node infrastructure. Deploys witness nodes that receipt
  key events under the first-seen rule, store KERLs, and disseminate receipts. Shared
  infrastructure — a single witness service serves many controllers. Does not hold
  private signing keys for any controller. Implementation: keriox components/witness,
  keripy witness module.
version: "0.1.0"
tier: "service"

source_material:
  - type: document
    reference: "keri-specification.md — KERI witness protocol (first-seen rule, receipting)"
  - type: document
    reference: "KERI_WP_2.x.web.md — witness architecture and agreement algorithm"
  - type: user-input
    reference: "CLAUDE.md — keriox components/witness, keripy witness module"

domain_clients:
  - ref: "domain://signify-client"
    relationship: "Indirect — Signify clients access witnesses via cloud-agent-service proxy"
    via_port: "port://witness-service/api/inbound/event-submission"
  - ref: "domain://local-agent"
    relationship: "Direct HTTP connection for local agent witness interactions"
    via_port: "port://witness-service/api/inbound/event-submission"
  - ref: "domain://cloud-agent-service"
    relationship: "Forwards events to witnesses and collects receipts on behalf of controllers"
    via_port: "port://witness-service/api/inbound/event-submission"

subdomains:
  - ref: "domain://witness-service/api"
    relationship: "Inbound message boundary — receives key events, verifies signatures, applies first-seen rule, returns receipts"
    via_port: "port://witness-service/api/inbound/event-submission"

kernels: []

adjacents:
  - ref: "domain://identity"
    relationship: "Conformist — implements accountability protocol (first-seen rule, receipting, KERL dissemination)"
    pattern: "Conformist"
    via_port: "port://identity/inbound/identity-management"
    is_cross_cutting: false

externals:
  - ref: "domain://externals/cryptographic-primitives"
    source: "Ed25519 for receipt signatures — witnesses sign with their own non-transferable keys"
    relationship: "Cryptographic signing primitives used directly in receipt generation"
  - ref: "domain://externals/persistence"
    relationship: "Append-only KERL persistence for event logs and receipts per monitored AID — the witness-repository outbound port delegates to this external"
  - ref: "domain://externals/transport"
    relationship: "HTTP endpoints for event submission, OOBI resolution, and queries — the http-server outbound port delegates to this external"

implementation_guidance:
  suggested_type: "service"
  language_affinity: "any"
  notes: >
    Primary implementation is keriox components/witness (Rust, axum). Python implementation
    available in keripy witness module. Witnesses are operationally independent — no shared
    state between witness nodes. Geographic and administrative diversity recommended for
    witness pool deployments.

issues: []

tags: ["witness", "service", "receipting", "first-seen", "infrastructure"]
