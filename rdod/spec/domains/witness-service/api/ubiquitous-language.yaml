# ubiquitous-language.yaml
domain_ref: "witness-service/api"

terms:
  - term: "Event Submission"
    synonyms: ["Witness Submission Endpoint"]
    definition: "The HTTP endpoint through which controllers and agents submit CESR-encoded key events for receipting by the witness."
    invariants:
      - "Accepts CESR-encoded key events via HTTP POST"
      - "Verifies controller signatures before applying first-seen rule"
      - "Returns a witness receipt on acceptance, or a rejection on conflict"
    examples:
      - "POST /submit — CESR stream containing inception event + controller signatures"
    related_terms: ["KERL Query", "OOBI Resolution"]

  - term: "KERL Query"
    synonyms: ["Witness KERL Endpoint"]
    definition: "The HTTP endpoint through which validators and watchers retrieve receipted key event logs for a given AID."
    invariants:
      - "Returns CESR-encoded KERL for the requested AID"
      - "Supports optional sequence number range filtering"
      - "No authentication required for read access"
    examples:
      - "GET /query/{aid} — returns full KERL as CESR stream"
    related_terms: ["Event Submission"]

  - term: "OOBI Resolution"
    synonyms: ["Well-Known OOBI Endpoint"]
    definition: "The HTTP endpoint at /.well-known/keri/oobi/{aid}/{role}/{eid} enabling bootstrap discovery of the witness. Implements the discovery domain's OOBI serving capability — the witness is one possible OOBI source, not the owner of the OOBI concept."
    invariants:
      - "Follows RFC 8615 .well-known URI convention"
      - "Returns endpoint information for the requested AID/role/eid combination"
      - "Implements discovery protocol's OOBI serving — see domain://discovery for the full OOBI model"
    examples:
      - "GET /.well-known/keri/oobi/EDP1.../witness/BDg3... — resolves witness OOBI"
    related_terms: ["Event Submission", "KERL Query"]

  - term: "Receipt Response"
    synonyms: ["Witness Receipt"]
    definition: "The CESR-encoded receipt returned by the witness after accepting a key event. Contains the witness's signature over the event, proving the witness has seen and stored it. This receipt is what controllers collect to meet their TOAD threshold."
    invariants:
      - "Contains the witness's non-transferable signature (Unindexed Signature) over the event SAID"
      - "Only produced for first-seen events — duplicate submissions return the existing receipt"
      - "Receipt is CESR-encoded for wire transmission"
      - "Controller collects receipts from multiple witnesses to satisfy TOAD"
    examples:
      - "Witness returns rct message with non-transferable receipt couple after accepting an icp event"
    related_terms: ["Event Submission", "KERL Query"]

  - term: "Witness Configuration"
    synonyms: ["Witness Bootstrap"]
    definition: "The initialization parameters for a witness node: its non-transferable AID (derived from a seed or key pair), the HTTP port to listen on, and optional TLS configuration. A witness has exactly one AID for its lifetime."
    invariants:
      - "Witness AID is non-transferable (B prefix for Ed25519) — cannot rotate keys"
      - "One AID per witness process — the AID IS the witness identity"
      - "HTTP port and optional TLS configured at startup"
      - "Witness OOBI is automatically available at /.well-known/keri/oobi/{witness_aid}/witness"
    examples:
      - "kli witness start --name wit0 --port 5632 — starts a witness with a non-transferable AID on port 5632"
    related_terms: ["Event Submission", "OOBI Resolution"]

events:
  - name: "EventSubmitted"
    payload: "aid: AID, sn: int, event_type: string, cesr_size: int"
    triggers: "Controller or agent submits a CESR-encoded key event to the witness API"

  - name: "QueryServed"
    payload: "aid: AID, sn_range: string, response_size: int"
    triggers: "Validator or watcher queries the witness API for a KERL"

rules:
  - "All inbound messages are CESR-encoded — the API boundary parses CESR streams"
  - "All outbound responses are CESR-encoded — receipts, KERLs, and errors are CESR streams"
  - "OOBI resolution is unauthenticated — discovery is open"
