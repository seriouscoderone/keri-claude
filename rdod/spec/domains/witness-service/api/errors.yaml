domain_ref: "witness-service/api"

errors:
  - name: "UnauthorizedEventError"
    description: "Received an event for an identifier that has not designated this witness"
    cause: "The event's witness list (b field) does not include this witness's AID"
    recovery: "abort"
    severity: "fatal"
    related_port: "port://witness-service/api/inbound/event-submission"
    context:
      - field: "event_prefix"
        type: "types://cesr/primitives#AID"
        description: "The AID of the event"
      - field: "witness_aid"
        type: "types://cesr/primitives#AID"
        description: "This witness's AID"

  - name: "FirstSeenConflictError"
    description: "Already receipted a different event at this (prefix, sn) — first-seen rule violation"
    cause: "This witness already signed an event with a different SAID at the same sequence number"
    recovery: "abort"
    severity: "fatal"
    related_port: "port://witness-service/api/inbound/event-submission"
    context:
      - field: "prefix"
        type: "types://cesr/primitives#AID"
        description: "The AID"
      - field: "sn"
        type: "integer"
        description: "The conflicting sequence number"
      - field: "first_seen_said"
        type: "types://cesr/primitives#SAID"
        description: "SAID of the event already receipted"
      - field: "new_said"
        type: "types://cesr/primitives#SAID"
        description: "SAID of the conflicting event"

  - name: "EventValidationError"
    description: "Event failed basic structural validation before receipting"
    cause: "Event body is malformed, signatures are missing or invalid, or SAID does not match"
    recovery: "abort"
    severity: "fatal"
    related_port: "port://witness-service/api/inbound/receipting"
    context:
      - field: "reason"
        type: "string"
        description: "Specific validation failure"

  - name: "MalformedEventError"
    description: "Submitted event is not valid CESR or has structural problems"
    cause: "The CESR stream cannot be parsed or the deserialized event is missing required fields"
    recovery: "abort"
    severity: "fatal"
    related_port: "port://witness-service/api/inbound/event-submission"
    context:
      - field: "reason"
        type: "string"
        description: "Parse or structural failure"

  - name: "UnsupportedEventTypeError"
    description: "Submitted event type is not handled by the witness API"
    cause: "Witness only accepts KEL events (icp, rot, ixn, dip, drt) and receipts (rct) — other ilks are rejected"
    recovery: "abort"
    severity: "fatal"
    related_port: "port://witness-service/api/inbound/event-submission"
    context:
      - field: "ilk"
        type: "string"
        description: "The rejected event type"

  - name: "SignatureVerificationFailedError"
    description: "Controller signatures on the submitted event do not verify"
    cause: "Event signatures could not be verified against the controller's current key state"
    recovery: "abort"
    severity: "fatal"
    related_port: "port://witness-service/api/inbound/event-submission"
    context:
      - field: "aid"
        type: "types://cesr/primitives#AID"
        description: "The AID whose signatures failed"
      - field: "event_said"
        type: "types://cesr/primitives#SAID"
        description: "SAID of the rejected event"
