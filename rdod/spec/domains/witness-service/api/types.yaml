domain_ref: "witness-service/api"

types:
  - name: "WitnessConfiguration"
    description: "Configuration for a witness node instance."
    variants:
      - name: "default"
        fields:
          - name: "witness_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "This witness's non-transferable AID"
          - name: "listen_port"
            type: "integer"
            required: true
            description: "HTTP port for receiving events"
            constraints:
              min: 1
              max: 65535
          - name: "max_identifiers"
            type: "integer"
            required: false
            description: "Maximum number of identifiers this witness will serve"
          - name: "receipt_timeout_seconds"
            type: "integer"
            required: false
            description: "How long to hold events before pruning unreceipted"
            constraints:
              min: 60
        invariants:
          - "witness_aid must be non-transferable — derived directly from the witness's public key"
          - "The witness stores a KERL (KEL + receipts) for every identifier it serves"

  - name: "EventSubmissionResult"
    description: "Outcome of submitting a key event to the witness for receipting."
    variants:
      - name: "receipted"
        fields:
          - name: "receipt"
            type: "types://cesr/primitives#UnindexedSignature"
            required: true
            description: "Witness's non-transferable signature over the event SAID"
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the accepted event"
        invariants:
          - "Produced only for first-seen events"
      - name: "escrowed"
        fields:
          - name: "reason"
            type: "string"
            required: true
            description: "Why the event was escrowed (out-of-order, missing signatures, etc.)"
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the escrowed event"
        invariants:
          - "Event held pending resolution of blocking condition"
      - name: "rejected"
        fields:
          - name: "reason"
            type: "string"
            required: true
            description: "Why the event was rejected (first-seen conflict, invalid signatures, etc.)"
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the rejected event"
        invariants:
          - "Rejected events are not stored — the rejection is terminal"

  - name: "KERLResponse"
    description: "CESR-encoded stream of receipted key events for a queried AID."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The AID whose KERL was requested"
          - name: "events"
            type: "array[ReceiptedEvent]"
            required: true
            description: "Ordered sequence of key events with witness receipts"
        invariants:
          - "Events are in strictly ascending sequence number order"
          - "Each event includes the witness's receipt (UnindexedSignature)"
