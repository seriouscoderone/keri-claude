# domain.yaml

template_version: "1.0"

id: "witness-service/api"

name: "Witness Service API"

description: >
  Inbound message boundary for witness nodes — receives key events from controllers,
  verifies signatures, applies the first-seen rule, and returns receipts. Consumes
  the KERI accountability protocol as an adjacent context. Handles CESR deserialization,
  signature verification, and message dispatch for all inbound witness traffic.

version: "0.1.0"

source_material:
  - type: document
    reference: "keriox components/witness — Rust witness implementation (axum HTTP handler)"
  - type: document
    reference: "keripy witness module — Python witness implementation"

ubiquitous_language:
  - term: "Message Intake"
    definition: "CESR deserialization of inbound event streams at the witness HTTP boundary"
    invariants:
      - "All inbound bytes are CESR-decoded before any domain processing"
  - term: "Request Authentication"
    definition: "Signature verification against the sender's current key state before accepting events"
    invariants:
      - "Events with invalid or missing signatures are rejected at the API boundary"
  - term: "Protocol Dispatch"
    definition: "Routing deserialized, authenticated messages to the appropriate domain handler by ilk"
    invariants:
      - "Only KEL events (icp, rot, ixn, dip, drt) and receipts (rct) are accepted — other ilks rejected"

domain_clients:
  - ref: "domain://witness-service"
    relationship: "Parent domain"

subdomains: []

kernels:
  - ref: "kernel://cesr"
    source: "domain://cesr"
    relationship: "Published Language — CESR encoding for all inbound/outbound messages"

adjacents:
  - ref: "domain://keri/accountability/receipting"
    relationship: "Conformist — implements receipting protocol"
    pattern: "Conformist"

externals: []

implementation_guidance:
  suggested_type: "service"
  language_affinity: "any"
  notes: "The witness API is a thin HTTP endpoint that deserializes CESR messages, verifies signatures, and delegates to the accountability domain for receipting logic."

tags: ["witness", "api", "receipting", "service"]

invariants:
  - "All inbound messages must be CESR-deserialized before processing"
  - "Signatures must be verified against current key state before accepting events"
  - "First-seen rule must be applied to all key events"
