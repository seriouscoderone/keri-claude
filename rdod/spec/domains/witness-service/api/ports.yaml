# ports.yaml
domain_ref: "witness-service/api"

ports:
  - id: "port://witness-service/api/inbound/event-submission"
    type: inbound
    name: "Event Submission"
    semantics: command
    idempotent: true  # duplicate submissions return cached receipt — per UL ("Receipt Response") and verification (test_resubmission_idempotent)
    contract:
      input: "CESR-encoded key event message"
      output: "types://witness-service/api#EventSubmissionResult"
      errors:
        - "errors://witness-service/api#MalformedEventError"
        - "errors://witness-service/api#UnsupportedEventTypeError"
        - "errors://witness-service/api#SignatureVerificationFailedError"
        - "errors://witness-service/api#UnauthorizedEventError"
        - "errors://witness-service/api#DuplicateReceiptError"
    refs: ["domain://cloud-agent-service", "domain://local-agent"]

  - id: "port://witness-service/api/inbound/receipting"
    type: inbound
    name: "Receipting"
    semantics: command
    idempotent: false
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://accountability/consensus#Receipt"
      errors:
        - "errors://witness-service/api#DuplicateReceiptError"
        - "errors://witness-service/api#EventValidationError"
    refs: ["domain://cloud-agent-service", "domain://local-agent"]

  - id: "port://witness-service/api/inbound/kerl-query"
    type: inbound
    name: "KERL Query"
    semantics: query
    idempotent: true
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://witness-service/api#KERLResponse"
      errors: []
    refs: ["domain://watcher-service"]

  - id: "port://witness-service/api/inbound/oobi-resolution"
    type: inbound
    name: "OOBI Resolution"
    semantics: query
    idempotent: true
    contract:
      input: "types://cesr/primitives#AID"
      output: "CESR reply messages with KEL replay"
      errors: []
    refs: []

  - id: "port://witness-service/api/inbound/endpoint-management"
    type: inbound
    name: "Endpoint Management"
    semantics: command
    idempotent: false
    contract:
      input: "types://cesr/primitives#AID"
      output: "Endpoint registration result"
      errors: []
    refs: []

  - id: "port://witness-service/api/outbound/http-server"
    type: outbound
    name: "HTTP Server"
    semantics: command
    idempotent: false
    contract:
      input: "types://witness-service/api#WitnessConfiguration"
      output: "Running HTTP server handle"
      errors: []
    refs: ["domain://externals/transport"]
