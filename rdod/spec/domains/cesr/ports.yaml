# ports.yaml
domain_ref: "cesr"

ports:
  # Inbound — what clients call
  - id: "port://cesr/inbound/encoding"
    type: inbound
    name: "Primitive Encoding"
    semantics: query
    idempotent: true
    contract:
      input: "Primitive bytes and code table identifier"
      output: "types://cesr/primitives#Matter"
      errors:
        - "errors://cesr#EncodingError"
        - "errors://cesr#DecodingError"
        - "errors://cesr#DomainConversionError"
        - "errors://cesr#AlignmentError"
    refs: ["domain://identity", "domain://credential-lifecycle"]

  - id: "port://cesr/inbound/code-lookup"
    type: inbound
    name: "Code Table Lookup"
    semantics: query
    idempotent: true
    contract:
      input: "CESR type code string"
      output: "types://cesr#CodeEntry"
      errors:
        - "errors://cesr#UnknownCodeError"
    refs: ["domain://identity", "domain://credential-lifecycle"]

  # Subdomain inbound ports are defined in their respective ports.yaml files:
  #   - primitives: port://cesr/primitives/inbound/qualification
  #   - composition: port://cesr/composition/inbound/stream-composition
