# domain.yaml
template_version: "1.0"
id: "cesr/cesr-stream"
name: "CESR Stream"
description: >
  The subdomain responsible for composing CESR primitives into hierarchically
  grouped streams using count codes, managing pipelining and multiplexing,
  handling cold-start detection and resynchronization, interleaving non-native
  serializations (JSON, CBOR, MGPK), and structuring messages with attachments.
  Count codes enable a stream parser to extract and offload entire groups
  without parsing individual primitives, supporting core-affinity and
  concurrent processing.
version: "0.1.0"

source_material:
  - type: document
    reference: "cesr-specification.md — CESR encoding specification (ToIP/IETF), v1.0, count code tables and stream parsing sections"

ubiquitous_language:
  - term: "Stream"
    definition: "An ordered sequence of self-framing CESR primitives, count code groups, and optionally interleaved non-native serializations that can be parsed and processed incrementally"
    invariants:
      - "Every element in a stream MUST be self-framing"
      - "A stream MUST start with a count code, a JSON/CBOR/MGPK mapping, or an annotated encoding"
      - "Streams support both T-domain and B-domain representations"

  - term: "Count Code"
    definition: "A special self-framing primitive that counts the number of quadlets/triplets in the following group of primitives, enabling pipelining without parsing group contents"
    invariants:
      - "Small count codes are 4 characters: '-' + type + 2 size chars (up to 4095 quadlets)"
      - "Large count codes are 8 characters: '--' + type + 5 size chars (up to 1,073,741,823 quadlets)"
      - "Count value MUST be invariant between T and B domains"

  - term: "Attachment"
    definition: "Signatures, receipts, seals, and other cryptographic material appended to a message body — never part of the signed content"
    invariants:
      - "Attachments follow the message body in the stream"
      - "Attachments are grouped by count codes indicating their type and size"

domain_clients:
  - ref: "domain://cesr"
    relationship: "CESR core delegates stream composition, group framing, and cold-start parsing to this subdomain"
    via_port: "port://cesr/cesr-stream/inbound/stream-composition"

subdomains: []

kernels: []

adjacents: []

externals:
  - name: "Transport Layer"
    abstraction: "Adapter"
    ref: "port://cesr/cesr-stream/outbound/transport"
    implementation_notes: "Stream delivery over TCP, UDP, HTTP, or WebSocket. The transport provides byte-level delivery; CESR stream provides the framing."

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    Reference implementation is keripy eventing.py and parsing.py (stream parsing, attachment
    handling, cold-start detection). Rust implementation in keriox_core. Count codes and
    group handling follow the -Dex naming convention (CtrDex for counter/count code constants).
    Stream parsers use a tritet-based dispatch table for cold-start resynchronization.

issues: []

tags: ["streaming", "pipelining", "count-codes", "attachments", "cold-start"]
