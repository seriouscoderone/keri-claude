# ubiquitous-language.yaml
domain_ref: "cesr/cesr-stream"

terms:
  - term: "Stream"
    synonyms: ["CESR Stream"]
    definition: "An ordered sequence of self-framing CESR primitives, count code groups, and optionally interleaved non-native serializations (JSON, CBOR, MGPK) that can be parsed and processed incrementally."
    invariants:
      - "Every element in a stream MUST be self-framing and composable"
      - "A stream MUST start (or restart) with one of 8 cases identified by the first tritet"
      - "Stream supports both T-domain (Base64 text) and B-domain (binary) representations"
      - "In-stride switching between T and B domain is detectable via starting tritet"
    examples:
      - "A KERI event message followed by attachment groups: JSON body + count-coded signature groups"
      - "A pipeline of multiple messages, each with its own attachment groups, processed concurrently"
    related_terms: ["Count Code", "Frame", "Cold Start", "Pipelining"]

  - term: "Count Code"
    synonyms: ["Group Code", "Framing Code"]
    definition: "A special self-framing primitive that encodes the type and size (in quadlets/triplets) of the following group of primitives, enabling a parser to extract entire groups without parsing their contents."
    invariants:
      - "Small count codes: 4 characters — '-' + type letter + 2 Base64 size chars (0-4095 quadlets)"
      - "Large count codes: 8 characters — '--' + type char + 5 Base64 size chars (0-1,073,741,823 quadlets)"
      - "Count codes have no raw value component — only type and size"
      - "Count value MUST be invariant between T and B domains (both measure 24-bit units)"
      - "Count codes MUST be aligned on 24-bit boundaries (pad size always 0)"
      - "Count code groups MAY be recursively composed (groups of groups)"
    examples:
      - "'-AAB' — generic pipeline group of 1 quadlet (4 chars T-domain)"
      - "'-KAC' — indexed controller signature group of 2 quadlets (8 chars T-domain)"
      - "'--A#####' — large generic pipeline group with 5-char Base64 size"
    related_terms: ["Quadlet", "Triplet", "Group", "Pipelining", "Frame"]

  - term: "Group"
    synonyms: ["Count Code Group", "Framed Group"]
    definition: "A collection of primitives or nested groups preceded by a count code that specifies the group's type and total size in quadlets/triplets."
    invariants:
      - "Every element within a group MUST be aligned on a 24-bit boundary"
      - "Only primitives or other groups are allowed as group contents"
      - "Groups are self-framing — the count code provides all information needed to skip the group"
      - "Groups enable pipelining — a parser can offload a group without parsing its contents"
    examples:
      - "A controller indexed signature group: count code -K## followed by indexed signatures"
      - "A message + attachments group: count code -B## followed by message body and attachment groups"
    related_terms: ["Count Code", "Frame", "Pipelining"]

  - term: "Frame"
    synonyms: ["Stream Frame"]
    definition: "A top-level element in a CESR stream — either a count code group, a non-native serialized field map, or an annotated encoding. Frames are the units of cold-start resynchronization."
    invariants:
      - "Each frame begins with a byte whose first tritet identifies the frame type"
      - "Frames are independently parseable — a stream resumes at the next frame boundary"
      - "A frame may contain a non-native serialization (JSON, CBOR, MGPK) or a CESR count code group"
    examples:
      - "A JSON-serialized KERI event (starts with '{', tritet 0b011)"
      - "A CESR count code group (starts with '-', tritet 0b001)"
    related_terms: ["Stream", "Cold Start", "Tritet"]

  - term: "Attachment"
    synonyms: ["Attachments"]
    definition: "Cryptographic material (signatures, receipts, seals) appended to a message body in a stream. Attachments are grouped by count codes and are never part of the signed content."
    invariants:
      - "Attachments follow the message body in stream order"
      - "Attachments are NOT part of the serialized content that is signed or digested"
      - "Attachment groups are self-framing via count codes"
      - "Attachments-only group uses count code -C## or --C#####"
      - "Attachment types are identified by their count code type character"
    examples:
      - "Controller indexed signatures: -K## followed by Siger primitives"
      - "Witness indexed signatures: -L## followed by Siger primitives"
      - "Non-transferable receipt couples: -M## followed by (prefix, signature) pairs"
      - "Transferable receipt quadruples: -N## followed by (prefix, seq, digest, signature) tuples"
    related_terms: ["Message", "Count Code", "Siger"]

  - term: "Message"
    synonyms: ["CESR Message"]
    definition: "A complete unit in a CESR stream consisting of a message body (serialized field map) plus zero or more attachment groups. The body contains the protocol data; attachments provide cryptographic commitments."
    invariants:
      - "Message body is a serialized field map (JSON, CBOR, MGPK, or CESR native)"
      - "Attachments are appended after the body, never embedded within it"
      - "Message + attachments group uses count code -B## or --B#####"
      - "The body's first field MUST be the Version String 'v' (for non-native serializations)"
    examples:
      - "A KERI inception event (JSON body) followed by controller signatures (-K##) and witness receipts (-L##)"
      - "An ACDC credential (CESR native -G##) followed by signature attachments"
    related_terms: ["Attachment", "Version String", "Count Code", "Frame"]

  - term: "Pipelining"
    synonyms: ["Stream Pipelining", "Multiplexing"]
    definition: "The ability to extract and offload entire count code groups from a stream for concurrent processing, without parsing individual primitives within the group."
    invariants:
      - "All count codes are pipelineable because they count quadlets/triplets"
      - "Count value is invariant between T and B domains — no re-computation needed for domain conversion"
      - "Groups can be offloaded to different processor cores (core affinity)"
      - "Hierarchical count codes enable recursive pipelining of nested groups"
    examples:
      - "A stream processor reads -A## to know the group size, extracts that many quadlets, and sends the group to another core"
      - "Multiple message+attachment groups pipelined for concurrent signature verification"
    related_terms: ["Count Code", "Group", "Stream", "Quadlet"]

  - term: "Cold Start"
    synonyms: ["Cold Start Problem", "Stream Resynchronization"]
    definition: "The process by which a stream parser determines the type of the next frame after initialization or after encountering malformed data. Uses the first tritet (3 bits) of the next byte to identify the frame type."
    invariants:
      - "Eight starting tritets partition all possible frame types"
      - "0b000: annotated T-domain; 0b001: CESR T-domain count code ('-'); 0b010: CESR T-domain op code ('_')"
      - "0b011: JSON ('{'); 0b100: MGPK FixMap; 0b101: CBOR Map; 0b110: MGPK Map16/32; 0b111: CESR B-domain"
      - "Parser needs only 3 bits to classify the next frame — no scanning or lookahead required"
    examples:
      - "After TCP reconnect, parser reads first byte: 0x7b ('{') -> tritet 0b011 -> JSON serialization"
      - "After error recovery, parser skips to next frame boundary and reads 0x2d ('-') -> tritet 0b001 -> CESR T-domain count code"
    related_terms: ["Tritet", "Stream", "Frame", "Version String"]

  - term: "Version String Sniffing"
    synonyms: ["Protocol Sniffing"]
    definition: "The process of using a regular expression to extract the Version String from the first field of a non-native serialization (JSON, CBOR, MGPK) to determine its protocol, version, serialization kind, and size."
    invariants:
      - "Triggered when the starting tritet indicates JSON (0b011), CBOR (0b101), or MGPK (0b100/0b110)"
      - "The Version String MUST be in the first field with label 'v'"
      - "Version String format (2.XX): PPPPMmmGggKKKKBBBB. (19 characters)"
      - "BBBB provides serialization size in Base64, enabling the parser to extract the complete field map"
    examples:
      - "Sniffing '{\"v\":\"KERICAACAAJSON...' -> protocol=KERI, version=2.0, genus=2.0, kind=JSON, size from BBBB"
    related_terms: ["Version String", "Cold Start", "Serialization Kind"]

  - term: "Interleaved Serialization"
    synonyms: ["Non-Native Serialization", "Interleaved Non-CESR"]
    definition: "A JSON, CBOR, or MGPK field map serialization that appears at the top level of a CESR stream, interleaved with native CESR count code groups."
    invariants:
      - "MUST have a Version String as the first field (label 'v')"
      - "Detectable by starting tritet: JSON=0b011, CBOR=0b101, MGPK=0b100/0b110"
      - "Top-level interleaving is supported; nested non-native serializations within count code groups MUST use the -H## enclosure code"
      - "CESR primitives MAY appear as delimited text values within non-native field maps"
    examples:
      - "A JSON-serialized KERI event at the top level of a stream, followed by CESR attachment groups"
      - "A CBOR-serialized field map interleaved between CESR count code groups"
    related_terms: ["Serialization Kind", "Version String", "Cold Start"]

  - term: "Universal Count Code"
    synonyms: ["Universal Code"]
    definition: "A count code that MUST be present in every protocol genus's count code table. Universal codes provide cross-protocol interoperability."
    invariants:
      - "All genera MUST implement universal count codes with identical semantics"
      - "Overrideable universal codes: -A## (generic pipeline), -B## (message+attachments), -C## (attachments only)"
      - "Non-overrideable universal codes: -D## (datagram), -E## (ESSR wrapper), -F## (native fixed field), -G## (native field map), -H## (enclosed non-native), -I## (generic field map), -J## (generic list)"
      - "Overrideable codes allow genus/version override when a genus/version code appears as the first element"
    examples:
      - "'-AAC' — generic pipeline group of 2 quadlets (universal across all genera)"
      - "'-BAD' — message + attachments group of 3 quadlets"
      - "'-CAB' — attachments-only group of 1 quadlet"
    related_terms: ["Count Code", "Protocol Genus", "Genus-Specific Count Code"]

  - term: "Genus-Specific Count Code"
    synonyms: ["Protocol-Specific Count Code"]
    definition: "A count code whose meaning is defined by a specific protocol genus. The KERI/ACDC genus defines count codes for signatures, receipts, seals, and other protocol-specific groups."
    invariants:
      - "May differ in meaning between protocol genera"
      - "KERI/ACDC genus codes: -K## (controller sigs), -L## (witness sigs), -M## (non-transferable receipt couples), -N## (transferable receipt quadruples), -O## (first-seen replay couples), -P## (pathed material), -Q## (digest seals), -R## (merkle root seals), -S## (event seal source couples), -T## (anchoring event seal triples)"
    examples:
      - "'-KAC' — KERI indexed controller signature group of 2 quadlets"
      - "'-LAB' — KERI indexed witness signature group of 1 quadlet"
      - "'-MAD' — KERI non-transferable receipt couples of 3 quadlets"
    related_terms: ["Universal Count Code", "Count Code", "Protocol Genus"]

  - term: "Protocol Genus/Version Code"
    synonyms: ["Genus/Version Code", "Protocol Table Selector"]
    definition: "An 8-character code (-_GGGVVV) that specifies the protocol genus and version for the following count code groups, enabling protocol-specific code table selection."
    invariants:
      - "Format: '-_' + 3-char genus (GGG) + 3-char version (VVV)"
      - "First V is major version (0-63); last VV is minor version (0-4095)"
      - "Modifies interpretation of all subsequent count codes until another genus/version code appears"
      - "Universal across all genera — the genus/version table itself is shared"
    examples:
      - "'-_AAABAA' — KERI/ACDC genus AAA, version 1.00"
      - "'-_AAACAA' — KERI/ACDC genus AAA, version 2.00"
    related_terms: ["Protocol Genus", "Count Code", "Universal Count Code"]

  - term: "Op Code"
    synonyms: ["Operation Code"]
    definition: "A reserved code type using the '_' selector, intended for future stream processing instructions beyond simple primitive concatenation and group counting."
    invariants:
      - "Selector '_' is reserved for op codes"
      - "Starting tritet in T domain is 0b010"
      - "Not yet specified — reserved for future stack-based virtual machine operations"
    examples:
      - "Future: stream processing directives, conditional routing, transformation instructions"
    related_terms: ["Selector", "Count Code", "Stream"]

  - term: "ESSR Wrapper"
    synonyms: ["ESSR"]
    definition: "An End-to-end Signed Streaming Representation wrapper — a count code group (-E##) that encloses signable content for authenticated streaming."
    invariants:
      - "Uses count code -E## or --E##### (non-overrideable universal code)"
      - "Content within the wrapper is the signable portion"
    examples:
      - "An ESSR wrapper enclosing a TSP payload with signatures attached outside the wrapper"
    related_terms: ["Count Code", "Universal Count Code", "Message"]

  - term: "ColdCode"
    synonyms: ["Cold Start Code"]
    definition: "Concrete enum representing the 8 possible values of the first tritet (3 bits) of a stream byte. Determines which parser is invoked for the next frame."
    invariants:
      - "Computed as byte >> 5 (high 3 bits)"
      - "Values: Free (0b000), CtB64 (0b001), OpB64 (0b010), Json (0b011), MGPK1 (0b100), Cbor (0b101), MGPK2 (0b110), CtOpB2 (0b111)"
      - "CtB64/OpB64 → CESR group parser; Json/Cbor/MGPK → non-native payload parser; CtOpB2 → binary group parser"
    examples:
      - "byte 0x7b ('{') >> 5 = 0b011 → Json → parse as JSON payload"
      - "byte 0x2d ('-') >> 5 = 0b001 → CtB64 → parse counter then dispatch to group"
    related_terms: ["Cold Start", "Tritet", "Parser Dispatch"]

  - term: "CesrGroup"
    synonyms: ["Group Variant"]
    definition: "Tagged union enum of all concrete CESR group types. The dispatch target after a counter is parsed — counter code string determines which variant to construct."
    invariants:
      - "12 variants in the KERI/ACDC genus (see Concrete Group Types)"
      - "Each variant wraps a typed group struct"
      - "Implements GroupItem trait for polymorphic round-trip serialization"
      - "Unknown counter codes produce an error (extensible via new variants)"
    examples:
      - "CesrGroup::ControllerIdxSigsVariant — counter code '-A', wraps Vec<Siger>"
      - "CesrGroup::TransReceiptQuadruplesVariant — counter code '-D', wraps Vec<(Prefixer, Seqner, Saider, Siger)>"
    related_terms: ["GroupItem", "Counter", "Parser Dispatch"]

  - term: "GroupItem"
    synonyms: []
    definition: "Trait for round-trip serialization of group elements. Every group type and CesrGroup itself implements this trait, enabling polymorphic encoding."
    invariants:
      - "Methods: qb64(), qb64b(), qb2(), full_size()"
      - "qb64 serialization: counter.qb64() + concatenated items' qb64()"
      - "full_size(): counter size + sum of all items' full sizes"
      - "Round-trip: parse from stream → serialize back to identical bytes"
    examples:
      - "group.qb64() → '-AAC' + siger1.qb64() + siger2.qb64()"
    related_terms: ["CesrGroup", "Group", "Count Code"]

  - term: "Parser Dispatch"
    synonyms: ["Group Dispatch"]
    definition: "The two-stage parsing pattern: (1) parse ColdCode from first tritet to determine frame type, (2) if CESR group: parse counter, match counter.code() to determine group type, invoke group-specific parser."
    invariants:
      - "Stage 1: ColdCode selects CESR group vs non-native payload"
      - "Stage 2: counter.code() string match selects concrete group parser"
      - "Group parsers use nom combinators: count() for repeated items, tuple() for fixed structures, many0() for nested groups"
      - "All parsers return (remaining_bytes, parsed_value) — enabling stream continuation"
    examples:
      - "byte → CtB64 → parse counter '-A##' → code 'A' → ControllerIdxSigs parser → count(siger_parser, n)"
    related_terms: ["ColdCode", "CesrGroup", "Counter"]

  - term: "MessageList"
    synonyms: []
    definition: "A sequence of zero or more Messages parsed from a stream. Uses many0(message_parser) to consume all available messages until the stream is exhausted or a parse error occurs."
    invariants:
      - "Terminates when message parser fails (typically insufficient bytes)"
      - "Each message is either a CustomPayload (non-native) or a CesrGroup"
      - "Remaining unparsed bytes are returned for the next read cycle"
    examples:
      - "TCP stream → MessageList of 3 messages: [JSON event, sig group, JSON event]"
    related_terms: ["Message", "Stream", "Parser Dispatch"]

  - term: "CustomPayload"
    synonyms: ["Non-Native Payload"]
    definition: "A parsed non-native serialization (JSON, CBOR, MessagePack) extracted from a stream. Wraps the deserialized value and supports typed extraction."
    invariants:
      - "Created when ColdCode indicates Json, Cbor, MGPK1, or MGPK2"
      - "Internally holds a serde_json::Value (or equivalent)"
      - "to_typed_message::<D>() deserializes to a strongly-typed struct"
      - "Size determined by version string sniffing or serialization-specific length encoding"
    examples:
      - "JSON KERI inception event parsed as CustomPayload → typed as InceptionEvent"
    related_terms: ["Message", "Version String Sniffing", "ColdCode"]

  - term: "Concrete Group Types"
    synonyms: ["KERI/ACDC Group Types"]
    definition: "The 12 specific group structures defined by the KERI/ACDC genus, each with a fixed internal structure of CESR primitives."
    invariants:
      - "Simple sig groups: ControllerIdxSigs (-A, Vec<Siger>), WitnessIdxSigs (-B, Vec<Siger>)"
      - "Couple groups: NonTransReceiptCouples (-C, Vec<Cigar>), SealSourceCouples (-G, Vec<(Seqner,Saider)>), FirstSeenReplayCouples (-E, Vec<(Seqner,Dater)>)"
      - "Quadruple groups: TransReceiptQuadruples (-D, Vec<(Prefixer,Seqner,Saider,Siger)>)"
      - "Nested groups: TransIdxSigGroups (-F, Vec<(Prefixer,Seqner,Saider,ControllerIdxSigs)>), TransLastIdxSigGroups (-H, Vec<(Prefixer,ControllerIdxSigs)>)"
      - "SAD path groups: SadPathSigGroups (-K, path+nested), SadPathSigs (-J, path+counter+primitives)"
      - "Container groups: AttachedMaterialQuadlets (-V, Vec<CesrGroup>), PathedMaterialQuadlets (-L, raw bytes)"
    examples:
      - "-A## + Siger Siger Siger → ControllerIdxSigs with 3 controller signatures"
      - "-D## + (Prefixer Seqner Saider Siger) × N → TransReceiptQuadruples with N receipts"
      - "-V## + any CesrGroup* → AttachedMaterialQuadlets containing heterogeneous nested groups"
    related_terms: ["CesrGroup", "Count Code", "Genus-Specific Count Code"]

  - term: "AttachedMaterialQuadlets"
    synonyms: ["Generic Attachment Container"]
    definition: "A container group (-V##) that can hold any mix of CesrGroup types. Items are self-describing — each nested group has its own counter. The outer count is in quadlets (total size / 4 - 1)."
    invariants:
      - "Counter code '-V'; count = total_quadlets - 1 (excludes own counter)"
      - "Inner items parsed via many0(CesrGroup::from_stream_bytes) — cold-start on each"
      - "Enables heterogeneous attachment collections without pre-declaring types"
    examples:
      - "-V## containing: -A## (controller sigs) + -C## (non-trans receipts) + -G## (seal source couples)"
    related_terms: ["CesrGroup", "Concrete Group Types"]

  - term: "PathedMaterialQuadlets"
    synonyms: ["Raw Material Container"]
    definition: "An opaque container group (-L##) that stores raw CESR bytes without parsing their contents. Enables extensibility — application-level code interprets the material."
    invariants:
      - "Counter code '-L'; byte count = counter.count() * 4 (QB64) or * 3 (QB2)"
      - "No parsing of contents — preserved as raw bytes"
      - "Quadlet-aligned — total size must be exact"
    examples:
      - "-L## + raw CESR bytes → preserved for application-specific processing"
    related_terms: ["CesrGroup", "Concrete Group Types"]

events:
  - name: "StreamStarted"
    payload: "tritet: Tritet, frame_type: FrameType"
    triggers: "A stream parser detects the first byte of a new stream or performs a cold-start resynchronization"

  - name: "GroupExtracted"
    payload: "count_code: CountCode, size_quadlets: int, content: bytes"
    triggers: "A stream parser reads a count code and extracts the corresponding number of quadlets/triplets"

  - name: "GroupOffloaded"
    payload: "count_code: CountCode, content: bytes, target: ProcessorCore"
    triggers: "An extracted group is sent to another processor for concurrent processing (pipelining)"

  - name: "MessageParsed"
    payload: "body: FieldMap, attachments: [AttachmentGroup]"
    triggers: "A complete message (body + attachments) is parsed from the stream"

  - name: "SerializationSniffed"
    payload: "kind: SerializationKind, protocol: str, version: str, size: int"
    triggers: "Version string sniffing extracts protocol metadata from a non-native serialization"

  - name: "ColdStartTriggered"
    payload: "reason: str, position: int"
    triggers: "Parser encounters malformed data and must resynchronize at the next frame boundary"

  - name: "GroupDispatched"
    payload: "counter_code: str, group_type: CesrGroup variant, item_count: int"
    triggers: "Counter parsed and matched to a concrete group type — group-specific parser invoked"

  - name: "GroupSerialized"
    payload: "group_type: str, qb64_size: int, item_count: int"
    triggers: "A CesrGroup is serialized to qb64/qb2 for round-trip or transmission"

rules:
  - "Every stream MUST start (or restart) with one of 8 frame types identified by the first tritet"
  - "Count codes count quadlets/triplets, NOT individual primitives — this enables domain-invariant group sizing"
  - "Pipelining MUST be supported — a parser MUST be able to extract groups without parsing their contents"
  - "Non-native serializations at the top level MUST have a Version String as their first field"
  - "Non-native serializations nested inside count code groups MUST use the -H## enclosure code"
  - "A genus/version code overrides the active code table only when it appears as the first element inside an overrideable universal count code group (-A, -B, -C)"
  - "Attachments are NOT part of the signed content — they follow the message body and are grouped separately"
  - "Cold-start resynchronization requires only 3 bits (one tritet) to classify the next frame type"
  - "Parser dispatch is two-stage: ColdCode selects frame type, then counter.code() selects group parser"
  - "All parsers return (remaining_bytes, parsed_value) — enabling incremental stream processing"
  - "Group serialization is the exact inverse of parsing — qb64 round-trip must produce identical bytes"
  - "AttachedMaterialQuadlets is the only group that can contain heterogeneous nested groups"
  - "PathedMaterialQuadlets is opaque — the stream parser preserves but does not interpret its contents"
