    strategy: "genus_strategy() x st.integers(0, 63) x st.integers(0, 63)"
    notes: "Spec L1870-1905. Genus/version codes identify protocol table sets. Finding: CESR-INV-003."

  # --- v1.XX Backward Compatibility (Finding CESR-INV-004) ---
  - invariant: "Compliant Version 2.XX implementations MUST support the old Version 1.XX Version String format. A v2 parser MUST accept v1 version strings (17 chars, underscore-terminated) and v2 strings (19 chars, dot-terminated). Both formats MUST be parseable in the same stream."
    term: "Version String"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(v1_msg=v1_message_strategy(), v2_msg=v2_message_strategy())
        def test_v1_backward_compat(v1_msg, v2_msg):
            # v2 parser handles v1
            parsed_v1 = parse_message(v1_msg)
            assert parsed_v1.version.major == 1
            assert len(parsed_v1.version_string) == 17
            # v2 parser handles v2
            parsed_v2 = parse_message(v2_msg)
            assert parsed_v2.version.major == 2
            assert len(parsed_v2.version_string) == 19
            # Mixed stream
            mixed = v1_msg + v2_msg
            frames = parse_stream(mixed)
            assert len(frames) == 2
    strategy: "v1_message_strategy() x v2_message_strategy() — generates complete messages in both version formats"
    notes: "Spec L2682. v2 must be backward-compatible with v1. Finding: CESR-INV-004."

  # --- SAD Path Array Integer Constraint (Finding CESR-INV-005) ---
  - invariant: "In a SAD Path expression, when a path component indexes into an array context, the component MUST be a non-negative integer. String components in array context MUST be rejected as a PathError."
    term: "SAD Path Language"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(sad=sad_with_arrays_strategy(), path=sad_path_strategy())
        def test_sad_path_array_integer(sad, path):
            for component, context in zip_path_contexts(sad, path):
                if context == 'array':
                    assert isinstance(component, int), \
                        f"Array context requires integer index, got {type(component)}"
                    assert component >= 0, \
                        f"Array index must be non-negative, got {component}"
    strategy: "sad_with_arrays_strategy() x sad_path_strategy() — generates SADs with nested arrays and valid/invalid path expressions"
    notes: "Spec L3294. SAD Path array indexing must use integers. Finding: CESR-INV-005."

# Formalized port contracts
contracts:
  - port_ref: "port://cesr/composition/inbound/stream-composition"
    preconditions:
      - formal:
          language: "python"
          expression: |
            lambda body, attachments: (
                isinstance(body, bytes) and len(body) > 0
                and all(isinstance(a, Group) for a in attachments)
                and all(len(a.qb64) % 4 == 0 for a in attachments)
            )
        description: "Body is non-empty bytes, attachments are valid composable groups"
      - formal:
          language: "python"
          expression: |
            lambda count_code_type, primitives: (
                count_code_type in VALID_COUNT_TYPES
                and all(len(p.qb64) % 4 == 0 for p in primitives)
            )
        description: "Count code type is valid, all primitives are composable"
    postconditions:
      - formal:
          language: "python"
          expression: |
            lambda stream: (
                all(len(elem.qb64) % 4 == 0 for elem in parse_all_elements(stream))
            )
        description: "Every element in the composed stream is composable"
      - formal:
          language: "python"
          expression: |
            lambda stream: parse_all_elements(stream) is not None
        description: "Composed stream is parseable (self-framing throughout)"

  - port_ref: "port://cesr/composition/inbound/stream-parsing"
    preconditions:
      - formal:
          language: "python"
          expression: |
            lambda stream: isinstance(stream, (str, bytes)) and len(stream) > 0
        description: "Stream is non-empty string or bytes"
      - formal:
          language: "python"
          expression: |
            lambda byte: isinstance(byte, int) and 0 <= byte <= 255
        description: "Sniff input is a single byte in valid range"
    postconditions:
      - formal:
          language: "python"
          expression: |
            lambda frames: all(
                f.raw[0] >> 5 == expected_tritet(f.frame_type)
                for f in frames
            )
        description: "Each parsed frame's first byte tritet matches its classified type"
      - formal:
          language: "python"
          expression: |
            lambda stream, frames, remaining: (
                b''.join(f.raw for f in frames) + remaining == stream
            )
        description: "Parsed frames + remaining bytes reconstruct the original stream"

  - port_ref: "port://cesr/composition/inbound/attachment-management"
    preconditions:
      - formal:
          language: "python"
          expression: |
            lambda body, sigs, code_type: (
                isinstance(body, bytes) and len(body) > 0
                and all(isinstance(s, (Siger, Cigar)) for s in sigs)
                and code_type in ATTACHMENT_COUNT_TYPES
            )
        description: "Body is non-empty bytes, signatures are valid, code type is valid attachment type"
    postconditions:
      - formal:
          language: "python"
          expression: |
            lambda result: (
                parse_body(result) is not None
                and parse_attachments(result) is not None
                and len(result) > len(parse_body(result))
            )
        description: "Result contains parseable body and non-empty attachment groups"

  - port_ref: "port://cesr/composition/outbound/transport"
    preconditions:
      - formal:
          language: "python"
          expression: |
            lambda endpoint, stream: (
                isinstance(endpoint, str) and len(endpoint) > 0
                and isinstance(stream, (str, bytes)) and len(stream) > 0
            )
        description: "Endpoint is a non-empty URL string, stream is non-empty"
    postconditions:
      - formal:
          language: "python"
          expression: |
            lambda result: result.is_ok() or result.is_err()
        description: "Transport returns a typed Result — no uncaught exceptions"

# State machine specifications
state_machines:
  - name: "Cold Start Parser"
    term: "ColdCode"
    states:
      - "Idle"
      - "ReadTritet"
      - "DispatchCesrT"
      - "DispatchCesrB"
      - "DispatchJson"
      - "DispatchCbor"
      - "DispatchMGPK"
      - "DispatchAnnotated"
      - "ParseComplete"
      - "Error"
    transitions:
      - from: "Idle"
        to: "ReadTritet"
        trigger: "byte available in stream"
        guard: "len(stream) > 0"
      - from: "ReadTritet"
        to: "DispatchCesrT"
        trigger: "tritet in {1, 2} (CtB64 or OpB64)"
        guard: "stream[0] >> 5 in {1, 2}"
      - from: "ReadTritet"
        to: "DispatchCesrB"
        trigger: "tritet == 7 (CtOpB2)"
        guard: "stream[0] >> 5 == 7"
      - from: "ReadTritet"
        to: "DispatchJson"
        trigger: "tritet == 3 (Json)"
        guard: "stream[0] >> 5 == 3"
      - from: "ReadTritet"
        to: "DispatchCbor"
        trigger: "tritet == 5 (Cbor)"
        guard: "stream[0] >> 5 == 5"
      - from: "ReadTritet"
        to: "DispatchMGPK"
        trigger: "tritet in {4, 6} (MGPK1 or MGPK2)"
        guard: "stream[0] >> 5 in {4, 6}"
      - from: "ReadTritet"
        to: "DispatchAnnotated"
        trigger: "tritet == 0 (Free)"
        guard: "stream[0] >> 5 == 0"
      - from: "DispatchCesrT"
        to: "ParseComplete"
        trigger: "CESR T-domain group successfully parsed"
        guard: "len(stream) >= required_bytes(counter)"
      - from: "DispatchCesrB"
        to: "ParseComplete"
        trigger: "CESR B-domain group successfully parsed"
        guard: "len(stream) >= required_bytes(counter)"
      - from: "DispatchJson"
        to: "ParseComplete"
        trigger: "JSON field map extracted via version string size"
        guard: "stream[:2] contains valid 'v' field with BBBB size"
      - from: "DispatchCbor"
        to: "ParseComplete"
        trigger: "CBOR field map extracted"
        guard: "valid CBOR encoding"
      - from: "DispatchMGPK"
        to: "ParseComplete"
        trigger: "MessagePack field map extracted"
        guard: "valid MessagePack encoding"
      - from: "DispatchAnnotated"
        to: "ParseComplete"
        trigger: "Annotated encoding extracted"
        guard: "valid annotated format"
      - from: "DispatchCesrT"
        to: "Error"
        trigger: "insufficient bytes or malformed group"
        guard: "len(stream) < required_bytes(counter) or parse_failure"
      - from: "DispatchCesrB"
        to: "Error"
        trigger: "insufficient bytes or malformed group"
        guard: "len(stream) < required_bytes(counter) or parse_failure"
      - from: "DispatchJson"
        to: "Error"
        trigger: "invalid JSON or missing version string"
        guard: "parse_failure or 'v' not first field"
      - from: "DispatchCbor"
        to: "Error"
        trigger: "invalid CBOR"
        guard: "parse_failure"
      - from: "DispatchMGPK"
        to: "Error"
        trigger: "invalid MessagePack"
        guard: "parse_failure"
      - from: "ParseComplete"
        to: "Idle"
        trigger: "frame consumed, advance to next"
        guard: "len(remaining) > 0"
      - from: "Error"
        to: "Idle"
        trigger: "skip to next frame boundary (cold-start recovery)"
        guard: "recovery heuristic finds next valid tritet"
    invariants:
      - "Exactly one transition fires per tritet value — no ambiguity in dispatch"
      - "ParseComplete MUST return (parsed_frame, remaining_bytes)"
      - "Error state is recoverable — parser MUST resynchronize at next frame boundary"
      - "Every Dispatch* state either transitions to ParseComplete or Error — no hangs"
      - "Empty stream in Idle state is NOT an error — parser terminates normally"
    initial_state: "Idle"
    terminal_states: ["ParseComplete", "Error"]

  - name: "Group Parser"
    term: "CesrGroup"
    states:
      - "ReadCounter"
      - "MatchGroupType"
      - "ParseItems"
      - "GroupComplete"
      - "UnknownGroup"
      - "Error"
    transitions:
      - from: "ReadCounter"
        to: "MatchGroupType"
        trigger: "counter parsed from stream"
        guard: "valid count code prefix ('-' or '--') and sufficient bytes"
      - from: "ReadCounter"
        to: "Error"
        trigger: "invalid count code prefix or insufficient bytes"
        guard: "not stream.startswith('-') or len(stream) < 4"
      - from: "MatchGroupType"
        to: "ParseItems"
        trigger: "counter.code matches a known group type"
        guard: "counter.code in KNOWN_GROUP_CODES"
      - from: "MatchGroupType"
        to: "UnknownGroup"
        trigger: "counter.code does not match any known group type"
        guard: "counter.code not in KNOWN_GROUP_CODES"
      - from: "ParseItems"
        to: "GroupComplete"
        trigger: "all items parsed (count exhausted)"
        guard: "parsed_quadlets == counter.count"
      - from: "ParseItems"
        to: "ParseItems"
        trigger: "next item parsed from stream"
        guard: "parsed_quadlets < counter.count and sufficient bytes"
      - from: "ParseItems"
        to: "Error"
        trigger: "insufficient bytes or malformed item"
        guard: "parsed_quadlets < counter.count and insufficient bytes"
    invariants:
      - "Counter MUST be parsed before items"
      - "Total parsed quadlets MUST equal counter.count at GroupComplete"
      - "Item types MUST match the group type's expected structure"
      - "Group serialization MUST be exactly counter.qb64 + items' qb64 concatenated"
      - "Insufficient bytes during item parsing MUST transition to Error, not hang"
    initial_state: "ReadCounter"
    terminal_states: ["GroupComplete", "UnknownGroup", "Error"]

validation_constraints:
  - id: "C1_cold_start"
    constraint: "Classify frame type from first byte tritet (byte >> 5) — O(1) dispatch"
    depends_on: []
    on_failure: "reject — unrecognized tritet"

  - id: "C2_version_string"
    constraint: "If frame is a field map (JSON/CBOR/MGPK/CESR), extract and validate version string from first field"
    depends_on: ["C1_cold_start"]
    on_failure: "reject — invalid or unsupported version string"

  - id: "C3_size_extraction"
    constraint: "Extract total serialization size from version string — determines how many bytes to consume"
    depends_on: ["C2_version_string"]
    on_failure: "reject — size exceeds maximum or doesn't match available bytes"

  - id: "C4_body_extraction"
    constraint: "Extract message body (size bytes) and remaining stream (attachments)"
    depends_on: ["C3_size_extraction"]
    on_failure: "wait — insufficient bytes, yield for more input"

  - id: "C5_attachment_parsing"
    constraint: "Parse attachment groups from remaining stream using count codes"
    depends_on: ["C4_body_extraction"]
    on_failure: "reject — malformed count code or truncated attachment"

  - id: "C6_frame_complete"
    constraint: "Complete frame: message body + parsed attachments ready for domain dispatch"
    depends_on: ["C5_attachment_parsing"]
    on_failure: null

