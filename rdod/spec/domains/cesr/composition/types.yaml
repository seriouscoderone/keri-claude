domain_ref: "cesr/composition"

types:
  - name: "CountCode"
    description: "A self-framing prefix that declares the type and size of the following group of primitives."
    variants:
      - name: "small"
        fields:
          - name: "selector"
            type: "string"
            required: true
            description: "Type character after the '-' prefix"
            constraints:
              pattern: "^[A-Za-z]$"
          - name: "count"
            type: "integer"
            required: true
            description: "Number of quadlets (text) or triplets (binary) in the group"
            constraints:
              min: 0
              max: 4095
        invariants:
          - "Text format: '-' + selector + 2 Base64 chars (4 chars total)"
          - "text_size_bytes = 4 * count"
          - "binary_size_bytes = 3 * count"
      - name: "large"
        fields:
          - name: "selector"
            type: "string"
            required: true
            description: "Type character after the '--' prefix"
          - name: "count"
            type: "integer"
            required: true
            description: "Number of quadlets/triplets"
            constraints:
              min: 0
              max: 1073741823
        invariants:
          - "Text format: '--' + selector + 5 Base64 chars (8 chars total)"

  - name: "CESRGroup"
    description: >
      A count-code-prefixed group of CESR primitives. Groups are self-framing and composable —
      they can nest. KERI/ACDC 2.00 genus-specific group codes: -K ControllerIdxSigs Vec<Siger>,
      -L WitnessIdxSigs Vec<Siger>, -M NonTransReceiptCouples Vec<(Prefixer, Cigar)>,
      -N TransReceiptQuadruples Vec<(Prefixer, Seqner, Saider, Siger)>,
      -O FirstSeenReplayCouples Vec<(Seqner, Dater)>, -P PathedMaterial Vec<(Pather, CesrGroup)>,
      -Q DigestSealSingles Vec<Saider>, -R MerkleRootSealSingles Vec<Diger>,
      -S SealSourceCouples Vec<(Seqner, Saider)>, -T SealSourceTriples Vec<(Seqner, Saider, Diger)>,
      -U SealSourceLastSingles Vec<Prefixer>, -V BackerRegistrarSealCouples Vec<(Prefixer, Saider)>,
      -W TypedDigestSealCouples Vec<(Bexter, Saider)>,
      -X TransIdxSigGroups Vec<(Prefixer, Seqner, Saider, ControllerIdxSigs)>,
      -Y TransLastIdxSigGroups Vec<(Prefixer, ControllerIdxSigs)>,
      -Z PathedMaterialQuadlets raw bytes (opaque),
      -a ShieldedStateCouples shielded state attachment,
      -b ShieldedStateDiscCouples shielded state disclosure attachment.
    variants:
      - name: "attachment"
        fields:
          - name: "counter"
            type: "CountCode"
            required: true
            description: "Group header — type and size"
          - name: "primitives"
            type: "array[Matter]"
            required: true
            description: "Ordered sequence of CESR primitives"
        invariants:
          - "Total encoded size of primitives must equal counter.count quadlets/triplets"
          - "Attachment groups (-C##) are never part of signed content"
      - name: "message"
        fields:
          - name: "body"
            type: "map"
            required: true
            description: "Serialized field map (JSON, CBOR, MGPK, or CESR native)"
          - name: "attachments"
            type: "array[CESRGroup]"
            required: true
            description: "Attached signature groups, receipt groups, seal groups"
        invariants:
          - "Body is delimited by version string size field"
          - "Attachments follow immediately after body"

  - name: "ColdStartTritet"
    description: "The first 3 bits of a byte that determine the frame type during cold-start stream parsing."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "integer"
            required: true
            description: "Tritet value (0-7)"
            constraints:
              min: 0
              max: 7
              enum: [0, 1, 2, 3, 4, 5, 6, 7]
        invariants:
          - "Computed as: byte >> 5"
          - "0=annotated T-domain (whitespace: LF 0x0A, CR 0x0D, tab 0x09) — parser strips whitespace and re-dispatches; NOT content-bearing"
          - "1=CESR count code, 2=CESR op code, 3=JSON, 4=MGPK FixMap, 5=CBOR map, 6=MGPK Map16/32, 7=CESR binary"

  - name: "VersionString"
    description: "Self-describing header encoding protocol, version, serialization format, and message size."
    variants:
      - name: "v2"
        fields:
          - name: "protocol"
            type: "string"
            required: true
            description: "4-char protocol identifier (PPPP)"
            constraints:
              enum: ["KERI", "ACDC"]
          - name: "major"
            type: "integer"
            required: true
            description: "Protocol major version (M — 1 Base64 char)"
          - name: "minor"
            type: "integer"
            required: true
            description: "Protocol minor version (mm — 2 Base64 chars)"
          - name: "cesr_major"
            type: "integer"
            required: true
            description: "CESR genus major version (G — 1 Base64 char)"
          - name: "cesr_minor"
            type: "integer"
            required: true
            description: "CESR genus minor version (gg — 2 Base64 chars)"
          - name: "kind"
            type: "string"
            required: true
            description: "Serialization format (KKKK — 4 chars)"
            constraints:
              enum: ["JSON", "CBOR", "MGPK", "CESR"]
          - name: "size"
            type: "integer"
            required: true
            description: "Total serialized message size in bytes (BBBB — 4 Base64 digits, max 16,777,216)"
        invariants:
          - "v2 format: PPPPMmmGggKKKKBBBB. (19 characters, period terminated)"
          - "Regex: [A-Z]{4}[A-Za-z0-9_-]{3}[A-Za-z0-9_-]{3}(JSON|CBOR|MGPK|CESR)[A-Za-z0-9_-]{4}\\."
          - "BBBB is Base64-encoded total serialization length (max 16,777,216 = 64^4)"
          - "Must be the FIRST field in any field map"
      - name: "v1"
        fields:
          - name: "protocol"
            type: "string"
            required: true
            description: "4-char protocol identifier"
          - name: "major"
            type: "integer"
            required: true
            description: "Major version (hex)"
          - name: "minor"
            type: "integer"
            required: true
            description: "Minor version (hex)"
          - name: "kind"
            type: "string"
            required: true
            description: "Serialization format"
          - name: "size"
            type: "integer"
            required: true
            description: "Total size"
        invariants:
          - "v1 format: PPPPvvKKKKllllll_ (17 characters, underscore terminated)"
          - "Size is hex-encoded (max 16,777,215)"

  - name: "FrameType"
    description: "Classification of a parsed CESR stream frame after cold-start detection."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            constraints:
              enum: ["CesrGroup", "NonNativePayload", "Annotated"]
        invariants:
          - "CesrGroup: count-code-prefixed group of CESR primitives"
          - "NonNativePayload: JSON, CBOR, or MGPK serialized message body"
          - "Annotated: CESR native event encoding with embedded type information"

  - name: "Sadder"
    description: "A Self-Addressed Data (SAD) container — a serialized field map that includes a SAID (d field) computed over its own content. Provides the canonical serialization and SAID verification for any self-addressed data structure including events, credentials, and exchanges."
    variants:
      - name: "default"
        fields:
          - name: "raw"
            type: "bytes"
            required: true
            description: "Canonical serialized form of the field map"
          - name: "said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "The self-addressing identifier — digest of the serialized content"
          - name: "kind"
            type: "string"
            required: true
            description: "Serialization format used for the raw bytes"
            constraints:
              enum: ["JSON", "CBOR", "MGPK", "CESR"]
          - name: "size"
            type: "integer"
            required: true
            description: "Byte count of the raw serialization"
            constraints:
              min: 0
        invariants:
          - "The d field in the serialized form contains the SAID computed over the content"
          - "SAID verification: replace d field with placeholder, serialize, hash, compare to said"
          - "raw length must equal size"
          - "Serialization format determined by kind — must match the VersionString if present"

  # --- Type added from CESR spec UL coverage analysis (CESR-Z2-001) ---

  - name: "SADPathSignature"
    description: "A transposable signature attachment on a SAD or nested subset of a SAD. Includes a SAD Path specifying the location of the signed content within the SAD hierarchy. Transposability means the signature can be moved across envelope boundaries (e.g., extracted from a nested SAD and reattached at a different stream level) without losing cryptographic integrity."
    variants:
      - name: "default"
        fields:
          - name: "path"
            type: "string"
            required: true
            description: "SAD Path expression identifying the signed content within the SAD"
          - name: "signatures"
            type: "array[types://cesr/primitives#Matter]"
            required: true
            description: "One or more indexed or non-indexed signatures over the content at the given path"
          - name: "root_said"
            type: "string"
            required: true
            description: "SAID of the root SAD containing the signed content"
        invariants:
          - "Path must be a valid SAD Path Language expression"
          - "Signatures verify against the serialized content at the resolved path"
          - "Transposable: changing the root path does not invalidate signatures on nested content"
