# domain.yaml
template_version: "2.0"
id: "cesr/composition"
name: "CESR Composition"
description: >
  How primitives compose into messages — count codes, attachment groups, stream
  framing, and round-trip serialization. The subdomain responsible for composing
  CESR primitives into hierarchically grouped streams using count codes, managing
  pipelining and multiplexing, handling cold-start detection and resynchronization,
  interleaving non-native serializations (JSON, CBOR, MGPK), and structuring
  messages with attachments. Count codes enable a stream parser to extract and
  offload entire groups without parsing individual primitives, supporting
  core-affinity and concurrent processing.
version: "0.1.0"
tier: "domain"
layer: 1  # Moved from Layer 0 to Layer 1 (OQ-29): depends on cesr/primitives types (Matter, Siger, Cigar, Diger, Prefixer, Seqner)

source_material:
  - type: document
    reference: "cesr-specification.md — CESR encoding specification (ToIP/IETF), v1.0, count code tables and stream parsing sections"
  - type: document
    reference: "parside — Rust CESR stream parser library (implementation survey)"

published_language:
  - term: "Sadder"
    description: "Base SAD serializer — inhale/exhale operations for self-addressing data (generic, protocol-agnostic)"
  # Serder (KERI event facade) moved to identity/establishment — adds KERI event awareness (verfers, digers)
  # Creder (ACDC credential facade) moved to credential-lifecycle/status — adds ACDC awareness (issuer, schema)

domain_clients:
  - ref: "domain://cesr"
    relationship: "CESR core delegates stream composition, group framing, and cold-start parsing to this subdomain"
    via_port: "port://cesr/composition/inbound/stream-composition"

subdomains: []

kernels: []

adjacents:
  - ref: "domain://privacy/blinding"
    relationship: "Blinding references CESR blinded state group codes (-a BlindedStateQuadruples, -b BoundStateSextuples) defined by this domain's count code tables"

externals:
  - ref: "domain://externals/transport"
    relationship: "Stream delivery over TCP, UDP, HTTP, or WebSocket — the transport outbound port delegates to this external"

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    Reference implementation is keripy eventing.py and parsing.py (stream parsing, attachment
    handling, cold-start detection). Rust implementation in keriox_core. Count codes and
    group handling follow the -Dex naming convention (CtrDex for counter/count code constants).
    Stream parsers use a tritet-based dispatch table for cold-start resynchronization.

issues: []

tags: ["streaming", "pipelining", "count-codes", "attachments", "cold-start", "composition"]
