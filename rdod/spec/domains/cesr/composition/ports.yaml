# ports.yaml
domain_ref: "cesr/composition"

ports:
  # Inbound — what the parent CESR domain calls
  - id: "port://cesr/composition/inbound/stream-composition"
    type: inbound
    name: "Stream Composition"
    semantics: query
    idempotent: true
    contract:
      input: "types://cesr/composition#CESRGroup"
      output: "types://cesr/composition#CESRGroup"
      errors:
        - "errors://cesr/composition#GroupNestingError"
    refs: ["domain://cesr"]

  - id: "port://cesr/composition/inbound/stream-parsing"
    type: inbound
    name: "Stream Parsing"
    semantics: query
    idempotent: true
    contract:
      input: "Raw CESR stream bytes"
      output: "types://cesr/composition#FrameType"
      errors:
        - "errors://cesr/composition#ColdStartError"
        - "errors://cesr/composition#TruncatedStreamError"
        - "errors://cesr/composition#VersionStringParseError"
    refs: ["domain://cesr"]

  - id: "port://cesr/composition/inbound/attachment-management"
    type: inbound
    name: "Attachment Management"
    semantics: command
    idempotent: false
    contract:
      input: "types://cesr/composition#CESRGroup"
      output: "types://cesr/composition#CESRGroup"
      errors:
        - "errors://cesr/composition#UnexpectedCountCodeError"
        - "errors://cesr/composition#GroupNestingError"
    refs: ["domain://cesr"]

  # Outbound — what cesr-composition depends on
  - id: "port://cesr/composition/outbound/transport"
    type: outbound
    name: "Transport Layer"
    semantics: command
    idempotent: false
    contract:
      input: "types://cesr/composition#CESRGroup"
      output: "types://cesr/composition#CESRGroup"
      errors:
        - "errors://cesr/composition#TruncatedStreamError"
    refs: ["domain://externals/transport"]
