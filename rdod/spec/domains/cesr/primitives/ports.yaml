# ports.yaml
#
domain_ref: "cesr/primitives"

ports:
  # Inbound — what the parent CESR domain calls
  - id: "port://cesr/primitives/inbound/qualification"
    type: inbound
    name: "Primitive Qualification"
    semantics: query
    idempotent: true
    contract:
      input: "types://cesr/primitives#Primitive"
      output: "types://cesr/primitives#Primitive"
      errors:
        - "errors://cesr/primitives#InvalidPrimitiveCodeError"
        - "errors://cesr/primitives#RawSizeMismatchError"
        - "errors://cesr/primitives#InvalidQB64Error"
        - "errors://cesr/primitives#InvalidQB2Error"
        - "errors://cesr/primitives#SignatureVerificationError"
        - "errors://cesr/primitives#DigestMismatchError"
    refs: ["domain://cesr"]

  - id: "port://cesr/primitives/inbound/code-resolution"
    type: inbound
    name: "Code Resolution"
    semantics: query
    idempotent: true
    contract:
      input: "CESR type code string"
      output: "types://cesr/primitives#IndexedSizage"
      errors:
        - "errors://cesr/primitives#InvalidPrimitiveCodeError"
    refs: ["domain://cesr"]

  # Outbound — what primitives depends on
  - id: "port://cesr/primitives/outbound/crypto"
    type: outbound
    name: "Cryptographic Operations"
    semantics: query
    idempotent: true
    contract:
      input: "Cryptographic key material and message bytes"
      output: "types://cesr/primitives#Signature"
      errors: []
    refs: ["domain://externals/cryptographic-primitives"]
