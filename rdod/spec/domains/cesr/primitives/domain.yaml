# domain.yaml

template_version: "2.0"

id: "cesr/primitives"

name: "CESR Primitives"

description: >
  Kernel providing CESR-qualified cryptographic primitives and data types.
  Defines the Primitive base type and its specialized agent-noun subtypes
  (Verification Key, Digest, Indexed Signature, etc.), the code table entries that map type codes
  to cryptographic algorithms and raw sizes, and the three-domain (T, B, R)
  representation transforms (qb64, qb2, raw). Follows the KERI naming
  convention: gerund-module, agent-noun class, -Dex code table.

  Downstream domains import its published types (Primitive, Verification Key, Digest, etc.)
  directly through published_language. The inbound ports serve the parent cesr
  domain for qualification and code resolution operations.

version: "0.1.0"
tier: "domain"

source_material:
  - type: document
    reference: "cesr-specification.md — CESR encoding specification (ToIP/IETF), v1.0, code table annexes"
  - type: document
    reference: "cesride — Rust CESR primitives library (implementation survey)"
  - type: document
    reference: "simple-cesr — TypeScript CESR primitives library (implementation survey)"

published_language:
  - term: "SAID"
    description: "Self-Addressing Identifier — content-addressable digest used by all domains for field maps"
  - term: "Primitive Base"
    description: "Base type for all non-indexed CESR primitives — (code, raw) pair with domain transforms"
  - term: "Verification Key"
    description: "Public key primitive — signature verification"
  - term: "Digest"
    description: "Digest primitive — hash computation and comparison"
  - term: "Indexed Signature"
    description: "Indexed signature primitive — threshold multi-signature schemes"
  - term: "Unindexed Signature"
    description: "Unindexed signature primitive — witness receipts"
  - term: "Salt Primitive"
    description: "Salt/seed primitive — deterministic key derivation"
  - term: "SAID Primitive"
    description: "SAID primitive — self-addressing identifier computation"
  - term: "Identifier Prefix"
    description: "AID prefix primitive — identifier representation"
  - term: "Fixed-Width Ordinal"
    description: "Sequence number primitive — ordinal encoding"
  # Serder, Creder, Sadder moved to cesr/composition published_language
  - term: "Threshold Primitive"
    description: "Threshold holder — signing/rotation threshold representation and satisfaction"

domain_clients:
  - ref: "domain://cesr"
    relationship: "CESR core delegates primitive qualification and domain transforms to this subdomain"
    via_port: "port://cesr/primitives/inbound/qualification"

subdomains: []

kernels: []

adjacents: []

externals:
  - ref: "domain://externals/cryptographic-primitives"
    relationship: "Each cryptographic algorithm output type maps to a specific code table entry — the code IS the algorithm identifier"

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    Reference implementation is keripy coring.py (Matter, Verfer, Diger, Siger, Cigar, Salter,
    Prefixer, Seqner, Saider classes). Rust implementation is cesride. TypeScript implementation
    is simple-cesr and the Matter class in signify-ts. All implementations follow the KERI
    agent-noun naming convention (-er suffix) and code table constant convention (-Dex suffix,
    e.g., MtrDex, DigDex).

issues: []

tags: ["primitives", "cryptographic-material", "encoding", "qualification"]
