# ubiquitous-language.yaml
domain_ref: "cesr/primitives"

terms:
  - term: "CESR Primitive Pattern"
    synonyms: ["Primitive Structure"]
    definition: "The common structure shared by all CESR primitive types. Every primitive is defined by five elements: (1) a base trait (Primitive for non-indexed, Indexed Primitive Base for indexed), (2) a code from the code table identifying the algorithm and raw size, (3) raw binary material of the size specified by the code, (4) three domain representations (qb64, qb2, raw) with lossless conversion, and (5) a Sizage entry (hs/ss/fs/ls) governing the encoding geometry."
    invariants:
      - "Every primitive extends Primitive (non-indexed) or Indexed Primitive Base (indexed signatures)"
      - "The code determines the algorithm — there is no separate algorithm parameter"
      - "Raw size must match the size specified by the code's Sizage entry"
      - "All three domain representations (qb64, qb2, raw) are derivable from any one"
      - "Agent-noun naming convention: class names end in -er suffix (Verification Key, Digest, Indexed Signature, Salt)"
      - "Specialized primitives add domain-specific methods (verify for Verification Key, sign for Signing Key, compare for Digest)"
    examples:
      - "Verification Key: Primitive + code D (Ed25519) + 32-byte raw + verify(sig, ser) method"
      - "Digest: Primitive + code E (Blake3-256) + 32-byte raw + compare(ser, diger) method"
      - "Indexed Signature: Indexed Primitive Base + code A (Ed25519 indexed) + 64-byte raw + index + ondex"
      - "Salt: Primitive + code 0A (Salt_128) + 16-byte raw + signer(path, code) method"
    related_terms: ["Primitive Base", "Indexed Primitive Base", "Sizage", "Code Table"]

  - term: "Primitive Base"
    synonyms: ["CESR Primitive", "Base Primitive", "Matter"]
    specializes: "domain://cesr"
    definition: "The base type for all non-indexed CESR primitives. Encapsulates a (code, raw) pair and provides bidirectional domain transforms to qb64, qb2, and (code, raw)."
    invariants:
      - "Every Primitive instance holds exactly one code (text) and one raw (bytes) value"
      - "Code MUST be a valid entry in the master code table for the active protocol genus"
      - "Raw size MUST match the size specified by the code table entry"
      - "Supports property access: .code, .raw, .qb64, .qb64b, .qb2"
    examples:
      - "Primitive(qb64='DKxy2sgzfplyr-tgwIxS19f2OchFHtLwPWD3v4oYimBx') — parse from T domain"
      - "Primitive(raw=<32 bytes>, code='D') — construct from R domain"
    related_terms: ["Verification Key", "Digest", "Signing Key", "Indexed Signature", "Unindexed Signature", "Salt Primitive", "Code Table"]

  - term: "Verification Key"
    synonyms: ["Verifier", "Public Key Primitive", "Verfer"]
    specializes: "domain://cesr"
    definition: "A public verification key primitive. Extends Primitive with a verify(sig, ser) method that validates a signature against serialized data using the embedded public key."
    invariants:
      - "Code determines the key algorithm: D=Ed25519, 1AAA=ECDSA secp256k1 non-transferable, 1AAB=ECDSA secp256k1, 1AAI=ECDSA secp256r1 non-transferable, 1AAJ=ECDSA secp256r1, 1AAC=Ed448 non-transferable, 1AAD=Ed448"
      - "Ed25519 public keys are 32 bytes raw (44 chars qb64, code 'D')"
      - "ECDSA secp256k1/r1 public keys are 33 bytes raw (48 chars qb64, code '1AAB'/'1AAJ')"
      - "Ed448 public keys are 57 bytes raw (80 chars qb64, code '1AAD')"
      - "verify() returns True if signature is valid for the given serialization"
    examples:
      - "Verification Key(qb64='DKxy2...') — an Ed25519 public key, 44 characters"
      - "Verification Key(raw=<33 bytes>, code='1AAB') — an ECDSA secp256k1 public key, 48 characters"
    related_terms: ["Signing Key", "Indexed Signature", "Unindexed Signature", "Primitive Base"]

  - term: "Digest"
    synonyms: ["Digester", "Digest Primitive", "Hash Primitive", "Diger"]
    specializes: "domain://cesr"
    definition: "A cryptographic digest primitive. Extends Primitive with methods to compute digests from serialized data and compare digest values."
    invariants:
      - "Code determines the hash algorithm: E=Blake3-256, F=Blake2b-256, G=Blake2s-256, H=SHA3-256, I=SHA2-256"
      - "256-bit digests are 32 bytes raw (44 chars qb64)"
      - "512-bit digests (0D=Blake3-512, 0E=Blake2b-512, 0F=SHA3-512, 0G=SHA2-512) are 64 bytes raw (88 chars qb64)"
      - "compare(ser, diger) verifies that the digest of ser matches diger's value"
    examples:
      - "Digest(ser=b'hello', code='E') — compute Blake3-256 digest of 'hello'"
      - "Digest(qb64='EGK0JxOC...') — wrap an existing 44-char Blake3-256 digest"
    related_terms: ["SAID", "SAID Primitive", "Primitive Base"]

  - term: "Signing Key"
    synonyms: ["Private Key Primitive", "Signer"]
    definition: "A private signing key primitive. Extends Primitive with a sign(ser) method that produces a Indexed Signature or Unindexed Signature signature over serialized data."
    invariants:
      - "Code determines the key algorithm: A=Ed25519 seed, J=ECDSA secp256k1 seed, K=Ed448 seed"
      - "Private key material is 32 bytes raw for Ed25519/ECDSA seeds (44 chars qb64)"
      - "The corresponding Verification Key (public key) is derivable from the Signing Key"
      - "sign(ser, index) returns a Indexed Signature (indexed); sign(ser) returns a Unindexed Signature (unindexed)"
    examples:
      - "Signing Key(raw=<32 bytes>, code='A') — an Ed25519 private key"
      - "signer.sign(b'data', index=0) — produce an indexed Ed25519 signature (Indexed Signature)"
    related_terms: ["Verification Key", "Indexed Signature", "Unindexed Signature", "Salt Primitive", "Primitive Base"]

  - term: "Indexed Signature"
    synonyms: ["Indexed Signature Primitive", "Siger"]
    definition: "An indexed signature primitive used in threshold multi-signature schemes. Contains a signature value and an index into the ordered list of public keys."
    invariants:
      - "Uses context-specific indexed code tables, not the master code table"
      - "Code determines algorithm and index scheme: A#=Ed25519 both-same, B#=Ed25519 current-only, C#=ECDSA secp256k1 both-same, D#=ECDSA secp256k1 current-only"
      - "Ed25519 indexed signatures are 64 bytes raw (88 chars qb64 with 2-char code)"
      - "Dual-indexed codes (2A####, 2B####) support pre-rotation with index and ondex"
      - "Index encodes position in the public key list; ondex encodes position in the rotation key list"
    examples:
      - "Indexed Signature with code 'AA' — Ed25519 signature at index 0, both signing and rotation lists"
      - "Indexed Signature with code 'BD' — Ed25519 signature at index 3, current signing list only"
      - "Indexed Signature with code '2AABAC' — Ed25519 big dual-indexed: index=1, ondex=2"
    related_terms: ["Verification Key", "Signing Key", "Unindexed Signature", "Index", "Ondex"]

  - term: "Unindexed Signature"
    synonyms: ["Unindexed Signature Primitive", "Cigar"]
    definition: "An unindexed (non-indexed) signature primitive. Contains a signature value and an associated Verification Key (public key) but no key list index."
    invariants:
      - "Uses the master code table, not indexed code tables"
      - "Code determines algorithm: 0B=Ed25519, 0C=ECDSA secp256k1, 0I=ECDSA secp256r1"
      - "Ed25519 signatures are 64 bytes raw (88 chars qb64 with 2-char code '0B')"
      - "Carries a .verfer property linking to the public key that produced the signature"
    examples:
      - "Unindexed Signature(raw=<64 bytes>, code='0B', verfer=verfer) — Ed25519 unindexed signature with associated public key"
    related_terms: ["Indexed Signature", "Verification Key", "Signing Key", "Primitive Base"]

  - term: "Salt Primitive"
    synonyms: ["Salt Primitive", "Seed Primitive", "Salter"]
    definition: "A salt or seed primitive used to deterministically generate signing keys. Provides a signer() method using argon2 key stretching."
    invariants:
      - "Code 0A for 128-bit (16-byte) random salt — 24 chars qb64"
      - "Key stretching uses argon2 to derive signing keys from the salt"
      - "signer(path, code) generates a Signing Key for the given derivation path and algorithm"
    examples:
      - "Salt(raw=<16 bytes>) — a 128-bit random salt"
      - "salter.signer(path='0', code='A') — derive an Ed25519 Signing Key from the salt at path '0'"
    related_terms: ["Signing Key", "Primitive Base"]

  - term: "Identifier Prefix"
    synonyms: ["Identifier Prefix Primitive", "Prefixer"]
    definition: "An identifier prefix primitive. Wraps the AID prefix value — either a public key (basic/non-transferable) or a self-addressing digest of the inception event."
    invariants:
      - "Non-transferable basic prefix uses code B (Ed25519) or 1AAA (ECDSA secp256k1) or 1AAI (ECDSA secp256r1)"
      - "Transferable basic prefix uses code D (Ed25519) or 1AAB (ECDSA secp256k1) or 1AAJ (ECDSA secp256r1)"
      - "Self-addressing prefix uses a digest code (E, F, H, I, etc.) applied to the inception event"
    examples:
      - "Identifier Prefix(qb64='BKxy2...') — non-transferable Ed25519 prefix (code B, cannot rotate)"
      - "Identifier Prefix(qb64='DKxy2...') — transferable Ed25519 prefix (code D, can rotate)"
      - "Identifier Prefix(qb64='EGK0J...') — self-addressing prefix (Blake3-256 digest of inception event)"
    related_terms: ["Verification Key", "Digest", "Primitive Base"]

  - term: "SAD"
    synonyms: ["Self-Addressing Data", "Self-Addressed Data"]
    definition: "A data structure that contains a field ('d') whose value is the cryptographic digest of the structure itself. The foundation of KERI's content-addressable design — events, credentials, and schemas are all SADs. The Sadder trait serializes SADs; SAID Primitive computes their SAID; Saidify is the derivation algorithm."
    invariants:
      - "A SAD MUST contain a 'd' field holding its own SAID"
      - "The SAID is computed via the saidify algorithm (dummy → serialize → digest → inject)"
      - "SADs are content-addressable — the SAID uniquely identifies the exact content"
      - "Nested SADs are saidified depth-first (inner sections before outer)"
    examples:
      - "A KERI inception event is a SAD — its 'd' field is its Blake3-256 digest"
      - "An ACDC credential is a SAD — each section (attributes, edges, rules) is also independently a SAD"
    related_terms: ["SAID Primitive", "Saidify", "Sadder (cesr/composition)", "Serder (cesr/composition)", "Creder (cesr/composition)"]

  - term: "Fixed-Width Ordinal"
    synonyms: ["Sequence Number Primitive", "Seqner"]
    definition: "A FIXED-width sequence number primitive. Fixed-Width Ordinal always uses code 0A (16 bytes raw, 24 chars qb64) regardless of value magnitude — the value is zero-padded to 16 bytes. Distinct from Number, which auto-sizes to the smallest code. Used for database keys where fixed-width enables lexicographic ordering. Fixed-Width Ordinal does NOT inherit from Number — both independently inherit from Primitive."
    invariants:
      - "Always uses code 0A (16 bytes raw, 24 chars qb64) — code is fixed, not auto-selected"
      - "Value range: 0–2^128-1 (16 bytes); any value fits because the raw is always 16 bytes"
      - "Value is zero-padded to 16 bytes — small values have leading zero bytes"
      - "Fixed width enables lexicographic ordering in LMDB database keys"
      - "Contrast with Number: Number auto-selects the smallest code (M/R/N/S/T/U); Fixed-Width Ordinal fixes to 0A"
      - "Fixed-Width Ordinal and Number are sibling classes (both extend Primitive), NOT parent-child"
      - "Provides .sn property for the integer sequence number value"
    examples:
      - "Fixed-Width Ordinal(sn=0) — code '0A', 16 bytes raw (all zeros), 24 chars qb64"
      - "Fixed-Width Ordinal(sn=100000) — code '0A', 16 bytes raw (zero-padded), 24 chars qb64"
    related_terms: ["Number", "Primitive Base"]

  - term: "SAID"
    synonyms: ["Self-Addressing Identifier", "Self-Addressing Data Identifier"]
    definition: "A cryptographic digest of the enclosing field map (block) that serves as a content-addressable, universally unique identifier. Computed via the SAID protocol with depth-first most compact form algorithm."
    invariants:
      - "Must have >= 128 bits of cryptographic strength"
      - "A signature on a SAID is equivalent to a commitment on the full SAD from which it was derived"
      - "Most compact form SAID computed by depth-first: SAIDify leaves, compact them, SAIDify parents, repeat to root"
      - "CESR-encoded with type prefix indicating the digest algorithm (e.g., E for Blake3-256)"
    examples:
      - "Top-level d field: EBdXt3gIXOf2BBWNHdSXCJnFJL5OuQPyM5K0neuniccM"
      - "Attribute section d field used as compact form value of a field"
    related_terms: ["SAD", "SAID Primitive", "Saidify", "Digest"]

  - term: "SAID Primitive"
    synonyms: ["SAID Primitive", "Self-Addressing Identifier Primitive", "Saider"]
    definition: "A Self-Addressing Identifier primitive. Computes or verifies a SAID — a cryptographic digest used as the unique identifier of the data structure it is embedded in."
    invariants:
      - "SAID is computed by replacing the 'd' field with a dummy value of the correct length, serializing, then digesting"
      - "Uses the same digest codes as Digest (E=Blake3-256, I=SHA2-256, etc.)"
      - "The SAID is self-referential — it identifies the data structure that contains it"
    examples:
      - "SAID Primitive(sad={'d': ''}, code='E') — compute Blake3-256 SAID of a self-addressing data structure"
    related_terms: ["Digest", "Primitive Base", "Saidify"]

  - term: "Saidify"
    synonyms: ["saidify()", "SAID Derivation Algorithm"]
    definition: "The algorithm that computes and injects a Self-Addressing Identifier (SAID) into a data structure's 'd' field. Three steps: (1) replace the 'd' field with a dummy string of the correct length for the chosen digest code, (2) serialize the structure (JSON, CBOR, or MGPK), (3) digest the serialization and place the resulting SAID back into 'd'. Recursive — nested SAIDifiable sections (attributes, edges, rules) are saidified depth-first before the top-level SAID."
    invariants:
      - "The dummy string must be exactly the qb64 length of the target digest code (e.g., 44 chars for Blake3-256 code 'E')"
      - "Serialization must use deterministic field ordering (insertion-ordered field maps)"
      - "The resulting SAID is self-referential — digesting the structure with its own 'd' field reproduces the same SAID"
      - "Nested saidification is depth-first: inner sections (a, e, r) are saidified before the outer ACDC"
      - "The -ify suffix follows the KERI transform naming convention (versify, sizeify, saidify)"
    examples:
      - "saidify(sad={'d': '', 'i': 'EAID...'}, code='E') → sad['d'] = 'ESAID...'"
      - "ACDC construction: saidify attributes section → saidify edges section → saidify top-level credential"
      - "SAID Primitive.saidify(sad, label='d') → (original_sad, sad_with_said)"
    related_terms: ["SAID Primitive", "SAID", "Digest", "Sadder (cesr/composition)"]

  - term: "Index"
    synonyms: ["Key Index"]
    definition: "A Base64-encoded integer in an indexed signature code that identifies the position of the associated public key in the current signing key list."
    invariants:
      - "Small indexed codes (2-char): 1 character index, 64 values (0-63)"
      - "Big indexed codes (6-char): 2 character index, 4096 values (0-4095)"
      - "Index refers to position in the signing keys list (k field of establishment event)"
    examples:
      - "Code 'A' + index 'A' = 'AA' — Ed25519 signature at index 0"
      - "Code 'A' + index 'D' = 'AD' — Ed25519 signature at index 3"
    related_terms: ["Ondex", "Indexed Signature"]

  - term: "Ondex"
    synonyms: ["Other Index"]
    definition: "A second Base64-encoded integer index in dual-indexed signature codes. Identifies the position of the associated public key in the rotation (next) key list."
    invariants:
      - "Only present in dual-indexed codes (2A####, 2B####, 0A##, 3A######)"
      - "When index and ondex are the same, the 'both-same' variant (A#, C#) is used for compactness"
      - "Ondex refers to position in the next rotation keys list (n field of establishment event)"
    examples:
      - "Code '2A' + index 'AB' + ondex 'AC' = '2AABAC' — Ed25519 big dual-indexed, index=1, ondex=2"
    related_terms: ["Index", "Indexed Signature"]

  # Inherits: "Qualification" from domain://identity
  - term: "Qualification"
    synonyms: ["Primitive Qualification"]
    specializes: "Qualification"
    definition: "In the context of the primitives subdomain, qualification is the bidirectional process of combining raw cryptographic material with a CESR type code (qualify) or extracting the code and raw material from a qualified form (dequalify). Specializes the parent definition with per-domain representation details and the dequalification inverse."
    invariants:
      - "R domain: (code, raw) pair"
      - "T domain: qb64 string = code + Base64-encoded mid-padded raw"
      - "B domain: qb2 bytes = Base64-decoded qb64"
      - "Dequalification extracts (code, raw) from qb64 or qb2"
    examples:
      - "Qualify: ('D', <32 bytes>) -> 'DKxy2sgzfplyr-tgwIxS19f2OchFHtLwPWD3v4oYimBx'"
      - "Dequalify: 'DKxy2sgzfplyr-tgwIxS19f2OchFHtLwPWD3v4oYimBx' -> ('D', <32 bytes>)"
    related_terms: ["qb64", "qb2", "Code", "Primitive Base"]

  - term: "Master Code Table"
    synonyms: ["Primitive Code Index", "Primitive Code Table Constants", "MtrDex"]
    definition: "The frozen dataclass (or enum) holding all master code table constant strings for non-indexed Primitive primitives. Naming convention: -Dex suffix."
    invariants:
      - "Each attribute maps a descriptive name to its code string"
      - "Values are immutable after definition"
      - "Entries match the master code table for the active protocol genus"
    examples:
      - "Master Code Table.Ed25519N = 'B' — Ed25519 non-transferable prefix"
      - "Master Code Table.Ed25519 = 'D' — Ed25519 public verification key"
      - "Master Code Table.Blake3_256 = 'E' — Blake3-256 digest"
      - "Master Code Table.Ed25519_Seed = 'A' — Ed25519 seed/private key"
      - "Master Code Table.Salt_128 = '0A' — 128-bit random salt"
    related_terms: ["Code Table", "Primitive Base", "Number Code Table"]

  - term: "Number Code Table"
    synonyms: ["Number Code Index", "NumDex"]
    definition: "The frozen dataclass holding code constants for numeric primitives (sequence numbers, counts)."
    invariants:
      - "Short = 'M' (2-byte), Long = '0H' (4-byte), Big = 'N' (8-byte)"
      - "Tall = 'R' (5-byte), Large = 'S' (11-byte), Great = 'T' (14-byte), Vast = 'U' (17-byte)"
    examples:
      - "Number Code Table.Short = 'M' — 2-byte number, 4 chars qb64"
      - "Number Code Table.Big = 'N' — 8-byte number, 12 chars qb64"
    related_terms: ["Fixed-Width Ordinal", "Master Code Table"]

  - term: "One-Character Code"
    synonyms: ["1-Char Code", "Small Fixed Code"]
    definition: "A single Base64 letter (A-Z, a-z) serving as both selector and complete type code. For fixed-size primitives with pad size 1 (e.g., 32-byte raw values)."
    invariants:
      - "52 possible codes (letters only, not digits or symbols)"
      - "Pad size MUST be 1 (raw size N where (3 - N mod 3) mod 3 = 1)"
      - "Typical raw size: 32 bytes (Ed25519 keys, 256-bit digests)"
    examples:
      - "'A' — Ed25519 seed (32 bytes raw, 44 chars qb64)"
      - "'B' — Ed25519 non-transferable prefix (32 bytes raw, 44 chars qb64)"
      - "'D' — Ed25519 public verification key (32 bytes raw, 44 chars qb64)"
      - "'E' — Blake3-256 digest (32 bytes raw, 44 chars qb64)"
      - "'M' — Short number (2 bytes raw, 4 chars qb64)"
    related_terms: ["Two-Character Code", "Four-Character Code", "Code Table"]

  - term: "Two-Character Code"
    synonyms: ["2-Char Code"]
    definition: "A code using selector '0' plus one type character. For fixed-size primitives with pad size 2 (e.g., 64-byte raw values) or special value codes."
    invariants:
      - "Selector MUST be '0'"
      - "64 possible type codes"
      - "Pad size MUST be 2 (raw size N where (3 - N mod 3) mod 3 = 2)"
      - "Typical raw size: 64 bytes (EdDSA signatures, 512-bit digests)"
    examples:
      - "'0A' — 128-bit random salt (16 bytes raw, 24 chars qb64)"
      - "'0B' — Ed25519 signature (64 bytes raw, 88 chars qb64)"
      - "'0C' — ECDSA secp256k1 signature (64 bytes raw, 88 chars qb64)"
      - "'0D' — Blake3-512 digest (64 bytes raw, 88 chars qb64)"
    related_terms: ["One-Character Code", "Four-Character Code", "Code Table"]

  - term: "Four-Character Code"
    synonyms: ["4-Char Code", "Large Fixed Code"]
    definition: "A code using selector '1', '2', or '3' plus three type characters. For fixed-size primitives with pad size 0, 1, or 2 that do not fit in the compact tables, or variable-size primitives."
    invariants:
      - "Selector '1': pad size 0, 0 lead bytes (e.g., 33-byte ECDSA public keys)"
      - "Selector '2': pad size 1, 1 lead byte"
      - "Selector '3': pad size 2, 2 lead bytes"
      - "262,144 possible type codes per selector (64^3)"
    examples:
      - "'1AAA' — ECDSA secp256k1 non-transferable prefix (33 bytes raw, 48 chars qb64)"
      - "'1AAB' — ECDSA secp256k1 public key (33 bytes raw, 48 chars qb64)"
      - "'1AAG' — DateTime (32-char ISO-8601, 36 chars qb64)"
      - "'1AAK' — Null/None value (0 bytes raw, 4 chars qb64)"
    related_terms: ["One-Character Code", "Two-Character Code", "Code Table"]

  - term: "Variable-Length Code"
    synonyms: ["Variable Raw Size Code"]
    definition: "A code whose final characters encode the size of the variable-length raw value in quadlets/triplets. Small (4-char, selectors 4/5/6) and large (8-char, selectors 7/8/9) variants."
    invariants:
      - "Small: selector + 1 type char + 2 size chars = 4 chars; max 4095 quadlets"
      - "Large: selector + 3 type chars + 4 size chars = 8 chars; max 16,777,215 quadlets"
      - "Size is measured in quadlets (T domain) or triplets (B domain)"
    examples:
      - "'4A##' — Base64 string, lead size 0, ## encodes size in quadlets"
      - "'5A##' — Base64 string, lead size 1"
      - "'4B##' — raw bytes, lead size 0"
    related_terms: ["Quadlet", "Triplet", "Code Table"]

  - term: "Indexed Primitive Base"
    synonyms: ["Indexed Primitive Base", "Indexer"]
    definition: "The base trait for indexed CESR primitives (parallel to Primitive for non-indexed). Encapsulates (code, raw, index, ondex) and provides bidirectional transforms. Used by Indexed Signature."
    invariants:
      - "Carries two indices: index (main key position) and ondex (other/rotation key position)"
      - "Soft size (ss) splits into ms (main index size) and os (other index size)"
      - "BothSigCodex codes: ondex auto-matches index if not provided"
      - "CurrentSigCodex codes: ondex forbidden (current signing keys only)"
      - "Index must satisfy: index <= 64^ms - 1"
    examples:
      - "Indexed Signature with code 'AA' → index=0, ondex=0 (BothSig, auto-matched)"
      - "Indexed Signature with code 'BD' → index=3, ondex forbidden (CurrentSig)"
      - "Indexed Signature with code '2AABAC' → index=1, ondex=2 (Big dual-indexed)"
    related_terms: ["Primitive Base", "Indexed Signature", "Index", "Ondex", "Indexed Code Table"]

  - term: "Indexed Code Table"
    synonyms: ["Indexed Primitive Base Code Index", "Indexed Primitive Base Code Table Constants", "IdrDex"]
    definition: "The frozen code table for indexed signature primitives. Parallel to Master Code Table but for indexed codes."
    invariants:
      - "Basic codes (2-char): A/B (Ed25519 both/current), C/D (ECDSA 256k1), E/F (ECDSA 256r1), 0A/0B (Ed448)"
      - "Big codes (4-char): 2A-2F, 3A-3B — support index/ondex > 63 (up to 64^4)"
    examples:
      - "Indexed Code Table.Ed25519 = 'A' — Ed25519 both-same indexed signature"
      - "Indexed Code Table.Ed25519_Crt = 'B' — Ed25519 current-only indexed signature"
      - "Indexed Code Table.Ed25519_Big = '2A' — Ed25519 big dual-indexed"
    related_terms: ["Master Code Table", "Indexed Primitive Base", "Indexed Signature"]

  # Inherits: "Sizage" from domain://cesr (identical definition — parent owns this term)

  # Sadder, Serder, Creder moved to cesr/composition (message-level serializers, not atomic primitives)

  - term: "Threshold Primitive"
    synonyms: ["Threshold Holder", "Tholder"]
    definition: "Represents signing/rotation threshold constraints. Supports simple integer thresholds and weighted fractional thresholds with multiple clauses."
    invariants:
      - "Simple: integer M-of-N (e.g., 2 of 3 keys)"
      - "Weighted: list of Rational32 fractions per clause, clauses separated by 'a', weights by 'c'"
      - "Each clause must sum to >= 1.0 for threshold satisfaction"
      - "Weighted format: '1/2a1/3a1/3' means clause1=1/2, clause2=1/3, clause3=1/3"
      - "satisfy(indices) checks whether the given key indices meet the threshold"
    examples:
      - "Signing Threshold('2') — simple threshold: 2 of N signatures required"
      - "Signing Threshold(['1/2', '1/2', '1/2']) — weighted: any 2 of 3 equal-weight keys"
    related_terms: ["Indexed Signature", "Key State"]

  - term: "Number"
    synonyms: ["Variable-Length Number"]
    definition: "An AUTO-SIZED unsigned integer primitive. Number auto-selects the smallest code that fits the value from the Number Code Table progression: M→R→N→S→T→U. Distinct from Fixed-Width Ordinal, which always uses fixed code 0A."
    invariants:
      - "Auto-selects smallest code that fits the value — code is chosen by value magnitude, not fixed"
      - "Short (code M): 0–65,535 (2 bytes, 4 chars qb64)"
      - "Tall (code R): 0–2^40-1 (5 bytes, 8 chars qb64)"
      - "Big (code N): 0–2^64-1 (8 bytes, 12 chars qb64)"
      - "Large (code S): 0–2^88-1 (11 bytes, 16 chars qb64)"
      - "Great (code T): 0–2^112-1 (14 bytes, 20 chars qb64)"
      - "Vast (code U): 0–2^136-1 (17 bytes, 24 chars qb64)"
      - "Auto-sizing order: M → R → N → S → T → U (note: 0H is a valid code but NOT in the auto-sizing path)"
      - "Number and Fixed-Width Ordinal are sibling classes (both extend Primitive), NOT parent-child"
      - "Contrast with Fixed-Width Ordinal: Fixed-Width Ordinal is always code 0A (fixed, 16 bytes); Number is code-auto-selected"
      - "Number provides sequence-number access aliases for backward compatibility with Fixed-Width Ordinal"
    examples:
      - "Number(num=42) → code 'M', 4 chars qb64"
      - "Number(num=100000) → code 'R', 8 chars qb64"
      - "Number(num=2**33) → code 'R', 8 chars qb64"
      - "Number(num=2**41) → code 'N', 12 chars qb64"
    related_terms: ["Fixed-Width Ordinal", "Number Code Table", "Primitive Base"]

  - term: "DateTime"
    synonyms: ["DateTime Primitive", "Dater"]
    definition: "An ISO-8601 datetime encoded as a CESR primitive. Special characters substituted for Base64 compatibility: ':' → 'c', '.' → 'd', '+' → 'p'."
    invariants:
      - "Code '1AAG' — 32-char ISO-8601 string (36 chars qb64)"
      - "Character substitution: colon→c, dot→d, plus→p for Base64 safety"
      - "new() with no args captures current UTC time"
    examples:
      - "DateTime('2024-01-15T12c30c00d000000p00c00') — 2024-01-15T12:30:00.000000+00:00"
    related_terms: ["Primitive Base"]

  - term: "Base64 Extended"
    synonyms: ["Base64 Extended", "Bexter"]
    definition: "A base64 extended encoding primitive for text strings and byte arrays. Computes lead padding (wrap size) from the code's lead size to achieve proper alignment."
    invariants:
      - "Codes: 4A-6A (small StrB64), 7AAA-9AAA (large StrB64), 4B-6B (small Bytes), 7AAB-9AAB (large Bytes)"
      - "bext(): encodes raw with calculated wrap-size padding"
      - "rawify(): decodes bext back to raw bytes"
      - "Used by Path for encoding JSON path arrays"
    examples:
      - "Base64 Extended(bext='some-base64-text') → variable-length CESR primitive"
    related_terms: ["Path", "Primitive Base", "Variable-Length Code"]

  - term: "Path"
    synonyms: ["Path Primitive", "Pather"]
    definition: "A path to a nested value within a SAD structure. Encodes a JSON path array as a Base64 Extended, enabling CESR-qualified references to embedded fields."
    invariants:
      - "Constructed from path list: ['a', 'fieldName'] → points to sad['a']['fieldName']"
      - "Uses Base64 Extended encoding with StrB64 codes"
      - "Used in pathed material groups (-P##) for selective disclosure"
    examples:
      - "Path(['a', 'i']) → path to the issuer field inside the attribute section"
      - "Path(['e', 'qvi']) → path to the QVI edge"
    related_terms: ["Base64 Extended", "Sadder (cesr/composition)", "Disclosure"]

  - term: "Encryption Primitive"
    synonyms: ["Encrypter"]
    definition: "Encrypts data using X25519 ECDH key agreement + symmetric encryption (secretbox/sealedbox). Produces Cipher primitives."
    invariants:
      - "Uses X25519 public key for ECDH key agreement"
      - "Symmetric encryption via NaCl secretbox or sealedbox"
      - "Output is a Cipher (CESR-qualified encrypted data)"
    examples:
      - "Encryption Primitive(verkey=x25519_pubkey).encrypt(matter=salter) → Cipher"
    related_terms: ["Decryption Primitive", "Cipher", "Salt Primitive"]

  - term: "Decryption Primitive"
    synonyms: ["Decrypter"]
    definition: "Decrypts Cipher primitives using X25519 private key. Recovers the original Primitive primitive from encrypted data."
    invariants:
      - "Uses X25519 private key for ECDH key agreement"
      - "decrypt(cipher) → recovered Primitive (e.g., Signing Key, Salt)"
    examples:
      - "Decryption Primitive(seed=x25519_privkey).decrypt(cipher) → Salt"
    related_terms: ["Encryption Primitive", "Cipher"]

  - term: "Cipher"
    synonyms: ["Encrypted Primitive"]
    definition: "A CESR-qualified encrypted data primitive. Holds ciphertext with codes indicating the encryption scheme."
    invariants:
      - "Codes: 4C-9AC (X25519 SealedBox variants), 4D-9AD (QB64 variants), 4E-9AE (QB2 variants)"
      - "Variable-length — size encoded in the code"
      - "Provides qb64 and qb2 representations like other Primitive types"
    examples:
      - "Cipher(qb64='4C...') — X25519 SealedBox encrypted salt"
    related_terms: ["Encryption Primitive", "Decryption Primitive", "Primitive Base"]

  - term: "Tierage"
    synonyms: ["Security Tier"]
    definition: "Security classification for salt-based key stretching operations. Controls argon2 CPU/memory cost parameters."
    invariants:
      - "Values: 'low', 'med', 'high' (plus reserved 'min')"
      - "Carried by Salt — determines stretching cost when deriving Signers"
      - "Higher tier = more argon2 iterations = slower but stronger"
    examples:
      - "Salt(tier=Tierage.low) — fast derivation for development"
      - "Salt(tier=Tierage.high) — production-grade key stretching"
    related_terms: ["Salt Primitive", "Signing Key"]

  - term: "ZeroizeOnDrop"
    synonyms: ["Sensitive Material Cleanup"]
    definition: "Memory safety pattern ensuring private key material is overwritten with zeros when the holding object is destroyed. Applied to Signing Key and Salt."
    invariants:
      - "All bytes of raw key material are zeroed on object destruction"
      - "Prevents key material from lingering in freed memory"
      - "Implemented via Rust's Zeroize trait or TypeScript manual zeroing"
    examples:
      - "Signing Key dropped → 32 bytes of Ed25519 seed overwritten with zeros"
    related_terms: ["Signing Key", "Salt Primitive"]

  - term: "Mid-Padding Algorithm"
    synonyms: ["qb64 Mid-Padding", "_infil()"]
    definition: "The algorithm for encoding raw cryptographic material into qb64 text domain representation. Places zero-valued pad bits between the code and raw data, avoiding trailing '=' characters."
    invariants:
      - "Formula: ps = (3 - ((raw_size + lead_size) % 3)) % 3"
      - "Constraint: ps == code_size % 4"
      - "Steps: (1) compute ps, (2) prepend (ps + ls) zero bytes to raw, (3) Base64-encode, (4) skip first ps chars, (5) prepend code string"
      - "The padding is in the MIDDLE — between code prefix and encoded raw value"
      - "Avoids trailing '=' Base64 padding by adjusting the input alignment"
    examples:
      - "Ed25519 key (code='D', 32 bytes raw, ls=0): ps=(3-32%3)%3=1, prepend 1 zero byte, Base64-encode 33 bytes=44 chars, skip 1 char, prepend 'D' → 44 char qb64"
    related_terms: ["Qualification", "qb64", "Sizage", "Primitive Base"]

  - term: "Sizage Table"
    synonyms: ["Code Table Sizes"]
    definition: "An explicitly enumerated table mapping each CESR code to its (hs, ss, xs, fs, ls) tuple. The Sizage table is NOT formula-derivable — each code has its own specific size entry."
    invariants:
      - "hs = hard size (type-identifying characters)"
      - "ss = soft size (index/count characters)"
      - "xs = extra size (variable portion)"
      - "fs = full size (total qb64 character count, 0 for variable-length)"
      - "ls = lead size (number of lead padding bytes)"
      - "Complete table must be extracted from keripy's Primitive.Sizes, Indexed Primitive Base.Sizes, and Counter sizes"
      - "Every code table entry MUST have a corresponding Sizage entry"
    examples:
      - "Code 'D' (Ed25519): hs=1, ss=0, xs=0, fs=44, ls=0"
      - "Code 'E' (Blake3_256): hs=1, ss=0, xs=0, fs=44, ls=0"
      - "Code '0B' (Ed25519_Sig): hs=2, ss=0, xs=0, fs=88, ls=0"
    related_terms: ["Code Table", "Primitive Base", "Mid-Padding Algorithm"]

  - term: "SecurityLevel"
    synonyms: ["Crypto Minimum"]
    definition: "The minimum cryptographic security level required for CESR primitives to be considered safe. All cryptographic codes MUST provide at least 128-bit security strength."
    invariants:
      - "Signing algorithms must provide >= 128-bit security (Ed25519 = 128, ECDSA secp256k1 = 128, ECDSA secp256r1 = 128, Ed448 = 224)"
      - "Digest algorithms must produce >= 256-bit output (Blake3-256 = 128-bit collision resistance, SHA-256 = 128-bit collision resistance)"
      - "No code in the CESR table maps to an algorithm below 128-bit security"
    examples:
      - "Ed25519 (code D): 128-bit security — meets minimum"
      - "SHA-256 (code I): 128-bit collision resistance — meets minimum"
    related_terms: ["Code Table", "CESR Primitive Pattern"]

events:
  - name: "PrimitiveQualified"
    payload: "code: Code, raw: bytes, qb64: str, qb2: bytes"
    triggers: "Raw cryptographic material is combined with a type code to produce a fully qualified primitive"

  - name: "PrimitiveDequalified"
    payload: "qb64: str, code: Code, raw: bytes"
    triggers: "A qualified primitive is parsed to extract code and raw value"

  - name: "SignatureCreated"
    payload: "signer: Signing Key, serialization: bytes, signature: Indexed Signature | Unindexed Signature"
    triggers: "A Signing Key signs serialized data to produce an indexed or unindexed signature"

  - name: "SignatureVerified"
    payload: "verfer: Verification Key, signature: bytes, serialization: bytes, valid: bool"
    triggers: "A Verification Key verifies a signature against serialized data"

  - name: "DigestComputed"
    payload: "code: Code, serialization: bytes, digest: Digest"
    triggers: "Serialized data is hashed to produce a digest primitive"

  - name: "KeyDerived"
    payload: "salter: Salt, path: str, code: Code, signer: Signing Key"
    triggers: "A Salt derives a Signing Key via argon2 key stretching at a given derivation path"

rules:
  - "The code determines the algorithm — there is no separate algorithm parameter; the code IS the algorithm identifier"
  - "Raw binary size MUST match the size dictated by the code table entry — mismatches are errors"
  - "Non-transferable prefix codes (B, 1AAA, 1AAI, 1AAC) indicate the AID cannot rotate keys"
  - "Transferable prefix codes (D, 1AAB, 1AAJ, 1AAD) indicate the AID supports key rotation"
  - "Indexed signatures (Indexed Signature) use context-specific code tables; unindexed signatures (Unindexed Signature) use the master code table"
  - "Self-addressing identifiers (SAIDs) are computed by digesting the serialization with the 'd' field replaced by a dummy string of the correct length"
  - "Agent-noun naming convention: class names end in -er suffix (Verification Key, Digest, Indexed Signature, Unindexed Signature, Salt, Signing Key)"
  - "Code table constant naming convention: frozen dataclass names end in -Dex suffix (Master Code Table, Number Code Table, DigDex)"
