# verification.yaml
domain_ref: "privacy"

# Verification properties are language-agnostic invariants.
# Code examples use Python/pytest syntax for illustration — implementations
# in other languages should express equivalent assertions in their native testing framework.

properties:
  # Privacy Model Determination invariants
  - invariant: "If u field is absent from the top-level ACDC map, then the ACDC MUST be classified as Public. If u field is present AND non-empty (len(u) > 0), then the ACDC MUST be classified as Private. If u field is present AND empty (u == ''), then the ACDC MUST be classified as Metadata. No other classification states are possible."
    term: "ACDC Privacy Level"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=acdc_strategy())
        def test_privacy_level_trichotomy(acdc):
            if 'u' not in acdc:
                assert classify(acdc) == 'public'
            elif acdc['u'] == '':
                assert classify(acdc) == 'metadata'
            else:
                assert len(acdc['u']) > 0
                assert classify(acdc) == 'private'
            # Exhaustive — no fourth state possible
            assert classify(acdc) in ('public', 'private', 'metadata')
    strategy: "acdc_strategy() — generates ACDCs with u absent, u empty, u non-empty"
    notes: "Trichotomy: exactly one of {public, private, metadata} for every valid ACDC. The u field is the sole discriminant."

  - invariant: "The three privacy levels are mutually exclusive: for any ACDC, exactly one classification MUST hold. If classify(acdc) == 'public' then 'u' not in acdc. If classify(acdc) == 'private' then 'u' in acdc and len(acdc['u']) > 0. If classify(acdc) == 'metadata' then 'u' in acdc and acdc['u'] == ''."
    term: "ACDC Privacy Level"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        u_absent, u_empty, u_nonempty = Bools('u_absent u_empty u_nonempty')
        is_public, is_private, is_metadata = Bools('is_public is_private is_metadata')
        s = Solver()
        # Exactly one u-state
        s.add(Or(u_absent, u_empty, u_nonempty))
        s.add(Implies(u_absent, Not(u_empty)), Implies(u_absent, Not(u_nonempty)))
        s.add(Implies(u_empty, Not(u_absent)), Implies(u_empty, Not(u_nonempty)))
        s.add(Implies(u_nonempty, Not(u_absent)), Implies(u_nonempty, Not(u_empty)))
        # Classification rules
        s.add(is_public == u_absent)
        s.add(is_private == u_nonempty)
        s.add(is_metadata == u_empty)
        # Prove mutual exclusion: cannot be two at once
        s.add(Or(And(is_public, is_private), And(is_public, is_metadata), And(is_private, is_metadata)))
        assert s.check() == unsat
    notes: "SMT proof that no ACDC can be classified as two privacy levels simultaneously."

  # Shielding Security invariants
  - invariant: "If an ACDC is classified as Private, the u field MUST contain a value with >= 128 bits of cryptographic entropy. In Base64url encoding, this requires >= 22 characters (ceil(128/6) = 22). If len(u) < 22 Base64url characters, the ACDC MUST be rejected as insufficiently shielded — rainbow-table attacks become feasible below this threshold."
    term: "Private ACDC"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=private_acdc_strategy())
        def test_uuid_minimum_entropy(acdc):
            assert 'u' in acdc
            assert len(acdc['u']) > 0
            # Base64url: each char = 6 bits, need >= 128 bits
            assert len(acdc['u']) >= 22, (
                f"UUID has {len(acdc['u'])} chars ({len(acdc['u']) * 6} bits), "
                f"need >= 22 chars (128 bits) to resist rainbow-table attacks"
            )
    strategy: "private_acdc_strategy() — generates Private ACDCs with varying u field lengths"
    notes: "128-bit entropy floor. Below this, an attacker can enumerate possible UUID values and compute SAIDs to correlate presentations — shielding is ineffective."

  - invariant: "For shielded attribute blocks within an ACDC, the block MUST contain both d (SAID) and u (UUID) fields. The u field MUST be non-empty with >= 128 bits of cryptographic entropy (>= 22 Base64url chars). If either field is absent or u is empty, the block MUST be rejected as unshielded."
    term: "Shielded Attribute Block"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(block=attribute_block_strategy())
        def test_shielded_block_requirements(block):
            if is_shielded_block(block):
                assert 'd' in block, "Shielded block MUST have d (SAID) field"
                assert 'u' in block, "Shielded block MUST have u (UUID) field"
                assert len(block['u']) > 0, "Shielded block u field MUST be non-empty"
                assert len(block['u']) >= 22, (
                    f"Shielded block UUID has {len(block['u'])} chars, "
                    f"need >= 22 for 128-bit entropy"
                )
    strategy: "attribute_block_strategy() — with and without d/u fields"
    notes: "Same 128-bit minimum applies to block-level shielding as to top-level."

  # Graduated Disclosure Monotonicity invariants
  - invariant: "Once a block is disclosed at disclosure level L, it MUST NOT be reverted to a level less than L in any subsequent presentation within the same exchange. Disclosure levels are ordered: compact < partial < selective < full. If block B was disclosed at level 'partial', a subsequent presentation of B at level 'compact' within the same exchange MUST be rejected."
    term: "Graduated Disclosure"
    technique: property-based
    formal:
      language: python
      expression: |
        DISCLOSURE_ORDER = {'compact': 0, 'partial': 1, 'selective': 2, 'full': 3}

        @given(steps=st.lists(
            st.sampled_from(['compact', 'partial', 'selective', 'full']),
            min_size=2, max_size=10))
        def test_disclosure_monotonicity(steps):
            max_level_seen = DISCLOSURE_ORDER[steps[0]]
            for step in steps[1:]:
                current_level = DISCLOSURE_ORDER[step]
                if current_level < max_level_seen:
                    # Attempting to reduce disclosure level — must fail
                    assert not is_valid_disclosure_sequence(steps)
                    return
                max_level_seen = max(max_level_seen, current_level)
            assert is_valid_disclosure_sequence(steps)
    strategy: "st.lists of disclosure levels; verify monotonic non-decreasing"
    notes: "Graduated disclosure is monotonically non-decreasing within an exchange. Information once revealed cannot be un-revealed."

  - invariant: "Each disclosure step MUST reveal only the minimum information needed to facilitate the next step. For each step i in a graduated disclosure sequence, disclosed_fields(step[i]) MUST be a subset of required_fields_for(step[i+1])."
    term: "Graduated Disclosure"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(steps=graduated_disclosure_sequence_strategy())
        def test_least_disclosure_principle(steps):
            for i in range(len(steps) - 1):
                revealed = disclosed_fields(steps[i])
                needed_for_next = required_fields_for(steps[i + 1])
                assert revealed <= needed_for_next, (
                    f"Step {i} disclosed {revealed - needed_for_next} "
                    f"fields not required for step {i+1}"
                )
    strategy: "graduated_disclosure_sequence_strategy() — valid multi-step sequences"
    notes: "Least disclosure principle — each step is minimal for the next."

  # Chain-Link Confidentiality Gating invariants
  - invariant: "If the ACDC's rules section contains a chain-link confidentiality clause, full disclosure MUST NOT occur until the disclosee has agreed to the contractual terms. The privacy domain queries the credential-exchange domain (declared adjacent) to confirm agreement status — it does not track exchange protocol state internally."
    term: "Graduated Disclosure"
    technique: property-based
    formal:
      language: pseudocode
      expression: |
        for any acdc with rules.chainLinkConfidential == true:
          disclosure_permitted = query_exchange_agreement_status(acdc, disclosee)
          if NOT disclosure_permitted:
            full_disclosure(acdc, disclosee) MUST raise ChainLinkConfidentialityViolation
          else:
            full_disclosure(acdc, disclosee) MUST succeed
        for any acdc WITHOUT chainLinkConfidential rule:
          full_disclosure(acdc, disclosee) MUST succeed regardless of exchange state
    strategy: ""
    notes: "Chain-link confidentiality creates a mandatory gate: contractual agreement before full disclosure. The gate check delegates to credential-exchange domain, not internal IPEX state."

  # Selective vs Aggregate Disclosure Mutual Exclusion
  - invariant: "The A field (aggregate digest for selective disclosure) and the a field (inline attributes for targeted/untargeted ACDCs) are mutually exclusive at the top level of an ACDC. If both A and a are present, the ACDC MUST be rejected as invalid. Exactly one of {A present, a present, neither present} MUST hold."
    term: "ACDC Privacy Level"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=acdc_strategy())
        def test_A_and_a_mutual_exclusion(acdc):
            has_aggregate = 'A' in acdc
            has_attributes = 'a' in acdc
            if has_aggregate and has_attributes:
                assert not is_valid_acdc(acdc), (
                    "ACDC with both A (aggregate) and a (attributes) "
                    "at top level MUST be invalid"
                )
            # At most one of A, a may be present
            assert not (has_aggregate and has_attributes)
    strategy: "acdc_strategy() — including adversarial cases with both A and a"
    notes: "A = selective disclosure via aggregate. a = inline attributes. Both present = structural error."

  # Metadata ACDC SAID Differentiation
  - invariant: "A Metadata ACDC (u present but empty) MUST produce a different SAID than the corresponding Private ACDC (u present with full entropy), even when all other fields are identical. This is because the SAID is computed over the serialized content including the u field value."
    term: "Metadata ACDC"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        metadata_u, private_u = Strings('metadata_u private_u')
        metadata_said, private_said = Strings('metadata_said private_said')
        s = Solver()
        s.add(metadata_u == StringVal(''))
        s.add(Length(private_u) >= 22)
        # Different u values produce different serializations, hence different SAIDs
        s.add(metadata_u != private_u)
        # SAID is a deterministic function of serialized content
        s.add(Implies(metadata_u != private_u, metadata_said != private_said))
        s.check()
        # Now prove: if content identical except u, SAIDs must differ
        s2 = Solver()
        s2.add(metadata_u == StringVal(''))
        s2.add(Length(private_u) >= 22)
        s2.add(metadata_said == private_said)
        s2.add(metadata_u != private_u)
        # This should be unsat — same SAID with different u is impossible
        assert s2.check() == unsat
    notes: "Metadata variant SAID differs from Private variant — prevents correlation between metadata disclosure and full disclosure."

  # Bulk-Issued Instance Disclosure invariants
  - invariant: "For each instance in a bulk-issued set, the SAID (d field) MUST be unique across all instances. For any pair of instances (i, j) where i != j: instances[i]['d'] != instances[j]['d']."
    term: "Bulk-Issued Instance Disclosure"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(instances=bulk_issuance_strategy(min_size=2, max_size=100))
        def test_bulk_said_uniqueness(instances):
            saids = [inst['d'] for inst in instances]
            assert len(set(saids)) == len(instances), (
                f"SAID collision in bulk issuance: {len(set(saids))} unique "
                f"SAIDs for {len(instances)} instances"
            )
    strategy: "bulk_issuance_strategy(min_size=2, max_size=100)"
    notes: "No two instances share a SAID — prevents cross-presentation correlation."

  - invariant: "For each pair of instances (i, j) in a bulk-issued set where i != j: instances[i]['d'] != instances[j]['d'] AND instances[i].get('u') != instances[j].get('u'). Both SAID and UUID MUST differ to prevent correlation."
    term: "Bulk-Issued Instance Disclosure"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(instances=bulk_issuance_strategy(min_size=2, max_size=100))
        def test_bulk_anti_correlation(instances):
            for i in range(len(instances)):
                for j in range(i + 1, len(instances)):
                    assert instances[i]['d'] != instances[j]['d'], (
                        f"SAID collision between instances {i} and {j}"
                    )
                    assert instances[i].get('u') != instances[j].get('u'), (
                        f"UUID collision between instances {i} and {j}"
                    )
    strategy: "bulk_issuance_strategy(min_size=2, max_size=100)"
    notes: "Both SAID and UUID must differ across instances to prevent any form of cross-presentation linkage."

  # Public ACDC invariant
  - invariant: "If u field is absent from the ACDC, the ACDC is Public. A Public ACDC MUST NOT have a u field at the top level. The SAID of a Public ACDC is computed over the full content without any shielding factor."
    term: "Public ACDC"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=public_acdc_strategy())
        def test_public_acdc_no_u_field(acdc):
            assert 'u' not in acdc, "Public ACDC MUST NOT have u field"
            assert classify(acdc) == 'public'
            # SAID computed over unblinded content
            assert acdc['d'] == compute_said(acdc)
    strategy: "public_acdc_strategy() — generates ACDCs without u field"
    notes: "Public ACDCs have no shielding — content is fully correlatable by design."

  # Disclosure Mode Composition
  - invariant: "All graduated disclosure mechanisms (compact, partial, selective, full) MUST compose without conflict. Applying mode M1 followed by mode M2 where M2 > M1 in the disclosure ordering MUST produce a valid disclosed variant."
    term: "Graduated Disclosure"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=acdc_strategy(),
               modes=st.lists(
                   st.sampled_from(['compact', 'partial', 'selective', 'full']),
                   min_size=1, max_size=4, unique=True))
        def test_disclosure_mode_composition(acdc, modes):
            sorted_modes = sorted(modes, key=lambda m: DISCLOSURE_ORDER[m])
            result = acdc
            for mode in sorted_modes:
                result = apply_mode(result, mode)
                assert is_valid_disclosure(result), (
                    f"Disclosure mode {mode} produced invalid variant"
                )
    strategy: "acdc_strategy(), st.lists of unique disclosure modes"
    notes: "Modes compose monotonically — compact -> partial -> selective -> full all valid in sequence."

  # --- Disclosure Protocol Chain Propagation (Finding ACDC-INVF-011) ---
  - invariant: "Chain-link confidentiality terms MUST propagate through disclosure chains: each subsequent Discloser MUST apply the original Disclosee's contractual terms to each subsequent Disclosee. Contingent Disclosure: when a specified contingency is met, the obligated party MUST perform the disclosure. Bulk issuance aggregate B value MUST be anchored in the Issuer's KEL via Transaction Event Seal."
    term: "Contractually Protected Disclosure"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(chain=disclosure_chain_strategy(min_length=2, max_length=5))
        def test_chain_link_propagation(chain):
            original_terms = chain[0].rule_section_terms
            for i, step in enumerate(chain[1:], 1):
                assert step.applied_terms == original_terms, (
                    f"Step {i}: applied terms differ from original. "
                    f"Expected {original_terms}, got {step.applied_terms}"
                )
                assert step.disclosee_agreed_to_terms, (
                    f"Step {i}: Disclosee has not agreed to propagated terms"
                )

        @given(bulk_set=bulk_issuance_strategy(min_size=2))
        def test_bulk_issuance_aggregate_sealed(bulk_set):
            assert bulk_set.aggregate_b is not None, "Bulk set must have aggregate B"
            assert is_sealed_in_kel(bulk_set.issuer_kel, bulk_set.aggregate_b), (
                "Bulk issuance aggregate B must be anchored in Issuer's KEL"
            )
    strategy: "disclosure_chain_strategy() — generates multi-step disclosure chains with propagating terms; bulk_issuance_strategy() — generates bulk-issued sets with KEL anchoring"
    notes: "3 behavioral rules from ACDC spec §12.3 and §A.4. Chain propagation spans multiple exchanges — requires multi-party simulation. Finding: ACDC-INVF-011."

contracts:
  - port_ref: "port://privacy/inbound/privacy-management"
    preconditions:
      - formal:
          language: python
          expression: |
            lambda acdc, mode: (
                is_valid_acdc(acdc)
                and mode in ('compact', 'partial', 'full', 'selective')
            )
        description: "ACDC must be structurally valid and mode must be one of the four recognized disclosure modes"
      - formal:
          language: python
          expression: |
            lambda acdc, mode: (
                mode != 'selective' or 'A' in acdc
            )
        description: "Selective disclosure mode requires A (aggregate) field to be present"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda acdc, mode, result: (
                compute_said(result) == acdc['d']
                or is_valid_variant(result, acdc)
            )
        description: "Disclosed variant is verifiable against the original ACDC's SAID or is a valid schema-authorized variant"
      - formal:
          language: python
          expression: |
            lambda acdc, mode, result: (
                disclosed_fields(result) <= disclosed_fields(acdc)
            )
        description: "Disclosed variant MUST NOT reveal more information than the source ACDC"
      - formal:
          language: python
          expression: |
            lambda acdc, mode, result: (
                not has_chainlink_confidentiality(acdc)
                or mode != 'full'
                or ipex_agree_completed(acdc)
            )
        description: "If chain-link confidentiality is set, full disclosure requires prior IPEX agree"
