domain_ref: "privacy/disclosure"

errors:
  - name: "InvalidDisclosureProgressionError"
    description: "Attempted to disclose at a level less revealing than what was previously disclosed"
    cause: "Disclosure is monotonically increasing — once you reveal more, you cannot retract to a less-revealed form"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "current_form"
        type: "string"
        description: "The current disclosure form (compact, partial, selective, full)"
      - field: "attempted_form"
        type: "string"
        description: "The less-revealed form that was attempted"

  - name: "PublicBlockPartialDisclosureError"
    description: "Attempted partial disclosure on a public block"
    cause: "Public blocks (no u field) cannot be partially disclosed — they skip directly from compact to full because there is no UUID for shielding"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "block_path"
        type: "string"
        description: "SAD path to the public block"

  - name: "ChainLinkTermsRequiredError"
    description: "Full disclosure requires chain-link confidentiality terms to be agreed but they have not been"
    cause: "The partial-to-full disclosure transition is gated by chain-link confidentiality — the disclosee must agree to contractual terms before receiving the full content"
    recovery: "abort"
    severity: "recoverable"
    context:
      - field: "block_said"
        type: "string"
        description: "SAID of the block that requires terms agreement"
    related_port: "port://privacy/disclosure/inbound/advance-disclosure"
