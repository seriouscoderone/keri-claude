# ports.yaml
domain_ref: "privacy"

ports:
  # Inbound — what the parent ACDC domain calls
  - id: "port://privacy/inbound/privacy-management"
    type: inbound
    name: "Privacy and Graduated Disclosure Orchestration"
    semantics: command
    idempotent: false
    contract:
      input: "types://privacy#DisclosureRequest"
      output: "types://privacy#DisclosureResult"
      errors:
        - "errors://privacy#InvalidDisclosureFormError"
        - "errors://privacy#DisclosureMonotonicityViolation"
        - "errors://privacy#InsufficientEntropyError"
        - "errors://privacy#ChainLinkConfidentialityViolation"
        - "errors://privacy#DisclosureConstraintError"
        - "errors://privacy#MutualExclusionViolation"
    refs: ["domain://credential-lifecycle"]

  # Outbound — delegates to subdomains
  #   - disclosure: port://privacy/disclosure/inbound/mode-definitions

  - id: "port://privacy/outbound/blinding"
    type: outbound
    name: "Blinded State Operations"
    semantics: command
    idempotent: false
    contract:
      input: "types://privacy/blinding#BlindedAttributeBlock"
      output: "types://privacy/blinding#BlindedAttributeBlock"
      errors: []
    refs: ["domain://privacy/blinding"]

  - id: "port://privacy/outbound/aggregation"
    type: outbound
    name: "Aggregation Operations"
    semantics: query
    idempotent: true
    contract:
      input: "types://privacy/aggregation#SADPath"
      output: "types://privacy/aggregation#SadPathSig"
      errors: []
    refs: ["domain://privacy/aggregation"]

  # Outbound -- kernel dependency for cryptographic operations
  - id: "port://privacy/outbound/digest"
    type: outbound
    name: "Cryptographic Digest for Blinded Commitments"
    semantics: query
    idempotent: true
    contract:
      input: "Blinded block bytes with UUID"
      output: "types://cesr/primitives#SAID"
      errors: []
    refs: ["domain://externals/cryptographic-primitives"]
