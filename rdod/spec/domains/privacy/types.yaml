domain_ref: "privacy"

types:
  - name: "DisclosureForm"
    description: "The level of content revelation for a credential block. Seven forms covering the full graduated disclosure spectrum. Forms progress monotonically — disclosed information cannot be retracted."
    variants:
      - name: "compact"
        fields:
          - name: "said"
            type: "string"
            required: true
            description: "The SAID commitment — the only content revealed"
        invariants:
          - "Block is represented as a single SAID string, not a map"
          - "Verifiable by expanding to full form and recomputing SAID"
          - "Zero content revealed — only existence and integrity"
      - name: "partial"
        fields:
          - name: "d"
            type: "string"
            required: true
            description: "SAID of the block"
          - name: "u"
            type: "string"
            required: true
            description: "UUID blinding factor"
          - name: "s"
            type: "string"
            required: false
            description: "Schema SAID (if applicable at this level)"
        invariants:
          - "Only d, u, and optionally s are revealed"
          - "All other fields remain blinded"
          - "Requires Private block (u field must have entropy)"
          - "Public blocks skip from compact directly to full — no partial form"
      - name: "selective"
        fields:
          - name: "agid"
            type: "string"
            required: true
            description: "Aggregate Identifier — digest of concatenated attribute SAIDs"
          - name: "disclosed_attributes"
            type: "array[map]"
            required: true
            description: "Individual attribute blocks being disclosed"
          - name: "inclusion_proofs"
            type: "array[string]"
            required: true
            description: "SAID of each disclosed attribute for membership verification"
        invariants:
          - "Requires A field (aggregate section) — not a field"
          - "Each disclosed attribute independently verifiable against AGID"
          - "Non-disclosed attributes reveal nothing — zero information leakage"
          - "AGID = digest(concatenation of all attribute SAIDs in canonical order)"
      - name: "nested-partial"
        fields:
          - name: "sections"
            type: "map"
            required: true
            description: "Each top-level section (a, e, r) independently at a different disclosure level"
        invariants:
          - "Each nested block can independently be compact, partial, or full"
          - "Verification follows the SAID tree — each block verifiable against its parent's SAID"
          - "Between partial (one level) and full (all levels)"
        examples:
          - "Credential with full attributes, compact edges, partial rules — reveals what you do but not who vouched for you"
      - name: "full"
        fields:
          - name: "block"
            type: "map"
            required: true
            description: "Complete expanded block with all fields"
        invariants:
          - "All fields present and expanded"
          - "SAID(expanded block) must match any prior compact commitment"
          - "Terminal form — no further expansion possible"
      - name: "metadata"
        fields:
          - name: "d"
            type: "string"
            required: true
            description: "SAID of the metadata ACDC"
          - name: "u"
            type: "string"
            required: true
            description: "Empty UUID — signals metadata variant (not private, not public)"
            constraints:
              enum: [""]
          - name: "structural_fields"
            type: "map"
            required: true
            description: "Issuer, schema, edges, rules — visible without correlation to actual credential"
        invariants:
          - "Top-level u field is EMPTY (not absent, not high-entropy)"
          - "Structural fields visible but NOT correlated to the actual private credential"
          - "Used for chain-link confidentiality pre-negotiation — offer before agreement"
      - name: "bulk-issued"
        fields:
          - name: "blinded_said"
            type: "string"
            required: true
            description: "Blinded SAID of this instance — unique per copy"
          - name: "bulk_commitment"
            type: "string"
            required: true
            description: "Aggregate commitment binding all copies in the bulk issuance set"
        invariants:
          - "Each copy has a unique SAID and UUID — unlinkable across presentations"
          - "Issuer signs blinded SAIDs, not the SADs themselves"
          - "Proof of inclusion: discloser unblinds their SAID, verifier checks against bulk commitment"
          - "Distinct from Bulk-Issued pattern: this is the DISCLOSURE form, not the issuance pattern"

  - name: "ChainLinkConfidentialityGate"
    description: "A disclosure control that requires contractual agreement before revealing full credential content. Implemented through the IPEX offer/agree steps."
    variants:
      - name: "default"
        fields:
          - name: "metadata_acdc"
            type: "types://credential-lifecycle#Credential"
            required: true
            description: "Metadata variant ACDC (empty u field) showing what's available without correlation"
          - name: "contractual_terms"
            type: "map"
            required: true
            description: "Rules section content specifying the terms the disclosee must agree to"
          - name: "agreement_said"
            type: "string"
            required: false
            description: "SAID of the IPEX agree message — proof of agreement (set after agree step)"
        invariants:
          - "Full disclosure MUST NOT occur before agreement_said is set"
          - "Metadata ACDC has empty u field — cannot be correlated to the actual Private credential"
          - "Agreement is non-repudiable — signed exn message via IPEX"
          - "Terms in rules section are Ricardian — human and machine readable"

  - name: "DisclosedVariant"
    description: "A specific disclosure of an ACDC — captures which blocks have been expanded and the resulting disclosure form."
    variants:
      - name: "default"
        fields:
          - name: "acdc_said"
            type: "string"
            required: true
            description: "SAID of the full ACDC being disclosed"
          - name: "disclosure_form"
            type: "string"
            required: true
            description: "The disclosure form used (compact, partial, selective, full, etc.)"
          - name: "expanded_blocks"
            type: "array[string]"
            required: true
            description: "SAIDs of the blocks that were expanded in this disclosure"
        invariants:
          - "acdc_said always refers to the same full credential regardless of form"
          - "expanded_blocks is empty for compact form, complete for full form"

  - name: "BulkInstance"
    description: "One copy from a bulk-issued credential set — each copy has a unique SAID but all share the same bulk commitment."
    variants:
      - name: "default"
        fields:
          - name: "instance_said"
            type: "string"
            required: true
            description: "Unique SAID of this instance (blinded with its own UUID)"
          - name: "set_commitment"
            type: "string"
            required: true
            description: "Aggregate commitment binding all copies in the bulk set"
          - name: "index"
            type: "integer"
            required: true
            description: "Position of this instance within the bulk set"
        invariants:
          - "Each instance is unlinkable to other instances in the same set"
          - "Proof of membership requires unbinding this instance's SAID against set_commitment"

  - name: "DisclosureOptions"
    description: "Parameters controlling how a credential disclosure operation is performed."
    variants:
      - name: "default"
        fields:
          - name: "form"
            type: "string"
            required: true
            description: "Target disclosure form (compact, partial, selective, full, etc.)"
          - name: "blocks_to_expand"
            type: "array[string]"
            required: false
            description: "Block labels to expand (e.g., ['a', 'e']) — only for partial/nested-partial"
          - name: "chain_link_terms"
            type: "map"
            required: false
            description: "Contractual terms for chain-link confidentiality gate (rules section content)"
        invariants:
          - "If form is 'full', blocks_to_expand is ignored — all blocks are expanded"
          - "chain_link_terms triggers metadata offer/agree before disclosure"

  - name: "DisclosureRequest"
    description: "Parameters for performing a graduated disclosure operation on a credential — pairs the credential with the desired disclosure options."
    variants:
      - name: "default"
        fields:
          - name: "credential"
            type: "types://credential-lifecycle#Credential"
            required: true
            description: "The ACDC credential to disclose"
          - name: "options"
            type: "types://privacy#DisclosureOptions"
            required: true
            description: "Disclosure form and parameters controlling how the credential is disclosed"
        invariants:
          - "Credential must be in Issued state for disclosure to proceed"
          - "Disclosure form must be compatible with the credential's privacy classification"

  - name: "DisclosureResult"
    description: "Output of a graduated disclosure operation — either a disclosed variant of a credential or a bulk-issued instance."
    variants:
      - name: "disclosed"
        fields:
          - name: "variant"
            type: "types://privacy#DisclosedVariant"
            required: true
            description: "A specific disclosure of an ACDC at the requested form level"
        invariants:
          - "Produced for compact, partial, selective, nested-partial, full, and metadata forms"
      - name: "bulk"
        fields:
          - name: "instance"
            type: "types://privacy#BulkInstance"
            required: true
            description: "A bulk-issued credential instance with unique blinded SAID"
        invariants:
          - "Produced only for bulk-issued disclosure form"

  - name: "PublicOrPrivateOrMetadata"
    description: "Privacy classification of an ACDC block based on the presence and value of the u (UUID) field."
    variants:
      - name: "Public"
        fields: []
        invariants:
          - "No u field — content discoverable from SAID via rainbow table"
          - "Only compact and full disclosure forms available"
      - name: "Private"
        fields: []
        invariants:
          - "u field present with high entropy (>= 128 bits)"
          - "All disclosure forms available including partial"
      - name: "Metadata"
        fields: []
        invariants:
          - "u field present but empty string — signals metadata variant"
          - "Structural fields visible but not correlated to actual credential"
