# ubiquitous-language.yaml
domain_ref: "privacy"

terms:
  - term: "Graduated Disclosure"
    synonyms: []
    definition: "The incremental, interactive application of the principle of least disclosure — each successive disclosure reveals the minimum information needed to enable the next step in a transaction, forming a recursive loop of least-disclosure-enabled transactions."
    invariants:
      - "Each step discloses only what is needed to facilitate further disclosure"
      - "Applies recursively — a contractually protected disclosure results from recursive least disclosure"
      - "All graduated disclosure mechanisms may be used in combination"
      - "Orchestrates modes (compact, partial, full, selective), privacy (public/private/metadata, bulk issuance), and aggregation (AGID, inclusion proofs, compaction)"
    examples:
      - "Metadata disclosure of schema and rules, then partial disclosure of SAID, then full disclosure after contract acceptance"
      - "Compact ACDC presented first, then expanded attribute section after terms agreed"
    related_terms: ["Compact Disclosure", "Partial Disclosure", "Full Disclosure", "Selective Disclosure", "Chain-Link Confidentiality"]

  - term: "Metadata ACDC"
    synonyms: []
    definition: "An ACDC variant with an empty top-level UUID u field, providing a mechanism to make cryptographic commitments to metadata (issuer, schema, edges, rules) without any correlation to the actual private ACDC."
    invariants:
      - "Top-level UUID u field is present but empty — distinguishes from private (non-empty) and public (absent)"
      - "Top-level SAID differs from the actual ACDC's SAID because UUID value differs"
      - "Attribute section a or aggregate A field may be empty or missing"
      - "Only discloser commitments attached, not issuer commitments (prevents correlation)"
    examples:
      - "Metadata ACDC used to offer terms of use before disclosing actual credential"
    related_terms: ["Chain-Link Confidentiality", "Private ACDC", "Public ACDC"]

  - term: "Private ACDC"
    synonyms: ["Confidential ACDC"]
    definition: "An ACDC with a sufficiently high-entropy top-level UUID u field, making the top-level SAID a shielded commitment that cannot be correlated to ACDC content without disclosure."
    invariants:
      - "Top-level UUID u field present with >= 128 bits cryptographic entropy"
      - "Top-level SAID provides a secure shielded commitment"
      - "Content not discoverable from SAID + schema alone"
    examples:
      - "A credential where the SAID can be committed to (signed) without revealing any content"
    related_terms: ["Public ACDC", "Metadata ACDC", "Partial Disclosure", "UUID"]

  - term: "Public ACDC"
    synonyms: ["Non-Confidential ACDC"]
    definition: "An ACDC without a top-level UUID u field, where knowledge of schema and top-level SAID may enable content discovery via rainbow table attack."
    invariants:
      - "Top-level UUID u field absent"
      - "Top-level SAID may serve as a correlation point despite non-disclosure of content"
    examples:
      - "A publicly verifiable attestation where content confidentiality is not required"
    related_terms: ["Private ACDC", "Metadata ACDC"]

  - term: "Bulk-Issued Instance Disclosure"
    synonyms: ["Bulk Issuance"]
    definition: "Issuance of multiple instances of a given ACDC, each a copy with a unique instance identifier, so that disclosure of one instance is not correlatable to another."
    invariants:
      - "Each instance has a unique shielded SAID"
      - "Issuer signs or seals the shielded SAID of each instance"
      - "Instances are not correlatable to each other via their identifiers"
    examples:
      - "Bulk-issued private ACDCs for repeated presentations to different verifiers"
    related_terms: ["Private ACDC", "Selective Disclosure", "AGID"]

  - term: "Shielded Attribute Block"
    synonyms: []
    definition: "An individual attribute block within the aggregate section that includes a SAID (d) and UUID (u) field, making its content discoverable only upon explicit disclosure of the block details including its UUID."
    invariants:
      - "Must have d (SAID) and u (UUID) fields"
      - "All fields in a block must be disclosed together as a set"
      - "Fields within a block are not independently selectively disclosable"
      - "UUID provides sufficient entropy to prevent rainbow table discovery of content"
    examples:
      - "Score block: {\"d\": \"EC-vU...\", \"u\": \"0ABhY2...\", \"score\": 96}"
      - "Compacted to its SAID: \"EC-vU19URXX8ztfWdp_j2HHr1lJsqtGa1YHtZrg6-GMR\""
    related_terms: ["Selective Disclosure", "AGID", "UUID", "Shielded Attribute Block"]

  - term: "Disclosure Form Taxonomy"
    synonyms: ["Graduated Disclosure Forms"]
    definition: "Orthogonal to the credential type dimensions (Privacy, Targeting, etc.), every ACDC disclosure has a FORM that determines how much of the credential content is revealed. The forms progress from most private (compact) to most revealing (full), with chain-link confidentiality gating transitions. Forms apply recursively — each nested block within an ACDC can independently be in any disclosure form."
    invariants:
      - "Forms are: Compact, Partial, Nested Partial, Full, Selective, Metadata, Bulk-Issued"
      - "Progression is monotonically increasing — disclosed information cannot be retracted"
      - "Chain-link confidentiality MAY gate transitions between forms"
      - "Forms apply at any nesting level — a credential can have compact edges but expanded attributes"
      - "Each form is verifiable against the most compact form's SAID"
    related_terms: ["Compact Disclosure", "Partial Disclosure", "Full Disclosure", "Selective Disclosure", "Metadata Disclosure", "Bulk-Issued Disclosure", "Contractually Protected Disclosure"]

  - term: "Compact Disclosure"
    definition: "The most private disclosure form. A block is represented as its SAID only — a cryptographic commitment to the content without revealing it. The receiver can verify the commitment if they later obtain the expanded form. Compact disclosure is the default starting point for graduated disclosure."
    invariants:
      - "Block value is the SAID (d field value) of the expanded form"
      - "Verifiable: expand the block, compute its SAID, compare to compact value"
      - "No content revealed — only the existence and integrity of the block"
    related_terms: ["Disclosure Form Taxonomy", "Partial Disclosure"]

  - term: "Partial Disclosure"
    definition: "A block's SAID plus its UUID and schema are disclosed, but the remaining field values remain shielded. The receiver knows the block exists and what schema it follows, but cannot discover the attribute values without the full expansion. Requires the block to be Private (has u field with entropy)."
    invariants:
      - "Disclosed: d (SAID), u (UUID), s (schema SAID)"
      - "Shielded: all other fields remain undisclosed"
      - "Requires Private block — Public blocks skip directly from Compact to Full"
      - "UUID prevents rainbow table discovery of shielded content"
    related_terms: ["Disclosure Form Taxonomy", "Compact Disclosure", "Full Disclosure"]

  - term: "Full Disclosure"
    definition: "All fields of a block are revealed. The receiver has complete access to attribute values. Verifiable by computing the SAID of the expanded block and matching it to any prior compact commitment."
    invariants:
      - "All fields present and expanded"
      - "Verifiable: SAID(expanded block) must match prior compact commitment"
      - "Terminal form for non-selective disclosure — no further expansion possible"
    related_terms: ["Disclosure Form Taxonomy", "Partial Disclosure"]

  - term: "Selective Disclosure"
    definition: "Individual attributes within the aggregate section (A field) can be disclosed independently without revealing other attributes. Uses AGID (Aggregate Identifier) as a cryptographic commitment to the full set, with inclusion proofs for individual attributes. The receiver verifies each disclosed attribute is a member of the committed set."
    invariants:
      - "Requires A field (aggregate section), NOT a field (attribute section)"
      - "Each attribute block has its own SAID and UUID for independent shielding"
      - "Inclusion proof: compute block SAID, confirm in SAID list, verify AGID"
      - "Disclosing one attribute reveals nothing about other attributes"
    related_terms: ["Disclosure Form Taxonomy", "AGID"]

  - term: "Metadata Disclosure"
    definition: "A special disclosure form using a Metadata ACDC (empty u field at top level). Discloses the credential's structural information (issuer, schema, edges, rules) without revealing attribute content, and without creating a correlation point to the actual Private credential. Used for pre-negotiation — the receiver learns what KIND of credential is available before agreeing to receive it."
    invariants:
      - "Top-level u field is EMPTY (not absent, not high-entropy)"
      - "Structural fields (i, s, e, r) are visible"
      - "Attribute content is not correlated to the actual credential"
      - "Used in chain-link confidentiality negotiation — offer before agreement"
    related_terms: ["Disclosure Form Taxonomy", "Credential Privacy Model", "Contractually Protected Disclosure"]

  - term: "Bulk-Issued Disclosure"
    definition: "A privacy pattern where the issuer creates multiple copies of the same credential, each with a unique SAID and UUID. The holder uses different copies for different verifiers, preventing cross-presentation correlation. Each copy is independently verifiable but unlinkable to other copies of the same credential."
    invariants:
      - "Each copy has unique d (SAID) and u (UUID) values — shielded per-copy"
      - "Issuer commits to a bulk-issued aggregate value binding all copies"
      - "Copies are unlinkable — verifiers cannot determine they came from the same issuance"
      - "Enables one-time-use or verifier-specific presentation strategies"
    related_terms: ["Disclosure Form Taxonomy", "Credential Privacy Model"]

  - term: "Contractually Protected Disclosure"
    synonyms: ["Chain-Link Confidentiality"]
    definition: "A disclosure gating mechanism where the discloser requires the disclosee to agree to contractual terms BEFORE revealing the full credential content. Uses a two-phase pattern: (1) offer a Metadata or Partial form showing what's available, (2) require agreement to rules/terms, (3) only then provide full disclosure. Enforced through IPEX negotiation flow."
    invariants:
      - "Disclosure gated by contractual agreement — not automatic"
      - "Typically uses Metadata ACDC for the offer phase"
      - "Agreement is non-repudiable (signed exn message via IPEX)"
      - "Full disclosure only after agree step in IPEX flow"
      - "Rules section (r field) specifies the contractual terms"
    related_terms: ["Disclosure Form Taxonomy", "Metadata Disclosure", "Credential Governance Model"]

  - term: "PresentationACDC"
    synonyms: ["Bespoke ACDC", "Disclosure-Specific ACDC"]
    definition: "A credential issued by a Discloser to a specific Disclosee as the named Issuee, chaining via Edge Section to one or more prior ACDCs and adding presentation-specific terms (naming the verifier, adding context, attaching contractual language). The Discloser acts as Issuer of this credential — a presentation act, not a standard issuance — enabling custom presentations without modifying the original credential."
    invariants:
      - "The bespoke ACDC chains to the original credential via the e (edges) field"
      - "Issued by the discloser (holder), not the original issuer"
      - "Can add presentation-specific attributes, rules, or context"
      - "Original credential remains unmodified — bespoke ACDC is a wrapper"
    examples:
      - "Presenting a university degree to an employer: holder issues a bespoke ACDC referencing the degree credential, adding employer-specific contractual terms"
    related_terms: ["Credential Chaining Model", "Contractually Protected Disclosure"]

  - term: "ThreePartyExploitationModel"
    synonyms: ["Exploitation Model", "Three-Party Model"]
    definition: "The adversary model defining three exploitation roles: 1st party (data subject / Discloser), 2nd party (intended recipient / Disclosee), 3rd party (unintended observer). All ACDC disclosure mechanisms are designed to prevent exploitation by 2nd and 3rd parties."
    invariants:
      - "1st party is the data subject — the Discloser who controls their own credential data"
      - "2nd party is the intended recipient — the Disclosee who receives disclosed data"
      - "3rd party is any unintended observer — can exploit via correlation, interception, or inference"
      - "Graduated Disclosure mechanisms protect against both 2nd-party misuse and 3rd-party observation"
    examples:
      - "2nd-party exploitation: a verifier using disclosed PII beyond the intended scope"
      - "3rd-party exploitation: an observer correlating presentations across verifiers via shared ACDC SAID"
    related_terms: ["Graduated Disclosure", "Contractually Protected Disclosure", "DataPrivacyPrinciple"]

  - term: "DataPrivacyPrinciple"
    synonyms: ["Privacy Principle"]
    definition: "The framing of ACDC privacy as protection from unpermissioned exploitation of 1st-party data — distinct from information security (confidentiality) and data security (access control). Privacy is about controlling the relationship context in which data is used."
    invariants:
      - "Privacy is not confidentiality — data may be disclosed but only in permitted contexts"
      - "Privacy is not access control — the data subject controls disclosure, not a gatekeeper"
      - "The principle of least disclosure governs all graduated disclosure steps"
    examples:
      - "A credential holder choosing to disclose only their age range, not birthdate, to a verifier"
    related_terms: ["ThreePartyExploitationModel", "Graduated Disclosure", "Contractually Protected Disclosure"]

events:
  - name: "GraduatedDisclosurePerformed"
    payload: "acdc_said: SAID, mode: DisclosureMode, discloser: AID, disclosee: AID, disclosed_sections: [SectionLabel]?"
    triggers: "A graduated disclosure step is completed — the parent orchestrates mode selection, privacy classification, and aggregation operations across its subdomains"

  - name: "PrivacyLevelClassified"
    payload: "acdc_said: SAID, level: PublicOrPrivateOrMetadata, has_uuid: bool"
    triggers: "ACDC is classified by its privacy level based on the presence and value of its top-level UUID field"

  - name: "BulkInstancesIssued"
    payload: "source_acdc_said: SAID, instance_count: int, instance_saids: [SAID], issuer: AID"
    triggers: "Issuer creates multiple uncorrelatable instances of a credential for anti-correlation presentations"

rules:
  - "The principle of least disclosure must be followed — disclose only the minimum information needed"
  - "Graduated disclosure orchestrates disclosure, shielding, and aggregation subdomains in sequence"
  - "Top-level UUID u field determines privacy level: absent = public, non-empty high-entropy = private, present but empty = metadata"
  - "Private ACDC UUIDs must have >= 128 bits of cryptographic entropy to resist rainbow table attacks"
  - "A metadata ACDC must not provide any correlation point to the actual private ACDC"
  - "Bulk-issued instances must have unique shielded SAIDs — no two instances may share an identifier"
