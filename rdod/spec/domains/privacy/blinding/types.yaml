domain_ref: "privacy/blinding"

types:
  - name: "ShieldedAttributeBlock"
    description: "A credential attribute block with UUID shielding — the u field provides entropy that prevents rainbow table discovery of the block's content from its SAID."
    variants:
      - name: "default"
        fields:
          - name: "d"
            type: "string"
            required: true
            description: "SAID of the block (commitment)"
          - name: "u"
            type: "string"
            required: true
            description: "UUID shielding factor — high entropy (>= 128 bits)"
          - name: "td"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "Transaction ACDC SAID — the credential this state change references"
          - name: "ts"
            type: "string"
            required: true
            description: "Transaction state — the credential state value (e.g. 'issued', 'revoked')"
        invariants:
          - "u field MUST have >= 128 bits of entropy"
          - "SAID(block) is a shielded commitment — cannot discover content without u"
          - "Public blocks (no u) cannot be shielded"

  - name: "BoundShieldedAttributeBlock"
    description: "A shielded attribute block bound to a specific transaction and key state — ties the shielding to a verifiable authorization point."
    variants:
      - name: "default"
        fields:
          - name: "blid"
            type: "string"
            required: true
            description: "Shielded SAID of the attribute block"
          - name: "uuid"
            type: "string"
            required: true
            description: "UUID shielding factor (>= 128 bits entropy)"
          - name: "transaction_said"
            type: "string"
            required: true
            description: "SAID of the transaction authorizing this binding"
          - name: "transaction_state"
            type: "string"
            required: true
            description: "State of the authorizing transaction (e.g., issued, revoked)"
          - name: "bound_sn"
            type: "integer"
            required: true
            description: "Sequence number of the KEL event authorizing the transaction"
          - name: "bound_said"
            type: "string"
            required: true
            description: "SAID of the KEL event at bound_sn"
        invariants:
          - "blid is derived from the block content + uuid"
          - "Binding is verifiable: transaction_said must be authorized in the KEL at (bound_sn, bound_said)"
          - "uuid must have >= 128 bits of entropy to prevent rainbow table attacks"

  - name: "HierarchicalDerivation"
    description: "A deterministic key/UUID derivation mechanism using hierarchical paths indexed by bulk copy index and block position, enabling the Issuee to regenerate any bulk-issued ACDC instance from a Shared Secret Salt and index without storing all copies."
    variants:
      - name: "default"
        fields:
          - name: "salt"
            type: "string"
            required: true
            description: "Shared Secret Salt — established between Issuer and Issuee"
          - name: "path"
            type: "list"
            required: true
            description: "Derivation path segments — [copy_index, block_position, ...]"
          - name: "derived_uuid"
            type: "string"
            required: true
            description: "The UUID produced by this derivation — used as blinding factor"
        invariants:
          - "Deterministic — same salt + path always produces same UUID"
          - "Path segments include bulk copy index k and block position within the ACDC"
          - "Issuee can regenerate any instance on demand from salt and index"

  - name: "BlindedStateInput"
    description: "Input for deriving the shielded state of a credential registry event."
    variants:
      - name: "default"
        fields:
          - name: "salt"
            type: "bytes"
            required: true
            description: "Shared secret salt (post-argon2 master secret)"
          - name: "sequence_number"
            type: "integer"
            required: true
            description: "TEL event sequence number"
          - name: "registry_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "Registry identifier"

  - name: "StateDiscoveryInput"
    description: "Input for discovering the credential state behind a shielded BLID."
    variants:
      - name: "default"
        fields:
          - name: "blid"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "The BLID to resolve"
          - name: "salt"
            type: "bytes"
            required: true
            description: "Shared secret salt"
          - name: "sequence_number"
            type: "integer"
            required: true
            description: "TEL event sequence number"
          - name: "candidate_saids"
            type: "array[types://cesr/primitives#SAID]"
            required: true
            description: "Possible ACDC SAIDs to try"

  - name: "StateDiscoveryResult"
    description: "Result of shielded state discovery — indicates whether a matching credential state was found."
    variants:
      - name: "default"
        fields:
          - name: "found"
            type: "boolean"
            required: true
            description: "Whether a match was discovered"
          - name: "acdc_said"
            type: "types://cesr/primitives#SAID"
            required: false
            description: "The matching ACDC SAID if found"
          - name: "state"
            type: "string"
            required: false
            description: "The credential state value if found"

  - name: "UuidDerivationInput"
    description: "Input for deterministic UUID derivation from a shared secret salt and sequence number."
    variants:
      - name: "default"
        fields:
          - name: "salt"
            type: "bytes"
            required: true
            description: "Post-argon2 master secret salt"
          - name: "sequence_number"
            type: "integer"
            required: true
            description: "Derivation index"
