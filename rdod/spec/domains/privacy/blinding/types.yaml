domain_ref: "privacy/blinding"

types:
  - name: "BlindedAttributeBlock"
    description: "A credential attribute block with UUID blinding — the u field provides entropy that prevents rainbow table discovery of the block's content from its SAID."
    variants:
      - name: "default"
        fields:
          - name: "d"
            type: "string"
            required: true
            description: "SAID of the block (commitment)"
          - name: "u"
            type: "string"
            required: true
            description: "UUID blinding factor — high entropy (>= 128 bits)"
          - name: "attributes"
            type: "map"
            required: true
            description: "The actual attribute data (hidden behind the SAID+UUID)"
        invariants:
          - "u field MUST have >= 128 bits of entropy"
          - "SAID(block) is a blinded commitment — cannot discover content without u"
          - "Public blocks (no u) cannot be blinded"

  - name: "BoundBlindedAttributeBlock"
    description: "A blinded attribute block bound to a specific transaction and key state — ties the blinding to a verifiable authorization point."
    variants:
      - name: "default"
        fields:
          - name: "blid"
            type: "string"
            required: true
            description: "Blinded SAID of the attribute block"
          - name: "uuid"
            type: "string"
            required: true
            description: "UUID blinding factor (>= 128 bits entropy)"
          - name: "transaction_said"
            type: "string"
            required: true
            description: "SAID of the transaction authorizing this binding"
          - name: "transaction_state"
            type: "string"
            required: true
            description: "State of the authorizing transaction (e.g., issued, revoked)"
          - name: "bound_sn"
            type: "integer"
            required: true
            description: "Sequence number of the KEL event authorizing the transaction"
          - name: "bound_said"
            type: "string"
            required: true
            description: "SAID of the KEL event at bound_sn"
        invariants:
          - "blid is derived from the block content + uuid"
          - "Binding is verifiable: transaction_said must be authorized in the KEL at (bound_sn, bound_said)"
          - "uuid must have >= 128 bits of entropy to prevent rainbow table attacks"
