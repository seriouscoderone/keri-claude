# ports.yaml
domain_ref: "privacy/blinding"

ports:
  # Inbound -- what the parent privacy domain (and status domain for bup validation) calls
  - id: "port://privacy/blinding/inbound/compute-blid"
    type: inbound
    name: "Compute BLID"
    semantics: query
    idempotent: true
    description: >
      Pure computation — derives the BLID from a shielded attribute block's field
      values. No state, no side effects. Also consumed by credential-lifecycle/status
      for bup event validation.
    contract:
      input: "types://privacy/blinding#ShieldedAttributeBlock"
      output: "types://cesr/primitives#SAID"
      errors:
        - "errors://privacy/blinding#BLIDComputationError"
        - "errors://privacy/blinding#BLIDFieldOrderError"
    refs: ["domain://privacy"]

  - id: "port://privacy/blinding/inbound/blinded-state"
    type: inbound
    name: "Shielded State"
    semantics: query
    idempotent: true
    description: >
      Derives the shielded state for a credential registry event — given a shared
      secret salt, sequence number, and registry SAID, computes the shielded attribute
      block and returns it with a derived BLID. Delegates from
      credential-lifecycle's shielded-state port; also invoked as a protocol step
      when a registry is shieldable.
    contract:
      input: "types://privacy/blinding#BlindedStateInput"
      output: "types://privacy/blinding#ShieldedAttributeBlock"
      errors: []
    refs: ["domain://credential-lifecycle", "domain://privacy"]

  - id: "port://privacy/blinding/inbound/discover-state"
    type: inbound
    name: "Discover Shielded State"
    semantics: query
    idempotent: true
    description: >
      Given a bup event's BLID and the shared secret salt, discovers the credential
      state by trying all state values in the finite state set against candidate
      ACDC SAIDs.
    contract:
      input: "types://privacy/blinding#StateDiscoveryInput"
      output: "types://privacy/blinding#StateDiscoveryResult"
      errors:
        - "errors://privacy/blinding#StateDiscoveryError"
        - "errors://privacy/blinding#ShieldingKeyMismatchError"
    refs: ["domain://privacy"]

  - id: "port://privacy/blinding/inbound/construct-bound-block"
    type: inbound
    name: "Construct Bound Shielded Attribute Block"
    semantics: command
    idempotent: false
    description: >
      Builder — constructs a BoundShieldedAttributeBlock by combining a shielded
      attribute block with binding context (transaction SAID, state, key event sn/SAID).
    contract:
      input: "types://privacy/blinding#ShieldedAttributeBlock"
      output: "types://privacy/blinding#BoundShieldedAttributeBlock"
      errors:
        - "errors://privacy/blinding#UnshieldingError"
    refs: ["domain://privacy"]

  - id: "port://privacy/blinding/inbound/uuid-derivation"
    type: inbound
    name: "UUID Derivation"
    semantics: query
    idempotent: true
    contract:
      input: "types://privacy/blinding#UuidDerivationInput"
      output: "string"
      errors:
        - "errors://privacy/blinding#InsufficientSaltEntropyError"
        - "errors://privacy/blinding#UUIDDerivationError"
        - "errors://privacy/blinding#UUIDLengthError"
    refs: ["domain://privacy"]

  # Outbound -- what blinding depends on
  - id: "port://privacy/blinding/outbound/digest"
    type: outbound
    name: "Cryptographic Digest"
    semantics: query
    idempotent: true
    contract:
      input: "Raw bytes"
      output: "types://cesr/primitives#SAID"
      errors: []
    refs: ["domain://externals/cryptographic-primitives"]

  - id: "port://privacy/blinding/outbound/kdf"
    type: outbound
    name: "Key Derivation Function"
    semantics: query
    idempotent: true
    contract:
      input: "Salt bytes and derivation path"
      output: "Derived key bytes"
      errors: []
    refs: ["domain://externals/cryptographic-primitives"]
