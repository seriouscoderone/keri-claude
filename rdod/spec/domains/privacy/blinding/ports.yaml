# ports.yaml
domain_ref: "privacy/blinding"

ports:
  # Inbound -- what the parent privacy domain (and status domain for bup validation) calls
  - id: "port://privacy/blinding/inbound/compute-blid"
    type: inbound
    name: "Compute BLID"
    semantics: query
    idempotent: true
    description: >
      Pure computation — derives the BLID from a blinded attribute block's field
      values. No state, no side effects. Also consumed by credential-lifecycle/status
      for bup event validation.
    contract:
      input: "types://privacy/blinding#BlindedAttributeBlock"
      output: "types://cesr/primitives#SAID"
      errors:
        - "errors://privacy/blinding#BLIDComputationError"
        - "errors://privacy/blinding#BLIDFieldOrderError"
    refs: ["domain://privacy"]

  - id: "port://privacy/blinding/inbound/blinded-state"
    type: inbound
    name: "Blinded State"
    semantics: command
    idempotent: true
    description: >
      Derives the blinded state for a credential registry event — given a shared
      secret salt, sequence number, and registry SAID, computes the blinded attribute
      block and returns it with a derived BLID. Delegates from
      credential-lifecycle's blinded-state port; also invoked as a protocol step
      when a registry is blindable.
    contract:
      input: "Shared secret salt, sequence number, registry SAID"
      output: "types://privacy/blinding#BlindedAttributeBlock"
      errors: []
    refs: ["domain://credential-lifecycle", "domain://privacy"]

  - id: "port://privacy/blinding/inbound/discover-state"
    type: inbound
    name: "Discover Blinded State"
    semantics: query
    idempotent: true
    description: >
      Given a bup event's BLID and the shared secret salt, discovers the credential
      state by trying all state values in the finite state set against candidate
      ACDC SAIDs.
    contract:
      input: "BLID, salt, event sequence number, candidate ACDC SAIDs"
      output: "Discovered state (credential SAID + state value) or not found"
      errors:
        - "errors://privacy/blinding#StateDiscoveryError"
        - "errors://privacy/blinding#BlindingKeyMismatchError"
    refs: ["domain://privacy"]

  - id: "port://privacy/blinding/inbound/construct-bound-block"
    type: inbound
    name: "Construct Bound Blinded Attribute Block"
    semantics: command
    idempotent: false
    description: >
      Builder — constructs a BoundBlindedAttributeBlock by combining a blinded
      attribute block with binding context (transaction SAID, state, key event sn/SAID).
    contract:
      input: "types://privacy/blinding#BlindedAttributeBlock"
      output: "types://privacy/blinding#BoundBlindedAttributeBlock"
      errors:
        - "errors://privacy/blinding#UnblindingError"
    refs: ["domain://privacy"]

  - id: "port://privacy/blinding/inbound/uuid-derivation"
    type: inbound
    name: "UUID Derivation"
    semantics: query
    idempotent: true
    contract:
      input: "Salt and sequence number"
      output: "UUID string"
      errors:
        - "errors://privacy/blinding#InsufficientSaltEntropyError"
        - "errors://privacy/blinding#UUIDDerivationError"
        - "errors://privacy/blinding#UUIDLengthError"
    refs: ["domain://privacy"]

  # Outbound -- what blinding depends on
  - id: "port://privacy/blinding/outbound/digest"
    type: outbound
    name: "Cryptographic Digest"
    semantics: query
    idempotent: true
    contract:
      input: "Raw bytes"
      output: "types://cesr/primitives#SAID"
      errors: []
    refs: ["domain://externals/cryptographic-primitives"]

  - id: "port://privacy/blinding/outbound/kdf"
    type: outbound
    name: "Key Derivation Function"
    semantics: query
    idempotent: true
    contract:
      input: "Salt bytes and derivation path"
      output: "Derived key bytes"
      errors: []
    refs: ["domain://externals/cryptographic-primitives"]
