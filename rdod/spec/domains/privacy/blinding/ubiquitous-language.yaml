# ubiquitous-language.yaml
domain_ref: "privacy/blinding"

terms:
  - term: "BLID"
    synonyms: ["Blinding SAID"]
    definition: "A cryptographic digest of the concatenated CESR serialization of a blinded attribute block's field values, serving as the value of the b field in a blindable update (bup) event."
    invariants:
      - "Computed on the text domain (qb64) CESR serialization of concatenated field values"
      - "Uses dummy character (#) replacement for self-referential computation (like SAID protocol)"
      - "Field concatenation order: [d, u, td, ts] for basic blocks; [d, u, td, ts, bn, bd] for bound blocks"
      - "Typically uses Blake3-256 digest (E code, 44 characters)"
    examples:
      - "BLID: ECVr7QWEp_aqVQuz4yprRFXVxJ-9uWLx_d6oDinlHU6J"
      - "Placeholder BLID computed with empty td and ts fields (CESR Empty: 1AAP)"
    related_terms: ["Blinded Attribute Block", "Blindable Update", "Shared Secret Salt"]

  # Inherits: "Blinded Attribute Block" from domain://privacy
  - term: "Blinded Attribute Block"
    synonyms: []
    specializes: "Blinded Attribute Block"
    definition: "In the context of the blinding subdomain, a blinded attribute block is the fixed-field CESR concatenation (BLID, UUID, ACDC SAID, transaction state) whose digest serves as the b field in a blindable update event. Specializes the parent definition with the CESR serialization structure, virtual field labels, and the shared-secret-derived UUID blinding mechanism."
    invariants:
      - "Virtual field labels (never serialized): [d, u, td, ts]"
      - "UUID is the blinding factor -- derived from shared secret salt and event sequence number"
      - "Only entities with the shared secret salt can derive the UUID and discover the state"
      - "Not part of the bup message itself -- provided as a CESR attachment when disclosing"
      - "CESR group code: BlindedStateQuadruples (-a##)"
    examples:
      - "Placeholder block with empty td and ts fields (CESR Empty: 1AAP)"
      - "Issued block with real ACDC SAID in td and '0Missued' in ts"
    related_terms: ["BLID", "Bound Blinded Attribute Block", "Shared Secret Salt", "UUID Derivation"]

  - term: "Bound Blinded Attribute Block"
    synonyms: []
    definition: "A variant of the blinded attribute block that adds bound issuee key event sequence number (bn) and SAID (bd) fields, binding the ACDC state to the issuee's key state at the time of publication."
    invariants:
      - "Virtual field labels: [d, u, td, ts, bn, bd]"
      - "Binds ACDC state to issuee's key state -- supports delegation chain verification"
      - "CESR group code: BoundStateSextuples (-b##)"
    examples:
      - "Issued block with issuee key event at sequence number 1: bn=MAAB, bd=EJOnAKX..."
    related_terms: ["Blinded Attribute Block", "BLID"]

  - term: "Shared Secret Salt"
    synonyms: ["Blind Salt"]
    definition: "A secret shared between issuer and designated discloser, used with a hierarchically deterministic derivation algorithm and the TEL event sequence number to derive the UUID blinding factor for each blindable update."
    invariants:
      - "Must have >= 128 bits of cryptographic entropy"
      - "Derivation path is the sequence number of the transaction event"
      - "Derived UUID must be twice as long as the salt to preserve cryptographic entropy"
      - "Only issuer and discloser possess the salt -- enables independent state discovery"
    examples:
      - "Discloser derives UUID from salt + sequence number, tries finite state combinations to discover current state"
      - "Issuer generates 128-bit salt at registry creation, shares it out-of-band with the designated discloser"
    related_terms: ["UUID Derivation", "Blinded Attribute Block", "BLID", "Blindable Update"]

  - term: "Blindable Update"
    synonyms: ["bup event"]
    definition: "A registry update event that uses a blinded attribute block to hide the actual ACDC state, enabling private (blinded) state registries."
    invariants:
      - "Message type t field must be 'bup'"
      - "Field order: [v, t, d, rd, n, p, dt, b] -- all required"
      - "The b field value is the BLID (blinding SAID) of the blinded attribute block"
      - "State can only be discovered by entities holding the shared secret salt"
      - "New blinding factor per update -- prevents correlation between updates and state changes"
    examples:
      - "Blinded issuance event where only the issuer and designated discloser can determine the ACDC state"
      - "Periodic blind updates that decorrelate the time of actual state change"
    related_terms: ["BLID", "Blinded Attribute Block", "Decorrelation", "Shared Secret Salt"]

  - term: "UUID Derivation"
    synonyms: ["Hierarchically Deterministic UUID Derivation"]
    definition: "The process of deterministically deriving the blinding UUID from the shared secret salt and the TEL event sequence number, using HKDF (HMAC-based Key Derivation Function). Ensures both issuer and discloser independently compute the same UUID for each event without communication."
    invariants:
      - "Derivation function: HKDF (HMAC-based Key Derivation Function) with the shared secret salt as input key material and the TEL sequence number as the info parameter"
      - "Output length: 256 bits (32 bytes) to preserve >= 128 bits of cryptographic strength"
      - "The derived UUID is deterministic: same (salt, sn) always produces the same UUID"
      - "Hierarchical: each sequence number produces an independent UUID with no correlation to other sequence numbers"
    examples:
      - "uuid_0 = derive(salt, sn=0) for the first bup event"
      - "uuid_5 = derive(salt, sn=5) for the sixth bup event -- independent of uuid_0 through uuid_4"
      - "Both issuer and discloser independently compute uuid_5 from the same salt"
    related_terms: ["Shared Secret Salt", "Blinded Attribute Block", "BLID", "State Discovery"]

  - term: "Decorrelation"
    synonyms: []
    definition: "The property that periodic blind updates (even with unchanged state) prevent observers from correlating state changes to specific update events. Because each bup event carries a fresh BLID with a new UUID, an observer cannot distinguish a state-changing update from a no-op decorrelation update."
    invariants:
      - "Achieved by publishing bup events at regular intervals regardless of whether state actually changed"
      - "Each bup uses a fresh UUID derived from the next sequence number -- the BLID changes even when state is unchanged"
      - "Observers see a stream of bup events with distinct BLIDs but cannot determine which (if any) correspond to actual state transitions"
      - "The frequency of decorrelation updates is a privacy parameter -- more frequent updates provide stronger decorrelation"
    examples:
      - "Issuer publishes bup events every hour for a credential. Revocation occurs at T=5 but the observer sees bup events at T=1,2,3,4,5,6,7 with no distinguishing characteristic at T=5"
      - "Without decorrelation: observer sees bup only at issuance and revocation -- timing reveals state change"
    related_terms: ["Blindable Update", "BLID", "UUID Derivation", "State Discovery"]

  - term: "State Discovery"
    synonyms: []
    definition: "The process by which a holder of the shared secret salt discovers the current credential state by deriving the UUID for the latest bup event's sequence number, then trying each possible state value (from the finite state set) combined with known or candidate ACDC SAIDs to find a combination whose BLID matches the b field in the bup event."
    invariants:
      - "Requires possession of the shared secret salt"
      - "Derives the UUID from salt + latest event sequence number"
      - "Tries each state in the finite state set (e.g., issued, revoked) with each candidate ACDC SAID"
      - "Match is found when computed BLID equals the b field in the bup event"
      - "Computational cost is bounded by |states| x |candidate_acdc_saids| -- typically very small"
      - "Without the salt, brute-forcing the UUID is computationally infeasible (>= 128 bits entropy)"
    examples:
      - "Discloser computes uuid = derive(salt, sn=5), then tries BLID(uuid, acdc_said, 'issued') and BLID(uuid, acdc_said, 'revoked') -- one matches the b field"
      - "For a registry tracking one credential with two states: at most 2 BLID computations per discovery"
    related_terms: ["Shared Secret Salt", "UUID Derivation", "BLID", "Blinded Attribute Block", "Decorrelation"]

events:
  - name: "BlindUpdatePublished"
    payload: "regid: REGID, event_sn: int, blid: BLID"
    triggers: "Issuer publishes a new bup event with a fresh BLID derived from the next UUID in the sequence"

  - name: "StateDiscovered"
    payload: "regid: REGID, event_sn: int, acdc_said: SAID, discovered_state: CredentialState"
    triggers: "A holder of the shared secret salt successfully matches a BLID to a state+ACDC combination"

  - name: "DecorrelationUpdatePublished"
    payload: "regid: REGID, event_sn: int, blid: BLID"
    triggers: "Issuer publishes a bup event with unchanged state solely to prevent timing correlation"

rules:
  - "Every bup event must use a UUID derived from the shared secret salt and the event's sequence number -- never reuse a UUID"
  - "BLID computation uses Blake3-256 digest on the qb64 concatenation of blinded attribute block fields"
  - "Decorrelation updates must be indistinguishable from state-changing updates to any observer without the salt"
  - "The shared secret salt must have >= 128 bits of cryptographic entropy"
  - "UUID length must be 2x the salt length to preserve cryptographic entropy through the derivation"
  - "State discovery requires trying all states in the finite state set -- the cost is bounded by the set cardinality"
  - "Bound blinded attribute blocks extend the basic block with issuee key state binding (bn, bd fields)"
