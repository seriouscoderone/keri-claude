domain_ref: "privacy/aggregation"

types:
  - name: "AggregationInput"
    description: "Input for aggregation operations — either a blinded attribute block for AGID computation or a list of SAIDs for aggregate verification."
    variants:
      - name: "blinded_block"
        fields:
          - name: "block"
            type: "types://privacy/blinding#BlindedAttributeBlock"
            required: true
            description: "Blinded attribute block to compute AGID from"
        invariants:
          - "Used for computing the aggregate identifier (AGID) from blinded attributes"
      - name: "said_list"
        fields:
          - name: "saids"
            type: "array[string]"
            required: true
            description: "List of SAIDs for aggregate verification or compaction"
        invariants:
          - "SAIDs must be in canonical order for reproducible aggregation"

  - name: "SADPath"
    description: "A path expression identifying a specific location within a nested SAD structure. Used for selective disclosure and SAD path signatures."
    variants:
      - name: "default"
        fields:
          - name: "path"
            type: "array[string]"
            required: true
            description: "Ordered sequence of field labels from root to target"
        invariants:
          - "Each element is a field label in the SAD hierarchy"
          - "Empty path refers to the root SAD"
        examples:
          - "['a', 'i'] — the issuee field inside the attributes section"
          - "['e', 'edge1', 'd'] — the SAID of a specific edge"

  - name: "SadPathSig"
    description: "A SAD path signature — a signature over a specific path within a SAD structure, enabling selective signing of credential subsections."
    variants:
      - name: "default"
        fields:
          - name: "path"
            type: "string"
            required: true
            description: "SAD path expression identifying the signed location (e.g., '-a-i')"
          - name: "signature"
            type: "string"
            required: true
            description: "CESR-encoded signature over the content at the path"
          - name: "signer_aid"
            type: "string"
            required: true
            description: "AID of the signer — verifiable against its current key state"
        invariants:
          - "Signature is over the serialized content at the specified path, not the whole SAD"
          - "Signer's key state must be resolvable at verification time"
          - "Path must resolve to a valid location in the target SAD"
