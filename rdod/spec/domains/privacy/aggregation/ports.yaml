# ports.yaml
domain_ref: "privacy/aggregation"

ports:
  # Inbound -- what the parent privacy domain calls
  - id: "port://privacy/aggregation/inbound/aggregation-operations"
    type: inbound
    name: "Aggregation Operations"
    semantics: query
    idempotent: true
    contract:
      input: "types://privacy/aggregation#AggregationInput"
      output: "types://cesr/primitives#SAID"
      errors:
        - "errors://privacy/aggregation#AGIDVerificationError"
        - "errors://privacy/aggregation#InclusionProofError"
        - "errors://privacy/aggregation#CompactionError"
        - "errors://privacy/aggregation#SAIDListEmptyError"
        - "errors://privacy/aggregation#OneOfOrderError"
        - "errors://privacy/aggregation#MostCompactFormError"
    refs: ["domain://privacy"]

  - id: "port://privacy/aggregation/inbound/path-signatures"
    type: inbound
    name: "SAD Path Signature Operations"
    semantics: command
    idempotent: true
    contract:
      input: "types://privacy/aggregation#SADPath"
      output: "types://privacy/aggregation#SadPathSig"
      errors:
        - "errors://privacy/aggregation#SADPathSignatureError"
    refs: ["domain://privacy"]

  # Outbound -- kernel dependency for cryptographic operations
  - id: "port://privacy/aggregation/outbound/digest"
    type: outbound
    name: "Cryptographic Digest for AGID and SAID"
    semantics: query
    idempotent: true
    contract:
      input: "Raw bytes or SAD structure"
      output: "types://cesr/primitives#SAID"
      errors: []
    refs: ["domain://externals/cryptographic-primitives"]
