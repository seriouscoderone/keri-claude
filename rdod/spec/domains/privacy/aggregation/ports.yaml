# ports.yaml
domain_ref: "privacy/aggregation"

ports:
  # Inbound -- what the parent privacy domain calls
  - id: "port://privacy/aggregation/inbound/aggregation-operations"
    type: inbound
    name: "Aggregation Operations"
    contract: "compute_agid(said_list: [SAID]) -> AGID; verify_inclusion(block: BlindedAttributeBlock, said_list: [SAID], agid: AGID) -> Result<Valid, InclusionProofError>; compute_most_compact_form(acdc: ACDC) -> ACDC; compact(block: Block) -> SAID; expand(said: SAID, sad: SAD) -> Result<Block, SAIDVerificationError>"
    protocol: "method-call"
    refs: ["domain://privacy"]

  - id: "port://privacy/aggregation/inbound/path-signatures"
    type: inbound
    name: "SAD Path Signature Operations"
    contract: "sign_path(path: SADPath, sad: SAD, signer: Signer) -> SadPathSig; verify_path_signature(path: SADPath, sad: SAD, sig: SadPathSig, verfer: Verfer) -> Result<Valid, SignatureVerificationError>"
    protocol: "method-call"
    refs: ["domain://privacy"]

  # Outbound -- kernel dependency for cryptographic operations
  - id: "port://privacy/aggregation/outbound/digest"
    type: outbound
    name: "Cryptographic Digest for AGID and SAID"
    contract: "blake3_256(data: bytes) -> Digest; said_compute(sad: SAD) -> SAID"
    protocol: "method-call"
    refs: ["external://cryptographic-primitives"]
