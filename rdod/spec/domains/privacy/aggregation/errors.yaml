# errors.yaml
domain_ref: "privacy/aggregation"

# Error catalog for the Aggregation (Selective Disclosure) domain.
# Covers AGID computation, inclusion proofs, most compact form,
# compaction, and SAD path signatures.
#
# Severity levels:
#   transient  — condition may self-resolve (escrow and retry)
#   recoverable — requires operator or protocol-level action
#   fatal      — unrecoverable; event is permanently rejected

errors:
  - name: "AGIDVerificationError"
    description: "Disclosed attribute's SAID does not match the AGID commitment"
    cause: "The attribute SAID is not a member of the aggregate set committed by the AGID — the attribute was tampered with or does not belong to this credential"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "attribute_said"
        type: "string"
        description: "The SAID of the attribute that failed inclusion"
      - field: "agid"
        type: "string"
        description: "The aggregate identifier being verified against"
    related_port: "port://privacy/aggregation/inbound/aggregation-operations"

  - name: "InclusionProofError"
    description: "Inclusion proof for a selectively disclosed attribute is invalid"
    cause: "The proof does not demonstrate that the attribute SAID is a member of the committed aggregate — either the SAID list is wrong, the AGID recomputation does not match the A field, or the block SAID is not in the list"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "attribute_said"
        type: "string"
        description: "The attribute being proved"
      - field: "proof_type"
        type: "string"
        description: "Type of inclusion proof (digest concatenation, Merkle, accumulator)"
    related_port: "port://privacy/aggregation/inbound/aggregation-operations"

  - name: "CompactionError"
    description: "Cannot compute the most compact form of a credential block"
    cause: "The block is missing a d field (SAID) or u field (UUID required for privacy) needed for compaction"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "block_path"
        type: "string"
        description: "The SAD path to the block that failed compaction"
      - field: "missing_field"
        type: "string"
        description: "The field that is missing (d or u)"
    related_port: "port://privacy/aggregation/inbound/aggregation-operations"

  - name: "SAIDListEmptyError"
    description: "AGID computation was attempted with an empty SAID list"
    cause: "The SAID list provided to compute_agid has zero elements — at least one attribute block SAID is required"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "credential_said"
        type: "string"
        description: "The credential whose aggregate section is empty"
    related_port: "port://privacy/aggregation/inbound/aggregation-operations"

  - name: "OneOfOrderError"
    description: "Schema oneOf composition has compact SAID variant in wrong position"
    cause: "The compact SAID variant must appear as the first variant in the oneOf list — it was found at a later position or is missing entirely"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "schema_said"
        type: "string"
        description: "The schema SAID"
      - field: "oneof_path"
        type: "string"
        description: "The JSON path to the oneOf array within the schema"
      - field: "compact_position"
        type: "integer"
        description: "The actual position of the compact variant (-1 if missing)"
    related_port: "port://privacy/aggregation/inbound/aggregation-operations"

  - name: "SADPathSignatureError"
    description: "SAD path signature does not verify against the disclosed attribute"
    cause: "The signature over a specific SAD path does not verify against the signer's public key for the given path and attribute value"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "path"
        type: "string"
        description: "The SAD path (e.g., /a/score) that failed verification"
      - field: "signer_aid"
        type: "string"
        description: "The AID of the expected signer"
    related_port: "port://privacy/aggregation/inbound/path-signatures"

  - name: "MostCompactFormError"
    description: "Depth-first most compact form computation produced inconsistent results"
    cause: "The bottom-up SAIDification algorithm failed — a leaf SAID could not be computed, or the resulting root SAID does not match the credential's d field"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "acdc_said"
        type: "string"
        description: "The credential's declared SAID"
      - field: "computed_said"
        type: "string"
        description: "The SAID computed by the most compact form algorithm"
      - field: "failed_depth"
        type: "integer"
        description: "The tree depth at which the computation failed"
    related_port: "port://privacy/aggregation/inbound/aggregation-operations"
