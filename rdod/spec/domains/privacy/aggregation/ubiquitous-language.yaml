# ubiquitous-language.yaml
domain_ref: "privacy/aggregation"

terms:
  - term: "AGID"
    synonyms: ["Aggregate ID"]
    definition: "A cryptographic digest of the serialized list of shielded attribute block SAIDs, serving as the compact value of the selectively disclosable aggregate section (A field)."
    invariants:
      - "AGID = SAID(serialize([AGID_placeholder, block_SAID_1, block_SAID_2, ..., block_SAID_N]))"
      - "Serialization uses the same format as the enclosing ACDC (JSON, CBOR, or MGPK) — determined by the ACDC's version string v field"
      - "The zeroth element is the AGID itself (computed via dummy character replacement, same as any SAID)"
      - "Block SAIDs are in the order they appear in the schema's anyOf composition — NOT sorted"
      - "Makes a shielded commitment to all SAIDs in the list"
      - "Collision-resistant against birthday attacks on concatenated elements"
      - "Computation: serialize ordered list of N+1 values (dummy placeholder at index 0 + N Shielded Attribute Block SAIDs), compute digest, replace placeholder with digest. Serialization format matches the enclosing ACDC's version string."
    examples:
      - "AGID as compact A field value: \"A\": \"EN5d44fTNM0M4kmMMVrsH0HwMLRLyb6SoJEV0ogkLdXx\""
      - "AGID computation: dummied list serialized, digested, dummy replaced with digest"
    related_terms: ["Selective Disclosure", "Aggregate Section", "Inclusion Proof"]

  - term: "Inclusion Proof"
    synonyms: []
    definition: "Proof that a specific shielded attribute block is a member of the aggregated set, verified by checking that the block's SAID appears in the SAID list whose digest matches the AGID."
    invariants:
      - "Requires: disclosed block, full SAID list, compact ACDC with AGID, issuer's KEL seal"
      - "Verification: compute block SAID, confirm in list, compute AGID from list, match A field"
    examples:
      - "Proving a score block is part of a selectively disclosable credential without revealing other blocks"
    related_terms: ["AGID", "Selective Disclosure", "Shielded Attribute Block"]

  - term: "oneOf Composition"
    synonyms: []
    definition: "JSON Schema composition operator used in ACDC schemas to validate both compact (SAID-only) and expanded (full block) variants of a section or sub-block."
    invariants:
      - "Compact SAID variant must appear as the first variant in the oneOf list"
      - "Enables issuer to commit to composed schema once, covering all graduated disclosure variants"
      - "Decomposing (removing compact variant) enables validator to enforce full disclosure"
    examples:
      - "oneOf: [{type: string, description: 'Section SAID'}, {type: object, properties: {...}}]"
    related_terms: ["Schema", "Compact Disclosure", "Most Compact Form"]

  - term: "Most Compact Form"
    synonyms: []
    definition: "The canonical representation of an ACDC or block used for computing its unique SAID — computed by a depth-first algorithm that SAIDifies leaf blocks, compacts them, then SAIDifies enclosing blocks upward to the root. The Most Compact Form algorithm is general — it applies to all ACDC sections and the top-level ACDC itself, not only to AGID computation. Any ACDC or section has exactly one Most Compact Form whose SAID is the canonical identifier."
    invariants:
      - "There is one and only one most compact form SAID for any ACDC"
      - "Leaf blocks are SAIDified first on their fully expanded form"
      - "Non-SAIDed sub-blocks with oneOf variants use their most fully expanded variant"
      - "The algorithm is reversible for verification: expand, verify SAID, recurse down"
    examples:
      - "Depth-first: compute leaf SAIDs, compact leaves, compute parent SAIDs, compact parents, repeat to root"
    related_terms: ["SAID", "Compact Disclosure", "oneOf Composition"]

  - term: "Compactor"
    synonyms: []
    definition: "Hierarchical graduated partial disclosure engine for nested field maps. Traverses the credential tree, computing SAIDs at each branch. Supports degrees of partial disclosure: full compact (SAIDs only), partial uncompaction (reveal selected branches), full expansion (all data)."
    invariants:
      - "leaf SAIDs property provides mappers at each leaf node with computed SAIDs"
      - ".partials property provides partially disclosable variants of the credential"
      - ".iscompact property indicates whether the current form has leaf-level SAIDs"
      - "Depth-first traversal computes SAIDs bottom-up through the credential tree"
    examples:
      - "Compactor applied to a credential with nested attribute and edge sections, producing compact, partial, and full variants"
      - "Checking compactor.iscompact to determine if a credential is in compact form before processing"
    related_terms: ["Most Compact Form", "Partial Disclosure", "Nested Partial Disclosure", "SAID"]

  - term: "SAD Path Signatures"
    synonyms: []
    definition: "Signatures over specific paths within a SAD structure, enabling selective disclosure. Indexed signatures use quinkey indexing mapped to Indexed Signature primitives; non-indexed signatures use couple form mapping Verification Key to Unindexed Signature. Used with Path primitives to prove specific attribute disclosures without revealing the entire credential."
    invariants:
      - "Indexed SAD path signatures use quinkey indexing mapped to Indexed Signature primitives"
      - "Non-indexed SAD path signatures use couple form mapping Verification Key to Unindexed Signature"
      - "Each signature is bound to a specific path within the SAD tree via a Path primitive"
      - "Enables proof of specific attribute values without disclosing the full credential"
    examples:
      - "Signing the path /a/score within a credential to prove the score value without revealing other attributes"
      - "Verifier checking a SAD path signature against the disclosed attribute and the issuer's key state"
    related_terms: ["Selective Disclosure", "Partial Disclosure", "SAID", "Most Compact Form"]

events:
  - name: "AGIDComputed"
    payload: "said_list: [SAID], agid: AGID, serialization_kind: SerializationKind"
    triggers: "A new AGID is computed from a list of shielded attribute block SAIDs during credential issuance or verification"

  - name: "InclusionProofVerified"
    payload: "block_said: SAID, agid: AGID, result: ValidOrInvalid"
    triggers: "A verifier checks that a disclosed block's SAID is a member of the aggregate set"

  - name: "MostCompactFormComputed"
    payload: "acdc_said: SAID, leaf_saids: [SAID], depth: int"
    triggers: "The depth-first most compact form algorithm completes, producing the canonical SAID for an ACDC"

rules:
  - "AGID computation requires serialization of the SAID list with the zeroth element as a self-referential placeholder"
  - "Inclusion proof verification must recompute the AGID from the full SAID list — partial list verification is not supported"
  - "The most compact form algorithm must process leaves before parents — depth-first bottom-up ordering"
  - "oneOf composition must list the compact (SAID string) variant first in the schema array"
  - "SAD path signatures bind to specific paths — a signature on /a/score does not cover /a/name"
  - "Proof of issuance (PoI) may be provided via the most compact form SAID and issuer's signature/seal"
  - "Proof of disclosure (PoD) may be provided by disclosing the SAD and recursively expanding nested SADs"
