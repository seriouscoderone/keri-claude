domain_ref: "local-agent"

errors:
  - name: "DatabaseOpenError"
    description: "Cannot open the local LMDB database"
    cause: "Database file is locked by another process, corrupted, or the path does not exist"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "database_path"
        type: "string"
        description: "The LMDB database path"
      - field: "reason"
        type: "string"
        description: "OS-level error message"

