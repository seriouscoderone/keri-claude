# domain.yaml

template_version: "1.0"

id: "local-agent/api"

name: "Local Agent API"

description: >
  CLI and direct function interface for the fat wallet — the boundary through which
  controllers interact with their local KERI stack. Encompasses the kli command-line
  interface in keripy and the Hab/Habery programmatic API. Handles all identity,
  credential, and discovery operations locally without cloud agent dependency.

version: "0.1.0"

source_material:
  - type: document
    reference: "keripy cli/ — Python CLI (kli) implementation"
  - type: document
    reference: "keripy app/habbing.py — Habery/Hab programmatic API"

ubiquitous_language:
  - term: "Message Intake"
    definition: "CESR deserialization for direct mode message processing — the local agent processes KERI streams in-process rather than over HTTP"
    invariants:
      - "Same CESR deserialization as service APIs, but in-process rather than over network"
  - term: "Request Authentication"
    definition: "Signature verification for locally-sourced and remotely-received messages"
    invariants:
      - "Local operations are trusted (signed by the controller's own keys)"
      - "Remote messages (from witnesses, watchers, peers) are verified against key state"
  - term: "Protocol Dispatch"
    definition: "Routing operations to the appropriate domain handler — CLI commands and API calls both dispatch through the same domain layer"
    invariants:
      - "Every kli command maps to exactly one domain operation"
      - "The programmatic API provides the same operations as the CLI"

domain_clients:
  - ref: "domain://local-agent"
    relationship: "Parent domain"

subdomains: []

kernels:
  - ref: "kernel://cesr"
    source: "domain://cesr"
    relationship: "Published Language — CESR encoding for all messages"

adjacents:
  - ref: "domain://identity"
    relationship: "Conformist — full KERI identity management"
    pattern: "Conformist"
  - ref: "domain://credential-lifecycle"
    relationship: "Conformist — full ACDC credential management"
    pattern: "Conformist"
  - ref: "domain://discovery"
    relationship: "Conformist — OOBI resolution and endpoint management"
    pattern: "Conformist"

externals: []

implementation_guidance:
  suggested_type: "app"
  language_affinity: "any"
  notes: "The local agent API spans all protocol domains since the fat wallet runs the complete KERI stack locally. Each CLI command or API method delegates to the appropriate domain."

tags: ["local-agent", "api", "cli", "fat-wallet"]

invariants:
  - "Private keys never leave the local device"
  - "All operations execute locally — no cloud agent dependency"
  - "CLI commands map to domain operations (each kli command serves a specific domain)"
