# verification.yaml
domain_ref: "local-agent/api"

# Verification properties are language-agnostic invariants.
# Code examples use Python/pytest syntax for illustration — implementations
# in other languages should express equivalent assertions in their native testing framework.

properties:
  - invariant: "Every kli command produces the same observable state change as the equivalent programmatic API call"
    term: "CLI Interface"
    technique: property-based
    formal:
      language: pseudocode
      expression: |
        for each (cli_command, api_equivalent) in [
          ("kli init --name test --salt 0A...",  create_habery(name="test", salt=...)),
          ("kli incept --alias myid ...",        habery.makeHab("myid", ...)),
          ("kli rotate --alias myid",            hab.rotate()),
          ("kli interact --alias myid --data {}", hab.interact(data=[...])),
          ("kli status --alias myid",            hab.kever.key_state())
        ]:
          # Execute CLI command against a fresh environment
          env_cli = create_test_environment()
          cli_result = execute_cli(env_cli, cli_command)
          # Execute API equivalent against an identical fresh environment
          env_api = create_test_environment()
          api_result = execute_api(env_api, api_equivalent)
          # Both must produce the same observable state
          assert env_cli.get_kel(prefix) == env_api.get_kel(prefix)
          assert env_cli.get_key_state(prefix) == env_api.get_key_state(prefix)
        # The behavioral guarantee: CLI is a transparent wrapper — it never
        # adds, removes, or transforms domain behavior.
    strategy: "Each CLI command paired with its programmatic equivalent, compared by observable state"
    notes: "CLI is a thin layer — verified by state equivalence with the programmatic API, not by checking method existence"

  - invariant: "init() creates a Habery that can manage identifiers, sign content, and process events"
    term: "Hab/Habery API"
    technique: property-based
    formal:
      language: pseudocode
      expression: |
        for any valid name, salt:
          habery = create_habery(name=name, salt=salt)
          # Database is functional — can store and retrieve
          hab = habery.makeHab("test_hab")
          assert hab.pre is not null  # Identifier was created
          # Key manager is functional — can sign
          sigs = hab.sign(random_bytes())
          assert length(sigs) >= 1
          # Event processor is functional — can validate events
          kel = habery.get_kel(hab.pre)
          assert length(kel) >= 1  # At least the inception event
          assert kel[0].sn == 0    # Inception is at sequence 0
        # The behavioral guarantee: a Habery created by init() is immediately
        # usable for the full identifier lifecycle — not just structurally present.
    strategy: "Arbitrary valid names and salts, verified through actual identifier lifecycle operations"
    notes: "Habery initialization verified by exercising its core capabilities, not by checking internal field existence"

  - invariant: "All operations are synchronous and in-process"
    term: "Hab/Habery API"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(valid_key_event_strategy())
        def test_operations_are_synchronous(event):
            with capture_network_traffic() as traffic:
                habery = create_habery()
                hab = habery.makeHab('test')
                hab.interact(data=[{'test': 1}])
                key_state = hab.kever
            # Core operations should not require network (witness comms are separate)
            assert key_state is not None
            assert key_state.sn >= 0
    strategy: "valid_key_event_strategy()"
    notes: "Core Hab/Habery operations execute entirely in-process"

contracts:
  - port_ref: "port://local-agent/api/inbound/hab-operations"
    preconditions:
      - formal:
          language: python
          expression: "lambda name, salt, config: name is not None and salt is not None"
        description: "init requires a name and salt"
      - formal:
          language: python
          expression: "lambda alias, icount, ncount, wits, toad: alias is not None and icount >= 1 and toad <= len(wits)"
        description: "incept requires valid alias, at least 1 signing key, and toad <= witness count"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda name, salt, config, habery:
                habery.db is not None and habery.mgr is not None
        description: "init creates a Habery with shared resources"
      - formal:
          language: python
          expression: |
            lambda alias, hab:
                hab.pre is not None and hab.kever is not None and hab.kever.sn == 0
        description: "incept creates a Hab at sn=0"

  - port_ref: "port://local-agent/api/inbound/cli"
    preconditions:
      - formal:
          language: python
          expression: "lambda name, salt, config: name is not None"
        description: "kli_init requires a name"
    postconditions:
      - formal:
          language: python
          expression: "lambda name, result: result.success and local_db_exists(name)"
        description: "kli_init creates a persistent local database"

state_machines: []
