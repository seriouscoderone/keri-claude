domain_ref: "local-agent/api"

errors:
  - name: "IdentifierNotFoundError"
    description: "Requested identifier alias does not exist in the local Identifier Repository"
    cause: "No Habitat with this alias has been incepted"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "alias"
        type: "string"
        description: "The identifier alias that was not found"

  - name: "DuplicateAliasError"
    description: "An identifier with this alias already exists"
    cause: "Attempted to incept a new identifier with an alias that is already in use"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "alias"
        type: "string"
        description: "The duplicate alias"

  - name: "CLIConfigError"
    description: "CLI configuration file is missing or malformed"
    cause: "The --config-file or --config-dir arguments point to a file that does not exist or cannot be parsed"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "config_path"
        type: "string"
        description: "The configuration file path"
      - field: "reason"
        type: "string"
        description: "Parse error details"

  - name: "CLIArgumentError"
    description: "Required CLI argument is missing or invalid"
    cause: "A kli command was invoked without a required argument or with an invalid value"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "command"
        type: "string"
        description: "The kli command (incept, rotate, etc.)"
      - field: "argument"
        type: "string"
        description: "The missing or invalid argument"
