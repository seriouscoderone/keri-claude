# ports.yaml
domain_ref: "local-agent/api"

ports:
  - id: "port://local-agent/api/inbound/tcp-protocol"
    type: inbound
    name: "TCP Protocol Interface"
    semantics: command
    idempotent: false
    contract:
      input: "CESR-encoded byte stream"
      output: "Parsed KERI messages"
      errors: []
    refs: []

  - id: "port://local-agent/api/inbound/hab-operations"
    type: inbound
    name: "Hab/Habery Operations"
    semantics: command
    idempotent: false
    contract:
      input: "types://local-agent/api#Habitat"
      output: "types://identity/state#KeyState"
      errors:
        - "errors://local-agent/api#IdentifierNotFoundError"
        - "errors://local-agent/api#DuplicateAliasError"
    refs: []

  - id: "port://local-agent/api/inbound/cli"
    type: inbound
    name: "CLI Interface"
    semantics: command
    idempotent: false
    contract:
      input: "CLI arguments (name, alias, config_file)"
      output: "types://identity/state#KeyState"
      errors:
        - "errors://local-agent/api#CLIConfigError"
        - "errors://local-agent/api#CLIArgumentError"
    refs: []

  - id: "port://local-agent/api/inbound/credential-operations"
    type: inbound
    name: "Credential Operations"
    semantics: command
    idempotent: false
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://local-agent/api#VerificationResult"
      errors:
        - "errors://local-agent/api#IdentifierNotFoundError"
    refs: []

  - id: "port://local-agent/api/outbound/tcp-transport"
    type: outbound
    name: "TCP Transport"
    semantics: command
    idempotent: false
    contract:
      input: "Host, port, and CESR byte stream"
      output: "TCP connection result"
      errors: []
    refs: ["domain://externals/transport"]
