domain_ref: "local-agent/api"

types:
  - name: "Habitat"
    description: "The container for a single identifier's complete state — keys, event log, witness configuration, and agent context. Called Hab/Habery in keripy."
    variants:
      - name: "single"
        fields:
          - name: "name"
            type: "string"
            required: true
            description: "Human-readable identifier name (alias)"
          - name: "prefix"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The identifier (AID)"
          - name: "key_state"
            type: "types://identity/state#KeyState"
            required: true
            description: "Current cryptographic configuration"
          - name: "event_log"
            type: "array"
            required: true
            description: "Complete KEL for this identifier"
          - name: "config"
            type: "map"
            required: true
            description: "Configuration (witnesses, thresholds, traits)"
        invariants:
          - "name must be unique within the local agent"
          - "prefix is immutable after inception"
          - "key_state is derived from processing the event_log"
      - name: "group"
        fields:
          - name: "name"
            type: "string"
            required: true
            description: "Group identifier name"
          - name: "prefix"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Group AID"
          - name: "members"
            type: "array[types://cesr/primitives#AID]"
            required: true
            description: "Member AIDs participating in this group"
          - name: "local_member"
            type: "types://cesr/primitives#AID"
            required: true
            description: "This agent's member AID within the group"
        invariants:
          - "local_member must be in members list"
          - "Group operations require coordination with other members via exn"

  - name: "VerificationResult"
    description: "Outcome of verifying a credential's authenticity and validity chain."
    variants:
      - name: "default"
        fields:
          - name: "valid"
            type: "boolean"
            required: true
            description: "Whether the credential passed all verification checks"
          - name: "credential_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the credential that was verified"
          - name: "issuer_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the credential issuer"
          - name: "reasons"
            type: "array[string]"
            required: true
            description: "Failure reasons (empty if valid)"
        invariants:
          - "If valid is true, reasons is empty"
          - "If valid is false, reasons contains at least one failure description"
