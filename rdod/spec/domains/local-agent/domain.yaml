# domain.yaml
template_version: "1.0"
id: "local-agent"
name: "Local Agent (Full-Stack KERI Application)"
description: >
  Application-tier domain for fat wallet KERI applications. The complete KERI stack runs
  on the controller's device: private keys, event processing, database, and direct witness
  communication all in one process. No cloud agent dependency. The Hab/Habery pattern is
  the primary API. Implementations: keripy (direct usage), keriox (standalone mode).
version: "0.1.0"

source_material:
  - type: document
    reference: "keripy — Python reference implementation (Hab, Habery, Manager, Baser, Kevery, kli)"
  - type: document
    reference: "keriox — Rust production implementation (Controller, Identifier SDK, standalone mode)"
  - type: document
    reference: "keri-specification.md — KERI protocol specification"
  - type: user-input
    reference: "CLAUDE.md — keripy CLI, development commands, architecture"

domain_clients: []

subdomains:
  - ref: "domain://local-agent/api"
    relationship: "CLI and direct function interface — the boundary through which controllers interact with their local KERI stack"
    via_port: "port://local-agent/api/inbound/hab-operations"

kernels:
  - ref: "kernel://cryptographic-algorithms"
    source: "Ed25519 (signing), X25519 (key agreement), Blake3-256/Blake2b-256/SHA-256 (digests), argon2 (key stretching), libsodium"
    relationship: "Cryptographic algorithm types used directly for local key generation, signing, hashing, and key stretching"
  - ref: "kernel://cesr"
    source: "domain://cesr"
    relationship: "Conformist — uses CESR primitives (Verfer, Siger, Diger, Salter, Cigar) directly for all encoding"
  - ref: "kernel://keri-messaging"
    source: "domain://keri-messaging"
    relationship: "KERI messaging primitives (exn, qry, rpy) adopted natively"

adjacents:
  - ref: "domain://identity"
    relationship: "Conformist — runs the full KERI protocol stack locally, using all event types, key state computation, and escrow processing directly"
    pattern: "Conformist"
    via_port: "port://identity/inbound/identity-management"
    is_cross_cutting: false
  - ref: "domain://credential-lifecycle"
    relationship: "Conformist — uses ACDC credential types, TEL events, and IPEX exchange protocol directly"
    pattern: "Conformist"
    via_port: "port://credential-lifecycle/inbound/state-management"
    is_cross_cutting: false
  - ref: "domain://discovery"
    relationship: "Customer-Supplier — resolves OOBIs directly over HTTP for endpoint and key state discovery"
    pattern: "Customer-Supplier"
    via_port: "port://discovery/inbound/discovery"
    is_cross_cutting: false
  - ref: "domain://witness-service"
    relationship: "Customer-Supplier — connects to witnesses directly via HTTP for event receipting and key state verification"
    pattern: "Customer-Supplier"
    via_port: "port://local-agent/outbound/witness-comms"
    is_cross_cutting: false
  - ref: "domain://watcher-service"
    relationship: "Customer-Supplier — connects to watchers directly via HTTP for duplicity monitoring and key state queries"
    pattern: "Customer-Supplier"
    via_port: "port://local-agent/outbound/watcher-comms"
    is_cross_cutting: false

externals:
  - name: "Local Storage"
    abstraction: "Repository"
    ref: "port://local-agent/outbound/local-storage"
    implementation_notes: "LMDB (keripy) or redb (keriox) on device — Baser subdatabases for events, signatures, receipts, escrows, and credential TELs"
  - name: "Network Transport"
    abstraction: "Adapter"
    ref: "port://local-agent/outbound/witness-comms"
    implementation_notes: "HTTP/TCP for direct witness and watcher communication. No cloud agent proxy — the controller's process connects directly"

implementation_guidance:
  suggested_type: "application"
  language_affinity: "any"
  notes: >
    keripy provides the reference fat wallet via Habery/Hab pattern and kli CLI.
    keriox provides standalone mode via Controller/Identifier SDK. This domain
    represents the fat wallet deployment model where the entire KERI stack runs
    on the controller's device — the alternative to the thin wallet (signify-client)
    model that delegates hosting to a cloud agent.

issues: []

tags: ["fat-wallet", "local-agent", "hab", "habery", "kli", "standalone", "application"]
