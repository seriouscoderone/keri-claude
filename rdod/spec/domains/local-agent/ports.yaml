# ports.yaml
domain_ref: "local-agent"

ports:
  # Inbound — controller operations driven by application code or CLI
  - id: "port://local-agent/inbound/controller-operations"
    type: inbound
    name: "Controller Operations"
    semantics: command
    idempotent: false
    contract:
      input: "types://local-agent/api#Habitat"
      output: "types://identity/state#KeyState"
      errors:
        - "errors://local-agent#DatabaseOpenError"
        - "errors://local-agent/api#IdentifierNotFoundError"
        - "errors://local-agent/api#DuplicateAliasError"
    refs: []

  - id: "port://local-agent/inbound/cli-commands"
    type: inbound
    name: "CLI Commands"
    semantics: command
    idempotent: false
    contract:
      input: "CLI arguments (name, alias, config_file)"
      output: "types://identity/state#KeyState"
      errors:
        - "errors://local-agent/api#CLIConfigError"
        - "errors://local-agent/api#CLIArgumentError"
        - "errors://local-agent/api#IdentifierNotFoundError"
    refs: []

  # Outbound — local persistence repositories
  - id: "port://local-agent/outbound/event-log-repository"
    type: outbound
    name: "Event Log Repository"
    semantics: command
    idempotent: false
    description: >
      Append-only store for the controller's own key event logs and associated
      signatures. Provides key state derivation from the persisted log.
    contract:
      input: "types://identity/establishment#KeyEvent"
      output: "types://identity/state#KeyState"
      errors:
        - "errors://local-agent#DatabaseOpenError"
    refs: ["persistence"]

  - id: "port://local-agent/outbound/escrow-repository"
    type: outbound
    name: "Escrow Repository"
    semantics: command
    idempotent: false
    description: >
      Temporary holding area for events that cannot yet be fully verified
      (e.g., out-of-order events, partially-witnessed events).
    contract:
      input: "types://local-agent#EscrowedItem"
      output: "types://local-agent#EscrowedItem"
      errors: []
    refs: ["persistence"]

  - id: "port://local-agent/outbound/credential-repository"
    type: outbound
    name: "Credential Repository"
    semantics: command
    idempotent: false
    description: >
      Stores issued and received ACDC credentials and their associated
      Transaction Event Log (TEL) events for registry state tracking.
    contract:
      input: "types://cesr/primitives#SAID"
      output: "types://credential-lifecycle#Credential"
      errors: []
    refs: ["persistence"]

  # Outbound — direct witness HTTP communication
  - id: "port://local-agent/outbound/witness-comms"
    type: outbound
    name: "Witness Communication"
    semantics: command
    idempotent: false
    contract:
      input: "types://identity/establishment#KeyEvent"
      output: "types://accountability/consensus#Receipt"
      errors:
        - "errors://watcher-service/api#WitnessUnreachableError"
    refs: ["domain://witness-service"]

  # Outbound — direct watcher HTTP communication
  - id: "port://local-agent/outbound/watcher-comms"
    type: outbound
    name: "Watcher Communication"
    semantics: command
    idempotent: false
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://watcher-service#DuplicityReport"
      errors:
        - "errors://watcher-service/api#WitnessUnreachableError"
    refs: ["domain://watcher-service"]
