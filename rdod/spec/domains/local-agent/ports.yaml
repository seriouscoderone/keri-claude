# ports.yaml
domain_ref: "local-agent"

ports:
  # Inbound — controller operations driven by application code or CLI
  - id: "port://local-agent/inbound/controller-operations"
    type: inbound
    name: "Controller Operations"
    contract: >
      init(name, salt, config) -> Habery;
      incept(alias, icount, ncount, wits, toad) -> Hab + AID;
      rotate(aid, cuts, adds, toad) -> RotationEvent;
      interact(aid, seals) -> InteractionEvent;
      get_key_state(aid) -> KeyState;
      sign(aid, content) -> [Siger];
      resolve_oobi(url) -> Result;
      issue_credential(aid, registry, schema, recipient, data) -> SAID;
      revoke_credential(said, registry) -> Result;
      query_watcher(watcher, target_aid) -> KeyState
    protocol: "method-call"
    refs: []

  - id: "port://local-agent/inbound/cli-commands"
    type: inbound
    name: "CLI Commands"
    contract: >
      kli_init(name, salt, config) -> Result;
      kli_incept(name, alias, config_file) -> AID;
      kli_rotate(name, alias) -> Result;
      kli_interact(name, alias, data) -> Result;
      kli_oobi_resolve(name, oobi, alias) -> Result;
      kli_vc_issue(name, alias, registry, schema, data) -> SAID;
      kli_vc_list(name, alias) -> [Credential];
      kli_status(name, alias) -> KeyState
    protocol: "CLI"
    refs: []

  # Outbound — local persistence repositories
  - id: "port://local-agent/outbound/event-log-repository"
    type: outbound
    name: "Event Log Repository"
    description: >
      Append-only store for the controller's own key event logs and associated
      signatures. Provides key state derivation from the persisted log.
    contract: "append_event(aid: AID, event: KeyEvent, signatures: [Signature]) -> Result; get_kel(aid: AID) -> KEL; get_key_state(aid: AID) -> KeyState; store_controller_signatures(aid: AID, event_digest: Digest, signatures: [Signature]) -> Result; store_witness_receipts(aid: AID, event_digest: Digest, receipts: [Receipt]) -> Result"
    protocol: "method-call"
    refs: ["persistence"]

  - id: "port://local-agent/outbound/escrow-repository"
    type: outbound
    name: "Escrow Repository"
    description: >
      Temporary holding area for events that cannot yet be fully verified
      (e.g., out-of-order events, partially-witnessed events).
    contract: "store_escrow(aid: AID, escrow_type: EscrowType, item: EscrowedItem) -> Result; get_escrowed(aid: AID, escrow_type: EscrowType) -> [EscrowedItem]; remove_escrow(aid: AID, escrow_type: EscrowType, key: EscrowKey) -> Result"
    protocol: "method-call"
    refs: ["persistence"]

  - id: "port://local-agent/outbound/credential-repository"
    type: outbound
    name: "Credential Repository"
    description: >
      Stores issued and received ACDC credentials and their associated
      Transaction Event Log (TEL) events for registry state tracking.
    contract: "store_credential(credential_said: SAID, credential: Credential) -> Result; get_credential(credential_said: SAID) -> Credential; store_tel_event(registry_id: RegistryID, event: TELEvent) -> Result"
    protocol: "method-call"
    refs: ["persistence"]

  # Outbound — direct witness HTTP communication
  - id: "port://local-agent/outbound/witness-comms"
    type: outbound
    name: "Witness Communication"
    contract: >
      send_event(witness_url, event, sigs) -> Receipt;
      get_receipts(witness_url, aid, sn) -> [Receipt];
      query_key_state(witness_url, aid) -> KeyState
    protocol: "REST"
    refs: ["domain://witness-service"]

  # Outbound — direct watcher HTTP communication
  - id: "port://local-agent/outbound/watcher-comms"
    type: outbound
    name: "Watcher Communication"
    contract: >
      register(watcher_url, aid) -> Result;
      submit_kel(watcher_url, aid, kel) -> Result;
      query_key_state(watcher_url, aid) -> KeyState;
      get_duplicity_report(watcher_url, aid) -> DuplicityReport
    protocol: "REST"
    refs: ["domain://watcher-service"]
