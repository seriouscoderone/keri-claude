domain_ref: "local-agent"

types:
  - name: "Habitat"
    description: "The container for a single identifier's complete state — keys, event log, witness configuration, and agent context. Called Hab/Habery in keripy."
    variants:
      - name: "single"
        fields:
          - name: "name"
            type: "string"
            required: true
            description: "Human-readable identifier name (alias)"
          - name: "prefix"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The identifier (AID)"
          - name: "key_state"
            type: "types://identity#KeyState"
            required: true
            description: "Current cryptographic configuration"
          - name: "event_log"
            type: "array"
            required: true
            description: "Complete KEL for this identifier"
          - name: "config"
            type: "map"
            required: true
            description: "Configuration (witnesses, thresholds, traits)"
        invariants:
          - "name must be unique within the local agent"
          - "prefix is immutable after inception"
          - "key_state is derived from processing the event_log"
      - name: "group"
        fields:
          - name: "name"
            type: "string"
            required: true
            description: "Group identifier name"
          - name: "prefix"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Group AID"
          - name: "members"
            type: "array[types://cesr/primitives#AID]"
            required: true
            description: "Member AIDs participating in this group"
          - name: "local_member"
            type: "types://cesr/primitives#AID"
            required: true
            description: "This agent's member AID within the group"
        invariants:
          - "local_member must be in members list"
          - "Group operations require coordination with other members via exn"

  - name: "Contact"
    description: "A known remote identifier with cached key state and optional metadata."
    variants:
      - name: "default"
        fields:
          - name: "prefix"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The remote AID"
          - name: "alias"
            type: "string"
            required: false
            description: "Human-readable name for this contact"
          - name: "key_state"
            type: "types://identity#KeyState"
            required: true
            description: "Cached key state (may be stale)"
          - name: "endpoints"
            type: "array[LocationScheme]"
            required: false
            description: "Known service endpoints"
          - name: "metadata"
            type: "map"
            required: false
            description: "User-defined metadata (tags, notes, images)"
        invariants:
          - "key_state obtained via OOBI resolution or direct KEL exchange"
          - "endpoints subject to BADA acceptance policy"

  - name: "EscrowedItem"
    description: "An event or message held in escrow by the local agent pending missing dependencies."
    variants:
      - name: "default"
        fields:
          - name: "key"
            type: "string"
            required: true
            description: "Lookup key (typically prefix + sequence number)"
          - name: "payload"
            type: "bytes"
            required: true
            description: "Serialized event or message bytes"
          - name: "escrowed_at"
            type: "types://cesr/primitives#DateTime"
            required: true
            description: "When the item was placed in escrow"
        invariants:
          - "Items are periodically checked for resolution or expiry"
          - "Removed once dependencies are satisfied or timeout elapses"

  - name: "EscrowKey"
    description: "Composite key for looking up escrowed items by identifier and sequence number."
    variants:
      - name: "default"
        fields:
          - name: "prefix"
            type: "string"
            required: true
            description: "AID prefix of the escrowed event's identifier"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the escrowed event"
        invariants:
          - "(prefix, sn) uniquely identifies the escrow slot"
