# ubiquitous-language.yaml
domain_ref: "local-agent"

imports:
  - term: "AID"
    from: "domain://identity"
    usage: "Local agent manages AIDs directly"
  - term: "KEL"
    from: "domain://identity"
    usage: "Local agent stores and processes KELs"
  - term: "ACDC"
    from: "domain://credential-lifecycle"
    usage: "Local agent stores and manages credentials"

terms:
  - term: "Habitat"
    synonyms: ["Hab"]
    definition: "Controller's view of a managed AID. A Habitat represents one AID; an Identifier Repository is the set of Habitats sharing a database environment. A Habitat wraps a Key State Tracker with signing capability — the controller can both verify key state and produce signatures. The Identifier Repository owns the shared Event Database, key manager, Event Processor, and message parser."
    invariants:
      - "Each Habitat maps to exactly one AID"
      - "An Identifier Repository provides a shared Event Database, key manager, and Event Processor to all its Habitats"
      - "A Habitat combines key state verification (Key State Tracker) with the ability to sign events using the controller's private keys"
      - "A Habitat exposes the AID prefix, key state, and key manager"
      - "An Identifier Repository holds the collection of Habitats keyed by name/prefix and owns the shared Event Database"
      - "Creating a Habitat via the Identifier Repository automatically wires the shared database, key manager, and event processor"
    examples:
      - "habery = Habery(name='controller', salt=salt) → creates collection with shared Baser and Manager"
      - "hab = habery.makeHab('myaid', icount=1, ncount=1, wits=[wit1, wit2]) → inception with 2 witnesses"
      - "hab.rotate(toad=2, cuts=[old_wit], adds=[new_wit]) → key rotation with witness change"
      - "hab.interact(data=[seal]) → interaction event committing a seal"
      - "Alternatively, a Controller object creates the equivalent of an Identifier Repository; its incept method creates a new identifier"
    related_terms: ["Local Key Manager", "Local Event Processor", "Local Database", "CLI Interface"]

  - term: "Local Key Manager"
    synonyms: ["Manager", "Keeper"]
    definition: "Manages private keys entirely on the controller's device. Generates Signers (private key wrappers that produce signatures) from a Salt with configurable security tiers. No passcode-over-network — the salt lives on the local filesystem, encrypted at rest."
    invariants:
      - "Keys stored locally in encrypted form — no network dependency for key operations"
      - "Manager holds current signing keys (Signers) and pre-rotated next key digests (Digers)"
      - "Deterministic key derivation from local salt using configurable argon2 tiers"
      - "Manager.incept(icount, ncount, algo, salt, ...) → creates inception key pairs"
      - "Manager.rotate(pre, count, ...) → creates next rotation key pairs, returns old and new Signers"
      - "Manager.sign(ser, pre, ...) → produces indexed signatures (Sigers) using the current signing keys"
      - "Unlike Signify Keeper, the Local Key Manager never communicates with a remote agent — all operations are in-process"
    examples:
      - "mgr = Manager(ks=Keeper(db), salt=salter.qb64) → local key manager with on-disk key store"
      - "verfers, digers, _, _ = mgr.incept(icount=1, ncount=1) → Ed25519 keypair + next key digest"
      - "mgr.sign(ser=event.raw, pre=hab.pre) → [Indexed Signature] — indexed signature from local private key"
      - "Alternatively, a controller.incept(key_config) call handles key generation internally"
    related_terms: ["Habitat", "Local Database", "Direct Witness Communication"]

  - term: "Local Event Processor"
    synonyms: ["Kevery", "Local Kevery"]
    definition: "The full event validation pipeline running in the controller's own process. Validates incoming events against current key state, manages all escrow types locally, and emits cues for receipting and notification. Unlike in the thin wallet model where KERIA runs the Event Processor on the server, here the entire pipeline is local."
    invariants:
      - "Validates events against current key state — same rules as any Event Processor instance"
      - "Manages all escrow types locally: partial signatures, out-of-order events, unverified receipts, partially-witnessed events"
      - "Emits cues for witness receipting, delegation processing, and application notification"
      - "Operates in lax (accept all prefixes) or strict (only accept own prefix) mode"
      - "Processes events from local creation (hab.rotate, hab.interact) and from remote delivery (witness receipts, other agents' events)"
      - "processEscrows() runs periodically to resolve pending items"
    examples:
      - "kevery = Kevery(db=baser, lax=True) → promiscuous event processor for a local agent"
      - "kevery.process(serder=event, sigers=sigs, wigers=wigs) → validates and stores event"
      - "kevery.processEscrows() → attempts to resolve all pending escrow items"
      - "The event processor may be embedded in the Controller's process() pipeline"
    related_terms: ["Habitat", "Local Database", "Direct Witness Communication"]

  - term: "Local Database"
    synonyms: ["Baser", "Local Baser"]
    definition: "The local database (e.g., LMDB, redb) running on the controller's local storage. Contains all stores for events, signatures, receipts, escrows, and application state. In the fat wallet model, this is the single source of truth — no cloud-hosted copy."
    invariants:
      - "Stores include: event store (events by prefix+digest), KEL sequence index (by prefix+sn), controller signature store, witness signature store, non-transferable receipt store, unverified receipt escrow, out-of-order escrow, delegator approval store, likely duplicitous escrow"
      - "Append-only semantics for KEL events — events are never modified after acceptance"
      - "Supports indexed access by prefix, sequence number, digest, and first-seen number"
      - "Memory-mapped I/O (LMDB) requires local filesystem — incompatible with ephemeral/serverless environments"
      - "Single writer, multiple readers — LMDB locking model"
      - "The Event Database is owned by the Identifier Repository and shared across all Habitats"
    examples:
      - "db = Baser(name='controller', temp=False) → persistent LMDB database"
      - "db.getEvt(prefix, sn) → retrieve event by prefix and sequence number"
      - "db.putSigs(prefix, digest, [sig.qb64b]) → store indexed signatures"
      - "Database initialized with a path on the local filesystem"
    related_terms: ["Habitat", "Local Event Processor", "Local Credential Management"]

  - term: "Direct Witness Communication"
    synonyms: []
    definition: "The controller connects to witness HTTP endpoints directly — no KERIA proxy. The operational manifestation of indirect mode in a fat wallet. The controller sends events to each designated witness, collects receipts, and verifies the TOAD (threshold of accountable duplicity) locally."
    invariants:
      - "Controller sends events directly to each witness in the AID's witness list"
      - "Controller collects receipts (witness signatures) directly from each witness"
      - "TOAD satisfaction checked locally — the controller knows when enough receipts have arrived"
      - "Witness endpoints discovered via OOBI resolution or configuration"
      - "HTTP transport: POST event to witness URL, witness responds with receipt"
      - "No Witnesser doer or async operation queue — the controller drives the process synchronously or via local async loop"
    examples:
      - "hab.makeHab('myaid', wits=['BBil...', 'BLsk...'], toad=2) → inception with 2 witnesses, TOAD=2"
      - "kli witness submit --name controller --alias myaid → sends pending events to witnesses and collects receipts"
      - "controller.notify_witnesses(identifier) → HTTP POST to each witness endpoint"
      - "Local witness communicator: sends to each witness URL, waits for receipt, checks toad"
    related_terms: ["Habitat", "Local Event Processor", "Direct Watcher Communication"]

  - term: "Direct Watcher Communication"
    synonyms: []
    definition: "The controller connects to watcher endpoints directly for duplicity monitoring and key state queries. No cloud agent intermediary — the controller manages watcher registration, log submission, and duplicity report retrieval."
    invariants:
      - "Controller registers watchers for its own AIDs and AIDs it wants to monitor"
      - "Controller submits KELs to watchers for independent verification"
      - "Watcher duplicity reports are received via direct HTTP connection and stored in the local DEL — no cloud agent intermediary"
      - "Watchers provide an independent view of key state — a second opinion beyond witnesses"
      - "Watcher endpoints discovered via OOBI resolution or configuration"
    examples:
      - "kli watcher add --name controller --watcher-aid BWat... → registers a watcher"
      - "kli query --name controller --alias target-aid → queries watcher for key state"
      - "controller.query(watcher_oobi, target_prefix) → queries watcher for latest key state"
    related_terms: ["Habitat", "Direct Witness Communication", "Local Event Processor"]

  - term: "Local Credential Management"
    synonyms: ["Local Registry Collection", "Local Verifier", "Local Credentialer"]
    definition: "Full TEL (Transaction Event Log) processing and credential storage running locally on the controller's device. The Registry Collection manages registry TELs, the Verifier validates received credentials, and the Credentialer issues credentials — all in-process, no cloud agent needed."
    invariants:
      - "Registry TEL events (rip, upd, bup) created and stored in the local Event Database"
      - "Credential issuance authorizes ACDC SAID via the controller's KEL interaction event"
      - "Credential revocation via TEL revocation event, authorized via KEL"
      - "Received credentials validated by local Verifier against issuer's KEL and registry TEL"
      - "Credential storage in local database — no cloud wallet"
      - "IPEX exchange messages (apply, offer, agree, grant, admit, spurn) are constructed and dispatched directly from the local agent — no cloud agent intermediary for credential exchange"
    examples:
      - "Create a local Registry Collection with the Identifier Repository → local registry"
      - "Issue credential via the Registry Collection, authorize via KEL"
      - "kli vc issue --name controller --alias myaid --registry myreg --schema schema_said --data @cred.json"
      - "kli vc list --name controller --alias myaid → list credentials in local wallet"
    related_terms: ["Habitat", "Local Database", "Local Event Processor"]

  - term: "CLI Interface"
    synonyms: ["kli", "KERI Command Line"]
    definition: "Command-line tool (kli) providing a user interface to local agent operations. Covers the full lifecycle: identifier inception, rotation, interaction, credential issuance/revocation, OOBI resolution, witness management, and multi-sig coordination. The primary human interface to the fat wallet."
    invariants:
      - "kli commands map directly to Identifier Repository/Habitat/Manager operations"
      - "Configuration via --config-dir and --config-file pointing to JSON config"
      - "Each kli invocation opens the local database, performs the operation, and closes"
      - "Multi-sig workflows use kli multisig subcommands for coordinated operations"
      - "kli init creates a new Identifier Repository with salt and configuration"
      - "kli incept creates a new Habitat (AID) under the Identifier Repository"
    examples:
      - "kli init --name controller --salt 0ACDEyMzQ1Njc4OWxtbm9wcQ --nopasscode → initialize local agent"
      - "kli incept --name controller --alias myaid --file inception-config.json → create AID"
      - "kli rotate --name controller --alias myaid → rotate keys"
      - "kli oobi resolve --name controller --oobi-alias peer --oobi http://witness:5642/oobi/BWit..."
      - "kli vc issue --name controller --alias myaid --registry myreg --schema SAID --data @payload.json"
      - "kli status --name controller --alias myaid → display current key state"
    related_terms: ["Habitat", "Local Key Manager", "Local Credential Management"]

events:
  - name: "HabitatCreated"
    payload: "aid: AID, alias: string, hab_name: string, witness_count: int, toad: int"
    triggers: "Controller creates a new Habitat via the Identifier Repository or kli incept"

  - name: "KeysRotated"
    payload: "aid: AID, sn: int, new_verfers: [Verification Key], new_digers: [Digest]"
    triggers: "Controller rotates keys via hab.rotate() or kli rotate"

  - name: "InteractionSealed"
    payload: "aid: AID, sn: int, seals: [Seal]"
    triggers: "Controller creates an interaction event via hab.interact() or kli interact"

  - name: "WitnessReceiptCollected"
    payload: "aid: AID, sn: int, witness_aid: AID, receipt_dig: Digest"
    triggers: "Controller receives a witness receipt after sending an event directly"

  - name: "ToadSatisfied"
    payload: "aid: AID, sn: int, toad: int, receipts_collected: int"
    triggers: "Enough witness receipts collected to satisfy the TOAD threshold"

  - name: "EventProcessedLocally"
    payload: "aid: AID, sn: int, event_type: string, source: local | remote"
    triggers: "Local Kevery validates and accepts an event into the database"

  - name: "EscrowProcessedLocally"
    payload: "escrow_type: string, items_resolved: int"
    triggers: "Local event processor resolves pending escrow items"

  - name: "CredentialIssuedLocally"
    payload: "said: SAID, schema: SAID, recipient: AID, registry: string"
    triggers: "Local Credentialer issues a credential and authorizes it via the KEL"

  - name: "CredentialRevokedLocally"
    payload: "said: SAID, registry: string, revocation_sn: int"
    triggers: "Local Registry Collection processes a credential revocation event"

  - name: "OOBIResolvedLocally"
    payload: "aid: AID, endpoint: URL, role: string"
    triggers: "Controller resolves an OOBI directly over HTTP"

rules:
  - "Private keys live on the controller's device for the entire lifecycle — no cloud agent involved"
  - "The full KERI event processing pipeline runs locally — the controller is both producer and validator"
  - "The local Event Database is the single source of truth — there is no cloud-hosted copy"
  - "Witness and watcher communication is direct HTTP — no proxy, no intermediary agent"
  - "TOAD satisfaction is checked locally by the controller after collecting witness receipts"
  - "Credential issuance, revocation, and verification are all local operations"
  - "The Identifier Repository owns the shared database, key manager, and Event Processor — individual Habitats share these resources"
  - "Memory-mapped databases (LMDB) require a stable local filesystem — this deployment model is incompatible with ephemeral/serverless environments"
