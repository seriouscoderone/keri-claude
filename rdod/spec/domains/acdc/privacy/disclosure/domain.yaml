# domain.yaml
template_version: "1.0"
id: "acdc/privacy/disclosure"
name: "Graduated Disclosure"
description: >
  Progressive revelation of credential data — compact, partial, nested partial,
  full, selective, and chain-link confidential disclosure modes. Defines each mode
  of graduated disclosure from most private (compact) to most revealing (full),
  plus the chain-link confidentiality mechanism that gates transitions. This is
  pure protocol logic — no cryptographic computation, no privacy mechanisms —
  just the definitions and invariants of each disclosure mode and how they compose
  within the graduated disclosure framework.
version: "0.1.0"

source_material:
  - type: document
    reference: "acdc-specification.md — Compact Disclosure, Partial Disclosure, Full Disclosure, Chain-Link Confidentiality sections"
  - type: document
    reference: "acdc-specification.md — Nested Partial Disclosure, oneOf Composition for graduated disclosure variants"
  - type: implementation
    reference: "keripy — src/keri/core/coring.py (compact/expanded SAD handling), src/keri/vc/ (credential variant construction)"

ubiquitous_language:
  - term: "Disclosure Mode"
    definition: "One of the defined forms in which an ACDC block or credential may be presented — compact, partial, nested partial, full, selective, or chain-link confidential"
    invariants:
      - "Each mode reveals a specific level of information, ordered from least to most"
      - "Modes compose — graduated disclosure applies them in sequence"

domain_clients:
  - ref: "domain://acdc/privacy"
    relationship: "Parent privacy domain delegates mode definitions and taxonomy to this subdomain"
    via_port: "port://acdc/privacy/disclosure/inbound/mode-definitions"

subdomains: []

kernels: []

adjacents: []

externals: []

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    This is a leaf domain — pure protocol logic with no kernel or external dependencies.
    Implementations define the disclosure mode types and their invariants. The oneOf
    composition operator in JSON Schema enables schema validation of both compact and
    expanded variants. Chain-link confidentiality is a protocol pattern layered on top
    of partial and full disclosure modes, gating the transition via contractual acceptance.

issues: []

tags: ["disclosure-modes", "compact", "partial", "full", "selective", "chain-link-confidentiality", "oneof"]
