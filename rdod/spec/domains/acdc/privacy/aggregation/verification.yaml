# verification.yaml
domain_ref: "acdc/privacy/aggregation"

properties:
  - invariant: "AGID = digest of serialized list [AGID_placeholder, a_1, a_2, ..., a_N] where a_i is the SAID of block i"
    term: "AGID"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([said_list, agid],
          Implies(
            is_valid_agid(agid, said_list),
            agid == blake3_256(serialize([agid_placeholder] + said_list))
          )
        )
    notes: "AGID is a digest of the complete SAID list with self-referential zeroth element"

  - invariant: "Zeroth element is the AGID itself (computed via dummy character replacement)"
    term: "AGID"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([agid, said_list],
          Implies(
            is_valid_agid(agid, said_list),
            agid == replace_dummy(blake3_256(serialize([dummy_placeholder] + said_list)))
          )
        )
    notes: "Self-referential SAID protocol — dummy replaced with computed digest"

  - invariant: "Collision-resistant against birthday attacks on concatenated elements"
    term: "AGID"
    technique: smt
    formal:
      language: z3
      expression: |
        Implies(
          And(agid1 == agid2, list1 != list2),
          False  # collision should be computationally infeasible
        )
    notes: "Blake3-256 provides collision resistance; formal proof delegates to digest properties"

  - invariant: "Verification: compute block SAID, confirm in list, compute AGID from list, match A field"
    term: "Inclusion Proof"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda block, said_list, agid: (
          block_said := said_compute(block),
          block_said in said_list
          and compute_agid(said_list) == agid
        )[-1]
    strategy: "Generate blocks and SAID lists; verify inclusion proof holds for members and fails for non-members"
    notes: "Three-step verification: SAID computation, list membership, AGID recomputation"

  - invariant: "Compact SAID variant must appear as the first variant in the oneOf list"
    term: "oneOf Composition"
    technique: property-based
    formal:
      language: python
      expression: "lambda schema_oneof: schema_oneof[0].get('type') == 'string'"
    strategy: "Generate oneOf arrays with compact variant at various positions; only first-position accepted"
    notes: "Normative ordering within oneOf composition"

  - invariant: "There is one and only one most compact form SAID for any ACDC"
    term: "Most Compact Form"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda acdc: (
          compact1 := compute_most_compact_form(acdc),
          compact2 := compute_most_compact_form(acdc),
          compact1.d == compact2.d  # deterministic
        )[-1]
    strategy: "Compute most compact form multiple times for same ACDC; verify identical result"
    notes: "Determinism — the algorithm must produce a unique result"

  - invariant: "Depth-first traversal computes SAIDs bottom-up through the credential tree"
    term: "Compactor"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda acdc: (
          compactor := Compactor(acdc),
          leaves_computed_first := all(
            compactor.leaves[i].said is not None
            for i in range(len(compactor.leaves))
          ),
          leaves_computed_first
        )[-1]
    strategy: "Apply Compactor to nested ACDCs; verify leaf SAIDs computed before parent SAIDs"
    notes: "Bottom-up ordering is essential for correctness"

  - invariant: "SAD path signatures bind to specific paths — a signature on /a/score does not cover /a/name"
    term: "SAD Path Signatures"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda sig, path1, path2, sad: (
          path1 != path2
          and verify_path_sig(sig, path1, sad)
          and not verify_path_sig(sig, path2, sad)
        )
    strategy: "Sign a specific path; verify signature fails for all other paths"
    notes: "Path-specificity of signatures"

contracts:
  - port_ref: "port://acdc/privacy/aggregation/inbound/aggregation-operations"
    preconditions:
      - formal:
          language: python
          expression: "len(said_list) > 0 and all(is_valid_said(s) for s in said_list)"
        description: "SAID list must be non-empty with all valid SAIDs"
    postconditions:
      - formal:
          language: python
          expression: "is_valid_said(result) and result == compute_agid(said_list)"
        description: "compute_agid returns a valid SAID that is the digest of the serialized SAID list"
      - formal:
          language: python
          expression: |
            all(
              verify_inclusion(block, said_list, result) == (said_compute(block) in said_list)
              for block in test_blocks
            )
        description: "verify_inclusion returns true iff the block's SAID is in the list"

  - port_ref: "port://acdc/privacy/aggregation/inbound/path-signatures"
    preconditions:
      - formal:
          language: python
          expression: "is_valid_path(path) and is_valid_sad(sad) and path_exists_in(path, sad)"
        description: "Path must exist within the SAD structure"
    postconditions:
      - formal:
          language: python
          expression: "verify_path_signature(path, sad, result, signer.verfer)"
        description: "Returned signature is verifiable against the signer's public key for the given path"
