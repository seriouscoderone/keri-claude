domain_ref: "acdc/privacy"

errors:
  - name: "InvalidDisclosureFormError"
    description: "Attempted to disclose a block in an invalid form for its privacy model"
    cause: "Public blocks cannot have Partial form (no u field for blinding). Selective disclosure requires A field, not a field."
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "attempted_form"
        type: "string"
        description: "The disclosure form that was attempted (compact, partial, selective, full)"
      - field: "privacy_model"
        type: "string"
        description: "The block's privacy model (public, private, metadata)"
      - field: "reason"
        type: "string"
        description: "Why this form is invalid for this block"

  - name: "DisclosureMonotonicityViolation"
    description: "Attempted to reduce disclosure level after a higher level was already disclosed"
    cause: "Once a block is disclosed at level L, it cannot be un-disclosed to a lower level within the same exchange"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "current_level"
        type: "string"
        description: "The level already disclosed (compact < partial < selective < full)"
      - field: "attempted_level"
        type: "string"
        description: "The lower level that was attempted"

  - name: "InsufficientEntropyError"
    description: "UUID blinding factor does not have sufficient entropy for privacy"
    cause: "Private ACDC or block has u field with fewer than 128 bits of entropy — vulnerable to rainbow table attack"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "provided_entropy_bits"
        type: "integer"
        description: "Estimated entropy of the provided UUID"
      - field: "required_entropy_bits"
        type: "integer"
        description: "Minimum required: 128"

  - name: "ChainLinkConfidentialityViolation"
    description: "Full disclosure attempted before contractual agreement"
    cause: "Rules section requires chain-link confidentiality but the IPEX agree step has not been completed"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "credential_said"
        type: "string"
        description: "The credential being disclosed"
      - field: "rules_said"
        type: "string"
        description: "The rules section requiring agreement"

  - name: "AGIDVerificationError"
    description: "Disclosed attribute's SAID does not match the AGID commitment"
    cause: "The attribute SAID is not a member of the aggregate set committed by the AGID — either the attribute was tampered with or it does not belong to this credential"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "attribute_said"
        type: "string"
        description: "The SAID of the attribute that failed inclusion"
      - field: "agid"
        type: "string"
        description: "The aggregate identifier being verified against"

  - name: "MutualExclusionViolation"
    description: "ACDC contains both a (attribute) and A (aggregate) sections"
    cause: "Direct attribute disclosure (a field) and selective disclosure (A field) are mutually exclusive — both present in the same ACDC is invalid"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "credential_said"
        type: "string"
        description: "The invalid credential's SAID"
