# ports.yaml
domain_ref: "acdc/privacy"

ports:
  # Inbound — what the parent ACDC domain calls
  - id: "port://acdc/privacy/inbound/privacy-management"
    type: inbound
    name: "Privacy and Graduated Disclosure Orchestration"
    contract: "disclose(acdc, mode: DisclosureMode, options: DisclosureOptions) -> DisclosedVariant; classify(acdc) -> DisclosureMode; classify_privacy_level(acdc) -> PublicOrPrivateOrMetadata; verify_disclosure(disclosed_variant, issuer_kel) -> Result<Valid, VerificationError>; bulk_issue(acdc, count) -> [BulkInstance]"
    protocol: "method-call"
    refs: ["domain://acdc"]

  # Outbound — delegates to subdomains
  - id: "port://acdc/privacy/outbound/disclosure"
    type: outbound
    name: "Disclosure Mode Definitions"
    contract: "Delegates to port://acdc/privacy/disclosure/inbound/mode-definitions"
    protocol: "method-call"
    refs: ["domain://acdc/privacy/disclosure"]

  - id: "port://acdc/privacy/outbound/blinding"
    type: outbound
    name: "Blinded State Operations"
    contract: "Delegates to port://acdc/privacy/blinding/inbound/blinded-state"
    protocol: "method-call"
    refs: ["domain://acdc/privacy/blinding"]

  - id: "port://acdc/privacy/outbound/aggregation"
    type: outbound
    name: "Aggregation Operations"
    contract: "Delegates to port://acdc/privacy/aggregation/inbound/aggregation-operations"
    protocol: "method-call"
    refs: ["domain://acdc/privacy/aggregation"]

  # Outbound -- kernel dependency for cryptographic operations
  - id: "port://acdc/privacy/outbound/digest"
    type: outbound
    name: "Cryptographic Digest for Blinded Commitments"
    contract: "said_compute(block_with_uuid) -> SAID; generate_uuid(entropy_bits: int) -> UUID"
    protocol: "method-call"
    refs: ["kernel://cryptographic-algorithms"]
