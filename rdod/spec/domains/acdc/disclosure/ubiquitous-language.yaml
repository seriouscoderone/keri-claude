# ubiquitous-language.yaml
domain_ref: "acdc/disclosure"

terms:
  - term: "Graduated Disclosure"
    synonyms: []
    definition: "The incremental, interactive application of the principle of least disclosure — each successive disclosure reveals the minimum information needed to enable the next step in a transaction, forming a recursive loop of least-disclosure-enabled transactions."
    invariants:
      - "Each step discloses only what is needed to facilitate further disclosure"
      - "Applies recursively — a contractually protected disclosure results from recursive least disclosure"
      - "All graduated disclosure mechanisms may be used in combination"
    examples:
      - "Metadata disclosure of schema and rules, then partial disclosure of SAID, then full disclosure after contract acceptance"
      - "Compact ACDC presented first, then expanded attribute section after terms agreed"
    related_terms: ["Compact Disclosure", "Partial Disclosure", "Full Disclosure", "Selective Disclosure", "Chain-Link Confidentiality"]

  - term: "Compact Disclosure"
    synonyms: []
    definition: "Disclosure of a block's SAID only, without revealing the block's content. The SAID makes a verifiable commitment to the content for later full disclosure."
    invariants:
      - "The schema must include a oneOf composition validating both compact (string) and expanded (object) forms"
      - "The compact value is the SAID of the block in its most compact form"
      - "Top-level compact ACDC has s, a/A, e, r fields replaced by their SAIDs"
    examples:
      - "Compact attribute section: \"a\": \"EIMMcLl1w2KW2J3AD3twaESJO4u_fDFCdlMHjouojU8C\""
      - "Compact edge section: \"e\": \"EerzwLIr9Bf7V_NHwY1lkFrn9y2PgveY4-9XgOcLxUdY\""
    related_terms: ["SAID", "oneOf Composition", "Most Compact Form"]

  - term: "Partial Disclosure"
    synonyms: ["Blinded Disclosure"]
    definition: "Disclosure of a block's SAID and schema without revealing the block's content, where a UUID salty nonce in the block prevents discovery via rainbow table attacks on schema-constrained values."
    invariants:
      - "Requires both d (SAID) and u (UUID) fields in the block"
      - "Knowledge of schema + SAID is insufficient to discover content when UUID is present"
      - "Content remains blinded until the UUID is disclosed"
      - "The schema includes a oneOf composition for compact and expanded variants"
    examples:
      - "A private-attribute ACDC in compact form: attribute block hidden behind its SAID, protected by UUID"
      - "Metadata ACDC disclosing schema and rules but not attribute values"
    related_terms: ["UUID", "Blinding", "Compact Disclosure", "Private ACDC"]

  - term: "Nested Partial Disclosure"
    synonyms: []
    definition: "Partial disclosure applied to a hierarchical tree of blocks, where each nested block embeds its own SAID and UUID, allowing disclosure at different levels of nesting independently."
    invariants:
      - "Each nested block must have its own d and u fields"
      - "oneOf composition at each nesting level validates both compact and expanded forms"
      - "Disclosure of a parent block does not require disclosure of nested child blocks"
    examples:
      - "Attribute section with a grades sub-block: top-level attributes disclosed while grades remain compacted to their SAID"
    related_terms: ["Partial Disclosure", "SAID", "UUID"]

  - term: "Full Disclosure"
    synonyms: []
    definition: "Complete disclosure of a block's content without hiding any data behind SAIDs or salted SAIDs. All field values are directly visible."
    invariants:
      - "All fields in the block are expanded (not compacted)"
      - "May follow a contractual acceptance of terms from the rule section"
    examples:
      - "All attribute fields revealed: name, score, issuee AID, datetime"
    related_terms: ["Compact Disclosure", "Partial Disclosure", "Graduated Disclosure"]

  - term: "Selective Disclosure"
    synonyms: []
    definition: "Mechanism enabling disclosure of individual attributes from a set without exposing any other attributes, using blinded attribute blocks aggregated into an AGID via the A (aggregate) field."
    invariants:
      - "Uses the A field (aggregate section), not the a field (attribute section)"
      - "Each selectively disclosable block has its own d (SAID) and u (UUID) fields"
      - "Field labels within blinded blocks are also blinded — preventing label-based inference"
      - "anyOf composition at set level, oneOf per element for compact/expanded"
      - "Order of anyOf subschema elements is not correlated to actual array order"
    examples:
      - "Disclosing issuee block and score block from an aggregate without revealing the name block"
      - "Compact aggregate: \"A\": \"EN5d44fTNM0M4kmMMVrsH0HwMLRLyb6SoJEV0ogkLdXx\""
    related_terms: ["Aggregate Section", "AGID", "Blinded Attribute Block", "anyOf Composition"]

  - term: "AGID"
    synonyms: ["Aggregate ID"]
    definition: "A cryptographic digest of the serialized list of blinded attribute block SAIDs, serving as the compact value of the selectively disclosable aggregate section (A field)."
    invariants:
      - "AGID = digest of serialized list [AGID_placeholder, a_1, a_2, ..., a_N] where a_i is the SAID of block i"
      - "Zeroth element is the AGID itself (computed via dummy character replacement)"
      - "Makes a blinded commitment to all SAIDs in the list"
      - "Collision-resistant against birthday attacks on concatenated elements"
    examples:
      - "AGID as compact A field value: \"A\": \"EN5d44fTNM0M4kmMMVrsH0HwMLRLyb6SoJEV0ogkLdXx\""
      - "AGID computation: dummied list serialized, digested, dummy replaced with digest"
    related_terms: ["Selective Disclosure", "Aggregate Section", "Inclusion Proof"]

  - term: "Blinded Attribute Block"
    synonyms: []
    definition: "An individual attribute block within the aggregate section that includes a SAID (d) and UUID (u) field, making its content discoverable only upon explicit disclosure of the block details including its UUID."
    invariants:
      - "Must have d (SAID) and u (UUID) fields"
      - "All fields in a block must be disclosed together as a set"
      - "Fields within a block are not independently selectively disclosable"
      - "UUID provides sufficient entropy to prevent rainbow table discovery of content"
    examples:
      - "Score block: {\"d\": \"EC-vU...\", \"u\": \"0ABhY2...\", \"score\": 96}"
      - "Compacted to its SAID: \"EC-vU19URXX8ztfWdp_j2HHr1lJsqtGa1YHtZrg6-GMR\""
    related_terms: ["Selective Disclosure", "AGID", "UUID"]

  - term: "Chain-Link Confidentiality"
    synonyms: ["Contractually Protected Disclosure"]
    definition: "A disclosure mechanism where contractual terms (in the rule section) are agreed to before full data disclosure, creating a chain of contractual protection that propagates through successive disclosures."
    invariants:
      - "Discloser first offers metadata including schema and rules via partial disclosure"
      - "Disclosee must agree to contractual terms before receiving full disclosure"
      - "Full disclosure after contract acceptance is permissioned disclosure"
      - "Contractual obligations propagate through the disclosure chain"
    examples:
      - "Anti-assimilation clause preventing data aggregation across presentations"
      - "Metadata ACDC presented first, then full ACDC after agreement to terms of use"
    related_terms: ["Rule Section", "Ricardian Contract", "Metadata ACDC", "Graduated Disclosure"]

  - term: "Metadata ACDC"
    synonyms: []
    definition: "An ACDC variant with an empty top-level UUID u field, providing a mechanism to make cryptographic commitments to metadata (issuer, schema, edges, rules) without any correlation to the actual private ACDC."
    invariants:
      - "Top-level UUID u field is present but empty — distinguishes from private (non-empty) and public (absent)"
      - "Top-level SAID differs from the actual ACDC's SAID because UUID value differs"
      - "Attribute section a or aggregate A field may be empty or missing"
      - "Only discloser commitments attached, not issuer commitments (prevents correlation)"
    examples:
      - "Metadata ACDC used to offer terms of use before disclosing actual credential"
    related_terms: ["Chain-Link Confidentiality", "Private ACDC", "Public ACDC"]

  - term: "Private ACDC"
    synonyms: ["Confidential ACDC"]
    definition: "An ACDC with a sufficiently high-entropy top-level UUID u field, making the top-level SAID a blinded commitment that cannot be correlated to ACDC content without disclosure."
    invariants:
      - "Top-level UUID u field present with >= 128 bits cryptographic entropy"
      - "Top-level SAID provides a secure blinded commitment"
      - "Content not discoverable from SAID + schema alone"
    examples:
      - "A credential where the SAID can be committed to (signed) without revealing any content"
    related_terms: ["Public ACDC", "Metadata ACDC", "Partial Disclosure", "UUID"]

  - term: "Public ACDC"
    synonyms: ["Non-Confidential ACDC"]
    definition: "An ACDC without a top-level UUID u field, where knowledge of schema and top-level SAID may enable content discovery via rainbow table attack."
    invariants:
      - "Top-level UUID u field absent"
      - "Top-level SAID may serve as a correlation point despite non-disclosure of content"
    examples:
      - "A publicly verifiable attestation where content confidentiality is not required"
    related_terms: ["Private ACDC", "Metadata ACDC"]

  - term: "Most Compact Form"
    synonyms: []
    definition: "The canonical representation of an ACDC or block used for computing its unique SAID — computed by a depth-first algorithm that SAIDifies leaf blocks, compacts them, then SAIDifies enclosing blocks upward to the root."
    invariants:
      - "There is one and only one most compact form SAID for any ACDC"
      - "Leaf blocks are SAIDified first on their fully expanded form"
      - "Non-SAIDed sub-blocks with oneOf variants use their most fully expanded variant"
      - "The algorithm is reversible for verification: expand, verify SAID, recurse down"
    examples:
      - "Depth-first: compute leaf SAIDs, compact leaves, compute parent SAIDs, compact parents, repeat to root"
    related_terms: ["SAID", "Compact Disclosure", "oneOf Composition"]

  - term: "Inclusion Proof"
    synonyms: []
    definition: "Proof that a specific blinded attribute block is a member of the aggregated set, verified by checking that the block's SAID appears in the SAID list whose digest matches the AGID."
    invariants:
      - "Requires: disclosed block, full SAID list, compact ACDC with AGID, issuer's KEL seal"
      - "Verification: compute block SAID, confirm in list, compute AGID from list, match A field"
    examples:
      - "Proving a score block is part of a selectively disclosable credential without revealing other blocks"
    related_terms: ["AGID", "Selective Disclosure", "Blinded Attribute Block"]

  - term: "oneOf Composition"
    synonyms: []
    definition: "JSON Schema composition operator used in ACDC schemas to validate both compact (SAID-only) and expanded (full block) variants of a section or sub-block."
    invariants:
      - "Compact SAID variant must appear as the first variant in the oneOf list"
      - "Enables issuer to commit to composed schema once, covering all graduated disclosure variants"
      - "Decomposing (removing compact variant) enables validator to enforce full disclosure"
    examples:
      - "oneOf: [{type: string, description: 'Section SAID'}, {type: object, properties: {...}}]"
    related_terms: ["Schema", "Compact Disclosure", "Most Compact Form"]

  - term: "Bulk-Issued Instance Disclosure"
    synonyms: ["Bulk Issuance"]
    definition: "Issuance of multiple instances of a given ACDC, each a copy with a unique instance identifier, so that disclosure of one instance is not correlatable to another."
    invariants:
      - "Each instance has a unique blinded SAID"
      - "Issuer signs or seals the blinded SAID of each instance"
      - "Instances are not correlatable to each other via their identifiers"
    examples:
      - "Bulk-issued private ACDCs for repeated presentations to different verifiers"
    related_terms: ["Private ACDC", "Selective Disclosure", "AGID"]

  - term: "Compactor"
    synonyms: ["Compactor [keripy]"]
    definition: "Hierarchical graduated partial disclosure engine for nested field maps. Traverses the credential tree, computing SAIDs at each branch. Supports degrees of partial disclosure: full compact (SAIDs only), partial uncompaction (reveal selected branches), full expansion (all data)."
    invariants:
      - ".leaves property provides mappers at each leaf node with computed SAIDs"
      - ".partials property provides partially disclosable variants of the credential"
      - ".iscompact property indicates whether the current form has leaf-level SAIDs"
      - "Depth-first traversal computes SAIDs bottom-up through the credential tree"
    examples:
      - "Compactor applied to a credential with nested attribute and edge sections, producing compact, partial, and full variants"
      - "Checking compactor.iscompact to determine if a credential is in compact form before processing"
    related_terms: ["Most Compact Form", "Partial Disclosure", "Nested Partial Disclosure", "SAID"]

  - term: "SAD Path Signatures"
    synonyms: ["SadPathSig groups [parside]", ".spsgs/.spcgs [keripy]"]
    definition: "Signatures over specific paths within a SAD structure, enabling selective disclosure. Indexed signatures stored in .spsgs (quinkey to Siger), non-indexed in .spcgs (couple to Verfer, Cigar). Used with Pather primitives to prove specific attribute disclosures without revealing the entire credential."
    invariants:
      - "Indexed SAD path signatures (.spsgs) use quinkey indexing mapped to Siger primitives"
      - "Non-indexed SAD path signatures (.spcgs) use couple form mapping Verfer to Cigar"
      - "Each signature is bound to a specific path within the SAD tree via a Pather primitive"
      - "Enables proof of specific attribute values without disclosing the full credential"
    examples:
      - "Signing the path /a/score within a credential to prove the score value without revealing other attributes"
      - "Verifier checking a SAD path signature against the disclosed attribute and the issuer's key state"
    related_terms: ["Selective Disclosure", "Partial Disclosure", "SAID", "Most Compact Form"]

events:
  - name: "PartialDisclosurePerformed"
    payload: "acdc_said: SAID, disclosed_sections: [SectionLabel], discloser: AID, disclosee: AID"
    triggers: "Discloser reveals metadata or compact form of ACDC to initiate a graduated disclosure exchange"

  - name: "FullDisclosurePerformed"
    payload: "acdc: ACDC, variant: FullOrPartial, discloser: AID, disclosee: AID"
    triggers: "Discloser reveals expanded credential content after contractual terms are accepted"

  - name: "SelectiveDisclosurePerformed"
    payload: "acdc_said: SAID, disclosed_blocks: [BlindedBlock], agid: AGID, said_list: [SAID]"
    triggers: "Discloser reveals specific blinded attribute blocks from the aggregate while keeping others hidden"

rules:
  - "The principle of least disclosure must be followed — disclose only the minimum information needed"
  - "Contractual terms in the rule section must be agreed to before permissioned full disclosure"
  - "A metadata ACDC must not provide any correlation point to the actual private ACDC"
  - "Blinded attribute blocks must have sufficient UUID entropy (>= 128 bits) to resist rainbow table attacks"
  - "Field labels within selectively disclosable blocks are also blinded — the anyOf schema order must not correlate to array order"
  - "Proof of issuance (PoI) may be provided via the most compact form SAID and issuer's signature/seal"
  - "Proof of disclosure (PoD) may be provided by disclosing the SAD and recursively expanding nested SADs"
