# ports.yaml
domain_ref: "acdc/disclosure/modes"

ports:
  # Inbound -- what the parent disclosure domain calls
  - id: "port://acdc/disclosure/modes/inbound/mode-definitions"
    type: inbound
    name: "Disclosure Mode Definitions"
    contract: "classify_mode(acdc_variant) -> DisclosureMode; is_compact(block) -> bool; is_partial(block) -> bool; is_full(block) -> bool; is_selective(acdc) -> bool; requires_chain_link(acdc) -> bool"
    protocol: "method-call"
    refs: ["domain://acdc/disclosure"]
