# domain.yaml
template_version: "1.0"
id: "acdc/disclosure/aggregation"
name: "Disclosure Aggregation"
description: >
  The mechanics of selective disclosure via aggregate identifiers — AGID computation,
  inclusion proofs, schema composition (oneOf/anyOf), the most compact form algorithm,
  the Compactor engine, and SAD path signatures. This subdomain owns the cryptographic
  commitment structure that enables proving individual attribute membership in a set
  without revealing other members, and the algorithms for computing canonical SAIDs
  across hierarchical credential structures.
version: "0.1.0"

source_material:
  - type: document
    reference: "acdc-specification.md — Aggregate Section, AGID Computation, Inclusion Proof, Most Compact Form Algorithm sections"
  - type: document
    reference: "acdc-specification.md — oneOf/anyOf Composition, SAD Path Signatures, Selective Disclosure Verification"
  - type: implementation
    reference: "keripy — src/keri/core/coring.py (Compactor class, saidify algorithm), src/keri/vc/proving.py (aggregate computation)"
  - type: implementation
    reference: "parside — SadPathSig group parsing (spsgs/spcgs)"

ubiquitous_language:
  - term: "Aggregate Commitment"
    definition: "The cryptographic structure binding a set of blinded attribute block SAIDs into a single verifiable AGID, enabling membership proofs without full set disclosure"
    invariants:
      - "AGID is the sole compact representation of the entire selectively disclosable set"
      - "Modifying any block's SAID invalidates the AGID"

domain_clients:
  - ref: "domain://acdc/disclosure"
    relationship: "Parent disclosure domain delegates aggregate computation, inclusion proofs, compaction, and path signatures to this subdomain"
    via_port: "port://acdc/disclosure/aggregation/inbound/aggregation-operations"

subdomains: []

kernels:
  - ref: "kernel://cryptographic-algorithms"
    source: "Blake3-256 for AGID digest computation, SAID computation for most compact form algorithm"
    relationship: "Cryptographic algorithm types used for computing the AGID digest over serialized SAID lists and for the depth-first SAID computation in the most compact form algorithm"

adjacents: []

externals: []

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    The AGID computation requires serialization-kind-aware digest computation — the SAID
    list is serialized before digesting, and the zeroth element is the AGID itself (computed
    via dummy character replacement). The most compact form algorithm is a depth-first
    traversal that SAIDifies leaves first and works upward. In keripy, the Compactor class
    implements hierarchical graduated partial disclosure with .leaves, .partials, and
    .iscompact properties. SAD path signatures (SadPathSig groups) use Pather primitives
    to bind signatures to specific paths within the SAD tree. Indexed variants use quinkey
    indexing (.spsgs), non-indexed use couple form (.spcgs).

issues: []

tags: ["aggregation", "agid", "inclusion-proof", "compactor", "most-compact-form", "sad-path-signatures", "oneof", "anyof"]
