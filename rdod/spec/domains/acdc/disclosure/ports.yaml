# ports.yaml
domain_ref: "acdc/disclosure"

ports:
  # Inbound — what the parent ACDC domain calls
  - id: "port://acdc/disclosure/inbound/disclosure-management"
    type: inbound
    name: "Graduated Disclosure Orchestration"
    contract: "disclose(acdc, mode: DisclosureMode, options: DisclosureOptions) -> DisclosedVariant; classify(acdc) -> DisclosureMode; verify_disclosure(disclosed_variant, issuer_kel) -> Result<Valid, VerificationError>"
    protocol: "method-call"
    refs: ["domain://acdc"]

  # Outbound — delegates to subdomains
  - id: "port://acdc/disclosure/outbound/modes"
    type: outbound
    name: "Disclosure Mode Definitions"
    contract: "Delegates to port://acdc/disclosure/modes/inbound/mode-definitions"
    protocol: "method-call"
    refs: ["domain://acdc/disclosure/modes"]

  - id: "port://acdc/disclosure/outbound/privacy"
    type: outbound
    name: "Privacy Mechanisms"
    contract: "Delegates to port://acdc/disclosure/privacy/inbound/privacy-mechanisms"
    protocol: "method-call"
    refs: ["domain://acdc/disclosure/privacy"]

  - id: "port://acdc/disclosure/outbound/aggregation"
    type: outbound
    name: "Aggregation Operations"
    contract: "Delegates to port://acdc/disclosure/aggregation/inbound/aggregation-operations"
    protocol: "method-call"
    refs: ["domain://acdc/disclosure/aggregation"]
