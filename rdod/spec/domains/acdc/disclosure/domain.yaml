# domain.yaml
template_version: "1.0"
id: "acdc/disclosure"
name: "ACDC Disclosure Mechanisms"
description: >
  Graduated disclosure orchestration for ACDCs — coordinating progressive, incremental
  revelation of credential data following the principle of least disclosure. This domain
  orchestrates three subdomains: disclosure modes (the type taxonomy), disclosure privacy
  (ACDC privacy levels and bulk issuance), and disclosure aggregation (AGID computation,
  inclusion proofs, compaction, and path signatures).
version: "0.1.0"

source_material:
  - type: document
    reference: "acdc-specification.md — ACDC protocol specification, Disclosure Mechanisms and Exploitation Protection sections"
  - type: document
    reference: "acdc-specification.md — ACDC Variants, Aggregate Section, Attribute Section"
  - type: implementation
    reference: "keripy — Python reference implementation, vdr/ and vc/ modules"
  - type: implementation
    reference: "keriox/teliox — Rust TEL implementation"

ubiquitous_language:
  - term: "Graduated Disclosure"
    definition: "The incremental, interactive application of the principle of least disclosure — each disclosure reveals the minimum needed to facilitate further disclosure"
    invariants:
      - "Applies recursively: disclose enough to enable more disclosure"
      - "Orchestrates modes, privacy, and aggregation subdomains in combination"

domain_clients:
  - ref: "domain://acdc"
    relationship: "ACDC core domain drives disclosure mechanisms for credential presentation"
    via_port: "port://acdc/disclosure/inbound/disclosure-management"

subdomains:
  - ref: "domain://acdc/disclosure/modes"
    relationship: "Defines the disclosure type taxonomy — compact, partial, nested partial, full, selective, chain-link confidential"
  - ref: "domain://acdc/disclosure/privacy"
    relationship: "Privacy-preserving mechanisms — ACDC privacy levels (public, private, metadata), UUID blinding, bulk issuance"
  - ref: "domain://acdc/disclosure/aggregation"
    relationship: "Aggregate computation, inclusion proofs, most compact form algorithm, Compactor engine, SAD path signatures"

kernels: []

adjacents: []

externals: []

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    This is an orchestrating domain. Disclosure mode definitions live in modes/,
    privacy level classification and bulk issuance in privacy/, and aggregate
    computation, compaction, and path signatures in aggregation/. The parent
    coordinates graduated disclosure flows that compose all three subdomains.

issues: []

tags: ["disclosure", "graduated", "orchestration"]
