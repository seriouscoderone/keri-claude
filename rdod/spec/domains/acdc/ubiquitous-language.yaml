# ubiquitous-language.yaml
domain_ref: "acdc"

imports:
  - term: "SAID"
    from: "domain://cesr/primitives"
    usage: "Every ACDC has a SAID (d field) computed over its field map"
  - term: "AID"
    from: "domain://keri"
    usage: "Issuers and issuees are identified by their KERI AIDs"
  - term: "KEL"
    from: "domain://keri"
    usage: "ACDC credentials are anchored to issuer KELs for non-repudiability"

terms:
  - term: "ACDC"
    synonyms: ["Authentic Chained Data Container", "Verifiable Container", "Credential"]
    definition: "A cryptographically verifiable, schema-enforced data container bound to an issuer AID via KERI key state, supporting graduated disclosure and chainable edges forming a directed acyclic graph (DAG)."
    invariants:
      - "Required fields: [v, d, i, s] — version string, SAID, issuer AID, schema"
      - "Top-level field order when present: [v, t, d, u, i, rd, s, a, A, e, r]"
      - "All field maps use insertion-ordered serialization for reproducible round-trip encoding"
      - "The d field is the SAID computed via the most compact form algorithm"
      - "Must not have both an a field and an A field simultaneously"
    examples:
      - "A public targeted ACDC with attribute section containing issuee AID and credential data"
      - "A private ACDC with top-level UUID providing blinding entropy for partial disclosure"
    related_terms: ["SAID", "Issuer", "Issuee", "Schema", "Edge", "Rule"]

  - term: "Issuer"
    synonyms: []
    definition: "The controller of the AID in the top-level i field who creates and makes a non-repudiable commitment to the ACDC via digital signature or KEL-anchored seal."
    invariants:
      - "The i field value must be an AID with verifiable key state via KERI"
      - "Issuer commitment to the ACDC survives key rotation — binding is to key state at issuance"
      - "Only the issuer can change ACDC state (e.g., revocation) via TEL updates"
    examples:
      - "A GLEIF root AID issuing a QVI credential"
      - "An enterprise AID issuing an employee authorization credential"
    related_terms: ["AID", "Issuee", "TEL", "Key State"]

  - term: "Issuee"
    synonyms: ["Holder", "Subject", "Target"]
    definition: "The controller of the AID designated in the i field of the attribute section (a) or aggregate section (A), making the ACDC targeted to a specific entity."
    invariants:
      - "Issuee AID must be provably controllable — enables verifiable presentation"
      - "Presence of issuee i field in attribute section makes the ACDC targeted"
      - "Absence of issuee i field makes the ACDC untargeted (addressed 'to whom it may concern')"
      - "The issuee may become the issuer of a subsequent ACDC, enabling delegation chains"
    examples:
      - "A QVI organization designated as issuee of a GLEIF-issued credential"
      - "A person designated as issuee of a legal entity credential"
    related_terms: ["Issuer", "Targeted ACDC", "Untargeted ACDC", "Discloser"]

  - term: "SAD"
    synonyms: ["Self-Addressed Data"]
    definition: "A serialized field map (block) that includes a SAID field (d) whose value is the cryptographic digest of the block itself. The encapsulating block of a SAID."
    invariants:
      - "Every SAD contains a d field whose value is the SAID of the SAD"
      - "A SAD can be compacted into its SAID for graduated disclosure"
      - "Verification: compute digest of SAD, compare to embedded d field"
    examples:
      - "The full attribute section block is a SAD; its d field is its SAID"
    related_terms: ["SAID", "Field Map", "Compact Disclosure"]

  - term: "Schema"
    synonyms: ["Type"]
    definition: "A static, SAIDified JSON Schema 2020-12 document referenced by the s field that defines the structure, required fields, and composition variants of an ACDC. Follows the type-is-schema principle."
    invariants:
      - "Schema must be completely self-contained and statically fixed (immutable)"
      - "Schema $id field value must be the SAID of the schema"
      - "Dynamic schema references (non-local, mutable URIs) must not be used"
      - "Composable via oneOf operator to support compact/uncompacted variants"
      - "Schema dialect for ACDC 1.0 must be JSON Schema 2020-12"
    examples:
      - "A vLEI Legal Entity credential schema with oneOf compositions for graduated disclosure"
      - "Schema $id as bare SAID: EGGeIZ8a8FWS7a646jrVPTzlSkUPqs4reAXRZOkogZ2A"
    related_terms: ["SAID", "JSON Schema", "oneOf Composition", "Type-is-Schema"]

  - term: "Attribute Section"
    synonyms: ["Payload"]
    definition: "The a field block containing the credential's payload data — the actual attributes being attested to by the issuer. May contain issuee AID, datetime, and application-specific fields."
    invariants:
      - "Reserved field labels at all levels: d, u, i, rd, dt"
      - "May be compacted to its SAID for partial disclosure"
      - "Targeted variant includes i field (issuee AID); untargeted variant omits it"
      - "Private variant includes u field (UUID nonce); public variant omits it"
      - "Must not coexist with a non-empty A (aggregate) field"
    examples:
      - "Attribute section with issuee AID, score, and name fields"
      - "Compact form: \"a\": \"EIMMcLl1w2KW2J3AD3twaESJO4u_fDFCdlMHjouojU8C\""
    related_terms: ["Issuee", "Partial Disclosure", "Aggregate Section"]

  - term: "Aggregate Section"
    synonyms: ["Selectively Disclosable Attributes"]
    definition: "The A field providing a cryptographic aggregate (AGID) of an ordered set of blinded attribute blocks, enabling selective disclosure of individual attributes without exposing others."
    invariants:
      - "Compact value is the AGID (Aggregate ID), not a SAID"
      - "AGID = digest of serialized list [AGID_placeholder, SAID_1, ..., SAID_N]"
      - "Each blinded attribute block must have its own d (SAID) and u (UUID) fields"
      - "Must not coexist with a non-empty a (attribute) field"
      - "Field labels within blinded blocks are also blinded"
    examples:
      - "Aggregate with three selectively disclosable blocks: issuee, score, name"
      - "Compact form: \"A\": \"EN5d44fTNM0M4kmMMVrsH0HwMLRLyb6SoJEV0ogkLdXx\""
    related_terms: ["AGID", "Selective Disclosure", "Blinded Attribute Block"]

  - term: "Edge Section"
    synonyms: ["Links", "Connections"]
    definition: "The e field block containing directed edges to other ACDCs, forming a fragment of a distributed property graph. Edges reference far-node ACDCs via their SAIDs in the n (node) field."
    invariants:
      - "An edge must contain a node n field pointing to the SAID of the far-node ACDC"
      - "An edge-group must not have a node n field (distinguishes groups from edges)"
      - "Reserved edge fields in order: [d, u, n, s, o, w]"
      - "Default m-ary operator for edge-groups is AND"
      - "Default unary operator for targeted far-node ACDCs is I2I (Issuer-to-Issuee)"
    examples:
      - "Simple compact edge: \"auth\": \"EIl3MORH3dCdoFOLe71iheqcywJcnjtJtQIYPvAu6DZA\""
      - "Edge with schema constraint: n field points to far ACDC, s field constrains its schema"
    related_terms: ["Property Graph", "DAG", "Edge Operator", "Node"]

  - term: "Rule Section"
    synonyms: ["Terms of Use", "Ricardian Contract"]
    definition: "The r field block providing human and machine-readable legal language (Ricardian contract clauses) governing the use and disclosure of the ACDC's data."
    invariants:
      - "Rules are structured hierarchically as rule-groups containing rules"
      - "Each rule must have a legal language l field"
      - "Rule section is compactable to its SAID via oneOf composition"
      - "Chain-link confidentiality terms propagate through the disclosure chain"
    examples:
      - "Anti-assimilation clause limiting data correlation"
      - "Warranty disclaimer and permitted use clauses"
    related_terms: ["Chain-Link Confidentiality", "Graduated Disclosure", "Ricardian Contract"]

  - term: "Version String"
    synonyms: []
    specializes: "domain://cesr"
    definition: "The v field value providing protocol type, version, CESR genus version, serialization kind, size, and terminator in a regexable format for stream parsing."
    invariants:
      - "Must be the first field in any top-level ACDC field map"
      - "Protocol field must be ACDC"
      - "Format: PPPPMmmGggKKKKSSSS. (protocol, version, genus, kind, size, terminator)"
    examples:
      - "ACDC10JSON00011c_ — ACDC v1.0, JSON serialization"
    related_terms: ["CESR", "Serialization"]

  - term: "UUID"
    synonyms: ["Salty Nonce", "Blinding Factor"]
    definition: "The u field providing sufficient cryptographic entropy (>= 128 bits) to blind the SAID of the enclosing block against rainbow table attacks on schema-constrained field values."
    invariants:
      - "When present, makes the block's SAID a blinded commitment to its contents"
      - "Top-level u field present: private ACDC; absent: public ACDC; empty: metadata ACDC"
      - "Must have cryptographic strength >= 128 bits"
    examples:
      - "UUID field: \"u\": \"0ABhY2Rjc3BlY3dvcmtyYXcw\""
    related_terms: ["Blinding", "Private ACDC", "Partial Disclosure"]

  - term: "Compact Label"
    synonyms: []
    definition: "The convention of using one or at most two character field labels in ACDCs to minimize bandwidth for resource-constrained applications such as supply chain and IoT."
    invariants:
      - "Primary field labels must use one or two characters"
      - "A normative semantic overlay with verbose labels may be applied after verification"
    examples:
      - "d (digest/SAID), i (identifier/AID), s (schema), a (attribute), e (edge), r (rule)"
    related_terms: ["Field Map", "Serialization"]

  - term: "Field Map"
    synonyms: ["Block", "Nested Block"]
    definition: "An insertion-ordered key-value mapping (using field label and field value pairs) that forms the fundamental structural unit of an ACDC."
    invariants:
      - "Must use insertion (field creation) order for canonical serialization"
      - "Supports JSON, CBOR, MGPK, and native CESR serialization kinds"
      - "Nested field maps enable hierarchical structure"
    examples:
      - "The attribute section is a field map with labels d, u, i, and application-specific fields"
    related_terms: ["Compact Label", "Serialization", "SAD"]

  - term: "Targeted ACDC"
    synonyms: []
    definition: "An ACDC whose attribute section contains an issuee i field, binding the credential to a specific provably controllable AID as the target."
    invariants:
      - "The issuee AID must be provably controllable"
      - "May be used as a verifiable credential with entitlements or authorizations"
      - "Enables verifiable presentation by the issuee controller"
    examples:
      - "An employee authorization credential issued to a specific person's AID"
    related_terms: ["Issuee", "Untargeted ACDC", "Credential"]

  - term: "Untargeted ACDC"
    synonyms: []
    definition: "An ACDC whose attribute section lacks an issuee i field, making it an undirected attestation addressed 'to whom it may concern' — provides verifiable authorship without a specified counterparty."
    invariants:
      - "No verifiable mechanism for delegation of authority"
      - "Rules section may only provide obligations on implied counterparties"
    examples:
      - "A sensor observation published as a verifiable attestation"
      - "A supply chain measurement with proof of authorship"
    related_terms: ["Targeted ACDC", "Issuer", "Attestation"]

  - term: "Edge Operator"
    synonyms: []
    definition: "A value in the o field that controls the validation logic of edges and edge-groups. M-ary operators aggregate edge-group members; unary operators modify individual edge validity."
    invariants:
      - "M-ary operators: AND (default), OR, NAND, NOR, AVG, WAVG"
      - "Unary operators: I2I (default for targeted), NI2I (default for untargeted), DI2I, NOT"
      - "I2I requires issuer of near-node ACDC to be issuee of far-node ACDC"
    examples:
      - "Default AND: all edges in the group must be valid for the ACDC to be valid"
      - "I2I chain: each issuee becomes the issuer of the next ACDC in a delegation chain"
    related_terms: ["Edge Section", "Property Graph", "Chain of Authority"]

  - term: "Type-is-Schema"
    synonyms: []
    definition: "The ACDC design principle that no explicit type fields exist in an ACDC — the schema s field itself is the type field, providing full separation of concerns between payload data and type metadata."
    invariants:
      - "No top-level type field exists in an ACDC (the t field is message type, not data type)"
      - "The schema SAID uniquely identifies the ACDC's structural type"
      - "Compliance is enforced by comparing presented schema SAID against expected SAID"
    examples:
      - "Business logic starts by specifying the expected schema SAID, then validates the presented ACDC"
    related_terms: ["Schema", "SAID", "JSON Schema"]

  - term: "Registry SAID"
    synonyms: ["rd field"]
    definition: "The rd field referencing the SAID of a TEL registry inception event that maintains dynamic state (e.g., issuance/revocation) for the ACDC."
    invariants:
      - "When present at top-level, references the issuer's registry"
      - "May appear nested in attribute or aggregate section for graduated disclosure"
      - "Cryptographically binds the ACDC to its state registry"
    examples:
      - "rd field pointing to a revocation registry: \"rd\": \"ECOWJI9kAjpCFYJ7RenpJx2w66-GsGlhyKLO-Or3qOIQ\""
    related_terms: ["TEL", "Registry", "Revocation"]

  - term: "Discloser"
    synonyms: ["Presenter"]
    definition: "The entity that discloses (presents) ACDC information to a disclosee, following graduated disclosure mechanisms and contractual terms."
    invariants:
      - "For targeted ACDCs, typically the issuee (controller of the issuee AID)"
      - "Must provide proof of issuance (PoI) and proof of disclosure (PoD)"
    examples:
      - "An employee presenting their authorization credential to a verifier"
    related_terms: ["Disclosee", "Graduated Disclosure", "IPEX"]

  - term: "Disclosee"
    synonyms: ["Verifier", "Validator"]
    definition: "The entity receiving a disclosure (presentation) of ACDC information from a discloser, who must verify the credential against the issuer's commitment."
    invariants:
      - "Must verify both proof of issuance and proof of disclosure"
      - "Must validate schema compliance of the disclosed variant"
    examples:
      - "A website verifying a presented credential before granting access"
    related_terms: ["Discloser", "Graduated Disclosure", "IPEX"]

  - term: "Credential Serializer"
    synonyms: ["SerderACDC [keripy]", "Creder [keripy/keriox]"]
    definition: "Serializer/deserializer for ACDC credential packets. Extends Sadder with ACDC-specific field accessors: issuer (i), schema (s), attribute section (a), edge section (e), rule section (r), registry ID (ri/rd), UUID nonce (u). Validates ident=='ACDC'. Provides .issuee accessor from nested a.i field."
    invariants:
      - "Must validate that the protocol identifier is 'ACDC' on construction"
      - "Provides typed accessors for all top-level ACDC fields (i, s, a, e, r, rd, u)"
      - "The .issuee accessor extracts the i field from the nested attribute section (a.i)"
      - "Inherits SAID verification and serialization from the base SAD serializer"
    examples:
      - "Deserializing a CESR-encoded credential packet and accessing creder.issuer to get the issuer AID"
      - "Constructing a Creder from a credential dict, then verifying creder.said matches the d field"
    related_terms: ["ACDC", "SAD", "SAID", "Version String"]

  - term: "Schema Validator"
    synonyms: ["Schemer [keripy]", "CacheResolver [keripy]"]
    definition: "Validates credentials against JSON Schema (Draft 7). Schemer wraps a schema dict with SAID verification. CacheResolver caches schema SAIDs to schema content for resolution during validation. Schema SAID in 's' field must match the actual schema content."
    invariants:
      - "Schema SAID must be verified: digest of schema content must equal the $id / SAID value"
      - "CacheResolver maintains a SAID-to-schema mapping for efficient repeated lookups"
      - "Validation uses JSON Schema Draft 7 rules against the credential's attribute section"
      - "Schema must be fully self-contained — no external or dynamic references"
    examples:
      - "Schemer constructed from a schema dict, verifying that its $id matches its computed SAID"
      - "CacheResolver resolving a schema SAID during credential validation to retrieve the full schema"
    related_terms: ["Schema", "SAID", "Type-is-Schema", "JSON Schema"]

  - term: "Credential Verifier"
    synonyms: ["Verifier [keripy]"]
    definition: "Validates TEL events and credentials end-to-end. Verifies: schema match, edge chain integrity (verifyChain), TEL state, signature validity. Escrows credentials missing: registry (missing registry escrow [.mre in keripy]), chain (missing chain escrow [.mce in keripy]), schema (missing schema escrow [.mse in keripy]), signatures (missing signature escrow [.cmse in keripy]). Timeout: 3600s per escrow type."
    invariants:
      - "Performs full end-to-end verification: signatures, schema, TEL state, and edge chains"
      - "Escrows credentials that cannot yet be verified due to missing dependencies"
      - "Four escrow types: missing registry events [.mre in keripy], missing chain links [.mce in keripy], missing schema [.mse in keripy], missing signatures [.cmse in keripy]"
      - "Each escrow type has a 3600-second timeout before the escrowed credential is discarded"
    examples:
      - "Verifier receives a credential, finds registry TEL not yet available, escrows in missing registry escrow [.mre in keripy] until TEL arrives"
      - "verifyChain traverses edge section to confirm each linked ACDC satisfies its edge operator constraints"
    related_terms: ["Edge Section", "Edge Operator", "Registry SAID", "Schema Validator"]

  - term: "Credential Indexing"
    synonyms: ["Reger credential storage [keripy]"]
    definition: "Database indexes for efficient credential lookup: by issuer (issuer index [.issus in keripy]), by subject (subject index [.subjs in keripy]), by schema (schema index [.schms in keripy]), by SAID (processed credential index [.saved in keripy]). Enables filtered queries across the credential wallet."
    invariants:
      - "Issuer index [.issus in keripy] enables listing all credentials from a given issuer"
      - "Subject index [.subjs in keripy] enables listing all credentials held by a given entity"
      - "Schema index [.schms in keripy] enables listing all credentials of a given type"
      - "Processed credential index [.saved in keripy] enables direct lookup of a specific credential"
    examples:
      - "Querying the schema index [.schms in keripy] with a vLEI schema SAID to find all vLEI credentials in the wallet"
      - "Querying the issuer index [.issus in keripy] with a GLEIF AID to find all credentials issued by GLEIF"
    related_terms: ["ACDC", "Issuer", "Issuee", "Schema", "SAID"]

  - term: "Credential Artifacts"
    synonyms: ["sendCredential() [keripy]", "sendArtifacts() [keripy]", "sendRegistry() [keripy]"]
    definition: "The set of data that must be transmitted alongside a credential for verification: issuer KEL (delegation path), registry TEL (management events), credential TEL (iss/rev events), and the credential itself. All four are needed for end-to-end verification."
    invariants:
      - "Must include the issuer's KEL to verify key state at issuance time"
      - "Must include the registry TEL management events (vcp/vrt) to verify registry state"
      - "Must include the credential TEL events (iss/rev) to verify credential issuance and revocation status"
      - "Must include the credential itself (the ACDC SAD)"
    examples:
      - "Sending a credential to a verifier: first send issuer KEL, then registry TEL, then credential TEL, then credential"
      - "A credential exchange that fails because the registry TEL was not transmitted"
    related_terms: ["Registry SAID", "Issuer", "Credential Verifier"]

  - term: "ACDC Message Types"
    synonyms: ["ACDC Ilks", "ACDC Native Types"]
    definition: "The message type variants for ACDC credentials, identified by the 't' (type/ilk) field. Determines the serialization format and field structure."
    invariants:
      - "acm: ACDC field Map — the default labeled message type. Top-level field map with explicit field labels (v, t, d, u, i, s, a/A, e, r). Used for JSON, CBOR, MGPK serializations."
      - "act: ACDC fixed field with aTtribute section — CESR native format with fixed (unlabeled) field ordering. Includes the attribute section (a field)."
      - "acg: ACDC fixed field with aGgregate section — CESR native format with fixed field ordering. Includes the aggregate section (A field) instead of the attribute section. Used for selectively disclosable credentials."
      - "ace: ACDC with Extra fields — experimental variant allowing additional non-normative fields. May not be normative."
      - "sch: Schema — a JSON Schema document identified by its SAID, used for credential structure validation."
      - "If no 't' field is present, 'acm' is inferred as the default type."
    examples:
      - "t='acm': standard ACDC credential as a labeled JSON field map"
      - "t='act': CESR native ACDC with fixed-field attribute section (compact binary)"
      - "t='acg': CESR native ACDC with fixed-field aggregate section (selectively disclosable)"
    related_terms: ["ACDC", "Credential Serializer", "Schema", "CESR"]

  - term: "Credential Type Dimensions"
    definition: "Every ACDC is characterized by six orthogonal dimensions that combine to form specific credential types. These dimensions are expressed in the specification through field presence/absence in the credential field map, but represent first-class domain concepts that implementations SHOULD expose through typed construction interfaces (e.g., Builder pattern) rather than raw field manipulation."
    invariants:
      - "The six dimensions are: Privacy, Targeting, Disclosure Model, Chaining, Governance, and Registry Binding"
      - "Cannot use both Direct disclosure (a field) and Selective disclosure (A field) simultaneously"
      - "Each dimension is independent — any valid combination of dimension values produces a valid credential type"
    related_terms: ["Credential Privacy Model", "Credential Targeting Model", "Credential Disclosure Model", "Credential Chaining Model", "Credential Governance Model", "Credential Registry Binding"]

  - term: "Credential Privacy Model"
    synonyms: ["ACDC Privacy Level"]
    definition: "Determines whether credential content is cryptographically blinded. A Public credential has no content blinding — its SAID is potentially discoverable via rainbow table if the schema is known. A Private credential includes a high-entropy UUID that blinds the content. A Metadata credential includes an empty UUID placeholder for making commitments to undisclosed credentials without correlation."
    invariants:
      - "Public: top-level u field ABSENT — content is unblinded"
      - "Private: top-level u field PRESENT with >= 128 bits cryptographic entropy"
      - "Metadata: top-level u field PRESENT but EMPTY — commitment without correlation"
      - "Privacy applies recursively: any nested block (attribute section, edge, rule) can independently include a u field for block-level blinding"
    examples:
      - "Public credential: {v, d, i, s, a, ...} — no u field"
      - "Private credential: {v, d, u: '<high-entropy-uuid>', i, s, a, ...}"
      - "Metadata credential: {v, d, u: '', i, s, a, ...}"
    related_terms: ["Credential Type Dimensions", "Credential Targeting Model"]

  - term: "Credential Targeting Model"
    synonyms: ["Targeted vs Untargeted ACDC"]
    definition: "Determines whether a credential is bound to a specific holder (Issuee) or is a bearer credential. A Targeted credential includes the Issuee's AID in the attribute section, meaning only the entity controlling that AID can legitimately present it. An Untargeted credential has no Issuee binding and can be presented by anyone who possesses it."
    invariants:
      - "Targeted: Issuee AID field (i) PRESENT in the attribute section (a.i)"
      - "Untargeted: Issuee AID field ABSENT from the attribute section"
      - "Targeting is independent of privacy — a credential can be Private and Untargeted, or Public and Targeted"
    examples:
      - "Targeted: {a: {d: '...', i: '<issuee-aid>', ...}} — bound to holder"
      - "Untargeted: {a: {d: '...', dt: '...', ...}} — no i field in attributes, bearer credential"
    related_terms: ["Credential Type Dimensions", "Credential Privacy Model"]

  - term: "Credential Disclosure Model"
    synonyms: ["Direct vs Selective Disclosure"]
    definition: "Determines how credential attributes can be shared. Direct disclosure uses the attribute section (a field) containing a field map of all attributes — the holder shares the entire attribute set or a compact SAID reference. Selective disclosure uses the attribute aggregate section (A field) containing cryptographic commitments that enable proving individual attribute membership without revealing other attributes."
    invariants:
      - "Direct: lowercase a field — attribute section as field map"
      - "Selective: uppercase A field — attribute aggregate with cryptographic commitments"
      - "MUST NOT have both a and A simultaneously — mutually exclusive"
      - "Direct disclosure supports compact (SAID only) and expanded (full field map) forms"
      - "Selective disclosure uses AGID (Aggregate Identifier) for inclusion proofs"
    examples:
      - "Direct: {a: {d: '...', i: '...', score: 95}} — full attribute map"
      - "Selective: {A: '<agid>'} — aggregate commitment, individual proofs"
    related_terms: ["Credential Type Dimensions", "Graduated Disclosure"]

  - term: "Credential Chaining Model"
    synonyms: ["Standalone vs Chained ACDC"]
    definition: "Determines whether a credential links to other credentials forming a directed acyclic graph of verifiable trust. A Chained credential includes an edges section that references parent credentials by SAID, creating delegated authority chains. A Standalone credential has no edges and represents an independent assertion."
    invariants:
      - "Chained: e field PRESENT — edges section with references to other ACDCs"
      - "Standalone: e field ABSENT — no credential dependencies"
      - "Chains are directed and acyclic — no circular references"
      - "Each edge reference includes the SAID of the linked credential"
    examples:
      - "Chained: {e: {d: '...', auth: {n: '<parent-acdc-said>', ...}}} — links to authority credential"
      - "Standalone: no e field — independent credential"
    related_terms: ["Credential Type Dimensions"]

  - term: "Credential Governance Model"
    synonyms: ["Governed vs Ungoverned ACDC"]
    definition: "Determines whether a credential embeds legal or contractual terms as machine-readable Ricardian contracts. A Governed credential includes a rules section that specifies usage constraints, liability terms, or regulatory compliance requirements. An Ungoverned credential carries no embedded legal framework."
    invariants:
      - "Governed: r field PRESENT — rules section with Ricardian contract terms"
      - "Ungoverned: r field ABSENT — no embedded legal framework"
      - "Rules are themselves SAIDified — tamper-evident legal terms"
    examples:
      - "Governed: {r: {d: '...', usageDisclaimer: {...}, issuanceDisclaimer: {...}}}"
      - "Ungoverned: no r field"
    related_terms: ["Credential Type Dimensions"]

  - term: "Credential Registry Binding"
    synonyms: ["Registered vs Unregistered ACDC"]
    definition: "Determines whether a credential's lifecycle (issuance/revocation state) is tracked in a Transaction Event Log (TEL) registry. A Registered credential includes a registry SAID linking it to a TEL where its status can be verified. An Unregistered credential has no revocation mechanism."
    invariants:
      - "Registered: rd field (v2) or ri field (v1) PRESENT — linked to a TEL registry"
      - "Unregistered: registry field ABSENT — no lifecycle tracking"
      - "Registered credentials can be revoked; Unregistered cannot"
    examples:
      - "Registered: {rd: '<registry-said>'} — status checkable via TEL"
      - "Unregistered: no rd field — permanent, non-revocable"
    related_terms: ["Credential Type Dimensions", "Credential Lifecycle"]

  - term: "Credential Construction"
    synonyms: ["credential() [keripy]"]
    definition: "The domain-driven assembly of an ACDC through its type dimensions. Implementations SHOULD provide typed construction interfaces (Builder pattern, fluent API, factory methods) that make each dimension explicit rather than exposing raw field map manipulation. The builder enforces dimension constraints (e.g., mutual exclusivity of a/A), handles SAID computation, and ensures canonical field ordering."
    invariants:
      - "Construction MUST set all required fields: v (version), d (SAID), i (issuer), s (schema)"
      - "Construction MUST enforce mutual exclusivity of a and A fields"
      - "Computes SAIDs depth-first for each section (attributes, edges, rules) before the top-level SAID"
      - "When private flag is set, generates UUID nonce fields for blinding"
      - "SAID computation happens at build time — d field is a placeholder until finalized"
      - "Field ordering follows canonical spec order: [v, t, d, u, i, rd, s, a|A, e, r]"
    examples:
      - "Builder pattern: Credential.builder().private().targeted(issuee).governed(rules).build()"
      - "Factory method: Credential.publicUntargeted(issuer, schema, attributes)"
      - "credential(schema=schema_said, issuer=issuer_aid, data={'score': 96}, recipient=issuee_aid, status=registry_said)"
    related_terms: ["ACDC", "SAID", "Schema", "Attribute Section", "Edge Section", "Rule Section", "Credential Type Dimensions"]

events:
  - name: "CredentialIssued"
    payload: "acdc: ACDC, issuer_aid: AID, schema_said: SAID, registry_said: SAID?"
    triggers: "Issuer creates an ACDC, commits to its SAID via signature or KEL seal, and optionally records issuance in a TEL"

  - name: "CredentialRevoked"
    payload: "acdc_said: SAID, registry_said: SAID, issuer_aid: AID"
    triggers: "Issuer updates the TEL registry to record revocation, anchoring the state change in its KEL"

  - name: "CredentialPresented"
    payload: "acdc: ACDC, variant: DisclosureVariant, discloser_aid: AID, disclosee_aid: AID"
    triggers: "Discloser presents a credential variant to a disclosee via IPEX exchange"

  - name: "SchemaRegistered"
    payload: "schema: JSONSchema, said: SAID"
    triggers: "A new schema is published and made available for ACDC validation"

rules:
  - "The schema s field is the sole determinant of an ACDC's type — no other type field exists (type-is-schema)"
  - "All field maps must use insertion-ordered serialization for canonical encoding"
  - "ACDCs must not use dynamic, mutable, or non-local URI schema references"
  - "A signature or seal on the most compact form SAID commits to all schema-authorized variants"
  - "An ACDC must not have both a non-empty a field and a non-empty A field"
  - "Compact labels (1-2 chars) must be used for all primary field labels"
  - "Issuer commitment to an ACDC survives key rotation — bound to key state at issuance"
