# ports.yaml
domain_ref: "acdc/credential-exchange"

ports:
  # Inbound -- what the parent ACDC domain calls
  - id: "port://acdc/credential-exchange/inbound/exchange-protocol"
    type: inbound
    name: "Exchange Protocol"
    contract: "initiate_issuance(issuer_aid, issuee_aid, acdc) -> GrantMessage; initiate_presentation(discloser_aid, disclosee_aid, acdc, variant) -> OfferMessage; process_exchange(exn_message) -> ExchangeResult"
    protocol: "method-call"
    refs: ["domain://acdc"]

  # Direct Issuance port defined in child: port://acdc/credential-exchange/negotiation/inbound/direct-issuance
