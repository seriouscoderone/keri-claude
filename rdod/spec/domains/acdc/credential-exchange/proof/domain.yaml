# domain.yaml
template_version: "1.0"
id: "acdc/credential-exchange/proof"
name: "Exchange Proof"
description: >
  Proof of Issuance and Proof of Disclosure — the cryptographic evidence that a
  credential was validly issued and correctly disclosed. Covers Proof of Issuance
  (PoI), Proof of Disclosure (PoD), credential artifact bundles in grants, and
  KRAM authentication for exchange messages. This subdomain owns the cryptographic
  verification logic that the negotiation flow depends on to ensure disclosed
  credentials are authentic and unaltered.
version: "0.1.0"

source_material:
  - type: document
    reference: "acdc-specification.md — Proof of Issuance, Proof of Disclosure, and KRAM sections"
  - type: document
    reference: "KERIArchGroupIssuance.md — KRAM authentication, grant artifact bundle verification"
  - type: implementation
    reference: "keripy — src/keri/core/exchanging.py (Exchanger signature validation); src/keri/app/ipexing.py (grant artifact verification)"

ubiquitous_language:
  - term: "Exchange Proof"
    definition: "The set of cryptographic proof mechanisms that validate IPEX disclosures — encompassing proof of issuance, proof of disclosure, credential artifact integrity, and message authentication"
    invariants:
      - "Discloser must provide both Proof of Issuance (PoI) and Proof of Disclosure (PoD)"
      - "A signature on the most compact form SAID provides PoI for all schema-authorized variants"
      - "Exchange messages are authenticated via KRAM"

domain_clients:
  - ref: "domain://acdc/credential-exchange"
    relationship: "Parent credential exchange domain delegates cryptographic verification to this subdomain"
    via_port: "port://acdc/credential-exchange/proof/inbound/verify-disclosure"

subdomains: []

kernels:
  - ref: "kernel://cryptographic-algorithms"
    source: "Ed25519/ECDSA signature verification for PoI/PoD, Blake3-256 digest comparison for SAID matching"
    relationship: "Signature verification and digest comparison are kernel operations invoked at every verification step"

adjacents:
  - ref: "domain://acdc/credential-lifecycle/verification"
    relationship: "Conformist — proof delegates TEL chain validation (ACDC → TEL → KEL anchor) to lifecycle/verification. Proof checks artifact bundle completeness; verification checks chain integrity."
    pattern: "Conformist"
    via_port: "port://acdc/credential-lifecycle/verification/inbound/validate-tel-event"

externals: []

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    Verification logic is invoked by the negotiation flow at grant receipt and by the
    messaging layer during signature validation. In keripy, PoI/PoD checks are implicit
    in the grant processing path — the Exchanger validates signatures, then the handler
    verifies ACDC SAID expansion and TEL/KEL binding. The kernel dependency on
    cryptographic-algorithms covers the raw Ed25519/ECDSA verify and Blake3 digest
    operations.

issues: []

tags: ["verification", "proof-of-issuance", "proof-of-disclosure", "kram", "credential-artifacts"]
