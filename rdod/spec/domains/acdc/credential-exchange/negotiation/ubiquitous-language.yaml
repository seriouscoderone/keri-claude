# ubiquitous-language.yaml
domain_ref: "acdc/credential-exchange/negotiation"

terms:
  - term: "IPEX Message Type Pattern"
    synonyms: ["Exchange Step Structure"]
    definition: "The common structure shared by all IPEX message types. Every IPEX message is defined by five elements: (1) a sender role (Discloser or Disclosee), (2) a receiver role (the other party), (3) a payload content specific to the message type, (4) a set of valid responses (which message types may follow), and (5) a signature requirement (sender must sign for non-repudiable attribution)."
    invariants:
      - "Every IPEX message uses KERI exchange (exn) format with an '/ipex/*' route"
      - "Sender role is either Discloser (holds/issues credential) or Disclosee (requests/verifies)"
      - "Payload varies by type: schema SAIDs (apply), metadata ACDC (offer), signature on offer (agree), full ACDC + TEL + seal (grant), confirmation signature (admit), rejection (spurn)"
      - "Valid responses are constrained: apply -> offer|spurn, offer -> agree|spurn, agree -> grant|spurn, grant -> admit"
      - "All messages are signed by the sender via KRAM for secure attribution"
      - "Exception: spurn has no constrained response — it terminates the current step but not the exchange"
    examples:
      - "Apply: sender=Disclosee, receiver=Discloser, payload=schema+labels, responses=offer|spurn, sig=required"
      - "Grant: sender=Discloser, receiver=Disclosee, payload=ACDC+TEL+seal, responses=admit, sig=required"
      - "Spurn: sender=either, receiver=either, payload=rejection+spurned_said, responses=none, sig=required"
    related_terms: ["Apply", "Offer", "Agree", "Grant", "Admit", "Spurn", "Exchange Message"]

  - term: "Apply"
    synonyms: []
    definition: "An IPEX message from the Disclosee to the Discloser that defines the wanted disclosure — specifying the schema, desired attribute field labels, aggregate element labels, and a signature on the apply."
    invariants:
      - "Initiated by the Disclosee (the party requesting information)"
      - "Contains schema or its SAID defining what is wanted"
      - "May include attribute field label list and aggregate element label list"
      - "Includes signature on the apply or its SAID"
      - "Discloser may respond with offer or spurn"
    examples:
      - "Verifier sends apply requesting a credential matching a specific schema SAID"
      - "Verifier requests specific selectively disclosable attributes by label"
    related_terms: ["Offer", "Spurn", "Full Negotiation"]

  - term: "Offer"
    synonyms: []
    definition: "An IPEX message from the Discloser to the Disclosee that proposes an acceptable disclosure — presenting a metadata ACDC, partial disclosure, and the contractual terms for full disclosure."
    invariants:
      - "Initiated by the Discloser (the party proposing to share information)"
      - "Contains metadata ACDC or its SAID, schema or its SAID, partial disclosure"
      - "May include aggregate element label list"
      - "Includes signature on the offer or its SAID"
      - "Disclosee may respond with agree or spurn"
    examples:
      - "Issuer offers a metadata credential with schema and terms of use before issuance"
      - "Holder offers partial disclosure of a credential to a verifier"
    related_terms: ["Apply", "Agree", "Spurn", "Metadata ACDC", "Partial Disclosure"]

  - term: "Agree"
    synonyms: []
    definition: "An IPEX message from the Disclosee to the Discloser accepting the offered terms — providing a signature and/or anchored seal on the offer or its SAID as contractual acceptance."
    invariants:
      - "Response to an offer"
      - "Contains signature and/or anchored seal on the offer or its SAID"
      - "Constitutes non-repudiable acceptance of the contractual terms in the offer"
      - "Discloser may respond with grant or spurn"
    examples:
      - "Issuee agrees to the terms of a credential offer, accepting contractual obligations"
      - "Verifier agrees to chain-link confidentiality terms before receiving full disclosure"
    related_terms: ["Offer", "Grant", "Spurn", "Chain-Link Confidentiality"]

  - term: "Grant"
    synonyms: []
    definition: "An IPEX message from the Discloser to the Disclosee that provides the actual full or selective disclosure of the ACDC, fulfilling the agreed-upon offer."
    invariants:
      - "Contains the ACDC in full or selective disclosure variant"
      - "Includes discloser's signature on the grant or its SAID"
      - "May be sent directly without prior negotiation (direct issuance shortcut)"
      - "Disclosee must respond with admit to confirm receipt"
    examples:
      - "Issuer grants a fully disclosed credential to the issuee after agreement"
      - "Direct issuance: issuer sends grant without prior apply/offer/agree negotiation"
    related_terms: ["Agree", "Admit", "Full Disclosure", "Selective Disclosure", "Direct Issuance"]

  - term: "Admit"
    synonyms: []
    definition: "An IPEX message from the Disclosee to the Discloser confirming receipt of the grant disclosure — providing a signature and/or anchored seal on the grant or its SAID."
    invariants:
      - "Response to a grant"
      - "Contains signature and/or anchored seal on the grant or its SAID"
      - "Constitutes non-repudiable confirmation of receipt"
    examples:
      - "Issuee admits receipt of an issued credential"
      - "Verifier admits receipt of a presented credential"
    related_terms: ["Grant", "Direct Issuance"]

  - term: "Spurn"
    synonyms: ["Reject"]
    definition: "An IPEX message rejecting the preceding message in the exchange — may be sent by either party in response to apply, offer, or agree."
    invariants:
      - "Can reject: apply (by discloser), offer (by disclosee), agree (by discloser)"
      - "Terminates the current negotiation step"
      - "Does not terminate the entire exchange — parties may restart negotiation"
    examples:
      - "Discloser spurns an apply because the requested schema is not available"
      - "Disclosee spurns an offer because the terms of use are unacceptable"
    related_terms: ["Apply", "Offer", "Agree"]

  - term: "Direct Issuance"
    synonyms: ["Grant-Admit Shortcut"]
    definition: "A simplified IPEX flow where the Discloser sends a grant directly to the Disclosee without prior negotiation (apply/offer/agree), and the Disclosee confirms with admit."
    invariants:
      - "Flow: grant -> admit (two messages only)"
      - "Appropriate when terms are pre-agreed or no negotiation is needed"
      - "The grant contains the full or selective disclosure ACDC"
    examples:
      - "An issuer directly granting a credential to a known issuee without negotiation"
    related_terms: ["Grant", "Admit", "Full Negotiation"]

  - term: "Full Negotiation"
    synonyms: []
    definition: "The complete IPEX exchange flow with all negotiation steps: the Disclosee applies, the Discloser offers, the Disclosee agrees, the Discloser grants, and the Disclosee admits."
    invariants:
      - "Flow: apply -> offer -> agree -> grant -> admit"
      - "Any step may be spurned, terminating that negotiation step"
      - "Supports contractually protected disclosure via chain-link confidentiality"
    examples:
      - "Verifier applies for a specific credential, holder offers with terms, verifier agrees, holder grants, verifier admits"
    related_terms: ["Direct Issuance", "Apply", "Offer", "Agree", "Grant", "Admit"]

  - term: "Bespoke Issued ACDC"
    synonyms: ["Disclosure-Specific ACDC"]
    definition: "An ACDC issued specifically for a particular disclosure context, where the discloser is the issuer and the disclosee is the issuee, with context-specific rules and edges referencing other ACDCs."
    invariants:
      - "Issuer is the discloser, issuee is the disclosee"
      - "Rules section includes context-specific anti-assimilation clauses"
      - "Edges reference source ACDCs that provide the underlying authority or data"
      - "Enables rich presentations combining multiple source ACDCs"
    examples:
      - "Admission ACDC: issuer/discloser creates a one-time credential referencing a coupon ACDC for restaurant admittance"
    related_terms: ["Chain-Link Confidentiality", "Edge Section", "Rule Section"]

  - term: "Exchange Message"
    synonyms: ["exn message", "exn"]
    definition: "A KERI exchange message with a route (r) field value specifying the IPEX protocol step. The container for all IPEX protocol communications."
    invariants:
      - "Uses KERI exn message type"
      - "Route r field value must be one of the IPEX routes: apply, offer, agree, grant, admit, spurn"
      - "Signed by the sender for secure attribution via KRAM"
      - "May include attached SAIDs, schemas, ACDCs, or signatures depending on the route"
    examples:
      - "An exn message with route '/ipex/grant' containing a full disclosure ACDC"
    related_terms: ["Exchanger", "IPEX Message Construction"]

  - term: "Exchanger"
    synonyms: ["Exchanger [keripy]"]
    specializes: "domain://keri"
    definition: "Generic exchange message (EXN) processor that routes messages by their route field to registered handlers. IPEX handlers are registered under '/ipex/*' routes. The Exchanger validates signatures, dispatches to the appropriate handler, and manages exchange escrows for partially-complete exchanges."
    invariants:
      - "Routes incoming EXN messages to the handler registered for the message's route field"
      - "Validates message signatures before dispatching to handlers"
      - "Manages exchange escrows for messages awaiting prerequisites"
    examples:
      - "Exchanger receiving an EXN with route '/ipex/grant' and dispatching it to the registered IPEX grant handler"
    related_terms: ["Exchange Message", "IPEX Message Construction"]

  - term: "IPEX Handler"
    synonyms: ["IpexHandler [keripy]"]
    definition: "Route-specific message processor for '/ipex/*' exchange routes. Registers handlers for each IPEX message type (apply, offer, agree, grant, admit, spurn). Methods: verify() for route-specific signature validation, handle() for processing, response() for looking up a response to a given message."
    invariants:
      - "Each IPEX message type (apply, offer, agree, grant, admit, spurn) has its own handler"
      - "verify() performs route-specific signature validation before processing"
      - "handle() processes the validated IPEX message and updates exchange state"
      - "response() looks up the response message for a given inbound message SAID"
    examples:
      - "IpexHandler for '/ipex/grant' verifying the discloser's signature, then storing the granted credential"
      - "IpexHandler.response() returning the admit SAID that was sent in reply to a specific grant"
    related_terms: ["Exchanger", "Exchange Message", "IPEX Message Construction"]

  - term: "IPEX Message Construction"
    synonyms: ["ipexApplyExn() [keripy]", "ipexOfferExn() [keripy]", "ipexAgreeExn() [keripy]", "ipexGrantExn() [keripy]", "ipexAdmitExn() [keripy]", "ipexSpurnExn() [keripy]"]
    definition: "Module-level functions that build IPEX exchange messages (EXN type). Each function takes the sending Hab, recipient, message text, and message-type-specific data. Grant includes the full credential (ACDC), issuance TEL event, and anchor seal. Admit references the grant by SAID."
    invariants:
      - "Each function produces a complete EXN message with the appropriate '/ipex/*' route"
      - "All functions require the sending Hab (identifier context) and recipient AID"
      - "ipexGrantExn() bundles the ACDC, issuance TEL event (iss/bis), and KEL anchor seal"
      - "ipexAdmitExn() references the grant message by its SAID"
      - "ipexSpurnExn() references the rejected message by its SAID"
    examples:
      - "ipexGrantExn(hab, recp, message, acdc, iss, anc) building a grant with full credential artifacts"
      - "ipexAdmitExn(hab, recp, message, grant_said) building an admit referencing the grant"
    related_terms: ["IPEX Handler", "Exchange Message", "Exchanger"]

events:
  - name: "ExchangeInitiated"
    payload: "route: Route, initiator_aid: AID, recipient_aid: AID, content_said: SAID"
    triggers: "Either party initiates an IPEX exchange by sending an apply (disclosee) or offer (discloser)"

  - name: "OfferAccepted"
    payload: "offer_said: SAID, disclosee_aid: AID, agreement_signature: Signature"
    triggers: "Disclosee sends agree message accepting the contractual terms of the offer"

  - name: "DisclosureGranted"
    payload: "acdc: ACDC, variant: DisclosureVariant, discloser_aid: AID, grant_said: SAID"
    triggers: "Discloser sends grant message with the disclosed ACDC variant"

  - name: "DisclosureAdmitted"
    payload: "grant_said: SAID, disclosee_aid: AID, admit_signature: Signature"
    triggers: "Disclosee sends admit message confirming receipt of the granted disclosure"

  - name: "ExchangeSpurned"
    payload: "spurned_message_said: SAID, spurning_aid: AID, reason: string?"
    triggers: "Either party rejects a step in the negotiation via spurn message"

rules:
  - "The difference between issuance and presentation is the information disclosed, not the protocol"
  - "Contractual terms in the rule section must be agreed to (via agree) before permissioned full disclosure (via grant)"
  - "Direct issuance (grant -> admit) may be used when negotiation is not required"
  - "Spurn terminates the current negotiation step but does not prevent restarting the exchange"
  - "Each negotiation step produces a non-repudiable signature binding the party to that step"
  - "All IPEX messages must use KERI exchange (exn) message format with the appropriate '/ipex/*' route"
  - "Messages awaiting prerequisites are escrowed, not rejected — they are reprocessed when the blocking condition resolves"
