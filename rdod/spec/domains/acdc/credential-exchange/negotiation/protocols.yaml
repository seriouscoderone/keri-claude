domain_ref: "acdc/credential-exchange/negotiation"

protocols:
  - name: "DirectGrant"
    description: "Simplest credential exchange — issuer or holder directly grants a credential to a recipient without negotiation. Two messages: grant + admit."
    participants:
      - domain: "domain://acdc/credential-exchange/negotiation"
        role: "Constructs and validates IPEX grant/admit messages"
      - domain: "domain://acdc/credential-lifecycle/status"
        role: "Verifies credential is validly issued"
      - domain: "domain://acdc/credential-lifecycle/verification"
        role: "Verifies the ACDC → TEL → KEL chain"
    trigger: "Holder/issuer decides to share a credential with a specific verifier"
    steps:
      - seq: 1
        domain: "domain://acdc/credential-exchange/negotiation"
        action: "construct_grant"
        port: "port://acdc/credential-exchange/negotiation/inbound/direct-issuance"
        input:
          description: "Credential SAID, recipient AID, embedded ACDC + TEL event + KEL seal"
          types:
            - ref: "types://acdc/credential-lifecycle#IssuanceEvent"
        output:
          description: "exn with route=/ipex/grant containing credential bundle"
        preconditions:
          - "verification://acdc/credential-exchange/negotiation#IPEX Message Construction"
      - seq: 2
        domain: "domain://acdc/credential-lifecycle/verification"
        action: "verify_credential_chain"
        port: "port://acdc/credential-lifecycle/verification/inbound/validate-tel-event"
        input:
          description: "ACDC → TEL → KEL anchor verification"
        output:
          description: "Credential chain validated"
        depends_on: [1]
        on_failure:
          - error: "MissingKELAnchorError"
            ref: "errors://acdc/credential-lifecycle/verification#MissingIssuerError"
            action: "escrow"
            compensation: "Await issuer's KEL events"
      - seq: 3
        domain: "domain://acdc/credential-exchange/negotiation"
        action: "recipient_admits"
        port: "port://acdc/credential-exchange/negotiation/inbound/direct-issuance"
        input:
          description: "Recipient verifies credential, sends admit acknowledgment"
        output:
          description: "exn with route=/ipex/admit referencing grant SAID"
        depends_on: [2]
        preconditions:
          - "verification://acdc/credential-exchange/negotiation#IPEX Message Type Pattern"
    timeout: "No protocol-level timeout — grant can be admitted at any time"
    terminal_states:
      success: "Recipient has verified credential in their store, admit sent to grantor"
      failure: "Credential chain fails verification — grant rejected"

  - name: "NegotiatedIssuance"
    description: "Full IPEX negotiation flow for credential issuance. Holder requests, issuer offers, holder agrees, issuer grants, holder admits. Five-step flow with chain-link confidentiality option."
    participants:
      - domain: "domain://acdc/credential-exchange/negotiation"
        role: "Manages the IPEX state machine across all steps"
      - domain: "domain://acdc/credential-lifecycle/status"
        role: "Issues the credential in the TEL"
      - domain: "domain://acdc/privacy"
        role: "Optional chain-link confidentiality gating between offer and agree"
    trigger: "Prospective holder applies for a credential from an issuer"
    steps:
      - seq: 1
        domain: "domain://acdc/credential-exchange/negotiation"
        action: "apply"
        port: "port://acdc/credential-exchange/negotiation/inbound/negotiate"
        input:
          description: "Schema SAID, issuer AID, requested attributes"
        output:
          description: "exn with route=/ipex/apply — request for credential"
        preconditions:
          - "verification://acdc/credential-exchange/negotiation#IPEX Message Type Pattern"
      - seq: 2
        domain: "domain://acdc/credential-exchange/negotiation"
        action: "offer"
        port: "port://acdc/credential-exchange/negotiation/inbound/negotiate"
        input:
          description: "Issuer reviews application, constructs credential offer (may be metadata ACDC for chain-link confidentiality)"
        output:
          description: "exn with route=/ipex/offer referencing apply SAID"
        depends_on: [1]
        on_failure:
          - error: "InvalidExchangeMessageError"
            ref: "errors://acdc/credential-exchange/negotiation#ValidationError"
            action: "abort"
      - seq: 3
        domain: "domain://acdc/credential-exchange/negotiation"
        action: "agree"
        port: "port://acdc/credential-exchange/negotiation/inbound/negotiate"
        input:
          description: "Holder reviews offer, agrees to terms (if chain-link: agrees to contractual terms before seeing full credential)"
        output:
          description: "exn with route=/ipex/agree referencing offer SAID"
        depends_on: [2]
        preconditions:
          - "verification://acdc/credential-exchange/negotiation#Full Negotiation"
      - seq: 4
        domain: "domain://acdc/credential-lifecycle/status"
        action: "issue_credential"
        port: "port://acdc/credential-lifecycle/status/inbound/state-query"
        input:
          description: "Issuer creates ACDC and TEL issuance event"
          types:
            - ref: "types://acdc/credential-lifecycle#IssuanceEvent"
        output:
          description: "Issued credential with TEL entry"
          type: "types://acdc/credential-lifecycle#CredentialState"
        depends_on: [3]
      - seq: 5
        domain: "domain://acdc/credential-exchange/negotiation"
        action: "grant"
        port: "port://acdc/credential-exchange/negotiation/inbound/negotiate"
        input:
          description: "Issued credential + TEL event + KEL seal"
          types:
            - ref: "types://acdc/credential-lifecycle#IssuanceEvent"
        output:
          description: "exn with route=/ipex/grant with full credential bundle"
        depends_on: [4]
        preconditions:
          - "verification://acdc/credential-exchange/negotiation#IPEX Message Construction"
      - seq: 6
        domain: "domain://acdc/credential-exchange/negotiation"
        action: "admit"
        port: "port://acdc/credential-exchange/negotiation/inbound/negotiate"
        input:
          description: "Holder verifies credential chain, admits the grant"
        output:
          description: "exn with route=/ipex/admit referencing grant SAID"
        depends_on: [5]
    timeout: "No protocol-level timeout — each step awaits the counterparty"
    compensation: "Any party can spurn at any step (exn route=/ipex/spurn) — terminates the negotiation"
    terminal_states:
      success: "Credential issued, granted, and admitted — both parties have the credential"
      failure: "Negotiation spurned at any step — no credential issued"
