# domain.yaml
template_version: "1.0"
id: "acdc"
name: "ACDC Credential Protocol"
description: >
  How you prove what's true about you — cryptographically authentic credentials
  with lifecycle management, secure exchange, and privacy-preserving disclosure.
  ACDCs provide granular provenanced proof-of-authorship via a directed acyclic
  graph (DAG) of linked containers, graduated disclosure mechanisms, Ricardian
  contract rule sections, and schema-enforced structure. ACDCs leverage KERI
  identifiers for issuer authentication and CESR encoding for serialization.
version: "0.1.0"

source_material:
  - type: document
    reference: "acdc-specification.md — ACDC protocol specification v1.0 (ToIP/IETF)"
  - type: document
    reference: "vlei-llm-doc.md — vLEI ecosystem documentation"
  - type: document
    reference: "KERIArchGroupIssuance.md — KERI architectures for group issuance"
  - type: document
    reference: "keripy — Python reference implementation, vdr/ and vc/ modules"
  - type: document
    reference: "keriox/teliox — Rust TEL implementation"

ubiquitous_language:
  - term: "ACDC"
    definition: "Authentic Chained Data Container — a cryptographically verifiable data container bound to an issuer AID, with schema-enforced structure and chainable edges"
    invariants:
      - "Must contain required fields [v, d, i, s] in canonical insertion order"
      - "Top-level field order when present: [v, t, d, u, i, rd, s, a, A, e, r]"
      - "The d field is the SAID of the ACDC in its most compact form"

  - term: "Issuer"
    definition: "The controller of the AID in the i field who creates and commits to the ACDC via a signature or KEL-anchored seal"
    invariants:
      - "Issuer AID must have verifiable key state via KERI"
      - "Issuer commitment survives key rotation — binding is to key state at issuance time"

  - term: "Issuee"
    definition: "The controller of the AID designated in the i field of the attribute section, making the ACDC a targeted credential"
    invariants:
      - "Issuee AID must be provably controllable"
      - "Presence of issuee makes the ACDC targeted; absence makes it untargeted"

domain_clients: []

subdomains:
  - ref: "domain://acdc/credential-lifecycle"
    relationship: "ACDC drives credential lifecycle for tracking credential state (issuance, revocation) via transaction event logs"
    via_port: "port://acdc/credential-lifecycle/inbound/state-management"
  - ref: "domain://acdc/credential-exchange"
    relationship: "ACDC drives the issuance and presentation exchange protocol for credential negotiation and delivery"
    via_port: "port://acdc/credential-exchange/inbound/exchange-protocol"
  - ref: "domain://acdc/privacy"
    relationship: "ACDC drives privacy mechanisms for graduated, selective, partial, and full disclosure of credential content"
    via_port: "port://acdc/privacy/inbound/privacy-management"

kernels:
  - ref: "kernel://cryptographic-algorithms"
    source: "Blake3-256/Blake2b-256/SHA-256 (digests for SAIDs), Ed25519 (signing)"
    relationship: "Cryptographic digest and signature types appear directly in ACDC field values — qualified via CESR encoding"

adjacents:
  - ref: "domain://keri"
    relationship: "Partnership — ACDC credentials anchor to KERI identifiers for issuer/issuee authentication; credential state is sealed in the issuer's KEL"
    via_port: "port://keri/inbound/identifier-lifecycle"
    is_cross_cutting: false
  - ref: "domain://cesr"
    relationship: "OHS + Published Language — ACDCs are encoded in CESR format (JSON, CBOR, MGPK, or native CESR); all SAIDs use CESR-qualified digests"
    via_port: "port://cesr/inbound/encoding"
    is_cross_cutting: false

externals:
  - name: "Credential Persistence"
    abstraction: "Repository"
    ref: "port://acdc/outbound/credential-store"
    implementation_notes: "Store for issued ACDCs, their schemas, and associated metadata. Implementations: LMDB (keripy), redb (keriox), DynamoDB (serious-keri)"

implementation_guidance:
  suggested_type: "package"
  language_affinity: "any"
  notes: >
    Reference implementation is in keripy (Python) within the viring and credentialing modules.
    Production implementations exist in Rust (keriox) and TypeScript (signify-ts for edge signing).
    All implementations must use CESR encoding, insertion-ordered field maps, and JSON Schema
    2020-12 for schema validation. The type-is-schema principle means no explicit type fields —
    the schema SAID in the s field defines the ACDC's type.

    Credential Type Dimensions: Every ACDC is characterized by six orthogonal dimensions (Privacy,
    Targeting, Disclosure Model, Chaining, Governance, Registry Binding) expressed through field
    presence/absence. Implementations SHOULD provide typed builders that make these dimensions
    explicit rather than exposing raw field map manipulation.

issues: []

published_language:
  - term: "ACDC"
    description: "Authentic Chained Data Container — the credential type used across exchange, lifecycle, and privacy domains"
  - term: "Credential Type Dimensions"
    description: "Six orthogonal credential classification dimensions — referenced by all ACDC subdomains"
  - term: "Issuee"
    description: "Credential recipient AID — referenced in exchange and privacy domains"
  - term: "Issuer"
    description: "Credential creator AID — referenced in lifecycle, exchange, and privacy domains"

tags: ["credential", "verifiable", "chained", "disclosure", "authentic-data"]
