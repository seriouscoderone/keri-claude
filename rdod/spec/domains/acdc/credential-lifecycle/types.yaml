domain_ref: "acdc/credential-lifecycle"

types:
  - name: "RegistryInceptionEvent"
    description: "Creates a new credential registry. All credentials issued under this registry reference its REGID."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["vcp"]
            description: "Message type — registry inception"
          - name: "d"
            type: "string"
            required: true
            description: "SAID — becomes the REGID"
          - name: "i"
            type: "string"
            required: true
            description: "Registry identifier — computed as SAID (same as d)"
          - name: "ii"
            type: "string"
            required: true
            description: "Issuer AID — the identifier that owns this registry"
          - name: "s"
            type: "string"
            required: true
            constraints:
              enum: ["0"]
            description: "Sequence number — always '0' for inception"
          - name: "c"
            type: "array[string]"
            required: true
            description: "Configuration — registry traits (e.g., NB for no backers)"
          - name: "bt"
            type: "string"
            required: true
            description: "Backer threshold"
          - name: "b"
            type: "array[string]"
            required: true
            description: "Backer AIDs"
          - name: "n"
            type: "string"
            required: true
            description: "Nonce — for privacy"
        invariants:
          - "d and i are both computed as SAID"
          - "ii must reference an AID with established key state"
          - "Must be anchored in the issuer's KEL via a seal"

  - name: "IssuanceEvent"
    description: "Records the issuance of a credential in the TEL."
    variants:
      - name: "backerless"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["iss"]
            description: "Message type — backerless issuance"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "Credential SAID — the ACDC being issued"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number"
          - name: "ri"
            type: "string"
            required: true
            description: "Registry SAID (REGID)"
          - name: "dt"
            type: "string"
            required: true
            description: "Issuance datetime — ISO 8601"
        invariants:
          - "Registry ri must exist and be owned by the issuer"
          - "Credential i must not already be issued in this registry"
          - "Must be anchored in the issuer's KEL"
      - name: "backed"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["bis"]
            description: "Message type — backed issuance"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "Credential SAID"
          - name: "ii"
            type: "string"
            required: true
            description: "Issuer AID"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number"
          - name: "ra"
            type: "map"
            required: true
            description: "Registry anchor — seal linking to the registry"
          - name: "dt"
            type: "string"
            required: true
            description: "Issuance datetime"
        invariants:
          - "Requires backer signatures meeting the registry's backer threshold"

  - name: "RevocationEvent"
    description: "Records the revocation of a previously issued credential."
    variants:
      - name: "backerless"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["rev"]
            description: "Message type — backerless revocation"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "Credential SAID being revoked"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number — must follow the issuance event"
          - name: "ri"
            type: "string"
            required: true
            description: "Registry SAID"
          - name: "p"
            type: "string"
            required: true
            description: "Prior TEL event SAID"
          - name: "dt"
            type: "string"
            required: true
            description: "Revocation datetime"
        invariants:
          - "Credential must be in Issued state — cannot revoke NotIssued or already Revoked"
          - "Prior p must reference the issuance event's SAID"
          - "Must be anchored in the issuer's KEL"
      - name: "backed"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["brv"]
            description: "Message type — backed revocation"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "Credential SAID"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number"
          - name: "p"
            type: "string"
            required: true
            description: "Prior TEL event SAID"
          - name: "ra"
            type: "map"
            required: true
            description: "Registry anchor"
          - name: "dt"
            type: "string"
            required: true
            description: "Revocation datetime"
        invariants:
          - "Requires backer signatures"

  - name: "CredentialState"
    description: "The state machine for a credential's lifecycle within a registry."
    variants:
      - name: "default"
        fields:
          - name: "state"
            type: "string"
            required: true
            description: "Current lifecycle state"
            constraints:
              enum: ["NotIssued", "Issued", "Revoked"]
          - name: "credential_said"
            type: "string"
            required: true
            description: "The ACDC SAID"
          - name: "registry_said"
            type: "string"
            required: true
            description: "The REGID"
          - name: "sn"
            type: "integer"
            required: true
            description: "TEL sequence number of the latest state-changing event"
          - name: "issued_at"
            type: "string"
            required: false
            description: "ISO 8601 datetime of issuance (absent if NotIssued)"
          - name: "revoked_at"
            type: "string"
            required: false
            description: "ISO 8601 datetime of revocation (absent if not Revoked)"
        invariants:
          - "State transitions: NotIssued → Issued (via iss/bis) → Revoked (via rev/brv)"
          - "No reverse transitions — Revoked is terminal"
          - "Cannot skip states — must issue before revoking"
