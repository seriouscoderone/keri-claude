# ports.yaml
domain_ref: "acdc/credential-lifecycle"

ports:
  # Inbound — what the parent domain calls
  - id: "port://acdc/credential-lifecycle/inbound/state-management"
    type: inbound
    name: "Credential State Management"
    contract: "create_registry(issuer_aid) -> REGID; issue(regid, acdc_said) -> UpdateEvent; revoke(regid, acdc_said) -> UpdateEvent; get_state(regid, acdc_said) -> CredentialState; get_tel(regid) -> TEL"
    protocol: "method-call"
    refs: ["domain://acdc"]

  - id: "port://acdc/credential-lifecycle/inbound/blinded-state"
    type: inbound
    name: "Blinded State Management"
    contract: "create_blinded_update(regid, acdc_said, state, shared_salt, sn) -> BlindableUpdateEvent; unblind_state(blid, shared_salt, sn, possible_states) -> CredentialState; update_blind(regid, sn) -> BlindableUpdateEvent"
    protocol: "method-call"
    refs: ["domain://acdc"]
    delegates_to: "domain://acdc/privacy/blinding via port://acdc/privacy/blinding/inbound/blinded-state"

  # Outbound — what credential-lifecycle calls (delegated to subdomains)
  - id: "port://acdc/credential-lifecycle/outbound/kel-sealing"
    type: outbound
    name: "KEL Sealing"
    contract: "anchor_tel_seal(issuer_aid, event_sn, event_said) -> InteractionEvent; verify_tel_seal(issuer_aid, key_event_sn, seal) -> Result<Valid, SealError>"
    protocol: "method-call"
    refs: ["domain://keri"]

  - id: "port://acdc/credential-lifecycle/outbound/tel-storage"
    type: outbound
    name: "TEL Storage Schema"
    contract: "put_tvts(key: dgKey, val: bytes) -> bool; get_tvts(key: dgKey) -> bytes?; put_tels(key: snKey, val: bytes) -> bool; get_tels(key: snKey) -> [bytes]; append_tibs(key: dgKey, sigs: [Siger]) -> bool; get_tibs(key: dgKey) -> [Siger]; put_baks(key: REGID, val: [AID]) -> bool; get_baks(key: REGID) -> [AID]; put_ancs(key: dgKey, val: Seal) -> bool; get_ancs(key: dgKey) -> Seal?; put_tets(key: dgKey, val: Dater) -> bool; get_tets(key: dgKey) -> Dater?"
    protocol: "method-call"
    refs: ["persistence"]
    notes: "Subdatabase schema: .tvts (TEL event bytes, dgKey, append-only), .tels (sequence index, snKey), .tibs (backer sigs, dgKey, IoSet), .baks (backer list, REGID), .ancs (anchor seals, dgKey), .tets (timestamps, dgKey, immutable)"

  - id: "port://acdc/credential-lifecycle/outbound/credential-store"
    type: outbound
    name: "Credential Storage"
    contract: "put_creds(key: SAID, val: bytes) -> bool; get_creds(key: SAID) -> bytes?; put_issus(issuer: AID, acdc_said: SAID) -> bool; get_issus(issuer: AID) -> [SAID]; put_subjs(subject: AID, acdc_said: SAID) -> bool; get_subjs(subject: AID) -> [SAID]; put_schms(schema: SAID, acdc_said: SAID) -> bool; get_schms(schema: SAID) -> [SAID]; mark_saved(acdc_said: SAID) -> bool; is_saved(acdc_said: SAID) -> bool"
    protocol: "method-call"
    refs: ["persistence"]
    notes: "Credential subdatabases: .creds (ACDC bytes, by SAID), .issus (index by issuer AID), .subjs (index by subject AID), .schms (index by schema SAID), .saved (processed marker)"

  - id: "port://acdc/credential-lifecycle/outbound/tel-escrow-store"
    type: outbound
    name: "TEL Escrow Storage"
    contract: "escrow_oot(regid: REGID, sn: int, event: bytes) -> Result; escrow_twe(regid: REGID, sn: int, event: bytes) -> Result; escrow_tae(regid: REGID, sn: int, event: bytes) -> Result; escrow_cmse(regid: REGID, sn: int, event: bytes) -> Result; escrow_mre(regid: REGID, event: bytes) -> Result; escrow_mce(acdc_said: SAID, event: bytes) -> Result; escrow_mse(schema_said: SAID, event: bytes) -> Result; get_escrowed(escrow_type: str, key: bytes) -> Iterator<bytes>; remove_escrowed(escrow_type: str, key: bytes) -> Result"
    protocol: "method-call"
    refs: ["persistence"]
    notes: "TEL escrow subdatabases: .oots (out-of-order TEL), .twes (partial witness TEL), .taes (anchorless TEL), .cmse (missing sigs), .mre (missing registry), .mce (missing chain), .mse (missing schema)"
