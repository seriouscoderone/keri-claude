# ports.yaml
domain_ref: "acdc/ipex/negotiation"

ports:
  # Inbound -- what clients call
  - id: "port://acdc/ipex/negotiation/inbound/negotiate"
    type: inbound
    name: "Negotiation Protocol"
    contract: "initiate_issuance(issuer_aid, issuee_aid, acdc) -> GrantMessage; initiate_presentation(discloser_aid, disclosee_aid, acdc, variant) -> OfferMessage; process_apply(apply_msg) -> OfferMessage | SpurnMessage; process_offer(offer_msg) -> AgreeMessage | SpurnMessage; process_agree(agree_msg) -> GrantMessage | SpurnMessage; process_grant(grant_msg) -> AdmitMessage; process_spurn(spurn_msg) -> void"
    protocol: "method-call"
    refs: ["domain://acdc/ipex"]

  - id: "port://acdc/ipex/negotiation/inbound/direct-issuance"
    type: inbound
    name: "Direct Issuance"
    contract: "grant(issuer_aid, issuee_aid, acdc, signature) -> GrantMessage; admit(grant_msg, disclosee_signature) -> AdmitMessage"
    protocol: "method-call"
    refs: ["domain://acdc/ipex"]
