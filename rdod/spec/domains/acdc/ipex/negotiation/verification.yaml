# verification.yaml
domain_ref: "acdc/ipex/negotiation"

properties:
  - invariant: "Every IPEX message uses KERI exchange (exn) format with an '/ipex/*' route"
    term: "IPEX Message Type Pattern"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda msg: msg.type == 'exn' and msg.r.startswith('/ipex/')
    strategy: "Generate IPEX messages of all types; verify exn format and route prefix"
    notes: ""

  - invariant: "Valid responses are constrained: apply -> offer|spurn, offer -> agree|spurn, agree -> grant|spurn, grant -> admit"
    term: "IPEX Message Type Pattern"
    technique: symbolic
    formal:
      language: python
      expression: |
        lambda msg_type, response_type: (
          valid_responses := {
            'apply': {'offer', 'spurn'},
            'offer': {'agree', 'spurn'},
            'agree': {'grant', 'spurn'},
            'grant': {'admit'},
          },
          response_type in valid_responses.get(msg_type, set())
        )[-1]
    notes: "Exhaustive response constraint verification via state machine"

  - invariant: "All messages are signed by the sender via KRAM for secure attribution"
    term: "IPEX Message Type Pattern"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda msg: has_valid_signature(msg) and msg.signature.signer == msg.sender_aid
    strategy: "Generate signed and unsigned messages; verify only signed accepted"
    notes: "Non-repudiable sender attribution"

  - invariant: "Initiated by the Disclosee (the party requesting information)"
    term: "Apply"
    technique: property-based
    formal:
      language: python
      expression: "lambda msg: msg.r == '/ipex/apply' and msg.sender_role == 'disclosee'"
    strategy: "Generate apply messages with both sender roles; verify only disclosee accepted"
    notes: ""

  - invariant: "Initiated by the Discloser (the party proposing to share information)"
    term: "Offer"
    technique: property-based
    formal:
      language: python
      expression: "lambda msg: msg.r == '/ipex/offer' and msg.sender_role == 'discloser'"
    strategy: "Generate offer messages with both sender roles; verify only discloser accepted"
    notes: ""

  - invariant: "Constitutes non-repudiable acceptance of the contractual terms in the offer"
    term: "Agree"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda agree_msg, offer_msg: (
          agree_msg.referenced_said == offer_msg.d
          and has_valid_signature(agree_msg)
        )
    strategy: "Generate agree messages referencing offers; verify non-repudiable binding"
    notes: "Agree constitutes contractual acceptance"

  - invariant: "May be sent directly without prior negotiation (direct issuance shortcut)"
    term: "Grant"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda grant_msg, prior_exchange: (
          is_valid_grant(grant_msg)  # valid regardless of prior exchange history
        )
    strategy: "Generate grants with and without prior apply/offer/agree; both accepted"
    notes: "Grant is valid both in full negotiation and direct issuance"

  - invariant: "Disclosee must respond with admit to confirm receipt"
    term: "Grant"
    technique: symbolic
    formal:
      language: python
      expression: "lambda exchange: exchange.last_msg.r == '/ipex/grant' implies next_valid_msg(exchange).r == '/ipex/admit'"
    notes: "Grant has exactly one valid response: admit"

  - invariant: "Can reject: apply (by discloser), offer (by disclosee), agree (by discloser)"
    term: "Spurn"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda spurn_msg, rejected_msg: (
          rejected_msg.r in ('/ipex/apply', '/ipex/offer', '/ipex/agree')
          and spurn_msg.referenced_said == rejected_msg.d
        )
    strategy: "Generate spurns against all message types; verify only apply/offer/agree rejectable"
    notes: "Spurn is not valid against grant or admit"

  - invariant: "Does not terminate the entire exchange — parties may restart negotiation"
    term: "Spurn"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda exchange, spurn_msg: (
          exchange_after_spurn := apply_spurn(exchange, spurn_msg),
          not exchange_after_spurn.is_terminated  # exchange still open
        )
    strategy: "Apply spurn to active exchanges; verify exchange remains restartable"
    notes: "Spurn terminates a step, not the exchange"

  - invariant: "Flow: grant -> admit (two messages only)"
    term: "Direct Issuance"
    technique: symbolic
    formal:
      language: python
      expression: |
        lambda exchange: (
          len(exchange.messages) == 2
          and exchange.messages[0].r == '/ipex/grant'
          and exchange.messages[1].r == '/ipex/admit'
        )
    notes: "Direct issuance is exactly two messages"

  - invariant: "Flow: apply -> offer -> agree -> grant -> admit"
    term: "Full Negotiation"
    technique: symbolic
    formal:
      language: python
      expression: |
        lambda exchange: (
          routes := [m.r.split('/')[-1] for m in exchange.messages],
          routes == ['apply', 'offer', 'agree', 'grant', 'admit']
        )[-1]
    notes: "Full negotiation is exactly five messages in strict order"

contracts:
  - port_ref: "port://acdc/ipex/negotiation/inbound/negotiate"
    preconditions:
      - formal:
          language: python
          expression: |
            is_valid_aid(issuer_aid) and is_valid_aid(issuee_aid) and is_valid_acdc(acdc)
        description: "Both AIDs and ACDC must be valid for issuance initiation"
    postconditions:
      - formal:
          language: python
          expression: |
            result.r == '/ipex/grant'
            and result.type == 'exn'
            and has_valid_signature(result)
        description: "initiate_issuance returns a signed grant message"

  - port_ref: "port://acdc/ipex/negotiation/inbound/negotiate"
    preconditions:
      - formal:
          language: python
          expression: |
            apply_msg.r == '/ipex/apply' and has_valid_signature(apply_msg)
        description: "process_apply requires a valid signed apply message"
    postconditions:
      - formal:
          language: python
          expression: |
            result.r in ('/ipex/offer', '/ipex/spurn') and has_valid_signature(result)
        description: "process_apply returns either an offer or a spurn, both signed"

  - port_ref: "port://acdc/ipex/negotiation/inbound/direct-issuance"
    preconditions:
      - formal:
          language: python
          expression: |
            is_valid_aid(issuer_aid) and is_valid_aid(issuee_aid)
            and is_valid_acdc(acdc) and is_valid_signature(signature)
        description: "Valid AIDs, ACDC, and issuer signature"
    postconditions:
      - formal:
          language: python
          expression: |
            result.r == '/ipex/grant' and result.acdc.d == acdc.d
        description: "Direct grant contains the correct ACDC"

state_machines:
  - name: "IPEX Negotiation Protocol"
    term: "Full Negotiation"
    states: ["idle", "applied", "offered", "agreed", "granted", "admitted", "spurned"]
    transitions:
      - from: "idle"
        to: "applied"
        trigger: "Disclosee sends apply"
        guard: "Apply message is signed and contains valid schema SAID"
      - from: "idle"
        to: "offered"
        trigger: "Discloser sends offer (unsolicited)"
        guard: "Offer message is signed and contains metadata ACDC"
      - from: "idle"
        to: "granted"
        trigger: "Discloser sends grant (direct issuance)"
        guard: "Grant message is signed and contains ACDC + TEL + seal"
      - from: "applied"
        to: "offered"
        trigger: "Discloser responds to apply with offer"
        guard: "Offer references the apply SAID"
      - from: "applied"
        to: "spurned"
        trigger: "Discloser rejects apply"
        guard: "Spurn references the apply SAID"
      - from: "offered"
        to: "agreed"
        trigger: "Disclosee accepts offer with agree"
        guard: "Agree references the offer SAID and contains signature on offer"
      - from: "offered"
        to: "spurned"
        trigger: "Disclosee rejects offer"
        guard: "Spurn references the offer SAID"
      - from: "agreed"
        to: "granted"
        trigger: "Discloser sends grant after agreement"
        guard: "Grant contains full or selective disclosure ACDC"
      - from: "agreed"
        to: "spurned"
        trigger: "Discloser rejects agreement"
        guard: "Spurn references the agree SAID"
      - from: "granted"
        to: "admitted"
        trigger: "Disclosee confirms receipt with admit"
        guard: "Admit references the grant SAID and contains signature on grant"
      - from: "spurned"
        to: "applied"
        trigger: "Disclosee re-applies after spurn"
        guard: "New apply message, not referencing the spurned exchange"
      - from: "spurned"
        to: "offered"
        trigger: "Discloser re-offers after spurn"
        guard: "New offer message"
    invariants:
      - "Every message is signed by the sender for non-repudiable attribution"
      - "Grant has exactly one valid response: admit"
      - "Spurn terminates the current step but not the exchange — re-entry is possible"
      - "Direct issuance bypasses apply/offer/agree and goes straight to grant"
      - "Admitted is the only successful terminal state"
    initial_state: "idle"
    terminal_states: ["admitted"]
