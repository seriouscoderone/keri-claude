# verification.yaml
domain_ref: "acdc/ipex/messaging"

properties:
  - invariant: "Route r field value must be one of the IPEX routes: apply, offer, agree, grant, admit, spurn"
    term: "Exchange Message"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda msg: msg.r in (
          '/ipex/apply', '/ipex/offer', '/ipex/agree',
          '/ipex/grant', '/ipex/admit', '/ipex/spurn'
        )
    strategy: "Generate exn messages with valid and invalid routes; verify only IPEX routes accepted"
    notes: "Exhaustive route validation"

  - invariant: "Uses KERI exn message type"
    term: "Exchange Message"
    technique: property-based
    formal:
      language: python
      expression: "lambda msg: msg.type == 'exn'"
    strategy: "Generate messages with various type fields; verify only exn accepted"
    notes: ""

  - invariant: "Routes incoming EXN messages to the handler registered for the message's route field"
    term: "Exchanger"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda exchanger, msg: (
          handler := exchanger.get_handler(msg.r),
          handler is not None and handler.route == msg.r
        )
    strategy: "Register handlers for all IPEX routes; dispatch messages; verify correct handler receives each"
    notes: "Route-based dispatch"

  - invariant: "IPEX handlers are registered under '/ipex/apply', '/ipex/offer', '/ipex/agree', '/ipex/grant', '/ipex/admit', '/ipex/spurn'"
    term: "Exchanger"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda exchanger: all(
          exchanger.has_handler(route) for route in [
            '/ipex/apply', '/ipex/offer', '/ipex/agree',
            '/ipex/grant', '/ipex/admit', '/ipex/spurn'
          ]
        )
    strategy: "Check handler registration for all IPEX routes"
    notes: "Complete route coverage"

  - invariant: "Validates message signatures before dispatching to handlers"
    term: "Exchanger"
    technique: symbolic
    formal:
      language: python
      expression: |
        lambda processing_trace: (
          sig_check_index := next(i for i, s in enumerate(processing_trace) if s == 'validate_signature'),
          dispatch_index := next(i for i, s in enumerate(processing_trace) if s == 'dispatch_to_handler'),
          sig_check_index < dispatch_index
        )
    notes: "Temporal ordering — signature validation before handler dispatch"

  - invariant: "Each IPEX message type (apply, offer, agree, grant, admit, spurn) has its own handler"
    term: "IPEX Handler"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda handlers: (
          routes := {h.route for h in handlers},
          expected := {'/ipex/apply', '/ipex/offer', '/ipex/agree', '/ipex/grant', '/ipex/admit', '/ipex/spurn'},
          routes == expected
        )
    strategy: "Enumerate registered handlers; verify one per IPEX route"
    notes: "One handler per route, complete coverage"

  - invariant: "ipexGrantExn() bundles the ACDC, issuance TEL event (iss/bis), and KEL anchor seal"
    term: "IPEX Message Construction"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda grant_msg: (
          grant_msg.acdc is not None
          and grant_msg.tel_event is not None
          and grant_msg.tel_event.t in ('iss', 'bis')
          and grant_msg.kel_seal is not None
        )
    strategy: "Construct grant messages; verify all three artifact components present"
    notes: "Grant is the only message type that bundles all three artifacts"

  - invariant: "ipexAdmitExn() references the grant message by its SAID"
    term: "IPEX Message Construction"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda admit_msg, grant_msg: (
          admit_msg.referenced_said == grant_msg.d
        )
    strategy: "Construct admit messages; verify they reference the correct grant SAID"
    notes: ""

  - invariant: "Messages awaiting prerequisites are escrowed, not rejected"
    term: "Exchanger"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda result: (
          result.is_escrowed or result.is_accepted  # never silently dropped
        )
    strategy: "Submit messages with missing prerequisites; verify escrowed rather than rejected"
    notes: "Escrow-not-reject policy for exchange messages"

contracts:
  - port_ref: "port://acdc/ipex/messaging/inbound/construct-message"
    preconditions:
      - formal:
          language: python
          expression: |
            is_valid_hab(hab) and is_valid_aid(recipient)
        description: "Sending identifier context and recipient AID must be valid"
    postconditions:
      - formal:
          language: python
          expression: |
            result.type == 'exn'
            and result.r.startswith('/ipex/')
            and has_valid_signature(result)
            and result.sender == hab.aid
        description: "Constructed message is a signed exn with correct IPEX route"

  - port_ref: "port://acdc/ipex/messaging/inbound/construct-message"
    preconditions:
      - formal:
          language: python
          expression: |
            is_valid_hab(hab) and is_valid_aid(recipient)
            and is_valid_acdc(acdc) and is_valid_tel_event(tel_event) and is_valid_seal(kel_seal)
        description: "build_grant requires valid identifier context, recipient, ACDC, TEL event, and seal"
    postconditions:
      - formal:
          language: python
          expression: |
            result.r == '/ipex/grant'
            and result.acdc.d == acdc.d
            and result.tel_event == tel_event
            and result.kel_seal == kel_seal
        description: "Grant message bundles all three credential artifacts"

  - port_ref: "port://acdc/ipex/messaging/inbound/dispatch-message"
    preconditions:
      - formal:
          language: python
          expression: |
            exn_message.type == 'exn' and has_valid_signature(exn_message)
        description: "Message must be exn type with valid signature"
    postconditions:
      - formal:
          language: python
          expression: |
            isinstance(result, HandlerResponse) or isinstance(result, EscrowReason)
        description: "Dispatch returns either a handler response or an escrow reason — never silently drops"
