# ports.yaml
domain_ref: "acdc/ipex/messaging"

ports:
  # Inbound -- what clients call
  - id: "port://acdc/ipex/messaging/inbound/construct-message"
    type: inbound
    name: "Message Construction"
    contract: "build_apply(hab: Hab, recipient: AID, schema: SAID, attributes: [Label]?) -> ExchangeMessage; build_offer(hab: Hab, recipient: AID, metadata_acdc: ACDC, terms: RuleSection) -> ExchangeMessage; build_agree(hab: Hab, recipient: AID, offer_said: SAID) -> ExchangeMessage; build_grant(hab: Hab, recipient: AID, acdc: ACDC, tel_event: TELEvent, kel_seal: EventSeal) -> ExchangeMessage; build_admit(hab: Hab, recipient: AID, grant_said: SAID) -> ExchangeMessage; build_spurn(hab: Hab, recipient: AID, rejected_said: SAID, reason: string?) -> ExchangeMessage"
    protocol: "method-call"
    refs: ["domain://acdc/ipex"]

  - id: "port://acdc/ipex/messaging/inbound/dispatch-message"
    type: inbound
    name: "Message Dispatch"
    contract: "dispatch(exn_message: ExchangeMessage) -> Result<HandlerResponse, EscrowReason>; lookup_response(inbound_said: SAID) -> ExchangeMessage?"
    protocol: "method-call"
    refs: ["domain://acdc/ipex"]

  # Outbound -- what messaging calls
  - id: "port://acdc/ipex/messaging/outbound/message-transport"
    type: outbound
    name: "Exchange Message Transport"
    contract: "send_exn(recipient_aid: AID, exn_message: ExchangeMessage) -> Result; receive_exn(sender_aid: AID) -> ExchangeMessage"
    protocol: "method-call"
    refs: ["transport"]
