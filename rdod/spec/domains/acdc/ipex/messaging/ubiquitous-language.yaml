# ubiquitous-language.yaml
domain_ref: "acdc/ipex/messaging"

terms:
  - term: "Exchange Message"
    synonyms: ["exn message", "exn"]
    definition: "A KERI exchange message with a route (r) field value specifying the IPEX protocol step. The container for all IPEX protocol communications."
    invariants:
      - "Uses KERI exn message type"
      - "Route r field value must be one of the IPEX routes: apply, offer, agree, grant, admit, spurn"
      - "Signed by the sender for secure attribution via KRAM"
      - "May include attached SAIDs, schemas, ACDCs, or signatures depending on the route"
    examples:
      - "An exn message with route '/ipex/grant' containing a full disclosure ACDC"
    related_terms: ["Exchanger", "IPEX Handler", "IPEX Message Construction"]

  - term: "Exchanger"
    synonyms: ["Exchanger [keripy]"]
    definition: "Generic exchange message (EXN) processor that routes messages by their route field to registered handlers. IPEX handlers are registered under '/ipex/*' routes. The Exchanger validates signatures, dispatches to the appropriate handler, and manages exchange escrows for partially-complete exchanges."
    invariants:
      - "Routes incoming EXN messages to the handler registered for the message's route field"
      - "IPEX handlers are registered under '/ipex/apply', '/ipex/offer', '/ipex/agree', '/ipex/grant', '/ipex/admit', '/ipex/spurn'"
      - "Validates message signatures before dispatching to handlers"
      - "Manages exchange escrows for messages awaiting prerequisites (e.g., missing prior exchange step)"
    examples:
      - "Exchanger receiving an EXN with route '/ipex/grant' and dispatching it to the registered IPEX grant handler"
      - "Exchanger escrowing an admit message until the referenced grant has been fully processed"
    related_terms: ["IPEX Handler", "Exchange Message"]

  - term: "IPEX Handler"
    synonyms: ["IpexHandler [keripy]"]
    definition: "Route-specific message processor for '/ipex/*' exchange routes. Registers handlers for each IPEX message type (apply, offer, agree, grant, admit, spurn). Methods: verify() for route-specific signature validation, handle() for processing, response() for looking up a response to a given message."
    invariants:
      - "Each IPEX message type (apply, offer, agree, grant, admit, spurn) has its own handler"
      - "verify() performs route-specific signature validation before processing"
      - "handle() processes the validated IPEX message and updates exchange state"
      - "response() looks up the response message for a given inbound message SAID"
    examples:
      - "IpexHandler for '/ipex/grant' verifying the discloser's signature, then storing the granted credential"
      - "IpexHandler.response() returning the admit SAID that was sent in reply to a specific grant"
    related_terms: ["Exchanger", "Exchange Message", "IPEX Message Construction"]

  - term: "IPEX Message Construction"
    synonyms: ["ipexApplyExn() [keripy]", "ipexOfferExn() [keripy]", "ipexAgreeExn() [keripy]", "ipexGrantExn() [keripy]", "ipexAdmitExn() [keripy]", "ipexSpurnExn() [keripy]"]
    definition: "Module-level functions that build IPEX exchange messages (EXN type). Each function takes the sending Hab, recipient, message text, and message-type-specific data. Grant includes the full credential (ACDC), issuance TEL event, and anchor seal. Admit references the grant by SAID."
    invariants:
      - "Each function produces a complete EXN message with the appropriate '/ipex/*' route"
      - "All functions require the sending Hab (identifier context) and recipient AID"
      - "ipexGrantExn() bundles the ACDC, issuance TEL event (iss/bis), and KEL anchor seal"
      - "ipexAdmitExn() references the grant message by its SAID"
      - "ipexSpurnExn() references the rejected message by its SAID"
    examples:
      - "ipexGrantExn(hab, recp, message, acdc, iss, anc) building a grant with full credential artifacts"
      - "ipexAdmitExn(hab, recp, message, grant_said) building an admit referencing the grant"
    related_terms: ["IPEX Handler", "Exchange Message", "Exchanger"]

events:
  - name: "MessageConstructed"
    payload: "route: Route, sender_aid: AID, recipient_aid: AID, exn_said: SAID"
    triggers: "An IPEX message construction function produces a complete EXN message"

  - name: "MessageDispatched"
    payload: "route: Route, exn_said: SAID, handler_id: string"
    triggers: "Exchanger routes an incoming EXN message to the appropriate IPEX handler"

  - name: "MessageEscrowed"
    payload: "exn_said: SAID, route: Route, blocking_reason: string"
    triggers: "Exchanger escrows a message awaiting a prerequisite (e.g., missing prior exchange step)"

  - name: "EscrowProcessed"
    payload: "exn_said: SAID, route: Route"
    triggers: "A previously escrowed message's blocking condition resolves and it is reprocessed"

rules:
  - "All IPEX messages must use KERI exchange (exn) message format with the appropriate '/ipex/*' route"
  - "The Exchanger must validate message signatures before dispatching to handlers"
  - "Each IPEX route must have exactly one registered handler"
  - "Messages awaiting prerequisites are escrowed, not rejected — they are reprocessed when the blocking condition resolves"
  - "Message construction functions produce complete, self-contained EXN messages ready for transport"
