# domain.yaml
template_version: "1.0"
id: "acdc/ipex/messaging"
name: "IPEX Messaging"
description: >
  The message routing and construction infrastructure for IPEX exchanges. Covers the
  Exchanger (generic EXN router), IPEX Handler (route-specific processors), message
  construction functions, and the EXN message format. This subdomain owns HOW IPEX
  messages are built, dispatched, and processed — not WHAT they mean (negotiation)
  or WHETHER they are authentic (verification).
version: "0.1.0"

source_material:
  - type: implementation
    reference: "keripy — src/keri/core/exchanging.py (Exchanger: generic EXN message router and handler dispatcher)"
  - type: implementation
    reference: "keripy — src/keri/app/ipexing.py (ipexApplyExn, ipexOfferExn, ipexAgreeExn, ipexGrantExn, ipexAdmitExn, ipexSpurnExn: IPEX message construction functions)"
  - type: document
    reference: "acdc-specification.md — Exchange Message format, route field semantics"

ubiquitous_language:
  - term: "IPEX Messaging Infrastructure"
    definition: "The message construction, routing, and handler dispatch layer for IPEX exchange messages"
    invariants:
      - "All IPEX messages use the KERI exchange (exn) message format"
      - "Messages are routed by the route (r) field to registered handlers"
      - "Each IPEX route has a dedicated handler with verify/handle/response methods"

domain_clients:
  - ref: "domain://acdc/ipex"
    relationship: "Parent IPEX domain delegates message construction and routing to this subdomain"
    via_port: "port://acdc/ipex/messaging/inbound/construct-message"

subdomains: []

kernels: []

adjacents:
  - ref: "domain://keri"
    relationship: "EXN message type is defined by the KERI protocol; IPEX messages are a specialization of the generic EXN format"

externals:
  - name: "Transport"
    abstraction: "Message delivery between agents"
    ref: "port://acdc/ipex/messaging/outbound/message-transport"
    implementation_notes: "Delivers constructed EXN messages to recipient agents. Implementations: HTTP, TCP, or agent-to-agent message relay."

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    In keripy, the Exchanger class in exchanging.py provides the generic EXN router, while
    the IpexHandler in ipexing.py registers route-specific handlers for '/ipex/*' routes.
    The ipex*Exn() functions are module-level builders that construct complete EXN messages
    with the appropriate route and payload. The Exchanger manages exchange escrows for
    messages awaiting prerequisites (e.g., an admit waiting for its referenced grant to
    be fully processed).

issues: []

tags: ["messaging", "exn", "exchanger", "handler", "message-construction", "routing"]
