# domain.yaml
template_version: "1.0"
id: "acdc/ipex"
name: "Issuance and Presentation Exchange (IPEX)"
description: >
  Issuance and Presentation Exchange Protocol — the orchestrating domain that
  coordinates credential issuance and presentation as disclosure from a Discloser
  to a Disclosee. IPEX unifies issuance and presentation under a single protocol.
  Delegates protocol flow to negotiation, cryptographic proof to verification,
  and message routing to messaging.
version: "0.1.0"

source_material:
  - type: document
    reference: "acdc-specification.md — Issuance and Presentation Exchange (IPEX) section"
  - type: document
    reference: "KERIArchGroupIssuance.md — KERI architectures for group issuance, IPEX and KRAM sections"

ubiquitous_language:
  - term: "IPEX"
    definition: "Issuance and Presentation Exchange Protocol — a standard set of KERI exchange (exn) message routes for credential issuance and presentation"
    invariants:
      - "All exchanges modeled as disclosure from Discloser to Disclosee"
      - "A single protocol works for both issuance and presentation exchanges"
      - "Delegates protocol flow to negotiation, proof mechanics to verification, message infrastructure to messaging"

domain_clients:
  - ref: "domain://acdc"
    relationship: "ACDC core domain drives IPEX for credential issuance and presentation exchange"
    via_port: "port://acdc/ipex/inbound/exchange-protocol"

subdomains:
  - ref: "domain://acdc/ipex/negotiation"
    relationship: "Protocol flow logic — message types, sequencing, exchange patterns"
  - ref: "domain://acdc/ipex/verification"
    relationship: "Cryptographic proof mechanics — PoI, PoD, credential artifacts, KRAM"
  - ref: "domain://acdc/ipex/messaging"
    relationship: "Message construction, routing, and handler dispatch infrastructure"

kernels: []

adjacents: []

externals: []

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    IPEX is an orchestrating domain that coordinates three subdomains: negotiation
    (protocol flows), verification (cryptographic proofs), and messaging (EXN
    construction and routing). In keripy, these concerns are co-located in
    ipexing.py and exchanging.py but are logically separable. Group multisig
    issuance requires coordination of IPEX messages across group members.

issues: []

tags: ["exchange", "issuance", "presentation", "disclosure", "protocol", "orchestration"]
