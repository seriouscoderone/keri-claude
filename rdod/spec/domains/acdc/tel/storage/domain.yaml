# domain.yaml
template_version: "1.0"
id: "acdc/tel/storage"
name: "TEL Storage"
description: >
  Persistent storage for TEL events, backer signatures, anchor seals, and
  credential/registry metadata. Provides indexed access by registry SAID,
  credential SAID, and sequence number. The storage schema partitions data across
  separate subdatabases for event serializations (.tvts), TEL log index (.tels),
  backer signatures (.tibs), backer lists (.baks), anchor seals (.ancs), timestamps
  (.tets), credential data (.creds, .cancs, .saved, .issus, .subjs, .schms), escrow
  queues (.oots, .twes, .taes, .cmse, .mre, .mce, .mse), and registry metadata
  (.regs, .states). Two primary access patterns: (registry_said + sn) for sequential
  access and (registry_said + event_digest) for content-addressed access.
version: "0.1.0"

source_material:
  - type: implementation
    reference: "keripy -- src/keri/vdr/viring.py (Reger class: TEL subdatabases .tvts, .tels, .tibs, .baks, .ancs, .oots, .twes, .taes, .creds, .cancs, .saved, .issus, .subjs, .schms, .regs, .states)"
  - type: implementation
    reference: "keriox/teliox -- src/database/mod.rs (TelEventDatabase trait: add_new_event, get_events, get_management_events, get_tel_state)"

ubiquitous_language:
  - term: "TEL Database"
    definition: "Persistent storage for TEL events and credential metadata, partitioned across typed subdatabases"
    invariants:
      - "Stores serialized TEL events, backer signatures, backer lists, and anchor seals"
      - "Maintains separate escrow subdatabases for out-of-order, partial-witness, and anchorless events"

  - term: "TEL Storage Schema"
    definition: "The subdatabase organization for storing TEL data: events, indexes, signatures, anchors, and timestamps"
    invariants:
      - "Two primary key patterns: (registry_said + sn) and (registry_said + event_digest)"
      - "All write operations are idempotent"

domain_clients:
  - ref: "domain://acdc/tel"
    relationship: "Parent TEL domain delegates all persistent storage operations -- event logging, signature accumulation, credential indexing, escrow management, and state caching"
    via_port: "port://acdc/tel/storage/inbound/event-logging"

subdomains: []

kernels: []

adjacents: []

externals:
  - name: "Persistence Engine"
    abstraction: "Repository"
    ref: "port://acdc/tel/storage/outbound/persistence"
    implementation_notes: "Key-value store with ordered iteration and duplicate-key support. Implementations: LMDB (keripy Reger -- memory-mapped B+ tree, named subdatabases, dupsort), redb (keriox TelEventDatabase -- pure Rust embedded database), DynamoDB (serious-keri -- serverless, GSI-based access patterns). The storage subdomain defines the logical schema; the persistence engine provides the physical storage."

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    In keripy, the Reger class (vdr/viring.py) extends LMDBer and defines all TEL
    subdatabases as typed attributes. Each subdatabase uses a specific Suber variant
    matching the KEL storage patterns: Suber for simple key-value, IoSetSuber for
    insertion-ordered sets (backer signatures), CesrSuber for CESR-typed values.
    Keys are constructed via dgKey(regid, dig) or snKey(regid, sn) utility functions
    -- the same patterns used in KEL storage. In keriox, the TelEventDatabase trait
    defines the storage interface with add_new_event(), get_events(), and
    get_management_events(). In serious-keri, DynamoDB tables replace LMDB subdatabases
    with GSI access patterns mapping to the two primary key patterns.

issues: []

tags: ["storage", "persistence", "tel-database", "reger", "subdatabases", "credential-index", "escrow-storage"]
