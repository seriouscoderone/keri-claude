# ubiquitous-language.yaml
domain_ref: "acdc/tel/storage"

terms:
  - term: "TEL Subdatabase Pattern"
    synonyms: ["TEL Storage Structure"]
    definition: "The common structure shared by all subdatabases in the TEL storage layer. Mirrors the KEL subdatabase pattern with four elements: (1) a key pattern (registry SAID + sn, or registry SAID + event digest), (2) a value type (serialized TEL event, CESR primitive, or composite tuple), (3) an access semantic (append-only for events, accumulate for signatures), and (4) a purpose category (event storage, signature storage, anchor storage, escrow storage, or credential index)."
    invariants:
      - "Event storage (.tvts, .tels): append-only, keyed by registry SAID + digest or sn"
      - "Signature storage (.tibs): accumulates backer signatures, keyed by event digest"
      - "Anchor storage (.ancs): links TEL events to KEL seals, keyed by event digest"
      - "Escrow storage (.oots, .twes, .taes): temporary, pruned on resolution or timeout"
      - "Credential indexes (.issus, .subjs, .schms, .saved): enable filtered lookup by issuer, subject, or schema"
      - "Same key pattern conventions as KEL storage: dgKey for content-addressed, snKey for position-addressed"
    examples:
      - ".tvts: key=dgKey(registry,digest), value=TEL event bytes, access=append-only, purpose=event storage"
      - ".tibs: key=dgKey(registry,digest), value=Siger list, access=accumulate, purpose=signature storage"
      - ".issus: key=issuer_aid, value=Saider list, access=append, purpose=credential index"
    related_terms: ["TEL Storage Schema", "Credential Storage", "Escrow Storage", "TEL Key Patterns"]

  - term: "TEL Database"
    synonyms: ["Reger [keripy]", "TelEventDatabase trait [keriox]"]
    definition: "Persistent storage for TEL events and credential metadata. In keripy: Reger class extending LMDBer with typed subdatabase attributes. In keriox: TelEventDatabase trait with add_new_event/get_events/get_management_events."
    invariants:
      - "Stores serialized TEL events, backer signatures, backer lists, and anchor seals"
      - "Maintains separate escrow subdatabases for out-of-order, partial-witness, and anchorless events"
      - "In keripy: key subdatabases are .tvts, .tels, .tibs, .baks, .ancs, .oots, .twes, .taes"
      - "In keriox: trait-based abstraction with add_new_event(), get_events(), get_management_events()"
    examples:
      - "Reger.tvts storing the serialized bytes of each TEL event keyed by event SAID"
      - "keriox TelEventDatabase::get_management_events() returning the VCP+VRT chain for a registry"
    related_terms: ["TEL Storage Schema", "Credential Storage", "Escrow Storage", "TEL Key Patterns"]

  - term: "TEL Storage Schema"
    synonyms: ["Reger subdatabases [keripy]"]
    definition: "The subdatabase organization for the core TEL event data. Separates event serializations, sequence indexes, backer signatures, backer lists, anchor seals, and timestamps into distinct subdatabases, each optimized for its access pattern."
    invariants:
      - ".tvts: serialized TEL event bytes indexed by dgKey (registry_said + event_digest) -- the primary event store"
      - ".tels: TEL sequence index mapping snKey (registry_said + sn) to event digest -- ordered access by sequence number"
      - ".tibs: backer indexed signatures (Siger) per event, indexed by dgKey -- IoSet (insertion-ordered, append-only)"
      - ".baks: backer AID lists per registry, indexed by registry SAID -- current set of designated backer witnesses"
      - ".ancs: anchor seals per event, indexed by dgKey -- the KEL seal that anchors each TEL event"
      - ".tets: event datetime timestamps per event, indexed by dgKey -- recorded at first acceptance"
    examples:
      - "Looking up event at sn=3 for registry R: .tels[snKey(R,3)] -> digest D, then .tvts[dgKey(R,D)] -> event bytes"
      - "Accumulating backer signatures: .tibs[dgKey(R,D)].add(siger) -- appends to set, idempotent if already present"
      - "Retrieving anchor seal for verification: .ancs[dgKey(R,D)] -> seal referencing issuer's KEL event"
    related_terms: ["TEL Database", "TEL Key Patterns", "Credential Storage", "Escrow Storage"]

  - term: "Credential Storage"
    synonyms: [".creds/.cancs/.saved/.issus/.subjs/.schms [keripy]"]
    definition: "Subdatabases for credential data and multi-dimensional credential indexing. Stores serialized ACDCs and provides lookup by credential SAID, issuer AID, subject AID, and schema SAID."
    invariants:
      - ".creds: serialized ACDC bytes indexed by credential SAID -- the primary credential store"
      - ".cancs: credential anchor seals indexed by credential SAID -- binding each credential to its TEL event"
      - ".saved: processed credential index -- marks credentials that have been fully validated and stored"
      - ".issus: credential index by issuer AID -- enables lookup of all credentials issued by a given AID"
      - ".subjs: credential index by subject AID -- enables lookup of all credentials targeting a given issuee"
      - ".schms: credential index by schema SAID -- enables lookup of all credentials conforming to a given schema"
    examples:
      - "Looking up credential by SAID: .creds[acdc_said] -> serialized ACDC bytes"
      - "Finding all credentials issued by AID A: .issus[A] -> [acdc_said_1, acdc_said_2, ...]"
      - "Finding all credentials for subject S with schema Z: intersect .subjs[S] and .schms[Z]"
      - "Checking if a credential has been processed: .saved[acdc_said] exists"
    related_terms: ["TEL Database", "TEL Storage Schema", "Escrow Storage"]

  - term: "Escrow Storage"
    synonyms: [".oots/.twes/.taes/.cmse/.mre/.mce/.mse [keripy]"]
    definition: "Subdatabases for TEL events that cannot be immediately validated. Each escrow type corresponds to a specific missing dependency: out-of-order events, partial witness receipts, missing anchor seals, missing signatures, and missing registry/chain/schema state."
    invariants:
      - ".oots: out-of-order escrow -- TEL events whose sequence number does not match the expected next sn"
      - ".twes: partial witness escrow -- TEL events with insufficient backer signatures to satisfy the threshold"
      - ".taes: anchorless escrow -- TEL events whose KEL anchor seal has not yet been verified"
      - ".cmse: missing signature escrow -- TEL events with insufficient controller signatures"
      - ".mre: missing registry escrow -- credential events received before the registry's VCP inception"
      - ".mce: missing chain escrow -- credential events referencing an unresolved credential chain"
      - ".mse: missing schema escrow -- credential events referencing an unavailable schema"
    examples:
      - "An iss event escrowed in .oots because a prior event at sn=2 has not yet been processed"
      - "A bis event escrowed in .twes with 1 of 3 required backer signatures collected so far"
      - "A credential event escrowed in .mre because the registry VCP has not yet been received"
      - "Processing .taes after an issuer KEL event arrives with the expected anchor seal"
    related_terms: ["TEL Database", "TEL Storage Schema", "Credential Storage"]

  - term: "TEL Key Patterns"
    synonyms: ["dgKey [keripy]", "snKey [keripy]"]
    definition: "The two primary key construction patterns for addressing data in the TEL storage schema. snKey concatenates registry_said and sequence number for sequential access. dgKey concatenates registry_said and event_digest for content-addressed lookup."
    invariants:
      - "snKey(registry_said, sn) = registry_said_bytes + sn_bytes -- sequence-ordered access by position in TEL"
      - "dgKey(registry_said, event_digest) = registry_said_bytes + digest_bytes -- content-addressed by event identity"
      - "snKey is used for: .tels (sequence index)"
      - "dgKey is used for: .tvts (event bytes), .tibs (backer sigs), .ancs (anchor seals), .tets (timestamps)"
      - "Credential SAID alone is used for: .creds, .cancs, .saved"
      - "AID or SAID alone is used for: .issus (by issuer), .subjs (by subject), .schms (by schema)"
      - "Both patterns produce fixed-length binary keys suitable for B+ tree indexing"
    examples:
      - "snKey('ECOW...', 3) -- lookup the event digest at sequence number 3 for registry ECOW"
      - "dgKey('ECOW...', 'EDEF...') -- lookup event bytes, backer sigs, or anchor seal for a specific event"
      - "In keripy: dbing.snKey(pre=regk.encode(), sn=3)"
      - "In keripy: dbing.dgKey(pre=regk.encode(), dig=said.encode())"
    related_terms: ["TEL Storage Schema", "TEL Database"]

  - term: "Registry Metadata"
    synonyms: [".regs/.states [keripy]"]
    definition: "Subdatabases for registry-level metadata. Stores registry name-to-record mappings and cached registry state snapshots for fast lookup without replaying the management TEL."
    invariants:
      - ".regs: registry name to record mapping -- enables lookup of registry by human-readable name"
      - ".states: cached registry state snapshots indexed by registry SAID -- pre-computed from management TEL"
      - "State cache is an optimization -- authoritative state can always be recomputed from the management TEL"
      - "Cache is updated each time a management event (VCP/VRT) is accepted"
    examples:
      - ".regs['my-registry'] -> {regid: 'ECOW...', issuer: 'DABC...', ...}"
      - ".states['ECOW...'] -> RegStateRecord with sn=2, backer list, toad, latest digest"
      - "After VRT rotation: .states['ECOW...'] is overwritten with updated backer list and incremented sn"
    related_terms: ["TEL Database", "TEL Storage Schema"]

events:
  - name: "TELEventLogged"
    payload: "regid: REGID, sn: int, said: SAID, event_type: str"
    triggers: "A TEL event is accepted into the log -- written to .tvts, indexed in .tels, anchor stored in .ancs"

  - name: "BackerSignaturesAccumulated"
    payload: "regid: REGID, said: SAID, new_sigs: [Siger], total_count: int"
    triggers: "New backer signatures are appended to the existing signature set for a TEL event in .tibs"

  - name: "CredentialIndexed"
    payload: "acdc_said: SAID, issuer_aid: AID, subject_aid: AID?, schema_said: SAID"
    triggers: "A credential is stored in .creds and indexed across .issus, .subjs, and .schms"

  - name: "TELEventEscrowed"
    payload: "regid: REGID, sn: int, said: SAID, escrow_type: str, reason: str"
    triggers: "A TEL event cannot be immediately validated and is placed in the appropriate escrow subdatabase"

  - name: "RegistryStateCached"
    payload: "regid: REGID, sn: int, said: SAID"
    triggers: "A management event is accepted and the cached registry state in .states is updated"

rules:
  - "All write operations are idempotent -- reprocessing a duplicate event or late-arriving backer signature must not corrupt the log or create duplicates"
  - "Event bytes in .tvts are immutable after first write -- the content of an accepted TEL event never changes"
  - "Backer signature sets in .tibs are append-only per event -- entries are never removed, only accumulated"
  - "snKey and dgKey are the two canonical access patterns for TEL event data -- all core subdatabases use one or the other"
  - "Credential indexes (.issus, .subjs, .schms) are maintained as secondary indexes -- the .creds subdatabase is the primary credential store"
  - "The state cache (.states) is a performance optimization -- registry state is always derivable from the management TEL"
  - "Escrow subdatabases hold events temporarily -- they are pruned when the blocking condition resolves or on timeout"
  - "Timestamps (.tets) are immutable after first write -- the first-seen time is permanent"
