# verification.yaml
domain_ref: "acdc/tel/state"

properties:
  - invariant: "Exactly three states: NotIssued, Issued, Revoked"
    term: "Credential State"
    technique: property-based
    formal:
      language: python
      expression: "lambda state: state in ('NotIssued', 'Issued', 'Revoked')"
    strategy: "Generate all possible state values; verify only three accepted"
    notes: "Exhaustive state enumeration"

  - invariant: "Transitions are strictly one-directional: NotIssued -> Issued -> Revoked"
    term: "Credential State"
    technique: symbolic
    formal:
      language: python
      expression: |
        lambda old_state, new_state: (
          (old_state == 'NotIssued' and new_state == 'Issued') or
          (old_state == 'Issued' and new_state == 'Revoked')
        )
    notes: "Only two valid transitions exist — verified by exhaustive state machine exploration"

  - invariant: "No transition back from Revoked to Issued, or from Issued to NotIssued"
    term: "Credential State"
    technique: smt
    formal:
      language: z3
      expression: |
        And(
          Not(valid_transition('Revoked', 'Issued')),
          Not(valid_transition('Revoked', 'NotIssued')),
          Not(valid_transition('Issued', 'NotIssued')),
          Not(valid_transition('Revoked', 'Revoked'))
        )
    notes: "Negative transitions proven impossible by SMT"

  - invariant: "Sequence number must be exactly current_sn + 1 for the next event (monotonically increasing, no gaps)"
    term: "State Transition Rules"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([event, current_sn],
          Implies(
            is_valid_next_event(event, current_sn),
            event.sn == current_sn + 1
          )
        )
    notes: "No gaps or duplicates in sequence numbers"

  - invariant: "The p (prior event SAID) field must match the digest of the immediately preceding event in the TEL"
    term: "State Transition Rules"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([event, prior_event],
          Implies(
            And(event.sn == prior_event.sn + 1, event.sn > 0),
            event.p == said_compute(prior_event)
          )
        )
    notes: "Hash-chain integrity verification"

  - invariant: "An iss/bis event is only valid when credential state is NotIssued"
    term: "State Transition Rules"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([event, state],
          Implies(
            And(event.t in ('iss', 'bis'), is_valid_transition(event, state)),
            state == 'NotIssued'
          )
        )
    notes: "Issuance precondition"

  - invariant: "A rev/brv event is only valid when credential state is Issued"
    term: "State Transition Rules"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([event, state],
          Implies(
            And(event.t in ('rev', 'brv'), is_valid_transition(event, state)),
            state == 'Issued'
          )
        )
    notes: "Revocation precondition"

  - invariant: "No event is valid when credential state is Revoked (terminal state)"
    term: "State Transition Rules"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([event],
          Implies(
            current_state == 'Revoked',
            Not(is_valid_transition(event, 'Revoked'))
          )
        )
    notes: "Terminal state — no further transitions possible"

  - invariant: "Registry mode (NoBackers trait) must match the event type: NoBackers -> iss/rev, backed -> bis/brv"
    term: "State Transition Rules"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda registry, event: (
          (has_nobackers_trait(registry) and event.t in ('iss', 'rev'))
          or (not has_nobackers_trait(registry) and event.t in ('bis', 'brv'))
        )
    strategy: "Generate registries with both modes and all event types; verify mode matching"
    notes: "Mode mismatch is rejected"

  - invariant: "Replaying the same TEL events in order always produces the same state (deterministic)"
    term: "State Reconstruction"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda events: replay_state(events) == replay_state(events)
    strategy: "Replay TEL events multiple times; verify identical state output"
    notes: "Determinism of state reconstruction"

  - invariant: "Cached state snapshots must always be reproducible by TEL replay — replay is ground truth"
    term: "State Reconstruction"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda cached_state, events: cached_state == replay_state(events)
    strategy: "Generate state snapshots and their source events; verify replay matches cache"
    notes: "Cache consistency check — replay is authoritative"

contracts:
  - port_ref: "port://acdc/tel/state/inbound/state-query"
    preconditions:
      - formal:
          language: python
          expression: "is_valid_said(regid) and is_valid_said(acdc_said)"
        description: "Registry ID and credential SAID must be valid"
    postconditions:
      - formal:
          language: python
          expression: "result.state in ('NotIssued', 'Issued', 'Revoked')"
        description: "Returned state is one of the three valid credential states"
      - formal:
          language: python
          expression: "result == replay_state(get_events(regid, acdc_said))"
        description: "Returned snapshot matches what TEL replay would produce"

  - port_ref: "port://acdc/tel/state/inbound/state-query"
    preconditions:
      - formal:
          language: python
          expression: |
            is_valid_tel_event(event) and (
              (event.t in ('iss', 'bis') and verifier.vc_state(event.acdc_said) == 'NotIssued') or
              (event.t in ('rev', 'brv') and verifier.vc_state(event.acdc_said) == 'Issued')
            )
        description: "apply_event: event must be valid and current state must allow the transition"
    postconditions:
      - formal:
          language: python
          expression: |
            (event.t in ('iss', 'bis') and result.new_state == 'Issued') or
            (event.t in ('rev', 'brv') and result.new_state == 'Revoked')
        description: "State transitions correctly based on event type"

  - port_ref: "port://acdc/tel/state/inbound/state-reconstruction"
    preconditions:
      - formal:
          language: python
          expression: "is_valid_said(regid) and len(events) > 0 and events[0].t in ('rip', 'vcp')"
        description: "Events must start with inception and be a non-empty list"
    postconditions:
      - formal:
          language: python
          expression: "result == replay_state(events)"
        description: "Reconstruction produces the same state as sequential replay"

state_machines:
  - name: "Credential Lifecycle FSM"
    term: "Credential State"
    states: ["NotIssued", "Issued", "Revoked"]
    transitions:
      - from: "NotIssued"
        to: "Issued"
        trigger: "iss or bis event processed"
        guard: "Event sn == current_sn + 1 AND p field matches prior event SAID AND registry mode matches event type"
      - from: "Issued"
        to: "Revoked"
        trigger: "rev or brv event processed"
        guard: "Event sn == current_sn + 1 AND p field matches prior event SAID AND registry mode matches event type"
    invariants:
      - "Transitions are strictly one-directional — no reversal from Revoked or Issued"
      - "Every transition requires a valid TEL event sealed in the issuer's KEL"
      - "State is deterministic given the same event sequence"
      - "Revoked is absorbing — no outgoing transitions"
    initial_state: "NotIssued"
    terminal_states: ["Revoked"]

  - name: "Registry Management FSM"
    term: "Registry State Snapshot"
    states: ["Uninitialized", "Active"]
    transitions:
      - from: "Uninitialized"
        to: "Active"
        trigger: "VCP/rip event processed"
        guard: "Event sn == 0 AND issuer AID is valid"
      - from: "Active"
        to: "Active"
        trigger: "VRT event processed"
        guard: "Event sn == current_sn + 1 AND p field matches prior event SAID AND registry has backers"
    invariants:
      - "Registry must be Active before any credential events can be processed"
      - "VRT events are only valid for registries with backers (not NoBackers)"
      - "Config traits set at inception cannot be changed by VRT events"
    initial_state: "Uninitialized"
    terminal_states: []
