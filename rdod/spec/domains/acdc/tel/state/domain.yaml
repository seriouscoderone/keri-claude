# domain.yaml
template_version: "1.0"
id: "acdc/tel/state"
name: "TEL State Management"
description: >
  Credential and registry state machines. Tracks credential lifecycle
  (NotIssued -> Issued -> Revoked) and registry management state (backer config,
  sequence number). State is computed deterministically by replaying TEL events
  from inception through the latest event, analogous to how KEL key state is
  computed from the establishment subsequence. Each registry has a management
  state machine (tracking backer configuration and sequence number) plus
  per-credential state machines (tracking issuance/revocation lifecycle).
version: "0.1.0"

source_material:
  - type: document
    reference: "acdc-specification.md -- Transaction Event Logs (TELs) as ACDC State Registries section"
  - type: document
    reference: "acdc-specification.md -- Binding to Key State at Time of ACDC State Change section"
  - type: implementation
    reference: "keripy -- src/keri/vdr/eventing.py: Tever class (sn, serder, ilk, baks, toad, vcState(), state()), VcStater.make(), VcStateRecord"
  - type: implementation
    reference: "keripy -- src/keri/vdr/eventing.py: RegStater.make(), RegStateRecord"
  - type: implementation
    reference: "keriox/teliox -- src/state.rs: TelState enum (NotIssued, Issued, Revoked), ManagerTelState struct"

ubiquitous_language:
  - term: "Credential State"
    definition: "The finite state machine tracking an ACDC's lifecycle within its registry TEL"
    invariants:
      - "States: NotIssued -> Issued -> Revoked (one-directional, no backtracking)"
      - "State is determined by replaying the credential's TEL events from inception"

  - term: "TEL Event Verifier"
    definition: "State machine tracking one registry's management TEL state and per-credential state"
    invariants:
      - "One instance per registry, keyed by REGID"
      - "Holds registry management state and exposes per-credential state queries"

domain_clients:
  - ref: "domain://acdc/tel"
    relationship: "Parent domain delegates credential and registry state tracking to this subdomain"
    via_port: "port://acdc/tel/state/inbound/state-query"

subdomains: []

kernels: []

adjacents: []

externals:
  - name: "Persistence (state snapshots)"
    abstraction: "Repository"
    ref: "port://acdc/tel/state/outbound/state-store"
    implementation_notes: "Read/write credential and registry state snapshots. Implementations: LMDB subdbs (.tets, .twes) in keripy Reger, TelEventDatabase trait in keriox"

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    State computation is a pure function of the TEL event sequence. Given the
    same TEL events in order, the resulting state is deterministic. In keripy,
    the Tever class holds both registry management state and per-credential
    state (via vcState() keyed by credential SAID). In keriox, TelState and
    ManagerTelState are separate types reflecting the two distinct state machines.
    State snapshots are persisted for fast lookup but can always be recomputed
    from the TEL.

issues: []

tags: ["state-machine", "credential-lifecycle", "registry-state", "state-reconstruction"]
