# verification.yaml
domain_ref: "acdc"

# Verification properties are language-agnostic invariants.
# Code examples use Python/pytest syntax for illustration — implementations
# in other languages should express equivalent assertions in their native testing framework.

properties:
  # ACDC Structure invariants
  - invariant: "Required fields [v, d, i, s] MUST all be present; if any is missing, the ACDC MUST be rejected"
    term: "ACDC"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=partial_acdc_strategy())
        def test_required_fields(acdc):
            required = ['v', 'd', 'i', 's']
            missing = [f for f in required if f not in acdc]
            if missing:
                with pytest.raises(ValidationError, match='missing required field'):
                    validate_acdc(acdc)
            else:
                # May fail for other reasons, but not for missing required fields
                try:
                    validate_acdc(acdc)
                except ValidationError as e:
                    assert 'missing required field' not in str(e)
    strategy: "partial_acdc_strategy() — generates dicts with random subsets of ACDC fields"
    notes: "Each of v, d, i, s is independently required. Missing any one is a fatal error."

  - invariant: "If both a field and A field are present and non-empty, the ACDC MUST be rejected (mutual exclusion)"
    term: "ACDC"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=acdc_strategy_with_both_a_and_A())
        def test_a_A_mutual_exclusion(acdc):
            has_a = 'a' in acdc and acdc['a'] is not None and acdc['a'] != ''
            has_A = 'A' in acdc and acdc['A'] is not None and acdc['A'] != ''
            if has_a and has_A:
                with pytest.raises(ValidationError, match='mutually exclusive'):
                    validate_acdc(acdc)
    strategy: "acdc_strategy_with_both_a_and_A() — generates ACDCs with both fields populated"
    notes: "An ACDC uses either direct disclosure (a) or selective disclosure (A), never both."

  - invariant: "The d field MUST equal the SAID computed by: (1) replace d with placeholder of same length, (2) compute most compact form depth-first, (3) serialize, (4) digest. If d != computed_said, reject."
    term: "ACDC"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=valid_acdc_strategy())
        def test_said_computation(acdc):
            # Step 1: Replace d with placeholder '#' * len(acdc['d'])
            placeholder = '#' * len(acdc['d'])
            acdc_copy = dict(acdc)
            acdc_copy['d'] = placeholder
            # Step 2: Compute most compact form (depth-first SAIDification of nested blocks)
            compacted = most_compact_form(acdc_copy)
            # Step 3: Serialize with canonical field ordering
            serialized = serialize(compacted)
            # Step 4: Digest
            computed_said = digest(serialized, algorithm=acdc['d'][0])  # first char = algo prefix
            assert acdc['d'] == computed_said
    strategy: "valid_acdc_strategy() — generates complete, valid ACDCs"
    notes: "SAID is self-referential: the d field is the digest of the serialization that contains d as a placeholder."

  - invariant: "Most compact form SAID computation order MUST be depth-first: SAIDify leaf blocks first, replace each with its SAID, then SAIDify parent blocks, repeat until root d field is computed"
    term: "ACDC"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=acdc_with_nested_blocks_strategy())
        def test_said_depth_first_order(acdc):
            # Compute SAIDs in wrong order (top-down) — must differ from correct result
            top_down_said = compute_said_top_down(acdc)
            # Compute SAIDs in correct order (bottom-up / depth-first)
            bottom_up_said = compute_said_depth_first(acdc)
            # If there are nested blocks, the two approaches MUST differ
            if has_nested_sad_blocks(acdc):
                assert top_down_said != bottom_up_said
            # The correct SAID matches the embedded d field
            assert acdc['d'] == bottom_up_said
    strategy: "acdc_with_nested_blocks_strategy() — generates ACDCs with nested a, e, r sections"
    notes: "Depth-first ordering is critical: leaf SAIDs feed into parent digests."

  - invariant: "All field maps MUST use insertion-ordered serialization; serialize(deserialize(serialize(x))) == serialize(x) for all supported serialization kinds (JSON, CBOR, MGPK)"
    term: "Field Map"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(fm=field_map_strategy(),
               kind=st.sampled_from(['JSON', 'CBOR', 'MGPK']))
        def test_field_map_roundtrip(fm, kind):
            serialized = serialize(fm, kind=kind)
            deserialized = deserialize(serialized, kind=kind)
            reserialized = serialize(deserialized, kind=kind)
            assert serialized == reserialized
    strategy: "field_map_strategy() x serialization kind"
    notes: "Round-trip serialization identity is required for SAID stability."

  - invariant: "Top-level field order MUST be [v, t, d, u, i, rd, s, a, A, e, r] when present; fields present but out of canonical order MUST be rejected because reordering changes the serialization and invalidates the SAID"
    term: "ACDC"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=valid_acdc_strategy())
        def test_field_order_canonical(acdc):
            canonical = ['v', 't', 'd', 'u', 'i', 'rd', 's', 'a', 'A', 'e', 'r']
            present = list(acdc.keys())
            expected = [k for k in canonical if k in acdc]
            assert present == expected
            # Verify: reordering breaks the SAID
            if len(present) >= 2:
                reordered = dict()
                for k in reversed(present):
                    reordered[k] = acdc[k]
                reordered_said = compute_said(reordered)
                assert reordered_said != acdc['d']
    strategy: "valid_acdc_strategy() — generates ACDCs with various field subsets"
    notes: "Canonical ordering is enforced by SAID integrity — wrong order = wrong digest."

  - invariant: "SAID MUST have >= 128 bits of cryptographic strength; the CESR code prefix determines the digest algorithm and MUST be one of the approved algorithms (E = Blake3-256, F = Blake2b-256, G = SHA3-256, etc.)"
    term: "SAID"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        # Approved SAID algorithms and their bit strengths
        algo_bits = {'E': 256, 'F': 256, 'G': 256, 'H': 256, '0H': 256}
        bit_strength = Int('bit_strength')
        is_approved = Bool('is_approved')
        s = Solver()
        s.add(is_approved == True)
        s.add(bit_strength >= 128)
        assert s.check() == sat
        # Prove: no approved algorithm has < 128 bits
        s2 = Solver()
        s2.add(is_approved == True, bit_strength < 128)
        assert s2.check() == unsat
    notes: "Minimum 128-bit strength. Current approved algorithms all provide 256 bits."

  - invariant: "The i field value MUST be a valid AID prefix with resolvable key state via KERI; if key state cannot be resolved, the ACDC MUST be escrowed (not rejected)"
    term: "Issuer"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=valid_acdc_strategy(), kel=optional_kel_strategy())
        def test_issuer_aid_resolvable(acdc, kel):
            aid = acdc['i']
            assert is_valid_aid_prefix(aid)
            if has_key_state(kel, aid):
                result = verify_issuer(acdc, kel)
                assert result.is_ok() or result.is_escrowed()
            else:
                result = verify_issuer(acdc, kel)
                assert result.is_escrowed()
                assert result.escrow_type == 'missing_issuer_kel'
    strategy: "valid_acdc_strategy() x optional_kel_strategy()"
    notes: "Missing issuer key state triggers escrow, not rejection."

  - invariant: "Schema MUST be a valid JSON Schema 2020-12 document; the $id field MUST equal the SAID of the schema content; if $id != computed SAID, reject the schema"
    term: "Schema"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(schema=json_schema_strategy())
        def test_schema_said_integrity(schema):
            computed = compute_said(schema)
            if schema.get('$id') != computed:
                with pytest.raises(ValidationError, match='schema SAID mismatch'):
                    validate_schema(schema)
            else:
                validate_schema(schema)  # Should not raise for SAID
    strategy: "json_schema_strategy() — generates schemas with correct and incorrect $id values"
    notes: "Schema self-addressing: $id == SAID(schema content)."

  - invariant: "Schema MUST NOT contain any remote or dynamic references ($ref with http/https/ftp URIs); all references MUST be local (fragment-only or same-document)"
    term: "Schema"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(schema=schema_with_refs_strategy())
        def test_schema_no_remote_refs(schema):
            refs = extract_all_refs(schema)
            for ref in refs:
                assert not ref.startswith('http://'), f"Remote ref forbidden: {ref}"
                assert not ref.startswith('https://'), f"Remote ref forbidden: {ref}"
                assert not ref.startswith('ftp://'), f"Remote ref forbidden: {ref}"
    strategy: "schema_with_refs_strategy() — generates schemas with various $ref types"
    notes: "Schemas must be completely self-contained — no mutable external dependencies."

  - invariant: "Version string MUST be the first field in the top-level ACDC field map; if 'v' is not the first key, reject the ACDC"
    term: "Version String"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=acdc_strategy_shuffled_keys())
        def test_version_string_first_field(acdc):
            keys = list(acdc.keys())
            if keys[0] != 'v':
                with pytest.raises(ValidationError, match='v must be first field'):
                    validate_acdc(acdc)
            else:
                # 'v' is first — should not fail for this reason
                try:
                    validate_acdc(acdc)
                except ValidationError as e:
                    assert 'v must be first field' not in str(e)
    strategy: "acdc_strategy_shuffled_keys() — generates ACDCs with 'v' at various positions"
    notes: "The 'v' field enables version string sniffing for stream parsing."

  - invariant: "Version string format MUST match PPPPMmmGggKKKKSSSS_ where PPPP='ACDC'; M and mm encode major.minor version; KKKK encodes serialization kind (JSON, CBOR, MGPK, CESR); SSSS encodes body size in Base64"
    term: "Version String"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=valid_acdc_strategy())
        def test_version_string_format(acdc):
            v = acdc['v']
            assert v[:4] == 'ACDC', f"Protocol must be ACDC, got {v[:4]}"
            assert len(v) in (17, 19), f"Version string length must be 17 or 19, got {len(v)}"
            assert v[-1] == '_', f"Version string must end with underscore terminator"
            # Kind must be one of the valid serialization kinds
            kind = v[12:16] if len(v) == 19 else v[10:14]
            assert kind in ('JSON', 'CBOR', 'MGPK', 'CESR'), f"Invalid kind: {kind}"
    strategy: "valid_acdc_strategy()"
    notes: "Version string is a parseable, regexable protocol identifier."

  - invariant: "UUID field (u) MUST have cryptographic strength >= 128 bits when present; for a private ACDC the u field MUST be non-empty; for a metadata ACDC the u field MUST be present but empty string"
    term: "UUID"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=acdc_with_uuid_strategy())
        def test_uuid_entropy_requirement(acdc):
            if 'u' not in acdc:
                return  # Public ACDC — no UUID
            u = acdc['u']
            if u == '':
                pass  # Metadata ACDC — empty UUID is valid
            else:
                # Private ACDC — UUID must have >= 128 bits entropy
                raw = decode_cesr(u)
                assert len(raw) * 8 >= 128, f"UUID has {len(raw)*8} bits, need >= 128"
    strategy: "acdc_with_uuid_strategy() — generates public, private, and metadata ACDCs"
    notes: "128-bit minimum prevents rainbow table attacks on blinded SAIDs."

  - invariant: "An edge MUST contain a node (n) field pointing to the SAID of the far-node ACDC; an edge-group MUST NOT contain an n field — presence of n distinguishes edges from edge-groups"
    term: "Edge Section"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(edge_section=edge_section_strategy())
        def test_edge_vs_edge_group(edge_section):
            for key, value in edge_section.items():
                if key in ('d', 'u', 'o'):
                    continue  # Reserved edge-group fields
                if isinstance(value, dict):
                    if 'n' in value:
                        # This is an edge — n must be a valid SAID
                        assert is_valid_said(value['n']), f"Edge n field must be a valid SAID"
                    else:
                        # This is an edge-group — verify no n field
                        assert 'n' not in value, "Edge-groups must not have n field"
    strategy: "edge_section_strategy() — generates edge sections with edges and edge-groups"
    notes: "The n field is the key structural discriminator between edges and edge-groups."

  - invariant: "I2I operator: the issuer AID of the near-node ACDC MUST equal the issuee AID (a.i) of the far-node ACDC; if near.i != far.a.i, the edge validation MUST fail"
    term: "Edge Operator"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(near=valid_acdc_strategy(), far=valid_targeted_acdc_strategy())
        def test_i2i_chain_integrity(near, far):
            edge_op = 'I2I'
            if near['i'] == far['a']['i']:
                assert validate_edge_operator(near, far, edge_op)
            else:
                assert not validate_edge_operator(near, far, edge_op)
    strategy: "valid_acdc_strategy() x valid_targeted_acdc_strategy()"
    notes: "I2I enforces delegation chain: issuer of child = issuee of parent."

  - invariant: "NI2I operator (default for untargeted far-node): no issuer-to-issuee constraint — the edge is valid if the far-node ACDC exists and its SAID matches"
    term: "Edge Operator"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(near=valid_acdc_strategy(), far=valid_untargeted_acdc_strategy())
        def test_ni2i_no_chain_constraint(near, far):
            edge_op = 'NI2I'
            # NI2I only requires far-node existence and SAID match
            assert validate_edge_operator(near, far, edge_op)
    strategy: "valid_acdc_strategy() x valid_untargeted_acdc_strategy()"
    notes: "NI2I is the default for untargeted far-nodes — no chain constraint."

  - invariant: "Default m-ary operator for edge-groups MUST be AND: all edges in the group MUST be independently valid for the group to be valid"
    term: "Edge Operator"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(edge_group=edge_group_strategy())
        def test_default_edge_group_and(edge_group):
            if 'o' not in edge_group:
                # Default is AND
                edges = [v for k, v in edge_group.items() if k not in ('d', 'u', 'o')]
                result = validate_edge_group(edge_group)
                # AND: result is valid iff ALL edges are valid
                all_valid = all(validate_edge(e) for e in edges)
                assert result == all_valid
    strategy: "edge_group_strategy() — generates edge-groups with multiple edges"
    notes: "AND is the implicit operator when no 'o' field is specified."

  - invariant: "Valid section combinations: an ACDC MAY have [a], [A], [a,e], [A,e], [a,r], [A,r], [a,e,r], [A,e,r], or none of [a,A,e,r]; but MUST NOT have [a,A] together"
    term: "ACDC"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(sections=st.fixed_dictionaries({
            'a': st.one_of(st.none(), st.just({'d': 'E...', 'i': 'D...'})),
            'A': st.one_of(st.none(), st.just('E...')),
            'e': st.one_of(st.none(), st.just({'d': 'E...'})),
            'r': st.one_of(st.none(), st.just({'d': 'E...'}))}))
        def test_valid_section_combinations(sections):
            has_a = sections['a'] is not None
            has_A = sections['A'] is not None
            if has_a and has_A:
                # Invalid combination
                with pytest.raises(ValidationError, match='mutually exclusive'):
                    build_acdc_with_sections(sections)
            else:
                # All other combinations are valid
                acdc = build_acdc_with_sections(sections)
                assert acdc is not None
    strategy: "st.fixed_dictionaries with optional sections"
    notes: "The only forbidden combination is a + A simultaneously."

  - invariant: "Credential Verifier MUST escrow credentials missing dependencies with per-type timeout of 3600 seconds: missing registry (MRE), missing chain (MCE), missing schema (MSE), missing signatures (CMSE)"
    term: "Credential Verifier"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(missing_type=st.sampled_from(['registry', 'chain', 'schema', 'signatures']))
        def test_credential_verifier_escrow_types(missing_type):
            acdc = build_valid_acdc()
            verifier = CredentialVerifier(timeout=3600)
            if missing_type == 'registry':
                result = verifier.verify(acdc, registry_tel=None)
                assert result.escrow_type == 'MRE'
            elif missing_type == 'chain':
                result = verifier.verify(acdc, chain_links=None)
                assert result.escrow_type == 'MCE'
            elif missing_type == 'schema':
                result = verifier.verify(acdc, schema=None)
                assert result.escrow_type == 'MSE'
            elif missing_type == 'signatures':
                result = verifier.verify(acdc, signatures=None)
                assert result.escrow_type == 'CMSE'
            assert result.timeout == 3600
    strategy: "st.sampled_from for each missing dependency type"
    notes: "Four escrow types, each with 3600s timeout. After timeout, the escrowed credential is discarded."

  - invariant: "Credential Verifier MUST verify in this order: (1) signatures, (2) schema compliance, (3) TEL state, (4) edge chain integrity. If any step fails with a resolvable dependency, escrow to the appropriate queue."
    term: "Credential Verifier"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=valid_acdc_strategy())
        def test_verification_order(acdc):
            verifier = CredentialVerifier()
            steps = verifier.get_verification_steps(acdc)
            assert steps == ['signatures', 'schema', 'tel_state', 'edge_chain']
    strategy: "valid_acdc_strategy()"
    notes: "Verification order is normative. Signatures first (cheapest filter), edge chains last (most expensive)."

  # Boundary condition invariants
  - invariant: "An ACDC with no optional sections (no a, A, e, r) MUST still be valid if required fields [v, d, i, s] are present — this is a bare credential"
    term: "ACDC"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(issuer=aid_strategy(), schema=said_strategy())
        def test_bare_acdc_valid(issuer, schema):
            acdc = {'v': 'ACDC10JSON000000_', 'd': '', 'i': issuer, 's': schema}
            acdc['d'] = compute_said(acdc)
            result = validate_acdc_structure(acdc)
            assert result.is_ok()
    strategy: "aid_strategy() x said_strategy()"
    notes: "Minimal valid ACDC has only required fields."

  - invariant: "An ACDC with an empty key list {} after removing reserved fields MUST be valid — the credential has no application-specific data"
    term: "Attribute Section"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(acdc=valid_acdc_strategy())
        def test_empty_attribute_section(acdc):
            # Attribute section with only reserved fields (d, u, i) and no app fields
            acdc['a'] = {'d': ''}
            acdc['a']['d'] = compute_said(acdc['a'])
            result = validate_attribute_section(acdc['a'])
            assert result.is_ok()
    strategy: "valid_acdc_strategy()"
    notes: "An attribute section with only its SAID field is structurally valid."

  - invariant: "Aggregate section AGID computation: AGID = digest([AGID_placeholder, SAID_1, ..., SAID_N]) where each SAID_i is the SAID of the i-th blinded attribute block"
    term: "Aggregate Section"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(blocks=st.lists(blinded_attribute_block_strategy(), min_size=1, max_size=10))
        def test_agid_computation(blocks):
            saids = [compute_said(block) for block in blocks]
            placeholder = '#' * 44  # SAID placeholder length
            agid_input = [placeholder] + saids
            agid = digest(serialize(agid_input))
            # Verify: changing any block's SAID changes the AGID
            for i in range(len(saids)):
                modified_saids = list(saids)
                modified_saids[i] = compute_said({'d': '', 'u': generate_uuid(), 'different': True})
                modified_input = [placeholder] + modified_saids
                modified_agid = digest(serialize(modified_input))
                assert modified_agid != agid
    strategy: "st.lists(blinded_attribute_block_strategy(), 1..10)"
    notes: "AGID binds all selectively-disclosable blocks into a single commitment."

contracts:
  - port_ref: "port://acdc/inbound/credential-lifecycle"
    preconditions:
      - formal:
          language: python
          expression: |
            lambda issuer_aid, schema, attributes: (
                is_valid_aid(issuer_aid)
                and is_valid_said(schema)
                and isinstance(attributes, dict)
            )
        description: "Issuer AID must be valid, schema must be a valid SAID, attributes must be a dict"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda result: (
                result.d == compute_said(result)
                and result.i == issuer_aid
                and result.s == schema
                and all(f in result for f in ['v', 'd', 'i', 's'])
                and list(result.keys())[0] == 'v'
            )
        description: "Issued ACDC has correct SAID, issuer, schema binding, required fields, and v is first"

  - port_ref: "port://acdc/inbound/schema-management"
    preconditions:
      - formal:
          language: python
          expression: |
            lambda schema: (
                is_valid_json_schema(schema)
                and schema.get('$id') == compute_said(schema)
                and all(not ref.startswith('http') for ref in extract_all_refs(schema))
            )
        description: "Schema must be valid JSON Schema 2020-12 with self-addressing $id and no remote refs"
    postconditions:
      - formal:
          language: python
          expression: "lambda result: result == compute_said(schema)"
        description: "Returned SAID matches the schema's computed digest"

  - port_ref: "port://acdc/outbound/kel-anchoring"
    preconditions:
      - formal:
          language: python
          expression: |
            lambda aid, seal_digest: (
                is_valid_aid(aid)
                and isinstance(seal_digest, str)
                and len(seal_digest) > 0
                and is_valid_said(seal_digest)
            )
        description: "AID must be valid and seal digest must be a non-empty valid SAID"
    postconditions:
      - formal:
          language: python
          expression: "lambda result: seal_digest in result.anchors and result.t == 'ixn'"
        description: "Returned interaction event contains the seal digest in its anchor field"

  - port_ref: "port://acdc/inbound/credential-verification"
    preconditions:
      - formal:
          language: python
          expression: |
            lambda acdc: (
                all(f in acdc for f in ['v', 'd', 'i', 's'])
                and not ('a' in acdc and acdc['a'] and 'A' in acdc and acdc['A'])
            )
        description: "ACDC has required fields and no a/A conflict"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda acdc, result: (
                result.status in ('verified', 'escrowed_mre', 'escrowed_mce',
                                  'escrowed_mse', 'escrowed_cmse', 'rejected')
            )
        description: "Verification returns one of the defined outcome states"
