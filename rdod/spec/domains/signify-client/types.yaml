domain_ref: "signify-client"

types:
  - name: "SignifyAuth"
    description: "HTTP Signature authentication for Signify client requests to KERIA. Implements RFC 9421 HTTP Message Signatures."
    variants:
      - name: "default"
        fields:
          - name: "signature"
            type: "string"
            required: true
            description: "RFC 9421 Signature header value"
          - name: "signature_input"
            type: "string"
            required: true
            description: "RFC 9421 Signature-Input header value"
          - name: "signify_resource"
            type: "AID"
            required: true
            description: "The controller AID making the request"
          - name: "signify_timestamp"
            type: "DateTime"
            required: true
            description: "Request timestamp for KRAM timeliness"
        invariants:
          - "Signature covers: @method, @path, Signify-Resource, Signify-Timestamp"
          - "Signed by the controller's current keys (key state at time of request)"
          - "Timestamp must be monotonically increasing per controller (KRAM)"

  - name: "KeyTier"
    description: "Security tier for key derivation — determines the argon2 stretching parameters."
    variants:
      - name: "low"
        fields:
          - name: "ops_limit"
            type: "integer"
            required: true
            constraints:
              enum: [2]
          - name: "mem_limit"
            type: "integer"
            required: true
            constraints:
              enum: [67108864]
        invariants:
          - "Fast derivation, lower security — suitable for development/testing"
      - name: "med"
        fields:
          - name: "ops_limit"
            type: "integer"
            required: true
            constraints:
              enum: [3]
          - name: "mem_limit"
            type: "integer"
            required: true
            constraints:
              enum: [268435456]
        invariants:
          - "Balanced derivation — default for production"
      - name: "high"
        fields:
          - name: "ops_limit"
            type: "integer"
            required: true
            constraints:
              enum: [4]
          - name: "mem_limit"
            type: "integer"
            required: true
            constraints:
              enum: [1073741824]
        invariants:
          - "Slow derivation, maximum security — for high-value keys"

  - name: "Operation"
    description: "A long-running operation tracked by KERIA. Clients poll for completion. Operations span witness receipt collection, multisig coordination, delegation approval, OOBI resolution, and credential issuance."
    variants:
      - name: "default"
        fields:
          - name: "name"
            type: "string"
            required: true
            description: "Unique operation identifier"
          - name: "done"
            type: "boolean"
            required: true
            description: "Whether the operation has completed"
          - name: "metadata"
            type: "map"
            required: true
            description: "Operation-specific metadata (AID, sn, depends on type)"
          - name: "response"
            type: "map"
            required: false
            description: "Result payload — present only when done=true"
          - name: "error"
            type: "map"
            required: false
            description: "Error details — present only when done=true and failed"
            constraints:
              fields: ["code", "message", "details"]
          - name: "type"
            type: "string"
            required: true
            description: "Operation type determining completion check"
            constraints:
              enum: ["oobi", "witness", "delegation", "group", "query", "registry", "credential", "endrole", "done"]
        invariants:
          - "Poll via GET /operations/{name} — returns 200 (done) or 202 (pending)"
          - "response is present only when done=true and error is absent"
          - "error is present only when done=true and response is absent"
          - "Operations persist across agent restarts"
