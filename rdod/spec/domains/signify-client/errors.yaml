domain_ref: "signify-client"

errors:
  - name: "AgentConnectionError"
    description: "Cannot connect to the cloud agent"
    cause: "The KERIA agent endpoint is unreachable or returned an unexpected error"
    recovery: "retry"
    severity: "transient"
    context:
      - field: "agent_url"
        type: "string"
        description: "The agent endpoint URL"
      - field: "reason"
        type: "string"
        description: "Connection failure reason"

  - name: "SignifyAuthError"
    description: "Signify authentication failed — agent rejected the signed request"
    cause: "The HTTP signature headers (Signature, Signature-Input) did not verify against the controller's AID"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "controller_aid"
        type: "string"
        description: "The controller AID"
      - field: "reason"
        type: "string"
        description: "Auth failure details"
