# verification.yaml
domain_ref: "signify-client/resources"

# Verification properties are language-agnostic invariants.
# Code examples use Python/pytest syntax for illustration — implementations
# in other languages should express equivalent assertions in their native testing framework.

# Formalized invariants from ubiquitous_language terms
properties:
  - invariant: "All mutating resource operations return pollable operation handles"
    term: "Operation"
    technique: property-based
    formal:
      language: pseudocode
      expression: |
        for each mutating_operation in [
          create_identifier(alias="test", wits=[], toad=0),
          rotate(aid="EDP1..."),
          issue_credential(registry="reg", schema="SAID", recipient="AID", data={}),
          create_registry(aid="EDP1...", name="reg"),
          add_end_role(aid="EDP1...", role="agent", eid="AID"),
          resolve_oobi(url="http://example.com/oobi/...")
        ]:
          result = execute(mutating_operation)
          # The operation handle must be pollable by name
          op_name = result.operation.name
          assert op_name matches pattern "{type}.{oid}"
          # Polling the operation by name must return a consistent status
          status = client.operations().get(op_name)
          assert status.name == op_name
          # The status must eventually resolve to done=true (success or error)
          # This is the behavioral contract — not just a type check
          final_status = poll_until_done(op_name, timeout=reasonable_duration)
          assert final_status.done == true
          assert final_status.response is not null OR final_status.error is not null
    strategy: "All mutating resource operations exercised through the poll-to-completion lifecycle"
    notes: "Behavioral contract — operation handles are not just data structures, they are pollable references that resolve to completion"

  - invariant: "Operations are pollable by name and resolve to a consistent terminal state"
    term: "Operation"
    technique: property-based
    formal:
      language: pseudocode
      expression: |
        for any existing operation name op_name:
          status = client.operations().get(op_name)
          assert status.name == op_name
          # The status must be in one of two states: done or not done
          if status.done:
            # Terminal state must carry either a response or an error, never both
            assert (status.response is not null) XOR (status.error is not null)
          else:
            # In-progress state carries no final result
            assert status.response is null
            assert status.error is null
          # Polling the same operation again must return a consistent result
          status2 = client.operations().get(op_name)
          assert status2.name == op_name
          # Once done, it stays done (no regression)
          if status.done:
            assert status2.done == true
    strategy: "Existing operation names, verified by polling consistency and terminal state invariants"
    notes: "Operations are polled by name — terminal state is immutable and self-consistent"

  - invariant: "The controller AID's KEL is the trust anchor for the entire agent relationship"
    term: "Controller AID"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(
            method=st.sampled_from(['GET', 'POST', 'PUT', 'DELETE']),
            path=st.text(min_size=1, max_size=100)
        )
        def test_controller_aid_is_trust_anchor(method, path):
            # All KRAM headers reference the controller AID
            headers = client.sign_request(method, path, b'')
            assert client.controller_aid in headers['Signify-Resource']
            # Rotating controller AID rotates the authentication relationship
            old_aid = client.controller_aid
            client.rotate_controller()
            new_headers = client.sign_request(method, path, b'')
            assert old_aid not in new_headers['Signify-Resource']
    strategy: "st.sampled_from for HTTP methods, st.text for paths"
    notes: "Controller AID is the authentication anchor — all KRAM headers reference it"

  - invariant: "create() returns a usable AID and a pollable witness-receipting operation"
    term: "Identifier Resource"
    technique: property-based
    formal:
      language: pseudocode
      expression: |
        for any alias, witness list wits, toad where toad <= length(wits):
          result = client.identifiers().create(alias, wits=wits, toad=toad)
          # The AID must be a valid CESR-qualified prefix
          assert is_valid_cesr_prefix(result.aid)
          # The operation handle must be pollable and track witness receipting
          assert result.operation.name starts with "witness."
          status = client.operations().get(result.operation.name)
          assert status.name == result.operation.name
          # The identifier must be retrievable by alias after creation
          retrieved = client.identifiers().get(alias)
          assert retrieved.prefix == result.aid
    strategy: "Valid alias strings, witness lists, and toad values — verified by AID usability and operation pollability"
    notes: "create() produces a working AID and a trackable operation, not just structural fields"

  - invariant: "Issuance produces a credential SAID and a pollable TEL-anchoring operation"
    term: "Credential Resource"
    technique: property-based
    formal:
      language: pseudocode
      expression: |
        for any valid schema_said, recipient:
          result = client.credentials().issue(
              name="test", registry_name="reg",
              schema_said=schema_said, recipient=recipient, data={}
          )
          # The operation must track credential + TEL anchoring
          assert result.operation.name starts with "credential."
          # The operation must be pollable through to completion
          status = client.operations().get(result.operation.name)
          assert status.name == result.operation.name
          # When done, the credential must be retrievable
          final = poll_until_done(result.operation.name, timeout=reasonable_duration)
          if final.done and final has no error:
            credential = client.credentials().get(result.credential_said)
            assert credential is not null
            assert credential.schema == schema_said
    strategy: "Valid CESR-qualified SAIDs and AIDs — verified through poll-to-completion and credential retrieval"
    notes: "Credential issuance is always async — verified by tracking the operation to completion and retrieving the result"

  - invariant: "Credential issuance requires a registry — issuing without one fails with a clear error"
    term: "Credential Resource"
    technique: property-based
    formal:
      language: pseudocode
      expression: |
        for any valid schema_said, recipient:
          # Attempt to issue without creating a registry first
          result = client.credentials().issue(
              name="test", registry_name="nonexistent",
              schema_said=schema_said, recipient=recipient, data={}
          )
          assert result is an error indicating the registry was not found
          # After creating a registry, the same issuance succeeds
          client.registries().create(name="reg", aid="EDP1...")
          result2 = client.credentials().issue(
              name="test", registry_name="reg",
              schema_said=schema_said, recipient=recipient, data={}
          )
          assert result2.operation is not null
          assert result2.operation.name starts with "credential."
        # The behavioral guarantee: registry is a hard prerequisite,
        # not just a convention. The system enforces ordering.
    strategy: "Valid SAIDs/AIDs with and without pre-existing registries"
    notes: "Registry creation is a prerequisite for credential issuance — enforced by the system, not just documented"

  - invariant: "Only the eleven defined roles are accepted — arbitrary role strings are rejected"
    term: "End-Role"
    technique: property-based
    formal:
      language: pseudocode
      expression: |
        # 11 valid roles per keripy Rolage definition (kering.py)
        valid_roles = {witness, controller, agent, watcher, registrar, gateway, judge, juror, peer, mailbox, indexer}
        # Note: 'mediator' is specified in some KERI documents but is NOT in the current keripy implementation.
        # Note: 'mediator' should be treated as an open question pending KSWG clarification.
        for any role string:
          if role in valid_roles:
            # Valid role is accepted and persisted
            result = client.identifiers().addEndRole("test", role, "EID...")
            assert result.operation is not null
            # The role authorization is observable after completion
            roles = client.identifiers().listEndRoles("test")
            assert role appears in roles
          else:
            # Invalid role is rejected — no state change occurs
            result = client.identifiers().addEndRole("test", role, "EID...")
            assert result is an error indicating invalid role
            roles = client.identifiers().listEndRoles("test")
            assert role does not appear in roles
        # The behavioral guarantee: the valid role set is closed.
        # Arbitrary strings outside the defined roles are rejected.
    strategy: "Both valid roles and arbitrary strings — verified by role persistence and rejection"
    notes: |
      keripy defines 11 roles: witness, controller, agent, watcher, registrar, gateway, judge, juror, peer, mailbox, indexer.
      'mediator' appears in some spec documents but is absent from the keripy implementation — flag as open question.
      Implementations MUST reject arbitrary role strings not in the defined set.

  - invariant: "All resource operations require KRAM-authenticated requests — unsigned requests are rejected"
    term: "Controller AID"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(
            method=st.sampled_from(['GET', 'POST', 'PUT', 'DELETE']),
            path=st.sampled_from(['/identifiers', '/credentials', '/contacts', '/notifications', '/operations'])
        )
        def test_all_resources_require_kram(method, path):
            # Request without KRAM headers must be rejected by the cloud agent
            response = raw_http_request(method, path, headers={})
            assert response.status_code == 401
    strategy: "st.sampled_from for HTTP methods and resource paths"
    notes: "All resource endpoints reject unauthenticated requests"

# Formalized port contracts
contracts:
  - port_ref: "port://signify-client/resources/inbound/resource-ops"
    preconditions:
      - formal:
          language: python
          expression: "lambda: client.session_active"
        description: "All resource operations require an active session (keys unlocked)"
      - formal:
          language: pseudocode
          expression: "alias is not null AND length(alias) > 0"
        description: "create_identifier requires a non-empty alias"
      - formal:
          language: python
          expression: "lambda registry, schema, recipient, data: registry is not None and schema is not None and data is not None"
        description: "issue_credential requires registry, schema SAID, and credential data"
    postconditions:
      - formal:
          language: pseudocode
          expression: |
            (result.operation is not null AND result.operation.name matches "{type}.{oid}")
            OR (result is iterable AND each element has an identifiable prefix/said)
            OR (result contains resource-specific fields for the requested resource type)
        description: "Mutating operations return pollable operation handles; list/get operations return resource data"
      - formal:
          language: python
          expression: |
            lambda aid, operation:
                operation.name.startswith(('witness.', 'delegation.', 'group.', 'credential.', 'registry.', 'endrole.', 'oobi.'))
        description: "Returned operation names follow the {type}.{oid} naming convention"

  - port_ref: "port://signify-client/resources/outbound/cloud-agent-comms"
    preconditions:
      - formal:
          language: python
          expression: "lambda method, path, body, headers: 'Signature' in headers and 'Signify-Resource' in headers"
        description: "All outbound requests must include KRAM signature and resource headers"
      - formal:
          language: python
          expression: "lambda inception_event: is_valid_inception(inception_event)"
        description: "boot requires a valid inception event"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda inception_event, config:
                config.agent_id is not None
                and config.controller_aid == inception_event.pre
        description: "boot returns AgentConfig with valid agent_id and matching controller_aid"
      - formal:
          language: pseudocode
          expression: |
            status.name == name
            AND (status.done == true OR status.done == false)
            AND (status.done implies status.response is not null OR status.error is not null)
        description: "poll_operation returns a consistent status for the named operation"

# No state machine — resource operations are stateless request/response
# (the operation lifecycle state machine is in cloud-agent-service/processing)
state_machines: []
