domain_ref: "signify-client/resources"

errors:
  - name: "AgentConnectionError"
    description: "Cannot connect to the cloud agent"
    cause: "The KERIA agent endpoint is unreachable or returned an unexpected error"
    recovery: "retry"
    severity: "transient"
    context:
      - field: "agent_url"
        type: "string"
        description: "The agent endpoint URL"
      - field: "reason"
        type: "string"
        description: "Connection failure reason"

  - name: "SignifyAuthError"
    description: "Signify authentication failed — agent rejected the signed request"
    cause: "The HTTP signature headers (Signature, Signature-Input) did not verify against the controller's AID"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "controller_aid"
        type: "string"
        description: "The controller AID"
      - field: "reason"
        type: "string"
        description: "Auth failure details"

  - name: "ResourceNotFoundError"
    description: "Requested resource does not exist on the agent"
    cause: "GET request for an identifier, credential, or other resource that has not been created"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "resource_type"
        type: "string"
        description: "Type of resource (identifier, credential, registry, contact)"
      - field: "resource_id"
        type: "string"
        description: "The identifier or name of the missing resource"

  - name: "OperationTimeoutError"
    description: "Long-running operation did not complete within the polling timeout"
    cause: "Polled GET /operations/{name} repeatedly but done never became true before timeout"
    recovery: "retry"
    severity: "transient"
    context:
      - field: "operation_name"
        type: "string"
        description: "The operation that timed out"
      - field: "operation_type"
        type: "string"
        description: "Type: witness, delegation, group, query, etc."
