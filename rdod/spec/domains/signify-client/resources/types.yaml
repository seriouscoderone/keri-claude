domain_ref: "signify-client/resources"

types:
  - name: "OperationStatus"
    description: "Current status of a long-running operation polled by the Signify client."
    variants:
      - name: "default"
        fields:
          - name: "name"
            type: "string"
            required: true
            description: "Unique operation identifier"
          - name: "done"
            type: "boolean"
            required: true
            description: "Whether the operation has completed"
          - name: "operation_type"
            type: "string"
            required: true
            description: "Category of long-running operation — determines the expected result schema"
            constraints:
              enum: ["oobi", "witness", "delegation", "group", "query", "registry", "credential", "endrole", "done"]
          - name: "result"
            type: "map"
            required: false
            description: "Operation result payload (present only when done and successful)"
          - name: "error"
            type: "map"
            required: false
            description: "Error details when the operation failed — contains code (int), message (string), and optional details (map)"
        invariants:
          - "Clients poll GET /operations/{name} until done is true"
          - "result and error are both absent while done is false"
          - "When done=true, exactly one of result or error is present (XOR)"
          - "error.code follows HTTP status code conventions (e.g., 408 for timeout, 404 for not found)"

  - name: "AgentConfig"
    description: "Connection configuration for a Signify client to reach its cloud agent."
    variants:
      - name: "default"
        fields:
          - name: "agent_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The cloud agent's AID"
          - name: "admin_url"
            type: "string"
            required: true
            description: "URL of the agent's admin API (port 3901)"
          - name: "boot_url"
            type: "string"
            required: true
            description: "URL of the agent's boot endpoint (port 3903)"
        invariants:
          - "admin_url is used for all authenticated API requests"
          - "boot_url is used only for initial agent provisioning"
