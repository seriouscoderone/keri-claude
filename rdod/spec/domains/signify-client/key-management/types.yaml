domain_ref: "signify-client/key-management"

types:
  - name: "KeyTier"
    description: "Security tier for Argon2 key derivation — determines the ops_limit and mem_limit parameters. Higher tier means more security and slower passcode unlock."
    variants:
      - name: "low"
        fields:
          - name: "ops_limit"
            type: "integer"
            required: true
            constraints:
              enum: [2]
          - name: "mem_limit"
            type: "integer"
            required: true
            constraints:
              enum: [67108864]
        invariants:
          - "Fast derivation, lower security — suitable for development/testing only"
          - "Tier is set at keeper creation and is immutable — changing tier requires re-creating the keeper"
          - "Implementations MUST NOT allow callers to customize Argon2 parameters beyond tier selection"
      - name: "med"
        fields:
          - name: "ops_limit"
            type: "integer"
            required: true
            constraints:
              enum: [3]
          - name: "mem_limit"
            type: "integer"
            required: true
            constraints:
              enum: [268435456]
        invariants:
          - "Balanced derivation — recommended default for production deployments"
          - "Tier is set at keeper creation and is immutable — changing tier requires re-creating the keeper"
          - "Implementations MUST NOT allow callers to customize Argon2 parameters beyond tier selection"
      - name: "high"
        fields:
          - name: "ops_limit"
            type: "integer"
            required: true
            constraints:
              enum: [4]
          - name: "mem_limit"
            type: "integer"
            required: true
            constraints:
              enum: [1073741824]
        invariants:
          - "Slow derivation, maximum security — for high-value keys"
          - "Tier is set at keeper creation and is immutable — changing tier requires re-creating the keeper"
          - "Implementations MUST NOT allow callers to customize Argon2 parameters beyond tier selection"

  - name: "SignifyAuth"
    description: "KRAM (Key Rate-limited Authentication Method) headers produced by the Signify edge client for every admin API request. Cryptographically binds the HTTP request to the controller's current signing keys."
    variants:
      - name: "default"
        fields:
          - name: "signify_resource"
            type: "string"
            required: true
            description: "The Signify-Resource header — the controller's AID that authenticates this request"
          - name: "signify_timestamp"
            type: "string"
            required: true
            description: "The Signify-Timestamp header — ISO 8601 datetime with microsecond precision"
          - name: "signature"
            type: "string"
            required: true
            description: "The Signature header — CESR-encoded Ed25519 signature over the signed components"
          - name: "signature_input"
            type: "string"
            required: true
            description: "The Signature-Input header — describes which components were included in the signature"
        invariants:
          - "Signature covers HTTP method, path, body digest, and signify_timestamp"
          - "signify_timestamp must be within the KRAM timeliness window (implementation-configurable)"
          - "signify_resource must be a valid AID registered as a controller on the target agent"
          - "signature must verify against the controller's current signing keys at the stated signify_resource"
          - "A different request body with the same headers is rejected — binding is cryptographic, not structural"

  - name: "Keeper"
    description: "Key management strategy for a Signify edge client. Determines how signing keys are generated, stored, and rotated. Four variants for different security/convenience tradeoffs."
    variants:
      - name: "salty"
        fields:
          - name: "salt"
            type: "string"
            required: true
            description: "CESR-qualified salt (Salt qb64) — the root secret"
          - name: "tier"
            type: "types://signify-client/key-management#KeyTier"
            required: true
            description: "Argon2 stretching tier (low/med/high)"
          - name: "stem"
            type: "string"
            required: true
            description: "Derivation path stem for hierarchical key generation"
          - name: "signing_indices"
            type: "array[integer]"
            required: true
            description: "Which key indices to use for signing"
          - name: "rotation_indices"
            type: "array[integer]"
            required: true
            description: "Which key indices to use for next key commitments"
        invariants:
          - "Deterministic: same salt + tier + stem + indices produces same keys"
          - "Salt is encrypted at rest with passcode-derived key"
          - "Keys never leave the edge device"
      - name: "randy"
        fields:
          - name: "signing_keys"
            type: "array[bytes]"
            required: true
            description: "Random private signing keys"
          - name: "next_keys"
            type: "array[bytes]"
            required: true
            description: "Random private next keys (for pre-rotation)"
        invariants:
          - "Non-deterministic: keys are randomly generated"
          - "Private keys stored encrypted"
          - "No recovery from lost keys — no derivation path"
      - name: "group"
        fields:
          - name: "member_keeper"
            type: "types://signify-client/key-management#Keeper"
            required: true
            description: "This member's individual keeper (salty or randy)"
          - name: "group_aid"
            type: "string"
            required: true
            description: "The group identifier this member contributes to"
          - name: "local_member_index"
            type: "integer"
            required: true
            description: "This member's key index within the group"
        invariants:
          - "Group signing produces partial signatures at the local member's index"
          - "Threshold satisfaction requires coordination across multiple group members"
      - name: "extern"
        fields:
          - name: "provider"
            type: "string"
            required: true
            description: "External key provider identifier (HSM, cloud KMS, etc.)"
        invariants:
          - "Keys are managed externally — Signify client delegates signing to the provider"
          - "No private key material stored locally"
          - "Implemented in keripy (keeping.py) and signifypy (keeping.py) via dynamic module loading"
          - "Not yet implemented in signify-ts — currently supports salty, randy, and group only"

  - name: "SessionState"
    description: "The authenticated session between a Signify client and its cloud agent."
    variants:
      - name: "default"
        fields:
          - name: "controller_aid"
            type: "string"
            required: true
            description: "The controller's AID"
          - name: "agent_aid"
            type: "string"
            required: true
            description: "The cloud agent's AID"
          - name: "agent_url"
            type: "string"
            required: true
            description: "The agent's admin API URL"
          - name: "passcode_active"
            type: "boolean"
            required: true
            description: "Whether the passcode is currently unlocked in memory"
          - name: "passcode_timeout"
            type: "integer"
            required: false
            description: "Seconds until passcode is zeroed from memory"
        invariants:
          - "All requests to agent_url are signed with controller's current keys"
          - "When passcode_active is false, signing operations fail until re-authenticated"

  - name: "EncryptedSalt"
    description: "The master salt encrypted with a passcode-derived key. Stored on the cloud agent for salty keepers."
    variants:
      - name: "default"
        fields:
          - name: "ciphertext"
            type: "bytes"
            required: true
            description: "Encrypted salt bytes"
          - name: "algorithm"
            type: "string"
            required: true
            description: "Encryption algorithm used (e.g., X25519-XSalsa20-Poly1305)"
        invariants:
          - "Decryption requires the passcode — only the edge client can decrypt"
          - "Salt is the root secret for all salty key derivation"

  - name: "EncryptedKey"
    description: "A single encrypted private key with its position index."
    variants:
      - name: "default"
        fields:
          - name: "ciphertext"
            type: "bytes"
            required: true
            description: "Encrypted private key bytes"
          - name: "key_index"
            type: "integer"
            required: true
            description: "Position of this key in the key list"
            constraints:
              min: 0
        invariants:
          - "Decryption requires the keeper's encryption key"
          - "key_index corresponds to the signing or rotation index"

  - name: "EncryptedKeyPair"
    description: "Paired set of encrypted current and next private keys for a randy keeper."
    variants:
      - name: "default"
        fields:
          - name: "current"
            type: "array[types://signify-client/key-management#EncryptedKey]"
            required: true
            description: "Encrypted current signing keys"
          - name: "next"
            type: "array[types://signify-client/key-management#EncryptedKey]"
            required: true
            description: "Encrypted next (pre-rotation) keys"
        invariants:
          - "current keys are used for signing the current event"
          - "next keys are committed to via digest in the current establishment event"
