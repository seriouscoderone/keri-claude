# domain.yaml
template_version: "2.0"
id: "signify-client/key-management"
name: "Signify Key Management"
description: >
  Security-critical subdomain for key generation, storage, and protection on the controller's
  edge device. Handles passcode-to-salt derivation, deterministic/random key generation via
  Keepers, security tiers, key derivation paths, and encrypted key-at-rest storage. Keys never
  leave this subdomain — it produces signatures on request but never exports private material.
  Implementations: signify-ts (KeyManager, Keeper), signifypy (Manager, Keeper).
version: "0.1.0"
tier: "application"

source_material:
  - type: document
    reference: "signify-ts — core/authing.ts, core/keeping.ts: SaltyKeeper, RandyKeeper, GroupKeeper, Manager"
  - type: document
    reference: "signifypy — core/keeping.py: SaltyKeeper, RandyKeeper, GroupKeeper, Manager"
  - type: document
    reference: "keridoc-llms-full.md — Signify key management, passcode handling, key derivation"

domain_clients:
  - ref: "domain://signify-client"
    relationship: "Parent domain delegates all key generation, protection, and signing to this subdomain"
    via_port: "port://signify-client/key-management/inbound/key-ops"

subdomains: []

kernels: []

adjacents: []

externals:
  - ref: "domain://externals/cryptographic-primitives"
    source: "argon2 for passcode stretching, Ed25519/ECDSA for key generation, X25519 for key-at-rest encryption (ECDH + secretbox)"
    relationship: "All cryptographic primitives — key derivation, signing, encryption — are kernel operations. This subdomain composes them into the Keeper abstraction and Encrypter"
  - ref: "domain://externals/persistence"
    relationship: "Encrypted key material at rest — the key-repository outbound port delegates to this external"

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    In signify-ts, the Manager class owns Keeper lifecycle: new() creates the appropriate Keeper
    type based on Algos, get() retrieves it. SaltyKeeper derives keys from salt + path via
    libsodium. RandyKeeper generates random keys and stores encrypted proxies. GroupKeeper wraps
    a member AID's keeper with index remapping. The Encrypter uses X25519 ECDH to encrypt the
    salt (sxlt) for cloud-side storage. In signifypy, the same structure exists in
    core/keeping.py with Manager, SaltyKeeper, RandyKeeper, GroupKeeper.

issues: []

tags: ["key-management", "passcode", "keeper", "salt", "encryption", "edge-signing", "security"]
