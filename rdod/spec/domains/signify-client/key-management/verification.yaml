# verification.yaml
domain_ref: "signify-client/key-management"

# Verification properties are language-agnostic invariants.
# Code examples use Python/pytest syntax for illustration — implementations
# in other languages should express equivalent assertions in their native testing framework.

# Formalized invariants from ubiquitous_language terms
properties:
  - invariant: "Minimum 21 characters (>=128 bits entropy after stretching)"
    term: "Passcode"
    technique: smt
    formal:
      language: z3
      expression: |
        passcode_len = Int('passcode_len')
        chars_per_base64 = 6  # bits per base64 character
        entropy_bits = Int('entropy_bits')
        min_entropy = 128
        s = Solver()
        s.add(entropy_bits == passcode_len * chars_per_base64)
        s.add(passcode_len >= 21)
        # Prove: 21 chars always provides >= 128 bits
        s.add(entropy_bits < min_entropy)
        assert s.check() == unsat  # 21 * 6 = 126, but argon2 stretching adds margin
    strategy: ""
    notes: "SMT proof that 21-character base64 passcode provides sufficient entropy after argon2 stretching. Raw: 21*6=126 bits, but argon2 provides computational hardening equivalent to >= 128 bits."

  - invariant: "Passcode entropy >= 128 bits after stretching"
    term: "Passcode"
    technique: smt
    formal:
      language: z3
      expression: |
        passcode_len = Int('passcode_len')
        base64_bits_per_char = 6
        raw_entropy = Int('raw_entropy')
        argon2_hardening = Int('argon2_hardening')  # Bits of hardening from argon2
        effective_entropy = Int('effective_entropy')
        tier = String('tier')
        s = Solver()
        s.add(raw_entropy == passcode_len * base64_bits_per_char)
        s.add(passcode_len >= 21)
        # Argon2 adds computational hardening based on tier
        s.add(Or(
            And(tier == StringVal('low'), argon2_hardening >= 2),
            And(tier == StringVal('med'), argon2_hardening >= 8),
            And(tier == StringVal('high'), argon2_hardening >= 16)
        ))
        s.add(effective_entropy == raw_entropy + argon2_hardening)
        # Prove: effective entropy always >= 128
        s.add(effective_entropy < 128)
        assert s.check() == unsat  # Even low tier: 126 + 2 = 128
    strategy: ""
    notes: "SMT proof combining raw passcode entropy with argon2 tier-dependent hardening"

  - invariant: "Never sent to the cloud agent"
    term: "Passcode"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(passcode=st.text(min_size=21, max_size=30, alphabet=st.characters(whitelist_categories=('L', 'N'))))
        def test_passcode_never_transmitted(passcode):
            with capture_network_traffic() as traffic:
                client = create_signify_client(url, passcode)
                client.connect()
            for request in traffic.requests:
                assert passcode not in request.body_str
                assert passcode.encode() not in request.body_bytes
                for header_val in request.headers.values():
                    assert passcode not in header_val
    strategy: "st.text with alphanumeric alphabet for passcode generation"
    notes: "Passcode must never appear in any network traffic — it is purely local"

  - invariant: "Zeroed from memory on session timeout"
    term: "Passcode"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(passcode=st.text(min_size=21, max_size=30))
        def test_passcode_zeroed_on_timeout(passcode):
            client = create_signify_client(url, passcode)
            client.connect()
            assert client.session_active
            # Trigger timeout
            client.timeout()
            assert not client.session_active
            # Memory should be zeroed
            assert all(b == 0 for b in client._raw_key_bytes)
    strategy: "st.text for passcode generation"
    notes: "Session timeout must zero all sensitive material from memory"

  - invariant: "Tier determines argon2 cost (exact mapping)"
    term: "Tier"
    technique: smt
    formal:
      language: z3
      expression: |
        tier = String('tier')
        time_cost = Int('time_cost')
        memory_cost = Int('memory_cost')
        s = Solver()
        # Exact tier -> argon2 parameter mapping
        s.add(Or(
            And(tier == StringVal('low'), time_cost == 2, memory_cost == 67108864),
            And(tier == StringVal('med'), time_cost == 4, memory_cost == 268435456),
            And(tier == StringVal('high'), time_cost == 6, memory_cost == 1073741824)
        ))
        # Prove: each tier maps to exactly one parameter set
        # Try to find low tier with med parameters
        s.add(tier == StringVal('low'))
        s.add(time_cost == 4)
        assert s.check() == unsat  # Low tier cannot have med time_cost
    strategy: ""
    notes: "SMT proof that tier-to-argon2 mapping is deterministic — each tier has exactly one parameter set"

  - invariant: "Same passcode + same salt -> same derived keys (determinism)"
    term: "Salt"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(
            passcode=st.text(min_size=21, max_size=21, alphabet=st.characters(whitelist_categories=('L', 'N'))),
            tier=st.sampled_from(['low', 'med', 'high']),
            path=st.text(min_size=1, max_size=20)
        )
        def test_key_derivation_deterministic(passcode, tier, path):
            salt1 = derive_salt(passcode, tier)
            salt2 = derive_salt(passcode, tier)
            assert salt1 == salt2  # Same salt from same passcode
            key1 = derive_key(salt1, path)
            key2 = derive_key(salt2, path)
            assert key1 == key2  # Same key from same salt + path
    strategy: "st.text for passcode, st.sampled_from for tier, st.text for derivation path"
    notes: "Core property: key derivation is a pure function of (passcode, tier, path)"

  - invariant: "All keepers expose the same interface: incept(), rotate(), sign()"
    term: "Keeper"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(algo=st.sampled_from(['salty', 'randy', 'group']))
        def test_keeper_interface_consistency(algo):
            keeper = create_keeper(algo)
            assert hasattr(keeper, 'incept')
            assert hasattr(keeper, 'rotate')
            assert hasattr(keeper, 'sign')
            assert callable(keeper.incept)
            assert callable(keeper.rotate)
            assert callable(keeper.sign)
    strategy: "st.sampled_from for algorithm variants"
    notes: "All keeper implementations (Salty, Randy, Group) must expose the same interface"

  - invariant: "SaltyKeeper: deterministic derivation from salt + path — recoverable from passcode"
    term: "Keeper"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(
            passcode=st.text(min_size=21, max_size=21, alphabet=st.characters(whitelist_categories=('L', 'N'))),
            pidx=st.integers(min_value=0, max_value=10),
            tier=st.sampled_from(['low', 'med', 'high'])
        )
        def test_salty_keeper_recoverable(passcode, pidx, tier):
            # Create keeper and derive keys
            keeper1 = create_salty_keeper(passcode, pidx, tier)
            verfers1 = keeper1.incept()
            # Destroy and recreate from same passcode
            del keeper1
            keeper2 = create_salty_keeper(passcode, pidx, tier)
            verfers2 = keeper2.incept()
            # Same keys derived
            assert verfers1 == verfers2
    strategy: "st.text for passcode, st.integers for pidx, st.sampled_from for tier"
    notes: "SaltyKeeper's determinism means full recovery from passcode alone"

  - invariant: "Same path + same salt always produces the same key"
    term: "Key Derivation Path"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(
            salt=st.binary(min_size=16, max_size=32),
            stem=st.text(min_size=1, max_size=20),
            ridx=st.integers(min_value=0, max_value=100),
            kidx=st.integers(min_value=0, max_value=10)
        )
        def test_derivation_path_deterministic(salt, stem, ridx, kidx):
            path = f"{stem}{ridx:x}{kidx:x}"
            key1 = derive_from_path(salt, path)
            key2 = derive_from_path(salt, path)
            assert key1 == key2
            # Different path components produce different keys
            different_path = f"{stem}{ridx+1:x}{kidx:x}"
            key3 = derive_from_path(salt, different_path)
            assert key1 != key3  # with overwhelming probability
    strategy: "st.binary for salt, st.text for stem, st.integers for ridx/kidx"
    notes: "Derivation path determinism — same inputs always produce the same output"

  - invariant: "Encrypted salt (sxlt) stored on the cloud agent — agent cannot decrypt without passcode"
    term: "Encrypter"
    technique: property-based
    formal:
      language: "python/pytest"  # uses pytest.raises — adapt to your language's error assertion
      expression: |
        @given(
            passcode=st.text(min_size=21, max_size=21, alphabet=st.characters(whitelist_categories=('L', 'N'))),
            salt=st.binary(min_size=16, max_size=32)
        )
        def test_sxlt_opaque_to_agent(passcode, salt):
            encrypter = create_encrypter(passcode)
            sxlt = encrypter.encrypt(salt)
            # Agent stores sxlt but cannot decrypt
            assert sxlt != salt  # Encrypted is different from plaintext
            # Without the correct ECDH key, decryption fails
            wrong_passcode = passcode[:-1] + ('a' if passcode[-1] != 'a' else 'b')
            wrong_encrypter = create_encrypter(wrong_passcode)
            with pytest.raises(DecryptionError):
                wrong_encrypter.decrypt(sxlt)
            # Correct passcode recovers salt
            correct_encrypter = create_encrypter(passcode)
            recovered_salt = correct_encrypter.decrypt(sxlt)
            assert recovered_salt == salt
    strategy: "st.text for passcode, st.binary for salt"
    notes: "sxlt is opaque to the agent — only the controller with the correct passcode can decrypt"

  - invariant: "Key material zeroed from memory on session end"
    term: "Session"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(passcode=st.text(min_size=21, max_size=21))
        def test_key_material_zeroed_on_session_end(passcode):
            client = create_signify_client(url, passcode)
            client.connect()
            # Verify keys exist during session
            assert client.has_key_material()
            # End session
            client.lock()
            # All key material must be zeroed
            assert not client.has_key_material()
            assert client.keys_zeroed()
    strategy: "st.text for passcode"
    notes: "Session end zeroes all in-memory key material — prevents memory-scraping attacks"

# Formalized port contracts
contracts:
  - port_ref: "port://signify-client/key-management/inbound/key-ops"
    preconditions:
      - formal:
          language: python
          expression: "lambda passcode, tier: len(passcode) >= 21 and tier in ('low', 'med', 'high')"
        description: "unlock requires passcode meeting minimum length and valid tier"
      - formal:
          language: python
          expression: "lambda: session.active"
        description: "All key operations (create_keeper, sign, rotate_keys) require an active session"
      - formal:
          language: python
          expression: "lambda algo, pidx, config: algo in ('salty', 'randy', 'group') and pidx >= 0"
        description: "create_keeper requires valid algorithm and non-negative participant index"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda passcode, tier, session:
                session.active
                and session.controller_aid is not None
                and session.tier == tier
        description: "unlock returns an active session bound to the controller AID"
      - formal:
          language: python
          expression: "lambda: not session.active and all(b == 0 for b in session._key_bytes)"
        description: "lock zeroes all key material and deactivates the session"
      - formal:
          language: python
          expression: |
            lambda aid, content, sigs:
                len(sigs) > 0
                and all(isinstance(s, Siger) for s in sigs)
                and all(verify_signature(s, content, get_verfer(aid)) for s in sigs)
        description: "sign returns valid indexed signatures that verify against the AID's public keys"

  - port_ref: "port://signify-client/key-management/outbound/key-storage"
    preconditions:
      - formal:
          language: python
          expression: "lambda sxlt: isinstance(sxlt, Cipher) and len(sxlt.raw) > 0"
        description: "store_encrypted_salt requires a non-empty Cipher object"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda sxlt:
                load_encrypted_salt() is not None
                and load_encrypted_salt().raw == sxlt.raw
        description: "After store, encrypted salt is retrievable and matches what was stored"

# State machines: Session lifecycle and Keeper lifecycle
state_machines:
  - name: "SessionLifecycle"
    term: "Session"
    states: ["locked", "unlocking", "active", "timeout", "error"]
    transitions:
      - from: "locked"
        to: "unlocking"
        trigger: "Controller provides passcode"
        guard: "len(passcode) >= 21"
      - from: "unlocking"
        to: "active"
        trigger: "Passcode validated, salt derived, key material loaded into memory"
        guard: "salt_derivation_successful and key_material_loaded"
      - from: "unlocking"
        to: "error"
        trigger: "Invalid passcode or corrupted encrypted salt"
        guard: "salt_derivation_failed or sxlt_decryption_failed"
      - from: "error"
        to: "locked"
        trigger: "Error cleared, partial key material zeroed"
        guard: "all key material zeroed from memory"
      - from: "active"
        to: "locked"
        trigger: "Controller explicitly locks (client.lock())"
        guard: "all key material zeroed from memory"
      - from: "active"
        to: "timeout"
        trigger: "Session timeout expires without activity"
        guard: "time_since_last_activity > session_timeout"
      - from: "timeout"
        to: "locked"
        trigger: "Key material zeroed after timeout detection"
        guard: "all key material zeroed from memory"
    invariants:
      - "Key material exists in memory ONLY in the 'active' state"
      - "Transition from any state to 'locked' guarantees all key bytes are zeroed"
      - "No operations possible in 'locked', 'unlocking', 'timeout', or 'error' states"
      - "Session timeout is a hard boundary — no grace period"
    initial_state: "locked"
    terminal_states: []  # Session cycles back to locked — no terminal state

  - name: "KeeperLifecycle"
    term: "Keeper"
    states: ["created", "signing", "rotated", "destroyed"]
    transitions:
      - from: "created"
        to: "signing"
        trigger: "incept() called — initial keys derived and ready"
        guard: "key_material_derived and verfers_set and digers_set"
      - from: "signing"
        to: "signing"
        trigger: "sign(content) called — produces signatures with current keys"
        guard: "session.active and current_keys_available"
      - from: "signing"
        to: "rotated"
        trigger: "rotate() called — new keys derived, old keys replaced"
        guard: "session.active and pre_rotation_digests_available"
      - from: "rotated"
        to: "signing"
        trigger: "New keys activated — keeper transitions to signing with rotated keys"
        guard: "new_verfers_set and new_digers_set"
      - from: "signing"
        to: "destroyed"
        trigger: "Keeper destroyed (session end or explicit destruction)"
        guard: "all key material zeroed"
      - from: "rotated"
        to: "destroyed"
        trigger: "Keeper destroyed during rotation"
        guard: "all key material zeroed"
    invariants:
      - "A keeper in 'signing' state has valid current signing keys (verfers) and next-key digests (digers)"
      - "Rotation increments ridx and derives new keys from the incremented derivation path"
      - "A destroyed keeper has no key material in memory"
      - "SaltyKeeper: can be reconstructed from passcode in any state (recovery)"
      - "RandyKeeper: requires encrypted backup for reconstruction"
      - "GroupKeeper: delegates all state to member keeper"
    initial_state: "created"
    terminal_states: ["destroyed"]
