# ports.yaml
domain_ref: "signify-client/key-management"

ports:
  # Inbound — what the parent signify-client domain calls
  - id: "port://signify-client/key-management/inbound/key-ops"
    type: inbound
    name: "Key Operations"
    semantics: command
    idempotent: false
    contract:
      input: "types://signify-client/key-management#Keeper"
      output: "types://signify-client/key-management#SessionState"
      errors:
        - "errors://signify-client/key-management#InvalidPasscodeError"
        - "errors://signify-client/key-management#PasscodeExpiredError"
        - "errors://signify-client/key-management#UnsupportedKeeperTypeError"
    refs: ["domain://signify-client"]

  # Outbound — encrypted key material persistence
  - id: "port://signify-client/key-management/outbound/key-repository"
    type: outbound
    name: "Key Repository"
    semantics: command
    idempotent: false
    description: >
      Persists encrypted key material for edge signing. Supports two keeper strategies:
      salty (salt-based derivation) and randy (random key generation). All stored material
      is encrypted — the repository never sees plaintext private keys.
    contract:
      input: "types://signify-client/key-management#EncryptedSalt"
      output: "types://signify-client/key-management#EncryptedKeyPair"
      errors: []
    refs: ["domain://externals/persistence"]
