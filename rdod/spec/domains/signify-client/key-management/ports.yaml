# ports.yaml
domain_ref: "signify-client/key-management"

ports:
  # Inbound — what the parent signify-client domain calls
  - id: "port://signify-client/key-management/inbound/key-ops"
    type: inbound
    name: "Key Operations"
    contract: >
      unlock(passcode, tier) -> Session;
      lock() -> void;
      create_keeper(algo, pidx, config) -> Keeper;
      get_keeper(aid) -> Keeper;
      sign(aid, content, indexed) -> [Siger];
      rotate_keys(aid) -> {verfers: [Verfer], digers: [Diger]}
    protocol: "method-call"
    refs: ["domain://signify-client"]

  # Outbound — encrypted key material persistence
  - id: "port://signify-client/key-management/outbound/key-repository"
    type: outbound
    name: "Key Repository"
    description: >
      Persists encrypted key material for edge signing. Supports two keeper strategies:
      salty (salt-based derivation) and randy (random key generation). All stored material
      is encrypted — the repository never sees plaintext private keys.
    contract:
      - "store_encrypted_salt(aid: AID, encrypted_salt: EncryptedSalt) -> Result — persist encrypted salt for salty keeper derivation"
      - "get_encrypted_salt(aid: AID) -> EncryptedSalt — retrieve encrypted salt for an identifier"
      - "store_encrypted_keys(aid: AID, encrypted_private: [EncryptedKey], encrypted_next: [EncryptedKey]) -> Result — persist encrypted current and next private keys for randy keeper"
      - "get_encrypted_keys(aid: AID) -> EncryptedKeyPair — retrieve encrypted private and next key sets"
      - "destroy(aid: AID) -> Result — permanently remove all encrypted key material for an identifier"
    protocol: "method-call"
    refs: ["persistence"]
