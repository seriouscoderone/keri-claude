# ubiquitous-language.yaml
domain_ref: "signify-client"

imports:
  - term: "AID"
    from: "domain://keri"
    usage: "Signify clients manage AIDs at the edge"
  - term: "Salter"
    from: "domain://cesr/primitives"
    usage: "Key derivation from salt"

terms:
  - term: "Signify Client"
    synonyms: ["Edge Client", "Signify"]
    definition: "Controller-side library that holds private keys, signs all operations, and communicates with a KERIA cloud agent via KRAM-authenticated HTTP. Orchestrates key-management and resources subdomains."
    invariants:
      - "Private keys generated and stored locally — never transmitted"
      - "All requests to cloud agent signed via KRAM"
      - "Delegates key lifecycle to signify-client/key-management"
      - "Delegates resource API to signify-client/resources"
    examples:
      - "signify-ts: `const client = new SignifyClient(url, bran, Tier.low)`"
      - "signifypy: `client = SignifyClient(url=url, bran=bran)`"
    related_terms: ["Signify Protocol", "KRAM", "Browser Extension"]

  - term: "Signify Protocol"
    synonyms: []
    definition: "The contract between thin wallet and cloud agent. KRAM for admin API authentication, polling for async operation completion, edge-signed all requests. The boundary that exists only in the thin wallet deployment model — fat wallets (local-agent) have no equivalent protocol layer."
    invariants:
      - "KRAM authenticates all admin API requests (port 3901)"
      - "Async operations polled by edge — agent cannot push completion to the edge"
      - "All event and credential operations are edge-signed before submission to the cloud agent"
      - "Three-endpoint model: boot (3903) for provisioning, admin (3901) for operations, message router (3902) for protocol"
      - "This protocol boundary is unique to thin wallet deployments — it disappears entirely in fat wallet (local-agent) mode"
    examples:
      - "client.boot() → POST /boot with inception event → provisions agent instance"
      - "client.identifiers().create() → edge signs inception → POST /identifiers with KRAM headers → polls operation until witnesses receipt"
    related_terms: ["Signify Client", "KRAM", "Signing Request"]

  - term: "KRAM"
    synonyms: ["KERI Request Authentication Method"]
    definition: "HTTP signature-based authentication using KERI identifiers. Each request includes signed headers that the cloud agent verifies against the controller's KEL. Spans both subdomains — key-management produces the signatures, resources attaches them to requests."
    invariants:
      - "Signature covers HTTP method, path, and body digest"
      - "Cloud agent verifies against controller AID's current key state"
      - "Replay protection via nonce and timestamp"
    examples:
      - "Signify-TS header: `Signature: keyid=AID;created=timestamp;...`"
    related_terms: ["Signify Protocol", "Signify Client"]

  - term: "Browser Extension"
    synonyms: ["Signify Browser Extension"]
    definition: "Chrome/Firefox extension wrapping signify-ts, providing passwordless web authentication via signed HTTP headers."
    invariants:
      - "Private keys accessible only to background script and popup — never to websites"
      - "Websites communicate via polaris-web library (content script bridge)"
      - "Requires active tab context for all operations"
    examples:
      - "Website calls polaris-web → content script → background script signs with signify-ts → signed headers returned"
    related_terms: ["Signify Client", "Signing Association", "Signing Request"]

  - term: "Signing Association"
    synonyms: []
    definition: "A stored mapping between a website origin and a credential/AID, authorizing the browser extension to sign requests for that website."
    invariants:
      - "Established by explicit user approval in the extension"
      - "Scoped to a specific origin (website domain)"
      - "Stored in Chrome storage, not transmitted"
    examples:
      - "User approves signing for example.com with their OOR credential"
    related_terms: ["Browser Extension", "Signing Request"]

  - term: "Signing Request"
    synonyms: []
    definition: "A request originating from the cloud agent for the controller to cryptographically sign an event, credential, or exchange message."
    invariants:
      - "Cloud agent can never produce a valid signature — only request one"
      - "Controller reviews the content before signing"
      - "Signing is asynchronous — the agent waits for the edge response"
    examples:
      - "Multi-sig: KERIA assembles partial event, requests each participant's signature"
      - "Credential issuance: KERIA prepares ACDC, controller signs at edge"
    related_terms: ["Signify Protocol", "Browser Extension"]

events:
  - name: "SigningRequested"
    payload: "controller_aid: AID, content: bytes, event_type: string"
    triggers: "Cloud agent requests a signature for a pending operation"

  - name: "SigningCompleted"
    payload: "controller_aid: AID, signature: Siger, event_said: SAID"
    triggers: "Controller approves and signs the requested content"

  - name: "SigningAssociationEstablished"
    payload: "origin: string, aid: AID, credential_said: SAID"
    triggers: "User approves a signing association for a website in the browser extension"

rules:
  - "The cloud agent is untrusted with respect to key material — it can request but never produce signatures"
  - "All admin API requests must include KRAM signatures — unsigned requests are rejected"
  - "Browser extension only signs for websites with established signing associations"
  - "The Signify protocol boundary disappears entirely in fat wallet (local-agent) deployments — it is unique to thin wallet architecture"
