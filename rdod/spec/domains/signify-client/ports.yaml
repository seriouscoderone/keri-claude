# ports.yaml
domain_ref: "signify-client"

ports:
  # Inbound — end users and applications drive the thin wallet
  - id: "port://signify-client/inbound/user-operations"
    type: inbound
    name: "User Operations"
    contract: "connect(url, passcode) -> Session; create_identifier(alias, config) -> AID + Operation; rotate(aid) -> RotationEvent + Operation; issue_credential(registry, schema, recipient, data) -> SAID + Operation; present_credential(said, recipient) -> Result; resolve_oobi(url) -> Operation; sign(content) -> Signature; lock() -> void"
    protocol: "method-call"
    refs: []
