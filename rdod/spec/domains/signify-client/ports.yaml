# ports.yaml
domain_ref: "signify-client"

ports:
  # Inbound — end users and applications drive the thin wallet
  - id: "port://signify-client/inbound/user-operations"
    type: inbound
    name: "User Operations"
    semantics: command
    idempotent: false
    delegates_to:
      - "port://signify-client/key-management/inbound/key-ops"
      - "port://signify-client/resources/inbound/resource-ops"
    contract:
      input: "types://signify-client/key-management#SessionState"
      output: "types://signify-client#AsyncOperation"
      errors:
        - "errors://signify-client/resources#AgentConnectionError"
        - "errors://signify-client/resources#SignifyAuthError"
        - "errors://signify-client/key-management#PasscodeExpiredError"
    refs: []
