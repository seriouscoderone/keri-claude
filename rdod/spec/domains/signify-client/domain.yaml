# domain.yaml
template_version: "2.0"
id: "signify-client"
name: "Signify Client (Thin Wallet)"
description: >
  Application-tier domain for thin wallet KERI applications. The controller holds private
  keys locally and delegates AID hosting, event processing, and credential storage to a
  remote cloud-agent-service via the Signify protocol. Keys never leave the edge device.
  Implementations: signify-ts, signifypy, signify-browser-extension.
version: "0.1.0"
tier: "application"

source_material:
  - type: document
    reference: "keridoc-llms-full.md — Signify protocol documentation"
  - type: document
    reference: "signify-ts — TypeScript edge signing implementation"
  - type: document
    reference: "signifypy — Python edge signing implementation"
  - type: user-input
    reference: "CLAUDE.md — signify-ts, signifypy, browser extension architecture"

domain_clients: []

subdomains:
  - ref: "domain://signify-client/key-management"
    relationship: "Owns all key generation, passcode-to-salt derivation, Keeper lifecycle, security tiers, key derivation paths, and encrypted key-at-rest storage"
    via_port: "port://signify-client/key-management/inbound/key-ops"
  - ref: "domain://signify-client/resources"
    relationship: "Owns the client-side API surface — resource classes for identifiers, credentials, exchanges, groups, registries, and async operation tracking"
    via_port: "port://signify-client/resources/inbound/resource-ops"

kernels: []

adjacents:
  - ref: "domain://cesr"
    pattern: "conformist"
    relationship: "Conformist — uses CESR primitives (Verfer, Siger, Diger, Salter, Cigar) directly"
  - ref: "domain://keri-messaging"
    pattern: "conformist"
    relationship: "KERI messaging primitives (exn, qry, rpy) adopted natively"
  - ref: "domain://cloud-agent-service"
    relationship: "Customer-Supplier — signify-client drives cloud-agent-service via Signify protocol (delegated to resources subdomain's cloud-agent-comms port)"
    pattern: "Customer-Supplier"
    via_port: "port://signify-client/resources/outbound/cloud-agent-comms"
    is_cross_cutting: false
  - ref: "domain://identity"
    relationship: "Conformist — uses KERI protocol types and event structures directly without translation"
    pattern: "Conformist"
    via_port: "port://identity/inbound/identity-management"
    is_cross_cutting: false
  - ref: "domain://credential-lifecycle"
    relationship: "Conformist — uses ACDC credential types, schemas, and IPEX exchange protocol directly"
    pattern: "Conformist"
    via_port: "port://credential-lifecycle/inbound/state-management"
    is_cross_cutting: false
  - ref: "domain://discovery"
    relationship: "Customer-Supplier — resolves OOBIs via cloud agent for endpoint and key state discovery"
    pattern: "Customer-Supplier"
    via_port: "port://discovery/inbound/discovery"
    is_cross_cutting: false

externals: []

implementation_guidance:
  suggested_type: "app"
  language_affinity: "any"
  notes: >
    signify-ts (TypeScript) for browsers and Node.js. signifypy (Python) for scripting
    and testing. signify-browser-extension (React) wraps signify-ts in a Chrome/Firefox
    extension with polaris-web for website integration. This domain replaces
    agent/edge-signing as a top-level application-tier domain.

issues: []

tags: ["thin-wallet", "edge-signing", "signify", "private-keys", "controller", "application"]

# --- Application-Layer Open Items (deferred to design0-ecosystem) ---
# These items are intentionally deferred. This domain's spec is thin by design —
# full specification will be produced by the design0-ecosystem skill when
# ecosystem-level service design is performed.
#
# [H-O18] GroupKeeper nesting unconstrained — the GroupKeeper type allows
#         arbitrary recursive nesting of group members with no depth limit or
#         acyclicity invariant
# [L811-O27] RESOLVED — Operation renamed to AsyncOperation (canonical parent type);
#            OperationStatus documented as subdomain alias for the same concept
# [L811-O28] key-repository port conflates store/load — the key-repository
#            outbound port bundles key storage and key retrieval in a single port
#            contract; should be split into separate store and load ports
# [L811-O29] cloud-agent-comms port only correct for boot — the cloud-agent-comms
#            outbound port models the boot handshake but does not cover the full
#            admin API interaction lifecycle (create identifier, rotate, etc.)
# [L811-O30] SessionState.passcode_timeout optional but FSM requires it — the
#            passcode_timeout field is marked optional on SessionState, but the
#            session FSM transitions to Locked unconditionally after timeout,
#            implying it must always be present once a session is active
# [L811-O31] No signed-request construction contract — the outbound
#            cloud-agent-comms port does not specify how KRAM-signed HTTP headers
#            are constructed (algorithm, header names, nonce source)
