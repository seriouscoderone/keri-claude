# domain.yaml
template_version: "1.0"
id: "signify-client"
name: "Signify Client (Thin Wallet)"
description: >
  Application-tier domain for thin wallet KERI applications. The controller holds private
  keys locally and delegates AID hosting, event processing, and credential storage to a
  remote cloud-agent-service via the Signify protocol. Keys never leave the edge device.
  Implementations: signify-ts, signifypy, signify-browser-extension.
version: "0.1.0"

source_material:
  - type: document
    reference: "keridoc-llms-full.md — Signify protocol documentation"
  - type: document
    reference: "signify-ts — TypeScript edge signing implementation"
  - type: document
    reference: "signifypy — Python edge signing implementation"
  - type: user-input
    reference: "CLAUDE.md — signify-ts, signifypy, browser extension architecture"

ubiquitous_language:
  - term: "Signify Client"
    definition: "Controller-side library that holds private keys, signs all operations, and communicates with a KERIA cloud agent via KRAM-authenticated HTTP. Orchestrates key-management and resources subdomains"
    invariants:
      - "Private keys generated and stored locally — never transmitted"
      - "All requests to cloud agent signed via KRAM"
      - "Delegates key lifecycle to signify-client/key-management"
      - "Delegates resource API to signify-client/resources"

  - term: "Signify Protocol"
    definition: "The contract between thin wallet and cloud agent — defines how the controller drives KERIA via KRAM-authenticated requests while retaining all key material locally"
    invariants:
      - "KRAM authenticates all admin API requests (port 3901)"
      - "Async operations polled by edge — agent cannot push"
      - "All event/credential operations edge-signed before submission"
      - "This boundary exists only in the thin wallet deployment model — fat wallets have no equivalent"

  - term: "KRAM"
    definition: "KERI Request Authentication Method — HTTP signature-based authentication using KERI identifiers. Each request includes signed headers that the cloud agent verifies against the controller's KEL"
    invariants:
      - "Signature covers HTTP method, path, and body digest"
      - "Cloud agent verifies against controller AID's current key state"
      - "Replay protection via nonce and timestamp"

  - term: "Browser Extension"
    definition: "Chrome/Firefox extension wrapping signify-ts, providing passwordless web authentication via signed HTTP headers"
    invariants:
      - "Private keys accessible only to background script and popup — never to websites"
      - "Websites communicate via polaris-web library (content script bridge)"
      - "Requires active tab context for all operations"

  - term: "Signing Association"
    definition: "A stored mapping between a website origin and a credential/AID, authorizing the browser extension to sign requests for that website"
    invariants:
      - "Established by explicit user approval in the extension"
      - "Scoped to a specific origin (website domain)"
      - "Stored in Chrome storage, not transmitted"

  - term: "Signing Request"
    definition: "A request originating from the cloud agent for the controller to cryptographically sign an event, credential, or exchange message"
    invariants:
      - "Cloud agent can never produce a valid signature — only request one"
      - "Controller reviews the content before signing"
      - "Signing is asynchronous — the agent waits for the edge response"

domain_clients: []

subdomains:
  - ref: "domain://signify-client/key-management"
    relationship: "Owns all key generation, passcode-to-salt derivation, Keeper lifecycle, security tiers, key derivation paths, and encrypted key-at-rest storage"
    via_port: "port://signify-client/key-management/inbound/key-ops"
  - ref: "domain://signify-client/resources"
    relationship: "Owns the client-side API surface — resource classes for identifiers, credentials, exchanges, groups, registries, and async operation tracking"
    via_port: "port://signify-client/resources/inbound/resource-ops"

kernels:
  - ref: "kernel://cesr"
    source: "domain://cesr"
    relationship: "Conformist — uses CESR primitives (Verfer, Siger, Diger, Salter, Cigar) directly"

adjacents:
  - ref: "domain://cloud-agent-service"
    relationship: "Customer-Supplier — signify-client drives cloud-agent-service via Signify protocol (delegated to resources subdomain's cloud-agent-comms port)"
    pattern: "Customer-Supplier"
    via_port: "port://signify-client/resources/outbound/cloud-agent-comms"
    is_cross_cutting: false
  - ref: "domain://keri"
    relationship: "Conformist — uses KERI protocol types and event structures directly without translation"
    pattern: "Conformist"
    via_port: "port://keri/inbound/identifier-lifecycle"
    is_cross_cutting: false
  - ref: "domain://acdc"
    relationship: "Conformist — uses ACDC credential types, schemas, and IPEX exchange protocol directly"
    pattern: "Conformist"
    via_port: "port://acdc/inbound/credential-lifecycle"
    is_cross_cutting: false
  - ref: "domain://discovery"
    relationship: "Customer-Supplier — resolves OOBIs via cloud agent for endpoint and key state discovery"
    pattern: "Customer-Supplier"
    via_port: "port://discovery/inbound/discovery"
    is_cross_cutting: false

externals: []

implementation_guidance:
  suggested_type: "package"
  language_affinity: "any"
  notes: >
    signify-ts (TypeScript) for browsers and Node.js. signifypy (Python) for scripting
    and testing. signify-browser-extension (React) wraps signify-ts in a Chrome/Firefox
    extension with polaris-web for website integration. This domain replaces
    agent/edge-signing as a top-level application-tier domain.

issues: []

tags: ["thin-wallet", "edge-signing", "signify", "private-keys", "controller", "application"]
