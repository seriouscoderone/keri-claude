# ports.yaml
domain_ref: "delegation/lifecycle"

ports:
  # Inbound — DelegationService interface
  - id: "port://delegation/lifecycle/inbound/approve"
    type: inbound
    name: "Approve Delegation"
    semantics: command
    idempotent: false
    description: >
      Primary DelegationService operation — orchestrates the multi-step delegation
      approval workflow: witness acknowledgment, delegator approval request,
      approval verification, publication. Produces a DelegationWriteOutcome:
      approved (delegation accepted), pending-approval (waiting for delegator),
      pending-witnesses (waiting for witness receipts), or rejected.
    contract:
      input: "types://delegation/lifecycle#SignedEstablishmentEvent"
      output: "types://delegation/lifecycle#DelegationWriteOutcome"
      errors:
        - "errors://delegation/lifecycle#InvalidSignatureError"
        - "errors://delegation/lifecycle#InvalidDelegatorReferenceError"
        - "errors://delegation/lifecycle#DelegatorNotFoundError"
        - "errors://delegation/lifecycle#DelegationSealMismatchError"
        - "errors://delegation/lifecycle#DelegationNotPermittedError"
    refs: ["domain://delegation"]

  - id: "port://delegation/lifecycle/inbound/check-approval-status"
    type: inbound
    name: "Check Approval Status"
    semantics: query
    idempotent: true
    description: >
      Query whether a pending delegation has been approved by the delegator.
    contract:
      input: "types://delegation/lifecycle#SignedEstablishmentEvent"
      output: "types://delegation/lifecycle#DelegationWriteOutcome"
      errors: []
    refs: ["domain://delegation"]

  # Outbound — persistence and service dependencies
  - id: "port://delegation/lifecycle/outbound/delegation-repository"
    type: outbound
    name: "Delegation Repository"
    semantics: command
    idempotent: false
    description: >
      Persistence for the delegation approval workflow. Tracks two escrow
      categories: pending-approval entries (delegatee events awaiting the
      delegator's commitment seal) and delegable entries (events the local
      controller must approve as delegator). The repository exposes four
      operations that together form a complete CRUD surface for delegation
      escrow management.
    contract:
      operations:
        - name: store
          description: >
            Persist a delegation escrow entry. Accepts a signed establishment
            event along with its identifier (AID), sequence number, SAID, and
            timestamp. The entry is categorized as either pending-approval or
            delegable based on the caller's role (delegatee vs delegator).
            Storing an entry that already exists (same AID + sequence number +
            SAID) is a no-op — the operation is idempotent for identical inputs.
          input: "types://delegation/lifecycle#SignedEstablishmentEvent"
          output: "void"
          idempotent: true
          errors: []

        - name: retrieve
          description: >
            Retrieve escrowed entries for a given identifier or delegator.
            Returns all pending entries matching the query — either all entries
            for a specific delegatee AID (pending-approval lookup) or all
            entries where a specific AID is the delegator (delegable lookup).
            Returns an empty collection when no entries match.
          input: "types://delegation/lifecycle#EscrowQuery"
          output: "list<types://delegation/lifecycle#SignedEstablishmentEvent>"
          idempotent: true
          errors: []

        - name: remove
          description: >
            Remove an escrow entry after it has been promoted (approved and
            committed to the identity log) or pruned (expired or rejected).
            Identified by AID, sequence number, and SAID. Removal is
            idempotent — removing a non-existent entry is a no-op.
          input: "types://delegation/lifecycle#EscrowEntryKey"
          output: "void"
          idempotent: true
          errors: []

        - name: iterate
          description: >
            Iterate over all escrowed entries for periodic sweep processing.
            The sweep checks whether pending-approval entries have received
            their delegator's commitment seal, and whether delegable entries
            have been locally approved. Entries that have been satisfied are
            promoted; entries past their time-to-live are pruned. Returns an
            iterator over entries, optionally filtered by escrow category.
          input: "types://delegation/lifecycle#SweepFilter"
          output: "iterator<types://delegation/lifecycle#SignedEstablishmentEvent>"
          idempotent: true
          errors: []
    refs: ["domain://externals/persistence"]
    invariants:
      - "After store, the entry is retrievable via retrieve for the same AID"
      - "After remove, the entry is no longer returned by retrieve or iterate"
      - "Pending-approval entries await delegator commitment confirmation"
      - "Delegable entries await local delegator approval before committing"
      - "Store is idempotent — storing an identical entry twice has no additional effect"
      - "Remove is idempotent — removing a non-existent entry is a no-op"
      - "Retrieve returns an empty collection (not an error) when no entries match"
      - "Approval records link delegator to delegatee via the seal SAID"
      - "Iterate yields a consistent snapshot — concurrent modifications do not cause partial reads"

  - id: "port://delegation/lifecycle/outbound/identity-service"
    type: outbound
    name: "Identity Service (Commit Approval)"
    semantics: command
    idempotent: false
    description: >
      The DelegationService requests the delegator to commit an approval to
      their identity history via the IdentityService. This is how the delegator
      approves a delegation — by committing a seal to their own event log.
    contract:
      input: "types://delegation/lifecycle#SignedEstablishmentEvent"
      output: "types://identity/state#WriteOutcome"
      errors: []
    refs: ["domain://identity"]

  # H-O8: Escrow sweep trigger — note: periodic polling, not push
  # The DelegationService is responsible for periodically sweeping both
  # PDE and Delegable escrow queues. This sweep is triggered by a timer
  # (configurable interval — keripy uses an HIO doer pattern) rather than
  # by a push event. There is no inbound port for the sweep trigger; instead,
  # the service polls on a schedule. Implementations SHOULD expose the sweep
  # interval as a configurable parameter.
  #
  # NOTE (L4-O1): This outbound identity-service port covers the inception
  # approval flow. Rotation approval (drt) requires the same port but with
  # the delegatee's rotation event as input. The port contract SHOULD be
  # extended to explicitly support rotation events as well — drt events
  # undergo the same multi-step delegation validation pipeline as dip events.
  # A future revision SHOULD add a distinct rotation approval operation or
  # note that the approve port is type-agnostic (accepts dip and drt equally).
