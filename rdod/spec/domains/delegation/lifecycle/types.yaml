domain_ref: "delegation/lifecycle"

types:
  - name: "PromotedEvent"
    description: "An event promoted from a delegation escrow queue into the KEL after its blocking condition resolved."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "AID of the promoted event's identifier"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the promoted event"
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the promoted event"
          - name: "promoted_from"
            type: "string"
            required: true
            description: "Which escrow queue the event was promoted from — PDE (remote validator: delegator KEL available but seal not yet found) or Delegable (local delegator: has not yet created approval event)"
            constraints:
              enum: ["PDE", "Delegable"]
        invariants:
          - "PDE (partially-delegated) events are promoted when the delegator's approval seal is found in the delegator's KEL"
          - "Delegable events are promoted when the local delegator creates the approval event"
          - "The distinction is party-role-based: PDE = remote validator waiting for seal; Delegable = local delegator pending approval"
          - "After promotion, the event enters the full validation pipeline via processEvent — PDE is not a mandatory intermediate step"

  - name: "DelegationWriteOutcome"
    description: "Result of submitting a delegation request to the DelegationService."
    variants:
      - name: "approved"
        fields:
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the approved delegated event"
          - name: "delegator_approval_sn"
            type: "integer"
            required: true
            description: "Sequence number in the delegator's identity history where the approval was committed"
        invariants:
          - "The delegated event has been accepted into the delegatee's identity history"
          - "The delegator's approval has been committed to the delegator's identity history"
      - name: "pending_approval"
        fields:
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the delegated event awaiting approval"
          - name: "delegator_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the delegator whose approval is needed"
        invariants:
          - "Witnesses have acknowledged the event but the delegator has not yet committed approval"
      - name: "pending_witnesses"
        fields:
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the delegated event awaiting witness receipts"
          - name: "witnesses_received"
            type: "integer"
            required: true
            description: "Number of witness receipts received so far"
          - name: "witnesses_needed"
            type: "integer"
            required: true
            description: "Number of witness receipts needed (TOAD)"
        invariants:
          - "Waiting for sufficient witness receipts before requesting delegator approval"
      - name: "rejected"
        fields:
          - name: "reason"
            type: "string"
            required: true
            description: "Why the delegation was permanently rejected"
        invariants:
          - "Delegation permanently rejected — invalid signatures, DND trait, or seal mismatch"

  - name: "SignedEstablishmentEvent"
    description: "An establishment event bundled with its controller signatures, used in delegation validation."
    variants:
      - name: "default"
        fields:
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "The establishment key event body (icp, rot, dip, or drt)"
          - name: "signatures"
            type: "array[Signature]"
            required: true
            description: "Controller signatures over the event"
            constraints:
              min_length: 1
        invariants:
          - "Event must be an establishment type — never ixn"
          - "Signatures must satisfy the signing threshold for the event to be promotable"
