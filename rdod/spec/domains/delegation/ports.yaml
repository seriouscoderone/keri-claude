# ports.yaml
domain_ref: "delegation"

ports:
  # Inbound — what clients call
  - id: "port://delegation/inbound/delegation-lifecycle"
    type: inbound
    name: "Delegation Lifecycle"
    semantics: command
    idempotent: false
    contract:
      input: "types://delegation#DelegatedInceptionConfig"
      output: "types://delegation#DelegatedInceptionEvent"
      errors:
        - "errors://delegation/authorization#DelegationNotAllowedError"
        - "errors://delegation/authorization#InvalidDelegatorError"
    refs: ["domain://identity"]

  - id: "port://delegation/inbound/delegation-verification"
    type: inbound
    name: "Delegation Verification"
    semantics: query
    idempotent: true
    contract:
      input: "types://identity/establishment#KeyEvent"
      output: "types://delegation#DelegationVerificationResult"
      errors:
        - "errors://delegation/authorization#MissingDelegatorSealError"
        - "errors://delegation#DelegationChainError"
    refs: ["domain://identity"]

  - id: "port://delegation/inbound/delegation-query"
    type: inbound
    name: "Delegation Query"
    semantics: query
    idempotent: true
    contract:
      input: "types://cesr/primitives#AID"
      output: "array[types://delegation#DelegationChainLink]"
      errors: []
    refs: ["domain://identity"]
