# ports.yaml
domain_ref: "delegation"

ports:
  # Inbound — what clients call
  - id: "port://delegation/inbound/delegation-lifecycle"
    type: inbound
    name: "Delegation Lifecycle"
    semantics: command
    idempotent: false
    contract:
      input: "types://delegation#DelegatedInceptionConfig"
      output: "types://delegation#DelegatedInceptionEvent"
      errors:
        - "errors://delegation/authorization#DelegationNotAllowedError"
        - "errors://delegation/authorization#InvalidDelegatorError"
    refs: ["domain://identity"]

  - id: "port://delegation/inbound/delegation-verification"
    type: inbound
    name: "Delegation Verification"
    semantics: query
    idempotent: true
    contract:
      input: "types://identity/establishment#KeyEvent"
      # L4-O2: boolean is too coarse — needs typed result with verification detail
      # NOTE: A future revision SHOULD change this to a typed DelegationVerificationResult
      # containing at minimum: {verified: boolean, rule_applied: SupersedingRule | null,
      # chain_depth: integer, failure_reason: string | null}. Boolean loses the context
      # needed for auditing and debugging. Current boolean output is a placeholder.
      output: "boolean"
      errors:
        - "errors://delegation/authorization#MissingDelegatorSealError"
        - "errors://delegation#DelegationChainError"
    refs: ["domain://identity"]

  - id: "port://delegation/inbound/delegation-query"
    type: inbound
    name: "Delegation Query"
    semantics: query
    idempotent: true
    contract:
      input: "types://cesr/primitives#AID"
      # L4-O3: array[string] is too loose — should be DelegationChainRef
      # NOTE: A future revision SHOULD change the output to array[DelegationChainRef]
      # where DelegationChainRef = {aid: AID, delegator_aid: AID | null, depth: integer}.
      # This makes the chain structure explicit and queryable. Current array[string] (AID strings)
      # is a placeholder that loses the parent-link information needed for chain traversal.
      output: "array[types://cesr/primitives#AID]"
      errors: []
    refs: ["domain://identity"]
