domain_ref: "delegation/authorization"

types:
  - name: "DelegationSeal"
    description: "The seal a delegator commits in their own KEL to approve a delegated event. Created via an interaction event (ixn), rotation event (rot), or inception event (icp) in the delegator's KEL."
    variants:
      - name: "default"
        fields:
          - name: "i"
            type: "string"
            required: true
            description: "Delegate's AID prefix"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number of the delegated event being approved — wire format is lowercase hexadecimal with no leading zeros (e.g. '0', 'a', 'ff'); domain model consumers should treat this as an integer with hex string encoding"
          - name: "d"
            type: "string"
            required: true
            description: "SAID of the delegated event being approved"
        invariants:
          - "Must appear in the anchor (a) list of a delegator's interaction or establishment event"
          - "The SAID d must exactly match the delegated event's computed SAID"
          - "The seal binds the delegator's approval to this specific delegated event — changing any field in the delegated event invalidates the seal"

  - name: "TwoWayBinding"
    description: "A verified bidirectional delegation binding confirming both delegator seal and delegatee di field agree."
    variants:
      - name: "default"
        fields:
          - name: "delegator_aid"
            type: "string"
            required: true
            description: "AID of the delegator who committed the approval seal"
          - name: "delegatee_aid"
            type: "string"
            required: true
            description: "AID of the delegated identifier"
          - name: "seal_event_sn"
            type: "integer"
            required: true
            description: "Sequence number of the delegator's event containing the approval seal"
          - name: "seal_said"
            type: "string"
            required: true
            description: "SAID of the delegated event referenced by the seal"
          - name: "di_field"
            type: "string"
            required: true
            description: "Delegator AID from the delegated event's di field"
        invariants:
          - "delegator_aid must equal di_field — the two directions must agree"
          - "seal_said must match the delegated event's computed SAID"
          - "Both the delegator's sealing event and the delegatee's event must be independently valid"

  - name: "DelegationSealSource"
    description: "A CESR attachment (SealSourceCouples, code -S) consisting of a (Fixed-Width Ordinal, Digest) couple that links a delegated event to the delegator's approval event. This is an ATTACHMENT type, NOT an event body field — the event body has di (delegator prefix) but the source seal couple is external."
    variants:
      - name: "default"
        fields:
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the delegator's event containing the seal (Fixed-Width Ordinal)"
          - name: "said"
            type: "string"
            required: true
            description: "SAID of the delegator's event containing the seal (Digest)"
        invariants:
          - "Transmitted as a CESR SealSourceCouples (-S) attachment, not part of the event body"
          - "Used by validators to locate the approval seal without scanning the full delegator KEL"
          - "The event body has di (delegator prefix); the source seal couple is a separate attachment"

  - name: "DiFieldValue"
    description: "The delegator AID reference embedded in a delegated inception event's di field."
    variants:
      - name: "default"
        fields:
          - name: "delegator_aid"
            type: "string"
            required: true
            description: "AID of the delegator authorizing this delegation"
        invariants:
          - "Only present in dip events — drt events inherit the delegator from the inception"
          - "Immutable once set — the delegator cannot change for the lifetime of the delegated identifier"

  - name: "AnchorPayload"
    description: "The set of delegation seals to embed in a delegating event's anchor list."
    variants:
      - name: "default"
        fields:
          - name: "seals"
            type: "array[Seal]"
            required: true
            description: "Delegation seals approving one or more delegated events"
            constraints:
              min_length: 1
        invariants:
          - "Each seal contains the delegatee's AID, sn, and SAID"
          - "Multiple delegations can be approved in a single delegating event"
          - "Placed in the a (anchor) field of the delegator's interaction or establishment event"
