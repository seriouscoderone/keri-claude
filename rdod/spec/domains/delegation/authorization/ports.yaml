# ports.yaml
domain_ref: "delegation/authorization"

ports:
  # Inbound — what clients call
  - id: "port://delegation/authorization/inbound/binding-lifecycle"
    type: inbound
    name: "Binding Lifecycle"
    semantics: command
    idempotent: false
    contract:
      input: "types://identity/establishment#KeyEvent"
      output: "types://delegation/authorization#TwoWayBinding"
      errors:
        - "errors://delegation/authorization#MissingDelegatorSealError"
        - "errors://delegation/authorization#MissingDelegableApprovalError"
        - "errors://delegation/authorization#InvalidDelegatorError"
        - "errors://delegation/authorization#DelegationNotAllowedError"
        - "errors://delegation/authorization#SupersedingDelegationError"
    refs: ["domain://delegation"]

  - id: "port://delegation/authorization/inbound/seal-construction"
    type: inbound
    name: "Seal Construction"
    semantics: command
    idempotent: false
    description: >
      Accepts an array of DelegationSeals (one per delegated event being approved) and
      constructs the AnchorPayload to embed in the delegating event. Multiple delegations
      can be batched into a single delegating event — one seal per delegated event in the array.
    contract:
      input: "array[types://delegation/authorization#DelegationSeal]"
      output: "types://delegation/authorization#AnchorPayload"
      errors:
        - "errors://delegation/authorization#SealMismatchError"
    refs: ["domain://delegation"]
    notes: >
      H-O10: Changed from single DelegationSeal to array[DelegationSeal]. The KERI spec
      allows a delegating event to approve multiple delegated events in a single anchor (a) list.
      The input MUST be an array of length >= 1; the output AnchorPayload.seals contains
      all provided seals in order.
