# ports.yaml
domain_ref: "delegation/authorization"

ports:
  # Inbound — what clients call
  - id: "port://delegation/authorization/inbound/binding-lifecycle"
    type: inbound
    name: "Binding Lifecycle"
    semantics: command
    idempotent: false
    contract:
      input: "types://identity/establishment#KeyEvent"
      output: "types://delegation/authorization#TwoWayBinding"
      errors:
        - "errors://delegation/authorization#MissingDelegatorSealError"
        - "errors://delegation/authorization#MissingDelegableApprovalError"
        - "errors://delegation/authorization#InvalidDelegatorError"
        - "errors://delegation/authorization#DelegationNotAllowedError"
        - "errors://delegation/authorization#SupersedingDelegationError"
    refs: ["domain://delegation"]

  - id: "port://delegation/authorization/inbound/seal-construction"
    type: inbound
    name: "Seal Construction"
    semantics: command
    idempotent: false
    contract:
      input: "types://delegation/authorization#DelegationSeal"
      output: "types://delegation/authorization#AnchorPayload"
      errors:
        - "errors://delegation/authorization#SealMismatchError"
    refs: ["domain://delegation"]
