# verification.yaml
domain_ref: "delegation/authorization"

properties:
  - invariant: "Cooperative delegation MUST require both parties to participate: the delegatee MUST sign the establishment event AND the delegator MUST anchor a seal in its KEL; if either is missing, the delegation is incomplete and MUST NOT be accepted"
    term: "Cooperative Delegation"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(delegatee_signed=st.booleans(), delegator_sealed=st.booleans())
        def test_cooperative_requires_both(delegatee_signed, delegator_sealed):
            delegation = build_delegation(
                delegatee_signed=delegatee_signed,
                delegator_sealed=delegator_sealed
            )
            if delegatee_signed and delegator_sealed:
                assert delegation.is_complete(), "Both signed + sealed = complete delegation"
            else:
                assert not delegation.is_complete(), (
                    f"Delegation with signed={delegatee_signed}, sealed={delegator_sealed} "
                    f"must NOT be complete"
                )
    strategy: "st.booleans() for each party's participation"
    notes: "Cooperative delegation requires BOTH the delegatee's signed event AND the delegator's seal."

  - invariant: "The two-way binding MUST be cryptographically verifiable: the delegatee's dip event contains a di field referencing the delegator AND the delegator's KEL contains a seal where seal.d == delegatee_event.said; verify_binding MUST check both directions"
    term: "Cooperative Delegation"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(delegation=delegation_strategy())
        def test_two_way_binding_verifiable(delegation):
            # Forward binding: delegatee references delegator
            assert delegation.delegatee_event.di is not None
            assert is_valid_aid(delegation.delegatee_event.di)
            # Reverse binding: delegator seal commits to delegatee event
            assert delegation.delegator_seal.d == delegation.delegatee_event.said, (
                f"Seal digest {delegation.delegator_seal.d} must match event SAID "
                f"{delegation.delegatee_event.said}"
            )
            # Full binding verification
            assert verify_binding(delegation.delegatee_event.di, delegation.delegator_seal)
    strategy: "delegation_strategy()"
    notes: "The binding is verifiable because the seal's digest commits to the delegated event's SAID."

  - invariant: "The delegator MUST retain establishment control authority over the delegated AID: every dip and drt event for the delegated AID MUST require the delegator's seal approval; without this approval, the event MUST NOT be accepted into any validator's KEL"
    term: "Delegator"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(delegator=delegator_strategy(), delegatee=delegatee_strategy(),
               event_type=st.sampled_from(['dip', 'drt']))
        def test_delegator_retains_establishment_control(delegator, delegatee, event_type):
            event = build_delegated_event(delegatee, event_type)
            assert event.requires_delegator_seal(), (
                f"{event_type} event must require delegator seal approval"
            )
            # Without seal, validation must fail at step 3
            result = validate_without_seal(event)
            assert not result.is_approved(), (
                f"{event_type} without delegator seal must not be approved"
            )
    strategy: "delegator_strategy() x delegatee_strategy() x st.sampled_from for event types"
    notes: "The delegator must approve all establishment events — this is the retained authority."

  - invariant: "The delegator can effectively revoke delegation by refusing to seal subsequent establishment events; a drt event without the delegator's seal in the delegator's KEL MUST remain in escrow indefinitely (until timeout) and MUST NOT be accepted"
    term: "Delegator"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(delegator=delegator_strategy(), delegatee_drt=delegated_rotation_strategy())
        def test_delegator_revocation_by_refusal(delegator, delegatee_drt):
            # Delegator refuses to approve
            assert not delegator.approves(delegatee_drt)
            result = validate_delegation(delegatee_drt)
            assert result.disposition in ('escrowed_pde', 'escrowed_delegable'), (
                f"drt without delegator approval must be escrowed, got {result.disposition}"
            )
            assert result.disposition != 'approved'
    strategy: "delegator_strategy() x delegated_rotation_strategy()"
    notes: "Without delegator approval, a delegated rotation cannot be validated — effective revocation."

  - invariant: "The delegatee MUST be able to authorize non-establishment events (ixn) independently using only its own signing keys; ixn events MUST NOT require delegator seal approval; ixn events for a delegated AID require only the delegatee's signing keys"
    term: "Delegatee"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(delegatee=delegatee_strategy(), ixn=interaction_event_strategy())
        def test_delegatee_independent_ixn(delegatee, ixn):
            assume(ixn.aid == delegatee.aid)
            assert ixn.requires_only(delegatee.signing_keys), (
                "ixn events must require only the delegatee's signing keys"
            )
            assert not ixn.requires_delegator_seal(), (
                "ixn events must NOT require delegator seal approval"
            )
    strategy: "delegatee_strategy() x interaction_event_strategy()"
    notes: "Interaction events require only the delegatee's signing keys — no delegator involvement."

  - invariant: "All establishment events (dip, drt) require delegator seal approval"
    term: "Delegatee"
    technique: property-based
    formal:
      language: python
      expression: "lambda delegatee, event: (event.type in ('dip', 'drt') and event.aid == delegatee.aid) implies event.requires_delegator_seal()"
    strategy: "st.tuples(st.from_type(Delegatee), st.from_type(EstablishmentEvent))"
    notes: "Establishment events always require the delegator's seal in addition to the delegatee's signatures"

  - invariant: "A delegation seal MUST contain all three fields: i (delegatee AID, non-null, CESR-qualified), s (delegated event sn, integer >= 0), d (delegated event SAID, non-null, CESR-qualified); a seal missing any field MUST be rejected"
    term: "Delegation Seal"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(has_i=st.booleans(), has_s=st.booleans(), has_d=st.booleans())
        def test_seal_requires_all_fields(has_i, has_s, has_d):
            seal = build_seal(
                i=generate_aid() if has_i else None,
                s=0 if has_s else None,
                d=generate_said() if has_d else None
            )
            if has_i and has_s and has_d:
                assert seal.is_valid(), "Seal with all fields must be valid"
            else:
                assert not seal.is_valid(), (
                    f"Seal missing i={not has_i}, s={not has_s}, d={not has_d} must be invalid"
                )
    strategy: "st.booleans() x3 for field presence"
    notes: "All three fields are mandatory — any missing field invalidates the seal."

  - invariant: "The seal's d field MUST exactly equal the SAID of the delegated event; if the delegated event's content changes (even by one byte), its SAID changes and the seal no longer matches; seal.d != event.said MUST cause validation step 4 to fail"
    term: "Delegation Seal"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(seal=delegation_seal_strategy(), event=delegated_event_strategy(),
               tamper=st.booleans())
        def test_seal_commits_to_event_content(seal, event, tamper):
            if not tamper:
                seal.d = event.said
                assert seal.d == event.said
            else:
                # Tamper with event content changes the SAID
                tampered_event = tamper_event_content(event)
                assert tampered_event.said != event.said, (
                    "Tampering must change the SAID"
                )
                assert seal.d != tampered_event.said, (
                    "Seal must not match tampered event"
                )
    strategy: "delegation_seal_strategy() x delegated_event_strategy() x st.booleans"
    notes: "The SAID of the delegated event is the seal's d field — content commitment via cryptographic digest."

  - invariant: "The ordering of seals within the event is significant for superseding recovery (rule B2)"
    term: "Delegating Event"
    technique: smt
    formal:
      language: z3
      expression: "Implies(And(seal_a_index < seal_b_index, same_delegating_event(seal_a, seal_b)), supersedes(seal_b, seal_a))"
    notes: "Seal ordering within a delegating event determines superseding priority under rule B2"

  - invariant: "Only present in delegated inception events (dip), NOT in delegated rotation events (drt)"
    term: "di Field"
    technique: property-based
    formal:
      language: pseudocode
      expression: |
        Delegated inception events (type='dip') MUST have a di field containing the
        delegator's AID. Non-delegated inception events (type='icp') MUST NOT have a
        di field. Delegated rotation events (type='drt') MUST NOT have a di field.
        The presence of di and the event type must be consistent:
          if event.type == 'dip' then di field MUST be present
          if event.type in ('icp', 'drt') then di field MUST be absent
    strategy: "All delegated event types (dip, drt) plus non-delegated (icp)"
    notes: "Strict presence/absence constraint — di in dip, no di in drt"

  - invariant: "Both references must exist for a valid delegation"
    term: "Two-way Binding"
    technique: property-based
    formal:
      language: python
      expression: "lambda delegatee_event, delegator_kel: valid_delegation(delegatee_event, delegator_kel) == (delegatee_event.di is not None and any(seal.d == delegatee_event.said and seal.i == delegatee_event.aid for event in delegator_kel.events for seal in event.seals))"
    strategy: "st.tuples(st.from_type(DelegatedInceptionEvent), st.from_type(KEL))"
    notes: "Both the di field and the matching seal must exist — missing either side means no valid delegation"

  - invariant: "Neither party can forge the other's binding"
    term: "Two-way Binding"
    technique: property-based
    formal:
      language: python
      expression: "lambda binding: binding.delegatee_event.signed_by(binding.delegatee_keys) and binding.delegator_seal_event.signed_by(binding.delegator_keys) and binding.delegatee_keys != binding.delegator_keys"
    strategy: "st.from_type(TwoWayBinding)"
    notes: "Each side uses its own keys — unforgeability comes from separate key sets"

  - invariant: "The couple allows validators to locate the specific event in the delegator's KEL that approves the delegation"
    term: "Delegation Seal Source"
    technique: property-based
    formal:
      language: python
      expression: "lambda source_seal, delegator_kel: delegator_kel.event_at(source_seal.sn).said == source_seal.digest"
    strategy: "st.tuples(st.from_type(DelegationSealSource), st.from_type(KEL))"
    notes: "The source seal must point to an actual event in the delegator's KEL with a matching digest"

contracts:
  - port_ref: "port://delegation/authorization/inbound/binding-lifecycle"
    preconditions:
      - formal:
          language: python
          expression: "lambda delegatee_aid, sn, said: delegatee_aid is not None and sn >= 0 and said is not None"
        description: "Seal creation requires valid delegatee AID, non-negative sn, and a SAID"
      - formal:
          language: python
          expression: "lambda delegator_aid: delegator_aid is not None and len(delegator_aid) > 0"
        description: "di field binding requires a valid delegator AID"
    postconditions:
      - formal:
          language: python
          expression: "lambda seal: seal.i is not None and seal.s >= 0 and seal.d is not None"
        description: "Created seal has all three required fields (i, s, d)"
      - formal:
          language: python
          expression: "lambda result: result.is_bound() implies (result.seal_verified and result.di_verified)"
        description: "verify_two_way_binding confirms both the seal and the di field"

  - port_ref: "port://delegation/authorization/inbound/seal-construction"
    preconditions:
      - formal:
          language: python
          expression: "lambda seals: len(seals) >= 1 and all(s.valid() for s in seals)"
        description: "At least one valid seal is required for delegating event payload construction"
    postconditions:
      - formal:
          language: python
          expression: "lambda payload: len(payload.seals) >= 1 and all(s.i is not None and s.d is not None for s in payload.seals)"
        description: "Constructed payload contains all input seals with valid structure"
      - formal:
          language: python
          expression: "lambda seal, event, result: result.is_matched() implies seal.d == event.said and seal.i == event.aid"
        description: "match_seal_to_event succeeds iff the seal's digest matches the event's SAID and the seal's i matches the event's AID"
