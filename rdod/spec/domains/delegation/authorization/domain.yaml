# domain.yaml
template_version: "1.0"
id: "delegation/authorization"
name: "Delegation Authorization"
description: >
  Delegator approves or denies — cooperative delegation mechanism. How delegator and delegatee
  create a cryptographically verifiable mutual commitment through seals and the di field. This subdomain owns the two-way
  binding protocol: the delegatee references the delegator via the di field in its inception event,
  and the delegator anchors a seal in its own KEL committing to the delegated event's digest.
  Together these form a cryptographic peg that neither party can forge unilaterally.
version: "0.1.0"

source_material:
  - type: document
    reference: "keri-specification.md — sections: Cooperative Delegation, Delegated Inception Event Message Body (di field), Interaction Event Seals"
  - type: document
    reference: "KERI_WP_2.x.web.md — sections: Cooperative Delegation, Two-way Binding"
  - type: implementation
    reference: "keripy — src/keri/core/eventing.py (delegation seal construction, di field handling), src/keri/core/coring.py (deSourceCouple — Seqner + Saider couple)"
  - type: implementation
    reference: "keriox — keriox_core/src/event/event_data/delegated.rs (SourceSeal struct with sn and digest fields)"

domain_clients:
  - ref: "domain://delegation"
    relationship: "Parent delegation domain delegates cooperative binding mechanics — seal construction, di field binding, and source seal coupling"
    via_port: "port://delegation/authorization/inbound/binding-lifecycle"

subdomains: []

kernels:
  - ref: "external://cryptographic-primitives"
    source: "Blake3-256/SHA-256 (SAID digest computation for delegation seals — the seal's d field commits to the delegated event's digest), AID derivation incorporating the di field value"
    relationship: "Delegation binding relies on digest computation to create the seal commitment and AID derivation that incorporates the delegator reference — kernel types appear directly"

adjacents: []

externals: []

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    In keripy, the delegation seal is constructed as a dict with i (delegatee AID), s (sn), and
    d (SAID) fields, embedded in the delegator's interaction or rotation event. The delegatee's dip
    event includes the di field. The deSourceCouple (Seqner + Saider) is attached to delegated events
    to point validators back to the delegator's anchoring event. In keriox, the SourceSeal struct
    (sn + digest) serves the same purpose, carried alongside delegated events to enable validator
    lookup of the delegator's approval.

issues: []

tags: ["binding", "cooperative", "seal", "di-field", "two-way-peg", "source-seal"]
