# errors.yaml
domain_ref: "delegation/authorization"

# Error catalog for the Delegation Authorization domain.
# Maps to exception classes in keripy/src/keri/kering.py and
# raise sites in keripy/src/keri/core/eventing.py (Kever.validateDelegation,
# Kever.valSigsWigsDel, Kever.__init__ / .update for config traits).
#
# Severity levels:
#   transient  — condition may self-resolve (escrow and retry)
#   recoverable — requires operator or protocol-level action
#   fatal      — unrecoverable; event is permanently rejected

errors:
  - name: "MissingDelegatorSealError"
    keripy_class: "kering.MissingDelegationError"
    description: "Delegator has not anchored a seal approving this delegated event"
    cause: "No interaction or rotation event in the delegator's KEL contains an anchor seal matching the delegated event's (prefix, sn, SAID) — the delegator has not yet approved the delegation"
    recovery: "escrow"
    escrow_queue: "PDE"
    severity: "transient"
    context:
      - field: "delegate_prefix"
        type: "string"
        description: "The delegated identifier's AID"
      - field: "delegator_prefix"
        type: "string"
        description: "The delegator's AID"
      - field: "event_said"
        type: "string"
        description: "The SAID of the delegated event awaiting approval"
      - field: "event_sn"
        type: "integer"
        description: "The sequence number of the delegated event"
    related_port: "port://delegation/authorization/inbound/binding-lifecycle"
    keripy_raise_site: "eventing.py:Kever.validateDelegation — multiple raise sites when seal not found in delegator's KEL"

  - name: "MissingDelegableApprovalError"
    keripy_class: "kering.MissingDelegableApprovalError"
    description: "Delegation source seal present but cannot be verified against the delegator's KEL"
    cause: "The delegated event carries a delegation source seal attachment (delnum, deldiger) but the referenced delegating event cannot be found or confirmed in the delegator's KEL"
    recovery: "escrow"
    escrow_queue: "MDE"
    severity: "transient"
    context:
      - field: "delegate_prefix"
        type: "string"
        description: "The delegated identifier's AID"
      - field: "delegator_prefix"
        type: "string"
        description: "The delegator's AID"
      - field: "source_seal_sn"
        type: "integer"
        description: "The sn from the delegation source seal couple"
      - field: "source_seal_dig"
        type: "string"
        description: "The digest from the delegation source seal couple"
    related_port: "port://delegation/authorization/inbound/binding-lifecycle"
    keripy_raise_site: "eventing.py:Kever.valSigsWigsDel — delegable approval check; also escrow MDE processing"

  - name: "InvalidDelegatorError"
    keripy_class: "kering.ValidationError"
    description: "The delegator AID does not exist or has no key state"
    cause: "Delegator prefix specified in the di field is not found in kevers — the delegator's inception event has not been received or processed"
    recovery: "escrow"
    severity: "transient"
    context:
      - field: "delegator_prefix"
        type: "string"
        description: "The delegator's AID that could not be found"
      - field: "delegate_prefix"
        type: "string"
        description: "The delegated identifier that references this delegator"
    related_port: "port://delegation/authorization/inbound/binding-lifecycle"
    keripy_raise_site: "eventing.py:Kever.validateDelegation — delegator prefix lookup in kevers"

  - name: "DelegationNotAllowedError"
    keripy_class: "kering.ConfigurationError"
    description: "The target identifier has the DND (Do Not Delegate) configuration trait"
    cause: "The delegator identifier was created with the 'DND' configuration trait in its inception event — this permanently forbids creating delegated identifiers under it"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "delegator_prefix"
        type: "string"
        description: "The delegator's AID with DND trait"
      - field: "config_traits"
        type: "array[string]"
        description: "The configuration traits on the delegator's inception event"
    related_port: "port://delegation/authorization/inbound/binding-lifecycle"
    keripy_raise_site: "eventing.py:Kever — doNotDelegate trait check during delegation processing"

  - name: "SealMismatchError"
    keripy_class: "kering.ValidationError"
    description: "Delegation seal fields do not match the delegated event"
    cause: "The anchor seal found in the delegator's KEL has a prefix, sn, or SAID that does not match the delegated event being validated — the seal does not authorize this specific event"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "seal_prefix"
        type: "string"
        description: "The prefix in the delegation seal"
      - field: "seal_sn"
        type: "integer"
        description: "The sequence number in the delegation seal"
      - field: "seal_said"
        type: "string"
        description: "The SAID in the delegation seal"
      - field: "event_prefix"
        type: "string"
        description: "The delegated event's prefix"
      - field: "event_sn"
        type: "integer"
        description: "The delegated event's sequence number"
      - field: "event_said"
        type: "string"
        description: "The delegated event's SAID"
    related_port: "port://delegation/authorization/inbound/seal-construction"
    keripy_raise_site: "eventing.py:Kever.validateDelegation — seal field comparison"

  - name: "SupersedingDelegationError"
    keripy_class: "kering.MissingDelegationError"
    description: "A potentially superseding delegation was detected but the superseding event's own delegation cannot be verified"
    cause: "During cooperative delegation recovery, a newer delegating event was found in the delegator's KEL but the corresponding superseding delegated event or its delegation seal cannot be fully validated"
    recovery: "escrow"
    escrow_queue: "PDE"
    severity: "transient"
    context:
      - field: "delegate_prefix"
        type: "string"
        description: "The delegated identifier's AID"
      - field: "original_said"
        type: "string"
        description: "The SAID of the original delegated event"
      - field: "superseding_said"
        type: "string"
        description: "The SAID of the potentially superseding delegated event"
      - field: "delegator_prefix"
        type: "string"
        description: "The delegator's AID"
    related_port: "port://delegation/authorization/inbound/binding-lifecycle"
    keripy_raise_site: "eventing.py:Kever.validateDelegation — superseding delegation chain validation"
