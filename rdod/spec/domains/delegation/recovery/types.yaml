domain_ref: "delegation/recovery"

types:
  - name: "DelegatedRotation"
    description: "A rotation event in delegation context, paired with the delegator AID for superseding evaluation."
    variants:
      - name: "default"
        fields:
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "The rotation key event body (rot or drt)"
          - name: "delegator_aid"
            type: "string"
            required: true
            description: "AID of the delegator authorizing this rotation"
        invariants:
          - "event.t must be 'rot' or 'drt'"
          - "Used as input to superseding rule evaluation"

  - name: "SupersedingRule"
    description: >
      Alias for types://integrity/recovery#SupersedingRule — the canonical superseding rule enum.
      Delegation/recovery uses B1-B3 and C/C1 rules with delegation-specific context (seal
      verification, delegator KEL traversal) but does not redefine the superseding logic. See
      integrity/recovery/types.yaml for the canonical definition of all rule variants (A0, A1,
      A2, B1, B2, B3, C, C1).
    variants:
      - name: "default"
        fields:
          - name: "rule"
            type: "types://integrity/recovery#SupersedingRule"
            required: true
            description: "The canonical superseding rule from the integrity/recovery domain"

  - name: "NotSuperseding"
    description: "Result when no superseding rule applies between two candidate events."
    variants:
      - name: "default"
        fields:
          - name: "reason"
            type: "string"
            required: true
            description: "Why no superseding rule applies"
        invariants:
          - "The incumbent event remains authoritative — the candidate is rejected"

  - name: "CompromiseRequirement"
    description: "The minimum key compromise needed for a given attack scenario against a delegated identifier. The protocol does not distinguish custodial from non-custodial delegation — custodial delegation is a deployment pattern, not a separate protocol concept."
    variants:
      - name: "default"
        fields:
          - name: "minimum_keys"
            type: "integer"
            required: true
            description: "Minimum number of keys that must be compromised across both parties"
          - name: "key_sets"
            type: "array[string]"
            required: true
            description: "Which key sets must be compromised (e.g., delegatee current signing, delegatee next pre-rotation, delegator signing)"
        invariants:
          - "Delegated recovery requires compromising both delegatee AND delegator keys"
          - "Joint compromise threshold is the sum of both identifiers' thresholds"
          - "The protocol makes no distinction between custodial and non-custodial delegation — same rules apply"

  - name: "SupersedingOrder"
    description: "The ordering result when comparing two conflicting events for superseding priority."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            description: "Which event takes priority"
            constraints:
              enum: ["FirstSupersedes", "SecondSupersedes", "Neither"]
        invariants:
          - "FirstSupersedes means the candidate replaces the incumbent"
          - "Neither means neither event can supersede the other — both may be duplicitous"

  - name: "EventType"
    description: "Event type classification used in superseding rule evaluation."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            description: "The KERI event type"
            constraints:
              enum: ["Inception", "Rotation", "Interaction", "DelegatedInception", "DelegatedRotation"]
        invariants:
          - "Establishment types (Inception, Rotation, DelegatedInception, DelegatedRotation) can supersede"
          - "Interaction events cannot supersede establishment events (Rule A2)"

  - name: "DelegatingEventRef"
    description: "A reference to a delegating event in the delegator's KEL, used to compare seal ordering."
    variants:
      - name: "default"
        fields:
          - name: "delegator_aid"
            type: "string"
            required: true
            description: "AID of the delegator"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the delegating event in the delegator's KEL"
          - name: "said"
            type: "string"
            required: true
            description: "SAID of the delegating event"
        invariants:
          - "Used in Rule B1 — higher delegating event sn means the superseding rotation wins; comparison uses sn (sequence number), NOT fn (first-seen number)"
          - "Used in Rule B2 — within the same delegating event, later seal index wins"
