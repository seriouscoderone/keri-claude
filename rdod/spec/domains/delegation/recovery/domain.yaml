# domain.yaml
template_version: "2.0"
id: "delegation/recovery"
name: "Delegation Recovery"
description: >
  Recovery from key compromise via the delegation hierarchy. Covers the joint compromise
  requirement (must compromise both delegatee and delegator keys), the delegated superseding
  rules (B1-B3-C, imported from integrity/recovery) that govern how one delegated rotation
  can supersede another based on delegating event ordering, and the security properties of
  multi-level delegation chains. Custodial delegation is a deployment pattern, not a separate
  protocol concept. This is pure protocol logic — no cryptography, no persistence — just the
  rules governing delegation-based recovery.
version: "0.1.0"
tier: "domain"

source_material:
  - type: document
    reference: "keri-specification.md — sections: Delegated Event Live-attacks, Superseding Rules B1-B3 and C, Combined Arms"
  - type: document
    reference: "KERI_WP_2.x.web.md — sections: Custodial Delegation, Combined Arms, Delegation Security"
  - type: document
    reference: "KERI_SecurityDeepDive.web.md — sections: Combined Arms, Delegation Security, Multi-level Delegation"

domain_clients:
  - ref: "domain://delegation"
    relationship: "Parent delegation domain delegates recovery logic — superseding rules, joint compromise analysis, and custodial delegation semantics"
    via_port: "port://delegation/recovery/inbound/recovery-rules"

subdomains: []

kernels: []

adjacents:
  - ref: "domain://integrity/recovery"
    relationship: "Imports SupersedingRule enum — integrity/recovery owns the canonical superseding rules (A0-C1); delegation/recovery adds delegation-specific context (seal verification, delegator KEL traversal)"
    via_port: "port://integrity/recovery/inbound/superseding-rules"

externals: []

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    This is a leaf domain — pure protocol logic with no kernel or external dependencies.
    The superseding rules B1-B3-C define an ordering relation over delegated rotations based
    on the delegating event's position in the delegator's KEL. Implementations encode these
    rules in the event processing pipeline: in keripy, the superseding logic is embedded in
    Kevery's delegation processing; in keriox, it is part of the validator module. Custodial
    delegation is a deployment pattern (delegator holds pre-rotated keys) rather than a
    separate code path — the same cooperative delegation mechanics apply.

issues: []

tags: ["recovery", "superseding", "joint-compromise", "custodial", "security", "combined-arms"]
