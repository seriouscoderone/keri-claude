domain_ref: "delegation"

types:
  - name: "DelegatedInceptionConfig"
    description: "Construction parameters for creating a delegated identifier, including the delegator reference."
    variants:
      - name: "default"
        fields:
          - name: "delegator_aid"
            type: "string"
            required: true
            description: "AID of the delegator authorizing this new identifier"
          - name: "keys"
            type: "array[PublicKey]"
            required: true
            description: "Initial signing public keys for the delegated identifier"
            constraints:
              min_length: 1
          - name: "threshold"
            type: "string"
            required: true
            description: "Signing threshold expression"
          - name: "next_keys"
            type: "array[Digest]"
            required: true
            description: "Pre-rotation digest commitments for next signing keys"
          - name: "witnesses"
            type: "array[AID]"
            required: true
            description: "Designated witness AIDs"
          - name: "toad"
            type: "integer"
            required: true
            description: "Witness threshold (TOAD)"
            constraints:
              min: 0
        invariants:
          - "delegator_aid must be a transferable identifier with established key state"
          - "The delegator must not have the DND (DoNotDelegate) trait"
          - "toad <= len(witnesses)"

  - name: "DelegatedInceptionEvent"
    description: "A delegated inception event (dip) paired with its delegator AID reference."
    variants:
      - name: "default"
        fields:
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "The dip key event body"
          - name: "delegator_aid"
            type: "string"
            required: true
            description: "AID of the delegator (matches the di field in the event)"
        invariants:
          - "event.t must be 'dip'"
          - "event.di must equal delegator_aid"
          - "Requires a corresponding delegation seal in the delegator's KEL to be fully valid"

  - name: "DelegatedRotationEvent"
    description: "A delegated rotation event (drt) paired with its delegator AID reference."
    variants:
      - name: "default"
        fields:
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "The drt key event body"
          - name: "delegator_aid"
            type: "string"
            required: true
            description: "AID of the delegator (established at inception via di field)"
        invariants:
          - "event.t must be 'drt'"
          - "Delegator cannot change after inception — delegator_aid is immutable"
          - "Requires a corresponding delegation seal in the delegator's KEL to be fully valid"

  - name: "DelegationBinding"
    description: "The two-event binding between delegate and delegator that establishes or modifies a delegated identifier."
    variants:
      - name: "inception"
        fields:
          - name: "delegate_event"
            type: "types://identity/establishment#InceptionEvent"
            required: true
            description: "The delegated inception event (dip) with di field"
          - name: "delegator_seal_event"
            type: "types://identity/establishment#InteractionEvent"
            required: true
            description: "The delegator's event containing the approval seal"
          - name: "seal"
            type: "types://delegation/authorization#DelegationSeal"
            required: true
            description: "The specific seal within the delegator's event"
        invariants:
          - "delegate_event.di must equal the delegator's AID prefix"
          - "seal.d must equal delegate_event.d (SAID match)"
          - "seal.i must equal delegate_event.i (prefix match)"
          - "Both events must be independently validated and accepted to their respective KELs"
      - name: "rotation"
        fields:
          - name: "delegate_event"
            type: "types://identity/establishment#RotationEvent"
            required: true
            description: "The delegated rotation event (drt)"
          - name: "delegator_seal_event"
            type: "types://identity/establishment#InteractionEvent"
            required: true
            description: "The delegator's event containing the approval seal"
          - name: "seal"
            type: "types://delegation/authorization#DelegationSeal"
            required: true
            description: "The approval seal"
        invariants:
          - "Same SAID matching as inception binding"
          - "Delegator cannot change — di is immutable after inception"
