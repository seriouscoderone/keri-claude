domain_ref: "delegation"

types:
  - name: "DelegationSeal"
    description: "The seal a delegator anchors in their own KEL to approve a delegated event. Created via an interaction event in the delegator's KEL."
    variants:
      - name: "default"
        fields:
          - name: "i"
            type: "string"
            required: true
            description: "Delegate's AID prefix"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number of the delegated event being approved"
          - name: "d"
            type: "string"
            required: true
            description: "SAID of the delegated event being approved"
        invariants:
          - "Must appear in the anchor (a) list of a delegator's interaction or establishment event"
          - "The SAID d must exactly match the delegated event's computed SAID"
          - "The seal binds the delegator's approval to this specific delegated event — changing any field in the delegated event invalidates the seal"

  - name: "DelegationBinding"
    description: "The two-event binding between delegate and delegator that establishes or modifies a delegated identifier."
    variants:
      - name: "inception"
        fields:
          - name: "delegate_event"
            type: "TypeRef:identity#InceptionEvent"
            required: true
            description: "The delegated inception event (dip) with di field"
          - name: "delegator_seal_event"
            type: "TypeRef:identity#InteractionEvent"
            required: true
            description: "The delegator's event containing the approval seal"
          - name: "seal"
            type: "DelegationSeal"
            required: true
            description: "The specific seal within the delegator's event"
        invariants:
          - "delegate_event.di must equal the delegator's AID prefix"
          - "seal.d must equal delegate_event.d (SAID match)"
          - "seal.i must equal delegate_event.i (prefix match)"
          - "Both events must be independently validated and accepted to their respective KELs"
      - name: "rotation"
        fields:
          - name: "delegate_event"
            type: "TypeRef:identity#RotationEvent"
            required: true
            description: "The delegated rotation event (drt)"
          - name: "delegator_seal_event"
            type: "TypeRef:identity#InteractionEvent"
            required: true
            description: "The delegator's event containing the approval seal"
          - name: "seal"
            type: "DelegationSeal"
            required: true
            description: "The approval seal"
        invariants:
          - "Same SAID matching as inception binding"
          - "Delegator cannot change — di is immutable after inception"
