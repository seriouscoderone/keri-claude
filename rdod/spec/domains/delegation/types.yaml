domain_ref: "delegation"

types:
  - name: "DelegatedInceptionConfig"
    description: "Construction parameters for creating a delegated identifier, including the delegator reference."
    variants:
      - name: "default"
        fields:
          - name: "delegator_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the delegator authorizing this new identifier"
          - name: "keys"
            type: "array[types://cesr/primitives#PublicKey]"
            required: true
            description: "Initial signing public keys for the delegated identifier"
            constraints:
              min_length: 1
          - name: "threshold"
            type: "string"
            required: true
            description: "Signing threshold expression"
          - name: "next_keys"
            type: "array[types://cesr/primitives#Digest]"
            required: true
            description: "Pre-rotation digest commitments for next signing keys"
          - name: "witnesses"
            type: "array[types://cesr/primitives#AID]"
            required: true
            description: "Designated witness AIDs"
          - name: "toad"
            type: "integer"
            required: true
            description: "Witness threshold (TOAD)"
            constraints:
              min: 0
        invariants:
          - "delegator_aid must be a transferable identifier with established key state"
          - "The delegator must not have the DND (DoNotDelegate) trait"
          - "toad <= len(witnesses)"

  - name: "DelegatedInceptionEvent"
    description: "A delegated inception event (dip) paired with its delegator AID reference."
    variants:
      - name: "default"
        fields:
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "The dip key event body"
          - name: "delegator_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the delegator (matches the di field in the event)"
        invariants:
          - "event.t must be 'dip'"
          - "event.di must equal delegator_aid"
          - "Requires a corresponding delegation seal in the delegator's KEL to be fully valid"

  - name: "DelegatedRotationEvent"
    description: "A delegated rotation event (drt) paired with its delegator AID reference."
    variants:
      - name: "default"
        fields:
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "The drt key event body"
          - name: "delegator_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the delegator (established at inception via di field)"
        invariants:
          - "event.t must be 'drt'"
          - "Delegator cannot change after inception — delegator_aid is immutable"
          - "Requires a corresponding delegation seal in the delegator's KEL to be fully valid"

  - name: "DelegationBinding"
    description: "The two-event binding between delegate and delegator that establishes or modifies a delegated identifier."
    variants:
      - name: "inception"
        fields:
          - name: "delegate_event"
            type: "types://identity/establishment#InceptionEvent"
            required: true
            description: "The delegated inception event (dip) with di field"
          - name: "delegator_seal_event"
            type: "types://identity/establishment#InteractionEvent"
            required: true
            description: "The delegator's event containing the approval seal"
          - name: "seal"
            type: "types://delegation/authorization#DelegationSeal"
            required: true
            description: "The specific seal within the delegator's event"
        invariants:
          - "delegate_event.di must equal the delegator's AID prefix"
          - "seal.d must equal delegate_event.d (SAID match)"
          - "seal.i must equal delegate_event.i (prefix match)"
          - "Both events must be independently validated and accepted to their respective KELs"
      - name: "rotation"
        fields:
          - name: "delegate_event"
            type: "types://identity/establishment#RotationEvent"
            required: true
            description: "The delegated rotation event (drt)"
          - name: "delegator_seal_event"
            type: "types://identity/establishment#InteractionEvent"
            required: true
            description: "The delegator's event containing the approval seal"
          - name: "seal"
            type: "types://delegation/authorization#DelegationSeal"
            required: true
            description: "The approval seal"
        invariants:
          - "Same SAID matching as inception binding"
          - "Delegator cannot change — di is immutable after inception"

  - name: "DelegatingEvent"
    description: "An event in the Delegator's KEL that contains a seal (digest) of the Delegatee's delegated event, thereby approving the delegation operation."
    variants:
      - name: "default"
        fields:
          - name: "delegator_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the delegator whose KEL contains this event"
          - name: "event_type"
            type: "string"
            required: true
            description: "The type of event used as the delegating vehicle (ixn, rot, or icp)"
            constraints:
              enum: ["ixn", "rot", "icp"]
          - name: "seals"
            type: "array[types://delegation/authorization#DelegationSeal]"
            required: true
            description: "Delegation seals in the anchor list approving delegated events"
            constraints:
              min_length: 1
        invariants:
          - "The seals appear in the event's anchor (a) field"
          - "Each seal binds a specific delegated event by AID, sn, and SAID"
          - "A single delegating event can approve multiple delegated events"

  - name: "DelegatedEvent"
    description: "An Establishment Event in the Delegatee's KEL that references the Delegator's AID, binding it to a specific delegation authority. Either a Delegated Inception or Delegated Rotation."
    variants:
      - name: "inception"
        fields:
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "The delegated inception event (dip)"
          - name: "delegator_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the delegator (di field)"
        invariants:
          - "event.t must be 'dip'"
          - "The di field explicitly names the delegator"
          - "The AID is a self-addressing SAID of the inception event"
      - name: "rotation"
        fields:
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "The delegated rotation event (drt)"
          - name: "delegator_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the delegator (inherited from inception)"
        invariants:
          - "event.t must be 'drt'"
          - "Delegator is inherited from the inception — di is immutable"

  - name: "DelegatedEstablishment"
    description: "Sub-class of Establishment Events consisting of Delegated Inception and Delegated Rotation event types."
    variants:
      - name: "inception"
        fields:
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "The delegated inception event (dip)"
        invariants:
          - "event.t must be 'dip'"
          - "Contains di field naming the delegator AID"
          - "The AID MUST be a self-addressing SAID of the inception event"
          - "Field order: v, t, d, i, s, kt, k, nt, n, bt, b, c, a, di"
      - name: "rotation"
        fields:
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "The delegated rotation event (drt)"
        invariants:
          - "event.t must be 'drt'"
          - "Like a standard Rotation but requires delegation approval"
          - "Delegator cannot change after inception"

  - name: "DelegationVerificationResult"
    description: "Typed result of delegation verification, replacing the prior bare boolean output. Provides verification status, the superseding rule applied (if any), chain depth, and failure reason for auditing."
    variants:
      - name: "default"
        fields:
          - name: "verified"
            type: "boolean"
            required: true
            description: "Whether the delegation was successfully verified"
          - name: "rule_applied"
            type: "string"
            required: false
            description: "The superseding rule applied during verification (e.g., 'B1', 'B2', 'B3', 'C'), null if no superseding rule was invoked"
            constraints:
              enum: ["B1", "B2", "B3", "C", null]
          - name: "chain_depth"
            type: "integer"
            required: true
            description: "Depth of the delegation chain from root (0 = non-delegated, 1 = direct delegate, etc.)"
            constraints:
              min: 0
          - name: "failure_reason"
            type: "string"
            required: false
            description: "Human-readable reason for verification failure, null on success"
        invariants:
          - "If verified is true, failure_reason MUST be null"
          - "If verified is false, failure_reason MUST be non-null"
          - "chain_depth >= 1 for any delegated identifier"

  - name: "DelegationChainLink"
    description: "One link in a delegation chain, providing the AID, its delegator, and its depth. Replaces the prior bare AID array output with structured chain traversal data."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The identifier at this chain level"
          - name: "delegator_aid"
            type: "types://cesr/primitives#AID"
            required: false
            description: "The delegator of this identifier, null for the root (non-delegated) AID"
          - name: "depth"
            type: "integer"
            required: true
            description: "Depth in the delegation chain (0 = root, 1 = first delegate, etc.)"
            constraints:
              min: 0
        invariants:
          - "If depth == 0, delegator_aid MUST be null (root is non-delegated)"
          - "If depth > 0, delegator_aid MUST be non-null"
          - "The chain array MUST be ordered from root (depth 0) to the queried AID (max depth)"

  - name: "CustodialRotation"
    description: "Controlled delegation of signing authority through rotation, where a custodian manages signing keys while the Controller retains rotation authority via pre-committed next keys."
    variants:
      - name: "default"
        fields:
          - name: "custodian_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the custodian managing the signing keys"
          - name: "controller_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the Controller retaining rotation authority"
        invariants:
          - "The custodian holds current signing keys — can sign interaction events"
          - "The Controller holds pre-committed next keys — can force rotation at any time"
          - "Rotation authority always supersedes signing authority"
          - "The Controller can revoke the custodian by rotating to new keys the custodian does not hold"
