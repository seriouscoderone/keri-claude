domain_ref: "watcher-service"

errors:
  - name: "InsufficientWitnessesError"
    description: "Cannot fetch KEL copies from enough witnesses for meaningful comparison"
    cause: "Too few witnesses responded — cannot reliably detect duplicity"
    recovery: "retry"
    severity: "transient"
    context:
      - field: "responded"
        type: "integer"
        description: "Number of witnesses that responded"
      - field: "total"
        type: "integer"
        description: "Total witnesses in the identifier's witness set"
      - field: "minimum_required"
        type: "integer"
        description: "Minimum needed for duplicity comparison (at least 2)"

  - name: "DuplicityAlertError"
    description: "Duplicity detected during cross-witness comparison"
    cause: "Two witnesses have different events at the same (prefix, sn)"
    recovery: "escalate"
    severity: "recoverable"
    context:
      - field: "prefix"
        type: "string"
        description: "The identifier with duplicity"
      - field: "sn"
        type: "integer"
        description: "The conflicting sequence number"
      - field: "evidence"
        type: "DuplicityEvidence"
        description: "Full evidence record with both events and their signatures"
