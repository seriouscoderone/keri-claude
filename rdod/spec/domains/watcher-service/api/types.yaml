domain_ref: "watcher-service/api"

types:
  - name: "WatcherConfiguration"
    description: "Configuration for a watcher node instance."
    variants:
      - name: "default"
        fields:
          - name: "watcher_aid"
            type: "string"
            required: true
            description: "This watcher's AID"
          - name: "listen_port"
            type: "integer"
            required: true
            description: "HTTP port"
          - name: "check_interval_seconds"
            type: "integer"
            required: false
            description: "How often to perform duplicity checks"
            constraints:
              min: 60
          - name: "monitored_prefixes"
            type: "array[string]"
            required: true
            description: "List of AIDs this watcher monitors for duplicity"

  - name: "DuplicityStatus"
    description: "Result of a duplicity check for a monitored identifier, returned to querying clients."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The identifier that was checked"
          - name: "is_duplicitous"
            type: "boolean"
            required: true
            description: "Whether conflicting events were detected"
          - name: "evidence"
            type: "array[types://cesr/primitives#SAID]"
            required: true
            description: "SAIDs of conflicting events (empty if not duplicitous)"
        invariants:
          - "If is_duplicitous is false, evidence is empty"
          - "If is_duplicitous is true, evidence contains at least two conflicting SAIDs"
