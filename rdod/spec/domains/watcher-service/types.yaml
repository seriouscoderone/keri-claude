domain_ref: "watcher-service"

types:
  - name: "WatcherConfiguration"
    description: "Configuration for a watcher node instance."
    variants:
      - name: "default"
        fields:
          - name: "watcher_aid"
            type: "string"
            required: true
            description: "This watcher's AID"
          - name: "listen_port"
            type: "integer"
            required: true
            description: "HTTP port"
          - name: "check_interval_seconds"
            type: "integer"
            required: false
            description: "How often to perform duplicity checks"
            constraints:
              min: 60
          - name: "monitored_prefixes"
            type: "array[string]"
            required: true
            description: "List of AIDs this watcher monitors for duplicity"

  - name: "DuplicityReport"
    description: "Report generated after a watcher cross-checks witnesses for a monitored identifier."
    variants:
      - name: "clean"
        fields:
          - name: "prefix"
            type: "string"
            required: true
            description: "The monitored AID"
          - name: "checked_at"
            type: "string"
            required: true
            description: "ISO 8601 datetime of the check"
          - name: "witnesses_queried"
            type: "integer"
            required: true
            description: "Number of witnesses contacted"
          - name: "latest_sn"
            type: "integer"
            required: true
            description: "Highest sequence number observed"
        invariants:
          - "All witnesses report consistent events — no duplicity found"
      - name: "duplicitous"
        fields:
          - name: "prefix"
            type: "string"
            required: true
            description: "The AID with duplicity"
          - name: "checked_at"
            type: "string"
            required: true
            description: "Datetime of detection"
          - name: "evidence"
            type: "array[DuplicityEvidence]"
            required: true
            description: "One entry per conflicting (prefix, sn) pair found"
          - name: "witnesses_queried"
            type: "integer"
            required: true
            description: "Number of witnesses contacted"
        invariants:
          - "At least one DuplicityEvidence entry with two different SAIDs at the same sn"
          - "Evidence is immutable — stored permanently in DEL"

  - name: "DuplicityAlert"
    description: "Permanent record of detected duplicity for an identifier, stored in the Duplicitous Event Log (DEL)."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The identifier found to be duplicitous"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number where conflicting events were observed"
          - name: "first_seen_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the first event observed at this sn"
          - name: "conflicting_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the conflicting event at the same sn"
          - name: "detected_at"
            type: "types://cesr/primitives#DateTime"
            required: true
            description: "When the duplicity was detected"
        invariants:
          - "first_seen_said != conflicting_said (two different events at the same sn)"
          - "Once recorded, the alert is immutable — duplicity evidence is permanent"
          - "Stored in the DEL (Duplicitous Event Log)"
