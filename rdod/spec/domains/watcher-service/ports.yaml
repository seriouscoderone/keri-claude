# ports.yaml
domain_ref: "watcher-service"

ports:
  # Inbound ports are defined in subdomain:
  #   - api: port://watcher-service/api/inbound/kel-query (KEL state queries)
  #   - api: port://watcher-service/api/inbound/duplicity-query (duplicity queries)
  #   - api: port://watcher-service/api/inbound/oobi-resolution (OOBI resolution)
  #   - api: port://watcher-service/api/inbound/watch-list-management (watch list add/remove)
  #   - api: port://watcher-service/api/inbound/kel-submission (push-based KEL events)

  # Outbound — witness polling, storage, HTTP server
  - id: "port://watcher-service/outbound/witness-poll"
    type: outbound
    name: "Witness KERL Polling"
    semantics: query
    idempotent: true
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://witness-service/api#KERLResponse"
      errors:
        - "errors://watcher-service/api#WitnessUnreachableError"
        - "errors://watcher-service#InsufficientWitnessesError"
    refs: ["domain://witness-service"]

  - id: "port://watcher-service/outbound/watcher-repository"
    type: outbound
    name: "Watcher Repository"
    semantics: command
    idempotent: false
    description: >
      Stores observed KEL copies from multiple witnesses and permanent duplicity alerts.
      A watcher cross-checks KEL copies to detect equivocation. Duplicity alerts are
      append-only and never deleted — they are permanent evidence of misbehavior.
    contract:
      input: "types://watcher-service#DuplicityAlert"
      output: "types://watcher-service#DuplicityAlert"
      errors:
        - "errors://watcher-service#DuplicityAlertError"
    refs: ["domain://externals/persistence"]

  # HTTP Server port is defined in subdomain:
  #   - api: port://watcher-service/api/outbound/http-server
