# ports.yaml
domain_ref: "watcher-service"

ports:
  # Inbound ports are defined in subdomain:
  #   - api: port://watcher-service/api/inbound/kel-query (KEL state queries)
  #   - api: port://watcher-service/api/inbound/duplicity-query (duplicity queries)
  #   - api: port://watcher-service/api/inbound/oobi-resolution (OOBI resolution)

  # Outbound — witness polling, storage, HTTP server
  - id: "port://watcher-service/outbound/witness-poll"
    type: outbound
    name: "Witness KERL Polling"
    contract: "poll_kerl(witness_aid, target_aid, since_sn?) -> KERL — fetches KERL from witness for cross-checking"
    protocol: "HTTP"
    refs: ["domain://witness-service"]

  - id: "port://watcher-service/outbound/watcher-store"
    type: outbound
    name: "Watcher Storage"
    contract: "cache_kel(aid, source_witness, events) -> Result; get_cached_kel(aid, source_witness?) -> [Event]; store_duplicity(aid, sn, evidence) -> Result; get_duplicity(aid) -> [DuplicityAlert]"
    protocol: "method-call"
    refs: ["persistence"]

  - id: "port://watcher-service/outbound/http-server"
    type: outbound
    name: "HTTP Server"
    contract: "listen(port) -> Server — serves query endpoint and OOBI resolution"
    protocol: "method-call"
    refs: ["transport"]
