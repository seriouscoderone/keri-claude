# ports.yaml
domain_ref: "keri/duplicity-detection/recovery"

ports:
  # Inbound — what clients call
  - id: "port://keri/duplicity-detection/recovery/inbound/superseding-rules"
    type: inbound
    name: "Superseding Rules"
    contract: "evaluate_superseding(candidate: KeyEvent, incumbent: KeyEvent) -> Result<SupersedingRule, NotSuperseding>; apply_rule_a0(candidate: RotationEvent, incumbent: InteractionEvent) -> Result<Supersedes, NotApplicable>; apply_rule_a1(candidate: RotationEvent, incumbent: RotationEvent) -> NotSuperseding; apply_rule_a2(candidate: InteractionEvent, incumbent: KeyEvent) -> NotSuperseding"
    protocol: "method-call"
    refs: ["domain://keri/duplicity-detection"]

  - id: "port://keri/duplicity-detection/recovery/inbound/reconciliation"
    type: inbound
    name: "Reconciliation"
    contract: "reconcile(aid: AID, kel_dag: KELDAG) -> Result<Trunk, IrreconcilableError>; get_trunk(aid: AID, kel_dag: KELDAG) -> [KeyEvent]; get_disputed_branches(aid: AID, kel_dag: KELDAG) -> [DisputedBranch]"
    protocol: "method-call"
    refs: ["domain://keri/duplicity-detection"]
