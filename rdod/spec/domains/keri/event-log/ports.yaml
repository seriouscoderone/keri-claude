# ports.yaml
domain_ref: "keri/event-log"

ports:
  # Inbound — what clients call
  - id: "port://keri/event-log/inbound/event-management"
    type: inbound
    name: "Event Management"
    contract: "create_inception(config: InceptionConfig) -> InceptionEvent; create_rotation(aid: AID, new_keys: [PublicKey], new_next: [PublicKey]) -> RotationEvent; create_interaction(aid: AID, seals: [Seal]) -> InteractionEvent"
    protocol: "method-call"
    refs: ["domain://keri"]

  - id: "port://keri/event-log/inbound/event-processing"
    type: inbound
    name: "Event Processing"
    contract: "process_event(event: KeyEvent, signatures: [Signature], receipts: [Receipt]) -> Result<EventValidated, ValidationError>; escrow_event(event: KeyEvent) -> Result<Escrowed, EscrowError>"
    protocol: "method-call"
    refs: ["domain://keri"]

  - id: "port://keri/event-log/inbound/event-query"
    type: inbound
    name: "Event Query"
    contract: "get_kel(aid: AID) -> KEL; get_event(aid: AID, sn: int) -> KeyEvent; get_latest_event(aid: AID) -> KeyEvent; get_establishment_subsequence(aid: AID) -> [EstablishmentEvent]"
    protocol: "method-call"
    refs: ["domain://keri", "domain://agent"]

  # Outbound — what event-log calls
  - id: "port://keri/event-log/outbound/event-store"
    type: outbound
    name: "Event Persistence"
    contract: "append_event(aid: AID, event: KeyEvent, fn: int) -> Result; get_events(aid: AID) -> [KeyEvent]; get_event_by_sn(aid: AID, sn: int) -> KeyEvent; get_event_by_said(said: SAID) -> KeyEvent"
    protocol: "method-call"
    refs: ["persistence"]
