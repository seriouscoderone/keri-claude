# ports.yaml
domain_ref: "keri/event-log/storage"

ports:
  # Inbound — what the parent event-log domain calls
  - id: "port://keri/event-log/storage/inbound/event-logging"
    type: inbound
    name: "Event Logging"
    contract: "log_event(aid: AID, event: bytes, sigs: [Siger], source: EventLocality) -> Result<{fn: int, first: bool}, LogError>; add_signatures(aid: AID, said: SAID, sigs: [Siger]) -> Result; add_witness_sigs(aid: AID, said: SAID, wigs: [Siger]) -> Result; add_receipts(aid: AID, said: SAID, rcts: [Receipt]) -> Result"
    protocol: "method-call"
    refs: ["domain://keri/event-log"]

  - id: "port://keri/event-log/storage/inbound/event-retrieval"
    type: inbound
    name: "Event Retrieval"
    contract: "get_event_by_digest(aid: AID, dig: SAID) -> bytes; get_event_by_sn(aid: AID, sn: int) -> bytes; get_sigs(aid: AID, dig: SAID) -> [Siger]; get_wigs(aid: AID, dig: SAID) -> [Siger]; get_rcts(aid: AID, dig: SAID) -> [Receipt]; get_fn(aid: AID, dig: SAID) -> int; get_esr(aid: AID, dig: SAID) -> EventSourceRecord; get_state(aid: AID) -> KeyStateRecord?"
    protocol: "method-call"
    refs: ["domain://keri/event-log"]

  - id: "port://keri/event-log/storage/inbound/kel-replay"
    type: inbound
    name: "KEL Replay"
    contract: "replay_by_sn(aid: AID, start_sn?: int) -> Iterator<(sn, bytes)>; replay_by_fn(aid: AID, start_fn?: int) -> Iterator<(fn, bytes)>; get_max_sn(aid: AID) -> int?; get_max_fn(aid: AID) -> int?"
    protocol: "method-call"
    refs: ["domain://keri/event-log"]

  # Outbound — what storage depends on
  - id: "port://keri/event-log/storage/outbound/persistence"
    type: outbound
    name: "Persistence Engine"
    contract: "put(db: str, key: bytes, val: bytes) -> bool; get(db: str, key: bytes) -> bytes?; append(db: str, key: bytes, val: bytes) -> bool; iterate(db: str, prefix: bytes) -> Iterator<(bytes, bytes)>; delete(db: str, key: bytes) -> bool"
    protocol: "method-call"
    refs: ["persistence"]
