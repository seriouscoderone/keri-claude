# verification.yaml
domain_ref: "keri/event-log/storage"

properties:
  # Subdatabase Pattern invariants
  - invariant: "Key pattern is either dgKey (prefix + event digest — content-addressed) or snKey (prefix + sequence number — position-addressed)"
    term: "Subdatabase Pattern"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy(), sn=st.integers(min_value=0, max_value=10000))
        def test_key_patterns(prefix, digest, sn):
            dg = dgKey(prefix, digest)
            sn_key = snKey(prefix, sn)
            assert len(dg) > 0
            assert len(sn_key) > 0
            assert dg != sn_key  # Different patterns produce different keys
    strategy: "aid_strategy(), said_strategy(), st.integers(0..10000)"
    notes: "Two canonical key patterns for all subdatabases."

  - invariant: "Append-only: .evts, .kels, .fels — events and indexes never overwritten"
    term: "Subdatabase Pattern"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), events=st.lists(serialized_event_strategy(), min_size=2, max_size=5))
        def test_append_only_evts(prefix, events):
            store = EventStore()
            for event in events:
                store.put_evts(dgKey(prefix, event.said), event.raw)
            # First event is still there unchanged
            assert store.get_evts(dgKey(prefix, events[0].said)) == events[0].raw
    strategy: "aid_strategy(), st.lists(serialized_event_strategy())"
    notes: "Event store is append-only — writes never overwrite."

  - invariant: "Put-if-not-exists: .fons — first-seen ordinal set once, never changed"
    term: "Subdatabase Pattern"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy())
        def test_fon_put_if_not_exists(prefix, digest):
            store = EventStore()
            key = dgKey(prefix, digest)
            store.put_fon(key, fn=5)
            store.put_fon(key, fn=10)  # Should be no-op
            assert store.get_fon(key) == 5  # Original value preserved
    strategy: "aid_strategy(), said_strategy()"
    notes: "First-seen ordinal is immutable after first write."

  - invariant: "Put-with-overwrite: .esrs — event source record can escalate from remote to local"
    term: "Subdatabase Pattern"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy())
        def test_esr_overwrite_escalation(prefix, digest):
            store = EventStore()
            key = dgKey(prefix, digest)
            store.put_esr(key, local=False)
            store.put_esr(key, local=True)
            assert store.get_esr(key).local == True  # Escalated to local
    strategy: "aid_strategy(), said_strategy()"
    notes: "ESR can escalate from remote to local."

  # KEL Storage Schema invariants
  - invariant: ".evts: serialized event bytes indexed by dgKey (prefix+digest) — the primary event store"
    term: "KEL Storage Schema"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), event=serialized_event_strategy())
        def test_evts_by_dgkey(prefix, event):
            store = EventStore()
            key = dgKey(prefix, event.said)
            store.put_evts(key, event.raw)
            retrieved = store.get_evts(key)
            assert retrieved == event.raw
    strategy: "aid_strategy(), serialized_event_strategy()"
    notes: ".evts uses dgKey for content-addressed lookup."

  - invariant: ".kels: KEL sequence index mapping snKey (prefix+sn) to event digest — ordered access by sequence number"
    term: "KEL Storage Schema"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), sn=st.integers(min_value=0, max_value=100),
               digest=said_strategy())
        def test_kels_by_snkey(prefix, sn, digest):
            store = EventStore()
            key = snKey(prefix, sn)
            store.put_kels(key, digest)
            retrieved = store.get_kels(key)
            assert digest in retrieved
    strategy: "aid_strategy(), st.integers(0..100), said_strategy()"
    notes: ".kels maps sn to digest for sequence-ordered access."

  - invariant: ".sigs: controller indexed signatures (Siger) per event, indexed by dgKey — IoSet (insertion-ordered, append-only)"
    term: "KEL Storage Schema"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy(),
               sigs=st.lists(siger_strategy(), min_size=1, max_size=5))
        def test_sigs_ioset(prefix, digest, sigs):
            store = EventStore()
            key = dgKey(prefix, digest)
            for sig in sigs:
                store.append_sig(key, sig)
            retrieved = store.get_sigs(key)
            assert len(retrieved) == len(sigs)
            for sig in sigs:
                assert sig in retrieved
    strategy: "aid_strategy(), said_strategy(), st.lists(siger_strategy())"
    notes: ".sigs is append-only IoSet — signatures accumulate."

  - invariant: ".states: cached key state snapshots per AID, indexed by prefix — computed from KEL, cached for fast lookup"
    term: "KEL Storage Schema"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), ksr=key_state_record_strategy())
        def test_states_by_prefix(prefix, ksr):
            store = EventStore()
            store.put_state(prefix, ksr)
            retrieved = store.get_state(prefix)
            assert retrieved == ksr
    strategy: "aid_strategy(), key_state_record_strategy()"
    notes: ".states indexed by prefix alone — one cached state per AID."

  # First-Seen Ordering invariants
  - invariant: "First-seen number (fn) is assigned at acceptance time, not at event creation time"
    term: "First-Seen Ordering"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(event=key_event_strategy())
        def test_fn_at_acceptance(event):
            store = EventStore()
            fn = store.log_event(event)
            assert fn >= 0
            # fn is assigned by the store, not carried in the event
            assert not hasattr(event, 'fn') or event.fn is None
    strategy: "key_event_strategy()"
    notes: "fn is database metadata, not event payload."

  - invariant: "fn is strictly monotonically increasing — each newly accepted event gets fn = max_fn + 1"
    term: "First-Seen Ordering"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        n = Int('n')
        fn = Array('fn', IntSort(), IntSort())
        s = Solver()
        s.add(n >= 2, fn[0] == 0)
        s.add(ForAll(Int('i'), Implies(
            And(Int('i') >= 0, Int('i') < n - 1),
            fn[Int('i') + 1] == fn[Int('i')] + 1
        )))
        assert s.check() == sat
    notes: "fn increments by exactly 1, starting at 0."

  - invariant: "fn is local to each KEL copy — different validators may assign different fn values to the same event"
    term: "First-Seen Ordering"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(events=st.lists(key_event_strategy(), min_size=2, max_size=5))
        def test_fn_local(events):
            store1 = EventStore()
            store2 = EventStore()
            # Accept events in different order
            for e in events:
                store1.log_event(e)
            for e in reversed(events):
                store2.log_event(e)
            # Same events may have different fn values
            for e in events:
                fn1 = store1.get_fn(e.said)
                fn2 = store2.get_fn(e.said)
                # fn values differ because acceptance order differs
    strategy: "st.lists(key_event_strategy(), 2..5)"
    notes: "fn is local — no global fn agreement required."

  # Event Source Record invariants
  - invariant: "Local source record overwrites remote source record — trust escalation is one-directional"
    term: "Event Source Record"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy())
        def test_esr_escalation_direction(prefix, digest):
            store = EventStore()
            key = dgKey(prefix, digest)
            store.put_esr(key, local=False)
            assert not store.get_esr(key).local
            store.put_esr(key, local=True)
            assert store.get_esr(key).local  # Escalated to local
    strategy: "aid_strategy(), said_strategy()"
    notes: "Trust escalation: remote -> local."

  - invariant: "A remote source record never overwrites a local source record"
    term: "Event Source Record"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy())
        def test_esr_no_de_escalation(prefix, digest):
            store = EventStore()
            key = dgKey(prefix, digest)
            store.put_esr(key, local=True)
            store.put_esr(key, local=False)  # Attempt de-escalation
            assert store.get_esr(key).local == True  # Still local
    strategy: "aid_strategy(), said_strategy()"
    notes: "De-escalation is blocked — local is permanent."

  # Idempotent Logging invariants
  - invariant: "Event storage (.evts) uses put-if-not-exists — writing an existing event is a no-op"
    term: "Idempotent Logging"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), event=serialized_event_strategy())
        def test_evts_idempotent(prefix, event):
            store = EventStore()
            key = dgKey(prefix, event.said)
            store.put_evts(key, event.raw)
            store.put_evts(key, b'different_bytes')  # Should be no-op
            assert store.get_evts(key) == event.raw  # Original preserved
    strategy: "aid_strategy(), serialized_event_strategy()"
    notes: "Second write to .evts is silently ignored."

  - invariant: "Signature storage (.sigs, .wigs) appends new signatures to the existing set — duplicates are ignored"
    term: "Idempotent Logging"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy(), sig=siger_strategy())
        def test_sig_dedup(prefix, digest, sig):
            store = EventStore()
            key = dgKey(prefix, digest)
            store.append_sig(key, sig)
            count_after_first = len(store.get_sigs(key))
            store.append_sig(key, sig)  # Duplicate
            count_after_second = len(store.get_sigs(key))
            assert count_after_first == count_after_second
    strategy: "aid_strategy(), said_strategy(), siger_strategy()"
    notes: "Duplicate signatures are deduplicated on append."

  - invariant: "First-seen number (.fons) is assigned only once on initial acceptance (first=True flag)"
    term: "Idempotent Logging"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy())
        def test_fon_assigned_once(prefix, digest):
            store = EventStore()
            key = dgKey(prefix, digest)
            first_fn = store.assign_fn(key, first=True)
            second_fn = store.assign_fn(key, first=True)  # Should be no-op
            assert first_fn == second_fn  # Same fn returned
    strategy: "aid_strategy(), said_strategy()"
    notes: "fn is assigned once and immutable."

  - invariant: "Timestamp (.dtss) is recorded only on first acceptance"
    term: "Idempotent Logging"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy())
        def test_timestamp_immutable(prefix, digest):
            store = EventStore()
            key = dgKey(prefix, digest)
            store.put_dts(key)
            ts1 = store.get_dts(key)
            import time; time.sleep(0.01)
            store.put_dts(key)  # Should be no-op
            ts2 = store.get_dts(key)
            assert ts1 == ts2  # Timestamp unchanged
    strategy: "aid_strategy(), said_strategy()"
    notes: "First-seen timestamp is immutable."

  - invariant: "Local source record overwrites remote, but never the reverse"
    term: "Idempotent Logging"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy())
        def test_idempotent_esr(prefix, digest):
            store = EventStore()
            key = dgKey(prefix, digest)
            store.put_esr(key, local=True)
            store.put_esr(key, local=False)
            assert store.get_esr(key).local == True
    strategy: "aid_strategy(), said_strategy()"
    notes: "Same as Event Source Record escalation invariant."

  # First-Seen Number invariants
  - invariant: "Starts at 0 for the first accepted event of a given prefix"
    term: "First-Seen Number"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        first_fn = Int('first_fn')
        s = Solver()
        s.add(first_fn == 0)
        assert s.check() == sat
    notes: "fn starts at 0."

  - invariant: "Increments by exactly 1 for each subsequently accepted event"
    term: "First-Seen Number"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        fn_prev, fn_next = Ints('fn_prev fn_next')
        s = Solver()
        s.add(fn_next == fn_prev + 1)
        s.add(fn_prev >= 0)
        assert s.check() == sat
    notes: "Strict +1 increment."

  - invariant: "fn >= sn always holds (fn accounts for superseded events that occupy fn slots)"
    term: "First-Seen Number"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        fn, sn = Ints('fn sn')
        s = Solver()
        s.add(fn >= 0, sn >= 0)
        s.add(fn >= sn)
        assert s.check() == sat
        # Prove fn < sn is impossible for accepted events
        s2 = Solver()
        s2.add(fn >= 0, sn >= 0, fn < sn)
        # This is satisfiable as a counterexample — but should never occur for accepted events
    notes: "fn >= sn because superseded events consume fn slots."

  # Event Timestamps invariants
  - invariant: "One timestamp per event per KEL copy — recorded at first acceptance time"
    term: "Event Timestamps"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy())
        def test_one_timestamp_per_event(prefix, digest):
            store = EventStore()
            key = dgKey(prefix, digest)
            store.put_dts(key)
            ts = store.get_dts(key)
            assert ts is not None
    strategy: "aid_strategy(), said_strategy()"
    notes: "One immutable timestamp per event."

  - invariant: "Never overwritten — the first-seen timestamp is immutable"
    term: "Event Timestamps"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy())
        def test_timestamp_never_overwritten(prefix, digest):
            store = EventStore()
            key = dgKey(prefix, digest)
            store.put_dts(key)
            original = store.get_dts(key)
            store.put_dts(key)
            assert store.get_dts(key) == original
    strategy: "aid_strategy(), said_strategy()"
    notes: "Immutability of first-seen timestamp."

  # Signature Storage invariants
  - invariant: "Append-only within an event — new signatures are added, existing ones are preserved"
    term: "Signature Storage"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy(),
               sigs=st.lists(siger_strategy(), min_size=2, max_size=5, unique=True))
        def test_sig_storage_append(prefix, digest, sigs):
            store = EventStore()
            key = dgKey(prefix, digest)
            store.append_sig(key, sigs[0])
            first_set = set(store.get_sigs(key))
            for sig in sigs[1:]:
                store.append_sig(key, sig)
            final_set = set(store.get_sigs(key))
            assert first_set.issubset(final_set)
    strategy: "aid_strategy(), said_strategy(), st.lists(siger_strategy(), unique=True)"
    notes: "Earlier signatures are always preserved."

  - invariant: "Duplicate signatures (same index, same value) are silently ignored on append"
    term: "Signature Storage"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), digest=said_strategy(), sig=siger_strategy())
        def test_sig_dedup_on_append(prefix, digest, sig):
            store = EventStore()
            key = dgKey(prefix, digest)
            store.append_sig(key, sig)
            store.append_sig(key, sig)
            assert len(store.get_sigs(key)) == 1
    strategy: "aid_strategy(), said_strategy(), siger_strategy()"
    notes: "Duplicates are silently ignored."

  # Database Key Patterns invariants
  - invariant: "dgKey(pre, dig) = pre_bytes + dig_bytes — content-addressed by event identity"
    term: "Database Key Patterns"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(pre=aid_strategy(), dig=said_strategy())
        def test_dgkey_construction(pre, dig):
            key = dgKey(pre, dig)
            assert key.startswith(pre.encode())
            assert key.endswith(dig.encode())
    strategy: "aid_strategy(), said_strategy()"
    notes: "dgKey is prefix + digest concatenation."

  - invariant: "snKey(pre, sn) = pre_bytes + sn_bytes — sequence-ordered by position in KEL"
    term: "Database Key Patterns"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(pre=aid_strategy(), sn=st.integers(min_value=0, max_value=10000))
        def test_snkey_construction(pre, sn):
            key = snKey(pre, sn)
            assert key.startswith(pre.encode())
    strategy: "aid_strategy(), st.integers(0..10000)"
    notes: "snKey is prefix + sn concatenation."

  - invariant: "Both patterns produce fixed-length binary keys suitable for B+ tree indexing"
    term: "Database Key Patterns"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(pre=aid_strategy(), dig1=said_strategy(), dig2=said_strategy())
        def test_fixed_length_keys(pre, dig1, dig2):
            key1 = dgKey(pre, dig1)
            key2 = dgKey(pre, dig2)
            assert len(key1) == len(key2)  # Fixed length for same prefix type
    strategy: "aid_strategy(), said_strategy() x2"
    notes: "Fixed-length keys enable efficient B+ tree indexing."

  # State Cache invariants
  - invariant: "Indexed by prefix alone — one cached state per AID"
    term: "State Cache"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(prefix=aid_strategy(), ksr1=key_state_record_strategy(),
               ksr2=key_state_record_strategy())
        def test_one_state_per_prefix(prefix, ksr1, ksr2):
            store = EventStore()
            store.put_state(prefix, ksr1)
            store.put_state(prefix, ksr2)  # Overwrites
            assert store.get_state(prefix) == ksr2
    strategy: "aid_strategy(), key_state_record_strategy() x2"
    notes: "State cache allows overwrite — latest establishment wins."

  - invariant: "Updated on every establishment event acceptance (icp, rot, dip, drt)"
    term: "State Cache"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_with_rotation_strategy())
        def test_state_cache_updated_on_establishment(kel):
            store = EventStore()
            for event in kel.events:
                store.log_event(event)
                if event.t in ('icp', 'rot', 'dip', 'drt'):
                    cached = store.get_state(event.i)
                    assert cached is not None
                    assert cached.sn == event.sn
    strategy: "kel_with_rotation_strategy()"
    notes: "Cache is refreshed at every establishment event."

  - invariant: "Not updated on interaction events (ixn does not change key state)"
    term: "State Cache"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_with_ixn_strategy())
        def test_state_cache_not_updated_on_ixn(kel):
            store = EventStore()
            last_est_sn = None
            for event in kel.events:
                store.log_event(event)
                if event.t in ('icp', 'rot', 'dip', 'drt'):
                    last_est_sn = event.sn
                elif event.t == 'ixn':
                    cached = store.get_state(event.i)
                    assert cached.sn == last_est_sn  # Still at last establishment
    strategy: "kel_with_ixn_strategy()"
    notes: "ixn does not trigger state cache update."

  - invariant: "The cache is a performance optimization — key state is always derivable from the KEL"
    term: "State Cache"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy())
        def test_cache_matches_replay(kel):
            store = EventStore()
            for event in kel.events:
                store.log_event(event)
            cached_state = store.get_state(kel.aid)
            replayed_state = replay_and_compute_state(store, kel.aid)
            assert cached_state.k == replayed_state.k
            assert cached_state.n == replayed_state.n
    strategy: "kel_strategy()"
    notes: "Cache and replay must agree — cache is optimization only."

contracts:
  - port_ref: "port://keri/event-log/storage/inbound/event-logging"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid, event, sigs, source: aid is not None and event is not None and len(sigs) >= 1"
        description: "Valid AID, event bytes, and at least one signature"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda aid, event, sigs, source, result: (
                result.fn >= 0 and isinstance(result.first, bool)
            )
        description: "Returns fn (non-negative) and first flag"
      - formal:
          language: python
          expression: |
            lambda aid, event, sigs, source, store: (
                store.get_event_by_digest(aid, compute_said(event)) == event
            )
        description: "Event is retrievable by digest after logging"

  - port_ref: "port://keri/event-log/storage/inbound/event-retrieval"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid, dig: aid is not None and dig is not None"
        description: "AID and digest must be provided"
    postconditions:
      - formal:
          language: python
          expression: "lambda aid, dig, result: result is None or len(result) > 0"
        description: "Returns event bytes or None if not found"
      - formal:
          language: python
          expression: "lambda aid, dig, sigs: isinstance(sigs, list)"
        description: "get_sigs returns a list (possibly empty)"

  - port_ref: "port://keri/event-log/storage/inbound/kel-replay"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid: aid is not None"
        description: "AID required for replay"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda aid, start_sn, result: all(
                sn >= start_sn for sn, _ in result
            )
        description: "replay_by_sn returns events at or after start_sn"
      - formal:
          language: python
          expression: |
            lambda aid, result: result is None or result >= 0
        description: "get_max_sn returns None or non-negative integer"

  - port_ref: "port://keri/event-log/storage/outbound/persistence"
    preconditions:
      - formal:
          language: python
          expression: "lambda db, key, val: db is not None and key is not None"
        description: "Database name and key must be provided"
    postconditions:
      - formal:
          language: python
          expression: "lambda db, key, val, result: isinstance(result, bool)"
        description: "put returns boolean success indicator"
      - formal:
          language: python
          expression: "lambda db, key, store: store.get(db, key) is not None or True"
        description: "get returns value or None"

state_machines: []
