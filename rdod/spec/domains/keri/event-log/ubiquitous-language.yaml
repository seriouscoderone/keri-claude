# ubiquitous-language.yaml
domain_ref: "keri/event-log"

terms:
  - term: "KEL"
    synonyms: ["Key Event Log"]
    definition: "The append-only, hash-chained, cryptographically signed event log for a single AID. The authoritative record of an identifier's complete control history."
    invariants:
      - "Append-only — events cannot be modified or deleted (excepting superseding recovery)"
      - "Hash-chained — each event includes digest of prior event in p field"
      - "Exactly one authoritative KEL per AID"
      - "Deterministic key state derivable from any KEL prefix"
      - "Forms a directed acyclic graph (DAG) — forks only occur via superseding recovery"
    examples:
      - "A KEL starting with icp at s=0, followed by ixn at s=1, then rot at s=2"
      - "A delegated KEL starting with dip at s=0"
    related_terms: ["KERL", "Key Event", "AID", "Key State", "First-seen Number"]

  - term: "Inception Event"
    synonyms: ["icp"]
    definition: "The first event in a KEL that creates an AID and establishes its initial key state. Field order: v, t, d, i, s, kt, k, nt, n, bt, b, c, a."
    invariants:
      - "Always at sequence number s=0"
      - "Has no prior event digest (no p field)"
      - "The i field (AID) is either the inception public key (basic prefix) or the SAID of the inception event (self-addressing)"
      - "For self-addressing AIDs, the d and i fields must have the same value"
      - "Must be signed by a threshold-satisficing subset of the initial signing keys"
      - "There is exactly one inception event per KEL"
    examples:
      - "Self-addressing inception: d and i both equal 'EPR7FWsN3tOM8PqfMap2FRfF4MFQ4v3ZXjBUcMVtvhmB'"
      - "Fields: v=version, t='icp', d=SAID, i=AID, s='0', kt=signing threshold, k=signing keys, nt=rotation threshold, n=next digests, bt=witness threshold, b=witnesses, c=config, a=anchors"
    related_terms: ["AID", "Key State", "Establishment Event", "Self-Addressing Identifier"]

  - term: "Rotation Event"
    synonyms: ["rot"]
    definition: "An establishment event that changes the key state of an AID by rotating signing keys and committing to new next keys. Field order: v, t, d, i, s, p, kt, k, nt, n, bt, br, ba, c, a."
    invariants:
      - "Must satisfy dual threshold — both new signing threshold (kt) and prior next threshold (nt)"
      - "New signing keys (k) must include the unblinded prior next keys"
      - "Hash-chained to predecessor via p field (prior event SAID)"
      - "Can modify witness set via br (removed) and ba (added) fields"
      - "Can change witness threshold (bt)"
      - "Sequence number s is strictly monotonically increasing"
    examples:
      - "Rotation at s=2: new keys from prior pre-commitment, prior witnesses pruned via br, new witnesses grafted via ba"
      - "br=['BA4PSatfQM...'] removes one witness, ba=['BO3cCAfQiq...', 'BPowpltoeF...'] adds two"
    related_terms: ["Key State", "Pre-rotation Commitment", "Establishment Event", "Dual Threshold"]

  - term: "Interaction Event"
    synonyms: ["ixn"]
    definition: "A non-establishment event that anchors external data to the KEL via seals without changing key state. Field order: v, t, d, i, s, p, a."
    invariants:
      - "Does not modify key state — signing keys, thresholds, and witnesses remain unchanged"
      - "Must be signed by a threshold-satisficing subset of current signing keys"
      - "Hash-chained to predecessor via p field"
      - "The a field contains a list of seals (anchors) binding external data"
      - "Can be superseded by a rotation event at the same sequence number during recovery"
    examples:
      - "Interaction at s=1 anchoring a delegation seal: a=[{i: delegatee_AID, s: '0', d: delegatee_inception_SAID}]"
      - "Interaction anchoring an ACDC credential issuance digest"
    related_terms: ["Seal", "Non-Establishment Event", "Key State"]

  - term: "Delegated Inception Event"
    synonyms: ["dip"]
    definition: "An inception event for a delegated AID that includes a reference to its delegator's AID in the di field. Field order: v, t, d, i, s, kt, k, nt, n, bt, b, c, a, di."
    invariants:
      - "Includes di field containing the delegator's AID"
      - "The delegator must anchor a corresponding seal in its own KEL for this event to be valid"
      - "The AID (i field) is a SAID that includes the delegator reference, cryptographically binding delegatee to delegator"
      - "All inception event invariants also apply"
    examples:
      - "dip with di='EPR7FWsN3t...' indicating the delegator's AID, and the delegator's KEL contains a seal referencing this event"
    related_terms: ["Delegation", "Delegator", "Delegatee", "Delegation Seal"]

  - term: "Delegated Rotation Event"
    synonyms: ["drt"]
    definition: "A rotation event for a delegated AID. Field order: v, t, d, i, s, p, kt, k, nt, n, bt, br, ba, c, a. Does not repeat the di field — uses the delegator from the inception event."
    invariants:
      - "Does not include di field — inherits delegator from the associated dip event"
      - "The delegator must anchor a corresponding seal in its own KEL for this event to be valid"
      - "All rotation event invariants also apply"
      - "Message type 'drt' signals validators to apply delegated validation rules"
    examples:
      - "drt at s=1 rotating keys of a delegated AID, requiring both delegatee signatures and delegator seal approval"
    related_terms: ["Delegation", "Delegated Inception Event", "Rotation Event"]

  - term: "Establishment Event"
    synonyms: []
    definition: "A key event that changes key state — one of icp, rot, dip, or drt. Only establishment events modify signing/rotation authority."
    invariants:
      - "Must include signing keys (k), next key digests (n), signing threshold (kt), rotation threshold (nt)"
      - "Must include witness set (b for inception, br/ba for rotation) and witness threshold (bt)"
      - "The establishment subsequence pattern is: icp (rot* ixn*)* rot*"
      - "Two classes: non-delegated (icp, rot) and delegated (dip, drt)"
    examples:
      - "icp: initial establishment with first key set"
      - "rot: key rotation with new keys and possibly modified witnesses"
    related_terms: ["Key State", "Non-Establishment Event", "Establishment Subsequence"]

  - term: "Non-Establishment Event"
    synonyms: []
    definition: "A key event that does not change key state — currently only the interaction event (ixn)."
    invariants:
      - "Does not modify signing keys, rotation keys, thresholds, or witness set"
      - "Must be signed by current signing keys from the most recent establishment event"
      - "Used for anchoring data via seals"
    examples:
      - "ixn event anchoring a credential issuance seal"
    related_terms: ["Interaction Event", "Establishment Event", "Seal"]

  - term: "SAID"
    synonyms: ["Self-Addressing Identifier", "d field"]
    definition: "A self-referential content digest computed over the serialized event body using the SAID protocol. Appears in the d field of every event."
    invariants:
      - "Computed by replacing the d field with dummy '#' characters, serializing, hashing, then inserting the digest"
      - "The SAID uniquely identifies the exact content of the event"
      - "For self-addressing AIDs, the inception event's i field equals its d field"
      - "Serialization kind (JSON, CBOR, MGPK, CESR) affects the SAID value"
    examples:
      - "'EPR7FWsN3tOM8PqfMap2FRfF4MFQ4v3ZXjBUcMVtvhmB' — Blake3-256 digest with 'E' prefix"
    related_terms: ["Version String", "Prior Event Digest", "Self-Addressing Identifier"]

  - term: "Prior Event Digest"
    synonyms: ["p field", "Prior Event SAID"]
    definition: "The SAID of the immediately preceding event in the KEL, stored in the p field. Creates the hash-chain that makes the KEL tamper-evident."
    invariants:
      - "Present in all events except inception (which has no predecessor)"
      - "Must match the d field of the immediately prior event in the KEL"
      - "Creates a hash chain — modifying any event invalidates all subsequent events"
    examples:
      - "In an ixn at s=1, p='EPR7FWsN3t...' matches the d field of the icp at s=0"
    related_terms: ["SAID", "Hash Chain", "KEL"]

  - term: "Sequence Number"
    synonyms: ["s field", "sn"]
    definition: "A zero-based, strictly monotonically increasing integer that identifies the location (position) of an event in the KEL. Encoded as a hex string in the s field."
    invariants:
      - "Starts at 0 for inception"
      - "Increments by exactly 1 for each subsequent event"
      - "Different events at the same sequence number indicate duplicity or superseding recovery"
      - "Hex-encoded string in the event body (e.g., '0', '1', 'a', 'ff')"
    examples:
      - "icp at s='0', ixn at s='1', rot at s='2'"
      - "Two different events at s='3' indicates duplicity"
    related_terms: ["First-seen Number", "KEL", "Duplicity"]

  - term: "First-seen Number"
    synonyms: ["fn"]
    definition: "A strictly monotonically increasing integer ordinal assigned to each event upon its first acceptance into a KEL copy. Tracks the order of reception, independent of sequence number."
    invariants:
      - "Assigned by the database upon first acceptance — not part of the event message itself"
      - "Different KEL copies may assign different fn values to the same event"
      - "Consistent copies have the same event version at every sequence number"
      - "Enables replay of events in the order they were first-seen"
    examples:
      - "An event at sn=5 might have fn=7 if two superseded events were accepted earlier"
    related_terms: ["Sequence Number", "First-seen Rule", "Superseding Recovery"]

  - term: "Version String"
    synonyms: ["v field"]
    definition: "Protocol version metadata in the v field of every event. Encodes protocol identifier, version, serialization kind, and serialized size."
    invariants:
      - "Format: PPPPVVVVKKKKSSSS_ — protocol (4), version (4), kind (4), size (4), terminator"
      - "Provides regex target for cold-start stream detection"
      - "Serialization kind (JSON, CBOR, MGPK, CESR) directly affects SAID computation"
      - "Size field indicates total byte length of the serialized event body"
    examples:
      - "'KERICAACAAJSONAAKp.' — KERI version C.A.AC (decoded), JSON serialization, size 0xAAKp bytes"
      - "'KERICAACAACESRAAJM.' — KERI, CESR serialization"
    related_terms: ["SAID", "CESR"]

  - term: "Seal"
    synonyms: ["Anchor"]
    definition: "A cryptographic digest or reference embedded in the a field of an event that binds external data to the KEL without disclosing the data itself."
    invariants:
      - "Commits to external data via digest — the data itself is not in the KEL"
      - "Types include: digest seal, event seal (i, s, d fields), merkle tree root seal, latest establishment event seal"
      - "Seals in interaction events are the primary mechanism for anchoring external data"
      - "Delegation seals in delegator events bind to delegated inception/rotation events"
    examples:
      - "Event seal: {i: 'EHqSsH1Imc...', s: '0', d: 'EHqSsH1Imc...'} — references a specific event of another AID"
      - "Digest seal anchoring an ACDC credential"
    related_terms: ["Interaction Event", "Delegation Seal", "SAID"]

  - term: "Event Serialization"
    synonyms: ["Serialization Kind"]
    definition: "The binary encoding format used to serialize an event body. KERI supports JSON, CBOR, MessagePack (MGPK), and CESR native serialization."
    invariants:
      - "Serialization kind affects the SAID value — same logical event has different SAIDs in different serializations"
      - "Field ordering is normative and must be preserved in serialization"
      - "JSON serialization uses no whitespace (compact form)"
      - "CESR native serialization uses CESR codes directly"
    examples:
      - "JSON: compact no-whitespace serialization via json.dumps(separators=(',', ':'))"
      - "CESR: native binary serialization with CESR primitive codes"
    related_terms: ["Version String", "SAID", "CESR"]

  - term: "Event Locality"
    synonyms: ["Local Event", "Remote Event"]
    definition: "Classification of events as local (from a protected, trustable source) or remote (from an unprotected, potentially malicious source). Affects validation rules."
    invariants:
      - "Local events may assume trusted source — the device or a protected channel with MFA"
      - "Remote events must assume potentially malicious source"
      - "Witnesses should only accept local events from the controller"
      - "Validators apply different acceptance rules based on locality"
    examples:
      - "A controller signing an event on its own device — local"
      - "A validator receiving an event over the network from an unknown source — remote"
    related_terms: ["Validation Rules", "Witness", "Controller"]

  - term: "Witness Prune List"
    synonyms: ["br field", "Removed Witnesses"]
    definition: "The list of witness AIDs removed from the witness pool in a rotation event. Specified in the br field."
    invariants:
      - "Each AID in br must be in the current witness list"
      - "Witnesses in br are removed from the active witness set"
      - "Applied together with ba (added witnesses) to produce the new witness list"
    examples:
      - "br=['BA4PSatfQM...'] removes one witness during rotation"
    related_terms: ["Witness Graft List", "Rotation Event", "Witness List"]

  - term: "Witness Graft List"
    synonyms: ["ba field", "Added Witnesses"]
    definition: "The list of new witness AIDs added to the witness pool in a rotation event. Specified in the ba field."
    invariants:
      - "Each AID in ba must not already be in the current witness list"
      - "Combined with br removals to produce the new witness set"
    examples:
      - "ba=['BO3cCAfQiq...', 'BPowpltoeF...'] adds two new witnesses during rotation"
    related_terms: ["Witness Prune List", "Rotation Event", "Witness List"]

  - term: "Event Serializer"
    synonyms: ["SerderKERI", "KeriEvent<KeyEvent>"]
    definition: "Serializes and deserializes KERI events to/from bytes with version string, SAID computation, and field validation. Validates field order per event type (ilk). Supports JSON, CBOR, and MessagePack serialization kinds."
    invariants:
      - "Enforces normative field ordering for each event type"
      - "Computes and validates the SAID (d field) on serialization and deserialization"
      - "Parses and validates the version string (v field) including size and serialization kind"
      - "Provides access to event fields (ilk, AID prefix, sequence number, prior digest, etc.)"
    examples:
      - "SerderKERI(raw=bytes) in keripy — deserializes bytes and validates SAID"
      - "KeriEvent<KeyEvent> in keriox — typed event wrapper with serialization"
    related_terms: ["SAID", "Version String", "Event Serialization"]

  - term: "Signed Event Message"
    synonyms: ["SignedEventMessage"]
    definition: "An event bundled with its signatures and optional witness receipts. The unit of transmission between agents — contains the serialized event, indexed controller signatures, and optionally witness receipts and delegator seals."
    invariants:
      - "Contains the serialized event message and at least one controller signature"
      - "Controller signatures are indexed (Siger) — index corresponds to key position in the signing key list"
      - "May include witness receipts (indexed or non-indexed signatures from witnesses)"
      - "May include a delegator seal for delegated events"
    examples:
      - "A SignedEventMessage containing an icp event, 2-of-3 indexed controller signatures, and 3 witness receipts"
    related_terms: ["Event Serializer", "Seal", "Signing Threshold"]

  - term: "First-Seen Ordering"
    synonyms: ["FEL", ".fels", ".fons"]
    definition: "The monotonically increasing ordinal assigned to each event when first accepted into the KEL. Separate from sequence number — the first-seen number (fn) tracks the order events were received and validated, not the order they were created. Supports replay and cloning."
    invariants:
      - "First-seen number (fn) is assigned at acceptance time, not at creation time"
      - "Different KEL copies may assign different fn values to the same event"
      - "The first-seen log (.fels) maps prefix+fn to event digest; the ordinal index (.fons) maps prefix+digest to fn"
      - "Enables ordered replay — events can be replayed in the order they were first accepted"
    examples:
      - "Event at sn=5 might have fn=7 if two superseded events were accepted at earlier fn values"
      - "Cloning a KEL: replay events in fn order to replicate the first-seen history"
    related_terms: ["First-seen Number", "Sequence Number", "KEL Storage Schema"]

  - term: "Event Source Record"
    synonyms: ["ESR", ".esrs"]
    definition: "Metadata tracking whether an event was received from a local (protected) or remote (unprotected) source. Local events have higher trust — protected by the controller's own infrastructure. Remote events require additional validation."
    invariants:
      - "Each accepted event has an associated source record"
      - "Local source: event originated from the controller's own device or protected channel"
      - "Remote source: event received over the network from an external party"
      - "Validation rules differ based on source — local events may bypass certain witness checks"
    examples:
      - "A controller's own inception event marked as local in .esrs"
      - "An event received from a witness relay marked as remote in .esrs"
    related_terms: ["Event Locality", "Event Processor", "Validation Rules"]

  - term: "KEL Storage Schema"
    synonyms: []
    definition: "Database organization for the Key Event Log. Key subdatabases partition events, signatures, receipts, and metadata into separate indexed stores for efficient access."
    invariants:
      - ".evts: events indexed by prefix+digest"
      - ".kels: KEL index mapping prefix+sn to event digest"
      - ".fels: first-seen log mapping prefix+fn to event digest"
      - ".fons: first-seen ordinal mapping prefix+digest to fn"
      - ".sigs: controller signatures indexed by event"
      - ".wigs: witness signatures indexed by event"
    examples:
      - "Looking up current event at sn=5 for prefix P: query .kels[P+5] to get digest D, then .evts[P+D] to get event bytes"
      - "Replaying KEL in first-seen order: iterate .fels[P+0], .fels[P+1], ... to get digests, then fetch from .evts"
    related_terms: ["Event Database", "First-Seen Ordering", "Event Source Record"]

  - term: "Event Creation Functions"
    synonyms: ["incept()", "rotate()", "interact()", "receipt()"]
    definition: "Module-level functions that construct event serializer objects. Each takes the required fields for its event type and returns a serialized event ready for signing. Separate from the Key Event Verifier state machine — these are pure construction functions."
    invariants:
      - "incept() constructs an inception event from keys, thresholds, witnesses, and config traits"
      - "rotate() constructs a rotation event from new keys, prior state, and witness changes"
      - "interact() constructs an interaction event from seals/anchors"
      - "receipt() constructs a receipt (non-transferable or transferable) for an existing event"
      - "All functions compute the SAID and version string automatically"
    examples:
      - "serder = incept(keys=['DABC...'], ndigs=['EDEF...'], wits=['BGHI...'], toad=1)"
      - "serder = rotate(pre='EABC...', keys=new_keys, dig=prior_said, sn=2)"
    related_terms: ["Event Serializer", "Key Event Verifier", "SAID"]

  - term: "Quorum Calculation"
    synonyms: ["ample()", "simple()"]
    definition: "Functions computing Byzantine fault-tolerant majority thresholds. Used for witness thresholds and multi-sig quorum determination."
    invariants:
      - "simple(n) = n//2 + 1 — simple majority"
      - "ample(n, f) computes m where (n+f+1)/2 <= m <= n-f, subject to n >= 3f+1"
      - "Ensures Byzantine fault tolerance — the quorum is large enough to tolerate f faulty participants"
      - "Used to compute default witness thresholds when not explicitly specified"
    examples:
      - "simple(5) = 3 — majority of 5 witnesses"
      - "ample(7, 2) = 5 — tolerating 2 faulty witnesses out of 7 (7 >= 3*2+1)"
    related_terms: ["Witness Threshold", "Signing Threshold", "Threshold"]

  - term: "Event Validation Pipeline"
    synonyms: ["processEvent() [keripy]", "process_notice() [keriox]"]
    definition: "The complete step-by-step sequence that validates an incoming key event from receipt to acceptance or escrow. Implemented by the Event Processor (Kevery/EventProcessor)."
    invariants:
      - "Step 1: Check if prefix is known. If unknown and event is inception → create new Key Event Verifier. If unknown and not inception → escrow as out-of-order."
      - "Step 2: Check sequence number. If sn > expected → escrow as out-of-order. If sn < expected → check for duplicate (same SAID = idempotent) or duplicity (different SAID = likely duplicitous escrow)."
      - "Step 3: If sn == expected → call full validation (valSigsWigsDel / validate_event)."
      - "Step 4: On validation success → log event to KEL, update key state, emit receipt cue."
      - "Step 5: On validation failure → escrow to appropriate queue based on error type."
      - "The pipeline is re-entrant: escrowed events are reprocessed through the same pipeline when their blocking condition resolves."
    examples:
      - "Rotation at sn=2 arrives: prefix known, sn matches expected → validate signatures + thresholds + witnesses + delegation → accept to KEL"
      - "Event at sn=5 arrives but sn=4 is missing → escrow to out-of-order → when sn=4 arrives and is accepted, sn=5 is reprocessed from escrow"
    related_terms: ["Event Processor", "Escrow Cascade", "Dual Threshold Verification"]

  - term: "Dual Threshold Verification"
    synonyms: ["valSigsWigsDel() [keripy]", "validate_event() [keriox]"]
    definition: "The core validation logic that checks signatures, witness receipts, and delegation for an event. For rotation events, enforces DUAL threshold: signatures must satisfy BOTH the current signing threshold AND the prior next-key threshold (pre-rotation binding)."
    invariants:
      - "Step 1: Verify signature count — at least one valid signature required"
      - "Step 2: Verify each signature cryptographically against the event serialization and the corresponding public key"
      - "Step 3: Check signing threshold satisfaction — tholder.satisfy(indices) with verified signature indices"
      - "Step 4 (rotation only): Check pre-rotation binding — ntholder.satisfy(ondices) using exposed next-key indices"
      - "Step 5: Check witness threshold — toader.satisfy(windices) using verified witness receipt indices"
      - "Step 6 (delegated only): Validate delegation seal — delegator's KEL must contain an anchor committing to this event"
      - "Failure at any step → escrow to the appropriate queue (PSE for sigs, PWE for witnesses, PDE for delegation)"
    examples:
      - "Rotation with 2-of-3 threshold: signatures from keys at indices [0, 2] → tholder.satisfy([0, 2]) with thold=2 → True"
      - "Same rotation also checks: ondices [0, 2] map to pre-committed next keys → ntholder.satisfy([0, 2]) → True"
    related_terms: ["Pre-rotation Binding", "Signing Threshold", "Witness Threshold", "Escrow Cascade"]

  - term: "Pre-rotation Binding"
    synonyms: ["exposeds() [keripy]", "verify_next() [keriox]"]
    definition: "The mechanism that enforces pre-rotation commitments during key rotation. Each indexed signature in a rotation event carries both an index (position in current key list) and an ondex (position in the prior next-key digest list). The binding is verified by computing the digest of the new signing key and comparing it to the pre-committed digest at the ondex position."
    invariants:
      - "Each Siger carries index (current key position) and ondex (next key position)"
      - "For each siger: digest(new_key_at[index]) must equal prior_next_digest_at[ondex]"
      - "Only ondices with valid key-digest matches count toward the next threshold"
      - "The next threshold (ntholder) must be satisfied by the matched ondices"
      - "BothSigCodex codes auto-match ondex=index; CurrentSigCodex codes have no ondex (current signing list only)"
      - "This prevents an attacker from rotating to arbitrary keys — they must use the pre-committed keys"
    examples:
      - "Prior inception committed to next digests [D(N1), D(N2), D(N3)]. Rotation presents keys [N1, N2, N3]. Siger at index=0 has ondex=0 → digest(N1) must equal D(N1) → match."
      - "Attacker tries rotation with unauthorized key K4 at index=0 → digest(K4) ≠ D(N1) → no ondex match → next threshold not satisfied → rejected"
    related_terms: ["Dual Threshold Verification", "Pre-rotation", "Ondex", "Index"]

  - term: "Escrow Cascade"
    synonyms: ["Escrow State Machine"]
    definition: "The flow of events between escrow queues based on what validation step fails. Events progress through escrows as their blocking conditions resolve, potentially visiting multiple escrow types before final acceptance."
    invariants:
      - "Out-of-Order → accepted (when prior event arrives)"
      - "Partially-Signed → accepted OR → Partially-Witnessed (if sigs pass but witness threshold fails) OR → Delegation Escrow (if sigs pass but delegation missing)"
      - "Partially-Witnessed → accepted (when witness receipts arrive)"
      - "Delegation → accepted (when delegator's anchoring event arrives) OR → Partially-Witnessed (if delegation resolves but witnesses still insufficient)"
      - "Likely Duplicitous → permanent storage (forensic evidence, never auto-resolved)"
      - "Escrow processing order matters: OOE first, then receipt escrows, then PSE, then PWE, then PDE"
    examples:
      - "Multi-sig rotation: arrives with 1-of-3 signatures → PSE. Second sig arrives → reprocess → 2-of-3 passes → now check witnesses → insufficient → PWE. Witness receipts arrive → reprocess → accept."
      - "Delegated inception: arrives before delegator's ixn → Delegation Escrow. Delegator's ixn arrives with seal → reprocess → signatures pass, witnesses pass → accept."
    related_terms: ["Event Validation Pipeline", "Escrow Architecture"]

  - term: "Event Field Structure"
    synonyms: ["KED Fields", "Key Event Dict"]
    definition: "The normative field layout for each KERI key event type. Field ordering is significant — serialization must preserve the declared order for deterministic SAID computation."
    invariants:
      - "Common fields: v (version string), t (type/ilk), d (SAID), i (identifier prefix), s (sequence number hex)"
      - "Chain field: p (prior event SAID) — present in all events except inception"
      - "Key fields: kt (signing threshold), k (signing keys list), nt (next threshold), n (next key digests list)"
      - "Witness fields: bt (witness threshold/TOAD), b (witness list — inception), br (witnesses removed — rotation), ba (witnesses added — rotation)"
      - "Config field: c (configuration traits list) — inception and rotation"
      - "Anchor field: a (seals/anchors list) — all event types"
      - "Delegation field: di (delegator prefix) — dip only"
      - "Inception order: v, t, d, i, s, kt, k, nt, n, bt, b, c, a"
      - "Rotation order: v, t, d, i, s, p, kt, k, nt, n, bt, br, ba, c, a"
      - "Interaction order: v, t, d, i, s, p, a"
      - "Delegated inception order: v, t, d, i, s, kt, k, nt, n, bt, b, c, a, di"
    examples:
      - "Inception: {v:'KERI...', t:'icp', d:'ESAID...', i:'EAID...', s:'0', kt:'2', k:['D...','D...','D...'], nt:'2', n:['E...','E...','E...'], bt:'3', b:['B...','B...','B...','B...','B...'], c:[], a:[]}"
    related_terms: ["SAID", "Version String", "Event Serializer"]

  - term: "Idempotent Logging"
    synonyms: ["logEvent() [keripy]", "add_kel_finalized_event() [keriox]"]
    definition: "The property that logging an already-accepted event is a safe no-op. Late-arriving signatures, witness receipts, or duplicate events are merged into the existing log entry without creating duplicates. Enables safe reprocessing of events from escrow."
    invariants:
      - "Event storage (.evts) uses put-if-not-exists semantics"
      - "Signature storage (.sigs, .wigs) appends new signatures to existing sets"
      - "KEL index (.kels) won't add duplicate entries at the same sn"
      - "First-seen number is assigned only once (first=True on initial acceptance)"
      - "Local source record overwrites remote source record (trust escalation)"
    examples:
      - "Event accepted with 2-of-3 sigs. Third sig arrives later → logEvent() adds third sig to .sigs but doesn't duplicate the event in .evts"
      - "Same event received from two different sources → second call is idempotent"
    related_terms: ["KEL Storage Schema", "First-Seen Ordering", "Event Source Record"]

  - term: "Local Source Protection"
    synonyms: ["Misfit Event Source", "escrowMFEvent() [keripy]"]
    definition: "Security mechanism that prevents remote sources from injecting events for locally-owned, locally-witnessed, or locally-delegated identifiers. Events from remote sources targeting these protected identifiers are escrowed as 'misfits' rather than accepted, forcing re-sourcing through protected channels."
    invariants:
      - "Applies when: event source is remote AND (AID is locally owned OR locally witnessed OR locally delegated)"
      - "Escrowed to misfit queue — not rejected, but held for local re-sourcing"
      - "Local events (from the controller's own device) bypass this check"
      - "Prevents an attacker from using a compromised network to inject events for identifiers the node controls"
    examples:
      - "A rotation event for our own AID arrives from an external network connection → escrowed as misfit → must be re-submitted through the local protected channel"
    related_terms: ["Event Locality", "Event Source Record", "Event Validation Pipeline"]

  - term: "Seal Types"
    synonyms: ["Anchor Types"]
    definition: "The specific types of seals that can appear in an event's 'a' (anchor) field, binding external data or events to the KEL."
    invariants:
      - "Digest Seal: {d: SAID} — binds an arbitrary data digest"
      - "Event Seal: {i: prefix, s: sn, d: SAID} — binds a specific event of another AID"
      - "Latest Establishment Event Seal: {i: prefix} — binds to the latest establishment event of another AID (no specific sn)"
      - "Delegation seals in delegator events bind to delegated inception/rotation events"
      - "Multiple seals may appear in a single event's 'a' field"
      - "Seal ordering within the list is significant for delegated superseding rules (B2)"
    examples:
      - "Digest seal anchoring a credential: a=[{d: 'ECRED_SAID...'}]"
      - "Event seal for delegation approval: a=[{i: 'EDELEG_AID...', s: '0', d: 'EDIP_SAID...'}]"
    related_terms: ["Seal", "Interaction Event", "Delegation Seal Source"]

events:
  - name: "InceptionCreated"
    payload: "aid: AID, key_state: KeyState, witnesses: [WitnessAID], config: [Trait], said: SAID"
    triggers: "Controller creates a new AID by generating and signing an inception event"

  - name: "RotationPerformed"
    payload: "aid: AID, sn: int, new_keys: [PublicKey], new_next_digests: [Digest], witness_changes: {removed: [AID], added: [AID]}, said: SAID"
    triggers: "Controller rotates keys by generating a rotation event satisfying pre-rotation commitment and dual threshold"

  - name: "InteractionAnchored"
    payload: "aid: AID, sn: int, seals: [Seal], said: SAID"
    triggers: "Controller anchors external data to the KEL via an interaction event"

  - name: "EventValidated"
    payload: "aid: AID, sn: int, event_type: EventType, said: SAID"
    triggers: "A received event passes all validation checks and is accepted into the KEL"

  - name: "EventRejected"
    payload: "aid: AID, sn: int, event_type: EventType, reason: ValidationError"
    triggers: "A received event fails validation and is rejected"

  - name: "EventEscrowed"
    payload: "aid: AID, sn: int, event_type: EventType, reason: EscrowReason"
    triggers: "A received event cannot yet be fully validated (e.g., out-of-order, missing receipts) and is placed in escrow"

rules:
  - "The KEL is the sole source of truth for an AID's control authority — no external oracle"
  - "Events are processed in strict sequence order — out-of-order events are escrowed"
  - "Event field ordering is normative: v, t, d always first; remaining fields per event type specification"
  - "Key event message types must be one of: icp, rot, ixn, dip, drt"
  - "Each event must contain a valid SAID in its d field computed per the SAID protocol"
  - "Each non-inception event must contain a valid prior event digest in its p field"
  - "Sequence numbers must be zero-based, strictly monotonically increasing by one"
  - "A validator may drop any event that does not have at least one attached signature from the current controlling key state"
  - "Events are hash-chained — modifying any event invalidates all subsequent events in the chain"
