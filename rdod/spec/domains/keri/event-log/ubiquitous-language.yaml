# ubiquitous-language.yaml
domain_ref: "keri/event-log"

terms:
  - term: "KEL"
    synonyms: ["Key Event Log"]
    definition: "The append-only, hash-chained, cryptographically signed event log for a single AID. The authoritative record of an identifier's complete control history."
    invariants:
      - "Append-only — events cannot be modified or deleted (excepting superseding recovery)"
      - "Hash-chained — each event includes digest of prior event in p field"
      - "Exactly one authoritative KEL per AID"
      - "Deterministic key state derivable from any KEL prefix"
      - "Forms a directed acyclic graph (DAG) — forks only occur via superseding recovery"
    examples:
      - "A KEL starting with icp at s=0, followed by ixn at s=1, then rot at s=2"
      - "A delegated KEL starting with dip at s=0"
    related_terms: ["KERL", "Key Event", "AID", "Key State", "First-seen Number"]

  - term: "Inception Event"
    synonyms: ["icp"]
    definition: "The first event in a KEL that creates an AID and establishes its initial key state. Field order: v, t, d, i, s, kt, k, nt, n, bt, b, c, a."
    invariants:
      - "Always at sequence number s=0"
      - "Has no prior event digest (no p field)"
      - "The i field (AID) is either the inception public key (basic prefix) or the SAID of the inception event (self-addressing)"
      - "For self-addressing AIDs, the d and i fields must have the same value"
      - "Must be signed by a threshold-satisficing subset of the initial signing keys"
      - "There is exactly one inception event per KEL"
    examples:
      - "Self-addressing inception: d and i both equal 'EPR7FWsN3tOM8PqfMap2FRfF4MFQ4v3ZXjBUcMVtvhmB'"
      - "Fields: v=version, t='icp', d=SAID, i=AID, s='0', kt=signing threshold, k=signing keys, nt=rotation threshold, n=next digests, bt=witness threshold, b=witnesses, c=config, a=anchors"
    related_terms: ["AID", "Key State", "Establishment Event", "Self-Addressing Identifier"]

  - term: "Rotation Event"
    synonyms: ["rot"]
    definition: "An establishment event that changes the key state of an AID by rotating signing keys and committing to new next keys. Field order: v, t, d, i, s, p, kt, k, nt, n, bt, br, ba, c, a."
    invariants:
      - "Must satisfy dual threshold — both new signing threshold (kt) and prior next threshold (nt)"
      - "New signing keys (k) must include the unblinded prior next keys"
      - "Hash-chained to predecessor via p field (prior event SAID)"
      - "Can modify witness set via br (removed) and ba (added) fields"
      - "Can change witness threshold (bt)"
      - "Sequence number s is strictly monotonically increasing"
    examples:
      - "Rotation at s=2: new keys from prior pre-commitment, prior witnesses pruned via br, new witnesses grafted via ba"
      - "br=['BA4PSatfQM...'] removes one witness, ba=['BO3cCAfQiq...', 'BPowpltoeF...'] adds two"
    related_terms: ["Key State", "Pre-rotation Commitment", "Establishment Event", "Dual Threshold"]

  - term: "Interaction Event"
    synonyms: ["ixn"]
    definition: "A non-establishment event that anchors external data to the KEL via seals without changing key state. Field order: v, t, d, i, s, p, a."
    invariants:
      - "Does not modify key state — signing keys, thresholds, and witnesses remain unchanged"
      - "Must be signed by a threshold-satisficing subset of current signing keys"
      - "Hash-chained to predecessor via p field"
      - "The a field contains a list of seals (anchors) binding external data"
      - "Can be superseded by a rotation event at the same sequence number during recovery"
    examples:
      - "Interaction at s=1 anchoring a delegation seal: a=[{i: delegatee_AID, s: '0', d: delegatee_inception_SAID}]"
      - "Interaction anchoring an ACDC credential issuance digest"
    related_terms: ["Seal", "Non-Establishment Event", "Key State"]

  - term: "Delegated Inception Event"
    synonyms: ["dip"]
    definition: "An inception event for a delegated AID that includes a reference to its delegator's AID in the di field. Field order: v, t, d, i, s, kt, k, nt, n, bt, b, c, a, di."
    invariants:
      - "Includes di field containing the delegator's AID"
      - "The delegator must anchor a corresponding seal in its own KEL for this event to be valid"
      - "The AID (i field) is a SAID that includes the delegator reference, cryptographically binding delegatee to delegator"
      - "All inception event invariants also apply"
    examples:
      - "dip with di='EPR7FWsN3t...' indicating the delegator's AID, and the delegator's KEL contains a seal referencing this event"
    related_terms: ["Delegation", "Delegator", "Delegatee", "Delegation Seal"]

  - term: "Delegated Rotation Event"
    synonyms: ["drt"]
    definition: "A rotation event for a delegated AID. Field order: v, t, d, i, s, p, kt, k, nt, n, bt, br, ba, c, a. Does not repeat the di field — uses the delegator from the inception event."
    invariants:
      - "Does not include di field — inherits delegator from the associated dip event"
      - "The delegator must anchor a corresponding seal in its own KEL for this event to be valid"
      - "All rotation event invariants also apply"
      - "Message type 'drt' signals validators to apply delegated validation rules"
    examples:
      - "drt at s=1 rotating keys of a delegated AID, requiring both delegatee signatures and delegator seal approval"
    related_terms: ["Delegation", "Delegated Inception Event", "Rotation Event"]

  - term: "Establishment Event"
    synonyms: []
    definition: "A key event that changes key state — one of icp, rot, dip, or drt. Only establishment events modify signing/rotation authority."
    invariants:
      - "Must include signing keys (k), next key digests (n), signing threshold (kt), rotation threshold (nt)"
      - "Must include witness set (b for inception, br/ba for rotation) and witness threshold (bt)"
      - "The establishment subsequence pattern is: icp (rot* ixn*)* rot*"
      - "Two classes: non-delegated (icp, rot) and delegated (dip, drt)"
    examples:
      - "icp: initial establishment with first key set"
      - "rot: key rotation with new keys and possibly modified witnesses"
    related_terms: ["Key State", "Non-Establishment Event", "Establishment Subsequence"]

  - term: "Non-Establishment Event"
    synonyms: []
    definition: "A key event that does not change key state — currently only the interaction event (ixn)."
    invariants:
      - "Does not modify signing keys, rotation keys, thresholds, or witness set"
      - "Must be signed by current signing keys from the most recent establishment event"
      - "Used for anchoring data via seals"
    examples:
      - "ixn event anchoring a credential issuance seal"
    related_terms: ["Interaction Event", "Establishment Event", "Seal"]

  - term: "SAID"
    synonyms: ["Self-Addressing Identifier", "d field"]
    definition: "A self-referential content digest computed over the serialized event body using the SAID protocol. Appears in the d field of every event."
    invariants:
      - "Computed by replacing the d field with dummy '#' characters, serializing, hashing, then inserting the digest"
      - "The SAID uniquely identifies the exact content of the event"
      - "For self-addressing AIDs, the inception event's i field equals its d field"
      - "Serialization kind (JSON, CBOR, MGPK, CESR) affects the SAID value"
    examples:
      - "'EPR7FWsN3tOM8PqfMap2FRfF4MFQ4v3ZXjBUcMVtvhmB' — Blake3-256 digest with 'E' prefix"
    related_terms: ["Version String", "Prior Event Digest", "Self-Addressing Identifier"]

  - term: "Prior Event Digest"
    synonyms: ["p field", "Prior Event SAID"]
    definition: "The SAID of the immediately preceding event in the KEL, stored in the p field. Creates the hash-chain that makes the KEL tamper-evident."
    invariants:
      - "Present in all events except inception (which has no predecessor)"
      - "Must match the d field of the immediately prior event in the KEL"
      - "Creates a hash chain — modifying any event invalidates all subsequent events"
    examples:
      - "In an ixn at s=1, p='EPR7FWsN3t...' matches the d field of the icp at s=0"
    related_terms: ["SAID", "Hash Chain", "KEL"]

  - term: "Sequence Number"
    synonyms: ["s field", "sn"]
    definition: "A zero-based, strictly monotonically increasing integer that identifies the location (position) of an event in the KEL. Encoded as a hex string in the s field."
    invariants:
      - "Starts at 0 for inception"
      - "Increments by exactly 1 for each subsequent event"
      - "Different events at the same sequence number indicate duplicity or superseding recovery"
      - "Hex-encoded string in the event body (e.g., '0', '1', 'a', 'ff')"
    examples:
      - "icp at s='0', ixn at s='1', rot at s='2'"
      - "Two different events at s='3' indicates duplicity"
    related_terms: ["First-seen Number", "KEL", "Duplicity"]

  - term: "First-seen Number"
    synonyms: ["fn"]
    definition: "A strictly monotonically increasing integer ordinal assigned to each event upon its first acceptance into a KEL copy. Tracks the order of reception, independent of sequence number."
    invariants:
      - "Assigned by the database upon first acceptance — not part of the event message itself"
      - "Different KEL copies may assign different fn values to the same event"
      - "Consistent copies have the same event version at every sequence number"
      - "Enables replay of events in the order they were first-seen"
    examples:
      - "An event at sn=5 might have fn=7 if two superseded events were accepted earlier"
    related_terms: ["Sequence Number", "First-seen Rule", "Superseding Recovery"]

  - term: "Version String"
    synonyms: ["v field"]
    definition: "Protocol version metadata in the v field of every event. Encodes protocol identifier, version, serialization kind, and serialized size."
    invariants:
      - "Format: PPPPVVVVKKKKSSSS_ — protocol (4), version (4), kind (4), size (4), terminator"
      - "Provides regex target for cold-start stream detection"
      - "Serialization kind (JSON, CBOR, MGPK, CESR) directly affects SAID computation"
      - "Size field indicates total byte length of the serialized event body"
    examples:
      - "'KERICAACAAJSONAAKp.' — KERI version C.A.AC (decoded), JSON serialization, size 0xAAKp bytes"
      - "'KERICAACAACESRAAJM.' — KERI, CESR serialization"
    related_terms: ["SAID", "CESR"]

  - term: "Seal"
    synonyms: ["Anchor"]
    definition: "A cryptographic digest or reference embedded in the a field of an event that binds external data to the KEL without disclosing the data itself."
    invariants:
      - "Commits to external data via digest — the data itself is not in the KEL"
      - "Types include: digest seal, event seal (i, s, d fields), merkle tree root seal, latest establishment event seal"
      - "Seals in interaction events are the primary mechanism for anchoring external data"
      - "Delegation seals in delegator events bind to delegated inception/rotation events"
    examples:
      - "Event seal: {i: 'EHqSsH1Imc...', s: '0', d: 'EHqSsH1Imc...'} — references a specific event of another AID"
      - "Digest seal anchoring an ACDC credential"
    related_terms: ["Interaction Event", "Delegation Seal", "SAID"]

  - term: "Event Serialization"
    synonyms: ["Serialization Kind"]
    definition: "The binary encoding format used to serialize an event body. KERI supports JSON, CBOR, MessagePack (MGPK), and CESR native serialization."
    invariants:
      - "Serialization kind affects the SAID value — same logical event has different SAIDs in different serializations"
      - "Field ordering is normative and must be preserved in serialization"
      - "JSON serialization uses no whitespace (compact form)"
      - "CESR native serialization uses CESR codes directly"
    examples:
      - "JSON: compact no-whitespace serialization via json.dumps(separators=(',', ':'))"
      - "CESR: native binary serialization with CESR primitive codes"
    related_terms: ["Version String", "SAID", "CESR"]

  - term: "Event Locality"
    synonyms: ["Local Event", "Remote Event"]
    definition: "Classification of events as local (from a protected, trustable source) or remote (from an unprotected, potentially malicious source). Affects validation rules."
    invariants:
      - "Local events may assume trusted source — the device or a protected channel with MFA"
      - "Remote events must assume potentially malicious source"
      - "Witnesses should only accept local events from the controller"
      - "Validators apply different acceptance rules based on locality"
    examples:
      - "A controller signing an event on its own device — local"
      - "A validator receiving an event over the network from an unknown source — remote"
    related_terms: ["Validation Rules", "Witness", "Controller"]

  - term: "Witness Prune List"
    synonyms: ["br field", "Removed Witnesses"]
    definition: "The list of witness AIDs removed from the witness pool in a rotation event. Specified in the br field."
    invariants:
      - "Each AID in br must be in the current witness list"
      - "Witnesses in br are removed from the active witness set"
      - "Applied together with ba (added witnesses) to produce the new witness list"
    examples:
      - "br=['BA4PSatfQM...'] removes one witness during rotation"
    related_terms: ["Witness Graft List", "Rotation Event", "Witness List"]

  - term: "Witness Graft List"
    synonyms: ["ba field", "Added Witnesses"]
    definition: "The list of new witness AIDs added to the witness pool in a rotation event. Specified in the ba field."
    invariants:
      - "Each AID in ba must not already be in the current witness list"
      - "Combined with br removals to produce the new witness set"
    examples:
      - "ba=['BO3cCAfQiq...', 'BPowpltoeF...'] adds two new witnesses during rotation"
    related_terms: ["Witness Prune List", "Rotation Event", "Witness List"]

events:
  - name: "InceptionCreated"
    payload: "aid: AID, key_state: KeyState, witnesses: [WitnessAID], config: [Trait], said: SAID"
    triggers: "Controller creates a new AID by generating and signing an inception event"

  - name: "RotationPerformed"
    payload: "aid: AID, sn: int, new_keys: [PublicKey], new_next_digests: [Digest], witness_changes: {removed: [AID], added: [AID]}, said: SAID"
    triggers: "Controller rotates keys by generating a rotation event satisfying pre-rotation commitment and dual threshold"

  - name: "InteractionAnchored"
    payload: "aid: AID, sn: int, seals: [Seal], said: SAID"
    triggers: "Controller anchors external data to the KEL via an interaction event"

  - name: "EventValidated"
    payload: "aid: AID, sn: int, event_type: EventType, said: SAID"
    triggers: "A received event passes all validation checks and is accepted into the KEL"

  - name: "EventRejected"
    payload: "aid: AID, sn: int, event_type: EventType, reason: ValidationError"
    triggers: "A received event fails validation and is rejected"

  - name: "EventEscrowed"
    payload: "aid: AID, sn: int, event_type: EventType, reason: EscrowReason"
    triggers: "A received event cannot yet be fully validated (e.g., out-of-order, missing receipts) and is placed in escrow"

rules:
  - "The KEL is the sole source of truth for an AID's control authority — no external oracle"
  - "Events are processed in strict sequence order — out-of-order events are escrowed"
  - "Event field ordering is normative: v, t, d always first; remaining fields per event type specification"
  - "Key event message types must be one of: icp, rot, ixn, dip, drt"
  - "Each event must contain a valid SAID in its d field computed per the SAID protocol"
  - "Each non-inception event must contain a valid prior event digest in its p field"
  - "Sequence numbers must be zero-based, strictly monotonically increasing by one"
  - "A validator may drop any event that does not have at least one attached signature from the current controlling key state"
  - "Events are hash-chained — modifying any event invalidates all subsequent events in the chain"
