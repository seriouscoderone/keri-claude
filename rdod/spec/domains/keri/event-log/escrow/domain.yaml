# domain.yaml
template_version: "1.0"
id: "keri/event-log/escrow"
name: "Event Escrow"
description: >
  Typed escrow queues that hold events blocked at different validation stages. When an event
  cannot yet be fully validated -- missing prior event, insufficient signatures, missing witness
  receipts, or missing delegation seal -- it is placed in the appropriate escrow queue rather
  than rejected. As dependencies resolve, escrowed events are reprocessed through the validation
  pipeline. Events may flow between escrow types (the escrow cascade) before reaching final
  acceptance. Likely duplicitous events are escrowed permanently as forensic evidence.
version: "0.1.0"

source_material:
  - type: document
    reference: "keri-specification.md -- sections: Escrow, Out-of-Order Events, Partially Signed, Duplicity Detection"
  - type: document
    reference: "KERI_WP_2.x.web.md -- sections: Escrow Processing, Event Ordering, Duplicity"
  - type: document
    reference: "keripy -- eventing.py: Kevery escrow methods (escrowOOEvent, escrowPSEvent, escrowPWEvent, escrowPDEvent, escrowLDEvent, escrowMFEvent), processEscrow* methods, TimeoutOOE/PSE/PWE/LDE constants"
  - type: document
    reference: "keriox -- processor/escrow/: MaybeOutOfOrderEscrow, PartiallySignedEscrow, PartiallyWitnessedEscrow, DelegationEscrow, DuplicitousEvents, EscrowConfig, EscrowSet"

ubiquitous_language:
  - term: "Escrow Cascade"
    definition: "The flow of events between escrow queues based on what validation step fails"
    invariants:
      - "Events progress through escrows as their blocking conditions resolve"
      - "An event may visit multiple escrow types before final acceptance"
      - "Likely duplicitous events are permanent -- never auto-resolved"

  - term: "Out-of-Order Escrow"
    definition: "Holds events whose prior event in the KEL has not yet been received"
    invariants:
      - "Events are reprocessed when the prior event arrives and is accepted"
      - "Default timeout: 1200 seconds (keripy)"

domain_clients:
  - ref: "domain://keri/event-log"
    relationship: "Parent domain routes validation failures to the appropriate escrow queue and triggers reprocessing"
    via_port: "port://keri/event-log/escrow/inbound/escrow-management"

subdomains: []

kernels: []

adjacents: []

externals:
  - name: "Persistence"
    abstraction: "Repository"
    ref: "port://keri/event-log/escrow/outbound/escrow-store"
    implementation_notes: "Escrow storage subdatabases: .ooes (out-of-order), .pses (partially-signed), .pwes (partially-witnessed), .pdes (partially-delegated), .ldes (likely-duplicitous), .delegables (delegable), .misfits (misfit). Implementations: LMDB subdbs (keripy), EscrowCreator trait (keriox), DynamoDB tables (serious-keri)"

  - name: "Timer"
    abstraction: "Clock"
    ref: "port://keri/event-log/escrow/outbound/timeout-clock"
    implementation_notes: "Provides current time for escrow timeout checks. Events are pruned if (now - escrowed_time) > timeout. Implementations: datetime.datetime.now() (keripy), Duration/Instant (keriox)"

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    In keripy, escrow methods live on the Kevery class (escrowOOEvent, escrowPSEvent, etc.)
    and processing methods sweep each queue periodically (processEscrowOutOfOrders,
    processEscrowPartialSigs, etc.). In keriox, each escrow type is a separate struct
    (MaybeOutOfOrderEscrow, PartiallySignedEscrow, etc.) that implements the Notification
    observer pattern via NotificationBus, reprocessing events when relevant notifications fire.

issues: []

tags: ["escrow", "cascade", "out-of-order", "partial-signatures", "partial-witnesses", "delegation", "duplicity", "timeout"]
