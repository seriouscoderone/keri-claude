# ports.yaml
domain_ref: "keri/event-log/escrow"

ports:
  # Inbound -- what clients call
  - id: "port://keri/event-log/escrow/inbound/escrow-management"
    type: inbound
    name: "Escrow Management"
    contract: "escrow_ooe(event: SignedEventMessage) -> Result; escrow_pse(event: SignedEventMessage) -> Result; escrow_pwe(event: SignedEventMessage) -> Result; escrow_pde(event: SignedEventMessage) -> Result; escrow_lde(event: SignedEventMessage) -> Result; escrow_misfit(event: SignedEventMessage) -> Result; escrow_delegable(event: SignedEventMessage) -> Result"
    protocol: "method-call"
    refs: ["domain://keri/event-log"]

  - id: "port://keri/event-log/escrow/inbound/escrow-processing"
    type: inbound
    name: "Escrow Processing"
    contract: "process_escrows() -> [EscrowResolved]; process_ooe() -> [EscrowResolved]; process_pse() -> [EscrowResolved]; process_pwe() -> [EscrowResolved]; process_pde() -> [EscrowResolved]"
    protocol: "method-call"
    refs: ["domain://keri/event-log"]

  - id: "port://keri/event-log/escrow/inbound/signature-accumulation"
    type: inbound
    name: "Signature Accumulation"
    contract: "add_signatures(aid: AID, sn: int, said: SAID, sigers: [Siger]) -> Result; add_witness_receipts(aid: AID, sn: int, said: SAID, wigers: [Wiger]) -> Result"
    protocol: "method-call"
    refs: ["domain://keri/event-log"]

  # Outbound -- what escrow calls
  - id: "port://keri/event-log/escrow/outbound/escrow-store"
    type: outbound
    name: "Escrow Persistence"
    contract: "put_ooe(aid: AID, sn: int, said: SAID, event: SignedEventMessage, dt: datetime) -> Result; get_ooe_iter(aid: AID) -> Iterator<SignedEventMessage>; rem_ooe(aid: AID, sn: int, said: SAID) -> Result; put_pse(aid: AID, sn: int, said: SAID, event: SignedEventMessage, dt: datetime) -> Result; get_pse_iter(aid: AID) -> Iterator<SignedEventMessage>; rem_pse(aid: AID, sn: int, said: SAID) -> Result; put_pwe(...) -> Result; put_pde(...) -> Result; put_lde(...) -> Result; put_misfit(...) -> Result; put_delegable(...) -> Result"
    protocol: "method-call"
    refs: ["persistence"]

  - id: "port://keri/event-log/escrow/outbound/timeout-clock"
    type: outbound
    name: "Timeout Clock"
    contract: "now() -> datetime; elapsed_since(dt: datetime) -> Duration"
    protocol: "method-call"
    refs: ["timer"]
