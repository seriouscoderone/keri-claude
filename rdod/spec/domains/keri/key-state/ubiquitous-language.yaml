# ubiquitous-language.yaml
domain_ref: "keri/key-state"

terms:
  - term: "Key State"
    synonyms: ["Current Key State", "Identifier State"]
    definition: "The complete authoritative configuration for an AID at a given point in its KEL. Encapsulates all information needed to validate signatures and authorize the next rotation."
    invariants:
      - "Deterministically computed from the KEL up to the latest establishment event"
      - "Only establishment events (icp, rot, dip, drt) modify key state"
      - "Interaction events (ixn) do not alter key state"
      - "Includes: signing keys (k), next key digests (n), signing threshold (kt), rotation threshold (nt), witness list (b), witness threshold (bt), configuration traits (c)"
    examples:
      - "After inception: initial signing keys, initial next key digests, initial witness set"
      - "After rotation: new signing keys (from previous next set), new next key digests, possibly modified witness set"
    related_terms: ["Establishment Event", "Signing Keys", "Next Key Digests", "Signing Threshold", "Rotation Threshold"]

events:
  - name: "KeyStateComputed"
    payload: "aid: AID, key_state: KeyState, from_event: EstablishmentEvent"
    triggers: "A new establishment event is validated, and the resulting key state is derived"

  - name: "PreRotationCommitted"
    payload: "aid: AID, next_digests: [Digest], next_threshold: Threshold"
    triggers: "An establishment event publishes new next key digests, creating a forward commitment"

  - name: "SigningAuthorityChanged"
    payload: "aid: AID, old_keys: [PublicKey], new_keys: [PublicKey], old_threshold: Threshold, new_threshold: Threshold"
    triggers: "A rotation event replaces the current signing keys and threshold"

  - name: "WitnessSetChanged"
    payload: "aid: AID, removed: [WitnessAID], added: [WitnessAID], new_threshold: int"
    triggers: "A rotation event modifies the witness list or witness threshold"

rules:
  - "Key state is deterministic — the same KEL prefix always produces the same key state"
  - "Only establishment events modify key state; interaction events are invisible to key state computation"
  - "A rotation is only valid if the new signing keys include a threshold-satisficing subset of the previously pre-committed next keys"
  - "Rotation signatures must satisfy both the new signing threshold (kt) and the prior next threshold (nt) — this is the dual threshold requirement"
  - "An empty next key digest list (n = []) in any establishment event permanently ends the AID's transferability"
  - "Configuration traits are cumulative — once set, they apply to all subsequent events"
  - "Pre-rotated keys are first-time, one-time, only-time use for rotation authority"
