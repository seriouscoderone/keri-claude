# ubiquitous-language.yaml
domain_ref: "keri/key-state"

terms:
  - term: "Key State"
    synonyms: ["Current Key State", "Identifier State"]
    definition: "The complete authoritative configuration for an AID at a given point in its KEL. Encapsulates all information needed to validate signatures and authorize the next rotation."
    invariants:
      - "Deterministically computed from the KEL up to the latest establishment event"
      - "Only establishment events (icp, rot, dip, drt) modify key state"
      - "Interaction events (ixn) do not alter key state"
      - "Includes: signing keys (k), next key digests (n), signing threshold (kt), rotation threshold (nt), witness list (b), witness threshold (bt), configuration traits (c)"
    examples:
      - "After inception: initial signing keys, initial next key digests, initial witness set"
      - "After rotation: new signing keys (from previous next set), new next key digests, possibly modified witness set"
    related_terms: ["Establishment Event", "Signing Keys", "Next Key Digests", "Signing Threshold", "Rotation Threshold"]

  - term: "Signing Keys"
    synonyms: ["Current Keys", "k field"]
    definition: "The ordered list of qualified public keys currently authorized to sign events and other data for an AID. Specified in the k field of establishment events."
    invariants:
      - "Must include a satisfiable subset with respect to the prior next threshold from the most recent prior establishment event (for rotations)"
      - "At inception, signing keys are freely chosen by the controller"
      - "At rotation, the new signing keys must include the previously pre-committed next keys (unblinded)"
      - "Ordered — index position matters for indexed signatures"
    examples:
      - "A list of three Ed25519 public keys: ['DBFiIgoCOpJ...', 'DG-YwInLUx...', 'DGIAk2jkC3...']"
      - "After rotation, the keys that were previously committed as next key digests now appear as full public keys"
    related_terms: ["Signing Threshold", "Pre-rotation Commitment", "Indexed Signature"]

  - term: "Next Key Digests"
    synonyms: ["Pre-rotated Key Digests", "n field", "Next Keys"]
    definition: "The ordered list of cryptographic digests of the public keys that will be authorized for the next rotation. Published in the n field of establishment events as a forward-blinded commitment."
    invariants:
      - "Each entry is a qualified digest (e.g., Blake3-256) of the corresponding next public key"
      - "The actual public keys are kept secret until used in a subsequent rotation"
      - "Provides post-quantum resistance — attacker must compromise both current and pre-committed keys"
      - "An empty next key digest list (n = []) signals a non-transferable AID — no further rotations possible"
    examples:
      - "A list of three Blake3-256 digests: ['ELeFYMmuJb...', 'ENY9GYShOj...', 'EGyJ7y3Tle...']"
      - "Empty list [] in inception means the AID is non-transferable"
    related_terms: ["Pre-rotation Commitment", "Rotation Threshold", "Signing Keys"]

  - term: "Signing Threshold"
    synonyms: ["Current Threshold", "kt field"]
    definition: "The threshold expression that determines the minimum satisficing subset of current signing keys required to produce a valid signature on any event."
    invariants:
      - "Must be satisfiable given the number of keys in the signing key list"
      - "Can be a simple integer M (M-of-N) or a fractionally weighted threshold"
      - "A valid event must have signatures satisfying this threshold from the current signing keys"
      - "For rotations, signatures must satisfy both the new signing threshold and the prior next threshold"
    examples:
      - "Simple: '2' means 2-of-3 when there are 3 signing keys"
      - "Fractional: ['1/2', '1/2', '1/2'] means each key has weight 1/2, and sum of weights must reach 1"
    related_terms: ["Signing Keys", "Rotation Threshold", "Fractionally Weighted Threshold"]

  - term: "Rotation Threshold"
    synonyms: ["Next Threshold", "nt field"]
    definition: "The threshold expression that determines the minimum satisficing subset of next (pre-rotated) keys required to authorize a rotation event."
    invariants:
      - "Must be satisfiable given the number of next key digests"
      - "Can be a simple integer or fractionally weighted"
      - "The rotation event must satisfy both the newly current signing threshold AND this prior next threshold"
      - "Applies at the time of the next rotation, not at the time of the establishment event that declares it"
    examples:
      - "Simple: '2' means 2-of-3 next keys must sign the rotation"
      - "Fractional: ['1/2', '1/2', '1/2'] for weighted rotation authorization"
    related_terms: ["Next Key Digests", "Signing Threshold", "Dual Threshold"]

  - term: "Pre-rotation Commitment"
    synonyms: ["Pre-rotation", "Forward-Blinded Commitment"]
    definition: "The practice of publishing a cryptographic digest of each next rotation key in the current establishment event, before those keys are ever exposed or used. This creates a verifiable forward commitment that constrains which keys can authorize the next rotation."
    invariants:
      - "The digest of each next public key must appear in the n field of the preceding establishment event"
      - "Pre-committed keys are never exposed until the rotation that activates them"
      - "Provides post-quantum resistance — attacker must compromise both current keys and pre-committed keys simultaneously"
      - "Each set of pre-rotated keys is first-time, one-time, only-time use for rotation"
      - "No rotation is valid without keys matching the pre-committed digests"
    examples:
      - "Inception event commits to first rotation keys: n field contains digests of next public keys"
      - "Each rotation both activates the previously committed keys and commits to a new next set"
    related_terms: ["Next Key Digests", "Rotation Threshold", "Key State"]

  - term: "Witness List"
    synonyms: ["Witness Set", "b field", "Witness Pool"]
    definition: "The ordered list of witness AIDs designated by the controller in establishment events. Witnesses provide availability and consistency via the first-seen rule."
    invariants:
      - "Designated by the controller, not self-selected by witnesses"
      - "Set at inception in the b field; modified at rotation via br (remove) and ba (add) fields"
      - "The witness threshold (bt) must be satisfiable given the number of witnesses"
      - "Witness changes are part of the key state and take effect at the establishment event"
    examples:
      - "Initial witness list of 4: ['BGKV6v93ue...', 'BJfueFAYc7...', 'BAPv2Mnoi...', 'BA4PSatfQM...']"
      - "After rotation: one witness removed via br, two added via ba"
    related_terms: ["Witness Threshold", "KAWA", "Receipt"]

  - term: "Witness Threshold"
    synonyms: ["Accountability Threshold", "Tally", "bt field"]
    definition: "The minimum number of witness receipts required for an event to be considered sufficiently accountable. Specified in the bt field of establishment events."
    invariants:
      - "Must be an integer no greater than the number of witnesses in the witness list"
      - "Determines the M in M-of-N witness accountability"
      - "Can be changed at rotation along with the witness set"
      - "A higher threshold increases security but requires more witness availability"
    examples:
      - "'3' with 4 witnesses means 3-of-4 must receipt for accountability"
      - "Changed from '3' to '4' during a rotation that adds witnesses"
    related_terms: ["Witness List", "KAWA", "Immune Constraint"]

  - term: "Configuration Traits"
    synonyms: ["Modes", "c field"]
    definition: "A list of configuration options set in establishment events that modify the behavior and interpretation of an AID's key state."
    invariants:
      - "Set in the c field of establishment events"
      - "Currently defined traits include: EO (establishment only), DND (do not delegate), DID (delegate is delegator)"
      - "EO means only establishment events are allowed — no interaction events"
      - "DND means the AID cannot delegate to other AIDs"
      - "Traits are cumulative across establishment events"
    examples:
      - "['EO'] — establishment-only mode, no interaction events permitted"
      - "['DND'] — delegation not allowed from this AID"
      - "['DID'] — validators may treat delegates of this AID as the AID itself"
    related_terms: ["Key State", "Establishment Event"]

  - term: "Establishment Subsequence"
    synonyms: ["Establishment Event Sequence"]
    definition: "The ordered subsequence of only the establishment events (inception and rotations) within a KEL, ignoring all interaction events. Key state is derived exclusively from this subsequence."
    invariants:
      - "Pattern: icp (rot* ixn*)* rot* — inception followed by any mix of rotations and interactions"
      - "Key state at any point is fully determined by the establishment subsequence up to that point"
      - "Interaction events between establishment events do not affect key state"
      - "The establishment subsequence is hash-chained independently of the full KEL"
    examples:
      - "A KEL of [icp, ixn, ixn, rot, ixn, rot] has establishment subsequence [icp, rot, rot]"
    related_terms: ["Key State", "KEL", "Establishment Event"]

  - term: "Dual Threshold"
    synonyms: ["Double Threshold Requirement"]
    definition: "The requirement that a rotation event's signatures must satisfy both the newly current signing threshold (kt) and the prior next threshold (nt from the previous establishment event)."
    invariants:
      - "Both thresholds must be independently satisfied for a valid rotation"
      - "The newly current key list must include a satisfiable subset of the previously pre-committed keys"
      - "This is what cryptographically enforces the pre-rotation commitment"
    examples:
      - "If prior nt='2' and new kt='2', the rotation must have signatures satisfying both M-of-N requirements"
    related_terms: ["Signing Threshold", "Rotation Threshold", "Pre-rotation Commitment"]

  - term: "Fractionally Weighted Threshold"
    synonyms: ["Weighted Threshold"]
    definition: "A threshold expression where each key is assigned a fractional weight, and the sum of weights of signing keys must reach or exceed 1 for the threshold to be satisfied."
    invariants:
      - "Expressed as a list of fractions, one per key, in the same order as the key list"
      - "Each fraction represents the weight of the corresponding key's signature"
      - "The sum of weights of the actual signers must be >= 1"
      - "Enables unequal key authority — some keys can have more weight than others"
    examples:
      - "['1/2', '1/2', '1/2'] — any 2-of-3 keys suffice (each weighs 1/2, sum of any two >= 1)"
      - "['1/1', '1/2', '1/2'] — first key alone suffices, or both other keys together"
    related_terms: ["Signing Threshold", "Rotation Threshold"]

  - term: "Non-transferable AID"
    synonyms: ["Non-transferable Identifier"]
    definition: "An AID whose inception event has an empty next key digest list (n = []), signaling that no key rotation is possible. The AID is permanently bound to its inception keys."
    invariants:
      - "n field is empty list [] in inception event"
      - "No rotation events are valid for this AID"
      - "If the inception keys are compromised, the AID is permanently compromised"
      - "Simpler and sufficient for ephemeral or low-value identifiers"
    examples:
      - "A witness AID that uses non-transferable keys for simplicity"
      - "An ephemeral session identifier that does not need key rotation"
    related_terms: ["Key State", "Next Key Digests", "Pre-rotation Commitment"]

  - term: "Partial Rotation"
    synonyms: []
    definition: "A rotation where not all pre-rotated keys are repurposed as signing keys. Some pre-rotated keys are used only for their one-time rotation authority and then discarded, minimizing exposure."
    invariants:
      - "Reduces exposure of pre-rotated keys as signing keys"
      - "Provides stronger protection against establishment dead-attacks"
      - "The newly current key list need only include a threshold-satisficing subset of the prior next keys"
    examples:
      - "Prior next has 5 keys with threshold 3; rotation uses 3 as signing keys and discards the other 2"
    related_terms: ["Pre-rotation Commitment", "Dual Threshold", "Dead-Attack"]

  - term: "Key Event Verifier"
    synonyms: ["Kever", "IdentifierState"]
    definition: "State machine tracking one AID's current key state. Computed deterministically from the KEL's establishment subsequence. Holds current signing keys, signing threshold, next key digests, next threshold, witness list, witness threshold, and last establishment event location."
    invariants:
      - "One Key Event Verifier instance per AID being tracked"
      - "State is updated only by establishment events (icp, rot, dip, drt)"
      - "Provides signature verification against the current signing keys and threshold"
      - "Tracks the last establishment event location for rotation validation"
    examples:
      - "A Kever (keripy) initialized from an inception event, then updated by each subsequent rotation"
      - "An IdentifierState (keriox) struct reconstructed by replaying the KEL"
    related_terms: ["Key State", "Establishment Event", "Last Establishment Data", "Signing Keys"]

  - term: "Last Establishment Data"
    synonyms: ["lastEst", "LastEstablishmentData"]
    definition: "Snapshot of the most recent establishment event: sequence number, event digest, witnesses removed, and witnesses added. Used for rotation validation — the next rotation must reference this data."
    invariants:
      - "Updated each time an establishment event is processed"
      - "Contains the sequence number and SAID of the last establishment event"
      - "Stores witness changes (broken/added) from the last establishment event"
      - "Required input for validating the next rotation event"
    examples:
      - "After a rotation at sn=4: lastEst holds {sn: 4, digest: 'EABC...', br: ['Bxyz...'], ba: ['Bdef...']}"
    related_terms: ["Key Event Verifier", "Rotation Event", "Establishment Event"]

  - term: "Key Configuration"
    synonyms: ["KeyConfig"]
    definition: "The current set of signing keys paired with the next key hash commitment. Represents the cryptographic material portion of key state — the keys authorized to sign now and the digests constraining the next rotation."
    invariants:
      - "Current signing keys (verfers in keripy) are qualified public keys ready for signature verification"
      - "Next key digests (ndigers in keripy) are one-way commitments to future rotation keys"
      - "Both lists are ordered — index position matters for indexed signatures and thresholds"
    examples:
      - "In keripy: verfers=[Verfer(qb64='DABC...'), Verfer(qb64='DDEF...')] + ndigers=[Diger(qb64='EABC...')]"
      - "In keriox: KeyConfig struct with current public keys and next key commitment fields"
    related_terms: ["Key State", "Signing Keys", "Next Key Digests", "Key Event Verifier"]

  - term: "Witness Configuration"
    synonyms: ["WitnessConfig"]
    definition: "The current witness list paired with the receipt threshold (TOAD — Threshold of Accountable Duplicity). Provides the accountability layer of key state — which witnesses must receipt events and how many receipts are required."
    invariants:
      - "Witness list is an ordered set of witness AIDs"
      - "TOAD must be satisfiable given the witness count"
      - "Provides enough_receipts() check — whether the witness threshold is met for a given event"
    examples:
      - "In keripy: wits=['BGKV...', 'BJfu...', 'BAPv...'] with toader=Tholder(sith='2') requiring 2-of-3 receipts"
      - "In keriox: WitnessConfig with witness list and toad threshold"
    related_terms: ["Witness List", "Witness Threshold", "Key State", "KAWA"]

  - term: "Configuration Traits"
    synonyms: ["c field", "config traits"]
    definition: "Boolean flags set at inception that constrain AID behavior. Set via the 'c' field in inception events and carried forward in key state."
    invariants:
      - "EstOnly (EO): only establishment events allowed, interaction events are invalid"
      - "DoNotDelegate (DND): the AID cannot serve as a delegator for other AIDs"
      - "NoBackers: no backers/witnesses required for this AID"
      - "Traits are set at inception and are cumulative across establishment events"
    examples:
      - "c=['EO'] — establishment-only AID, cannot create interaction events"
      - "c=['DND'] — AID is prohibited from delegating to other identifiers"
    related_terms: ["Key State", "Establishment Event", "Inception Event"]

  - term: "State Reconstruction"
    synonyms: []
    definition: "The process of recomputing current key state by replaying the KEL from inception through all establishment events. Enables stateless verification — any validator can reconstruct state from the log alone without relying on cached state."
    invariants:
      - "Replaying the same KEL always produces the same key state (deterministic)"
      - "Only establishment events in the replay affect the resulting key state"
      - "Interaction events are traversed for hash-chain validation but do not modify state"
      - "Any validator can independently reconstruct key state from a KEL copy"
    examples:
      - "In keriox: EventStorage.get_state() replays the KEL to reconstruct IdentifierState"
      - "A new validator bootstrapping by replaying a full KEL from inception to compute current key state"
    related_terms: ["Key State", "Key Event Verifier", "Establishment Subsequence", "KEL"]

  - term: "Transferable Identifier"
    synonyms: ["Transferable AID", "Transferable Prefix"]
    definition: "An AID whose control authority can be transferred via key rotation. Uses transferable prefix codes (D=Ed25519, 1AAB=ECDSA secp256k1, 1AAJ=ECDSA secp256r1, 1AAD=Ed448). Must include pre-rotation commitments (next key digests) in establishment events."
    invariants:
      - "Prefix code indicates transferability (D, 1AAB, 1AAJ, 1AAD)"
      - "Establishment events MUST include next key digests (n field) for pre-rotation"
      - "Control transfers via rotation events that satisfy the pre-rotation commitment"
      - "Supports full KERI lifecycle: inception → rotation* → interaction*"
    examples:
      - "Prefix starting with 'D' — transferable Ed25519 identifier, can rotate keys"
      - "Prefix starting with 'E' — self-addressing transferable identifier (Blake3-256 of inception)"
    related_terms: ["Non-transferable Identifier", "Pre-rotation", "Key State"]

  - term: "Non-transferable Identifier"
    synonyms: ["Non-transferable AID", "Non-transferable Prefix", "Ephemeral Identifier"]
    definition: "An AID whose control authority is fixed at inception and cannot be rotated. Uses non-transferable prefix codes (B=Ed25519N, 1AAA=ECDSA secp256k1N, 1AAI=ECDSA secp256r1N, 1AAC=Ed448N). The 'N' suffix in code names indicates non-transferable. Commonly used for witnesses and ephemeral interactions."
    invariants:
      - "Prefix code indicates non-transferability (B, 1AAA, 1AAI, 1AAC — the 'N' variants)"
      - "No next key digests — pre-rotation is not possible"
      - "Cannot issue rotation events — the inception key is permanent"
      - "Compromise of the single key is unrecoverable"
    examples:
      - "Prefix starting with 'B' — non-transferable Ed25519 identifier, fixed key"
      - "A witness AID using a non-transferable prefix — witnesses don't rotate keys"
    related_terms: ["Transferable Identifier", "Key State", "Witness"]

events:
  - name: "KeyStateComputed"
    payload: "aid: AID, key_state: KeyState, from_event: EstablishmentEvent"
    triggers: "A new establishment event is validated, and the resulting key state is derived"

  - name: "PreRotationCommitted"
    payload: "aid: AID, next_digests: [Digest], next_threshold: Threshold"
    triggers: "An establishment event publishes new next key digests, creating a forward commitment"

  - name: "SigningAuthorityChanged"
    payload: "aid: AID, old_keys: [PublicKey], new_keys: [PublicKey], old_threshold: Threshold, new_threshold: Threshold"
    triggers: "A rotation event replaces the current signing keys and threshold"

  - name: "WitnessSetChanged"
    payload: "aid: AID, removed: [WitnessAID], added: [WitnessAID], new_threshold: int"
    triggers: "A rotation event modifies the witness list or witness threshold"

rules:
  - "Key state is deterministic — the same KEL prefix always produces the same key state"
  - "Only establishment events modify key state; interaction events are invisible to key state computation"
  - "A rotation is only valid if the new signing keys include a threshold-satisficing subset of the previously pre-committed next keys"
  - "Rotation signatures must satisfy both the new signing threshold (kt) and the prior next threshold (nt) — this is the dual threshold requirement"
  - "An empty next key digest list (n = []) in any establishment event permanently ends the AID's transferability"
  - "Configuration traits are cumulative — once set, they apply to all subsequent events"
  - "Pre-rotated keys are first-time, one-time, only-time use for rotation authority"
