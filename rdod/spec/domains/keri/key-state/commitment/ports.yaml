# ports.yaml
domain_ref: "keri/key-state/commitment"

ports:
  # Inbound — what the parent key-state domain calls
  - id: "port://keri/key-state/commitment/inbound/key-commitment"
    type: inbound
    name: "Key Commitment Management"
    contract: "build_key_config(signing_keys: [PublicKey], next_digests: [Digest]) -> KeyConfiguration; verify_pre_rotation(new_keys: [PublicKey], prior_next_digests: [Digest]) -> Result<[MatchedIndex], PreRotationError>; compute_next_digest(public_key: PublicKey, algorithm: DigestAlgorithm) -> Digest"
    protocol: "method-call"
    refs: ["domain://keri/key-state"]

  - id: "port://keri/key-state/commitment/inbound/transferability"
    type: inbound
    name: "Transferability Classification"
    contract: "is_transferable(prefix_code: PrefixCode) -> bool; is_transferable_aid(next_digests: [Digest]) -> bool; classify_prefix(prefix: AID) -> TransferabilityKind"
    protocol: "method-call"
    refs: ["domain://keri/key-state"]

  - id: "port://keri/key-state/commitment/inbound/partial-rotation"
    type: inbound
    name: "Partial Rotation"
    contract: "validate_partial_rotation(new_keys: [PublicKey], prior_next_digests: [Digest], prior_next_threshold: Threshold) -> Result<{promoted: [int], discarded: [int]}, PartialRotationError>"
    protocol: "method-call"
    refs: ["domain://keri/key-state"]
