# verification.yaml
domain_ref: "keri/key-state/thresholds"

properties:
  # Signing Threshold invariants
  - invariant: "Must be satisfiable given the number of keys in the signing key list (k field)"
    term: "Signing Threshold"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        M, N = Ints('M N')
        s = Solver()
        s.add(N >= 1)  # at least one key
        s.add(M >= 1)  # threshold at least 1
        s.add(M <= N)  # satisfiable
        assert s.check() == sat
        # Unsatisfiable case: M > N
        s2 = Solver()
        s2.add(N >= 1, M >= 1, M > N)
        # This is satisfiable — represents the invalid config that should be rejected
    notes: "Simple threshold M must be <= N keys. SMT validates boundary."

  - invariant: "Can be a simple integer M (M-of-N) or a fractionally weighted threshold"
    term: "Signing Threshold"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(sith=st.one_of(
            st.integers(min_value=1, max_value=10),
            st.lists(st.fractions(min_value=0, max_value=1), min_size=1, max_size=10)
        ))
        def test_threshold_types(sith):
            tholder = parse_threshold(sith)
            if isinstance(sith, int):
                assert not tholder.weighted
                assert tholder.num == sith
            else:
                assert tholder.weighted
    strategy: "st.one_of(integer, list of fractions)"
    notes: "Two representation forms with the same satisfaction interface."

  - invariant: "A valid event must have signatures satisfying this threshold from the current signing keys"
    term: "Signing Threshold"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(threshold=st.integers(min_value=1, max_value=5),
               n_keys=st.integers(min_value=1, max_value=10),
               n_sigs=st.integers(min_value=0, max_value=10))
        def test_threshold_satisfaction(threshold, n_keys, n_sigs):
            assume(threshold <= n_keys)
            indices = list(range(min(n_sigs, n_keys)))
            tholder = parse_threshold(threshold)
            if n_sigs >= threshold:
                assert tholder.satisfy(indices)
            else:
                assert not tholder.satisfy(indices)
    strategy: "st.integers for threshold, key count, sig count"
    notes: "Simple threshold satisfaction: sig count >= threshold."

  - invariant: "For rotations, signatures must satisfy both the new signing threshold AND the prior next threshold (dual threshold)"
    term: "Signing Threshold"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kt=st.integers(min_value=1, max_value=5),
               nt=st.integers(min_value=1, max_value=5),
               indices=st.lists(st.integers(min_value=0, max_value=9), min_size=0, max_size=10),
               ondices=st.lists(st.integers(min_value=0, max_value=9), min_size=0, max_size=10))
        def test_dual_threshold_both_required(kt, nt, indices, ondices):
            tholder = parse_threshold(kt)
            ntholder = parse_threshold(nt)
            kt_satisfied = tholder.satisfy(indices)
            nt_satisfied = ntholder.satisfy(ondices)
            rotation_valid = kt_satisfied and nt_satisfied
            # Both must independently pass
            if not kt_satisfied or not nt_satisfied:
                assert not rotation_valid
    strategy: "Independent threshold values and index lists"
    notes: "Dual threshold requires independent satisfaction of both kt and nt."

  # Rotation Threshold invariants
  - invariant: "Must be satisfiable given the number of next key digests (n field)"
    term: "Rotation Threshold"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        nt, n_digests = Ints('nt n_digests')
        s = Solver()
        s.add(n_digests >= 1, nt >= 1, nt <= n_digests)
        assert s.check() == sat
        # Invalid: nt > n_digests
        s2 = Solver()
        s2.add(n_digests >= 1, nt >= 1, nt > n_digests)
        # Satisfiable — represents the invalid case
    notes: "nt must be satisfiable given the number of next key digests."

  - invariant: "Applies at the time of the next rotation — the nt from the PRIOR establishment event constrains the current rotation"
    term: "Rotation Threshold"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_with_rotation_strategy())
        def test_nt_from_prior_establishment(kel):
            for event in kel.events:
                if event.t in ('rot', 'drt'):
                    prior_est = kel.prior_establishment(event)
                    # The nt used for validation comes from the prior establishment
                    assert validate_rotation_uses_threshold(event, prior_est.nt)
    strategy: "kel_with_rotation_strategy()"
    notes: "nt is a forward commitment — declared in one event, enforced at the next."

  # Dual Threshold invariants
  - invariant: "Both thresholds must be independently satisfied for a valid rotation"
    term: "Dual Threshold"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        kt_satisfied = Bool('kt_satisfied')
        nt_satisfied = Bool('nt_satisfied')
        rotation_valid = Bool('rotation_valid')
        s = Solver()
        s.add(rotation_valid == And(kt_satisfied, nt_satisfied))
        # Prove: rotation valid implies both satisfied
        s.add(rotation_valid)
        s.add(Not(kt_satisfied))
        assert s.check() == unsat  # Cannot be valid without kt
        s2 = Solver()
        s2.add(rotation_valid == And(kt_satisfied, nt_satisfied))
        s2.add(rotation_valid)
        s2.add(Not(nt_satisfied))
        assert s2.check() == unsat  # Cannot be valid without nt
    notes: "SMT proves neither threshold can be bypassed in a valid rotation."

  - invariant: "An inception event has only a signing threshold — no prior nt exists yet"
    term: "Dual Threshold"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(icp=inception_event_strategy())
        def test_inception_no_prior_nt(icp):
            assert icp.t in ('icp', 'dip')
            assert icp.kt is not None
            # No dual threshold check for inception — only kt
            result = validate_inception_sigs(icp, icp.kt)
            assert result is not None  # Only kt checked
    strategy: "inception_event_strategy()"
    notes: "Inception has kt but no prior nt to check against."

  # Fractionally Weighted Threshold invariants
  - invariant: "Expressed as a list of fractions, one per key, in the same order as the key list"
    term: "Fractionally Weighted Threshold"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(n_keys=st.integers(min_value=1, max_value=10))
        def test_weighted_threshold_length(n_keys):
            weights = [Fraction(1, n_keys) for _ in range(n_keys)]
            tholder = parse_threshold(weights)
            assert tholder.weighted
            assert len(tholder.weights) == n_keys
    strategy: "st.integers(1..10) for key count"
    notes: "Weight list length must match key list length."

  - invariant: "The sum of weights of the actual signers must be >= 1"
    term: "Fractionally Weighted Threshold"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        w1, w2, w3 = Reals('w1 w2 w3')
        satisfied = Bool('satisfied')
        s = Solver()
        s.add(w1 >= 0, w2 >= 0, w3 >= 0)
        s.add(w1 <= 1, w2 <= 1, w3 <= 1)
        s.add(satisfied == (w1 + w2 + w3 >= 1))
        # Example: ['1/2', '1/2', '1/2'] — any 2 sum to 1
        s.add(w1 == RealVal('1/2'), w2 == RealVal('1/2'), w3 == RealVal('1/2'))
        s.add(satisfied)
        assert s.check() == sat
    notes: "Weighted threshold sum >= 1 is the satisfaction criterion."

  - invariant: "Enables unequal key authority — a high-weight key alone may satisfy the threshold while multiple low-weight keys are needed together"
    term: "Fractionally Weighted Threshold"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(st.data())
        def test_unequal_authority(data):
            # High-weight key alone suffices
            weights = [Fraction(1, 1), Fraction(1, 2), Fraction(1, 2)]
            tholder = parse_threshold(weights)
            assert tholder.satisfy([0])  # Key 0 alone (weight 1) suffices
            assert not tholder.satisfy([1])  # Key 1 alone (weight 1/2) insufficient
            assert tholder.satisfy([1, 2])  # Keys 1+2 (1/2 + 1/2 = 1) suffices
    strategy: "Fixed example demonstrating unequal authority"
    notes: "Unequal weights create asymmetric signing power."

  # Witness Threshold invariants
  - invariant: "Must be a non-negative integer no greater than the number of witnesses in the witness list"
    term: "Witness Threshold"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        bt, n_witnesses = Ints('bt n_witnesses')
        s = Solver()
        s.add(bt >= 0, n_witnesses >= 0, bt <= n_witnesses)
        assert s.check() == sat
        # Invalid: bt > n_witnesses
        s2 = Solver()
        s2.add(bt >= 0, n_witnesses >= 0, bt > n_witnesses)
        # Satisfiable — represents invalid configuration
    notes: "Witness threshold is bounded by [0, N] where N is witness count."

  - invariant: "A higher threshold increases security but requires more witness availability"
    term: "Witness Threshold"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(bt1=st.integers(min_value=1, max_value=5),
               bt2=st.integers(min_value=1, max_value=5),
               n_witnesses=st.integers(min_value=5, max_value=10))
        def test_higher_threshold_more_strict(bt1, bt2, n_witnesses):
            assume(bt1 < bt2 <= n_witnesses)
            receipts = list(range(bt1))  # exactly bt1 receipts
            assert satisfy_witness(bt1, receipts)
            assert not satisfy_witness(bt2, receipts)  # bt2 > bt1, same receipts insufficient
    strategy: "st.integers for two thresholds and witness count"
    notes: "Higher bt requires more receipts — monotonic strictness."

  # Witness Configuration invariants
  - invariant: "Witness list is an ordered set of witness AIDs (non-transferable prefixes)"
    term: "Witness Configuration"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(witnesses=st.lists(witness_aid_strategy(), min_size=1, max_size=10, unique=True))
        def test_witness_list_ordered_unique(witnesses):
            config = build_witness_config(witnesses, toad=1)
            assert len(config.witnesses) == len(set(config.witnesses))  # unique
            assert config.witnesses == witnesses  # order preserved
    strategy: "st.lists(witness_aid_strategy(), unique=True)"
    notes: "Witnesses are ordered and unique — no duplicates."

  - invariant: "TOAD (bt) must be satisfiable given the witness count: 0 <= bt <= len(witnesses)"
    term: "Witness Configuration"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        bt, wc = Ints('bt wc')
        s = Solver()
        s.add(wc >= 0, bt >= 0, bt <= wc)
        assert s.check() == sat
    notes: "Same as Witness Threshold boundary — applied to configuration."

  - invariant: "Witness changes at rotation are ordered: removals (br) applied before additions (ba)"
    term: "Witness Configuration"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(initial=st.lists(witness_aid_strategy(), min_size=3, max_size=6, unique=True))
        def test_witness_changes_order(initial):
            to_remove = [initial[0]]
            to_add = [generate_witness_aid()]
            assume(to_add[0] not in initial)
            config = build_witness_config(initial, toad=1)
            new_config = apply_witness_changes(config, removals=to_remove, additions=to_add)
            assert to_remove[0] not in new_config.witnesses
            assert to_add[0] in new_config.witnesses
    strategy: "st.lists(witness_aid_strategy(), 3..6, unique=True)"
    notes: "Removals first, then additions — prevents conflicts."

  # Witness List invariants
  - invariant: "Duplicate witness AIDs are not permitted in the list"
    term: "Witness List"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(witnesses=st.lists(witness_aid_strategy(), min_size=1, max_size=10))
        def test_witness_no_duplicates(witnesses):
            config = build_witness_config(list(set(witnesses)), toad=0)
            assert len(config.witnesses) == len(set(config.witnesses))
    strategy: "st.lists(witness_aid_strategy())"
    notes: "Witness list enforces uniqueness."

  - invariant: "Removals (br) are applied before additions (ba) during rotation"
    term: "Witness List"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(initial=st.lists(witness_aid_strategy(), min_size=2, max_size=6, unique=True))
        def test_br_before_ba(initial):
            removed = initial[0]
            # Add back the same AID — only valid if removal happens first
            config = build_witness_config(initial, toad=1)
            new_config = apply_witness_changes(config, removals=[removed], additions=[removed])
            # removed is back in the list (removed first, then re-added)
            assert removed in new_config.witnesses
    strategy: "st.lists(witness_aid_strategy(), 2..6, unique=True)"
    notes: "Order matters: removing then adding the same AID is valid."

contracts:
  - port_ref: "port://keri/key-state/thresholds/inbound/threshold-satisfaction"
    preconditions:
      - formal:
          language: python
          expression: "lambda threshold, indices: threshold is not None and isinstance(indices, list)"
        description: "Threshold and indices must be provided"
      - formal:
          language: python
          expression: "lambda sith: sith is not None and (isinstance(sith, (int, str)) or isinstance(sith, list))"
        description: "parse_threshold accepts int, str, or list of fraction strings"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda threshold, indices, result: (
                (not threshold.weighted and result == (len(indices) >= threshold.num)) or
                (threshold.weighted and result == (sum(threshold.weights[i] for i in indices) >= 1))
            )
        description: "satisfy returns True iff indices meet the threshold criterion"
      - formal:
          language: python
          expression: "lambda sith, result: result is not None and hasattr(result, 'satisfy')"
        description: "parse_threshold returns a valid Tholder with satisfy() method"

  - port_ref: "port://keri/key-state/thresholds/inbound/dual-threshold"
    preconditions:
      - formal:
          language: python
          expression: |
            lambda signing_threshold, rotation_threshold, indices, ondices: (
                signing_threshold is not None and rotation_threshold is not None
            )
        description: "Both thresholds must be provided"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda st, rt, indices, ondices, result: (
                result.is_ok() == (st.satisfy(indices) and rt.satisfy(ondices))
            ) or result.is_err()
        description: "Dual threshold passes iff both independently satisfied"

  - port_ref: "port://keri/key-state/thresholds/inbound/witness-configuration"
    preconditions:
      - formal:
          language: python
          expression: "lambda witnesses, toad: toad >= 0 and toad <= len(witnesses)"
        description: "TOAD must be in range [0, len(witnesses)]"
      - formal:
          language: python
          expression: "lambda current, removals, additions: all(r in current.witnesses for r in removals)"
        description: "All removals must be in current witness list"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda witnesses, toad, config: (
                config.witnesses == witnesses and config.toad == toad
            )
        description: "build_witness_config returns config with provided witnesses and toad"
      - formal:
          language: python
          expression: |
            lambda current, removals, additions, new_toad, result: (
                all(r not in result.witnesses for r in removals) and
                all(a in result.witnesses for a in additions)
            )
        description: "apply_witness_changes removes br and adds ba"

state_machines: []
