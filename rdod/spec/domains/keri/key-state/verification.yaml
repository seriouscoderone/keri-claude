# verification.yaml
domain_ref: "keri/key-state"

properties:
  - invariant: "Deterministically computed from the KEL up to the latest establishment event"
    term: "Key State"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy())
        def test_key_state_deterministic(kel):
            state1 = compute_key_state(kel)
            state2 = compute_key_state(kel)
            assert state1 == state2
    strategy: "kel_strategy() generates valid KELs with mixed event types"
    notes: "Determinism is the foundational invariant of key state."

  - invariant: "Only establishment events (icp, rot, dip, drt) modify key state"
    term: "Key State"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_with_ixn_strategy())
        def test_ixn_does_not_change_key_state(kel):
            # Find state before and after each ixn
            for i, event in enumerate(kel.events):
                if event.t == 'ixn':
                    state_before = compute_key_state(kel.prefix(i))
                    state_after = compute_key_state(kel.prefix(i + 1))
                    assert state_before.signing_keys == state_after.signing_keys
                    assert state_before.next_digests == state_after.next_digests
                    assert state_before.signing_threshold == state_after.signing_threshold
                    assert state_before.witnesses == state_after.witnesses
    strategy: "kel_with_ixn_strategy() generates KELs containing interaction events"
    notes: "Interaction events advance sn but never touch key state fields."

  - invariant: "Interaction events (ixn) do not alter key state"
    term: "Key State"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(key_state=key_state_strategy(), ixn=interaction_event_strategy())
        def test_ixn_preserves_key_state(key_state, ixn):
            new_state = apply_event(key_state, ixn)
            assert new_state.k == key_state.k
            assert new_state.n == key_state.n
            assert new_state.kt == key_state.kt
            assert new_state.nt == key_state.nt
            assert new_state.b == key_state.b
            assert new_state.bt == key_state.bt
    strategy: "key_state_strategy(), interaction_event_strategy()"
    notes: "Redundant with above but verifies from the state application perspective."

  - invariant: "Includes: signing keys (k), next key digests (n), signing threshold (kt), rotation threshold (nt), witness list (b), witness threshold (bt), configuration traits (c)"
    term: "Key State"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy())
        def test_key_state_completeness(kel):
            state = compute_key_state(kel)
            assert hasattr(state, 'k') and state.k is not None
            assert hasattr(state, 'n') and state.n is not None
            assert hasattr(state, 'kt') and state.kt is not None
            assert hasattr(state, 'nt') and state.nt is not None
            assert hasattr(state, 'b') and state.b is not None
            assert hasattr(state, 'bt') and state.bt is not None
            assert hasattr(state, 'c') and state.c is not None
    strategy: "kel_strategy()"
    notes: "Key state must always be complete — no missing fields."

contracts:
  - port_ref: "port://keri/key-state/inbound/state-computation"
    preconditions:
      - formal:
          language: python
          expression: "lambda kel: len(kel.events) >= 1 and kel.events[0].t in ('icp', 'dip')"
        description: "KEL must have at least one event and start with an inception"
      - formal:
          language: python
          expression: "lambda aid: aid is not None and len(aid) > 0"
        description: "AID must be non-empty for get_current_state"
    postconditions:
      - formal:
          language: python
          expression: "lambda kel, result: result.k == kel.latest_establishment().k"
        description: "Computed key state signing keys match latest establishment event"
      - formal:
          language: python
          expression: "lambda result: len(result.k) >= 1"
        description: "Key state always has at least one signing key"

  - port_ref: "port://keri/key-state/inbound/state-query"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid: aid is not None"
        description: "AID must be provided"
    postconditions:
      - formal:
          language: python
          expression: "lambda aid, keys: all(is_qualified_pubkey(k) for k in keys)"
        description: "get_signing_keys returns qualified public keys"
      - formal:
          language: python
          expression: "lambda aid, digests: all(is_qualified_digest(d) for d in digests)"
        description: "get_next_digests returns qualified digests"
      - formal:
          language: python
          expression: "lambda aid, thresholds: thresholds['signing'] is not None and thresholds['rotation'] is not None"
        description: "get_thresholds returns both signing and rotation thresholds"

  - port_ref: "port://keri/key-state/inbound/pre-rotation-validation"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid, proposed_keys: len(proposed_keys) >= 1"
        description: "At least one proposed key for rotation"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda aid, proposed_keys, result: (
                result.is_ok() and all(
                    digest(k) in get_prior_next_digests(aid) for k in result.matched_keys()
                )
            ) or result.is_err()
        description: "If validation succeeds, all matched keys correspond to pre-committed digests"

state_machines: []
