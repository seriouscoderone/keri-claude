# ports.yaml
domain_ref: "keri/key-state"

ports:
  # Inbound — what clients call
  - id: "port://keri/key-state/inbound/state-computation"
    type: inbound
    name: "State Computation"
    contract: "compute_key_state(kel: KEL) -> KeyState; get_current_state(aid: AID) -> KeyState; verify_signatures(aid: AID, event: Event, signatures: [Signature]) -> Result<bool, ValidationError>"
    protocol: "method-call"
    refs: ["domain://keri"]

  - id: "port://keri/key-state/inbound/state-query"
    type: inbound
    name: "State Query"
    contract: "get_signing_keys(aid: AID) -> [PublicKey]; get_next_digests(aid: AID) -> [Digest]; get_witness_set(aid: AID) -> [WitnessAID]; get_thresholds(aid: AID) -> {signing: Threshold, rotation: Threshold, witness: int}"
    protocol: "method-call"
    refs: ["domain://keri", "domain://agent"]

  - id: "port://keri/key-state/inbound/pre-rotation-validation"
    type: inbound
    name: "Pre-rotation Validation"
    contract: "validate_rotation_keys(aid: AID, proposed_keys: [PublicKey]) -> Result<bool, PreRotationError>; check_dual_threshold(aid: AID, signatures: [Signature]) -> Result<bool, ThresholdError>"
    protocol: "method-call"
    refs: ["domain://keri"]
