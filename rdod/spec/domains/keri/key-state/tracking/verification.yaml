# verification.yaml
domain_ref: "keri/key-state/tracking"

properties:
  # Key Event Verifier invariants
  - invariant: "Exactly one instance per AID being tracked — keyed by the AID prefix"
    term: "Key Event Verifier"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(aid=aid_strategy(), events=st.lists(key_event_strategy(), min_size=1, max_size=5))
        def test_one_kever_per_aid(aid, events):
            kevers = {}
            for event in events:
                event.i = aid  # all events for same AID
                if aid not in kevers:
                    kevers[aid] = KeyEventVerifier(event)
            assert len([k for k in kevers if k == aid]) == 1
    strategy: "aid_strategy() + key_event_strategy()"
    notes: "Map keyed by prefix — exactly one Kever per AID."

  - invariant: "State is updated only by establishment events (icp, rot, dip, drt)"
    term: "Key Event Verifier"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kever=kever_strategy(), ixn=interaction_event_strategy())
        def test_ixn_does_not_update_state(kever, ixn):
            state_before = snapshot(kever)
            kever.update(ixn)
            assert kever.verfers == state_before.verfers
            assert kever.ndigers == state_before.ndigers
            assert kever.tholder == state_before.tholder
            assert kever.ntholder == state_before.ntholder
            assert kever.wits == state_before.wits
            assert kever.toader == state_before.toader
    strategy: "kever_strategy(), interaction_event_strategy()"
    notes: "Interaction events advance sn but never touch key state fields."

  - invariant: "Interaction events (ixn) advance the sequence number and serder but do NOT modify key state fields"
    term: "Key Event Verifier"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kever=kever_strategy(), ixn=interaction_event_strategy())
        def test_ixn_advances_sn(kever, ixn):
            sn_before = kever.sn
            kever.update(ixn)
            assert kever.sn == sn_before + 1
    strategy: "kever_strategy(), interaction_event_strategy()"
    notes: "sn advances by 1 on every event including ixn."

  - invariant: "State is deterministic — the same KEL prefix always produces the same Key Event Verifier state"
    term: "Key Event Verifier"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy())
        def test_kever_deterministic(kel):
            kever1 = replay_kel(kel)
            kever2 = replay_kel(kel)
            assert kever1.verfers == kever2.verfers
            assert kever1.ndigers == kever2.ndigers
            assert kever1.tholder == kever2.tholder
            assert kever1.wits == kever2.wits
            assert kever1.lastEst == kever2.lastEst
    strategy: "kel_strategy()"
    notes: "Determinism is mandatory — same input, same output."

  - invariant: "Can be initialized in two ways: from a raw inception event (incept) or from a cached state record (reload)"
    term: "Key Event Verifier"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy())
        def test_kever_two_init_paths(kel):
            # Path 1: replay from inception
            kever_replay = replay_kel(kel)
            # Path 2: reload from cache
            ksr = build_key_state_record(kever_replay)
            kever_reload = reload_kever(ksr)
            assert kever_replay.verfers == kever_reload.verfers
            assert kever_replay.ndigers == kever_reload.ndigers
    strategy: "kel_strategy()"
    notes: "Both initialization paths must produce equivalent state."

  # Last Establishment Data invariants
  - invariant: "Updated each time an establishment event (icp, rot, dip, drt) is processed by the state machine"
    term: "Last Establishment Data"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_with_rotation_strategy())
        def test_last_est_updated_at_establishment(kel):
            kever = None
            for event in kel.events:
                if event.t in ('icp', 'dip'):
                    kever = KeyEventVerifier(event)
                    assert kever.lastEst.s == 0
                elif event.t in ('rot', 'drt'):
                    kever.update(event)
                    assert kever.lastEst.s == event.sn
                    assert kever.lastEst.d == event.said
    strategy: "kel_with_rotation_strategy()"
    notes: "lastEst tracks the most recent establishment event."

  - invariant: "At inception: lastEst.s = 0, lastEst.d = inception event SAID, br = [], ba = []"
    term: "Last Establishment Data"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(icp=inception_event_strategy())
        def test_last_est_at_inception(icp):
            kever = KeyEventVerifier(icp)
            assert kever.lastEst.s == 0
            assert kever.lastEst.d == icp.said
    strategy: "inception_event_strategy()"
    notes: "Initial lastEst from inception."

  - invariant: "A rotation at sn <= lastEst.s is stale and rejected (for rot; drt allows sn == lastEst.s for recovery)"
    term: "Last Establishment Data"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        sn, lastEst_s = Ints('sn lastEst_s')
        ilk = String('ilk')
        is_stale = Bool('is_stale')
        s = Solver()
        # For rot: stale iff sn <= lastEst.s
        s.add(ilk == StringVal('rot'))
        s.add(is_stale == (sn <= lastEst_s))
        s.add(sn <= lastEst_s)
        s.add(Not(is_stale))
        assert s.check() == unsat  # rot at sn <= lastEst.s is always stale
    notes: "SMT proves staleness detection for rot events."

  # State Reconstruction invariants
  - invariant: "Replaying the same KEL always produces the same key state (deterministic)"
    term: "State Reconstruction"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy())
        def test_reconstruction_deterministic(kel):
            state1 = reconstruct_state(kel)
            state2 = reconstruct_state(kel)
            assert state1 == state2
    strategy: "kel_strategy()"
    notes: "Same KEL always yields same state."

  - invariant: "Only establishment events in the replay modify the resulting key state; interaction events are applied for hash-chain continuity but leave key state unchanged"
    term: "State Reconstruction"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_with_ixn_strategy())
        def test_reconstruction_only_establishment_modifies(kel):
            state_full = reconstruct_state(kel)
            state_est_only = reconstruct_state_est_only(kel)
            assert state_full.signing_keys == state_est_only.signing_keys
            assert state_full.next_digests == state_est_only.next_digests
            assert state_full.witnesses == state_est_only.witnesses
    strategy: "kel_with_ixn_strategy()"
    notes: "Replaying only establishment events yields the same key state."

  - invariant: "Any validator can independently reconstruct key state from a KEL copy without trusting cached state"
    term: "State Reconstruction"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy())
        def test_independent_reconstruction(kel):
            # Two independent validators with the same KEL
            state_v1 = reconstruct_state(kel)
            state_v2 = reconstruct_state(kel)
            assert state_v1 == state_v2
    strategy: "kel_strategy()"
    notes: "No trusted third party needed — anyone with the KEL can verify."

  # Establishment Subsequence invariants
  - invariant: "First event is always an inception (icp or dip)"
    term: "Establishment Subsequence"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy())
        def test_first_event_is_inception(kel):
            assert kel.events[0].t in ('icp', 'dip')
    strategy: "kel_strategy()"
    notes: "Every KEL must start with inception."

  - invariant: "Key state at any point is fully determined by the establishment subsequence up to that point"
    term: "Establishment Subsequence"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy())
        def test_state_from_establishment_subsequence(kel):
            est_subseq = [e for e in kel.events if e.t in ('icp', 'rot', 'dip', 'drt')]
            state_full = compute_key_state(kel)
            state_est = compute_key_state_from_events(est_subseq)
            assert state_full.signing_keys == state_est.signing_keys
    strategy: "kel_strategy()"
    notes: "Establishment subsequence alone determines key state."

  # Configuration Traits invariants
  - invariant: "EstOnly (EO): only establishment events allowed — interaction events are rejected by the state machine"
    term: "Configuration Traits"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=est_only_kel_strategy(), ixn=interaction_event_strategy())
        def test_est_only_rejects_ixn(kel, ixn):
            kever = replay_kel(kel)
            assert kever.estOnly
            result = kever.validate(ixn)
            assert result.is_err()
    strategy: "est_only_kel_strategy() generates KELs with EO config trait"
    notes: "EstOnly trait makes ixn structurally invalid."

  - invariant: "Traits are cumulative and irreversible — once set, they cannot be removed by subsequent establishment events"
    term: "Configuration Traits"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_with_traits_strategy())
        def test_traits_cumulative_irreversible(kel):
            active_traits = set()
            for event in kel.events:
                if event.t in ('icp', 'rot', 'dip', 'drt'):
                    if hasattr(event, 'c'):
                        active_traits.update(event.c)
            kever = replay_kel(kel)
            assert set(kever.config_traits) == active_traits
    strategy: "kel_with_traits_strategy()"
    notes: "Traits only accumulate — never removed."

  # Incremental State Update invariants
  - invariant: "The update is atomic — either all state fields change or none do (validation failure raises an error)"
    term: "Incremental State Update"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kever=kever_strategy(), bad_rot=invalid_rotation_strategy())
        def test_update_atomic_on_failure(kever, bad_rot):
            state_before = snapshot(kever)
            try:
                kever.update(bad_rot)
                assert False, "Should have raised"
            except ValidationError:
                assert kever.verfers == state_before.verfers
                assert kever.ndigers == state_before.ndigers
                assert kever.tholder == state_before.tholder
                assert kever.wits == state_before.wits
    strategy: "kever_strategy(), invalid_rotation_strategy()"
    notes: "Failed updates leave state unchanged — atomicity guarantee."

  # Stale Event invariants
  - invariant: "For rot: sn <= lastEst.s is stale and rejected"
    term: "Stale Event"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        rot_sn, lastEst_s = Ints('rot_sn lastEst_s')
        is_stale = Bool('is_stale')
        s = Solver()
        s.add(is_stale == (rot_sn <= lastEst_s))
        # If rot_sn <= lastEst_s, must be stale
        s.add(rot_sn <= lastEst_s, Not(is_stale))
        assert s.check() == unsat
    notes: "Stale rot detection is a boundary condition."

  - invariant: "For drt: sn < lastEst.s is stale and rejected (sn == lastEst.s is a valid recovery)"
    term: "Stale Event"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        drt_sn, lastEst_s = Ints('drt_sn lastEst_s')
        is_stale = Bool('is_stale')
        is_recovery = Bool('is_recovery')
        s = Solver()
        s.add(is_stale == (drt_sn < lastEst_s))
        s.add(is_recovery == (drt_sn == lastEst_s))
        # drt at sn < lastEst.s is stale
        s.add(drt_sn < lastEst_s, Not(is_stale))
        assert s.check() == unsat
        # drt at sn == lastEst.s is a valid recovery, not stale
        s2 = Solver()
        s2.add(is_stale == (drt_sn < lastEst_s))
        s2.add(is_recovery == (drt_sn == lastEst_s))
        s2.add(drt_sn == lastEst_s, is_stale)
        assert s2.check() == unsat
    notes: "drt has different staleness rule — sn == lastEst.s is recovery, not stale."

  - invariant: "Recovery rotation (rot): sn > lastEst.s but sn <= current sn — allowed only if the current event at that sn is an ixn"
    term: "Stale Event"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_with_ixn_after_establishment_strategy())
        def test_recovery_supersedes_ixn_only(kel):
            kever = replay_kel(kel)
            # Find an ixn that can be superseded
            for event in kel.events:
                if event.t == 'ixn' and event.sn > kever.lastEst.s:
                    rot = build_recovery_rotation(kel.aid, sn=event.sn)
                    result = kever.validate(rot)
                    # Recovery is allowed because superseded event is ixn
                    assert not result.is_stale()
    strategy: "kel_with_ixn_after_establishment_strategy()"
    notes: "Recovery rotations can only supersede interaction events."

contracts:
  - port_ref: "port://keri/key-state/tracking/inbound/state-tracking"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid, inception: inception.t in ('icp', 'dip') and inception.sn == 0"
        description: "create_kever requires an inception event at sn=0"
      - formal:
          language: python
          expression: "lambda aid, event, sigs: len(sigs) >= 1"
        description: "update_kever requires at least one signature"
    postconditions:
      - formal:
          language: python
          expression: "lambda aid, inception, kever: kever.aid == aid and kever.sn == 0"
        description: "create_kever returns a Kever at sn=0 for the AID"
      - formal:
          language: python
          expression: |
            lambda aid, event, sigs, result: (
                result.is_ok() and result.value().sn == event.sn
            ) or result.is_err()
        description: "update_kever advances to event's sn on success"

  - port_ref: "port://keri/key-state/tracking/inbound/state-reconstruction"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid: aid is not None"
        description: "AID must be provided"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda aid, target_sn, result: (
                result.is_ok() and result.value().sn <= target_sn
            ) or result.is_err()
        description: "Reconstructed state is at or before the target sn"

  - port_ref: "port://keri/key-state/tracking/inbound/state-query"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid: aid is not None"
        description: "AID must be provided"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda aid, result: result is None or result.s >= 0
        description: "get_last_establishment returns None or valid establishment data"

  - port_ref: "port://keri/key-state/tracking/outbound/persistence"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid: aid is not None"
        description: "AID must be provided for all persistence operations"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda aid, state, store: store.get_cached_state(aid) == state
        description: "put_cached_state followed by get_cached_state returns the same record"

state_machines:
  - name: "Kever Lifecycle"
    term: "Key Event Verifier"
    states:
      - "uninitialized"
      - "active"
      - "est_only"
      - "non_transferable"
    transitions:
      - from: "uninitialized"
        to: "active"
        trigger: "inception event (icp) processed"
        guard: "event.t == 'icp' and event.sn == 0 and len(event.n) > 0"
      - from: "uninitialized"
        to: "non_transferable"
        trigger: "non-transferable inception (icp with n=[]) processed"
        guard: "event.t == 'icp' and event.sn == 0 and event.n == []"
      - from: "uninitialized"
        to: "active"
        trigger: "delegated inception (dip) processed"
        guard: "event.t == 'dip' and event.sn == 0 and event.di is not None"
      - from: "active"
        to: "active"
        trigger: "rotation event (rot/drt) processed"
        guard: "event.t in ('rot', 'drt') and event.sn > lastEst.s and dual_threshold_satisfied(event) and pre_rotation_valid(event) and len(event.n) > 0"
      - from: "active"
        to: "active"
        trigger: "interaction event (ixn) processed"
        guard: "event.t == 'ixn' and event.sn == expected_sn and not estOnly"
      - from: "active"
        to: "est_only"
        trigger: "establishment event with EO trait"
        guard: "event.t in ('rot', 'drt') and 'EO' in event.c"
      - from: "active"
        to: "non_transferable"
        trigger: "rotation with empty next digests"
        guard: "event.t in ('rot', 'drt') and event.n == []"
      - from: "est_only"
        to: "est_only"
        trigger: "rotation event processed (ixn rejected)"
        guard: "event.t in ('rot', 'drt') and event.sn > lastEst.s and len(event.n) > 0"
      - from: "est_only"
        to: "non_transferable"
        trigger: "rotation with empty next digests"
        guard: "event.t in ('rot', 'drt') and event.n == []"
    invariants:
      - "In 'active' state: verfers, ndigers, tholder, ntholder, wits, toader are all set"
      - "In 'non_transferable' state: no further rotations are possible (n == [])"
      - "In 'est_only' state: interaction events are rejected"
      - "sn is monotonically increasing across all transitions"
      - "lastEst is updated only on establishment event transitions"
      - "Configuration traits only accumulate — transitions never remove traits"
    initial_state: "uninitialized"
    terminal_states: ["non_transferable"]
