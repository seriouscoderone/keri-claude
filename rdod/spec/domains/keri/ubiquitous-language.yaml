# ubiquitous-language.yaml
domain_ref: "keri"

terms:
  - term: "AID"
    synonyms: ["Autonomic Identifier", "SCID", "Self-Certifying Identifier"]
    definition: "A self-certifying identifier cryptographically bound to a key pair at inception. Persistent across key rotations. Universally unique without registration."
    invariants:
      - "Derived from ≥128 bits of pseudo-random cryptographic entropy"
      - "Exactly one authoritative KEL per AID"
      - "AID prefix is either the public key itself (basic) or a digest of the inception event (self-addressing)"
    examples:
      - "Basic prefix: raw Ed25519 public key qualified with 'D' code"
      - "Self-addressing prefix: Blake3-256 digest of inception event qualified with 'E' code"
    related_terms: ["Controller", "KEL", "Key State", "Inception Event"]

  - term: "Controller"
    synonyms: []
    definition: "The entity holding private keys for an AID and authorized to generate signed key events."
    invariants:
      - "Only the controller can produce valid signatures over key events"
      - "Control authority is defined by the current key state"
      - "A controller may manage multiple AIDs"
    examples:
      - "A person holding a hardware wallet with Ed25519 private keys"
      - "A software agent holding keys in a secure enclave"
    related_terms: ["AID", "Key State", "Key Event", "Signing Authority"]

  - term: "Key Event"
    synonyms: ["Event"]
    definition: "A cryptographically signed, hash-chained record in the KEL. Three types: inception, rotation, interaction."
    invariants:
      - "Signed by keys authorized in the current key state"
      - "Hash-chained to predecessor via prior event digest (p field)"
      - "Sequence number (s field) monotonically increasing, hex-encoded"
      - "Contains SAID (d field) — self-addressing identifier of the event"
    examples:
      - "Inception event (icp): creates AID, establishes initial key state"
      - "Rotation event (rot): changes signing keys, may update witness set"
      - "Interaction event (ixn): anchors data via seals without changing key state"
    related_terms: ["KEL", "Key State", "Establishment Event", "Non-Establishment Event"]

  - term: "Establishment Event"
    synonyms: []
    definition: "A key event that changes key state. Four types: inception (icp), rotation (rot), delegated inception (dip), and delegated rotation (drt). Only establishment events modify signing/rotation authority."
    invariants:
      - "Must include signing keys (k field) and next key digests (n field)"
      - "Must include witness set (b field) and threshold (bt field)"
      - "Delegated variants (dip, drt) additionally include the delegator prefix (di field)"
      - "The establishment subsequence is: icp|dip → (rot|drt* ixn*)* rot|drt*"
    examples:
      - "icp: initial establishment with first key set and witness set"
      - "rot: key rotation with new keys, optionally modified witnesses"
      - "dip: delegated inception — same as icp but references delegator via di field"
      - "drt: delegated rotation — same as rot but requires delegator approval seal"
    related_terms: ["Key Event", "Key State", "Pre-rotation", "Delegation"]

  - term: "KEL"
    synonyms: ["Key Event Log"]
    definition: "The append-only, hash-chained, cryptographically signed event log for a single AID. The authoritative record of an identifier's control history."
    invariants:
      - "Append-only — events cannot be modified or deleted"
      - "Hash-chained — each event includes digest of prior event"
      - "Exactly one authoritative KEL per AID"
      - "Deterministic key state derivable from any KEL prefix"
    examples:
      - "A KEL starting with an inception event followed by rotations and interactions"
    related_terms: ["KERL", "Key Event", "AID", "Key State"]

  - term: "KERL"
    synonyms: ["Key Event Receipt Log"]
    definition: "A KEL augmented with witness receipts — the receipted version used in indirect mode."
    invariants:
      - "Contains all KEL events plus witness receipt signatures"
      - "Receipts must satisfy the accountability threshold (M of N witnesses)"
    examples:
      - "A KERL with 3-of-5 witness receipts on each event"
    related_terms: ["KEL", "Witness", "Receipt", "KAWA"]

  - term: "Key State"
    synonyms: ["Current Key State"]
    definition: "The current authoritative configuration for an AID: signing keys, rotation key digests, thresholds, witness set, and configuration traits."
    invariants:
      - "Deterministically computed from the KEL up to the latest establishment event"
      - "Only establishment events modify key state"
      - "Includes: signing keys (k), next key digests (n), signing threshold (kt), rotation threshold (nt), witness list (b), witness threshold (bt)"
    examples:
      - "Key state after inception: initial keys, initial witnesses, initial thresholds"
      - "Key state after rotation: new signing keys, new next-key commitments"
    related_terms: ["Establishment Event", "Pre-rotation", "Threshold"]

  - term: "Pre-rotation"
    synonyms: ["Pre-rotation Commitment"]
    definition: "The practice of publishing a digest of the next rotation keys in the current establishment event, before those keys are ever used."
    invariants:
      - "Next key digests (n field) must appear in the establishment event preceding rotation"
      - "Provides post-quantum resistance — attacker must compromise both current keys and pre-committed keys"
      - "Pre-committed keys are never exposed until rotation"
    examples:
      - "Inception event commits to first rotation keys via n field"
      - "Each rotation commits to subsequent rotation keys"
    related_terms: ["Key State", "Rotation Event", "Establishment Event"]

  - term: "Validator"
    synonyms: []
    definition: "An entity that receives key events and verifies them cryptographically against the KEL. Maintains its own KEL copy."
    invariants:
      - "Verification requires no trusted intermediaries (end-verifiable)"
      - "Validators are responsible for their own duplicity detection via watchers"
    examples:
      - "A verifier checking an AID's current key state before accepting a signed message"
    related_terms: ["Controller", "Watcher", "Duplicity"]

  - term: "Witness"
    synonyms: []
    definition: "An entity designated by the controller to receipt key events, providing availability and consistency via the first-seen rule."
    invariants:
      - "Designated by controller in establishment events (b field)"
      - "Receipts constitute a first-seen guarantee"
      - "Witnesses are accountable — duplicitous witnessing is detectable"
    examples:
      - "A witness pool of 5 nodes, 3-of-5 threshold for accountability"
    related_terms: ["KAWA", "Receipt", "KERL", "Accountability Threshold"]

  - term: "Watcher"
    synonyms: []
    definition: "An entity under the validator's control that monitors for duplicity by collecting and comparing KEL copies from multiple sources."
    invariants:
      - "Under validator's control, NOT the controller's"
      - "Watches for inconsistent event histories (duplicity evidence)"
    examples:
      - "A watcher polling multiple witnesses to compare their KERL copies"
    related_terms: ["Duplicity", "Validator", "Judge", "Juror"]

  - term: "Seal"
    synonyms: ["Anchor"]
    definition: "A cryptographic digest embedded in an interaction or rotation event that binds external data to the KEL without disclosing the data."
    invariants:
      - "Commits to external data via digest — the data itself is not in the KEL"
      - "Types: digest seal, merkle tree root seal, event seal, event location seal"
    examples:
      - "An interaction event containing a digest seal anchoring an ACDC credential"
    related_terms: ["Interaction Event", "Digest"]

  - term: "Threshold"
    synonyms: ["Signing Threshold", "Rotation Threshold"]
    definition: "The M-of-N requirement for key agreement. Signing threshold (kt) for signatures; rotation threshold (nt) for rotation authorization."
    invariants:
      - "Signing threshold must be satisfied for any valid event signature"
      - "Rotation threshold must be satisfied to authorize a rotation"
      - "Can be simple (integer) or fractionally weighted"
    examples:
      - "Simple: 2-of-3 multi-sig"
      - "Weighted: fractional threshold with different key weights"
    related_terms: ["Key State", "Multi-sig"]

  - term: "Version String"
    synonyms: []
    specializes: "domain://cesr"
    definition: "Protocol version metadata in the v field of every event: protocol, version, serialization kind, size."
    invariants:
      - "Format: PPPPVVVKKKKSSSS_ (protocol, version, kind, size, terminator)"
      - "Provides regex target for cold-start stream detection"
    examples:
      - "KERI10JSON00011c_ — KERI v1.0, JSON serialization, 284 bytes"
    related_terms: ["CESR"]

  # Habitat (Hab/Habery) — moved to domain://local-agent (application-tier concept, not protocol)

  - term: "Event Database"
    synonyms: ["Baser"]
    definition: "Persistent storage for KELs, escrows, receipts, key state, and application data. Organized as named subdatabases (event store, KEL index, signature store, witness signature store, receipt store, etc. [.evts, .kels, .sigs, .wigs, .rcts in keripy])."
    invariants:
      - "Provides append-only semantics for KEL events"
      - "Supports indexed access by prefix, sequence number, digest, and first-seen number"
      - "Named subdatabases partition events, signatures, receipts, and escrow queues"
    examples:
      - "LMDB-based Baser in keripy with subdatabases: .evts (events by prefix+digest), .kels (KEL index), .sigs (controller signatures)"
      - "DynamoDB-based storage in serious-keri with equivalent partitioning"
    related_terms: ["KEL", "Habitat", "KEL Storage Schema"]

  - term: "Event Processor"
    synonyms: ["Kevery"]
    definition: "The event validation and acceptance pipeline. Processes incoming events against current key state, manages escrow queues, and emits cues for receipting and notification. Operates in lax (promiscuous) or strict mode and tracks local vs remote event sources."
    invariants:
      - "Validates event signatures against current key state before acceptance"
      - "Escrows events that cannot yet be validated (out-of-order, partially signed, partially witnessed)"
      - "Emits cues (notifications) for receipting and downstream processing"
      - "Distinguishes local (trusted) from remote (untrusted) event sources"
    examples:
      - "A Kevery in lax mode accepting any well-formed event regardless of witness receipts"
      - "A Kevery in strict mode requiring witness threshold before accepting an event"
    related_terms: ["Key Event Verifier", "Escrow Architecture", "Event Database", "Message Parser"]

  - term: "Message Parser"
    synonyms: ["Parser"]
    definition: "CESR message stream processor that reads serialized messages from a byte stream and dispatches each parsed message to the appropriate protocol handler: Event Processor (KEL events), TEL processor, exchange handler, or reply handler."
    invariants:
      - "Detects message boundaries using version string regex (cold-start capable)"
      - "Dispatches by message type (ilk) to the correct handler"
      - "Processes attached signatures, witness receipts, and other groups following each message"
    examples:
      - "Parser reading a TCP stream, detecting 'KERI10JSON...' version strings, and dispatching icp/rot/ixn to Kevery"
    related_terms: ["Event Processor", "Version String", "CESR"]

  - term: "Escrow Architecture"
    synonyms: []
    definition: "Cross-cutting pattern where events that cannot be immediately validated are held in typed escrow queues with timeouts. Escrows are periodically drained by processing loops that re-attempt validation as new information arrives."
    invariants:
      - "Escrow types include: out-of-order, partially-signed, partially-witnessed, partially-delegated, unverified receipts, likely duplicitous"
      - "Each escrow type has a configurable timeout (default: 3600s for most types, 1200s for out-of-order)"
      - "Escrow processing is idempotent — re-processing an escrowed event either promotes it to the KEL or leaves it escrowed"
      - "Timed-out escrow entries are pruned during processing sweeps"
    examples:
      - "An event at sn=5 arrives before sn=4 — escrowed as out-of-order until sn=4 is received"
      - "A multi-sig event with 1 of 3 required signatures — escrowed as partially-signed until remaining signatures arrive"
    related_terms: ["Event Processor", "Event Database", "Witness Threshold"]

  - term: "Direct Mode"
    synonyms: ["Direct Exchange"]
    definition: "Operational mode where the controller sends events directly to the validator without witness involvement. The validator verifies events using only the controller's signatures and the self-certifying properties of the KEL. Simpler but provides no availability or consistency guarantees beyond the pair-wise relationship."
    invariants:
      - "No witnesses required — the controller's signatures are sufficient"
      - "Suitable for one-to-one relationships with direct communication"
      - "The validator maintains its own KEL copy received directly from the controller"
    examples:
      - "Two agents communicating directly over a private channel — each verifies the other's KEL without witnesses"
    related_terms: ["Indirect Mode", "Validator", "Controller"]

  - term: "Indirect Mode"
    synonyms: ["Indirect Exchange"]
    definition: "Operational mode where events are disseminated via witnesses who receipt them under the first-seen rule (KAWA). Provides availability, consistency, and duplicity accountability. Required for one-to-any relationships where multiple validators need access to the same KEL."
    invariants:
      - "Events must be receipted by witnesses satisfying the accountability threshold (TOAD)"
      - "Witnesses provide the KERL (receipted KEL) to validators"
      - "Duplicity is detectable — a witness receipting two different events at the same sn is accountable"
      - "Watchers (under validator control) monitor for duplicity across witnesses"
    examples:
      - "A public AID with 5 witnesses and TOAD of 3 — any validator can fetch the KERL from witnesses"
    related_terms: ["Direct Mode", "Witness", "KAWA", "Watcher", "TOAD"]

  - term: "KERI Message Types"
    synonyms: ["Ilks", "Protocol Messages"]
    definition: "The complete set of KERI protocol message types, identified by the 't' (type/ilk) field. Organized into key events, receipts, queries/replies, and exchanges. Each type is dispatched to the appropriate handler by the Message Parser."
    invariants:
      - "Key Events (→ Event Processor): icp (inception), rot (rotation), ixn (interaction), dip (delegated inception), drt (delegated rotation)"
      - "Receipts (→ Witness Agreement): rct (non-transferable receipt), vrc (transferable receipt)"
      - "Queries & Replies (→ query handler): qry (query), rpy (reply), pro (prod/probe), bar (bare reply)"
      - "Exchanges (→ Exchanger): exn (exchange message — carries IPEX, multi-sig coordination, challenge-response), xip (exchange inception — first message in a multi-exchange transaction set, all subsequent exn messages reference the xip SAID)"
      - "TEL Events (→ TEL Processor): vcp (registry inception), vrt (registry rotation), iss (issuance), rev (revocation), bis (backed issuance), brv (backed revocation), rip (TEL registry inception), bup (blindable update), upd (public update)"
      - "ACDC Types (→ ACDC Processor): acm (ACDC field map — default labeled message type), act (ACDC fixed field with attribute section — CESR native), acg (ACDC fixed field with aggregate section — CESR native), ace (ACDC with extra fields — experimental), sch (schema)"
      - "The ilk field determines which processing pipeline handles the message"
    examples:
      - "t='icp' → Kevery.processEvent()"
      - "t='rct' → Kevery.processReceipt()"
      - "t='exn' → Exchanger.processEvent() (routes by inner 'r' field to IPEX, multisig, etc.)"
      - "t='iss' → Tevery.processEvent()"
    related_terms: ["Message Parser", "Event Processor", "Key Event", "Witness", "IPEX"]

  - term: "Exchange Message (exn)"
    definition: "Generic routed message envelope for peer-to-peer communication between KERI controllers. Any domain can communicate by constructing an exn with a route field and registering a handler for inbound routes via the Exchanger. The exn message type is the standard carrier for IPEX credential exchange, multisig coordination, endpoint authorization, and any future peer protocol."
    invariants:
      - "Route (r) field determines which domain protocol handles the message"
      - "Known route prefixes: /ipex/* (credential exchange), /multisig/* (group coordination), /end/role and /loc/scheme (discovery), /watcher/* (integrity), /ksn (key state), /tsn/* (credential status)"
      - "Every exn is signed by the sender's AID — provides non-repudiable attribution"
      - "Subject to KRAM replay protection before domain dispatch"
      - "Prior (p) field links messages in multi-step conversations"
    examples:
      - "IPEX grant: exn with route=/ipex/grant, payload=credential data, embeds=ACDC+TEL+seal"
      - "Multisig inception: exn with route=/multisig/icp, payload=inception parameters"
      - "Endpoint authorization: exn with route=/end/role, payload=endpoint data"
    related_terms: ["Exchanger", "KRAM"]

  - term: "Exchanger"
    definition: "Generic message router that dispatches inbound exchange (exn) messages to handlers registered by route prefix. Domains register their route handlers at startup. The Exchanger validates message signatures before dispatching to the appropriate handler. Any domain can participate in peer-to-peer communication by registering a route handler."
    invariants:
      - "Routes incoming exn messages to the handler registered for the message's route field"
      - "Validates message signatures before dispatching"
      - "Escrows messages awaiting prerequisites — never silently drops"
      - "Multiple domains can register handlers simultaneously"
    related_terms: ["Exchange Message (exn)"]

  - term: "KERI Field Map"
    definition: "The ordered key-value structure of a KERI message body. Field maps use short field labels (v, t, d, i, s, etc.) for wire efficiency, but each field represents a specific domain concept. The presence or absence of optional fields signals semantic meaning — for example, the di field signals delegation, the n field signals transferability. Implementations SHOULD provide domain-typed construction interfaces that map human-readable concepts to field labels."
    invariants:
      - "Field order is canonical per message type — deviations invalidate the SAID"
      - "Required fields MUST always be present; optional fields signal semantic variation"
      - "The d field is always a SAID (self-addressing identifier) computed over the field map"
      - "The v field is always first — enables protocol and version detection"
      - "The t field identifies the message type (ilk)"
    related_terms: ["SAID", "Identifier Type Dimensions"]

events:
  - name: "InceptionCreated"
    payload: "aid: AID, key_state: KeyState, witnesses: [WitnessAID], config: [Trait]"
    triggers: "Controller creates a new AID by generating an inception event"

  - name: "RotationPerformed"
    payload: "aid: AID, new_keys: [PublicKey], new_next_digests: [Digest], witness_changes: WitnessChange"
    triggers: "Controller rotates keys by generating a rotation event satisfying pre-rotation commitment"

  - name: "InteractionAnchored"
    payload: "aid: AID, seals: [Seal]"
    triggers: "Controller anchors external data to the KEL via an interaction event"

  - name: "EventReceived"
    payload: "aid: AID, event: KeyEvent, source: Endpoint"
    triggers: "Validator receives a key event for processing"

  - name: "KeyStateChanged"
    payload: "aid: AID, previous_state: KeyState, new_state: KeyState"
    triggers: "An establishment event is validated and applied, changing the key state"

  - name: "DuplicityDetected"
    payload: "aid: AID, evidence: [ConflictingEvent]"
    triggers: "Watcher discovers inconsistent event histories for the same AID"

rules:
  - "The KEL is the sole source of truth for an AID's control authority — no external oracle"
  - "Events are processed in strict sequence order — out-of-order events are escrowed"
  - "A rotation can only be performed using keys whose digests were pre-committed in the previous establishment event"
  - "Direct mode: controller sends events directly to validator; no witnesses required"
  - "Indirect mode: events must be receipted by witnesses satisfying the accountability threshold before acceptance"
  - "Recovery from key compromise requires rotation using pre-committed keys — if pre-committed keys are also compromised, recovery is impossible"
  - "Establishment subsequence pattern: icp (rot* ixn*)* rot*"
