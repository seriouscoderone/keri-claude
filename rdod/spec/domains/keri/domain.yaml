# domain.yaml

template_version: "1.0"

id: "keri"

name: "KERI Protocol"

description: >
  How you prove who you are — decentralized key management providing cryptographic identity
  with delegation, accountability through witnesses, and integrity through watchers. Key Event
  Receipt Infrastructure provides self-certifying identifiers, append-only key event logs,
  witness-based consensus, pre-rotation for post-quantum key compromise recovery, and delegated
  hierarchical key management. The central orchestrating domain of the ecosystem.

version: "0.1.0"

source_material:
  - type: document
    reference: "keri-specification.md — KERI protocol specification (ToIP/IETF)"
  - type: document
    reference: "KERI_WP_2.x.web.md — KERI whitepaper v2.x"
  - type: document
    reference: "KERI_Overview.web.md — KERI protocol overview"
  - type: document
    reference: "KERI_SecurityDeepDive.web.md — security analysis"
  - type: document
    reference: "IdentifierTheory_web.md — universal identifier theory"
  - type: document
    reference: "keripy — Python reference implementation (implementation survey)"
  - type: document
    reference: "keriox — Rust production implementation (implementation survey)"

ubiquitous_language:
  - term: "AID"
    definition: "Autonomic Identifier — a self-certifying identifier cryptographically bound to a key pair at inception, persistent across key rotations"
    invariants:
      - "Derived from pseudo-random cryptographic material with ≥128 bits entropy"
      - "Universally unique without any registration authority"
      - "Exactly one authoritative KEL per AID"

  - term: "Controller"
    definition: "Entity holding the private keys for an AID, authorized to create key events"
    invariants:
      - "Only the controller can generate valid signed events"
      - "Control authority is established by the current key state"

  - term: "Key Event"
    definition: "A cryptographically signed record in the KEL — inception, rotation, or interaction"
    invariants:
      - "Every event is signed by keys authorized in the current key state"
      - "Events are hash-chained to their predecessor"
      - "Sequence numbers are monotonically increasing"

  - term: "Key State"
    definition: "The current authoritative signing keys, rotation keys, thresholds, and witness set for an AID"
    invariants:
      - "Computed deterministically from the KEL up to the latest establishment event"
      - "Only establishment events (inception, rotation) change key state"

  - term: "Validator"
    definition: "Entity that receives and cryptographically verifies key events against the KEL"
    invariants:
      - "Validators maintain their own copy of the KEL"
      - "Verification requires no trusted intermediaries (end-verifiable)"

  - term: "Witness"
    definition: "Designated entity that receipts key events under the first-seen rule, providing availability and consistency"
    invariants:
      - "Witnesses are designated by the controller, not self-selected"
      - "A witness's receipt constitutes a first-seen guarantee"

  - term: "Pre-rotation"
    definition: "Cryptographic commitment to the next set of rotation keys, published in the current establishment event"
    invariants:
      - "The digest of next keys must appear in the previous establishment event"
      - "Provides post-quantum resistance — attacker must compromise both current and pre-committed keys"

published_language:
  - term: "AID"
    description: "Autonomic Identifier — the core identity concept used across all domains"
  - term: "KEL"
    description: "Key Event Log — the append-only identity ledger referenced by credential and service domains"
  - term: "Controller"
    description: "Entity controlling an AID — referenced by all domains that authenticate"
  - term: "Witness"
    description: "Designated accountability node — referenced by service and accountability domains"
  - term: "Watcher"
    description: "Designated integrity monitor — referenced by service and integrity domains"
  - term: "Exchange Message (exn)"
    description: "Generic routed message envelope — used by IPEX, multisig coordination, discovery"
  - term: "Exchanger"
    description: "Generic message router — used by any domain registering route handlers"
  - term: "KERI Field Map"
    description: "Canonical ordered field structure — referenced by all message-processing domains"
  - term: "KRAM"
    description: "Replay protection mechanism — used by cloud-agent-service and any message-receiving service"

domain_clients:
  - ref: "domain://local-agent"
    relationship: "Fat wallet applications run the full KERI protocol stack locally"
    via_port: "port://keri/inbound/identifier-lifecycle"
  - ref: "domain://cloud-agent-service"
    relationship: "Cloud agent service runs KERI protocol on behalf of thin wallet controllers"
    via_port: "port://keri/inbound/identifier-lifecycle"
  - ref: "domain://witness-service"
    relationship: "Witness nodes implement the accountability protocol"
    via_port: "port://keri/inbound/event-verification"
  - ref: "domain://watcher-service"
    relationship: "Watcher nodes implement integrity monitoring protocol"
    via_port: "port://keri/inbound/event-verification"

subdomains:
  - ref: "domain://keri/identity"
    relationship: "KERI drives identity creation, key rotation, data anchoring, and key state computation"
    via_port: "port://keri/identity/inbound/identity-management"
  - ref: "domain://keri/delegation"
    relationship: "KERI drives delegated identifier lifecycle"
    via_port: "port://keri/delegation/inbound/delegation-lifecycle"
  - ref: "domain://keri/accountability"
    relationship: "KERI drives witness receipting, consensus, and event dissemination"
    via_port: "port://keri/accountability/inbound/receipting"
  - ref: "domain://keri/integrity"
    relationship: "KERI drives duplicity detection, evidence handling, and superseding recovery"
    via_port: "port://keri/integrity/inbound/monitoring"

kernels:
  - ref: "kernel://cryptographic-algorithms"
    source: "Ed25519 (signing), X25519 (DH), Blake3-256/Blake2b-256/SHA-256 (digests), argon2 (key stretching)"
    relationship: "Cryptographic algorithm types appear directly in KERI key state and event structures — no translation layer"
  - ref: "kernel://cesr"
    source: "domain://cesr"
    relationship: "OHS + Published Language — KERI events are encoded in CESR format; CESR defines the encoding contract"

adjacents:
  - ref: "domain://acdc"
    relationship: "Partnership — ACDC credentials anchor to KERI identifiers for issuer authentication"
    pattern: "Partnership"
    via_port: "port://acdc/inbound/credential-lifecycle"
    is_cross_cutting: false
  - ref: "domain://discovery"
    relationship: "Partnership — OOBIs bootstrap discovery of KERI identifiers and their service endpoints"
    pattern: "Partnership"
    via_port: "port://discovery/inbound/discovery"
    is_cross_cutting: false

externals:
  - name: "Event Persistence"
    abstraction: "Repository"
    ref: "port://keri/outbound/event-store"
    implementation_notes: "Append-only store for KEL events. Implementations: LMDB (keripy), redb (keriox), DynamoDB (serious-keri)"
  - name: "Network Transport"
    abstraction: "Adapter"
    ref: "port://keri/outbound/transport"
    implementation_notes: "Message delivery for events, receipts, and queries. Implementations: HTTP, TCP, WebSocket"

implementation_guidance:
  suggested_type: "package"
  language_affinity: "any"
  notes: >
    Reference implementation is keripy (Python). Production implementations exist in
    Rust (keriox) and TypeScript (signify-ts for edge signing). All implementations
    must use CESR encoding and follow the KERI specification event processing rules.

issues: []

tags: ["protocol", "identity", "decentralized", "key-management"]
