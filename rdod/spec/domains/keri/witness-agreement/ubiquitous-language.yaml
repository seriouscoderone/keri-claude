# ubiquitous-language.yaml
domain_ref: "keri/witness-agreement"

terms:
  - term: "KAWA"
    synonyms: ["KERI's Algorithm for Witness Agreement"]
    definition: "A Byzantine Fault Tolerant agreement algorithm where a controller's designated set of N witnesses provides highly available, consistent promulgation of key events via single-phase agreement under the first-seen rule."
    invariants:
      - "Single-phase agreement — no multi-phase commit required because the controller is the sole source of truth for event ordering"
      - "Scalability: receipt dissemination scales linearly (2*N round-robin) or N*log(N) (gossip)"
      - "The controller designates both the witness set and the accountability threshold"
      - "Provides availability and consistency guarantees comparable to multi-phase BFT but without their latency and cost"
    examples:
      - "A controller with 5 witnesses and threshold 3: each witness receipts the first-seen version of each event"
      - "Round-robin dissemination: controller sends to each witness in turn, collecting and forwarding receipts"
    related_terms: ["Witness", "TOAD"]

  - term: "Witness"
    synonyms: []
    definition: "An entity designated by a controller in establishment events to verify, receipt (sign), store, and optionally disseminate key events. Witnesses enforce the first-seen rule and provide a receipted copy of the KEL (KERL)."
    invariants:
      - "Designated by the controller in the b field of establishment events — not self-selected"
      - "A witness's receipt constitutes a first-seen guarantee for that event"
      - "Witnesses are accountable — duplicitous witnessing (signing conflicting events) is detectable"
      - "A witness should only accept local events from the controller (protected channel)"
      - "A witness should not accept remote (unprotected) events for its controlled AID"
    examples:
      - "A witness node running on dedicated infrastructure, receipting events via HTTP"
      - "A pool of 4 witnesses with threshold 3: ['BGKV6v93...', 'BJfueFAY...', 'BAPv2Mno...', 'BA4PSatf...']"
    related_terms: ["KAWA", "TOAD"]

  - term: "TOAD"
    synonyms: ["Threshold of Accountable Duplicity", "toader [keripy]", "tally [keriox]"]
    definition: "The numeric threshold of witness receipts required before an event is considered fully witnessed. Set per AID in establishment events. Must satisfy: TOAD <= witness_count and TOAD >= ample(witness_count). The name emphasizes that this threshold determines when duplicity becomes accountable."
    invariants:
      - "Set in the bt field of establishment events, alongside the witness list"
      - "Must be less than or equal to the total number of designated witnesses"
      - "Must be at least ample(witness_count), the BFT minimum for the given witness count"
      - "In keripy, the Toader class (coring module) wraps the TOAD value"
      - "In keriox, the tally field on establishment events holds this value"
    examples:
      - "bt='3' with 5 witnesses: 3 receipts required before the event is fully witnessed"
      - "Toader(toad=4) in keripy wrapping bt=4 for a 6-witness configuration"
    related_terms: ["KAWA", "Witness"]

events:
  - name: "WitnessAgreementComplete"
    payload: "aid: AID, sn: int, event_said: SAID, witness_count: int, threshold: int"
    triggers: "KAWA completes — sufficient witness receipts collected, event is fully witnessed"

rules:
  - "KAWA orchestrates consensus (first-seen, quorum), receipting (receipt lifecycle), and dissemination (propagation) via subdomains"
  - "The controller designates both the witness set and the TOAD"
  - "TOAD must be at least the BFT quorum floor (ample) for the given witness count"
