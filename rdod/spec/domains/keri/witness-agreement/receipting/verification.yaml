# verification.yaml
domain_ref: "keri/witness-agreement/receipting"

properties:
  - invariant: "Created by a witness after verifying the controller's signatures and event consistency"
    term: "Receipt"
    technique: property-based
    formal:
      language: python
      expression: "lambda receipt, event: receipt.witness_aid in event.witness_set and receipt.event_said == event.said and event.signatures_verified()"
    strategy: "st.tuples(st.from_type(Receipt), st.from_type(KeyEvent))"
    notes: "A receipt must reference a verified event — no receipts for unverified events"

  - invariant: "Receipt signatures are attached as CESR attachment codes"
    term: "Receipt"
    technique: property-based
    formal:
      language: python
      expression: "lambda receipt: receipt.signature.is_cesr_encoded() and receipt.signature.attachment_code in ['A', 'B', 'C', 'D']"
    strategy: "st.from_type(Receipt)"
    notes: "All receipt signatures must use valid CESR attachment encoding"

  - invariant: "Non-transferable Receipt Couple: (Prefixer, Cigar) — witness AID prefix + unindexed signature"
    term: "Receipt Types"
    technique: property-based
    formal:
      language: python
      expression: "lambda receipt: (receipt.type == 'non_transferable') implies (isinstance(receipt.sig, Cigar) and isinstance(receipt.prefix, Prefixer) and not receipt.prefix.transferable)"
    strategy: "st.from_type(Receipt).filter(lambda r: r.type == 'non_transferable')"
    notes: "Non-transferable receipts must use Cigar (unindexed) signatures and non-transferable AID prefixes"

  - invariant: "Transferable Receipt Quadruple: (Prefixer, Seqner, Saider, Siger) — validator prefix + sn + digest + indexed signature"
    term: "Receipt Types"
    technique: property-based
    formal:
      language: python
      expression: "lambda receipt: (receipt.type == 'transferable') implies (isinstance(receipt.sig, Siger) and hasattr(receipt, 'seqner') and hasattr(receipt, 'saider') and receipt.prefix.transferable)"
    strategy: "st.from_type(Receipt).filter(lambda r: r.type == 'transferable')"
    notes: "Transferable receipts require the full quadruple with indexed signature"

  - invariant: "Default timeout: 3600 seconds — escrowed receipts are pruned after expiry"
    term: "Receipt Escrows"
    technique: smt
    formal:
      language: z3
      expression: "And(timeout == 3600, Implies(age > timeout, pruned == True), Implies(age <= timeout, pruned == False))"
    notes: "Exact boundary verification — ensure no off-by-one in timeout pruning"

  - invariant: "When the missing event arrives, matching escrowed receipts are promoted to verified storage"
    term: "Receipt Escrows"
    technique: property-based
    formal:
      language: python
      expression: "lambda escrow, event: (escrow.aid == event.aid and escrow.sn == event.sn and escrow.event_said == event.said) implies escrow.promotable()"
    strategy: "st.tuples(st.from_type(EscrowedReceipt), st.from_type(KeyEvent))"
    notes: "Matching criteria: same AID, same sn, same SAID — all three must match for promotion"

  - invariant: "Immutable — later messages or receipts cannot change existing entries (append-only)"
    term: "KERL"
    technique: property-based
    formal:
      language: python
      expression: "lambda kerl_before, operation, kerl_after: all(kerl_before[i] == kerl_after[i] for i in range(len(kerl_before)))"
    strategy: "st.tuples(st.from_type(KERL), st.from_type(KERLOperation), st.from_type(KERL))"
    notes: "No existing entry in the KERL may be modified — only append operations are valid"

  - invariant: "Receipts must satisfy the accountability threshold (M of N witnesses) for the event to be considered sufficiently accountable"
    term: "KERL"
    technique: smt
    formal:
      language: z3
      expression: "Implies(accountable == True, receipt_count >= M)"
    notes: "Accountability requires at least M receipts — this is the TOAD constraint on KERLs"

contracts:
  - port_ref: "port://keri/witness-agreement/receipting/inbound/receipt-lifecycle"
    preconditions:
      - formal:
          language: python
          expression: "lambda event, witness_keys: event.signatures_verified() and witness_keys.valid()"
        description: "Event must be verified and witness keys must be valid before receipt creation"
      - formal:
          language: python
          expression: "lambda signer_aid, signer_role: signer_aid is not None and signer_role in ('witness', 'validator')"
        description: "Receipt classification requires a valid signer AID and recognized role"
    postconditions:
      - formal:
          language: python
          expression: "lambda receipt: receipt.signature.verifies() and receipt.event_said is not None"
        description: "Created receipt has a valid signature and references a specific event SAID"
      - formal:
          language: python
          expression: "lambda signer_aid, role, receipt_type: (not signer_aid.transferable and role == 'witness') implies receipt_type == 'non_transferable_couple'"
        description: "Non-transferable witness AIDs produce non-transferable receipt couples"

  - port_ref: "port://keri/witness-agreement/receipting/inbound/kerl-assembly"
    preconditions:
      - formal:
          language: python
          expression: "lambda kerl, receipt: receipt.event_said in [e.said for e in kerl.events]"
        description: "Receipt can only be attached to an event already in the KERL"
    postconditions:
      - formal:
          language: python
          expression: "lambda kerl_before, receipt, kerl_after: len(kerl_after.receipts_for(receipt.event_said)) == len(kerl_before.receipts_for(receipt.event_said)) + 1"
        description: "Attaching a receipt increases the receipt count for that event by exactly one"

  - port_ref: "port://keri/witness-agreement/receipting/outbound/persistence"
    preconditions:
      - formal:
          language: python
          expression: "lambda receipt, db_name: receipt is not None and db_name in ('.rcts', '.vrcs', '.wigs')"
        description: "Receipt must be non-null and db_name must be a valid receipt store"
    postconditions:
      - formal:
          language: python
          expression: "lambda receipt, db_name, result: result.is_ok() implies load_receipts(receipt.aid, receipt.sn, db_name).contains(receipt)"
        description: "After successful store, the receipt is retrievable from the same database"

state_machines:
  - name: "receipt-escrow-lifecycle"
    term: "Receipt Escrows"
    states: ["received", "escrowed", "promoted", "pruned"]
    transitions:
      - from: "received"
        to: "escrowed"
        trigger: "ReceiptEscrowed — receipt arrives for an event not yet in the KEL"
        guard: "No matching event at (aid, sn) in the KEL"
      - from: "escrowed"
        to: "promoted"
        trigger: "EscrowDrained — missing event arrives and matching receipts are promoted"
        guard: "Matching event at (aid, sn, said) now exists in the KEL"
      - from: "escrowed"
        to: "pruned"
        trigger: "Timeout exceeded (3600 seconds)"
        guard: "current_time - escrow_time > 3600"
    invariants:
      - "An escrowed receipt either gets promoted (event arrives) or pruned (timeout) — never stays permanently"
      - "Promotion requires matching AID, sn, and SAID between the escrowed receipt and the arriving event"
      - "Pruned receipts are permanently removed — they cannot be re-escrowed or promoted"
    initial_state: "received"
    terminal_states: ["promoted", "pruned"]
