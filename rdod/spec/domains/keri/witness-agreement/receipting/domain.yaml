# domain.yaml
template_version: "1.0"
id: "keri/witness-agreement/receipting"
name: "Witness Receipting"
description: >
  The receipt lifecycle — receipt creation, receipt types (non-transferable couple, transferable
  quadruple, witness indexed), receipt escrows for premature receipts, the witness receipt
  generator, and the KERL as the receipted KEL. This subdomain owns everything about how
  receipts are produced, typed, escrowed, and attached to events. It does not own the
  consensus rules (first-seen, quorum) or the network propagation of receipts.
version: "0.1.0"

source_material:
  - type: document
    reference: "keri-specification.md — sections: Receipt Message, Receipt Types, KERL, Witness Receipting"
  - type: document
    reference: "KERI_WP_2.x.web.md — sections: KERL, Witness Receipts, Escrows"
  - type: implementation
    reference: "keripy — src/keri/core/eventing.py (Receiptor, Kevery.processEscrowUnverWitness, processEscrowUnverNonTrans, processEscrowUnverTrans), src/keri/core/coring.py (Cigar, Siger), src/keri/app/storing.py (.rcts, .vrcs, .wigs, .uwes, .ures, .vres)"
  - type: implementation
    reference: "keriox — components/witness/src/witness_receipt_generator.rs (WitnessReceiptGenerator), keriox_core/src/processor/notification.rs (KeyEventAdded notification)"

ubiquitous_language:
  - term: "Receipt"
    definition: "A signed acknowledgment by a witness that it has verified and accepted (first-seen) a specific version of an event — message type 'rct'"
    invariants:
      - "Created after verifying controller signatures and event consistency"
      - "Constitutes the witness's first-seen guarantee"
      - "Signatures attached as CESR attachment codes"

  - term: "KERL"
    definition: "Key Event Receipt Log — a KEL augmented with witness receipt signatures, the receipted form of the event log"
    invariants:
      - "Contains all KEL events plus attached witness receipt signatures"
      - "Immutable and append-only"
      - "Made deletion-proof by distribution across the witness set"

domain_clients:
  - ref: "domain://keri/witness-agreement"
    relationship: "Parent orchestrates witness agreement; receipting provides the receipt creation, typing, escrowing, and KERL assembly mechanics"
    via_port: "port://keri/witness-agreement/receipting/inbound/receipt-lifecycle"

subdomains: []

kernels: []

adjacents: []

externals:
  - name: "Persistence"
    abstraction: "Adapter"
    ref: "port://keri/witness-agreement/receipting/outbound/persistence"
    implementation_notes: "Receipt storage across typed databases: .rcts (non-transferable receipt couples), .vrcs (transferable receipt quadruples), .wigs (witness indexed receipts), .uwes (unverified witness escrow), .ures (unverified non-transferable escrow), .vres (unverified transferable escrow)"

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    In keripy, the Receiptor class processes cues from Kevery to generate receipts for
    witnessed events. Receipt escrows are drained by Kevery.processEscrowUnverWitness(),
    processEscrowUnverNonTrans(), and processEscrowUnverTrans(). In keriox, the
    WitnessReceiptGenerator subscribes to KeyEventAdded notifications from the
    NotificationBus and creates non-transferable receipts using the witness's signing keys.
    Receipt type selection depends on the signer's AID type (transferable vs. non-transferable)
    and role (witness vs. validator).

issues: []

tags: ["receipt", "kerl", "escrow", "rct", "witness-receipt", "receipt-types"]
