# verification.yaml
domain_ref: "keri/witness-agreement"

properties:
  - invariant: "Single-phase agreement — no multi-phase commit required because the controller is the sole source of truth for event ordering"
    term: "KAWA"
    technique: property-based
    formal:
      language: python
      expression: "lambda kawa: kawa.phases == 1 and kawa.controller_is_sole_source"
    strategy: "st.builds(KAWA, controller=st.from_type(Controller), witnesses=st.lists(st.from_type(Witness), min_size=1))"
    notes: "Verify that KAWA never enters a multi-phase commit path regardless of witness count or fault configuration"

  - invariant: "Scalability: receipt dissemination scales linearly (2*N round-robin) or N*log(N) (gossip)"
    term: "KAWA"
    technique: property-based
    formal:
      language: python
      expression: "lambda n, strategy: (strategy == 'round_robin' and exchanges <= 2 * n) or (strategy == 'gossip' and exchanges <= n * math.log2(n))"
    strategy: "st.tuples(st.integers(min_value=1, max_value=100), st.sampled_from(['round_robin', 'gossip']))"
    notes: "Measure actual exchange count against the theoretical bounds for each strategy"

  - invariant: "The controller designates both the witness set and the accountability threshold"
    term: "KAWA"
    technique: property-based
    formal:
      language: python
      expression: "lambda est_event: est_event.b is not None and est_event.bt is not None and est_event.controller_signed()"
    strategy: "st.from_type(EstablishmentEvent)"
    notes: "No external party can modify the witness set or threshold"

  - invariant: "Designated by the controller in the b field of establishment events — not self-selected"
    term: "Witness"
    technique: property-based
    formal:
      language: python
      expression: "lambda witness, est_event: witness.aid in est_event.b and est_event.signed_by_controller()"
    strategy: "st.tuples(st.from_type(Witness), st.from_type(EstablishmentEvent))"
    notes: "A witness cannot appear in the witness set without the controller's signed establishment event"

  - invariant: "A witness's receipt constitutes a first-seen guarantee for that event"
    term: "Witness"
    technique: property-based
    formal:
      language: python
      expression: "lambda witness, event, receipt: receipt.witness_aid == witness.aid and receipt.event_said == event.said and witness.first_seen(event.aid, event.sn) == event.said"
    strategy: "st.tuples(st.from_type(Witness), st.from_type(KeyEvent), st.from_type(Receipt))"
    notes: "Once a receipt is issued, the witness has committed to the first-seen version"

  - invariant: "Must be less than or equal to the total number of designated witnesses"
    term: "TOAD"
    technique: smt
    formal:
      language: z3
      expression: "And(toad >= 0, toad <= witness_count)"
    notes: "Boundary condition — Z3 proves this holds for all valid configurations"

  - invariant: "Must be at least ample(witness_count), the BFT minimum for the given witness count"
    term: "TOAD"
    technique: smt
    formal:
      language: z3
      expression: "Implies(witness_count > 0, toad >= ample(witness_count))"
    notes: "The BFT floor is a hard constraint — TOAD below ample() breaks quorum guarantees"

contracts:
  - port_ref: "port://keri/witness-agreement/inbound/receipting"
    preconditions:
      - formal:
          language: python
          expression: "lambda event, sigs: event.valid_structure() and len(sigs) > 0 and all(s.verifies(event) for s in sigs)"
        description: "Event must be structurally valid and controller signatures must verify"
    postconditions:
      - formal:
          language: python
          expression: "lambda result: isinstance(result, Receipt) and result.witness_signed()"
        description: "On success, a signed receipt is returned by the witness"
      - formal:
          language: python
          expression: "lambda aid, sn, result: result.met == (result.count >= result.threshold)"
        description: "check_accountability returns met=true iff count >= threshold"

  - port_ref: "port://keri/witness-agreement/inbound/kerl-query"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid: aid is not None and len(aid) > 0"
        description: "AID must be a valid, non-empty identifier"
    postconditions:
      - formal:
          language: python
          expression: "lambda kerl: all(kerl[i].sn < kerl[i+1].sn for i in range(len(kerl)-1))"
        description: "Returned KERL events are in strictly ascending sequence number order"

  - port_ref: "port://keri/witness-agreement/outbound/transport"
    preconditions:
      - formal:
          language: python
          expression: "lambda endpoint, receipt: endpoint.reachable() and receipt.valid_signature()"
        description: "Transport endpoint must be reachable and the receipt must carry a valid signature"
    postconditions:
      - formal:
          language: python
          expression: "lambda result: result.is_ok() or result.is_transport_error()"
        description: "Result is either success or a transport-layer error — no silent failures"
