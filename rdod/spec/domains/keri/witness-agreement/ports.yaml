# ports.yaml
domain_ref: "keri/witness-agreement"

ports:
  # Inbound — what clients call
  - id: "port://keri/witness-agreement/inbound/receipting"
    type: inbound
    name: "Receipting"
    contract: "submit_event(event: KeyEvent, controller_signatures: [Signature]) -> Result<Receipt, WitnessError>; get_receipts(aid: AID, sn: int) -> [Receipt]; check_accountability(aid: AID, sn: int) -> {met: bool, count: int, threshold: int}"
    protocol: "method-call"
    refs: ["domain://keri"]

  - id: "port://keri/witness-agreement/inbound/kerl-query"
    type: inbound
    name: "KERL Query"
    contract: "get_kerl(aid: AID) -> KERL; get_receipted_event(aid: AID, sn: int) -> {event: KeyEvent, receipts: [Receipt]}"
    protocol: "method-call"
    refs: ["domain://keri", "domain://agent"]

  # Outbound — what witness-agreement calls
  - id: "port://keri/witness-agreement/outbound/transport"
    type: outbound
    name: "Receipt Transport"
    contract: "send_receipt(endpoint: Endpoint, receipt: Receipt) -> Result; send_event_with_receipts(endpoint: Endpoint, event: KeyEvent, receipts: [Receipt]) -> Result; gossip_receipts(witnesses: [Endpoint], receipts: [Receipt]) -> Result"
    protocol: "method-call"
    refs: ["transport"]
