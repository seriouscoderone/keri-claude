# verification.yaml
domain_ref: "keri/witness-agreement/dissemination"

properties:
  - invariant: "At most two passes through all N witnesses for full dissemination"
    term: "Round-robin Dissemination"
    technique: smt
    formal:
      language: z3
      expression: "Implies(strategy == ROUND_ROBIN, exchanges <= 2 * N)"
    notes: "Upper bound on round-robin exchanges — two complete passes suffice for full receipt propagation"

  - invariant: "Network load scales linearly with N"
    term: "Round-robin Dissemination"
    technique: property-based
    formal:
      language: python
      expression: "lambda n, exchanges: exchanges <= 2 * n"
    strategy: "st.integers(min_value=1, max_value=100)"
    notes: "Verify the linear scaling claim by measuring actual exchanges for various N"

  - invariant: "Bandwidth scales with N * log(N) versus 2*N for round-robin"
    term: "Gossip Protocol"
    technique: property-based
    formal:
      language: python
      expression: "lambda n, gossip_bw, rr_bw: gossip_bw <= n * math.ceil(math.log2(n + 1)) and rr_bw <= 2 * n"
    strategy: "st.integers(min_value=2, max_value=100)"
    notes: "Comparative bandwidth verification — gossip trades bandwidth for lower latency"

  - invariant: "Witnesses are designated by the controller — not self-selected"
    term: "Witness Designation"
    technique: property-based
    formal:
      language: python
      expression: "lambda est_event, witness: witness.aid in est_event.b implies est_event.signed_by_controller()"
    strategy: "st.tuples(st.from_type(EstablishmentEvent), st.from_type(Witness))"
    notes: "Witness presence in the b field requires controller signature — self-designation is impossible"

  - invariant: "Designation is a cryptographic commitment via inclusion in a verifiable establishment event"
    term: "Witness Designation"
    technique: property-based
    formal:
      language: python
      expression: "lambda est_event: est_event.said == said_of(est_event.content) and est_event.b is not None"
    strategy: "st.from_type(EstablishmentEvent)"
    notes: "The SAID of the event commits to the witness list — any modification changes the SAID"

  - invariant: "First verified version of an event is witnessed (signed, stored, acknowledged)"
    term: "Witnessing Policy"
    technique: symbolic
    formal:
      language: python
      expression: "lambda witness, event: witness.accepts(event) implies (witness.signs(event) and witness.stores(event) and witness.acknowledges(event))"
    notes: "All three actions must occur atomically when a witness accepts a first-seen event"

  - invariant: "No witness pool required"
    term: "Direct Mode"
    technique: property-based
    formal:
      language: python
      expression: "lambda mode, config: mode == 'direct' implies len(config.witnesses) == 0"
    strategy: "st.from_type(ModeConfig).filter(lambda c: c.mode == 'direct')"
    notes: "Direct mode is defined by the absence of witnesses"

  - invariant: "Requires a designated witness pool and accountability threshold"
    term: "Indirect Mode"
    technique: property-based
    formal:
      language: python
      expression: "lambda mode, config: mode == 'indirect' implies (len(config.witnesses) > 0 and config.tally > 0)"
    strategy: "st.from_type(ModeConfig).filter(lambda c: c.mode == 'indirect')"
    notes: "Indirect mode is defined by the presence of witnesses and a positive tally"

contracts:
  - port_ref: "port://keri/witness-agreement/dissemination/inbound/event-propagation"
    preconditions:
      - formal:
          language: python
          expression: "lambda event, receipts, witnesses, strategy: event.valid() and len(witnesses) > 0 and strategy in ('round_robin', 'gossip')"
        description: "Event must be valid, at least one witness endpoint, and a recognized dissemination strategy"
    postconditions:
      - formal:
          language: python
          expression: "lambda report: report.witnesses_contacted >= 1 and report.strategy_applied in ('round_robin', 'gossip')"
        description: "At least one witness was contacted and the chosen strategy was applied"
      - formal:
          language: python
          expression: "lambda aid, sn, result: len(result.witnesses) >= 0 and result.tally >= 0 and result.tally <= len(result.witnesses)"
        description: "get_witness_set returns a valid witness list and tally within bounds"

  - port_ref: "port://keri/witness-agreement/dissemination/inbound/witness-management"
    preconditions:
      - formal:
          language: python
          expression: "lambda witnesses, tally: len(witnesses) > 0 and tally >= 1 and tally <= len(witnesses)"
        description: "At least one witness, and tally must be between 1 and witness count"
    postconditions:
      - formal:
          language: python
          expression: "lambda config: len(config.witnesses) > 0 and config.tally <= len(config.witnesses) and config.tally >= 1"
        description: "Returned config has a non-empty witness set and a valid tally"
      - formal:
          language: python
          expression: "lambda prune, graft, new_tally, config: all(w not in config.witnesses for w in prune) and all(w in config.witnesses for w in graft)"
        description: "After amend_witnesses, pruned witnesses are absent and grafted witnesses are present"

  - port_ref: "port://keri/witness-agreement/dissemination/outbound/transport"
    preconditions:
      - formal:
          language: python
          expression: "lambda endpoint, event: endpoint is not None and event.valid()"
        description: "Transport endpoint must be non-null and event must be structurally valid"
    postconditions:
      - formal:
          language: python
          expression: "lambda result: result.is_ok() or result.is_transport_error()"
        description: "Transport operations either succeed or return a transport-specific error"
