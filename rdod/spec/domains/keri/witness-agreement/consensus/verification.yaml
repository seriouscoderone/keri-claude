# verification.yaml
domain_ref: "keri/witness-agreement/consensus"

properties:
  - invariant: "First seen, always seen, never unseen"
    term: "First-seen Rule"
    technique: symbolic
    formal:
      language: python
      expression: "lambda witness, aid, sn, event1, event2: witness.first_seen(aid, sn) == event1.said implies witness.accepts(aid, sn, event2) == (event2.said == event1.said)"
    notes: "State machine property — once a witness commits to a first-seen event, all other versions at the same location are rejected. Exception: superseding recovery rotation."

  - invariant: "All subsequent different versions of an event at the same location are discarded"
    term: "First-seen Rule"
    technique: property-based
    formal:
      language: python
      expression: "lambda witness, aid, sn, first_event, later_event: (witness.has_first_seen(aid, sn) and later_event.said != first_event.said) implies not witness.accepts(aid, sn, later_event)"
    strategy: "st.tuples(st.from_type(Witness), st.from_type(AID), st.integers(min_value=0), st.from_type(KeyEvent), st.from_type(KeyEvent))"
    notes: "Different SAIDs at the same (aid, sn) are always rejected after a first-seen is established"

  - invariant: "Expressed as: M > (N + F + 1) / 2 where F < M and F* = N - M unavailable"
    term: "Immune Constraint"
    technique: smt
    formal:
      language: z3
      expression: "And(M > 0, N > 0, F >= 0, F < M, Implies(M > (N + F + 1) / 2, immune == True))"
    notes: "Z3 can exhaustively verify the immune constraint for all valid (M, N, F) combinations"

  - invariant: "When satisfied, the service is immune — cannot produce multiple divergent proper KERLs"
    term: "Immune Constraint"
    technique: smt
    formal:
      language: z3
      expression: "Implies(And(M > (N + F + 1) / 2, F < M), ForAll([kerl_a, kerl_b], Implies(And(proper(kerl_a, M), proper(kerl_b, M)), kerl_a == kerl_b)))"
    notes: "The core immunity theorem — under the constraint, two proper KERLs must agree"

  - invariant: "M must be no greater than N (the number of witnesses)"
    term: "Accountability Threshold"
    technique: smt
    formal:
      language: z3
      expression: "And(M >= 1, M <= N, N >= 1)"
    notes: "Basic range constraint on accountability threshold"

  - invariant: "For n witnesses: the minimum threshold m guarantees that any two sets of m witnesses share at least one honest member"
    term: "BFT Quorum"
    technique: smt
    formal:
      language: z3
      expression: "Implies(And(N >= 1, m == ample(N)), ForAll([set_a, set_b], Implies(And(size(set_a) >= m, size(set_b) >= m, subset(set_a, witnesses), subset(set_b, witnesses)), size(intersect(set_a, set_b)) >= 1)))"
    notes: "The quorum overlap property — any two quorum-sized subsets must share at least one member"

  - invariant: "Implemented as ample() function in keripy (kering module)"
    term: "BFT Quorum"
    technique: property-based
    formal:
      language: python
      expression: "lambda n: ample(n) == math.ceil((n + 1 + (n - 1) // 3) / 2) if n > 0 else 0"
    strategy: "st.integers(min_value=0, max_value=1000)"
    notes: "Cross-check the ample() implementation against the BFT formula for all reasonable witness counts"

contracts:
  - port_ref: "port://keri/witness-agreement/consensus/inbound/quorum-evaluation"
    preconditions:
      - formal:
          language: python
          expression: "lambda witness_count: witness_count >= 0"
        description: "Witness count must be non-negative"
      - formal:
          language: z3
          expression: "And(m >= 0, n >= 0, f >= 0, f < n)"
        description: "check_immune inputs must be non-negative with f < n"
    postconditions:
      - formal:
          language: python
          expression: "lambda witness_count, result: result >= 0 and result <= witness_count"
        description: "compute_ample returns a value between 0 and witness_count"
      - formal:
          language: z3
          expression: "Implies(And(m > (n + f + 1) / 2, f < m), check_immune(m, n, f) == True)"
        description: "check_immune returns true when the immune constraint is satisfied"

  - port_ref: "port://keri/witness-agreement/consensus/inbound/first-seen-check"
    preconditions:
      - formal:
          language: python
          expression: "lambda witness_id, aid, sn: witness_id is not None and aid is not None and sn >= 0"
        description: "Witness ID and AID must be valid, sequence number non-negative"
    postconditions:
      - formal:
          language: python
          expression: "lambda witness_id, aid, sn, event_said, result: result.is_accepted() implies (not witness_has_first_seen(witness_id, aid, sn))"
        description: "apply_first_seen succeeds only if no prior first-seen exists at that (aid, sn)"
      - formal:
          language: python
          expression: "lambda witness_id, aid, sn, event_said, result: result.is_already_seen() implies (witness_has_first_seen(witness_id, aid, sn) and witness_first_seen(witness_id, aid, sn) != event_said)"
        description: "apply_first_seen returns AlreadySeen if a different event is already first-seen"

state_machines:
  - name: "first-seen-lifecycle"
    term: "First-seen Rule"
    states: ["unseen", "first-seen", "receipted", "accountable"]
    transitions:
      - from: "unseen"
        to: "first-seen"
        trigger: "apply_first_seen(witness_id, aid, sn, event_said)"
        guard: "No prior event at (aid, sn) for this witness"
      - from: "first-seen"
        to: "receipted"
        trigger: "EventReceipted — witness signs and stores the receipt"
        guard: "Event signatures verified and consistent with prior KEL"
      - from: "receipted"
        to: "accountable"
        trigger: "AccountabilityThresholdMet — M of N receipts collected"
        guard: "receipt_count >= accountability_threshold"
    invariants:
      - "Once in first-seen, the event SAID at (aid, sn) cannot change (except via superseding recovery)"
      - "Transitions are irreversible under normal operation — no backtracking from receipted to first-seen"
      - "The accountable state means the event is fully witnessed and the controller accepts accountability"
    initial_state: "unseen"
    terminal_states: ["accountable"]
