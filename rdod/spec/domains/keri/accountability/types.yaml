domain_ref: "keri/accountability"

types:
  - name: "WitnessReceipt"
    description: "Cryptographic proof that a witness has observed and first-seen an event. Two variants: non-transferable (cigar — unindexed signature) and transferable (indexed signature group with seal)."
    variants:
      - name: "non-transferable"
        fields:
          - name: "witness_aid"
            type: "string"
            required: true
            description: "Non-transferable AID of the witness (public key IS the identifier)"
          - name: "cigar"
            type: "Cigar"
            required: true
            description: "Unindexed signature — the witness's signature over the receipted event's raw bytes"
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the event being receipted"
          - name: "event_sn"
            type: "integer"
            required: true
            description: "Sequence number of the receipted event"
          - name: "event_prefix"
            type: "string"
            required: true
            description: "AID prefix of the identifier whose event was receipted"
        invariants:
          - "witness_aid must be non-transferable — its public key can be derived directly from the prefix"
          - "cigar.verify(event_raw, witness_public_key) must return True"
          - "A witness MUST NOT receipt two different events at the same (prefix, sn) — first-seen rule"
      - name: "transferable"
        fields:
          - name: "witness_aid"
            type: "string"
            required: true
            description: "Transferable AID of the witness"
          - name: "seal"
            type: "Seal"
            required: true
            description: "Event seal referencing the witness's latest establishment event"
          - name: "sigers"
            type: "array[Siger]"
            required: true
            description: "Indexed signatures from the witness's current key set"
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the receipted event"
          - name: "event_sn"
            type: "integer"
            required: true
            description: "Sequence number of the receipted event"
          - name: "event_prefix"
            type: "string"
            required: true
            description: "AID prefix of the receipted event"
        invariants:
          - "Seal must reference the witness's current establishment event"
          - "Signatures must verify against the witness's current key state"
          - "Same first-seen constraint applies"

  - name: "ReceiptMessage"
    description: "The receipt message (rct) that conveys witness signatures as proof of first-seen observation."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["rct"]
            description: "Message type — receipt"
          - name: "d"
            type: "string"
            required: true
            description: "SAID of the receipted event (NOT the receipt itself)"
          - name: "i"
            type: "string"
            required: true
            description: "AID prefix of the receipted event"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number of the receipted event"
        invariants:
          - "d matches the SAID of the original event — the receipt references the event by content hash"
          - "Witness signatures are attached as CESR attachments, not in the body"
          - "Receipt body is NOT SAIDified itself — d is the referenced event's SAID"

  - name: "KERL"
    description: "Key Event Receipt Log — a KEL augmented with witness receipts. A KERL contains every event plus the witness receipts that make each event accountable."
    variants:
      - name: "default"
        fields:
          - name: "prefix"
            type: "string"
            required: true
            description: "The AID this KERL belongs to"
          - name: "events"
            type: "array[KeyEvent]"
            required: true
            description: "Ordered sequence of key events"
          - name: "receipts"
            type: "map[string, array[WitnessReceipt]]"
            required: true
            description: "Map from event SAID to list of witness receipts for that event"
        invariants:
          - "Every event in events has at least TOAD receipts in the receipts map"
          - "Events are ordered by sequence number with no gaps"
          - "KERL = KEL + receipts — the KEL is extractable by removing receipts"
