# ports.yaml
domain_ref: "keri/accountability/consensus"

ports:
  # Inbound — what clients call
  - id: "port://keri/accountability/consensus/inbound/quorum-evaluation"
    type: inbound
    name: "Quorum Evaluation"
    contract: "compute_ample(witness_count: int) -> int; check_accountability(aid: AID, sn: int, receipt_count: int, threshold: int) -> {met: bool, count: int, threshold: int}; check_immune(m: int, n: int, f: int) -> bool"
    protocol: "method-call"
    refs: ["domain://keri/accountability"]

  - id: "port://keri/accountability/consensus/inbound/first-seen-check"
    type: inbound
    name: "First-seen Check"
    contract: "is_first_seen(witness_id: WitnessAID, aid: AID, sn: int) -> bool; apply_first_seen(witness_id: WitnessAID, aid: AID, sn: int, event_said: SAID) -> Result<Accepted, AlreadySeen>; verify_proper_kerl(kerl: KERL) -> Result<Proper, VerificationError>"
    protocol: "method-call"
    refs: ["domain://keri/accountability"]
