# ports.yaml
domain_ref: "keri/accountability/receipting"

ports:
  # Inbound — what clients call
  - id: "port://keri/accountability/receipting/inbound/receipt-lifecycle"
    type: inbound
    name: "Receipt Lifecycle"
    contract: "create_receipt(event: KeyEvent, witness_keys: SigningKeys) -> Receipt; classify_receipt(signer_aid: AID, signer_role: Role) -> ReceiptType; escrow_receipt(receipt: Receipt, escrow_type: EscrowType) -> Result<Escrowed, EscrowError>; drain_escrow(aid: AID, sn: int, event_said: SAID) -> [Receipt]"
    protocol: "method-call"
    refs: ["domain://keri/accountability"]

  - id: "port://keri/accountability/receipting/inbound/kerl-assembly"
    type: inbound
    name: "KERL Assembly"
    contract: "attach_receipt(kerl: KERL, receipt: Receipt) -> KERL; get_kerl(aid: AID) -> KERL; get_receipted_event(aid: AID, sn: int) -> {event: KeyEvent, receipts: [Receipt]}"
    protocol: "method-call"
    refs: ["domain://keri/accountability"]

  # Outbound — what receipting calls
  - id: "port://keri/accountability/receipting/outbound/persistence"
    type: outbound
    name: "Receipt Persistence"
    contract: "store_receipt(receipt: Receipt, db_name: str) -> Result; load_receipts(aid: AID, sn: int, db_name: str) -> [Receipt]; store_escrowed(receipt: Receipt, escrow_db: str) -> Result; load_escrowed(aid: AID, sn: int, escrow_db: str) -> [Receipt]; delete_escrowed(aid: AID, sn: int, escrow_db: str) -> Result"
    protocol: "method-call"
    refs: ["persistence"]
