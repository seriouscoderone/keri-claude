# ports.yaml
domain_ref: "keri"

ports:
  # Inbound — what clients call
  - id: "port://keri/inbound/identifier-lifecycle"
    type: inbound
    name: "Identifier Lifecycle"
    contract: "incept(config) -> AID; rotate(aid, new_keys) -> RotationEvent; interact(aid, seals) -> InteractionEvent; get_key_state(aid) -> KeyState"
    protocol: "method-call"
    refs: ["domain://agent"]

  - id: "port://keri/inbound/event-verification"
    type: inbound
    name: "Event Verification"
    contract: "process_event(event, signatures, receipts) -> Result<KeyState, ValidationError>"
    protocol: "method-call"
    refs: ["domain://agent"]

  # Outbound — what KERI calls
  - id: "port://keri/outbound/event-store"
    type: outbound
    name: "Event Persistence"
    contract: "append_event(aid, event) -> Result; get_kel(aid) -> KEL; get_key_state(aid) -> KeyState"
    protocol: "method-call"
    refs: ["persistence"]

  - id: "port://keri/outbound/transport"
    type: outbound
    name: "Network Transport"
    contract: "send_event(endpoint, event) -> Result; send_receipt(endpoint, receipt) -> Result; query(endpoint, aid) -> KEL"
    protocol: "method-call"
    refs: ["transport"]
