# verification.yaml
domain_ref: "keri/delegation/validation"

properties:
  - invariant: "Step 1: Verify event signatures against delegatee's key state"
    term: "Delegation Validation"
    technique: property-based
    formal:
      language: python
      expression: "lambda event, key_state: validates_step1(event, key_state) == all(sig.verifies(event.content, key_state) for sig in event.signatures)"
    strategy: "st.tuples(st.from_type(SignedEstablishmentEvent), st.from_type(KeyState))"
    notes: "Step 1 is standard signature verification — same as non-delegated events"

  - invariant: "Step 2: Verify the di field references a valid delegator AID"
    term: "Delegation Validation"
    technique: property-based
    formal:
      language: python
      expression: "lambda event: validates_step2(event) == (event.type == 'dip' and event.di is not None and is_valid_aid(event.di)) or (event.type == 'drt' and event.delegator_from_inception is not None)"
    strategy: "st.from_type(SignedEstablishmentEvent)"
    notes: "Step 2 checks dip for di field, drt for inherited delegator from the inception event"

  - invariant: "Step 3: Locate the delegator's anchoring seal in the delegator's KEL"
    term: "Delegation Validation"
    technique: property-based
    formal:
      language: python
      expression: "lambda event, delegator_kel: validates_step3(event, delegator_kel) == any(seal.i == event.aid and seal.s == event.sn and seal.d == event.said for e in delegator_kel.events for seal in e.seals)"
    strategy: "st.tuples(st.from_type(SignedEstablishmentEvent), st.from_type(KEL))"
    notes: "Seal location requires scanning the delegator's KEL for a seal matching (aid, sn, said)"

  - invariant: "Step 4: Verify the seal commits to this delegated event's digest"
    term: "Delegation Validation"
    technique: property-based
    formal:
      language: python
      expression: "lambda seal, event: validates_step4(seal, event) == (seal.d == event.said)"
    strategy: "st.tuples(st.from_type(DelegationSeal), st.from_type(SignedEstablishmentEvent))"
    notes: "Final verification step — the seal's d field must exactly match the event's SAID"

  - invariant: "If any step fails, the event is escrowed to the appropriate queue (.pdes, .delegables, or rejected)"
    term: "Delegation Validation"
    technique: symbolic
    formal:
      language: python
      expression: "lambda event, step_results: any(not r for r in step_results) implies event.state in ('escrowed_pde', 'escrowed_delegable', 'rejected')"
    notes: "Failure routing is deterministic — which escrow depends on which step failed"

  - invariant: "Contains delegated events whose delegator seal has not yet been found"
    term: "Partially-Delegated Escrow"
    technique: property-based
    formal:
      language: python
      expression: "lambda pde_entry: pde_entry.delegator_kel_available and not pde_entry.seal_found"
    strategy: "st.from_type(PDEEntry)"
    notes: "PDE is specifically for events where the delegator's KEL is available but no matching seal exists yet"

  - invariant: "Timeout: 3600 seconds — escrowed events are pruned after expiry"
    term: "Partially-Delegated Escrow"
    technique: smt
    formal:
      language: z3
      expression: "And(timeout == 3600, Implies(age > timeout, pruned == True), Implies(age <= timeout, pruned == False))"
    notes: "Exact boundary — prevents indefinite escrow accumulation"

  - invariant: "Distinguished from Partially-Delegated Escrow: .delegables waits for delegator event arrival, .pdes waits for seal match"
    term: "Delegable Event Escrow"
    technique: property-based
    formal:
      language: python
      expression: "lambda entry: (entry.escrow_type == 'delegable') == (not entry.delegator_kel_available) and (entry.escrow_type == 'pde') == (entry.delegator_kel_available and not entry.seal_found)"
    strategy: "st.from_type(EscrowEntry)"
    notes: "The two escrow types are mutually exclusive based on delegator KEL availability"

  - invariant: "A delegated event can only be fully accepted once its seal moves to approved status"
    term: "Approved Delegation Seals"
    technique: property-based
    formal:
      language: python
      expression: "lambda event, seal_status: event.fully_accepted() implies seal_status == 'approved'"
    strategy: "st.tuples(st.from_type(DelegatedEvent), st.from_type(SealStatus))"
    notes: "Seal approval is a prerequisite for full acceptance — no shortcuts"

contracts:
  - port_ref: "port://keri/delegation/validation/inbound/delegation-validation"
    preconditions:
      - formal:
          language: python
          expression: "lambda event: event.type in ('dip', 'drt') and event.has_signatures()"
        description: "Only signed delegated establishment events can be validated"
      - formal:
          language: python
          expression: "lambda event, delegator_kel: delegator_kel is None or delegator_kel.valid()"
        description: "If delegator KEL is provided, it must be structurally valid"
    postconditions:
      - formal:
          language: python
          expression: "lambda result: result.is_validated() implies (result.signatures_valid and result.di_valid and result.seal_found and result.seal_matches)"
        description: "Validated result means all four validation steps passed"
      - formal:
          language: python
          expression: "lambda result: result.is_failure() implies result.failure_step in (1, 2, 3, 4)"
        description: "Failure result identifies which specific step failed"

  - port_ref: "port://keri/delegation/validation/inbound/escrow-management"
    preconditions:
      - formal:
          language: python
          expression: "lambda event: event.type in ('dip', 'drt') and event.has_signatures()"
        description: "Only signed delegated establishment events can be escrowed"
    postconditions:
      - formal:
          language: python
          expression: "lambda result: result.is_ok() implies result.escrow_type in ('pde', 'delegable')"
        description: "Escrowed events are placed in either PDE or delegable escrow"
      - formal:
          language: python
          expression: "lambda delegator_aid, events: all(e.delegator_aid == delegator_aid for e in events)"
        description: "get_escrowed_for_delegator returns only events for the specified delegator"

  - port_ref: "port://keri/delegation/validation/outbound/escrow-store"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid, sn, said, event, dt: aid is not None and sn >= 0 and said is not None and event is not None"
        description: "All required fields must be non-null for escrow storage"
    postconditions:
      - formal:
          language: python
          expression: "lambda aid, sn, said: get_pde_iter(aid).contains(sn, said) after put_pde(aid, sn, said, event, dt)"
        description: "After put_pde, the entry is retrievable via get_pde_iter for the same AID"
      - formal:
          language: python
          expression: "lambda aid, sn, said: not get_pde_iter(aid).contains(sn, said) after rem_pde(aid, sn, said)"
        description: "After rem_pde, the entry is no longer retrievable"

state_machines:
  - name: "delegation-validation-pipeline"
    term: "Delegation Validation"
    states: ["received", "sig-checked", "di-verified", "seal-located", "approved", "escrowed-pde", "escrowed-delegable", "rejected"]
    transitions:
      - from: "received"
        to: "sig-checked"
        trigger: "Step 1 passes — event signatures verified against delegatee key state"
        guard: "All signatures verify against the current key state for the delegatee"
      - from: "received"
        to: "rejected"
        trigger: "Step 1 fails — invalid signatures"
        guard: "One or more signatures do not verify"
      - from: "sig-checked"
        to: "di-verified"
        trigger: "Step 2 passes — di field references a valid delegator AID"
        guard: "di field present (dip) or delegator inherited (drt) and AID is valid"
      - from: "sig-checked"
        to: "rejected"
        trigger: "Step 2 fails — invalid or missing delegator reference"
        guard: "di field missing from dip, or referenced AID is invalid"
      - from: "di-verified"
        to: "escrowed-delegable"
        trigger: "Delegator KEL not available — cannot search for seal"
        guard: "Delegator's KEL has not been fetched or processed"
      - from: "di-verified"
        to: "seal-located"
        trigger: "Step 3 passes — matching seal found in delegator's KEL"
        guard: "Delegator's KEL contains a seal with matching (i, s, d)"
      - from: "di-verified"
        to: "escrowed-pde"
        trigger: "Step 3 fails — delegator KEL available but no matching seal"
        guard: "Delegator's KEL is available but contains no seal matching this event"
      - from: "seal-located"
        to: "approved"
        trigger: "Step 4 passes — seal digest matches delegated event SAID"
        guard: "seal.d == event.said"
      - from: "escrowed-pde"
        to: "seal-located"
        trigger: "DelegatedEventPromoted — delegator's KEL advances and now contains matching seal"
        guard: "New event in delegator's KEL contains matching seal"
      - from: "escrowed-delegable"
        to: "di-verified"
        trigger: "Delegator's KEL becomes available — retry validation from step 3"
        guard: "Delegator's KEL has been fetched and processed"
    invariants:
      - "Events must pass steps in order — no skipping from received to seal-located"
      - "Escrowed events can be promoted back to the validation pipeline when new information arrives"
      - "Rejected events are terminal — they cannot re-enter the pipeline"
      - "Approved events have passed all four validation steps and are ready for KEL insertion"
      - "Escrow timeout (3600s) transitions both escrowed-pde and escrowed-delegable to an implicit pruned state"
    initial_state: "received"
    terminal_states: ["approved", "rejected"]
