domain_ref: "keri/identity"

protocols:
  - name: "SingleSigInception"
    description: "Create a new single-signature identifier with witness accountability. The simplest inception flow — one controller, one key, witnesses for accountability."
    participants:
      - domain: "domain://keri/identity/establishment"
        role: "Validates and accepts the inception event"
      - domain: "domain://keri/accountability/receipting"
        role: "Witnesses receipt the inception event"
      - domain: "domain://keri/accountability/dissemination"
        role: "Disseminates the receipted event to other validators"
      - domain: "domain://discovery"
        role: "Publishes OOBI endpoints for the new identifier"
    trigger: "Controller requests inception with keys, witness list, and threshold"
    steps:
      - seq: 1
        domain: "domain://keri/identity/establishment"
        action: "construct_inception_event"
        port: "port://keri/identity/establishment/inbound/validate-event"
        input:
          description: "Signing keys, next key digests, witness list, TOAD, configuration traits"
          types:
            - ref: "types://keri/identity#InceptionEvent/non-delegated"
              fields: ["k", "n", "b", "bt", "c"]
        output:
          description: "Signed inception event (icp) with SAID as new AID prefix"
          type: "types://keri/identity#InceptionEvent"
        on_failure:
          - error: "ValidationError"
            ref: "errors://keri/identity/establishment#ValidationError"
            action: "abort"
            compensation: "No state created — nothing to clean up"
      - seq: 2
        domain: "domain://keri/identity/establishment"
        action: "validate_and_accept"
        port: "port://keri/identity/establishment/inbound/validate-event"
        input:
          description: "Signed inception event + controller signatures"
          types:
            - ref: "types://keri/identity#InceptionEvent"
        output:
          description: "Key state created in database, event logged to KEL"
          type: "types://keri/identity#KeyState"
        depends_on: [1]
        on_failure:
          - error: "MissingSignatureError"
            ref: "errors://keri/identity/establishment#MissingSignatureError"
            action: "escrow"
            compensation: "Event held in Partially-Signed Escrow (PSE)"
      - seq: 3
        domain: "domain://keri/accountability/receipting"
        action: "collect_witness_receipts"
        port: "port://keri/accountability/receipting/inbound/receipt-lifecycle"
        input:
          description: "Accepted inception event sent to designated witnesses"
        output:
          description: "Witness receipt signatures (one per witness)"
        depends_on: [2]
        on_failure:
          - error: "WitnessThresholdNotMetError"
            ref: "errors://keri/identity/thresholds#WitnessThresholdNotSatisfiedError"
            action: "escrow"
            compensation: "Event held in Partially-Witnessed Escrow (PWE) — retried as receipts arrive"
      - seq: 4
        domain: "domain://keri/accountability/dissemination"
        action: "disseminate_receipted_event"
        port: "port://keri/accountability/dissemination/inbound/event-propagation"
        input:
          description: "Inception event + witness receipts meeting TOAD"
        output:
          description: "Event published to watchers and other validators"
        depends_on: [3]
      - seq: 5
        domain: "domain://discovery"
        action: "publish_oobi"
        port: "port://discovery/inbound/discovery"
        input:
          description: "New AID + endpoint URLs + witness roles"
          types:
            - ref: "types://discovery#OOBI/witness"
              fields: ["aid", "role", "eid"]
        output:
          description: "OOBI URL resolvable by others"
          type: "types://discovery#OOBI"
        depends_on: [4]
    timeout: "3600s for witness receipt collection (configurable per escrow type)"
    compensation: "If witness threshold never met, event remains in PWE until timeout, then pruned"
    terminal_states:
      success: "AID exists with established key state, witness receipts meet TOAD, OOBI published"
      failure: "Event pruned from escrow after timeout — no AID created"

  - name: "KeyRotation"
    description: "Rotate signing keys for an existing transferable identifier. Pre-rotation binding ensures the new keys match prior commitments."
    participants:
      - domain: "domain://keri/identity/establishment"
        role: "Validates rotation event against pre-rotation commitments"
      - domain: "domain://keri/identity/key-commitment"
        role: "Verifies new keys match prior next key digest commitments"
      - domain: "domain://keri/accountability/receipting"
        role: "Witnesses receipt the rotation event"
    trigger: "Controller requests rotation with new keys matching prior next key commitments"
    steps:
      - seq: 1
        domain: "domain://keri/identity/establishment"
        action: "construct_rotation_event"
        port: "port://keri/identity/establishment/inbound/validate-rotation"
        input:
          description: "New keys, new next digests, witness changes (br/ba), new thresholds"
          types:
            - ref: "types://keri/identity#RotationEvent/non-delegated"
              fields: ["k", "n", "br", "ba", "kt", "nt", "bt"]
        output:
          description: "Signed rotation event (rot)"
          type: "types://keri/identity#RotationEvent"
      - seq: 2
        domain: "domain://keri/identity/key-commitment"
        action: "verify_pre_rotation_binding"
        port: "port://keri/identity/key-commitment/inbound/key-commitment"
        input:
          description: "New key digests compared against prior establishment event's n field"
        output:
          description: "Binding confirmed — new keys are authentic pre-rotated keys"
        depends_on: [1]
        preconditions:
          - "verification://keri/identity/key-commitment#Pre-rotation Commitment"
        on_failure:
          - error: "ValidationError"
            ref: "errors://keri/identity/key-commitment#PreRotationBindingError"
            action: "abort"
            compensation: "Rotation rejected — prior key state unchanged"
      - seq: 3
        domain: "domain://keri/identity/establishment"
        action: "validate_and_accept"
        port: "port://keri/identity/establishment/inbound/validate-event"
        input:
          description: "Rotation event + verified signatures meeting threshold"
          types:
            - ref: "types://keri/identity#RotationEvent"
        output:
          description: "Key state updated — new keys, new witnesses, new thresholds active"
          type: "types://keri/identity#KeyState"
        depends_on: [2]
        preconditions:
          - "verification://keri/identity/establishment#Dual Threshold Verification"
        on_failure:
          - error: "MissingSignatureError"
            ref: "errors://keri/identity/establishment#MissingSignatureError"
            action: "escrow"
            compensation: "PSE — accumulates signatures"
      - seq: 4
        domain: "domain://keri/accountability/receipting"
        action: "collect_witness_receipts"
        port: "port://keri/accountability/receipting/inbound/receipt-lifecycle"
        input:
          description: "Accepted rotation event"
        output:
          description: "Witness receipts for the rotation"
        depends_on: [3]
        on_failure:
          - error: "WitnessThresholdNotMetError"
            ref: "errors://keri/identity/thresholds#WitnessThresholdNotSatisfiedError"
            action: "escrow"
            compensation: "PWE — retried as receipts arrive"
    timeout: "3600s"
    terminal_states:
      success: "Key state updated, witness receipts collected, old keys no longer valid for new events"
      failure: "Rotation escrowed or rejected — prior key state remains active"

  - name: "DelegatedInception"
    description: "Create a delegated identifier requiring approval from a delegator. Two-party flow: delegate constructs the event, delegator anchors approval in their KEL."
    participants:
      - domain: "domain://keri/identity/establishment"
        role: "Validates the delegated inception event"
      - domain: "domain://keri/delegation/authorization"
        role: "Verifies delegator's approval seal"
      - domain: "domain://keri/identity/anchoring"
        role: "Delegator anchors approval seal via interaction event"
      - domain: "domain://keri/accountability/receipting"
        role: "Witnesses receipt both the delegate's and delegator's events"
    trigger: "Delegate requests inception with delegator AID specified"
    steps:
      - seq: 1
        domain: "domain://keri/identity/establishment"
        action: "construct_delegated_inception"
        port: "port://keri/identity/establishment/inbound/validate-delegation"
        input:
          description: "Keys, next digests, witnesses, TOAD, delegator AID"
          types:
            - ref: "types://keri/identity#InceptionEvent/delegated"
              fields: ["k", "n", "b", "bt", "di"]
        output:
          description: "Signed delegated inception event (dip) with di field"
          type: "types://keri/identity#InceptionEvent/delegated"
      - seq: 2
        domain: "domain://keri/identity/establishment"
        action: "validate_basic_structure"
        port: "port://keri/identity/establishment/inbound/validate-event"
        input:
          description: "Delegated inception event + controller signatures"
          types:
            - ref: "types://keri/identity#InceptionEvent/delegated"
        output:
          description: "Event structurally valid, signatures verified"
        depends_on: [1]
        on_failure:
          - error: "MissingSignatureError"
            ref: "errors://keri/identity/establishment#MissingSignatureError"
            action: "escrow"
            compensation: "PSE"
      - seq: 3
        domain: "domain://keri/delegation/authorization"
        action: "await_delegator_seal"
        port: "port://keri/delegation/authorization/inbound/binding-lifecycle"
        input:
          description: "Delegate's dip event SAID, delegator's AID"
        output:
          description: "Delegator's interaction event containing seal anchoring this dip"
        depends_on: [2]
        preconditions:
          - "verification://keri/delegation/authorization#Cooperative Delegation"
        on_failure:
          - error: "MissingDelegatorSealError"
            ref: "errors://keri/delegation/authorization#MissingDelegatorSealError"
            action: "escrow"
            compensation: "Partially-Delegated Escrow (PDE) — retried when delegator's ixn arrives"
      - seq: 4
        domain: "domain://keri/identity/anchoring"
        action: "delegator_anchors_seal"
        port: "port://keri/identity/anchoring/inbound/data-anchoring"
        input:
          description: "Delegator creates ixn with digest seal of delegate's dip SAID"
          types:
            - ref: "types://keri/identity#InteractionEvent"
              fields: ["a"]
        output:
          description: "Delegator's ixn accepted to their KEL"
        depends_on: [2]
      - seq: 5
        domain: "domain://keri/identity/establishment"
        action: "accept_delegated_inception"
        port: "port://keri/identity/establishment/inbound/validate-delegation"
        input:
          description: "dip event + delegator seal confirmation"
        output:
          description: "Delegated AID established with key state"
          type: "types://keri/identity#KeyState"
        depends_on: [3, 4]
      - seq: 6
        domain: "domain://keri/accountability/receipting"
        action: "collect_witness_receipts"
        port: "port://keri/accountability/receipting/inbound/receipt-lifecycle"
        input:
          description: "Both delegate's dip and delegator's ixn"
        output:
          description: "Witness receipts for both events"
        depends_on: [5]
    timeout: "86400s (24 hours — delegation may require human approval)"
    compensation: "If delegator never approves, event pruned from PDE after timeout"
    terminal_states:
      success: "Delegated AID exists, delegator's KEL contains approval seal, witnesses have receipted both"
      failure: "Delegation request expired — no AID created"

  - name: "KeyStateQuery"
    description: "Query another controller or service for the current key state of an identifier. Returns the key state notice (ksn) which can be verified against the queried identifier's KEL."
    participants:
      - domain: "domain://keri/identity/state"
        role: "Processes the query and returns key state"
      - domain: "domain://keri/identity/establishment"
        role: "Validates returned KEL events if key state is unknown locally"
    trigger: "Controller or service needs current key state of a remote identifier"
    steps:
      - seq: 1
        domain: "domain://keri/identity/state"
        action: "construct_query"
        port: "port://keri/identity/state/inbound/state-query"
        input:
          description: "Target AID prefix, query route (ksn or logs)"
        output:
          description: "qry message with route and target prefix"
      - seq: 2
        domain: "domain://keri/identity/state"
        action: "send_query"
        port: "port://keri/identity/state/inbound/state-tracking"
        input:
          description: "Signed qry message sent to target's known endpoints"
        output:
          description: "rpy message with key state notice or KEL replay"
        depends_on: [1]
        on_failure:
          - error: "QueryNotFoundError"
            ref: "errors://keri/identity/state#QueryNotFoundError"
            action: "escrow"
            compensation: "Query escrowed — retried when target's KEL becomes available"
      - seq: 3
        domain: "domain://keri/identity/state"
        action: "process_reply"
        port: "port://keri/identity/state/inbound/state-tracking"
        input:
          description: "Signed rpy with key state data"
        output:
          description: "Key state updated locally if reply is fresher than cached state (BADA policy)"
          type: "types://keri/identity#KeyState"
        depends_on: [2]
        preconditions:
          - "verification://keri/identity/state#State Reconstruction"
        on_failure:
          - error: "BADARejectError"
            ref: "errors://keri/identity/state#StaleKeyStateError"
            action: "abort"
            compensation: "Reply is stale — cached state is already newer"
    timeout: "30s"
    terminal_states:
      success: "Local key state updated to latest from remote source"
      failure: "Query unanswered or reply rejected — cached state unchanged"

  - name: "DelegatedRotation"
    description: "Rotate keys for a delegated identifier. Requires both the delegate's rotation event and the delegator's re-approval via a new KEL seal — same two-party coordination as delegated inception."
    participants:
      - domain: "domain://keri/identity/establishment"
        role: "Validates the delegated rotation event with pre-rotation binding"
      - domain: "domain://keri/identity/key-commitment"
        role: "Verifies new keys match prior next commitments"
      - domain: "domain://keri/delegation/authorization"
        role: "Verifies delegator's re-approval seal"
      - domain: "domain://keri/identity/anchoring"
        role: "Delegator anchors re-approval seal via interaction event"
      - domain: "domain://keri/accountability/receipting"
        role: "Witnesses receipt both delegate's and delegator's events"
    trigger: "Delegate requests key rotation for a delegated identifier"
    steps:
      - seq: 1
        domain: "domain://keri/identity/establishment"
        action: "construct_delegated_rotation"
        port: "port://keri/identity/establishment/inbound/validate-rotation"
        input:
          description: "New keys (matching prior next commitments), new next digests, witness changes"
          types:
            - ref: "types://keri/identity#RotationEvent/delegated"
              fields: ["k", "n", "br", "ba"]
        output:
          description: "Signed delegated rotation event (drt)"
          type: "types://keri/identity#RotationEvent/delegated"
      - seq: 2
        domain: "domain://keri/identity/key-commitment"
        action: "verify_pre_rotation_binding"
        port: "port://keri/identity/key-commitment/inbound/key-commitment"
        input:
          description: "New key digests compared against prior establishment event's n field"
        output:
          description: "Binding confirmed"
        depends_on: [1]
        preconditions:
          - "verification://keri/identity/key-commitment#Pre-rotation Commitment"
        on_failure:
          - error: "PreRotationBindingError"
            ref: "errors://keri/identity/key-commitment#PreRotationBindingError"
            action: "abort"
            compensation: "Rotation rejected — prior key state unchanged"
      - seq: 3
        domain: "domain://keri/identity/establishment"
        action: "validate_basic_structure"
        port: "port://keri/identity/establishment/inbound/validate-event"
        input:
          description: "Delegated rotation event + signatures"
          types:
            - ref: "types://keri/identity#RotationEvent/delegated"
        output:
          description: "Event structurally valid, signatures verified"
        depends_on: [2]
        on_failure:
          - error: "MissingSignatureError"
            ref: "errors://keri/identity/establishment#MissingSignatureError"
            action: "escrow"
            compensation: "PSE — accumulates signatures"
      - seq: 4
        domain: "domain://keri/delegation/authorization"
        action: "await_delegator_seal"
        port: "port://keri/delegation/authorization/inbound/binding-lifecycle"
        input:
          description: "Delegate's drt event SAID, delegator's AID"
        output:
          description: "Delegator's event containing re-approval seal"
        depends_on: [3]
        preconditions:
          - "verification://keri/delegation/authorization#Cooperative Delegation"
        on_failure:
          - error: "MissingDelegatorSealError"
            ref: "errors://keri/delegation/authorization#MissingDelegatorSealError"
            action: "escrow"
            compensation: "PDE — retried when delegator's event arrives"
      - seq: 5
        domain: "domain://keri/identity/anchoring"
        action: "delegator_anchors_seal"
        port: "port://keri/identity/anchoring/inbound/data-anchoring"
        input:
          description: "Delegator creates ixn with seal of delegate's drt SAID"
          types:
            - ref: "types://keri/identity#InteractionEvent"
              fields: ["a"]
        output:
          description: "Delegator's ixn accepted to their KEL"
        depends_on: [3]
      - seq: 6
        domain: "domain://keri/identity/establishment"
        action: "accept_delegated_rotation"
        port: "port://keri/identity/establishment/inbound/validate-delegation"
        input:
          description: "drt event + delegator seal confirmation"
        output:
          description: "Key state updated for delegated AID"
          type: "types://keri/identity#KeyState"
        depends_on: [4, 5]
      - seq: 7
        domain: "domain://keri/accountability/receipting"
        action: "collect_witness_receipts"
        port: "port://keri/accountability/receipting/inbound/receipt-lifecycle"
        input:
          description: "Both delegate's drt and delegator's ixn"
        output:
          description: "Witness receipts for both events"
        depends_on: [6]
    timeout: "86400s (24 hours — delegation may require human approval)"
    compensation: "If delegator never approves, rotation held in PDE until timeout"
    terminal_states:
      success: "Delegated AID rotated, delegator's KEL contains re-approval seal, witnesses receipted"
      failure: "Delegation re-approval timeout — prior key state remains active"
