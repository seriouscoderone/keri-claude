# ports.yaml
domain_ref: "keri/identity"

ports:
  # Inbound — what clients call
  - id: "port://keri/identity/inbound/identity-management"
    type: inbound
    name: "Identity Management"
    contract: "create_inception(config: InceptionConfig) -> InceptionEvent; create_rotation(aid: AID, new_keys: [PublicKey], new_next: [PublicKey]) -> RotationEvent; create_interaction(aid: AID, seals: [Seal]) -> InteractionEvent"
    protocol: "method-call"
    refs: ["domain://keri"]

  - id: "port://keri/identity/inbound/event-processing"
    type: inbound
    name: "Event Processing"
    contract: "process_event(event: KeyEvent, signatures: [Signature], receipts: [Receipt]) -> Result<EventValidated, ValidationError>; escrow_event(event: KeyEvent) -> Result<Escrowed, EscrowError>"
    protocol: "method-call"
    refs: ["domain://keri"]

  - id: "port://keri/identity/inbound/state-query"
    type: inbound
    name: "State Query"
    contract: "get_key_state(aid: AID) -> KeyState; get_kel(aid: AID) -> KEL; get_event(aid: AID, sn: int) -> KeyEvent; get_signing_keys(aid: AID) -> [PublicKey]; get_witness_set(aid: AID) -> [WitnessAID]"
    protocol: "method-call"
    refs: ["domain://keri"]

  # Outbound — what identity calls
  - id: "port://keri/identity/outbound/event-store"
    type: outbound
    name: "Event Persistence"
    contract: "append_event(aid: AID, event: KeyEvent, fn: int) -> Result; get_events(aid: AID) -> [KeyEvent]; get_event_by_sn(aid: AID, sn: int) -> KeyEvent; get_event_by_said(said: SAID) -> KeyEvent"
    protocol: "method-call"
    refs: ["persistence"]

  - id: "port://keri/identity/outbound/kel-storage"
    type: outbound
    name: "KEL Storage Schema"
    contract: "put_evts(key: dgKey, val: bytes) -> bool; get_evts(key: dgKey) -> bytes?; put_kels(key: snKey, val: bytes) -> bool; get_kels(key: snKey) -> [bytes]; put_fels(key: prefix+fn, val: bytes) -> bool; get_fels(key: prefix+fn) -> bytes?; append_sigs(key: dgKey, sigs: [Siger]) -> bool; get_sigs(key: dgKey) -> [Siger]; append_wigs(key: dgKey, wigs: [Siger]) -> bool; get_wigs(key: dgKey) -> [Siger]; append_rcts(key: dgKey, rcts: [Receipt]) -> bool; get_rcts(key: dgKey) -> [Receipt]; put_fon(key: dgKey, fn: int) -> bool; get_fon(key: dgKey) -> int?; put_dts(key: dgKey, dater: Dater) -> bool; get_dts(key: dgKey) -> Dater?; put_esr(key: dgKey, local: bool) -> bool; get_esr(key: dgKey) -> EventSourceRecord?; put_state(prefix: AID, ksr: KeyStateRecord) -> bool; get_state(prefix: AID) -> KeyStateRecord?"
    protocol: "method-call"
    refs: ["persistence"]
    notes: "Subdatabase schema: .evts (event bytes, dgKey, append-only), .kels (sequence index, snKey), .fels (first-seen log, prefix+fn), .sigs (controller sigs, dgKey, IoSet), .wigs (witness sigs, dgKey, IoSet), .rcts (non-trans receipts, dgKey, IoSet), .fons (first-seen ordinal, dgKey, put-if-not-exists), .dtss (timestamps, dgKey, immutable), .esrs (event source record, dgKey, escalation-only), .states (key state cache, prefix, overwrite)"

  - id: "port://keri/identity/outbound/escrow-store"
    type: outbound
    name: "Escrow Storage"
    contract: "put_ooe(key: bytes, event: bytes, dt: Dater) -> bool; get_ooe(key: bytes) -> Iterator<bytes>; del_ooe(key: bytes) -> bool; put_pse(key: bytes, event: bytes, dt: Dater) -> bool; get_pse(key: bytes) -> Iterator<bytes>; del_pse(key: bytes) -> bool; put_pwe(key: bytes, event: bytes, dt: Dater) -> bool; get_pwe(key: bytes) -> Iterator<bytes>; del_pwe(key: bytes) -> bool; put_pde(key: bytes, event: bytes, dt: Dater) -> bool; get_pde(key: bytes) -> Iterator<bytes>; del_pde(key: bytes) -> bool; put_lde(key: bytes, event: bytes) -> bool; get_lde(key: bytes) -> Iterator<bytes>; put_misfit(key: bytes, event: bytes) -> bool; get_misfit(key: bytes) -> Iterator<bytes>"
    protocol: "method-call"
    refs: ["persistence"]
    notes: "Escrow subdatabases: .ooes (out-of-order), .pses (partially-signed), .pwes (partially-witnessed), .pdes (partially-delegated), .ldes (likely duplicitous), .misfits (misfit events), .delegables (local delegated)"
