# ports.yaml
domain_ref: "keri/identity/anchoring"

ports:
  # Inbound — what clients call
  - id: "port://keri/identity/anchoring/inbound/data-anchoring"
    type: inbound
    name: "Data Anchoring"
    contract: "create_interaction(aid: AID, seals: [Seal]) -> InteractionEvent; create_digest_seal(data: bytes, algorithm: DigestAlgorithm) -> DigestSeal; create_event_seal(aid: AID, sn: int, said: SAID) -> EventSeal; create_last_est_seal(aid: AID) -> LastEstSeal"
    protocol: "method-call"
    refs: ["domain://keri/identity"]

  - id: "port://keri/identity/anchoring/inbound/seal-query"
    type: inbound
    name: "Seal Query"
    contract: "get_seals(aid: AID, sn: int) -> [Seal]; find_seal(aid: AID, seal_digest: Digest) -> Result<{sn: int, seal: Seal}, NotFound>; verify_seal(seal: Seal, data: bytes) -> bool"
    protocol: "method-call"
    refs: ["domain://keri/identity"]
