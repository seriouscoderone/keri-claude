# ports.yaml
domain_ref: "keri/identity/thresholds"

ports:
  # Inbound — what the parent key-state domain calls
  - id: "port://keri/identity/thresholds/inbound/threshold-satisfaction"
    type: inbound
    name: "Threshold Satisfaction"
    contract: "satisfy(threshold: Threshold, indices: [int]) -> bool; parse_threshold(sith: str | [str]) -> Threshold; threshold_size(threshold: Threshold) -> int; is_weighted(threshold: Threshold) -> bool"
    protocol: "method-call"
    refs: ["domain://keri/identity"]

  - id: "port://keri/identity/thresholds/inbound/dual-threshold"
    type: inbound
    name: "Dual Threshold Verification"
    contract: "check_dual_threshold(signing_threshold: Threshold, rotation_threshold: Threshold, indices: [int], ondices: [int]) -> Result<bool, DualThresholdError>"
    protocol: "method-call"
    refs: ["domain://keri/identity"]

  - id: "port://keri/identity/thresholds/inbound/witness-configuration"
    type: inbound
    name: "Witness Configuration Management"
    contract: "build_witness_config(witnesses: [WitnessAID], toad: int) -> WitnessConfiguration; apply_witness_changes(current: WitnessConfiguration, removals: [WitnessAID], additions: [WitnessAID], new_toad?: int) -> WitnessConfiguration; enough_receipts(config: WitnessConfiguration, receipt_indices: [int]) -> bool"
    protocol: "method-call"
    refs: ["domain://keri/identity"]
