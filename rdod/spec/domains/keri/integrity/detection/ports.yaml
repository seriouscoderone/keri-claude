# ports.yaml
domain_ref: "keri/integrity/detection"

ports:
  # Inbound — what clients call
  - id: "port://keri/integrity/detection/inbound/monitoring-lifecycle"
    type: inbound
    name: "Monitoring Lifecycle"
    contract: "monitor_aid(aid: AID, sources: [Endpoint]) -> MonitorHandle; stop_monitoring(handle: MonitorHandle) -> void; check_duplicity(aid: AID) -> Result<NoDuplicity, DuplicityEvidence>"
    protocol: "method-call"
    refs: ["domain://keri/integrity"]

  - id: "port://keri/integrity/detection/inbound/trust-decisions"
    type: inbound
    name: "Trust Decisions"
    contract: "evaluate_trust(aid: AID, evidence: [DuplicityEvidence]) -> TrustDecision; revoke_trust(aid: AID, reason: DuplicityEvidence) -> TrustRevoked; reconcile_trust(aid: AID, recovery_event: RotationEvent) -> TrustReconciled"
    protocol: "method-call"
    refs: ["domain://keri/integrity"]

  # Outbound — what this domain calls
  - id: "port://keri/integrity/detection/outbound/kel-sources"
    type: outbound
    name: "KEL Sources"
    contract: "poll_witness(witness_aid: AID, monitored_aid: AID) -> KERL; poll_watcher(watcher_aid: AID, monitored_aid: AID) -> KERL; compare_kerls(a: KERL, b: KERL) -> Result<Consistent, [Discrepancy]>"
    protocol: "network"
    refs: ["external://transport"]
