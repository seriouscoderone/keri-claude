# ports.yaml
domain_ref: "credential-exchange/proof"

ports:
  # Inbound -- what clients call
  - id: "port://credential-exchange/proof/inbound/verify-disclosure"
    type: inbound
    name: "Disclosure Verification"
    semantics: query
    idempotent: true
    contract:
      input: "types://credential-exchange/negotiation#GrantBundle"
      output: "types://credential-exchange/proof#RegistryState"
      errors:
        - "errors://credential-exchange/proof#MissingProofArtifactError"
        - "errors://credential-exchange/proof#ProofChainVerificationError"
        - "errors://credential-exchange/proof#ProofOfDisclosureError"
    refs: ["domain://credential-exchange"]

  - id: "port://credential-exchange/proof/inbound/authenticate-message"
    type: inbound
    name: "KRAM Authentication"
    semantics: query
    idempotent: true
    contract:
      input: "types://credential-exchange/negotiation#IPEXMessage"
      output: "types://credential-exchange/proof#RegistryState"
      errors:
        - "errors://credential-exchange/proof#AuthenticationError"
    refs: ["domain://credential-exchange"]

  # Outbound -- what proof delegates to
  - id: "port://credential-exchange/proof/outbound/tel-chain-validation"
    type: outbound
    name: "TEL Chain Validation"
    semantics: query
    idempotent: true
    contract:
      input: "types://credential-lifecycle/status#TELEvent"
      output: "types://credential-exchange/proof#RegistryState"
      errors:
        - "errors://credential-lifecycle/verification#TELChainBrokenError"
        - "errors://credential-lifecycle/verification#MissingSealError"
    refs: ["domain://credential-lifecycle/verification"]
