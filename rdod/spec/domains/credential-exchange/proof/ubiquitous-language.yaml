# ubiquitous-language.yaml
domain_ref: "credential-exchange/proof"

imports:
  - term: "KRAM"
    from: "domain://keri-messaging"
    usage: "Exchange messages are authenticated via KRAM — signature validity checked before processing any IPEX content"

terms:
  - term: "Proof of Issuance"
    synonyms: ["PoI"]
    definition: "Evidence that an ACDC was authentically issued — provided by disclosing the SAID of the most compact form variant and the issuer's KEL seal anchoring that SAID via a transaction event."
    invariants:
      - "Issuer must anchor the credential's SAID in their KEL via a transaction event seal"
      - "A commitment to the top-level SAID is equivalent to a commitment to the hash tree root"
      - "This single commitment provides PoI for all schema-authorized variants"
    examples:
      - "Issuer's KEL seal anchoring the compact ACDC SAID, verifiable against the issuer's key state at issuance"
    related_terms: ["Proof of Disclosure", "Most Compact Form", "Credential Artifacts in Grant"]

  - term: "Proof of Disclosure"
    synonyms: ["PoD"]
    definition: "Evidence that a specific variant of an ACDC has been disclosed — provided by disclosing the SAD of the most compact variant and recursively expanding nested SADs as needed."
    invariants:
      - "Discloser provides the SAD of the variant, verifiable against its SAID"
      - "Nested blocks are recursively expanded from compact form and verified"
      - "May satisfy commitment made in prior step via KEL seal on SAID"
    examples:
      - "Full attribute section SAD disclosed and verified against its SAID from the compact form"
    related_terms: ["Proof of Issuance", "SAD", "SAID", "Credential Artifacts in Grant"]

  - term: "Credential Artifacts in Grant"
    synonyms: []
    definition: "The grant message embeds all artifacts needed for the recipient to verify the credential: the ACDC itself, the issuance TEL update event (upd or bup with ts='issued'), and the KEL authorization seal. This bundle enables the recipient to independently verify the credential's authenticity, chain, and revocation status."
    invariants:
      - "Grant contains the full ACDC (or selective disclosure variant)"
      - "Grant contains the issuance TEL event (upd for non-shieldable, bup for shieldable registries)"
      - "Grant contains the KEL authorization seal binding the TEL event to the issuer's KEL"
      - "Recipient can independently verify the credential without additional round-trips to the issuer"
    examples:
      - "Grant message carrying an ACDC, its upd(ts='issued') event from the TEL, and the seal from the issuer's KEL interaction event"
      - "Recipient verifying the grant by checking: ACDC SAID matches TEL event ta field, TEL event digest matches KEL seal"
    related_terms: ["Proof of Issuance", "Proof of Disclosure", "Transaction Event Seal", "TEL"]

  - term: "Most Compact Form"
    synonyms: ["MCF", "Most Compact Form SAID"]
    definition: "The canonical form of an ACDC (or any SAIDed block) used to compute its single unambiguous SAID. Computed by a depth-first algorithm: expand leaf blocks, compute their SAIDs, compact them into their enclosing blocks, compute those SAIDs, and repeat up to the root. The result is a representation where every SAIDed subblock is replaced by its SAID. This is what the issuer anchors in their KEL — one commitment that covers all schema-authorized disclosure variants."
    invariants:
      - "Every SAIDed block has exactly one Most Compact Form regardless of how many oneOf variants its schema allows"
      - "Algorithm: depth-first — SAIDify leaves first, compact them, SAIDify parents, repeat to root"
      - "The SAID of the Most Compact Form is used for all references: edge nodes, PoI commitment, ACDC identification"
      - "Non-SAIDed subblocks with oneOf variants use the most fully expanded variant for SAID computation"
      - "Verification reverses the process: expand a block, verify its SAID, recurse into nested blocks"
    examples:
      - "ACDC with attribute section and edge section: compute a.d on expanded attributes, compact a to a.d, compute e.d on expanded edges, compact e to e.d, then compute top-level d"
      - "Leaf block with no nested SAIDed subblocks: SAID computed on the fully expanded representation"
    related_terms: ["Proof of Issuance", "SAID", "Graduated Disclosure"]

  - term: "Credential Hash Tree"
    synonyms: ["SAID Tree", "Verification Tree"]
    definition: "The implicit hash tree formed by an ACDC's nested SAIDed blocks. The top-level SAID is the tree root; each section SAID (attributes, edges, rules) is a branch; leaf blocks are the terminal nodes. A KEL seal anchoring the root SAID is a commitment to the entire tree — any branch can be independently verified by expanding it and checking its SAID against its compact form in the parent."
    invariants:
      - "Commitment to the top-level SAID is equivalent to commitment to the hash tree root"
      - "Verifying a nested block is verifying proof of inclusion in the tree"
      - "Any schema-authorized variant corresponds to a different expansion path through the same tree"
      - "One PoI (KEL seal anchoring root SAID) provides issuance proof for all disclosure variants"
    examples:
      - "Root: ACDC SAID → branches: a.d (attributes), e.d (edges), r.d (rules) → leaves: individual attribute SAIDs"
      - "Verifier expands a.d → checks SAID → expands nested blocks within attributes → checks their SAIDs"
    related_terms: ["Most Compact Form", "Proof of Issuance", "Proof of Disclosure"]

  - term: "Three-Link Verification Chain"
    synonyms: ["ACDC → TEL → KEL Chain"]
    definition: "The full verification chain for a credential in a grant: (1) the ACDC itself, verified by its SAID; (2) the TEL issuance event, whose ta field must match the ACDC SAID; (3) the KEL authorization seal, whose digest must match the TEL event SAID. This three-link chain binds the credential to the issuer's key state at the time of issuance."
    invariants:
      - "Link 1: ACDC SAID verifies the credential's content integrity"
      - "Link 2: TEL event ta field == ACDC SAID — binds issuance to this specific credential"
      - "Link 3: KEL seal digest == TEL event SAID — binds the TEL event to the issuer's key authority"
      - "All three links must verify for the grant to be accepted"
      - "Stateless: verification requires only the artifacts and the issuer's key state — no round-trips"
    examples:
      - "Grant carries ACDC(d=X), upd(ta=X, d=Y), seal(d=Y) — verifier checks X==ta, Y==seal.d"
    related_terms: ["Credential Artifacts in Grant", "Proof of Issuance"]

  - term: "Bespoke Issued ACDC"
    synonyms: ["Disclosure-Specific ACDC"]
    definition: "A credential issued by the Discloser (not the original Issuer) that chains to one or more existing ACDCs via edges. Enables disclosure-specific contractual terms, contextual attribute augmentation, and rich presentations without new tooling — just reuse the standard ACDC issuance and verification pipeline."
    invariants:
      - "Issuer of the bespoke ACDC is the Discloser; Issuee is the Disclosee"
      - "Edges reference the original ACDC(s) being disclosed"
      - "Rules section carries context-specific contractual language (e.g., one-time use, venue-specific)"
      - "Attributes may be empty or may include context-specific properties supporting the contractual terms"
      - "Signing the bespoke ACDC consummates a contract between the named Issuer (Discloser) and named Issuee (Disclosee)"
      - "Standard ACDC verification applies — no special presentation protocol needed"
    examples:
      - "Restaurant admittance: Discloser issues a bespoke ACDC with edge→coupon_ACDC, rules→one-time-use anti-assimilation clause, issuee→restaurant_AID"
      - "Rich presentation: bespoke ACDC edges reference multiple source ACDCs, each contributing different attributes"
    related_terms: ["Credential Artifacts in Grant", "Proof of Issuance", "Chain-Link Confidentiality"]

events:
  - name: "IssuanceProofVerified"
    payload: "acdc_said: SAID, issuer_aid: AID, compact_said: SAID"
    triggers: "PoI check passes — issuer's commitment on the most compact SAID is cryptographically valid"

  - name: "DisclosureProofVerified"
    payload: "acdc_said: SAID, variant: DisclosureVariant, expanded_blocks: [SAID]"
    triggers: "PoD check passes — all SAD expansions match their corresponding SAIDs"

  - name: "CredentialArtifactsVerified"
    payload: "acdc_said: SAID, tel_event_said: SAID, kel_seal_said: SAID"
    triggers: "Full artifact bundle in a grant is verified — ACDC, TEL event, and KEL seal are consistent"

  - name: "MessageAuthenticated"
    payload: "exn_said: SAID, sender_aid: AID, route: Route"
    triggers: "KRAM authentication passes — exchange message signature is valid against sender's current key state"

rules:
  - "Discloser must provide both Proof of Issuance (PoI) and Proof of Disclosure (PoD)"
  - "A KEL seal anchoring the most compact form SAID provides PoI for all schema-authorized variants"
  - "Credential artifact verification requires ACDC SAID to match TEL event ta field, and TEL event digest to match KEL seal"
  - "KRAM authentication is checked before processing any IPEX exchange message content"
  - "Verification is stateless given a key state snapshot — it takes artifacts and returns valid/invalid"
