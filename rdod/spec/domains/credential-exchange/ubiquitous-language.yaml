# ubiquitous-language.yaml
domain_ref: "credential-exchange"

terms:
  - term: "IPEX"
    synonyms: ["Issuance and Presentation Exchange Protocol"]
    definition: "A uniform protocol for both the issuance and presentation of ACDCs, modeling all exchanges as disclosure from a Discloser to a Disclosee. Orchestrates two concerns: negotiation (protocol flow) and proof (cryptographic verification)."
    invariants:
      - "The difference between exchange types is the information disclosed, not the mechanism"
      - "Uses KERI exchange (exn) message format with specific route (r) field values"
      - "Supports graduated disclosure: metadata, partial, selective, and full"
      - "A single protocol handles both issuance and presentation"
      - "Delegates protocol flow to negotiation, proof mechanics to proof subdomain"
    examples:
      - "Credential issuance: Issuer (discloser) grants credential to issuee (disclosee)"
      - "Credential presentation: Holder (discloser) presents credential to verifier (disclosee)"
    related_terms: ["Discloser", "Disclosee", "Graduated Disclosure"]

  - term: "Exchange Message Construction"
    definition: "Exchange (exn) messages are the generic routed envelope for all peer-to-peer KERI communication. An exn carries a route (r field) that determines the protocol, a payload (a field), and optional embedded content (e field). IPEX credential exchanges, multisig coordination, and endpoint authorization all use exn as their transport envelope."
    invariants:
      - "Route (r) field determines which handler processes the message"
      - "IPEX routes: /ipex/apply, /ipex/offer, /ipex/agree, /ipex/grant, /ipex/admit, /ipex/spurn"
      - "Prior (p) field links to the previous message in a multi-step exchange"
      - "Embedded content (e) field carries credential artifacts in grant messages"
      - "Every exn is signed by the sender's AID for non-repudiable attribution"
    related_terms: ["Exchange Negotiation", "Exchanger"]

events:
  - name: "ExchangeCompleted"
    payload: "exchange_said: SAID, discloser_aid: AID, disclosee_aid: AID, pattern: ExchangePattern"
    triggers: "An IPEX exchange reaches terminal state — admit received (success) or final spurn (rejection)"

rules:
  - "The difference between issuance and presentation is the information disclosed, not the protocol"
  - "IPEX orchestrates negotiation and proof — it does not implement their internals"
