# domain.yaml
template_version: "2.0"
id: "credential-exchange"
name: "Credential Exchange"
description: >
  Share credentials with others — structured negotiation for issuance and
  presentation. The Issuance and Presentation Exchange Protocol (IPEX) unifies
  credential issuance and presentation under a single protocol, modeling all
  exchanges as disclosure from a Discloser to a Disclosee. Delegates protocol
  flow to negotiation and cryptographic proof to the proof subdomain.
version: "0.1.0"
tier: "domain"

source_material:
  - type: document
    reference: "acdc-specification.md — Issuance and Presentation Exchange (IPEX) section"
  - type: document
    reference: "KERIArchGroupIssuance.md — KERI architectures for group issuance, IPEX and KRAM sections"

domain_clients:
  - ref: "domain://credential-lifecycle"
    relationship: "ACDC core domain drives IPEX for credential issuance and presentation exchange"
    via_port: "port://credential-exchange/inbound/exchange-protocol"

subdomains:
  - ref: "domain://credential-exchange/negotiation"
    relationship: "Protocol flow logic — message types, sequencing, exchange patterns"
  - ref: "domain://credential-exchange/proof"
    relationship: "Cryptographic proof mechanics — PoI, PoD, credential artifacts, KRAM"

kernels: []

adjacents:
  - ref: "domain://cesr"
    pattern: "conformist"
    relationship: "CESR primitives (SAID, AID, Indexed Signature) adopted natively for credential artifact verification"
  - ref: "domain://keri-messaging"
    pattern: "conformist"
    relationship: "KERI messaging primitives (exn, qry, rpy) adopted natively"

externals: []

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    IPEX is an orchestrating domain that coordinates two subdomains: negotiation
    (protocol flows) and proof (cryptographic verification). In keripy, these
    concerns are co-located in ipexing.py and exchanging.py but are logically
    separable. Group multisig issuance requires coordination of IPEX messages
    across group members. Message construction, routing, and handler dispatch
    infrastructure is absorbed into the negotiation subdomain.

issues: []

tags: ["exchange", "issuance", "presentation", "disclosure", "protocol", "orchestration"]
