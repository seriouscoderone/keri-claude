# verification.yaml
domain_ref: "credential-exchange"

properties:
  - invariant: "Issuance and presentation flows MUST use the same six message types (apply, offer, agree, grant, admit, spurn) and the same state machine; the only difference between the two is the payload content disclosed in the grant message — issuance includes a new ACDC, presentation includes an existing ACDC"
    term: "IPEX"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(issuance=issuance_flow_strategy(), presentation=presentation_flow_strategy())
        def test_protocol_structural_identity(issuance, presentation):
            assert same_message_types(issuance, presentation), (
                "Issuance and presentation must use the same message types"
            )
            assert same_state_machine(issuance, presentation), (
                "Same state machine governs both flows"
            )
            assert differs_only_in_payload(issuance, presentation), (
                "Only the grant payload content differs between issuance and presentation"
            )
    strategy: "issuance_flow_strategy() x presentation_flow_strategy()"
    notes: "Protocol unification: one mechanism for both issuance and presentation. The grant payload is the sole differentiator."

  - invariant: "Every IPEX message MUST have type field t == 'exn' AND route field r starting with '/ipex/' followed by exactly one of {apply, offer, agree, grant, admit, spurn}; any other route MUST be rejected; route field MUST NOT be empty or null"
    term: "IPEX"
    technique: property-based
    formal:
      language: python
      expression: |
        VALID_IPEX_ROUTES = {'/ipex/apply', '/ipex/offer', '/ipex/agree',
                             '/ipex/grant', '/ipex/admit', '/ipex/spurn'}

        @given(msg=ipex_message_strategy())
        def test_ipex_message_format(msg):
            assert msg.t == 'exn', f"IPEX message type must be 'exn', got '{msg.t}'"
            assert msg.r is not None and len(msg.r) > 0, "Route must not be empty or null"
            assert msg.r in VALID_IPEX_ROUTES, f"Invalid IPEX route: {msg.r}"
    strategy: "ipex_message_strategy() generating all six IPEX route types"
    notes: "Exactly six valid routes. The route field is the message type discriminant."

  - invariant: "A message with route prefix '/ipex/' but an unrecognized action (e.g., '/ipex/revoke', '/ipex/cancel') MUST be rejected; a message with t != 'exn' and an /ipex/ route MUST be rejected"
    term: "IPEX"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(bad_route=st.sampled_from(['/ipex/revoke', '/ipex/cancel', '/ipex/', '/ipex/APPLY']),
               bad_type=st.sampled_from(['icp', 'rot', 'ixn', 'rct']))
        def test_invalid_ipex_messages_rejected(bad_route, bad_type):
            # Invalid route with valid type
            msg1 = build_exn_message(route=bad_route)
            assert not is_valid_ipex_message(msg1), (
                f"Route '{bad_route}' must be rejected"
            )
            # Valid route with invalid type
            msg2 = build_message(t=bad_type, route='/ipex/grant')
            assert not is_valid_ipex_message(msg2), (
                f"Type '{bad_type}' with IPEX route must be rejected"
            )
    strategy: "st.sampled_from for invalid routes and types"
    notes: "Both the route and the type must be valid for an IPEX message to be accepted."

  - invariant: "Every IPEX message MUST be signed by the sender; an unsigned message or a message whose signature does not verify against the sender's current key state MUST be rejected before any further processing"
    term: "IPEX"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(msg=ipex_message_strategy(), tamper=st.booleans())
        def test_signature_required(msg, tamper):
            if tamper:
                msg.signature = None
            if msg.signature is None or not verify_signature(msg, msg.sender_key_state):
                with pytest.raises(ValidationError, match='signature'):
                    validate_ipex_message(msg)
            else:
                validate_ipex_message(msg)  # Must not raise
    strategy: "ipex_message_strategy() x st.booleans() for signature tampering"
    notes: "Signature validation is mandatory before any IPEX message enters processing."

contracts:
  - port_ref: "port://credential-exchange/inbound/exchange-protocol"
    preconditions:
      - formal:
          language: python
          expression: "is_valid_aid(issuer_aid) and is_valid_aid(issuee_aid) and is_valid_acdc(acdc)"
        description: "Both AIDs must be valid and ACDC must be structurally valid"
    postconditions:
      - formal:
          language: python
          expression: |
            result.r == '/ipex/grant'
            and result.type == 'exn'
            and result.acdc.d == acdc.d
        description: "initiate_issuance returns a grant message containing the ACDC"

  - port_ref: "port://credential-exchange/inbound/direct-issuance"
    preconditions:
      - formal:
          language: python
          expression: |
            is_valid_aid(issuer_aid) and is_valid_aid(issuee_aid)
            and is_valid_acdc(acdc) and is_valid_signature(signature)
        description: "Valid AIDs, valid ACDC, and valid signature required"
    postconditions:
      - formal:
          language: python
          expression: |
            result.r == '/ipex/grant'
            and verify_signature(result, signature, issuer_aid)
        description: "Grant message signature verifies against issuer_aid's current key state"
