# ports.yaml
domain_ref: "credential-exchange"

ports:
  # Inbound -- what the parent ACDC domain calls
  - id: "port://credential-exchange/inbound/exchange-protocol"
    type: inbound
    name: "Exchange Protocol"
    semantics: command
    idempotent: false
    contract:
      input: "types://credential-exchange/negotiation#IPEXMessage"
      output: "types://credential-exchange#ExchangeResult"
      errors:
        - "errors://credential-exchange#UnknownExchangeRouteError"
    refs: ["domain://credential-lifecycle"]

  # Direct Issuance port defined in child: port://credential-exchange/negotiation/inbound/direct-issuance
