domain_ref: "credential-exchange/negotiation"

types:
  - name: "IPEXMessage"
    description: "An IPEX protocol message — a specialized exchange message (exn) with route-specific payload structure. Each variant corresponds to one step in the IPEX negotiation flow."
    variants:
      - name: "apply"
        fields:
          - name: "schema_said"
            type: "string"
            required: true
            description: "SAID of the desired credential schema"
          - name: "attributes"
            type: "map"
            required: false
            description: "Requested attributes (optional — issuer decides what to include)"
        invariants:
          - "Route: /ipex/apply"
          - "Sent by disclosee (prospective holder)"
          - "No prior message reference (p field empty)"
      - name: "offer"
        fields:
          - name: "credential_preview"
            type: "map"
            required: true
            description: "Preview of the credential being offered (may be metadata ACDC for chain-link confidentiality)"
        invariants:
          - "Route: /ipex/offer"
          - "Sent by discloser (issuer)"
          - "p field references the apply message's SAID"
      - name: "agree"
        fields:
          - name: "accepted"
            type: "boolean"
            required: true
            description: "Agreement to the offered terms"
        invariants:
          - "Route: /ipex/agree"
          - "Sent by disclosee"
          - "p field references the offer message's SAID"
          - "If chain-link confidentiality: agreement is to contractual terms"
      - name: "grant"
        fields:
          - name: "acdc"
            type: "types://credential-lifecycle#Credential"
            required: true
            description: "The credential being granted"
          - name: "tel_event"
            type: "types://credential-lifecycle/status#TELEvent"
            required: true
            description: "TEL issuance event proving the credential was issued"
          - name: "kel_seal"
            type: "types://cesr/primitives#Seal"
            required: true
            description: "KEL event seal authorizing the TEL event via the issuer's KEL"
        invariants:
          - "Route: /ipex/grant"
          - "Sent by discloser"
          - "MUST bundle all three artifacts: ACDC + TEL event + KEL seal"
          - "p field references agree SAID (negotiated) or empty (direct grant)"
      - name: "admit"
        fields:
          - name: "grant_said"
            type: "string"
            required: true
            description: "SAID of the grant message being admitted"
        invariants:
          - "Route: /ipex/admit"
          - "Sent by disclosee"
          - "p field references the grant message's SAID"
          - "Terminal: no further messages in this thread"
      - name: "spurn"
        fields:
          - name: "spurned_said"
            type: "string"
            required: true
            description: "SAID of the message being rejected"
          - name: "reason"
            type: "string"
            required: false
            description: "Optional rejection reason"
        invariants:
          - "Route: /ipex/spurn"
          - "Sent by either party"
          - "Terminal: no further messages in this thread"
          - "p field references the spurned message's SAID"

  - name: "GrantBundle"
    description: "The three artifacts that MUST be bundled together in an IPEX grant message. This is the proof package that makes a credential verifiable."
    variants:
      - name: "default"
        fields:
          - name: "acdc"
            type: "types://credential-lifecycle#Credential"
            required: true
            description: "The ACDC credential"
          - name: "tel_event"
            type: "types://credential-lifecycle/status#TELEvent"
            required: true
            description: "TEL issuance event"
          - name: "kel_seal"
            type: "types://cesr/primitives#Seal"
            required: true
            description: "KEL event seal authorizing the TEL event"
        invariants:
          - "All three MUST be present — missing any one makes the grant unverifiable"
          - "ACDC SAID must match the TEL event's credential reference"
          - "TEL event must be authorized by the KEL seal"
          - "KEL seal must be verifiable against the issuer's current key state"

  - name: "GrantMessage"
    description: "An IPEX grant exchange message (exn) delivering a credential with its full proof bundle."
    variants:
      - name: "default"
        fields:
          - name: "route"
            type: "string"
            required: true
            description: "IPEX route — always /ipex/grant"
            constraints:
              enum: ["/ipex/grant"]
          - name: "acdc"
            type: "types://credential-lifecycle#Credential"
            required: true
            description: "The ACDC credential being granted"
          - name: "tel_event"
            type: "types://credential-lifecycle/status#TELEvent"
            required: true
            description: "TEL issuance event proving the credential was issued"
          - name: "kel_seal"
            type: "types://cesr/primitives#Seal"
            required: true
            description: "KEL event seal authorizing the TEL event via the issuer's KEL"
        invariants:
          - "MUST bundle all three artifacts — missing any makes the grant unverifiable"
          - "Sent by discloser after agree (negotiated) or directly (direct issuance)"
        builder:
          name: "GrantMessage.builder()"
          required_fields:
            - "route('/ipex/grant') — fixed route value"
            - "acdc(credential) — the ACDC credential being granted"
            - "telEvent(event) — TEL issuance event (upd/bup with ts='issued')"
            - "kelSeal(seal) — KEL interaction event seal authorizing the TEL event"
          invariants:
            - "acdc.said must match tel_event.transaction_acdc_said"
            - "tel_event must be authorized by the kel_seal (seal references same ixn event)"
            - "kel_seal must be verifiable against current issuer key state"

  - name: "OfferPayload"
    description: "Typed payload for an IPEX offer message — the structured content carried in the offer's a field."
    variants:
      - name: "default"
        fields:
          - name: "schema_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the credential schema being offered"
          - name: "credential_preview"
            type: "types://credential-lifecycle#Credential"
            required: true
            description: "Metadata ACDC (or partial credential) previewing what will be granted"
          - name: "terms"
            type: "map"
            required: false
            description: "Chain-link confidentiality terms (rules section content) — present if contractual agreement required"
        invariants:
          - "credential_preview may be a metadata ACDC (empty u field) for chain-link confidentiality"
          - "If terms are present, the disclosee MUST agree before grant is sent"

  - name: "ApplyPayload"
    description: "Typed payload for an IPEX apply message — the structured content carried in the apply's a field."
    variants:
      - name: "default"
        fields:
          - name: "schema_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the desired credential schema"
          - name: "requested_attributes"
            type: "map"
            required: false
            description: "Attribute hints the applicant requests be included (advisory — issuer decides)"
          - name: "message"
            type: "string"
            required: false
            description: "Human-readable request context"
        invariants:
          - "schema_said is the only required field — issuer decides what attributes to include"
        notes: |
          L5-O15: OfferPayload and ApplyPayload were previously typed as 'map'. These typed
          variants make the payload structure explicit for builder construction.

  - name: "NegotiationThread"
    description: "The state of an in-progress IPEX negotiation between two parties. Tracks the message chain and current protocol state."
    variants:
      - name: "default"
        fields:
          - name: "thread_id"
            type: "string"
            required: true
            description: "SAID of the initial message (apply or grant for direct)"
          - name: "state"
            type: "string"
            required: true
            description: "Current IPEX FSM state"
            constraints:
              enum: ["Idle", "Applied", "Offered", "Agreed", "Granted", "Admitted", "Spurned"]
          - name: "discloser_aid"
            type: "string"
            required: true
            description: "AID of the credential holder/issuer (sends offer, grant)"
          - name: "disclosee_aid"
            type: "string"
            required: true
            description: "AID of the credential requester/verifier (sends apply, agree, admit)"
          - name: "messages"
            type: "array[map]"
            required: true
            description: "Ordered message chain with SAIDs and types"
          - name: "grant_bundle"
            type: "types://credential-exchange/negotiation#GrantBundle"
            required: false
            description: "The credential bundle (set after grant step)"
        invariants:
          - "Messages form a SAID chain: each message's p field = prior message's d field"
          - "State transitions follow the IPEX FSM defined in verification.yaml"
          - "Admitted and Spurned are terminal — no further messages accepted"
          - "Role alternation: apply/agree/admit from disclosee; offer/grant from discloser"
        builder:
          name: "NegotiationThread.builder()"
          required_fields:
            - "threadId(said) — SAID of the initial message"
            - "discloser(aid) — AID of the issuer/holder"
            - "disclosee(aid) — AID of the requester/verifier"
            - "initialMessage(msg) — first message in the chain (apply or direct grant)"
          invariants:
            - "Initial state is Idle; transitions to Applied after apply, or Granted after direct grant"
            - "threadId equals the SAID of the initial message (no separate UUID)"
        notes: |
          L5-O13: Spurn-and-restart. When a SpurnMessage is sent or received, the current
          NegotiationThread transitions to the Spurned terminal state. A new negotiation
          requires a new NegotiationThread with a new thread_id (a fresh apply message creates
          a new SAID chain). There is no 'reset' operation — Spurned threads are immutable records.

          L5-O20: v1/v2 ExchangeMessage discrimination. NegotiationThread does not carry the
          protocol version — version is determined by the ExchangeMessage.v field of each message
          in the messages array. v1 messages use rp/e fields; v2 messages use x/ri fields.
          Implementations MUST handle mixed-version threads (rare: v1 apply, v2 grant) by
          inspecting each message's version string independently.

  - name: "AdmitMessage"
    description: "An IPEX admit exchange message (exn) accepting a granted credential."
    variants:
      - name: "default"
        fields:
          - name: "route"
            type: "string"
            required: true
            description: "IPEX route — always /ipex/admit"
            constraints:
              enum: ["/ipex/admit"]
          - name: "grant_said"
            type: "string"
            required: true
            description: "SAID of the grant message being admitted"
        invariants:
          - "Terminal message — no further messages in this exchange thread"
          - "Sent by disclosee after receiving and validating the grant"

  - name: "AgreeMessage"
    description: "An IPEX agree exchange message (exn) accepting an offer's terms."
    variants:
      - name: "default"
        fields:
          - name: "route"
            type: "string"
            required: true
            description: "IPEX route — always /ipex/agree"
            constraints:
              enum: ["/ipex/agree"]
          - name: "offer_said"
            type: "string"
            required: true
            description: "SAID of the offer message being agreed to"
        invariants:
          - "Sent by disclosee to accept the offered terms"
          - "For chain-link confidentiality: agreement is to contractual terms"

  - name: "SpurnMessage"
    description: "An IPEX spurn exchange message (exn) rejecting any prior message in the thread."
    variants:
      - name: "default"
        fields:
          - name: "route"
            type: "string"
            required: true
            description: "IPEX route — always /ipex/spurn"
            constraints:
              enum: ["/ipex/spurn"]
          - name: "rejected_said"
            type: "string"
            required: true
            description: "SAID of the message being rejected"
          - name: "reason"
            type: "string"
            required: false
            description: "Optional human-readable rejection reason"
        invariants:
          - "Terminal message — no further messages in this exchange thread"
          - "Can be sent by either party at any non-terminal state"

  - name: "MessageConstructionInput"
    description: "Parameters for constructing a new IPEX exchange message — pairs the sender AID with the message-type-specific payload."
    variants:
      - name: "default"
        fields:
          - name: "sender_aid"
            type: "string"
            required: true
            description: "AID of the party constructing the message"
          - name: "route"
            type: "string"
            required: true
            description: "Target IPEX route (e.g., /ipex/apply, /ipex/grant)"
            constraints:
              enum: ["/ipex/apply", "/ipex/offer", "/ipex/agree", "/ipex/grant", "/ipex/admit", "/ipex/spurn"]
          - name: "payload"
            type: "map"
            required: true
            description: "Route-specific payload fields (schema_said for apply, acdc+tel+seal for grant, etc.)"
          - name: "prior_said"
            type: "string"
            required: false
            description: "SAID of the prior message in the thread (absent for initial apply or direct grant)"
        invariants:
          - "Route determines which payload fields are required"
          - "sender_aid must have valid key state for signing"

  - name: "EscrowReason"
    description: "Why an IPEX exchange message was escrowed instead of processed immediately."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            description: "Category of missing dependency"
            constraints:
              enum: ["MissingKEL", "MissingTEL", "MissingSchema", "MissingSignatures"]

  - name: "HandlerResponse"
    description: "Result from an IPEX route handler after attempting to process an exchange message."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            description: "Processing outcome"
            constraints:
              enum: ["Accepted", "Escrowed", "Rejected"]
