# errors.yaml
domain_ref: "credential-exchange/negotiation"

# Error catalog for the Credential Exchange Negotiation domain.
# Maps to exception classes in keripy/src/keri/kering.py and raise sites in
# keripy/src/keri/peer/exchanging.py (Exchanger.processEvent) and
# keria/src/keria/app/credentialing.py (credential endpoint handlers).
#
# Severity levels:
#   transient  — condition may self-resolve (escrow and retry)
#   recoverable — requires operator or protocol-level action
#   fatal      — unrecoverable; message is permanently rejected

errors:
  - name: "MissingSignatureError"
    description: "Exchange message signatures do not satisfy the signing threshold"
    cause: "Verified signature indices do not satisfy tholder.satisfy() — insufficient controller or group signatures on the exn message"
    recovery: "escrow"
    escrow_queue: "PSE"
    severity: "transient"
    context:
      - field: "sender_aid"
        type: "string"
        description: "The AID of the exchange message sender"
      - field: "verified_indices"
        type: "array[integer]"
        description: "Indices of signatures that verified successfully"
      - field: "required_threshold"
        type: "string"
        description: "The signing threshold expression that was not satisfied"
      - field: "message_said"
        type: "string"
        description: "The SAID of the partially-signed exchange message"
    related_port: "port://credential-exchange/negotiation/inbound/dispatch-message"

  - name: "MissingDestinationError"
    description: "Exchange message is missing the destination (recipient) field"
    cause: "The 'i' field (destination AID) is missing from the exn message body — cannot route the exchange"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "message_said"
        type: "string"
        description: "The SAID of the exchange message"
      - field: "route"
        type: "string"
        description: "The exchange route (/ipex/apply, /ipex/grant, etc.)"
    related_port: "port://credential-exchange/negotiation/inbound/dispatch-message"

  - name: "ValidationError"
    description: "Exchange message failed structural validation"
    cause: "The exn message body is malformed, missing required essr attachments, has invalid essr digest, expired datetime, or duplicate route registration"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "route"
        type: "string"
        description: "The IPEX route (/ipex/apply, /ipex/offer, /ipex/grant, etc.)"
      - field: "reason"
        type: "string"
        description: "Specific validation failure (missing essr attachment, invalid diger, expired datetime)"
      - field: "message_said"
        type: "string"
        description: "The SAID of the invalid exchange message"
    related_port: "port://credential-exchange/negotiation/inbound/dispatch-message"

  - name: "GrantMissingRegistryError"
    description: "Credential in exchange message references a registry that has not been received"
    cause: "The ACDC embedded in a grant message references a registry REGID not in the local Tevers — the registry inception has not been processed"
    recovery: "escrow"
    severity: "transient"
    context:
      - field: "registry_id"
        type: "string"
        description: "The REGID of the missing registry"
      - field: "credential_said"
        type: "string"
        description: "The SAID of the credential in the grant message"
      - field: "message_said"
        type: "string"
        description: "The SAID of the exchange message"
    related_port: "port://credential-exchange/negotiation/inbound/dispatch-message"

  - name: "MissingSchemaError"
    description: "Credential schema referenced in exchange not found in local cache"
    cause: "The JSON schema SAID referenced by the ACDC in a grant message has not been resolved via data OOBI"
    recovery: "escrow"
    severity: "transient"
    context:
      - field: "schema_said"
        type: "string"
        description: "The SAID of the missing schema"
      - field: "credential_said"
        type: "string"
        description: "The SAID of the credential referencing the schema"
    related_port: "port://credential-exchange/negotiation/inbound/dispatch-message"

  - name: "ExchangeEscrowTimeoutError"
    description: "Escrowed exchange message expired before prerequisites were met"
    cause: "The partially-signed exchange message sat in escrow beyond TimeoutPSE (10 seconds) without collecting sufficient signatures or resolving dependencies"
    recovery: "abort"
    severity: "recoverable"
    context:
      - field: "message_said"
        type: "string"
        description: "The SAID of the expired exchange message"
      - field: "escrow_queue"
        type: "string"
        description: "Which escrow the message was in (PSE)"
      - field: "timeout_seconds"
        type: "integer"
        description: "Duration before expiry (default: 10)"
    related_port: "port://credential-exchange/negotiation/inbound/dispatch-message"

  - name: "ConfigurationError"
    description: "Credential schema validation or configuration error during exchange"
    cause: "The credential schema was not found or the credential fails schema validation when the exchange is being constructed by KERIA"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "schema_said"
        type: "string"
        description: "The SAID of the schema"
      - field: "reason"
        type: "string"
        description: "Configuration failure details"
    related_port: "port://credential-exchange/negotiation/inbound/construct-message"
