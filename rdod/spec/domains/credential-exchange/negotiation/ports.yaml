# ports.yaml
domain_ref: "credential-exchange/negotiation"

ports:
  # Inbound -- what clients call
  - id: "port://credential-exchange/negotiation/inbound/negotiate"
    type: inbound
    name: "Negotiation Protocol"
    contract: "initiate_issuance(issuer_aid, issuee_aid, acdc) -> GrantMessage; initiate_presentation(discloser_aid, disclosee_aid, acdc, variant) -> OfferMessage; process_apply(apply_msg) -> OfferMessage | SpurnMessage; process_offer(offer_msg) -> AgreeMessage | SpurnMessage; process_agree(agree_msg) -> GrantMessage | SpurnMessage; process_grant(grant_msg) -> AdmitMessage; process_spurn(spurn_msg) -> void"
    protocol: "method-call"
    refs: ["domain://credential-exchange"]

  - id: "port://credential-exchange/negotiation/inbound/direct-issuance"
    type: inbound
    name: "Direct Issuance"
    contract: "grant(issuer_aid, issuee_aid, acdc, signature) -> GrantMessage; admit(grant_msg, disclosee_signature) -> AdmitMessage"
    protocol: "method-call"
    refs: ["domain://credential-exchange"]

  - id: "port://credential-exchange/negotiation/inbound/construct-message"
    type: inbound
    name: "Message Construction"
    contract: "build_apply(identifier: AID, recipient: AID, schema: SAID, attributes: map?) -> ExchangeMessage; build_offer(identifier: AID, recipient: AID, metadata_acdc: ACDC, terms: map) -> ExchangeMessage; build_agree(identifier: AID, recipient: AID, offer_said: SAID) -> ExchangeMessage; build_grant(identifier: AID, recipient: AID, acdc: ACDC, tel_event: TELEvent, kel_seal: EventSeal) -> ExchangeMessage; build_admit(identifier: AID, recipient: AID, grant_said: SAID) -> ExchangeMessage; build_spurn(identifier: AID, recipient: AID, rejected_said: SAID, reason: string?) -> ExchangeMessage"
    protocol: "method-call"
    refs: ["domain://credential-exchange"]

  - id: "port://credential-exchange/negotiation/inbound/dispatch-message"
    type: inbound
    name: "Message Dispatch"
    contract: "dispatch(exn_message: ExchangeMessage) -> Result<HandlerResponse, EscrowReason>; lookup_response(inbound_said: SAID) -> ExchangeMessage?"
    protocol: "method-call"
    refs: ["domain://credential-exchange"]

  # Outbound -- what negotiation calls
  - id: "port://credential-exchange/negotiation/outbound/message-transport"
    type: outbound
    name: "Exchange Message Transport"
    contract: "send_exn(recipient_aid: AID, exn_message: ExchangeMessage) -> Result; receive_exn(sender_aid: AID) -> ExchangeMessage"
    protocol: "method-call"
    refs: ["transport"]
