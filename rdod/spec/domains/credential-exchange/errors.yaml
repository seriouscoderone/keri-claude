domain_ref: "credential-exchange"

errors:
  - name: "UnknownExchangeRouteError"
    description: "Exchange message has an unrecognized IPEX route"
    cause: "The exn message route does not match any registered IPEX route (/ipex/apply, /ipex/offer, /ipex/agree, /ipex/grant, /ipex/admit, /ipex/spurn)"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "route"
        type: "string"
        description: "The unrecognized route"
      - field: "message_said"
        type: "string"
        description: "SAID of the rejected message"
    related_port: "port://credential-exchange/inbound/exchange-protocol"

  - name: "ExchangeAuthenticationError"
    description: "IPEX message failed KRAM authentication at the exchange-protocol gateway — invalid signature, stale datetime, or replay detected. Detailed authentication errors delegated to errors://credential-exchange/proof#AuthenticationError."
    cause: "The message signature does not verify against the sender's current key state, or the message datetime is outside the KRAM timeliness window, or the message SAID was already accepted (replay)"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "message_said"
        type: "string"
        description: "SAID of the message that failed authentication"
      - field: "reason"
        type: "string"
        description: "Authentication failure reason (invalid_signature, stale_datetime, replay)"
    related_port: "port://credential-exchange/inbound/exchange-protocol"

  - name: "CredentialNotIssuedError"
    description: "Credential is not in Issued state — cannot be granted"
    cause: "The credential's TEL state is NotIssued or Revoked — only Issued credentials can be granted via IPEX"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "credential_said"
        type: "string"
        description: "SAID of the credential"
      - field: "current_state"
        type: "string"
        description: "The credential's current lifecycle state"
    related_port: "port://credential-exchange/outbound/credential-lifecycle"

  - name: "RegistryNotFoundError"
    description: "Registry for the credential is not available in local storage"
    cause: "The credential-lifecycle domain does not have the registry inception event for the credential's ri field"
    recovery: "escrow"
    severity: "transient"
    context:
      - field: "registry_said"
        type: "string"
        description: "REGID of the missing registry"
      - field: "credential_said"
        type: "string"
        description: "SAID of the credential referencing the registry"
    related_port: "port://credential-exchange/outbound/credential-lifecycle"
