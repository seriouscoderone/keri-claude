domain_ref: "identity/thresholds"

types:
  - name: "GroupCoordination"
    description: "The state of an in-progress multi-signature coordination. Tracks accumulated signatures toward threshold satisfaction across group members."
    variants:
      - name: "default"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the event being coordinated"
          - name: "group_aid"
            type: "string"
            required: true
            description: "The group identifier being managed"
          - name: "required_threshold"
            type: "types://cesr/primitives#SigningThreshold"
            required: true
            description: "The threshold that must be satisfied"
          - name: "accumulated_signatures"
            type: "array[types://cesr/primitives#IndexedSignature]"
            required: true
            description: "Indexed signatures collected so far — each signature's index maps to a member's key position in the group"
          - name: "satisfied"
            type: "boolean"
            required: true
            description: "Whether the accumulated signatures meet the threshold"
          - name: "remaining_members"
            type: "array[string]"
            required: false
            description: "Member AIDs that have not yet signed"
        invariants:
          - "All signatures MUST be for the same event SAID — divergent SAIDs are rejected"
          - "satisfied = threshold.satisfy(collected_indices)"
          - "Coordination times out if not satisfied within the configured period"

  - name: "WitnessConfiguration"
    description: "Complete configuration of the witness pool for an identifier — the witness AID list and the TOAD (witness threshold). Owned by the thresholds subdomain because it governs threshold satisfaction and configuration validation."
    variants:
      - name: "default"
        fields:
          - name: "witnesses"
            type: "array[WitnessAID]"
            required: true
            description: "Ordered set of unique non-transferable witness AIDs"
            constraints:
              description: "AIDs must be unique; duplicates are rejected"
          - name: "toad"
            type: "integer"
            required: true
            description: "Threshold of Accountable Duplicity (TOAD) — minimum witness receipts required for event acceptance"
            constraints:
              min: 0
        invariants:
          - "0 <= toad <= len(witnesses) — TOAD must be satisfiable given the witness count"
          - "Witness AIDs must be unique — no duplicates permitted"
          - "Witness AIDs MUST be non-transferable (B prefix for Ed25519, 1AAA for secp256k1, etc.) — normative MUST per KERI spec. Witness receipt verification requires extracting the public key directly from the AID, which is only possible with basic (non-transferable) prefixes."
          - "An empty witness list (witnesses=[]) must have toad=0"
          - "toad=0 with non-empty witnesses is valid — unwitnessed operation mode even though witnesses exist"
    builder:
      description: "Construct a WitnessConfiguration with validated witness list and TOAD."
      required_fields:
        - witnesses: "array of non-transferable AIDs — each must be a valid WitnessAID"
        - toad: "integer TOAD — must satisfy 0 <= toad <= len(witnesses)"
      construction_invariants:
        - "Reject if any witness AID is transferable (wrong prefix code)"
        - "Reject if duplicate AIDs appear in the list"
        - "Reject if toad > len(witnesses)"
        - "Reject if toad < 0"

  - name: "WitnessRemoveList"
    description: "List of Witness AIDs to be removed from the current Witness list during a Rotation Event. Field label: br."
    variants:
      - name: "default"
        invariants:
          - "Each AID must currently be in the Witness list"
          - "Removals are processed before additions (ba)"
          - "A given AID MUST NOT appear more than once"

  - name: "WitnessAddList"
    description: "List of Witness AIDs to be appended to the current Witness list during a Rotation Event. Field label: ba."
    variants:
      - name: "default"
        invariants:
          - "Additions are processed after removals (br)"
          - "A given AID MUST NOT appear more than once"
          - "AIDs already in the Witness list after removals are skipped"
