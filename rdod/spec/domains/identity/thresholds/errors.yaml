# errors.yaml
domain_ref: "identity/thresholds"

# Error catalog for the Identity Thresholds domain.
# Maps to exception classes in keripy/src/keri/kering.py and
# raise sites in keripy/src/keri/core/eventing.py (kever state validation,
# Tholder parsing) and keripy/src/keri/core/coring.py (Tholder class).
#
# Severity levels:
#   transient  — condition may self-resolve (escrow and retry)
#   recoverable — requires operator or protocol-level action
#   fatal      — unrecoverable; event is permanently rejected

errors:
  - name: "ThresholdNotSatisfiedError"
    description: "Provided signatures do not satisfy the signing threshold"
    cause: "tholder.satisfy(indices) returned False — the set of verified signature indices does not meet the threshold expression (simple count, fractional weight, or combination)"
    recovery: "escrow"
    escrow_queue: "PSE"
    severity: "transient"
    context:
      - field: "threshold"
        type: "string"
        description: "The threshold expression (integer, fractional weight list, or combination)"
      - field: "verified_indices"
        type: "array[integer]"
        description: "Indices of signatures that verified"
      - field: "key_count"
        type: "integer"
        description: "Total number of signing keys"
    related_port: "port://identity/thresholds/inbound/threshold-satisfaction"

  - name: "NextThresholdNotSatisfiedError"
    description: "Rotation event signatures do not satisfy the prior next threshold"
    cause: "ntholder.satisfy(ondices) returned False — the exposed signature indices (ondex values matching pre-committed next key digests) do not meet the previous establishment event's next threshold commitment"
    recovery: "escrow"
    escrow_queue: "PSE"
    severity: "transient"
    context:
      - field: "prior_next_threshold"
        type: "string"
        description: "The prior establishment event's next threshold expression (nt field)"
      - field: "exposed_indices"
        type: "array[integer]"
        description: "Ondex values of signatures that match pre-committed digests"
      - field: "prior_next_digest_count"
        type: "integer"
        description: "Number of pre-committed next key digests"
    related_port: "port://identity/thresholds/inbound/dual-threshold"

  - name: "InvalidThresholdError"
    description: "Threshold expression is malformed or invalid"
    cause: "Threshold specification does not parse as a valid integer, fractional weight list, or combination — sith < 1, sith > key count, nsith < 0, or nsith > next digest count"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "threshold_value"
        type: "string"
        description: "The invalid threshold expression"
      - field: "reason"
        type: "string"
        description: "Why the threshold is invalid (e.g., 'sith less than 1', 'sith exceeds key count')"
      - field: "key_count"
        type: "integer"
        description: "Number of keys the threshold should apply to"
    related_port: "port://identity/thresholds/inbound/threshold-satisfaction"

  - name: "WitnessThresholdNotSatisfiedError"
    description: "Witness receipts do not satisfy the witness accountability threshold (TOAD)"
    cause: "Number of verified unique witness receipts < toader.num — the event has insufficient witness accountability to be accepted"
    recovery: "escrow"
    escrow_queue: "PWE"
    severity: "transient"
    context:
      - field: "receipt_count"
        type: "integer"
        description: "Number of verified witness receipts"
      - field: "toad"
        type: "integer"
        description: "Required witness threshold (TOAD)"
      - field: "witness_count"
        type: "integer"
        description: "Total number of witnesses in the witness set"
    related_port: "port://identity/thresholds/inbound/witness-configuration"

  - name: "InvalidWitnessThresholdError"
    description: "TOAD value is invalid for the current witness set"
    cause: "TOAD (bt field) is too large or too small for the witness count — must satisfy: 0 <= toad <= witness_count and when witnesses exist, toad must meet minimum quorum"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "toad"
        type: "integer"
        description: "The invalid TOAD value"
      - field: "witness_count"
        type: "integer"
        description: "Number of witnesses in the witness set"
      - field: "reason"
        type: "string"
        description: "Why the TOAD is invalid (e.g., 'toad too large for wits', 'toad too small for wits')"
    related_port: "port://identity/thresholds/inbound/witness-configuration"

  - name: "GroupCoordinationTimeoutError"
    description: "Multi-sig group operation did not collect sufficient signatures within the escrow timeout"
    cause: "Escrow timeout expired before all required group members signed the event — the group coordination protocol failed to reach the threshold"
    recovery: "abort"
    severity: "recoverable"
    context:
      - field: "prefix"
        type: "string"
        description: "The group AID prefix"
      - field: "collected"
        type: "integer"
        description: "Number of member signatures collected before timeout"
      - field: "required"
        type: "string"
        description: "The threshold that needed to be satisfied"
      - field: "timeout_seconds"
        type: "integer"
        description: "The escrow timeout duration"
    related_port: "port://identity/thresholds/inbound/dual-threshold"
