# ubiquitous-language.yaml
domain_ref: "identity/thresholds"

terms:
  - term: "Signing Threshold"
    synonyms: ["Current Threshold", "kt field", "tholder [keripy]", "SignatureThreshold [keriox]"]
    definition: "The threshold expression that determines the minimum satisficing subset of current signing keys required to produce a valid signature on any event. Stored in the kt field of establishment events and parsed into a Tholder (keripy) or SignatureThreshold (keriox) instance for evaluation."
    invariants:
      - "Must be satisfiable given the number of keys in the signing key list (k field)"
      - "Can be a simple integer M (M-of-N) or a fractionally weighted threshold"
      - "A valid event must have signatures satisfying this threshold from the current signing keys"
      - "For rotations, signatures must satisfy both the new signing threshold AND the prior next threshold (dual threshold)"
      - "In keripy: Tholder(sith=kt_value) with satisfy(indices) -> bool"
      - "In keriox: SignatureThreshold::Simple(m) or SignatureThreshold::Weighted(weights) with enough(indices) -> bool"
    examples:
      - "Simple: kt='2' means 2-of-3 when there are 3 signing keys"
      - "Fractional: kt=['1/2', '1/2', '1/2'] means each key has weight 1/2, sum of any two >= 1"
      - "Single key: kt='1' — trivial threshold, the single key must sign"
    related_terms: ["Rotation Threshold", "Dual Threshold", "Fractionally Weighted Threshold"]

  - term: "Rotation Threshold"
    synonyms: ["Next Threshold", "nt field", "ntholder [keripy]"]
    definition: "The threshold expression that determines the minimum satisficing subset of next (pre-rotated) keys required to authorize a rotation event. Declared in the nt field of the establishment event that commits the next key digests. Evaluated at the time of the NEXT rotation, not at declaration time."
    invariants:
      - "Must be satisfiable given the number of next key digests (n field)"
      - "Can be a simple integer or fractionally weighted, using the same Tholder/SignatureThreshold type as signing threshold"
      - "The rotation event must satisfy both the newly current signing threshold (kt) AND this prior next threshold (nt)"
      - "Applies at the time of the next rotation — the nt from the PRIOR establishment event constrains the current rotation"
      - "In keripy: ntholder = Tholder(sith=nt_value) stored on the Kever, carried forward until next establishment event"
    examples:
      - "Simple: nt='2' means 2-of-3 next keys must sign the rotation"
      - "Fractional: nt=['1/2', '1/2', '1/2'] for weighted rotation authorization"
      - "Higher rotation threshold than signing: kt='1', nt='2' — easy to sign, harder to rotate"
    related_terms: ["Signing Threshold", "Dual Threshold", "Fractionally Weighted Threshold"]

  - term: "Dual Threshold"
    synonyms: ["Double Threshold Requirement", "valSigsWigsDel [keripy]"]
    definition: "The requirement that a rotation event's signatures must satisfy both the newly current signing threshold (kt from this rotation) and the prior next threshold (nt from the previous establishment event). This is the mechanism that cryptographically enforces the pre-rotation commitment — it ensures that the new signing keys include a sufficient subset of the previously pre-committed keys."
    invariants:
      - "Both thresholds must be independently satisfied for a valid rotation"
      - "The signing threshold (kt) is checked against the new signing key indices (indices)"
      - "The rotation threshold (nt) is checked against the prior next key indices (ondices) — the mapping from new signing keys to prior pre-committed keys"
      - "An inception event has only a signing threshold — no prior nt exists yet"
      - "The dual check prevents an attacker from bypassing pre-rotation by choosing an easy new kt while ignoring the prior nt"
    examples:
      - "Prior nt='2' and new kt='2': the rotation must have signatures satisfying both 2-of-N requirements independently"
      - "Prior nt=['1/1', '0', '0'] and new kt='2': key[0] alone satisfies nt, but 2 signatures needed for kt"
    related_terms: ["Signing Threshold", "Rotation Threshold", "Fractionally Weighted Threshold"]

  - term: "Fractionally Weighted Threshold"
    synonyms: ["Weighted Threshold", "weighted sith"]
    definition: "A threshold expression where each key is assigned a fractional weight, and the sum of weights of signing keys must reach or exceed 1 for the threshold to be satisfied. Enables unequal key authority — some keys can have more weight than others. Expressed as a list of fraction strings in the kt or nt field."
    invariants:
      - "Expressed as a list of fractions, one per key, in the same order as the key list"
      - "Each fraction represents the weight of the corresponding key's signature"
      - "The sum of weights of the actual signers must be >= 1"
      - "Enables unequal key authority — a high-weight key alone may satisfy the threshold while multiple low-weight keys are needed together"
      - "In keripy: Tholder parses fraction strings (e.g., '1/2') into Fraction objects; tholder.weighted == True"
      - "In keriox: SignatureThreshold::Weighted(Vec<Vec<(u64, u64)>>) where each tuple is (numerator, denominator)"
      - "Nesting in keriox allows clause-based thresholds: outer Vec is AND of clauses, inner Vec is OR within a clause"
    examples:
      - "['1/2', '1/2', '1/2'] — any 2-of-3 keys suffice (each weighs 1/2, sum of any two = 1)"
      - "['1/1', '1/2', '1/2'] — first key alone suffices (weight 1), or both other keys together (1/2 + 1/2 = 1)"
      - "['1/3', '1/3', '1/3', '1/3'] — any 3-of-4 keys (three thirds sum to 1)"
    related_terms: ["Signing Threshold", "Rotation Threshold", "Dual Threshold"]

  - term: "Witness Threshold"
    synonyms: ["Accountability Threshold", "Tally", "TOAD", "bt field", "toader [keripy]"]
    definition: "The minimum number of witness receipts required for an event to be considered sufficiently accountable. Specified in the bt field of establishment events. Unlike signing and rotation thresholds, the witness threshold is always a simple integer (not fractionally weighted)."
    invariants:
      - "Must be a non-negative integer no greater than the number of witnesses in the witness list"
      - "Determines the M in M-of-N witness accountability"
      - "Can be changed at rotation along with the witness set"
      - "A higher threshold increases security (more witnesses must agree) but requires more witness availability"
      - "In keripy: toader = Tholder(sith=bt_value) — reuses the same Tholder class but always with a simple integer"
      - "In keriox: toad field on WitnessConfig — a plain u64, not a SignatureThreshold"
      - "TOAD stands for Threshold of Accountable Duplicity"
    examples:
      - "bt='3' with 4 witnesses means 3-of-4 must receipt for accountability"
      - "Changed from bt='3' to bt='4' during a rotation that adds a fifth witness"
      - "bt='0' for an AID with no witnesses (NoBackers config trait)"
    related_terms: ["Witness Configuration", "Witness List", "Signing Threshold"]

  - term: "Threshold Satisfaction"
    synonyms: ["tholder.satisfy() [keripy]", "SignatureThreshold.enough() [keriox]"]
    definition: "Checking whether a set of verified signature indices satisfies a signing threshold expression. The threshold can be a simple integer (M-of-N) or a fractionally weighted expression. Returns True if the provided indices meet the threshold requirement."
    invariants:
      - "Simple threshold: len(valid_indices) >= M where threshold is M"
      - "Weighted threshold: sum of weights at valid_indices >= 1.0"
      - "The Tholder instance stores the parsed threshold expression from kt or nt fields"
      - "Tholder.size gives the minimum number of keys needed to possibly satisfy the threshold"
      - "The same satisfy() mechanism is used for both signing threshold (tholder) and rotation threshold (ntholder)"
    examples:
      - "Simple: tholder(sith='2'), indices=[0, 2] -> 2 >= 2 -> True"
      - "Weighted: tholder(sith=['1/2','1/2','1/2']), indices=[0, 1] -> 0.5 + 0.5 = 1.0 >= 1 -> True"
      - "Insufficient: tholder(sith='3'), indices=[0, 2] -> 2 < 3 -> False -> escrow to PSE"
    related_terms: ["Signing Threshold", "Rotation Threshold", "Dual Threshold", "Fractionally Weighted Threshold"]

  - term: "Witness Configuration"
    synonyms: ["WitnessConfig [keriox]", "witness config"]
    definition: "The current witness list paired with the receipt threshold (TOAD). Provides the accountability layer of key state — which witnesses must receipt events and how many receipts are required. Updated atomically at establishment events when witnesses are added, removed, or the threshold changes."
    invariants:
      - "Witness list is an ordered set of witness AIDs (non-transferable prefixes)"
      - "TOAD (bt) must be satisfiable given the witness count: 0 <= bt <= len(witnesses)"
      - "Provides enough_receipts() check — whether the witness threshold is met for a given event"
      - "Set at inception in the b field; modified at rotation via br (remove) and ba (add) fields"
      - "In keripy: Kever holds wits (list of witness AIDs) and toader (Tholder for bt)"
      - "In keriox: WitnessConfig struct with witnesses Vec and toad u64"
      - "Witness changes at rotation are ordered: removals (br) applied before additions (ba)"
    examples:
      - "In keripy: wits=['BGKV...', 'BJfu...', 'BAPv...'] with toader=Tholder(sith='2') requiring 2-of-3 receipts"
      - "In keriox: WitnessConfig { witnesses: [...], toad: 2 }"
      - "After rotation removing one witness and adding two: wits list updated, bt possibly increased"
    related_terms: ["Witness Threshold", "Witness List"]

  - term: "Witness List"
    synonyms: ["Witness Set", "b field", "Witness Pool", "wits [keripy]"]
    definition: "The ordered list of witness AIDs designated by the controller in establishment events. Witnesses provide availability and consistency via the first-seen rule. Set at inception in the b field and modified at rotation via the br (remove) and ba (add) fields."
    invariants:
      - "Designated by the controller, not self-selected by witnesses"
      - "Set at inception in the b field; modified at rotation via br (remove) and ba (add) fields"
      - "The witness threshold (bt) must be satisfiable given the number of witnesses"
      - "Witness changes are part of the key state and take effect at the establishment event"
      - "Each witness AID is typically a non-transferable identifier (B prefix)"
      - "Removals (br) are applied before additions (ba) during rotation"
      - "Duplicate witness AIDs are not permitted in the list"
    examples:
      - "Initial witness list of 4: b=['BGKV6v93ue...', 'BJfueFAYc7...', 'BAPv2Mnoi...', 'BA4PSatfQM...']"
      - "After rotation: one witness removed via br=['BJfu...'], two added via ba=['BNew1...', 'BNew2...']"
      - "Single witness setup: b=['BGKV...'] with bt='1' requiring the one witness receipt"
    related_terms: ["Witness Threshold", "Witness Configuration"]

  - term: "Counselor"
    synonyms: []
    definition: "Tracks multi-sig group event approval progress. Monitors whether all required group members have provided their partial signatures for a pending group event."
    invariants:
      - "Agent owns one Counselor instance"
      - "Monitor queries Counselor to detect group operation completion"
      - "Works with Multiplexor to collect exchange messages by SAID"
    examples:
      - "3-of-5 group rotation: Counselor tracks 3 partial sigs arrived -> marks complete"
    related_terms: ["Threshold Satisfaction", "Partially-Signed Escrow", "Signature Accumulation"]

  - term: "Partially-Signed Escrow"
    synonyms: ["PSE", ".pses [keripy]", "PartiallySignedEscrow [keriox]"]
    definition: "Holds events that have been verified for sequence order but whose controller signatures do not yet satisfy the signing threshold. Accumulates additional signatures over time as they arrive from other multi-sig participants. Events are reprocessed when new signatures are added."
    invariants:
      - "Triggered when signature verification passes for at least one sig but tholder.satisfy(indices) returns False"
      - "Indexed by prefix + sn in the partially-signed escrow subdatabase [.pses in keripy]"
      - "Signatures are accumulated: new arrivals of the same event (same SAID) merge their signatures into the existing escrow entry"
      - "Default timeout: 3600 seconds (keripy TimeoutPSE), configurable via EscrowConfig.partially_signed_timeout (keriox)"
      - "On reprocessing, if signatures now satisfy the threshold, the event advances to witness/delegation checks (may cascade to PWE or PDE)"
    examples:
      - "3-of-5 multi-sig: first participant submits event with 1 signature -> PSE. Second participant adds signature -> still 2 < 3 -> stays in PSE. Third arrives -> 3 >= 3 -> threshold satisfied -> advance to witness check."
      - "After threshold satisfaction, witness count is insufficient -> event moves from PSE to PWE"
    related_terms: ["Escrow Cascade", "Signature Accumulation", "Escrow Timeout", "Threshold Satisfaction"]

  - term: "Signature Accumulation"
    synonyms: ["Partial Signature Merge"]
    definition: "The process of merging newly-arriving signatures into an existing partially-signed escrow entry for the same event. When a multi-sig participant signs and submits the same event (same SAID), their signature is appended to the existing signature set rather than creating a duplicate escrow entry."
    invariants:
      - "Signatures are matched by event SAID -- only signatures for the exact same event are merged"
      - "The controller signature store [.sigs in keripy] uses append semantics, not replace"
      - "After accumulation, the updated signature set is re-checked against the threshold"
      - "Idempotent: re-submitting the same signature from the same index is a no-op"
      - "Both controller signatures (Sigers) and witness receipts (Wigers) can accumulate over time"
    examples:
      - "3-of-5 multi-sig: participant A signs -> controller signature store has [sig_A]. Participant B signs -> store has [sig_A, sig_B]. Participant C signs -> store has [sig_A, sig_B, sig_C] -> threshold satisfied."
      - "Same participant re-submits -> signature at same index already present -> no change"
    related_terms: ["Partially-Signed Escrow", "Idempotent Logging", "Threshold Satisfaction"]

events:
  - name: "SigningThresholdSatisfied"
    payload: "aid: AID, threshold: Threshold, satisfied_indices: [int], key_count: int"
    triggers: "A set of verified signature indices satisfies the signing threshold (kt)"

  - name: "SigningThresholdNotMet"
    payload: "aid: AID, threshold: Threshold, valid_indices: [int], key_count: int"
    triggers: "Verified signature indices do not satisfy the signing threshold — event routes to escrow"

  - name: "RotationThresholdSatisfied"
    payload: "aid: AID, threshold: Threshold, satisfied_ondices: [int], next_key_count: int"
    triggers: "A set of ondex-matched indices satisfies the prior rotation threshold (nt) during a rotation"

  - name: "DualThresholdSatisfied"
    payload: "aid: AID, signing_threshold: Threshold, rotation_threshold: Threshold, indices: [int], ondices: [int]"
    triggers: "Both signing and rotation thresholds are independently satisfied for a rotation event"

  - name: "WitnessThresholdMet"
    payload: "aid: AID, sn: int, receipt_count: int, toad: int"
    triggers: "Sufficient witness receipts have been collected to meet the witness threshold (bt)"

  - name: "WitnessThresholdNotMet"
    payload: "aid: AID, sn: int, receipt_count: int, toad: int"
    triggers: "Verified witness receipt count is below the witness threshold — event routes to partially-witnessed escrow"

  - name: "WitnessSetChanged"
    payload: "aid: AID, removed: [WitnessAID], added: [WitnessAID], new_witness_count: int, new_toad: int"
    triggers: "A rotation event modifies the witness list or witness threshold"

rules:
  - "A signing threshold (kt) must be satisfiable: for simple thresholds, M <= len(keys); for weighted, at least one subset of keys has sum >= 1"
  - "A rotation threshold (nt) must be satisfiable: for simple thresholds, M <= len(next_digests); for weighted, at least one subset has sum >= 1"
  - "A witness threshold (bt) must be a non-negative integer: 0 <= bt <= len(witnesses)"
  - "Rotation events must satisfy BOTH the new signing threshold (kt) AND the prior rotation threshold (nt) — the dual threshold requirement"
  - "Threshold satisfaction uses the same Tholder.satisfy() mechanism for all three threshold types"
  - "For weighted thresholds, the sum of weights of actual signers must be >= 1"
  - "Witness threshold is always a simple integer — fractionally weighted witness thresholds are not supported"
  - "Witness list modifications at rotation are ordered: removals (br) applied first, then additions (ba)"
