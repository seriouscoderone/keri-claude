# ubiquitous-language.yaml
domain_ref: "identity/anchoring"

terms:
  - term: "Interaction Event"
    synonyms: ["ixn"]
    definition: "A non-establishment event that commits external data to the KEL via seals without changing key state. Field order: v, t, d, i, s, p, a."
    invariants:
      - "Does not modify key state — signing keys, thresholds, and witnesses remain unchanged"
      - "Must be signed by a threshold-satisficing subset of current signing keys"
      - "Hash-chained to predecessor via p field"
      - "The a field contains a list of seals (anchors) binding external data"
      - "Can be superseded by a rotation event at the same sequence number during recovery"
    examples:
      - "Interaction at s=1 committing a delegation seal: a=[{i: delegatee_AID, s: '0', d: delegatee_inception_SAID}]"
      - "Interaction committing an ACDC credential issuance digest"
    related_terms: ["Seal", "Non-Establishment Event", "Key State"]

  # Inherits: "Seal" from domain://identity
  - term: "Seal"
    synonyms: ["Anchor"]
    specializes: "Seal"
    definition: "In the context of the anchoring subdomain, a seal is a cryptographic digest or reference embedded in the a field of an event that binds external data to the KEL. Specializes the parent definition with the commitment perspective: seals in interaction events are the primary mechanism for committing external data, and delegation seals bind delegated establishment events."
    invariants:
      - "Commits to external data via digest — the data itself is not in the KEL"
      - "Types include: digest seal, event seal (i, s, d fields), merkle tree root seal, latest establishment event seal"
      - "Seals in interaction events are the primary mechanism for committing external data"
      - "Delegation seals in delegator events bind to delegated inception/rotation events"
    examples:
      - "Event seal: {i: 'EHqSsH1Imc...', s: '0', d: 'EHqSsH1Imc...'} — references a specific event of another AID"
      - "Digest seal committing to an ACDC credential"
    related_terms: ["Interaction Event", "Delegation Seal", "SAID"]

  - term: "Digest Seal"
    synonyms: ["SealDigest [keripy]"]
    definition: "A seal containing only a digest (d field) that commits to external data by its hash. The simplest seal type."
    invariants:
      - "Contains a single d field with the digest of the committed data"
      - "The digest algorithm is encoded in the CESR prefix of the d value"
      - "Verification requires the original data to recompute the digest"
    examples:
      - "{d: 'EHqSsH1Im...'} — Blake3-256 digest committing to external data"
    related_terms: ["Seal", "Event Seal"]

  - term: "Event Seal"
    synonyms: ["SealEvent [keripy]"]
    definition: "A seal that references a specific event in another AID's KEL by prefix (i), sequence number (s), and SAID (d)."
    invariants:
      - "Contains three fields: i (AID prefix), s (sequence number), d (event SAID)"
      - "Uniquely identifies a specific event in a specific KEL"
      - "Used for delegation seals, cross-KEL references, and event-level commitments"
    examples:
      - "{i: 'EHqSsH1Im...', s: '0', d: 'EHqSsH1Im...'} — references inception of another AID"
    related_terms: ["Seal", "Digest Seal", "Delegation Seal"]

  - term: "Seal Security Properties"
    synonyms: []
    definition: "The security characteristics of seals vary based on the event type containing them. All seals are cryptographically equivalent in verification procedure — the digest comparison is identical regardless of seal location. However, seals in establishment events have stronger security guarantees than seals in interaction events."
    invariants:
      - "Verification procedure is identical regardless of seal location (establishment or interaction event)"
      - "Establishment event seals are stronger: signed by pre-rotated keys (first-time use), bound to key state transitions, cannot be created by an attacker with only current signing keys"
      - "Interaction event seals are weaker: signed by current signing keys only, an attacker with compromised current keys can create interaction events with seals"
      - "A delegation seal MAY appear in an interaction event — interaction events are less secure than rotation events for this purpose"
    examples:
      - "Delegation approval in a rotation event: attacker must compromise both current AND pre-rotated keys to forge"
      - "Delegation approval in an interaction event: attacker with only current keys could forge"
    related_terms: ["Seal", "Interaction Event", "Digest Seal", "Event Seal"]

  - term: "Interaction Event Construction"
    definition: "The domain-driven assembly of interaction events (ixn) that commit data to the KEL without changing key state. The anchor section (a field) carries cryptographic seals binding external data to the identifier's event sequence. Implementations SHOULD provide typed builders for common seal types."
    invariants:
      - "Interaction events do not change key state — no kt, k, nt, n, bt, b fields"
      - "Prior (p) field links to the previous event's SAID"
      - "Anchor (a) field contains a list of seal objects"
      - "Common seal types: digest seal, event seal, merkle root seal, last establishment seal, backer seal, typed digest seal (all defined in cesr/primitives)"
    examples:
      - "Anchoring builder: InteractionEvent.builder().prior(priorSAID).seal(DigestSeal.of(dataSAID)).seal(EventSeal.of(pre, sn, said)).build()"
    related_terms: ["Data Anchoring", "Seal Types"]

events:
  - name: "InteractionCreated"
    payload: "aid: AID, sn: int, seals: [Seal], said: SAID"
    triggers: "Controller creates an interaction event committing seals to the KEL"

  - name: "SealAnchored"
    payload: "aid: AID, sn: int, seal_type: SealType, seal_digest: Digest"
    triggers: "A seal is embedded in an interaction event, binding external data to the KEL"

rules:
  - "Interaction events do not modify key state — they only commit data"
  - "The a field must contain a list of seals (may be empty)"
  - "Each seal type has a specific field structure — digest seal (d), event seal (i, s, d), etc."
  - "Interaction events can be superseded by rotation events during recovery"
  - "Seals commit to data by digest — the original data is not stored in the KEL"
