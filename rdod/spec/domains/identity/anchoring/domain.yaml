# domain.yaml
template_version: "2.0"
id: "identity/anchoring"
name: "Data Anchoring"
description: >
  Interaction events — binding data to your identifier via cryptographic seals. Interaction
  events (ixn) are non-establishment events that anchor external data to the KEL without
  changing key state. They use the a (anchor) field to embed cryptographic digests, event
  references, and merkle tree roots that bind external data to the AID's verifiable history.
  Seal types include digest seals, event seals (i, s, d fields), merkle tree root seals,
  and delegation seals. Interaction events are the primary mechanism for anchoring ACDC
  credentials, delegation approvals, and other external commitments.
version: "0.1.0"
tier: "domain"

source_material:
  - type: document
    reference: "keri-specification.md — sections: Interaction Event Message Body, Seal Types, Anchoring"
  - type: document
    reference: "KERI_WP_2.x.web.md — sections: Interaction Events, Seals"
  - type: document
    reference: "keripy — eventing.py (interact method, seal construction), coring.py (SealDigest, SealEvent, SealLast)"
  - type: document
    reference: "keriox — keriox_core/src/event/event_data/interaction.rs (InteractionEvent, seal types)"

domain_clients:
  - ref: "domain://identity"
    relationship: "Parent identity domain delegates interaction event creation and seal construction to this subdomain"
    via_port: "port://identity/anchoring/inbound/data-anchoring"

subdomains: []

kernels:
  - ref: "external://cryptographic-primitives"
    source: "Blake3-256/SHA-256 (seal digest computation), Ed25519 (interaction event signing)"
    relationship: "Seal digests are kernel types — the anchoring subdomain uses digest computation to create content commitments"

adjacents: []

externals: []

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    In keripy, interaction events are created by the interact() method on Hab/Habery. Seal
    construction uses SealDigest, SealEvent, and SealLast namedtuples from coring.py. In keriox,
    InteractionEvent carries seal data in its payload. Interaction events are the primary mechanism
    for anchoring ACDC credential issuance/revocation, delegation approval seals, and arbitrary
    data commitments. They are lightweight because they do not change key state.

issues: []

tags: ["interaction", "ixn", "seal", "anchor", "data-anchoring", "digest-seal", "event-seal"]
