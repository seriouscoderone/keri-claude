# ports.yaml
domain_ref: "identity/anchoring"

ports:
  # Inbound — what clients call
  - id: "port://identity/anchoring/inbound/data-anchoring"
    type: inbound
    name: "Data Anchoring"
    semantics: command
    idempotent: false
    contract:
      input: "types://cesr/primitives#Seal"
      output: "types://identity/establishment#InteractionEvent"
      errors:
        - "errors://identity/anchoring#AnchoringNotPermittedError"
        - "errors://identity/anchoring#NonTransferableAnchoringError"
        - "errors://identity/anchoring#InvalidSealError"
    refs: ["domain://identity"]

  - id: "port://identity/anchoring/inbound/seal-query"
    type: inbound
    name: "Seal Query"
    semantics: query
    idempotent: true
    contract:
      input: "AID prefix and sequence number"
      output: "array of types://cesr/primitives#Seal"
      errors: []
    refs: ["domain://identity"]
