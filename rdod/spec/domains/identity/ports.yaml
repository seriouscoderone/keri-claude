# ports.yaml
domain_ref: "identity"

ports:
  # Inbound — what clients call
  - id: "port://identity/inbound/identity-management"
    type: inbound
    name: "Identity Management"
    contract: "create_inception(config: InceptionConfig) -> InceptionEvent; create_rotation(aid: AID, new_keys: [PublicKey], new_next: [PublicKey]) -> RotationEvent; create_interaction(aid: AID, seals: [Seal]) -> InteractionEvent"
    protocol: "method-call"
    refs: ["domain://identity"]

  - id: "port://identity/inbound/event-processing"
    type: inbound
    name: "Event Processing"
    contract: "process_event(event: KeyEvent, signatures: [Signature], receipts: [Receipt]) -> Result<EventValidated, ValidationError>; escrow_event(event: KeyEvent) -> Result<Escrowed, EscrowError>"
    protocol: "method-call"
    refs: ["domain://identity"]

  - id: "port://identity/inbound/state-query"
    type: inbound
    name: "State Query"
    contract: "get_key_state(aid: AID) -> KeyState; get_kel(aid: AID) -> KEL; get_event(aid: AID, sn: int) -> KeyEvent; get_signing_keys(aid: AID) -> [PublicKey]; get_witness_set(aid: AID) -> [WitnessAID]"
    protocol: "method-call"
    refs: ["domain://identity"]

  # Outbound — Repository interfaces for persistence

  - id: "port://identity/outbound/event-repository"
    type: outbound
    name: "Event Repository"
    contract: >
      append_event(aid: AID, event: KeyEvent, first_seen_number: int) -> Result<void, DuplicateError>;
      get_event_by_sn(aid: AID, sn: int) -> KeyEvent?;
      get_event_by_said(said: SAID) -> KeyEvent?;
      get_kel(aid: AID) -> [KeyEvent];
      get_first_seen_ordinal(aid: AID, event_said: SAID) -> int?;
      append_signatures(aid: AID, event_said: SAID, signatures: [Signature]) -> void;
      get_signatures(aid: AID, event_said: SAID) -> [Signature];
      append_witness_receipts(aid: AID, event_said: SAID, receipts: [Receipt]) -> void;
      get_witness_receipts(aid: AID, event_said: SAID) -> [Receipt];
      put_key_state(aid: AID, key_state: KeyState) -> void;
      get_key_state(aid: AID) -> KeyState?
    protocol: "repository"
    refs: ["persistence"]
    invariants:
      - "Events are append-only — once written for a given AID and sequence number, immutable"
      - "First-seen ordinal is assigned exactly once per event and never changes"
      - "Signatures accumulate — new signatures are appended, never overwrite existing"
      - "Witness receipts accumulate — new receipts are appended, never overwrite existing"
      - "Key state cache may be overwritten (it is derived from the KEL, not source-of-truth)"
      - "get_kel returns events ordered by ascending sequence number"

  - id: "port://identity/outbound/escrow-repository"
    type: outbound
    name: "Escrow Repository"
    contract: >
      escrow(escrow_type: EscrowType, aid: AID, sn: int, event: KeyEvent, escrowed_at: datetime) -> void;
      get_escrowed(escrow_type: EscrowType, aid: AID) -> [EscrowedEvent];
      remove(escrow_type: EscrowType, aid: AID, sn: int) -> void;
      get_all_by_type(escrow_type: EscrowType) -> [EscrowedEvent]
    protocol: "repository"
    refs: ["persistence"]
    types:
      EscrowType:
        enum: [OutOfOrder, PartiallySigned, PartiallyWitnessed, PartiallyDelegated, LikelyDuplicitous, Misfit]
      EscrowedEvent:
        fields: {escrow_type: EscrowType, aid: AID, sn: int, event: KeyEvent, escrowed_at: datetime}
    invariants:
      - "Escrowed events are temporary — they are promoted to the KEL or pruned at timeout"
      - "Each event is in exactly one escrow type at a time"
      - "Removal is idempotent — removing a non-existent entry is a no-op"
      - "get_all_by_type supports sweep processing for timeout-based cleanup"
