# ubiquitous-language.yaml
domain_ref: "identity"

terms:
  # Inherits: "KEL" from domain://identity
  - term: "KEL"
    synonyms: ["Key Event Log"]
    specializes: "KEL"
    definition: "In the context of the identity subdomain, the KEL is the complete control history for a single AID — the append-only, hash-chained event log from which key state is deterministically derived. Extends the parent definition with identity-specific structural properties: the KEL forms a directed acyclic graph (DAG) where forks only occur via superseding recovery, and each event carries a first-seen number assigned at acceptance time."
    invariants:
      - "Forms a directed acyclic graph (DAG) — forks only occur via superseding recovery"
      - "First-seen number (fn) is assigned by the storage layer at acceptance time — a local database concept, not part of the event"
    examples:
      - "A KEL starting with icp at s=0, followed by ixn at s=1, then rot at s=2"
      - "A delegated KEL starting with dip at s=0"
    related_terms: ["KERL", "Key Event", "AID", "Key State", "First-seen Number"]

  # Inherits: "Key State" from domain://identity
  - term: "Key State"
    synonyms: ["Current Key State", "Identifier State"]
    specializes: "Key State"
    definition: "In the context of the identity subdomain, key state is the complete authoritative configuration for an AID at a given point in its KEL. Specializes the parent definition with the explicit rule that interaction events (ixn) do not alter key state, and enumerates the full field set including configuration traits (c)."
    invariants:
      - "Only establishment events (icp, rot, dip, drt) modify key state"
      - "Interaction events (ixn) do not alter key state — they advance sn but are invisible to key state computation"
      - "Full field set: signing keys (k), next key digests (n), signing threshold (kt), rotation threshold (nt), witness list (b), witness threshold (bt), configuration traits (c)"
    examples:
      - "After inception: initial signing keys, initial next key digests, initial witness set"
      - "After rotation: new signing keys (from previous next set), new next key digests, possibly modified witness set"
    related_terms: ["Establishment Event", "Signing Keys", "Next Key Digests", "Signing Threshold", "Rotation Threshold"]

  # Inherits: "Establishment Event" from domain://identity (identical definition — parent owns this term)

  - term: "AID"
    synonyms: ["Autonomic Identifier", "Identifier Prefix"]
    specializes: "domain://cesr/primitives"
    definition: "An Autonomic Identifier — a self-certifying, self-managing cryptographic identifier. The AID prefix is either a qualified public key (non-transferable) or the SAID of the inception event (transferable/self-addressing). The identity domain owns the semantic meaning: an AID represents a controller's root of trust, its key state history (KEL), and all authority derived from it. CESR owns the encoding (qb64 prefix format)."
    invariants:
      - "Every AID is backed by a KEL that proves its current key state"
      - "Transferable AIDs can rotate keys via rotation events — the AID persists across rotations"
      - "Non-transferable AIDs cannot rotate — the public key IS the identifier permanently"
      - "Self-certifying: no trusted third party needed to verify the binding between AID and keys"
      - "Self-managing: the controller autonomously manages key state without external authority"
    examples:
      - "Transferable (self-addressing): EDP1vjs81wNMFBx9MF2v-d7xQEYpLbSGZkm2Ub6bvKFm (E prefix = Blake3-256 SAID)"
      - "Non-transferable: BFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH (B prefix = Ed25519 public key)"
    related_terms: ["KEL", "Key State", "Inception Event", "Identifier Type Dimensions"]

  - term: "Inception Event"
    synonyms: ["icp"]
    definition: "The first event in a KEL that creates an AID and establishes its initial key state. Field order: v, t, d, i, s, kt, k, nt, n, bt, b, c, a."
    invariants:
      - "Always at sequence number s=0"
      - "Has no prior event digest (no p field)"
      - "The i field (AID) is either the inception public key (basic prefix) or the SAID of the inception event (self-addressing)"
      - "For self-addressing AIDs, the d and i fields must have the same value"
      - "There is exactly one inception event per KEL"
    examples:
      - "Self-addressing inception: d and i both equal 'EPR7FWsN3tOM8PqfMap2FRfF4MFQ4v3ZXjBUcMVtvhmB'"
    related_terms: ["AID", "Key State", "Establishment Event", "Self-Addressing Identifier"]

  - term: "Rotation Event"
    synonyms: ["rot"]
    definition: "An establishment event that changes the key state of an AID by rotating signing keys and committing to new next keys. Field order: v, t, d, i, s, p, kt, k, nt, n, bt, br, ba, c, a."
    invariants:
      - "Must satisfy dual threshold — both new signing threshold (kt) and prior next threshold (nt)"
      - "New signing keys (k) must include the unblinded prior next keys"
      - "Hash-chained to predecessor via p field (prior event SAID)"
      - "Can modify witness set via br (removed) and ba (added) fields"
    examples:
      - "Rotation at s=2: new keys from prior pre-commitment, prior witnesses pruned via br, new witnesses grafted via ba"
    related_terms: ["Key State", "Pre-rotation Commitment", "Establishment Event", "Dual Threshold"]

  - term: "SAID"
    synonyms: ["Self-Addressing Identifier", "d field"]
    specializes: "domain://cesr/primitives"
    definition: "A self-referential content digest computed over the serialized event body using the SAID protocol. Appears in the d field of every event."
    invariants:
      - "Computed by replacing the d field with dummy '#' characters, serializing, hashing, then inserting the digest"
      - "The SAID uniquely identifies the exact content of the event"
      - "Serialization kind (JSON, CBOR, MGPK, CESR) affects the SAID value"
    examples:
      - "'EPR7FWsN3tOM8PqfMap2FRfF4MFQ4v3ZXjBUcMVtvhmB' — Blake3-256 digest with 'E' prefix"
    related_terms: ["Version String", "Prior Event Digest", "Self-Addressing Identifier"]

  - term: "Identifier Operational Constraints"
    synonyms: ["Configuration Traits", "c field"]
    definition: "A fifth dimension of identifier type that constrains what operations an identifier is allowed to perform. Set via the configuration traits (c field) in establishment events. Some traits are inception-only (immutable), others can be toggled in rotation events. These constraints enforce security policies and delegation governance at the protocol level."
    invariants:
      - "Inception-only traits (EO, DND, DID) cannot be changed after inception"
      - "Toggleable traits (RB, NRB) can switch between rotation events"
      - "When both RB and NRB appear in the same event, the last one in the list is enforced"
      - "Configuration traits are cumulative — once set at inception, inception-only traits persist forever"
    related_terms: ["Identifier Type Dimensions", "Establishment Only", "Do Not Delegate", "Delegate Is Delegator", "Registrar Backers"]

  - term: "Establishment Only"
    synonyms: ["EO trait"]
    definition: "An inception-only configuration trait that prohibits interaction events (ixn) for this identifier. All events in the KEL must be establishment events (inception or rotation), each signed by freshly pre-rotated keys. This prevents key exposure risk from reusing signing keys across multiple non-establishment events."
    invariants:
      - "Set via 'EO' in the c field of the inception event"
      - "Cannot be removed or overridden after inception"
      - "No ixn events allowed — validators MUST reject interaction events for AIDs with this trait"
      - "Every event requires fresh pre-rotated keys — maximizes key hygiene"
    examples:
      - "High-security root identifier: {c: ['EO', 'DND']} — establishment-only, cannot delegate"
    related_terms: ["Identifier Operational Constraints"]

  - term: "Do Not Delegate"
    synonyms: ["DND trait"]
    definition: "An inception-only configuration trait that prevents this identifier from acting as a delegator. No delegated inception (dip) events may reference this AID as their delegator. This limits delegation depth and prevents unauthorized sub-delegation."
    invariants:
      - "Set via 'DND' in the c field of the inception event"
      - "Cannot be removed after inception"
      - "Validators MUST reject any dip event that names this AID as delegator"
    examples:
      - "Leaf identifier in delegation hierarchy: {c: ['DND']} — can be delegated but cannot delegate further"
    related_terms: ["Identifier Operational Constraints", "Identifier Delegation Model"]

  - term: "Delegate Is Delegator"
    synonyms: ["DID trait"]
    definition: "An inception-only configuration trait that grants delegated AIDs equivalence to their delegator for validation purposes. Enables horizontal scaling of signing infrastructure by treating delegates as interchangeable with the delegator."
    invariants:
      - "Set via 'DID' in the c field of the inception event"
      - "Cannot be removed after inception"
      - "Delegated AIDs treated equivalent to delegator in all validation contexts"
    related_terms: ["Identifier Operational Constraints", "Identifier Delegation Model"]

  - term: "Registrar Backers"
    synonyms: ["RB trait", "NRB trait"]
    definition: "A toggleable configuration trait that switches the backer list from witness AIDs to ledger registrar AIDs. When active, the b field contains registrar identifiers instead of witness identifiers, and backer seals reference registrar entries. Can be toggled on (RB) or off (NRB) in rotation events."
    invariants:
      - "RB activates registrar backers; NRB deactivates them"
      - "Can be toggled in any rotation event"
      - "When both RB and NRB appear in the same event's c field, the last one wins"
      - "Changes the semantic meaning of the b and bt fields from witnesses to registrars"
    related_terms: ["Identifier Operational Constraints", "Identifier Witnessing Model"]

  - term: "Identifier Abandonment"
    synonyms: ["Abandoned AID"]
    definition: "An identifier whose controller has deliberately relinquished control by submitting a rotation event with an empty next key digest list (n field = []). Distinct from non-transferable: a non-transferable AID was NEVER capable of rotation (set at inception), while an abandoned AID WAS transferable but chose to terminate its lifecycle. No further key events are permitted after abandonment."
    invariants:
      - "Triggered by rotation event (rot/drt) with empty n field (n: []) and nt: '0'"
      - "Distinct from non-transferable inception where n is empty at inception"
      - "No further events of any type are permitted after abandonment"
      - "The final rotation's keys remain the permanent key binding"
      - "Abandonment is irreversible — the identifier cannot be recovered"
    examples:
      - "Graceful decommission: controller rotates with {n: [], nt: '0'} — signals permanent retirement"
    related_terms: ["Identifier Transferability", "Identifier Type Dimensions"]

  - term: "Escrow Type Pattern"
    synonyms: ["Escrow Structure"]
    definition: "The common structure shared by all escrow types. Every escrow is defined by four elements: (1) a trigger condition that causes an event to enter the escrow, (2) a storage location where the escrowed event is held, (3) a timeout after which the event is pruned, and (4) a reprocessing trigger that causes the event to be re-validated through the pipeline."
    invariants:
      - "Trigger condition: the specific validation failure that diverts an event into this escrow (e.g., sn > expected for OOE, insufficient sigs for PSE)"
      - "Storage: a named partition (Out-of-Order, Partially-Signed, Partially-Witnessed, Partially-Delegated, Likely Duplicitous, Delegable Event, Misfit Event) indexed by AID prefix + sn or prefix + digest"
      - "Timeout: a configurable duration (default 1200s for OOE, 3600s for most others) after which the event is pruned"
      - "Reprocessing trigger: the external event that causes re-validation — either a notification or a periodic sweep"
      - "On reprocessing: the event is fully re-validated — not assumed valid. It may be accepted, remain escrowed, or cascade to a different escrow type."
      - "Exception: Likely Duplicitous Escrow has no reprocessing trigger — events are permanent forensic evidence"
      - "Exception: Misfit Event Escrow has no automatic reprocessing — events must be re-submitted from a local source"
    examples:
      - "OOE pattern: trigger=sn>expected, storage=Out-of-Order escrow, timeout=1200s, reprocess=when prior event accepted"
      - "PSE pattern: trigger=insufficient sigs, storage=Partially-Signed escrow, timeout=3600s, reprocess=when new signature arrives for same SAID"
      - "PWE pattern: trigger=insufficient witness receipts, storage=Partially-Witnessed escrow, timeout=3600s, reprocess=when witness receipt arrives"
    related_terms: ["Escrow Cascade", "Escrow Timeout", "Escrow Processing Order"]

  - term: "Escrow Cascade"
    synonyms: ["Escrow State Machine"]
    definition: "The flow of events between escrow queues based on what validation step fails. Events progress through escrows as their blocking conditions resolve, potentially visiting multiple escrow types before final acceptance."
    invariants:
      - "Out-of-Order -> accepted (when prior event arrives)"
      - "Partially-Signed -> accepted OR -> Partially-Witnessed (if sigs pass but witness threshold fails) OR -> Partially-Delegated (if sigs pass but delegation missing)"
      - "Partially-Witnessed -> accepted (when witness receipts arrive)"
      - "Partially-Delegated -> accepted (when delegator's approval event arrives) OR -> Partially-Witnessed (if delegation resolves but witnesses still insufficient)"
      - "Likely Duplicitous -> permanent storage (forensic evidence, never auto-resolved)"
      - "Escrow processing order matters: OOE first, then receipt escrows, then PSE, then PWE, then PDE"
    examples:
      - "Multi-sig rotation: arrives with 1-of-3 signatures -> PSE. Second sig arrives -> reprocess -> 2-of-3 passes -> now check witnesses -> insufficient -> PWE. Witness receipts arrive -> reprocess -> accept."
      - "Delegated inception: arrives before delegator's ixn -> PDE. Delegator's ixn arrives with seal -> reprocess -> signatures pass, witnesses pass -> accept."
    related_terms: ["Escrow Processing Order", "Out-of-Order Escrow", "Partially-Signed Escrow", "Partially-Witnessed Escrow", "Partially-Delegated Escrow", "Likely Duplicitous Escrow"]

  - term: "Out-of-Order Escrow"
    synonyms: ["OOE"]
    definition: "Holds events whose prior event in the KEL has not yet been received. The event's sequence number is greater than the next expected sn, so the hash-chain cannot be verified yet. Events are automatically reprocessed when the missing prior event arrives and is accepted to the KEL."
    invariants:
      - "Triggered when sn > expected_sn for a known prefix, or when the prefix is unknown and the event is not an inception"
      - "Indexed by AID prefix and sequence number in the Out-of-Order escrow"
      - "Reprocessed when the prior event for the same prefix is accepted into the KEL"
      - "Default timeout: 1200 seconds (configurable)"
      - "Events are fully re-validated through the pipeline on reprocessing -- not assumed valid"
    examples:
      - "Event at sn=5 arrives but sn=4 is missing -> escrow to OOE. When sn=4 is accepted, sn=5 is reprocessed."
      - "Events at sn=5, sn=6, sn=7 all arrive before sn=4 -> all escrowed to OOE -> accepting sn=4 triggers cascade reprocessing of sn=5, then sn=6, then sn=7"
    related_terms: ["Escrow Cascade", "Escrow Timeout", "Escrow Processing Order"]

  - term: "Escrow Processing Order"
    synonyms: []
    definition: "The defined sequence in which escrow queues are drained during each processing sweep. Order matters because resolving one escrow type may produce events that enter another escrow type."
    invariants:
      - "Order: OOE first, then receipt/witness escrows, then PSE, then PWE, then PDE"
      - "Escrow processing order MUST be: OOE first (releases sequence-gapped events), then PSE (releases signature-deficient events), then PWE (releases witness-deficient events), then PDE (releases delegation-pending events). Order matters because each resolution may cascade into the next escrow type."
      - "Each sweep iterates the full queue for each escrow type before moving to the next type"
      - "Implementations may use notification-driven processing instead of explicit sweep ordering, provided the dependency order is respected"
    examples:
      - "OOE sweep releases event at sn=4 -> this triggers PSE to re-check sn=4 (if it was also partially signed) -> PSE passes -> PWE check -> all pass -> accepted"
    related_terms: ["Escrow Cascade", "Out-of-Order Escrow", "Partially-Signed Escrow"]

  - term: "Escrow Timeout"
    synonyms: []
    definition: "Configurable per-escrow-type duration after which an unresolved escrowed event is pruned (removed) from its queue. Prevents unbounded escrow growth from events whose dependencies will never resolve."
    invariants:
      - "OOE default: 1200 seconds (20 minutes)"
      - "PSE default: 3600 seconds (1 hour)"
      - "PWE default: 3600 seconds (1 hour)"
      - "LDE default: 3600 seconds (1 hour); typically preserved longer in practice"
      - "Timeout is checked during each processing sweep: if (now - escrowed_datetime) > timeout, the entry is pruned"
      - "All timeouts are configurable per deployment"
    examples:
      - "Event escrowed to OOE at T=0. At T=1200 (20 min later), the sweep finds it expired and prunes it."
      - "Deployment with aggressive timeouts: 300 seconds for OOE instead of the default 1200"
    related_terms: ["Out-of-Order Escrow", "Partially-Signed Escrow", "Partially-Witnessed Escrow"]

  - term: "KEL Repository"
    synonyms: ["Guarded Event Repository"]
    definition: "The guarded repository that protects the KEL. Not just storage — every write passes through a validation guard that enforces the KERI protocol's acceptance rules. The guard calls domain-specific checkers (signature verification from identity/thresholds, witness receipting from accountability, delegation approval from delegation, duplicity detection from integrity) and produces one of three outcomes: Accept (write to KEL), Escrow (write to pending queue), or Reject (refuse the write). The KEL Repository IS the KERI protocol — the acceptance rules are what make it a KERI log, not just an append-only database. Escrow is part of this repository, not a separate concern — it's the 'pending writes' queue for events the guard said 'not yet' to."
    invariants:
      - "The KEL is NEVER written to directly — all writes go through the guard"
      - "The guard calls domain-specific checkers — it does not implement the checks itself"
      - "Three outcomes: Accept (event appended, domain event published), Escrow (event queued by blocking condition), Reject (event refused)"
      - "Escrow is part of the repository — the guard's 'not yet' response stores the event for later re-evaluation"
      - "Reprocessing re-enters the guard — escrowed events are fully re-validated, not assumed valid"
      - "The raw persistence layer (domain://externals/persistence) is an adapter — the guard is domain logic that wraps it"
      - "This pattern applies identically to the TEL Repository in credential-lifecycle"
    examples:
      - "Event arrives → guard checks signatures (identity/thresholds) → insufficient → Escrow to PSE → later: new signature arrives → guard re-checks → threshold satisfied → checks witnesses (accountability) → TOAD met → checks delegation (delegation) → seal found → Accept → written to KEL"
      - "Event arrives → guard checks signatures → valid → checks witnesses → insufficient → Escrow to PWE (cascaded from 'not yet' at the witness check)"
      - "Event arrives → guard checks signatures → invalid → Reject → error returned"
    related_terms: ["Escrow Type Pattern", "Escrow Cascade", "Escrow Processing Order", "KEL Storage Schema"]

  - term: "KEL Storage Schema"
    synonyms: ["Event Database"]
    definition: "The partitioned storage organization inside the KEL Repository. Separates events, indexes, signatures, receipts, and metadata into distinct stores, each optimized for its access pattern. This is the raw persistence layer that the guard writes to — not accessed directly by domain logic."
    invariants:
      - "Event store: serialized event bytes indexed by prefix + digest — the primary event store"
      - "KEL sequence index: mapping prefix + sn to event digest — ordered access by sequence number"
      - "First-seen log: mapping prefix + fn to event digest — reception-order replay"
      - "Controller signature store: indexed signatures per event, indexed by prefix + digest — insertion-ordered, append-only"
      - "Witness signature store: indexed signatures per event, indexed by prefix + digest — insertion-ordered, append-only"
      - "Non-transferable receipt store: witness receipts per event, indexed by prefix + digest — insertion-ordered, append-only"
      - "Event source record store: per event, indexed by prefix + digest — local vs remote classification"
      - "Timestamp store: event datetime stamps per event, indexed by prefix + digest"
      - "Key state cache: cached key state snapshots per AID, indexed by prefix — computed from KEL, cached for fast lookup"
    examples:
      - "Looking up event at sn=5 for prefix P: sequence index[P, 5] -> digest D, then event store[P, D] -> event bytes"
      - "Accumulating signatures: controller signature store[P, D].add(sig) — appends to set, idempotent if signature already present"
    related_terms: ["Database Key Patterns", "First-Seen Ordering", "Idempotent Logging"]

  - term: "First-Seen Number"
    synonyms: ["fn", "first-seen ordinal"]
    definition: "A strictly monotonically increasing integer ordinal assigned to each event upon its first acceptance into a KEL copy. Unlike the sequence number (sn) which is part of the event itself, the fn is a local database concept — assigned by the storage layer at acceptance time."
    invariants:
      - "Assigned by the database upon first acceptance — not part of the event message"
      - "Starts at 0 for the first accepted event of a given prefix"
      - "Increments by exactly 1 for each subsequently accepted event"
      - "Different KEL copies may assign different fn values to the same event"
      - "fn >= sn always holds (fn accounts for superseded events that occupy fn slots)"
    examples:
      - "Event at sn=5 might have fn=7 if two superseded events were first-seen at earlier fn values"
      - "fn=0 is always the inception event (sn=0)"
    related_terms: ["KEL Storage Schema", "Sequence Number"]

  - term: "Idempotent Logging"
    synonyms: []
    definition: "The property that logging an already-accepted event is a safe no-op. Late-arriving signatures, witness receipts, or duplicate event messages merge into the existing log entry without creating duplicates or corrupting the KEL."
    invariants:
      - "Event store uses put-if-not-exists — writing an existing event is a no-op"
      - "Signature stores (controller and witness) append new signatures to the existing set — duplicates are ignored"
      - "Receipt store appends new receipts to the existing set — duplicates are ignored"
      - "First-seen ordinal is assigned only once on initial acceptance"
      - "Timestamp is recorded only on first acceptance"
      - "Local source record overwrites remote, but never the reverse"
    examples:
      - "Event accepted with 2-of-3 sigs. Third sig arrives later: the third sig is appended to the controller signature store but the event bytes are unchanged"
      - "Event reprocessed from escrow after missing witness receipt arrives: signatures already in the controller signature store are not duplicated"
    related_terms: ["KEL Storage Schema", "First-Seen Number"]

  - term: "Database Key Patterns"
    synonyms: ["Digest Key", "Sequence Key"]
    definition: "The two primary key construction patterns for addressing data in the KEL storage schema. A digest key concatenates prefix and event digest for content-addressed lookup. A sequence key concatenates prefix and sequence number for sequence-ordered access."
    invariants:
      - "Digest key (prefix + digest) provides content-addressed lookup by event identity"
      - "Sequence key (prefix + sn) provides sequence-ordered access by position in KEL"
      - "Digest key is used for: event store, controller signatures, witness signatures, receipts, event source records, timestamps, first-seen ordinals"
      - "Sequence key is used for: KEL sequence index"
      - "Both patterns produce fixed-length binary keys suitable for B+ tree indexing"
    examples:
      - "Digest key('EABC...', 'EDEF...') — lookup event bytes, signatures, or receipts for a specific event"
      - "Sequence key('EABC...', 5) — lookup the event digest at sequence number 5 for prefix EABC"
    related_terms: ["KEL Storage Schema", "First-Seen Number"]

  - term: "Identifier Type Dimensions"
    definition: "Every KERI identifier is characterized by five orthogonal dimensions that combine to define its security model, governance structure, and operational capabilities. These dimensions are expressed in the specification through field values in the inception event, but represent first-class domain concepts that implementations SHOULD expose through typed construction interfaces."
    invariants:
      - "The five dimensions are: Transferability, Delegation, Witnessing, Signing Model, and Operational Constraints"
      - "Dimensions are set at inception and constrain all subsequent events"
      - "Non-transferable identifiers cannot produce rotation events"
      - "Delegated identifiers require delegator approval for all establishment events"
    related_terms: ["Identifier Transferability", "Identifier Delegation Model", "Identifier Witnessing Model", "Identifier Signing Model", "Identifier Construction", "Identifier Operational Constraints"]

  - term: "Identifier Transferability"
    synonyms: ["Transferable vs Non-transferable AID"]
    definition: "Determines whether an identifier can rotate its keys. A Transferable identifier includes next key digest commitments (pre-rotation) enabling future key rotation and recovery. A Non-transferable identifier has no next key commitments — its key binding is permanent and it cannot recover from compromise."
    invariants:
      - "Transferable: n field contains one or more next key digests, nt field specifies next threshold"
      - "Non-transferable: n field is empty list, nt field is '0'"
      - "Non-transferable identifiers MUST NOT produce rot or drt events"
      - "Witnesses typically use non-transferable identifiers (their public key IS their identifier)"
    examples:
      - "Transferable: {kt: '1', k: ['<pubkey>'], nt: '1', n: ['<next-digest>']} — can rotate"
      - "Non-transferable: {kt: '1', k: ['<pubkey>'], nt: '0', n: []} — permanent key binding"
    related_terms: ["Identifier Type Dimensions", "Pre-rotation Commitment"]

  - term: "Identifier Delegation Model"
    synonyms: ["Self-sovereign vs Delegated AID"]
    definition: "Determines whether an identifier operates independently or under a delegator's authority. A Self-sovereign identifier has no delegator — it is its own root of trust. A Delegated identifier includes a delegator AID and requires the delegator's approval (via KEL seal) for every establishment event."
    invariants:
      - "Self-sovereign: inception uses icp event type, no di field"
      - "Delegated: inception uses dip event type, di field contains delegator's AID"
      - "Delegated rotation uses drt event type (not rot)"
      - "Delegator must commit a seal in their own KEL approving each delegated establishment event"
    examples:
      - "Self-sovereign: {t: 'icp', ...} — independent root of trust"
      - "Delegated: {t: 'dip', di: '<delegator-aid>', ...} — requires delegator approval"
    related_terms: ["Identifier Type Dimensions", "Delegation Authorization"]

  - term: "Identifier Witnessing Model"
    synonyms: ["Witnessed vs Unwitnessed AID"]
    definition: "Determines whether an identifier's key events require witness receipts for accountability. A Witnessed identifier designates a set of witnesses and a witness threshold (TOAD) — events are not considered fully established until sufficient witnesses have receipted them. An Unwitnessed identifier has no witness requirements."
    invariants:
      - "Witnessed: b field contains one or more witness AIDs, bt field specifies threshold >= 1"
      - "Unwitnessed: b field is empty list, bt field is '0'"
      - "Witness threshold (TOAD) must satisfy: 0 < bt <= len(b)"
      - "Witnesses use non-transferable AIDs"
      - "Witness set can be modified during rotation (br = remove, ba = add)"
    examples:
      - "Witnessed: {b: ['<wit1>', '<wit2>', '<wit3>'], bt: '2'} — needs 2-of-3 receipts"
      - "Unwitnessed: {b: [], bt: '0'} — no witness accountability"
    related_terms: ["Identifier Type Dimensions", "Witness Threshold"]

  - term: "Identifier Signing Model"
    synonyms: ["Single-sig vs Multi-sig AID"]
    definition: "Determines how many keys must sign to authorize actions for this identifier. A Single-sig identifier has one key and a threshold of 1. A Multi-sig identifier has multiple keys with a threshold expression defining how many (or which combination) must sign."
    invariants:
      - "Single-sig: kt field is '1' and k field contains exactly one key"
      - "Multi-sig: kt field is a threshold expression (integer > 1, fractional weight list, or combination)"
      - "Threshold can be simple (e.g., '2' meaning 2-of-N) or weighted (e.g., ['1/2', '1/2', '1/2'] for fractional weights)"
      - "All signing operations must satisfy the threshold — no exceptions"
    examples:
      - "Single-sig: {kt: '1', k: ['<key1>']} — one key signs everything"
      - "Multi-sig 2-of-3: {kt: '2', k: ['<key1>', '<key2>', '<key3>']} — any 2 must sign"
      - "Weighted: {kt: ['1/2', '1/2', '1/2'], k: ['<k1>', '<k2>', '<k3>']} — fractional weights"
    related_terms: ["Identifier Type Dimensions", "Signing Threshold"]

  - term: "Identifier Construction"
    definition: "The domain-driven assembly of a KERI identifier through its type dimensions. Implementations SHOULD provide typed construction interfaces (Builder pattern, fluent API, factory methods) that make each dimension explicit rather than exposing raw field map manipulation. The builder enforces dimension constraints, handles SAID computation, and ensures canonical field ordering."
    invariants:
      - "Construction produces an inception event (icp or dip) that establishes all five dimensions"
      - "All subsequent events are constrained by the inception dimensions"
      - "SAID computation happens at build time — d and i fields are placeholders until finalized"
      - "Field ordering follows canonical spec order per message type"
    examples:
      - "Builder: Identity.builder().transferable().witnessed(wits, toad).multiSig(threshold, keys).build()"
      - "Factory: Identity.nonTransferable(key) — creates a simple non-transferable AID"
      - "Factory: Identity.delegated(delegator).transferable().witnessed(wits, toad).build()"
    related_terms: ["Identifier Type Dimensions"]

  - term: "Misfit Event Escrow"
    synonyms: ["MFE"]
    definition: "Holds events received from remote sources that target locally-owned, locally-witnessed, or locally-delegated identifiers. These events are not rejected but held, requiring re-sourcing through a local protected channel before acceptance."
    invariants:
      - "Triggered by Local Source Protection: remote source + local/witnessed/delegated AID"
      - "Indexed by AID prefix and sequence number in the Misfit Event escrow"
      - "Events are not automatically reprocessed -- they must be re-submitted from a local source"
      - "Prevents network-based injection attacks against locally controlled identifiers"
    examples:
      - "A rotation event for our own AID arrives from an external peer -> escrowed as misfit -> controller must re-submit locally"
      - "An event for an AID we witness arrives from a non-controller source -> misfit escrow"
    related_terms: ["Local Source Protection", "Event Locality", "Event Source Record"]

  # Moved to domain://keri-messaging

  - term: "Event Database"
    synonyms: []
    definition: "Persistent storage for KELs, escrows, receipts, key state, and application data. Organized as named partitions (event store, KEL index, signature store, witness signature store, receipt store, etc.)."
    invariants:
      - "Provides append-only semantics for KEL events"
      - "Supports indexed access by prefix, sequence number, digest, and first-seen number"
      - "Named partitions separate events, signatures, receipts, and escrow queues"
    examples:
      - "An LMDB-based event database with partitions: events by prefix+digest, KEL index by prefix+sn, controller signatures by prefix+digest"
      - "A DynamoDB-based event database with equivalent partitioning for serverless environments"
    related_terms: ["KEL", "KEL Storage Schema"]

  - term: "Event Processor"
    synonyms: []
    definition: "The event validation and acceptance pipeline. Processes incoming events against current key state, manages escrow queues, and emits notifications for receipting and downstream processing. Operates in lax (promiscuous) or strict mode and tracks local vs remote event sources."
    invariants:
      - "Validates event signatures against current key state before acceptance"
      - "Escrows events that cannot yet be validated (out-of-order, partially signed, partially witnessed)"
      - "Emits notifications for receipting and downstream processing"
      - "Distinguishes local (trusted) from remote (untrusted) event sources"
    examples:
      - "An event processor in lax mode accepting any well-formed event regardless of witness receipts"
      - "An event processor in strict mode requiring witness threshold before accepting an event"
    related_terms: ["Key Event", "Escrow Architecture", "Event Database", "Message Parser"]

  # Moved to domain://keri-messaging

events:
  - name: "InceptionCreated"
    payload: "aid: AID, key_state: KeyState, witnesses: [WitnessAID], config: [Trait], said: SAID"
    triggers: "Controller creates a new AID by generating and signing an inception event"

  - name: "RotationPerformed"
    payload: "aid: AID, sn: int, new_keys: [PublicKey], new_next_digests: [Digest], witness_changes: {removed: [AID], added: [AID]}, said: SAID"
    triggers: "Controller rotates keys by generating a rotation event satisfying pre-rotation commitment and dual threshold"

  - name: "InteractionAnchored"
    payload: "aid: AID, sn: int, seals: [Seal], said: SAID"
    triggers: "Controller commits external data to the KEL via an interaction event"

  - name: "KeyStateComputed"
    payload: "aid: AID, key_state: KeyState, from_event: EstablishmentEvent"
    triggers: "A new establishment event is validated, and the resulting key state is derived"

  - name: "EventValidated"
    payload: "aid: AID, sn: int, event_type: EventType, said: SAID"
    triggers: "A received event passes all validation checks and is accepted into the KEL"

rules:
  - "The KEL is the sole source of truth for an AID's control authority — no external oracle"
  - "Events are processed in strict sequence order — out-of-order events are escrowed"
  - "Key state is deterministic — the same KEL prefix always produces the same key state"
  - "Only establishment events modify key state; interaction events advance sn but are invisible to key state computation"
  - "A rotation can only be performed using keys whose digests were pre-committed in the previous establishment event"
  - "Event field ordering is normative: v, t, d always first; remaining fields per event type specification"
  - "Events are escrowed, not rejected -- the blocking condition may resolve later"
  - "Each escrow type has a specific trigger condition and a specific reprocessing trigger"
  - "Escrowed events are fully re-validated through the pipeline on reprocessing -- they are not assumed valid"
  - "Escrow processing order: OOE first, then receipt escrows, then PSE, then PWE, then PDE"
  - "Escrow timeouts prevent unbounded queue growth from events whose dependencies never resolve"
  - "An event may visit multiple escrow types in sequence (the cascade) before final acceptance"
