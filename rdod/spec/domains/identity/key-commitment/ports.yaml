# ports.yaml
domain_ref: "identity/key-commitment"

ports:
  # Inbound — what the parent key-state domain calls
  - id: "port://identity/key-commitment/inbound/key-commitment"
    type: inbound
    name: "Key Commitment Management"
    semantics: query
    idempotent: true
    contract:
      input: "types://identity/key-commitment#PublicKey"
      output: "types://identity/key-commitment#KeyConfiguration"
      errors:
        - "errors://identity/key-commitment#PreRotationBindingError"
        - "errors://identity/key-commitment#EmptyNextKeysError"
        - "errors://identity/key-commitment#NextThresholdMismatchError"
        - "errors://identity/key-commitment#PreRotatedKeyReuseError"
        - "errors://identity/key-commitment#KeyExposureError"
    refs: ["domain://identity"]

  - id: "port://identity/key-commitment/inbound/transferability"
    type: inbound
    name: "Transferability Classification"
    semantics: query
    idempotent: true
    contract:
      input: "types://identity/key-commitment#PrefixCode"
      output: "types://identity/key-commitment#TransferabilityKind"
      errors:
        - "errors://identity/key-commitment#NonTransferableRotationError"
        - "errors://identity/key-commitment#TransferableMissingNextError"
    refs: ["domain://identity"]

  - id: "port://identity/key-commitment/inbound/partial-rotation"
    type: inbound
    name: "Partial Rotation"
    semantics: query
    idempotent: true
    contract:
      input: "types://identity/key-commitment#PublicKey"
      output: "types://identity/key-commitment#MatchedIndex"
      errors:
        - "errors://identity/key-commitment#PartialRotationThresholdError"
    refs: ["domain://identity"]
