# errors.yaml
domain_ref: "identity/key-commitment"

# Error catalog for the Key Commitment (Pre-rotation) domain.
# Covers pre-rotation commitment verification, signing key validation,
# next key digest checks, partial rotation, and transferability.
#
# Severity levels:
#   transient  — condition may self-resolve (escrow and retry)
#   recoverable — requires operator or protocol-level action
#   fatal      — unrecoverable; event is permanently rejected

errors:
  - name: "PreRotationBindingError"
    description: "New signing keys do not match the pre-committed next key digests"
    cause: "A rotation event's new keys (k field) do not produce digests matching the prior establishment event's next key commitments (n field)"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "key_index"
        type: "integer"
        description: "Which key position failed the binding check"
      - field: "expected_digest"
        type: "string"
        description: "The pre-committed digest from the prior n field"
      - field: "computed_digest"
        type: "string"
        description: "The digest computed from the new key"
    related_port: "port://identity/key-commitment/inbound/key-commitment"

  - name: "EmptyNextKeysError"
    description: "Rotation event has empty next key commitments — this is an abandonment, not a rotation"
    cause: "The n field is empty and nt is '0' — this terminates the identifier permanently"
    recovery: "abort"
    severity: "recoverable"
    context:
      - field: "aid"
        type: "string"
        description: "The AID being abandoned"
      - field: "sn"
        type: "integer"
        description: "The sequence number of the abandonment event"
    related_port: "port://identity/key-commitment/inbound/key-commitment"

  - name: "NextThresholdMismatchError"
    description: "Number of next key digests does not satisfy the next threshold expression"
    cause: "The n field has fewer digests than required by nt — the pre-rotation commitment is unsatisfiable"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "next_threshold"
        type: "string"
        description: "The nt threshold expression"
      - field: "next_key_count"
        type: "integer"
        description: "Number of digests in the n field"
    related_port: "port://identity/key-commitment/inbound/key-commitment"

  - name: "PreRotatedKeyReuseError"
    description: "A pre-rotated key digest has been consumed in a prior rotation and cannot be reused"
    cause: "Pre-rotated keys are first-time, one-time, only-time use — this digest was already consumed (matched or discarded) in an earlier rotation"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "aid"
        type: "string"
        description: "The AID"
      - field: "reused_digest"
        type: "string"
        description: "The digest that was previously consumed"
      - field: "prior_rotation_sn"
        type: "integer"
        description: "The sequence number of the rotation that originally consumed this digest"
    related_port: "port://identity/key-commitment/inbound/key-commitment"

  - name: "PartialRotationThresholdError"
    description: "Partial rotation does not promote enough keys to satisfy the prior rotation threshold"
    cause: "The number of pre-committed keys promoted to signing keys is less than the prior nt threshold — the threshold-satisficing subset requirement is not met"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "aid"
        type: "string"
        description: "The AID"
      - field: "promoted_count"
        type: "integer"
        description: "Number of pre-committed keys promoted to signing keys"
      - field: "prior_next_threshold"
        type: "string"
        description: "The nt threshold expression from the prior establishment event"
      - field: "total_next_keys"
        type: "integer"
        description: "Total number of keys in the prior n field"
    related_port: "port://identity/key-commitment/inbound/partial-rotation"

  - name: "NonTransferableRotationError"
    description: "Rotation attempted on a non-transferable identifier"
    cause: "The AID uses a non-transferable prefix code (B, 1AAA, 1AAI, 1AAC) and has an empty n field — rotation is structurally impossible"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "aid"
        type: "string"
        description: "The non-transferable AID"
      - field: "prefix_code"
        type: "string"
        description: "The non-transferable prefix code"
    related_port: "port://identity/key-commitment/inbound/transferability"

  - name: "TransferableMissingNextError"
    description: "Transferable AID establishment event has an empty next key digest list"
    cause: "A transferable AID (prefix codes D, 1AAB, 1AAJ, 1AAD, or self-addressing E) submitted an establishment event with n = [] — transferable AIDs require non-empty pre-rotation commitments"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "aid"
        type: "string"
        description: "The transferable AID"
      - field: "sn"
        type: "integer"
        description: "The sequence number of the establishment event"
    related_port: "port://identity/key-commitment/inbound/transferability"

  # KeyExposureError redefined as a builder-time constraint.
  # The validation pipeline does NOT check for premature key exposure — digest commitment
  # makes it structurally impossible. "Key exposure" in keripy (exposeds()) is the
  # rotation-time verification that signing keys match pre-committed digests, which is
  # already covered by PreRotationBindingError. This error applies only to event
  # construction (builder-time) where a controller might accidentally include a
  # pre-committed key in a signing key list before its activation rotation.
  - name: "KeyExposureError"
    description: "Builder-time constraint: pre-committed key included in signing key list before its activation rotation"
    cause: "Event construction attempted to include a key whose digest appears in the current next key commitments (n field) — the key should remain secret until the rotation that activates it. This is a construction-time safety check, not a validation pipeline check."
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "aid"
        type: "string"
        description: "The AID"
      - field: "exposed_key"
        type: "string"
        description: "The pre-committed key that was included prematurely"
    related_port: "port://identity/key-commitment/inbound/key-commitment"
