domain_ref: "identity/key-commitment"

types:
  - name: "VerificationKey"
    description: "A CESR-qualified public verification key. The qb64 representation includes the algorithm code prefix."
    variants:
      - name: "default"
        fields:
          - name: "qb64"
            type: "string"
            required: true
            description: "CESR Base64url-encoded public key with algorithm prefix"
            constraints:
              pattern: "^[A-Za-z0-9_-]+"
          - name: "algorithm"
            type: "string"
            required: true
            description: "Cryptographic algorithm"
            constraints:
              enum: ["Ed25519", "ECDSA-secp256k1", "ECDSA-secp256r1", "Ed448"]
        invariants:
          - "First character(s) of qb64 determine the algorithm (D=Ed25519, 1AAB=secp256k1, etc.)"
          - "Equivalent to a Verification Key primitive in CESR"

  - name: "PreRotationCommitment"
    description: "The commitment to future signing keys made in an establishment event. Contains the next key digests and next threshold — the contract that any future rotation must satisfy."
    variants:
      - name: "transferable"
        fields:
          - name: "next_threshold"
            type: "string"
            required: true
            description: "Next key threshold expression (nt field) — determines how many next keys must be exposed in rotation"
            constraints:
              min: "1"
          - name: "next_digests"
            type: "array[string]"
            required: true
            description: "CESR-qualified digests of the next signing keys (n field)"
            constraints:
              min_length: 1
          - name: "digest_algorithm"
            type: "string"
            required: true
            description: "Digest algorithm used (e.g., Blake3-256 = E prefix)"
        invariants:
          - "len(next_digests) >= integer(next_threshold) for simple thresholds"
          - "Digests are one-way — the actual keys cannot be derived from them"
          - "Any future rotation MUST produce keys whose digests match these commitments"
      - name: "non-transferable"
        fields:
          - name: "next_threshold"
            type: "string"
            required: true
            description: "Always '0' for non-transferable"
            constraints:
              enum: ["0"]
          - name: "next_digests"
            type: "array[string]"
            required: true
            description: "Always empty for non-transferable"
            constraints:
              max_length: 0
        invariants:
          - "No rotation possible — the identifier's key binding is permanent"
      - name: "abandonment"
        fields:
          - name: "next_threshold"
            type: "string"
            required: true
            description: "Always '0' for abandonment"
            constraints:
              enum: ["0"]
          - name: "next_digests"
            type: "array[string]"
            required: true
            description: "Always empty for abandonment"
            constraints:
              max_length: 0
        invariants:
          - "Set via rotation event (not inception) — signals permanent retirement"
          - "No further events of any type are permitted"

  - name: "KeyConfiguration"
    description: "A complete set of current signing keys, threshold, and next key commitments for an identifier."
    builder:
      description: "Construct a KeyConfiguration with validated key list, threshold, and pre-rotation commitments."
      required_fields:
        - keys: "array of VerificationKey — at least one signing key required"
        - threshold: "threshold expression — integer string or fractional weight list"
        - next_keys: "array of Digest — pre-rotation commitments; empty only for non-transferable or abandonment"
        - next_threshold: "threshold expression for next keys — '0' with empty next_keys for non-transferable"
      construction_invariants:
        - "len(keys) >= 1 — at least one signing key required"
        - "For simple integer threshold: integer(threshold) >= 1 and integer(threshold) <= len(keys)"
        - "For weighted threshold: sum of weights across all keys >= 1 (satisfiable)"
        - "If next_keys is empty: next_threshold MUST be '0' (non-transferable or abandonment)"
        - "If next_keys is non-empty: next_threshold MUST be >= 1 and <= len(next_keys)"
        - "Digest algorithm for next_keys MUST be consistent across all commitments in the set"
    variants:
      - name: "default"
        fields:
          - name: "keys"
            type: "array[VerificationKey]"
            required: true
            description: "Current signing public keys"
            constraints:
              min_length: 1
          - name: "threshold"
            type: "string"
            required: true
            description: "Signing threshold expression for current keys"
          - name: "next_keys"
            type: "array[Digest]"
            required: true
            description: "Pre-rotation digest commitments for next signing keys"
          - name: "next_threshold"
            type: "string"
            required: true
            description: "Signing threshold expression for next keys"
        invariants:
          - "len(keys) >= integer(threshold) for simple integer thresholds"
          - "If next_keys is empty and next_threshold is '0', no further rotation is possible"

  - name: "MatchedIndex"
    description: "A verified key-to-digest index match confirming a rotation key satisfies its pre-rotation commitment."
    variants:
      - name: "default"
        fields:
          - name: "key_index"
            type: "integer"
            required: true
            description: "Index of the new key in the rotation event's k array"
          - name: "digest_index"
            type: "integer"
            required: true
            description: "Index of the matching digest in the prior event's n array"
          - name: "verified"
            type: "boolean"
            required: true
            description: "Whether the key's digest matches the committed digest"
        invariants:
          - "A verified=true match means hash(key[key_index]) == prior_n[digest_index]"
          - "All new rotation keys must have a verified match for the rotation to be valid"

  # DigestAlgorithm removed — canonical definition is in cesr/primitives.
  # Consumed-digest repository NOT defined here — enforcement is implicit via key state
  # progression. Each rotation overwrites ndigers with the new commitment set.
  # See: OQ-21 resolution in synthesis.
  # Import via: types://cesr/primitives#DigestAlgorithm

  - name: "PrefixCode"
    description: "CESR code that determines AID type based on the inception key's derivation code. Complete set of 9 prefix codes from the normative CESR code table."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            description: "The CESR prefix code for AID derivation"
            constraints:
              enum:
                - "Ed25519"        # D prefix — transferable Ed25519
                - "Ed25519N"       # B prefix — non-transferable Ed25519
                - "ECDSA_256k1"    # 1AAB prefix — transferable secp256k1
                - "ECDSA_256k1N"   # 1AAA prefix — non-transferable secp256k1
                - "Ed448"          # 1AAD prefix — transferable Ed448
                - "Ed448N"         # 1AAC prefix — non-transferable Ed448
                - "ECDSA_256r1"    # 1AAJ prefix — transferable secp256r1
                - "ECDSA_256r1N"   # 1AAI prefix — non-transferable secp256r1
                - "Blake3_256"     # E prefix — self-addressing
        invariants:
          - "Non-transferable codes: B (Ed25519N), 1AAA (ECDSA_256k1N), 1AAC (Ed448N), 1AAI (ECDSA_256r1N)"
          - "Transferable codes: D (Ed25519), 1AAB (ECDSA_256k1), 1AAD (Ed448), 1AAJ (ECDSA_256r1)"
          - "Self-addressing code: E (Blake3_256) — AID derived from the event SAID"

  - name: "TransferabilityKind"
    description: "Classification of whether an AID can rotate its keys."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            description: "The transferability classification"
            constraints:
              enum: ["Transferable", "NonTransferable"]
        invariants:
          - "Transferable AIDs have non-empty next key commitments at inception"
          - "NonTransferable AIDs have empty next key commitments — the public key IS the identifier"

  - name: "TransferabilityInput"
    description: "Input for determining transferability of an AID. Transferability is determined by the n field (next key digest count), not by the prefix code alone — but the prefix code provides a secondary structural check (non-transferable prefix codes must have empty n)."
    variants:
      - name: "default"
        fields:
          - name: "prefix_code"
            type: "PrefixCode"
            required: true
            description: "CESR prefix code from the inception key — provides structural constraint (non-transferable codes must have empty n)"
          - name: "next_key_count"
            type: "integer"
            required: true
            description: "Number of next key digests in the n field — the definitive signal for transferability"
            constraints:
              min: 0
        invariants:
          - "Transferable iff next_key_count > 0"
          - "Non-transferable prefix codes (B, 1AAA, 1AAC, 1AAI) MUST have next_key_count == 0"
          - "Self-addressing prefix code (E) is transferable when next_key_count > 0"

  - name: "MatchedKeyTuple"
    description: "A single verified key-to-digest binding from a rotation event, recording whether a new signing key at a given index matches its pre-committed digest at a (possibly different) ondex position."
    variants:
      - name: "default"
        fields:
          - name: "index"
            type: "integer"
            required: true
            description: "Position of the key in the current rotation event's signing key list (k field)"
          - name: "ondex"
            type: "integer"
            required: true
            description: "Position of the matching digest in the prior establishment event's next key digest list (n field)"
          - name: "expected_digest"
            type: "string"
            required: true
            description: "The pre-committed digest from the prior n field at the ondex position"
          - name: "computed_digest"
            type: "string"
            required: true
            description: "The digest computed from the new signing key at the index position"
          - name: "matches"
            type: "boolean"
            required: true
            description: "Whether expected_digest equals computed_digest"
        invariants:
          - "matches == (expected_digest == computed_digest)"
          - "Cross-position matching is valid: index != ondex occurs in partial and augmented rotations"

  - name: "BindingVerification"
    description: "The result of checking new rotation keys against prior next key digest commitments using dual-indexed (index, ondex) matching. Cross-position matching IS valid via the ondex mechanism."
    variants:
      - name: "default"
        fields:
          - name: "bound"
            type: "boolean"
            required: true
            description: "True if enough keys match their pre-committed digests to satisfy the prior-next threshold"
          - name: "matched_tuples"
            type: "array[MatchedKeyTuple]"
            required: true
            description: "List of verified key-to-digest bindings. Each tuple records the index (current key position), ondex (prior next-key position), expected digest, computed digest, and match result."
          - name: "mismatches"
            type: "array[MatchedKeyTuple]"
            required: false
            description: "List of key positions where digest does not match (empty if bound=true)"
        invariants:
          - "If bound=false, rotation MUST be rejected"
          - "Each matched tuple contains: index (current key position), ondex (prior next-key position), expected_digest, computed_digest, matches"
          - "Cross-position matching is valid: a signature with index=2 and ondex=0 means key at position 2 in current list corresponds to position 0 in prior next-key digest list"
          - "The ondex is essential for partial and augmented rotations where key positions shift"

  - name: "ForwardBlindedCommitment"
    description: "A cryptographic commitment to a public key made by including only the key's digest in an Establishment Event, keeping the actual key hidden (blinded). The commitment binds a future Rotation Event to reveal specific keys."
    variants:
      - name: "default"
        invariants:
          - "Only the digest is exposed; the public key remains secret until rotation"
          - "The commitment is irrevocable once the Establishment Event is accepted"
          - "Verification occurs at rotation by matching revealed keys against committed digests"

  - name: "KeyRevelation"
    description: "The act of including a previously committed (blinded) public key in a Rotation Event, thereby revealing it and enabling verification against its pre-committed digest. Transforms a rotation key into a signing key."
    variants:
      - name: "default"
        invariants:
          - "The revealed public key MUST match its pre-committed digest from the prior Establishment Event"
          - "Once revealed, the key transitions from rotation authority to signing authority"

  - name: "ReserveKey"
    description: "A pre-committed key that is NOT revealed in the current Rotation Event, remaining blinded for future use. Reserve keys enable Partial Rotation and provide a recovery mechanism."
    variants:
      - name: "default"
        invariants:
          - "Remains blinded — its public key is not exposed"
          - "Can be revealed in a future Rotation Event"
          - "Enables Reserve Rotation and recovery from key compromise"
