domain_ref: "identity/key-commitment"

types:
  - name: "PreRotationCommitment"
    description: "The commitment to future signing keys made in an establishment event. Contains the next key digests and next threshold — the contract that any future rotation must satisfy."
    variants:
      - name: "transferable"
        fields:
          - name: "next_threshold"
            type: "string"
            required: true
            description: "Next key threshold expression (nt field) — determines how many next keys must be exposed in rotation"
            constraints:
              min: "1"
          - name: "next_digests"
            type: "array[string]"
            required: true
            description: "CESR-qualified digests of the next signing keys (n field)"
            constraints:
              min_length: 1
          - name: "digest_algorithm"
            type: "string"
            required: true
            description: "Digest algorithm used (e.g., Blake3-256 = E prefix)"
        invariants:
          - "len(next_digests) >= integer(next_threshold) for simple thresholds"
          - "Digests are one-way — the actual keys cannot be derived from them"
          - "Any future rotation MUST produce keys whose digests match these commitments"
      - name: "non-transferable"
        fields:
          - name: "next_threshold"
            type: "string"
            required: true
            description: "Always '0' for non-transferable"
            constraints:
              enum: ["0"]
          - name: "next_digests"
            type: "array[string]"
            required: true
            description: "Always empty for non-transferable"
            constraints:
              max_length: 0
        invariants:
          - "No rotation possible — the identifier's key binding is permanent"
      - name: "abandonment"
        fields:
          - name: "next_threshold"
            type: "string"
            required: true
            description: "Always '0' for abandonment"
            constraints:
              enum: ["0"]
          - name: "next_digests"
            type: "array[string]"
            required: true
            description: "Always empty for abandonment"
            constraints:
              max_length: 0
        invariants:
          - "Set via rotation event (not inception) — signals permanent retirement"
          - "No further events of any type are permitted"

  - name: "BindingVerification"
    description: "The result of checking new rotation keys against prior next key digest commitments."
    variants:
      - name: "default"
        fields:
          - name: "bound"
            type: "boolean"
            required: true
            description: "True if all new keys match their pre-committed digests"
          - name: "mismatches"
            type: "array[map]"
            required: false
            description: "List of key positions where digest does not match (empty if bound=true)"
        invariants:
          - "If bound=false, rotation MUST be rejected"
          - "Each mismatch entry contains: index, expected_digest, computed_digest"
