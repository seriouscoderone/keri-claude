# ports.yaml
domain_ref: "identity/state"

ports:
  # Inbound — IdentityService interface
  - id: "port://identity/state/inbound/commit"
    type: inbound
    name: "Commit Event"
    semantics: command
    idempotent: false
    description: >
      Primary IdentityService operation — validates a key event (signatures,
      thresholds, witnesses, delegation) and commits it to the identity history.
      Produces a WriteOutcome: accepted (committed to log), escrowed (held
      pending missing prerequisites), or rejected.
    contract:
      input: "types://identity/establishment#KeyEvent"
      output: "types://identity/state#WriteOutcome"
      errors:
        - "errors://identity/state#OutOfOrderKeyStateError"
        - "errors://identity/state#UnverifiedReplyError"
        - "errors://identity/establishment#ValidationError"
    refs: ["domain://identity"]

  - id: "port://identity/state/inbound/state-reconstruction"
    type: inbound
    name: "State Reconstruction"
    semantics: query
    idempotent: true
    contract:
      input: "AID prefix and optional target sequence number"
      output: "types://identity/state#KeyState"
      errors:
        - "errors://identity/state#ReconstructionError"
        - "errors://identity/state#StaleKeyStateError"
    refs: ["domain://identity"]

  - id: "port://identity/state/inbound/state-query"
    type: inbound
    name: "State Query"
    semantics: query
    idempotent: true
    contract:
      input: "AID prefix string"
      output: "types://identity/state#LastEstablishmentData"
      errors:
        - "errors://identity/state#QueryNotFoundError"
    refs: ["domain://identity"]

  # Outbound — CQRS read model (query-only projection of the KEL)
  - id: "port://identity/state/outbound/state-read-model"
    type: outbound
    name: "State Read Model"
    semantics: query
    idempotent: true
    description: >
      CQRS read model — a query-only projection of the current key state,
      derived from the KEL. The IdentityService updates this projection
      internally as a side effect of committing events (not via this port).
      Consumers only read from it. Can always be reconstructed by replaying
      the KEL from the KelRepository.
    contract:
      input: "types://cesr/primitives#AID"
      output: "types://identity/state#KeyState"
      errors: []
    refs: ["domain://externals/persistence"]
    invariants:
      - "Query-only — consumers never write to the read model directly"
      - "Returns null/empty when AID not found — the IdentityService translates this to QueryNotFoundError at the inbound port"
      - "The IdentityService updates the projection internally after each successful commit"
      - "Always reconstructable — replay the KEL to rebuild from scratch"
      - "Returns the state as of the latest committed event (not eventual — immediately consistent)"

  - id: "port://identity/state/outbound/kel-repository"
    type: outbound
    name: "KelRepository"
    semantics: command
    idempotent: false
    description: >
      KelRepository — append-only persistence for the Key Event Log and escrow
      queues. The IdentityService IS the guard; the KelRepository IS the storage.
      All writes go through the IdentityService, never directly to the repository.
    contract:
      input: "types://identity/establishment#SignedEventMessage"
      output: "types://identity/state#WriteOutcome"
      errors:
        - "errors://identity/establishment#ValidationError"
    refs: ["domain://externals/persistence"]
    invariants:
      - "The KEL is NEVER written to directly — all writes go through the IdentityService"
      - "The accepted KEL and first-seen event log are APPEND-ONLY — events are never removed after acceptance"
      - "Escrow queues are mutable structures (add/get/remove) — NOT part of the append-only KEL"
      - "Reprocessing re-enters the IdentityService — escrowed events are fully re-validated"
      - "The IdentityService is the guard; the KelRepository is the storage"

  - id: "port://identity/state/inbound/bada-acceptance"
    type: inbound
    name: "BADA Reply Acceptance"
    semantics: command
    idempotent: true
    description: >
      Best Available Data Algorithm (BADA) acceptance for reply messages (rpy ilk).
      This is a PUBLIC interface (explicit service method), not an internal mechanism.
      BADA applies to reply messages, NOT key events. Comparison uses:
      - Transferable endorsers: (sn of endorser's establishment event + datetime)
      - Non-transferable endorsers: (datetime only)
      A reply is stale if it has a lower sn than the stored reply, or the same sn
      but an earlier datetime.
    contract:
      input: "reply message with endorser AID and datetime"
      output: "boolean (accepted or stale)"
      errors:
        - "errors://identity/state#UnverifiedReplyError"
    refs: ["domain://identity"]

  - id: "port://identity/state/outbound/escrow-drain"
    type: outbound
    name: "Escrow Drain"
    semantics: command
    idempotent: true
    description: >
      IdentityService periodically drains escrow queues by re-submitting events
      through its own validation guard. Events whose blocking condition has
      resolved are promoted to the KEL. Timed-out events are pruned.
      Note: escrow-drain operates on MUTABLE escrow queues (add/remove/prune),
      not on the append-only KEL. Pruning does not violate the append-only invariant.
    contract:
      input: "string"
      output: "types://identity/state#EscrowReprocessResult"
      errors: []
    refs: ["domain://externals/persistence"]
