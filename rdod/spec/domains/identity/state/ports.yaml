# ports.yaml
domain_ref: "identity/state"

ports:
  # Inbound — IdentityService interface
  - id: "port://identity/state/inbound/commit"
    type: inbound
    name: "Commit Event"
    semantics: command
    idempotent: false
    description: >
      Primary IdentityService operation — validates a key event (signatures,
      thresholds, witnesses, delegation) and commits it to the identity history.
      Produces a WriteOutcome: accepted (committed to log), escrowed (held
      pending missing prerequisites), or rejected.
    contract:
      input: "types://identity/establishment#KeyEvent"
      output: "types://identity/state#WriteOutcome"
      errors:
        - "errors://identity/state#OutOfOrderKeyStateError"
        - "errors://identity/state#UnverifiedReplyError"
        - "errors://identity/establishment#ValidationError"
    refs: ["domain://identity"]

  - id: "port://identity/state/inbound/state-reconstruction"
    type: inbound
    name: "State Reconstruction"
    semantics: query
    idempotent: true
    contract:
      input: "AID prefix and optional target sequence number"
      output: "types://identity/state#KeyState"
      errors:
        - "errors://identity/state#ReconstructionError"
        - "errors://identity/state#StaleKeyStateError"
    refs: ["domain://identity"]

  - id: "port://identity/state/inbound/state-query"
    type: inbound
    name: "State Query"
    semantics: query
    idempotent: true
    contract:
      input: "AID prefix string"
      output: "types://identity/state#LastEstablishmentData"
      errors:
        - "errors://identity/state#QueryNotFoundError"
    refs: ["domain://identity"]

  # Outbound — Repository interface for persistence
  - id: "port://identity/state/outbound/persistence"
    type: outbound
    name: "State Persistence Repository"
    semantics: command
    idempotent: false
    contract:
      input: "types://identity/state#KeyState"
      output: "void"
      errors:
        - "errors://identity/state#MissingEntryError"
    refs: ["persistence"]
    invariants:
      - "Cached state may be overwritten — it is derived from the KEL, not source-of-truth"
      - "replay_events returns events ordered by ascending sequence number within the range"
      - "Event lookup by SAID is read-only — state reconstruction never writes events"

  - id: "port://identity/state/outbound/kel-repository"
    type: outbound
    name: "KelRepository"
    semantics: command
    idempotent: false
    description: >
      KelRepository — append-only persistence for the Key Event Log and escrow
      queues. The IdentityService IS the guard; the KelRepository IS the storage.
      All writes go through the IdentityService, never directly to the repository.
    contract:
      input: "types://identity/establishment#SignedEventMessage"
      output: "types://identity/state#WriteOutcome"
      errors:
        - "errors://identity/establishment#ValidationError"
    refs: ["external://persistence"]
    invariants:
      - "The KEL is NEVER written to directly — all writes go through the IdentityService"
      - "Escrow queues are part of the repository, not a separate persistence concern"
      - "Reprocessing re-enters the IdentityService — escrowed events are fully re-validated"
      - "The IdentityService is the guard; the KelRepository is the storage"

  - id: "port://identity/state/outbound/escrow-drain"
    type: outbound
    name: "Escrow Drain"
    semantics: command
    idempotent: true
    description: >
      IdentityService periodically drains escrow queues by re-submitting events
      through its own validation guard. Events whose blocking condition has
      resolved are promoted to the KEL. Timed-out events are pruned.
    contract:
      input: "string"
      output: "types://identity/state#EscrowReprocessResult"
      errors: []
    refs: ["external://persistence"]
