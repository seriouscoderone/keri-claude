# domain.yaml
template_version: "2.0"
id: "identity/state"
name: "Identity State"
description: >
  Current key configuration — who controls this identifier right now. The Kever state machine
  that tracks one AID's current key state. Manages state reconstruction
  from the KEL, the establishment subsequence, last establishment data, and configuration traits.
  Provides the authoritative answer to "what is this AID's current key state?" Each tracked AID
  has exactly one Key Event Verifier instance whose state is updated deterministically by processing
  establishment events (icp, rot, dip, drt) in sequence. Interaction events pass through the
  state machine without modifying key state. The state machine supports both incremental update
  (processing one new event) and full reconstruction (replaying the KEL from inception).
version: "0.1.0"
tier: "domain"

source_material:
  - type: document
    reference: "keripy eventing.py — Kever class (incept, update, rotate, reload, config, state methods), LastEstLoc namedtuple, KeyStateRecord"
  - type: document
    reference: "keriox keriox_core/src/state/mod.rs — IdentifierState struct, LastEstablishmentData, WitnessConfig, EventSemantics trait, apply_to() implementations"
  - type: document
    reference: "keriox keriox_core/src/processor/event_storage.rs — compute_state_at_sn() replay-based reconstruction, get_state() cached lookup"
  - type: document
    reference: "keri-specification.md — sections: Key State, Establishment Events, Pre-rotation, Configuration Traits"
  - type: document
    reference: "KERI_WP_2.x.web.md — sections: Key State, Establishment Subsequence"

domain_clients:
  - ref: "domain://identity"
    relationship: "Parent domain delegates per-AID state tracking, state reconstruction, establishment subsequence management, and configuration trait enforcement to this subdomain"
    via_port: "port://identity/state/inbound/commit"

subdomains: []

kernels:
  - ref: "external://cryptographic-primitives"
    source: "Ed25519/ECDSA public keys (Verfer) for signing key lists, Blake3-256/SHA-256 digests (Diger) for next key commitment lists, SAID computation for event digest tracking"
    relationship: "Cryptographic primitives appear directly in state machine fields — the tracker stores and compares qualified public keys, digests, and SAIDs as kernel types"

adjacents: []

externals:
  - name: "State Persistence Repository"
    abstraction: "Repository"
    ref: "port://identity/state/outbound/state-read-model"
    implementation_notes: >
      State cache for fast key state lookup by prefix, and KEL access for state
      reconstruction via replay.
      Implementations: LMDB (memory-mapped key-value store, keripy),
      redb (embedded Rust key-value store, keriox),
      DynamoDB (serverless key-value store, serious-keri),
      SQLite/PostgreSQL (relational alternatives),
      in-memory (for testing).
      Invariants: Repository interfaces define the contract (the persistence
      external implements it); implementations MUST satisfy the invariants on
      each Repository port (append-only, idempotent, etc.).

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    In keripy, the Kever class IS the Key Event Verifier. It is initialized from either an
    inception event (incept method) or a cached KeyStateRecord (reload method). The update method
    processes subsequent events: for establishment events (rot/drt), it calls rotate() to validate
    the rotation and then updates all state fields (verfers, ndigers, tholder, ntholder, wits,
    toader, lastEst, config traits). For interaction events (ixn), it updates only the sn and
    serder without modifying key state. The config() method enforces cumulative traits. The state()
    property serializes the current Kever state to a KeyStateRecord. In keriox, IdentifierState is
    an immutable struct that produces a new instance on each apply(). The EventSemantics trait's
    apply_to() method is implemented per event type — RotationEvent.apply_to() verifies the
    pre-rotation binding via verify_next(), computes new witness lists, and returns a new
    IdentifierState. State reconstruction via compute_state_at_sn() replays all events from sn=0
    through apply() calls, folding into a final IdentifierState.

issues: []

tags: ["kever", "state-machine", "state-tracking", "establishment-subsequence", "configuration-traits", "state-reconstruction"]
