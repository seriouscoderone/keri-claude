# ubiquitous-language.yaml
domain_ref: "identity/state"

terms:
  - term: "Key Event Verifier"
    synonyms: []
    definition: "State machine that tracks one AID's current key state. Initialized from an inception event and updated by each subsequent establishment event. Holds all current key state fields — signing keys, signing threshold, next key digests, next threshold, witness list, witness threshold, configuration traits, and last establishment data. Provides the authoritative answer to signature verification and rotation validation for a single AID."
    invariants:
      - "Exactly one instance per AID being tracked — keyed by the AID prefix"
      - "State is updated only by establishment events (icp, rot, dip, drt)"
      - "Interaction events (ixn) advance the sequence number and current event reference but do NOT modify key state fields"
      - "State is deterministic — the same KEL prefix always produces the same Key Event Verifier state"
      - "Can be initialized in two ways: from a raw inception event or from a cached state record"
      - "Implementations may use mutable update-in-place or immutable apply-and-return semantics"
    examples:
      - "Verifier initialized from inception event: sets signing keys, next key digests, signing threshold, next threshold, witness list, witness threshold, last establishment data"
      - "Verifier updated by rotation: signing keys replaced with new keys (verified against prior next key digests), new next digests committed, witnesses updated via removals/additions, last establishment data updated"
    related_terms: ["Key State", "Establishment Subsequence", "Last Establishment Data", "State Reconstruction", "Configuration Traits"]

  - term: "First-Seen Ordinal"
    synonyms: ["fn", "first_seen_sn"]
    definition: "A per-AID monotonic counter assigned to each event when it is first accepted into the KEL. NOT a global counter — each identifier prefix has its own independent fn sequence starting from 0. fn provides ordering within a single identifier's history and enables first-seen replay."
    invariants:
      - "Per-AID: each AID prefix has its own fn counter starting from 0"
      - "Monotonic: fn always increases for successive events within the same AID"
      - "Assigned once at first acceptance — never reassigned or changed"
      - "Duplicate events (same SAID) do NOT get a new fn — signature accumulation preserves the original fn"
      - "In keripy: fels database keyed by (prefix, fn) via appendOn"
    examples:
      - "AID D1 events: icp(fn=0), ixn(fn=1), rot(fn=2). AID D2 events: icp(fn=0), ixn(fn=1). Independent counters."
    related_terms: ["Key Event Verifier", "Signature Accumulation"]

  - term: "Last Establishment Data"
    synonyms: ["ee field [KSN]"]
    definition: "Snapshot of the most recent establishment event processed by the Key Event Verifier. Records the sequence number and SAID of that event, plus the witness changes (removed and added) it introduced. Used as a required reference for validating the next rotation — the rotation must occur at a sequence number greater than the last establishment event's sequence number, and witness cuts/adds are computed relative to this state."
    invariants:
      - "Updated each time an establishment event (icp, rot, dip, drt) is processed by the state machine"
      - "Contains: sequence number (s), event SAID/digest (d), witnesses removed (br), witnesses added (ba)"
      - "At inception: lastEst.s = 0, lastEst.d = inception event SAID, br = [], ba = []"
      - "A rotation at sn <= lastEst.s is stale and rejected (for rot; drt allows sn == lastEst.s for recovery)"
    examples:
      - "After inception at sn=0: lastEst = {s: 0, d: 'EABC...', br: [], ba: []}"
      - "After rotation at sn=4 that removes witness W1 and adds W2: lastEst = {s: 4, d: 'EDEF...', br: ['W1...'], ba: ['W2...']}"
      - "Rotation attempt at sn=3 when lastEst.s=4 is rejected as stale"
    related_terms: ["Key Event Verifier", "Establishment Event", "Rotation Event", "Stale Event"]

  - term: "State Reconstruction"
    synonyms: ["KEL Replay"]
    definition: "The process of recomputing current key state by replaying the KEL from inception through all events up to a target sequence number, applying each event to the state machine in order. Enables stateless verification — any validator can reconstruct state from the log alone. Two strategies exist: full replay (apply every event from sn=0) and cache reload (load a previously cached state record)."
    invariants:
      - "Replaying the same KEL always produces the same key state (deterministic)"
      - "Full replay: starts with empty state and applies each event in sequence from inception"
      - "Only establishment events in the replay modify the resulting key state; interaction events are applied for hash-chain continuity but leave key state unchanged"
      - "Cache reload: loads a previously cached key state record, bypassing replay for performance"
      - "Any validator can independently reconstruct key state from a KEL copy without trusting cached state"
    examples:
      - "A new validator bootstrapping: replays KEL [icp, ixn, ixn, rot, ixn, rot] -> applies icp to get initial state, skips ixn key state, applies first rot, skips ixn, applies second rot -> final key state"
      - "Reconstruct state at sn=5: fetches events sn 0..5, sorts, applies each in order, returns key state at sn=5"
      - "Cache reload: deserializes a stored key state record into verifier attributes, fetches the corresponding event from the event store"
    related_terms: ["Key Event Verifier", "Establishment Subsequence", "Key State", "State Cache"]

  - term: "Establishment Subsequence"
    synonyms: ["Establishment Event Sequence"]
    definition: "The ordered subsequence of only the establishment events (inception and rotations) within a KEL, ignoring all interaction events. Key state is derived exclusively from this subsequence. The establishment subsequence determines the key authority chain — each establishment event commits to the keys that will authorize the next one."
    invariants:
      - "First event is always an inception (icp or dip)"
      - "Subsequent events are rotations (rot or drt) — interaction events (ixn) are excluded"
      - "Key state at any point is fully determined by the establishment subsequence up to that point"
      - "The establishment subsequence is independently hash-chained via the p (prior) field referencing the previous event's SAID"
      - "Recovery rotations can supersede interaction events but cannot supersede prior establishment events"
      - "The Key Event Verifier's last establishment data tracks the sn of the most recent establishment event in the subsequence"
    examples:
      - "A KEL of [icp(sn=0), ixn(sn=1), ixn(sn=2), rot(sn=3), ixn(sn=4), rot(sn=5)] has establishment subsequence [icp(sn=0), rot(sn=3), rot(sn=5)]"
      - "Key state after this KEL equals key state from replaying only [icp, rot, rot]"
      - "A recovery rotation at sn=3 can supersede an ixn at sn=3, but cannot supersede a rot at sn=3"
    related_terms: ["Key Event Verifier", "Key State", "State Reconstruction", "Last Establishment Data"]

  - term: "Configuration Traits"
    synonyms: ["c field", "config traits"]
    definition: "Behavioral constraint flags set in the c field of establishment events that restrict what an AID can do. Traits are cumulative — once set in any establishment event, they apply permanently to all subsequent events. The Key Event Verifier enforces these constraints on every event it processes."
    invariants:
      - "EstOnly (EO): only establishment events allowed — interaction events are rejected by the state machine"
      - "DoNotDelegate (DND): the AID cannot serve as a delegator for other AIDs"
      - "DID (Delegated Identifier Delegator): validators may treat delegates as the AID itself"
      - "RegistrarBackers (RB): this AID uses registrar backers for its TEL events"
      - "NoRegistrarBackers (NRB): this AID does not use registrar backers — last-wins toggleable with RB"
      - "The five defined traits are: EO, DND, DID, RB, NRB"
      - "Traits are cumulative and irreversible — once set, they cannot be removed by subsequent establishment events (exception: RB/NRB toggle via last-wins rule)"
      - "The verifier checks configuration traits from the event's c field and enforces them on all subsequent events"
      - "Once a trait becomes active, it persists permanently in the verifier's state"
      - "The verifier rejects interaction events when the EstOnly trait is active"
    examples:
      - "Inception with c=['EO'] — EstOnly activated; any subsequent ixn event is rejected"
      - "Inception with c=[], rotation with c=['DND'] — DoNotDelegate becomes active permanently"
      - "Key state record with both EO and DND active -> c=['EO', 'DND']"
    related_terms: ["Key Event Verifier", "Key State", "Establishment Event", "Inception Event"]

  - term: "Incremental State Update"
    synonyms: []
    definition: "The process of advancing the Key Event Verifier's state by processing a single new event. For establishment events, this updates all key state fields (keys, thresholds, witnesses, last establishment data, traits). For interaction events, this advances only the sequence number and current event reference without modifying key state. This is the primary hot path — most events are processed incrementally rather than via full reconstruction."
    invariants:
      - "Establishment event update: validates rotation (dual threshold, pre-rotation binding, witness changes), then replaces key state fields"
      - "Interaction event update: only advances sn and current event reference; verifies the prior event hash chain and signatures against current key state"
      - "The update is atomic — either all state fields change or none do (validation failure raises an error)"
      - "After a successful establishment event update: last establishment data is updated, config traits are checked and accumulated"
      - "State cache is written after every successfully applied event — establishment events (which update key state) and interaction events (which advance only sn) both trigger a cache write so the most recent sn is always recoverable without replay"
      - "After an ixn event, the full KeyState is cached (not just sn) — key material remains unchanged from the last establishment event, but sn, current event digest, and first-seen number are updated"
    examples:
      - "Processing a rotation: the verifier validates the rotation, then replaces signing keys, next key digests, thresholds, witnesses, and last establishment data"
      - "Processing an interaction: the verifier checks signatures against current signing keys, advances the sequence number, updates the current event reference"
    related_terms: ["Key Event Verifier", "State Reconstruction", "Establishment Event", "Interaction Event"]

  - term: "KEL Append-Only Invariant"
    synonyms: []
    definition: "The append-only invariant applies ONLY to the accepted Key Event Log and the first-seen event log. Escrow queues are separate mutable structures supporting add, get, and remove operations. Pruning timed-out events from escrow does NOT violate the append-only invariant because escrows are NOT part of the KEL."
    invariants:
      - "Accepted KEL is append-only — events are never removed or modified after acceptance"
      - "First-seen event log is append-only — fn assignments are permanent"
      - "Escrow queues (out-of-order, partially-signed, partially-witnessed, likely-duplicitous, delegable) support CRUD: add, get, remove"
      - "Pruning timed-out escrow events is NOT a violation of append-only"
    examples:
      - "Event accepted at fn=3 in the KEL: permanent, never removed"
      - "Event in out-of-order escrow times out after 1200s: removed from escrow, NOT a KEL violation"
    related_terms: ["Incremental State Update", "Immediate Consistency"]

  - term: "Immediate Consistency"
    synonyms: []
    definition: "State is IMMEDIATELY consistent after escrow promotion. The full processEvent -> update -> logEvent path updates both in-memory state and persistent database synchronously. No staleness window exists. All operations are single-threaded within a processing pass."
    invariants:
      - "No staleness window after escrow promotion — state is updated synchronously"
      - "In-memory state and persistent database are updated in the same operation"
      - "All operations are single-threaded within a processing pass"
      - "State cache is written immediately after escrow promotion"
    examples:
      - "Event promoted from out-of-order escrow: full validation runs, event committed to KEL, state cache updated — all synchronous"
    related_terms: ["Incremental State Update", "State Reconstruction", "Key Event Verifier"]

  - term: "Stale Event"
    synonyms: ["Superseded Event"]
    definition: "An event whose sequence number is at or below the Key Event Verifier's last establishment event sequence number, making it too old to be a valid new event. Stale events are rejected by the state machine. The exception is recovery rotations (rot at sn > lastEst.s when the current event is ixn, or drt at sn == lastEst.s)."
    invariants:
      - "For rot: sn <= lastEst.s is stale and rejected"
      - "For drt: sn < lastEst.s is stale and rejected (sn == lastEst.s is a valid recovery)"
      - "Recovery rotation (rot): sn > lastEst.s but sn <= current sn — allowed only if the current event at that sn is an ixn"
      - "Stale event detection happens before any state mutation during rotation processing"
    examples:
      - "Current state: sn=5, lastEst.s=3. A rot at sn=2 is stale (2 <= 3)"
      - "Current state: sn=5, lastEst.s=3. A rot at sn=4 is a recovery attempt (4 > 3 but 4 <= 5) — valid only if event at sn=4 was an ixn"
    related_terms: ["Last Establishment Data", "Key Event Verifier", "Recovery Rotation"]

events:
  - name: "KeyEventVerifierCreated"
    payload: "aid: AID, sn: 0, key_state: KeyState, source: InceptionEvent"
    triggers: "An inception event (icp or dip) is processed, creating a new Key Event Verifier for the AID"

  - name: "KeyStateAdvanced"
    payload: "aid: AID, sn: int, key_state: KeyState, source: EstablishmentEvent, lastEst: LastEstablishmentData"
    triggers: "An establishment event (rot or drt) is processed, updating the Key Event Verifier's key state fields"

  - name: "SequenceAdvanced"
    payload: "aid: AID, sn: int, said: SAID"
    triggers: "An interaction event (ixn) is processed, advancing only the sequence number and event reference without modifying key state"

  - name: "ConfigTraitActivated"
    payload: "aid: AID, trait: TraitCode, source_sn: int"
    triggers: "An establishment event introduces a new configuration trait that was not previously active for the AID"

  - name: "StateReconstructed"
    payload: "aid: AID, sn: int, key_state: KeyState, method: 'replay' | 'cache'"
    triggers: "Key state is reconstructed either by replaying the KEL from inception or by loading from the state cache"

rules:
  - "One Key Event Verifier per AID — the state machine is keyed by AID prefix"
  - "Only establishment events (icp, rot, dip, drt) modify key state fields; interaction events (ixn) advance only sn and serder"
  - "Configuration traits are cumulative and irreversible — once activated, a trait cannot be deactivated"
  - "A rotation at sn <= lastEst.s is stale and must be rejected (for rot; drt allows sn == lastEst.s for recovery)"
  - "Recovery rotation is only valid when the superseded event is an interaction event — establishment events cannot be superseded"
  - "Incremental update and full reconstruction must produce identical key state for the same KEL — determinism is mandatory"
  - "The state machine enforces EstOnly by rejecting interaction events when the trait is active"
  - "lastEst is updated at every establishment event to track the most recent establishment event's sn and SAID"
  - "BADA (Best Available Data Algorithm) staleness for key state notices uses a two-tier criterion: (1) higher sequence number wins; (2) if sequence numbers are equal, later datetime wins. A notice is stale if it has an earlier sn than the stored notice, or the same sn but an earlier datetime"
  - "For non-transferable (bare) key state notices, BADA uses only datetime comparison (no sn available)"
