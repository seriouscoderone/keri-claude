domain_ref: "identity/state"

types:
  - name: "KeyState"
    description: "The current cryptographic configuration of an identifier at a given point in its event history. Derived from processing the KEL up to a specific establishment event."
    variants:
      - name: "default"
        fields:
          - name: "prefix"
            type: "string"
            required: true
            description: "The identifier (AID)"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the latest event"
            constraints:
              min: 0
          - name: "digest"
            type: "string"
            required: true
            description: "SAID of the latest event"
          - name: "ilk"
            type: "string"
            required: true
            description: "Type of the latest event"
          - name: "signing_keys"
            type: "array[string]"
            required: true
            description: "Current signing public keys"
          - name: "signing_threshold"
            type: "string"
            required: true
            description: "Current signing threshold expression"
          - name: "next_key_digests"
            type: "array[string]"
            required: true
            description: "Pre-rotation commitments for next keys"
          - name: "next_threshold"
            type: "string"
            required: true
            description: "Next key threshold expression"
          - name: "witness_threshold"
            type: "integer"
            required: true
            description: "TOAD — witness threshold"
          - name: "witnesses"
            type: "array[string]"
            required: true
            description: "Current witness AIDs"
          - name: "config_traits"
            type: "array[string]"
            required: true
            description: "Active configuration traits"
          - name: "delegator"
            type: "string"
            required: false
            description: "Delegator AID if delegated, absent if self-sovereign"
          - name: "transferable"
            type: "boolean"
            required: true
            description: "Whether this identifier can rotate keys"
          - name: "last_establishment_sn"
            type: "integer"
            required: true
            description: "Sequence number of the most recent establishment event"
          - name: "first_seen_sn"
            type: "integer"
            required: true
            description: "First-seen ordinal (fn) for ordering — per-AID monotonic counter, NOT global. Each identifier prefix has its own independent fn sequence starting from 0. fn provides ordering within a single identifier's history."
        invariants:
          - "Derived entirely from processing KEL events — not directly authored"
          - "signing_keys correspond to the latest establishment event's k field"
          - "next_key_digests correspond to the latest establishment event's n field"
          - "If next_key_digests is empty and sn > 0, identifier is abandoned"
          - "If next_key_digests is empty and sn == 0, identifier is non-transferable"
        examples:
          - format: "json"
            description: "Key state after inception — non-transferable, no witnesses"
            value: |
              {"prefix":"DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH","sn":0,"digest":"EPLRRJFe2FHdXKVTkSEX4xb4x-YaPFJ2Xds1vhtNTd4n","ilk":"icp","signing_keys":["DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH"],"signing_threshold":"1","next_key_digests":[],"next_threshold":"0","witness_threshold":0,"witnesses":[],"config_traits":[],"transferable":false,"last_establishment_sn":0,"first_seen_sn":0}
            notes: "Derived from non-transferable icp. next_key_digests=[] and sn=0 means non-transferable. Logical representation — keripy exposes via Kever attributes."

  - name: "TraitCode"
    description: "Configuration trait enum controlling operational constraints on an identifier."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            description: "The configuration trait code"
            constraints:
              enum: ["EstOnly", "DoNotDelegate", "DID", "RegistrarBackers", "NoRegistrarBackers"]
        invariants:
          - "EstOnly (EO) restricts the identifier to establishment events only — no interaction events"
          - "DoNotDelegate (DND) prevents the identifier from acting as a delegator"
          - "Traits are set at inception only — once set, a trait persists for the identifier's lifetime and cannot be removed (v2.0 admits c in rot wire format but keripy never applies it on rotation)"

  - name: "LastEstablishmentData"
    description: "Cached snapshot of the most recent establishment event's key configuration, used for efficient state queries without replaying the KEL."
    variants:
      - name: "default"
        fields:
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the last establishment event"
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the last establishment event"
          - name: "signing_keys"
            type: "array[PublicKey]"
            required: true
            description: "Current signing public keys from the last establishment event"
          - name: "signing_threshold"
            type: "string"
            required: true
            description: "Current signing threshold expression"
          - name: "next_digests"
            type: "array[Digest]"
            required: true
            description: "Pre-rotation commitments for next keys"
          - name: "next_threshold"
            type: "string"
            required: true
            description: "Next key threshold expression"
          - name: "witnesses"
            type: "array[AID]"
            required: true
            description: "Current witness set after applying adds and removes"
          - name: "toad"
            type: "integer"
            required: true
            description: "Witness threshold (TOAD) from the last establishment event"
        invariants:
          - "Derived from the most recent icp, rot, dip, or drt event — never from ixn"
          - "Updated each time a new establishment event is accepted"
          - "Interaction events do not change this data — only the overall sn advances"

  - name: "KeyStateNotice"
    description: "A signed reply message containing the current key state for an identifier. Used in key state queries (qry route=ksn) and key state notifications."
    variants:
      - name: "default"
        fields:
          - name: "key_state"
            type: "types://identity/state#KeyState"
            required: true
            description: "The current key state snapshot"
          - name: "reply_datetime"
            type: "string"
            required: true
            description: "ISO 8601 datetime of this notice"
          - name: "route"
            type: "string"
            required: true
            description: "Reply route — /ksn/{aid}"
            constraints:
              pattern: "^/ksn/.+"
        invariants:
          - "Key state is a pure function of the KEL — two validators with the same KEL produce the same notice"
          - "Reply is signed by the responder's current keys"
          - "Subject to BADA acceptance — staler notices do not overwrite fresher ones"

  - name: "QueryResult"
    description: "The outcome of querying for key state or KEL events."
    variants:
      - name: "found"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "The queried AID"
          - name: "key_state"
            type: "types://identity/state#KeyState"
            required: true
            description: "Current key state"
        invariants:
          - "Key state reflects the latest verified establishment event"
      - name: "not_found"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "The queried AID"
          - name: "escrowed"
            type: "boolean"
            required: true
            description: "Whether the query was escrowed for later retry"
        invariants:
          - "Query is escrowed if the KEL for this AID has not been received yet"

  - name: "WriteOutcome"
    description: "Result of submitting an event to the KEL Repository guard. The guard validates the event and produces one of three outcomes."
    variants:
      - name: "accepted"
        fields:
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the accepted event, now appended to the KEL"
          - name: "first_seen_number"
            type: "integer"
            required: false
            description: "First-seen ordinal assigned to this event. Absent when this is a duplicate event (same SAID) whose new signatures were merged — no new fn is assigned. Present as integer when this is the first acceptance."
          - name: "datetime"
            type: "string"
            required: true
            description: "ISO 8601 datetime of acceptance"
        invariants:
          - "When first_seen_number is non-null: event newly appended to KEL with that fn"
          - "When first_seen_number is null: duplicate signature accumulation — signatures merged, fn unchanged"
          - "Key state has been updated to reflect this event"
      - name: "escrowed"
        fields:
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the escrowed event"
          - name: "escrow_reason"
            type: "string"
            required: true
            description: "Which validation check failed — determines the escrow queue (e.g., out-of-order, partial signatures, missing witness receipts, pending delegation)"
        invariants:
          - "The event is stored in a pending queue keyed by its blocking condition"
          - "When the blocking condition resolves, the event re-enters the guard for full re-validation"
      - name: "rejected"
        fields:
          - name: "reason"
            type: "string"
            required: true
            description: "Why the event was permanently rejected"
        invariants:
          - "The event is not stored — it is dropped"
          - "Rejection is terminal — the event will not be retried unless re-submitted by the caller"

  - name: "EscrowReprocessResult"
    description: "Result of draining an escrow queue — events that were pending may now be accepted, remain escrowed, or be rejected."
    variants:
      - name: "default"
        fields:
          - name: "promoted"
            type: "integer"
            required: true
            description: "Number of events promoted from escrow to the KEL"
          - name: "remaining"
            type: "integer"
            required: true
            description: "Number of events still escrowed"
          - name: "expired"
            type: "integer"
            required: true
            description: "Number of events pruned due to timeout"
        invariants:
          - "promoted + remaining + expired = total events in the queue before reprocessing"
