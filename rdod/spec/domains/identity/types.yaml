# types.yaml
domain_ref: "identity"

types:
  - name: "InceptionConfig"
    description: "Construction parameters for creating a new identifier. Captures all five type dimensions."
    variants:
      - name: "default"
        fields:
          - name: "signing_keys"
            type: "array[PublicKey]"
            required: true
            description: "Initial signing public keys"
            constraints:
              min_length: 1
          - name: "signing_threshold"
            type: "string"
            required: true
            description: "Signing threshold expression (simple integer or weighted)"
            constraints:
              min: "1"
          - name: "next_key_digests"
            type: "array[string]"
            required: true
            description: "Pre-rotation commitments — digests of next signing keys. Empty for non-transferable."
          - name: "next_threshold"
            type: "string"
            required: true
            description: "Next key threshold. '0' for non-transferable."
          - name: "witnesses"
            type: "array[WitnessAID]"
            required: true
            description: "Designated witness AIDs. Empty for unwitnessed."
          - name: "witness_threshold"
            type: "integer"
            required: true
            description: "TOAD — witness threshold. 0 for unwitnessed."
            constraints:
              min: 0
          - name: "config_traits"
            type: "array[string]"
            required: true
            description: "Operational constraints: EO, DND, DID, RB, NRB"
            constraints:
              enum: ["EO", "DND", "DID", "RB", "NRB"]
          - name: "delegator"
            type: "string"
            required: false
            description: "Delegator AID — if present, creates a delegated identifier (dip instead of icp)"
        invariants:
          - "len(signing_keys) >= integer(signing_threshold) for simple thresholds"
          - "witness_threshold <= len(witnesses)"
          - "If next_key_digests is empty, identifier is non-transferable"
          - "If delegator is present, inception uses dip ilk"

  - name: "EstablishmentEvent"
    description: "Subset of KeyEvent that changes key state — inception or rotation. Excludes interaction events."
    variants:
      - name: "default"
        fields:
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "Must be inception or rotation variant, not interaction"
        invariants:
          - "Only icp, rot, dip, drt ilks — never ixn"
          - "Modifies signing keys, thresholds, witness set, or next key commitments"

  - name: "EventValidated"
    description: "Result of successfully processing and accepting a key event into the KEL."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "The AID whose KEL was updated"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the accepted event"
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the accepted event"
        invariants:
          - "Event has passed signature, witness, and delegation validation"
          - "Key state has been updated to reflect this event"

  - name: "EscrowType"
    description: "Classification of escrow queues for events awaiting different blocking conditions."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            constraints:
              enum: ["OutOfOrder", "PartiallySigned", "PartiallyWitnessed", "PartiallyDelegated", "LikelyDuplicitous", "Misfit"]
        invariants:
          - "OutOfOrder (OOE) — event sn > expected, prior event not yet received"
          - "PartiallySigned (PSE) — insufficient controller signatures for threshold"
          - "PartiallyWitnessed (PWE) — insufficient witness receipts for TOAD"
          - "PartiallyDelegated (PDE) — delegator's approval seal not yet found"
          - "LikelyDuplicitous (LDE) — conflicting event detected, held as evidence"
          - "Misfit — remote event targeting a local AID, requires local re-sourcing"

  - name: "EscrowedEvent"
    description: "An event held in escrow awaiting resolution of its blocking condition."
    variants:
      - name: "default"
        fields:
          - name: "escrow_type"
            type: "types://identity#EscrowType"
            required: true
            description: "Which escrow queue holds this event"
          - name: "aid"
            type: "string"
            required: true
            description: "AID prefix of the escrowed event"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the escrowed event"
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "The escrowed event data"
          - name: "escrowed_at"
            type: "datetime"
            required: true
            description: "When the event was escrowed — used for timeout pruning"
        invariants:
          - "Each event is in exactly one escrow type at a time"
          - "Escrowed events are temporary — promoted to KEL or pruned at timeout"

  # ExchangeMessage, QueryMessage, ReplyMessage moved to domain://keri-messaging
