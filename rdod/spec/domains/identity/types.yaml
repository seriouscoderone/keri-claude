# types.yaml
domain_ref: "identity"

types:
  - name: "InceptionEvent"
    description: "Creates a new KERI identifier. Establishes all five type dimensions: transferability, delegation, witnessing, signing model, and operational constraints."
    variants:
      - name: "non-delegated"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string — protocol, version, serialization kind, size"
            constraints:
              pattern: "KERI[A-Za-z0-9_-]{13}\\."
          - name: "t"
            type: "string"
            required: true
            description: "Message type (ilk)"
            constraints:
              enum: ["icp"]
          - name: "d"
            type: "string"
            required: true
            description: "SAID — self-addressing identifier computed over the event body"
          - name: "i"
            type: "string"
            required: true
            description: "AID prefix — for inception, computed as SAID of the event (self-certifying)"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number — hex-encoded, always '0' for inception"
            constraints:
              enum: ["0"]
          - name: "kt"
            type: "string"
            required: true
            description: "Signing threshold — integer, fractional weight list, or combination expression"
            constraints:
              min: "1"
          - name: "k"
            type: "array[string]"
            required: true
            description: "Current signing public keys — CESR-qualified (qb64)"
            constraints:
              min_length: 1
          - name: "nt"
            type: "string"
            required: true
            description: "Next key threshold — '0' for non-transferable, threshold expression for transferable"
          - name: "n"
            type: "array[string]"
            required: true
            description: "Next key digests — pre-rotation commitments. Empty for non-transferable."
          - name: "bt"
            type: "string"
            required: true
            description: "Witness threshold (TOAD) — hex-encoded"
            constraints:
              min: "0"
          - name: "b"
            type: "array[string]"
            required: true
            description: "Witness AIDs — non-transferable identifiers of designated witnesses"
          - name: "c"
            type: "array[string]"
            required: true
            description: "Configuration traits — operational constraints (EO, DND, DID, RB, NRB)"
            constraints:
              enum: ["EO", "DND", "DID", "RB", "NRB"]
          - name: "a"
            type: "array[map]"
            required: true
            description: "Anchors — seal list for binding external data at inception"
        invariants:
          - "d and i are both computed as SAID of the event body"
          - "len(k) >= integer(kt) when kt is simple integer"
          - "If n is empty and nt is '0', identifier is non-transferable"
          - "If n is non-empty, identifier is transferable"
          - "bt must satisfy: 0 <= integer(bt) <= len(b)"
          - "If b is empty, bt must be '0'"
        examples:
          - format: "json"
            description: "Non-transferable single-key inception (no witnesses, no next keys)"
            value: |
              {"v":"KERI10JSON0000fd_","t":"icp","d":"EPLRRJFe2FHdXKVTkSEX4xb4x-YaPFJ2Xds1vhtNTd4n","i":"DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH","s":"0","kt":"1","k":["DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH"],"nt":"0","n":[],"bt":"0","b":[],"c":[],"a":[]}
            notes: "d and i are both SAIDs — self-certifying. Non-transferable: nt='0', n=[]. From keripy test_eventing.py"
          - format: "json"
            description: "Transferable inception with next key commitment"
            value: |
              {"v":"KERI10JSON00012b_","t":"icp","d":"EAKCxMOuoRzREVHsHCkLilBrUXTvyenBiuM2","i":"EAKCxMOuoRzREVHsHCkLilBrUXTvyenBiuM2","s":"0","kt":"1","k":["DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH"],"nt":"1","n":["EIsKL3B6Zz5ICGxCQp-SoLXjwOrdlSbLJrEn21c2zVaU"],"bt":"0","b":[],"c":[],"a":[]}
            notes: "Transferable: nt='1', n has next key digest. From keripy test_eventing.py"
      - name: "delegated"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            description: "Message type"
            constraints:
              enum: ["dip"]
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "AID prefix (self-certifying SAID)"
          - name: "s"
            type: "string"
            required: true
            constraints:
              enum: ["0"]
            description: "Sequence number — always '0'"
          - name: "kt"
            type: "string"
            required: true
            description: "Signing threshold"
          - name: "k"
            type: "array[string]"
            required: true
            description: "Signing keys"
          - name: "nt"
            type: "string"
            required: true
            description: "Next key threshold"
          - name: "n"
            type: "array[string]"
            required: true
            description: "Next key digests"
          - name: "bt"
            type: "string"
            required: true
            description: "Witness threshold"
          - name: "b"
            type: "array[string]"
            required: true
            description: "Witness AIDs"
          - name: "c"
            type: "array[string]"
            required: true
            description: "Configuration traits"
          - name: "a"
            type: "array[map]"
            required: true
            description: "Anchors"
          - name: "di"
            type: "string"
            required: true
            description: "Delegator AID — the identifier that authorizes this delegation"
        invariants:
          - "All non-delegated invariants apply"
          - "di must be a valid AID prefix with established key state"
          - "Delegator must anchor a seal in their KEL approving this event"
    construction_defaults:
      s: "0"
      c: "[]"
      a: "[]"
    encoding:
      - format: "json"
        notes: "Fields in canonical insertion order. SAID computed with d and i as placeholder strings."
      - format: "cbor"
        notes: "Same field ordering as JSON. CBOR map preserves insertion order."
      - format: "cesr"
        notes: "CESR native encoding uses -G## count code. No embedded version string."

  - name: "RotationEvent"
    description: "Changes the signing keys, next key commitments, and/or witness set for an existing identifier."
    variants:
      - name: "non-delegated"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["rot"]
            description: "Message type"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "AID prefix — must match existing identifier"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number — hex, must be next expected sn"
            constraints:
              min: "1"
          - name: "p"
            type: "string"
            required: true
            description: "Prior event SAID — hash chain link"
          - name: "kt"
            type: "string"
            required: true
            description: "New signing threshold"
          - name: "k"
            type: "array[string]"
            required: true
            description: "New signing keys — must match prior next key digest commitments"
          - name: "nt"
            type: "string"
            required: true
            description: "New next key threshold — '0' with empty n for abandonment"
          - name: "n"
            type: "array[string]"
            required: true
            description: "New next key digests — empty for abandonment"
          - name: "bt"
            type: "string"
            required: true
            description: "Witness threshold"
          - name: "br"
            type: "array[string]"
            required: true
            description: "Witnesses to remove (cut)"
          - name: "ba"
            type: "array[string]"
            required: true
            description: "Witnesses to add"
          - name: "a"
            type: "array[map]"
            required: true
            description: "Anchors"
        invariants:
          - "New keys k must satisfy: for each key, its digest matches one of the prior n commitments"
          - "Prior event SAID p must match the SAID of the event at sn-1"
          - "If n is empty and nt is '0', this is an abandonment — no further events allowed"
          - "Resulting witness set = (prior witnesses - br) + ba"
          - "bt must satisfy: 0 <= integer(bt) <= len(resulting witness set)"
        examples:
          - format: "json"
            description: "Single-key rotation with new next commitment"
            value: |
              {"v":"KERI10JSON000160_","t":"rot","d":"EFl8nvRCbN2xQJI75nBXp-gaXuHJw8zheVjwMN_rB-pb","i":"DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH","s":"1","p":"EJQUyxnzIAtmZPoq9f4fExeGN0qfJmaFnUEKTwIiTBPj","kt":"1","k":["DB4GWvru73jWZKpNgMQp8ayDRin0NG0Ymn_RXQP_v-PQ"],"nt":"1","n":["EIsKL3B6Zz5ICGxCQp-SoLXjwOrdlSbLJrEn21c2zVaU"],"bt":"0","br":[],"ba":[],"a":[]}
            notes: "p links to prior event SAID. New k must match prior n digests. From keripy test_eventing.py"
      - name: "delegated"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["drt"]
            description: "Message type — delegated rotation"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "AID prefix"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number"
          - name: "p"
            type: "string"
            required: true
            description: "Prior event SAID"
          - name: "kt"
            type: "string"
            required: true
            description: "New signing threshold"
          - name: "k"
            type: "array[string]"
            required: true
            description: "New signing keys"
          - name: "nt"
            type: "string"
            required: true
            description: "New next key threshold"
          - name: "n"
            type: "array[string]"
            required: true
            description: "New next key digests"
          - name: "bt"
            type: "string"
            required: true
            description: "Witness threshold"
          - name: "br"
            type: "array[string]"
            required: true
            description: "Witnesses to remove"
          - name: "ba"
            type: "array[string]"
            required: true
            description: "Witnesses to add"
          - name: "a"
            type: "array[map]"
            required: true
            description: "Anchors"
        invariants:
          - "All non-delegated rotation invariants apply"
          - "Delegator must anchor a seal in their KEL approving this rotation"

  - name: "InteractionEvent"
    description: "Anchors data to the identifier's KEL without changing key state. Only allowed for transferable identifiers without the EO (Establishment Only) trait."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["ixn"]
            description: "Message type"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "AID prefix"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number"
          - name: "p"
            type: "string"
            required: true
            description: "Prior event SAID"
          - name: "a"
            type: "array[map]"
            required: true
            description: "Anchors — the data seals being bound to this identifier"
        invariants:
          - "Identifier must be transferable (n was non-empty at inception)"
          - "Identifier must NOT have EO (Establishment Only) trait"
          - "Prior event SAID p must match the SAID at sn-1"
          - "Does NOT change key state — no kt, k, nt, n, bt, b fields"
        examples:
          - format: "json"
            description: "Interaction event with no seals"
            value: |
              {"v":"KERI10JSON0000cb_","t":"ixn","d":"EKKccCumVQdgxvsrSXvuTtjmS28Xqf3zRJ8T6peKgl9J","i":"DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH","s":"2","p":"ECauhEzA4DJDXVDnNQiGQ0sKXa6sx_GgS8Ebdzm4E-kQ","a":[]}
            notes: "No key state change. p links to prior event. a=[] means no seals. From keripy test_eventing.py"

  - name: "KeyState"
    description: "The current cryptographic configuration of an identifier at a given point in its event history. Derived from processing the KEL up to a specific establishment event."
    variants:
      - name: "default"
        fields:
          - name: "prefix"
            type: "string"
            required: true
            description: "The identifier (AID)"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the latest event"
            constraints:
              min: 0
          - name: "digest"
            type: "string"
            required: true
            description: "SAID of the latest event"
          - name: "ilk"
            type: "string"
            required: true
            description: "Type of the latest event"
          - name: "signing_keys"
            type: "array[string]"
            required: true
            description: "Current signing public keys"
          - name: "signing_threshold"
            type: "string"
            required: true
            description: "Current signing threshold expression"
          - name: "next_key_digests"
            type: "array[string]"
            required: true
            description: "Pre-rotation commitments for next keys"
          - name: "next_threshold"
            type: "string"
            required: true
            description: "Next key threshold expression"
          - name: "witness_threshold"
            type: "integer"
            required: true
            description: "TOAD — witness threshold"
          - name: "witnesses"
            type: "array[string]"
            required: true
            description: "Current witness AIDs"
          - name: "config_traits"
            type: "array[string]"
            required: true
            description: "Active configuration traits"
          - name: "delegator"
            type: "string"
            required: false
            description: "Delegator AID if delegated, absent if self-sovereign"
          - name: "transferable"
            type: "boolean"
            required: true
            description: "Whether this identifier can rotate keys"
          - name: "last_establishment_sn"
            type: "integer"
            required: true
            description: "Sequence number of the most recent establishment event"
          - name: "first_seen_sn"
            type: "integer"
            required: true
            description: "First-seen ordinal for ordering"
        invariants:
          - "Derived entirely from processing KEL events — not directly authored"
          - "signing_keys correspond to the latest establishment event's k field"
          - "next_key_digests correspond to the latest establishment event's n field"
          - "If next_key_digests is empty and sn > 0, identifier is abandoned"
          - "If next_key_digests is empty and sn == 0, identifier is non-transferable"
        examples:
          - format: "json"
            description: "Key state after inception — non-transferable, no witnesses"
            value: |
              {"prefix":"DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH","sn":0,"digest":"EPLRRJFe2FHdXKVTkSEX4xb4x-YaPFJ2Xds1vhtNTd4n","ilk":"icp","signing_keys":["DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH"],"signing_threshold":"1","next_key_digests":[],"next_threshold":"0","witness_threshold":0,"witnesses":[],"config_traits":[],"transferable":false,"last_establishment_sn":0,"first_seen_sn":0}
            notes: "Derived from non-transferable icp. next_key_digests=[] and sn=0 means non-transferable. Logical representation — keripy exposes via Kever attributes."

  # ExchangeMessage, QueryMessage, ReplyMessage moved to kernel://keri-messaging
