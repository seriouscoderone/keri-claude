# types.yaml
domain_ref: "identity"

types:
  - name: "InceptionConfig"
    description: "Construction parameters for creating a new identifier. Captures all five type dimensions."
    variants:
      - name: "default"
        fields:
          - name: "signing_keys"
            type: "array[PublicKey]"
            required: true
            description: "Initial signing public keys"
            constraints:
              min_length: 1
          - name: "signing_threshold"
            type: "string"
            required: true
            description: "Signing threshold expression (simple integer or weighted)"
            constraints:
              min: "1"
          - name: "next_key_digests"
            type: "array[string]"
            required: true
            description: "Pre-rotation commitments — digests of next signing keys. Empty for non-transferable."
          - name: "next_threshold"
            type: "string"
            required: true
            description: "Next key threshold. '0' for non-transferable."
          - name: "witnesses"
            type: "array[WitnessAID]"
            required: true
            description: "Designated witness AIDs. Empty for unwitnessed."
          - name: "witness_threshold"
            type: "integer"
            required: true
            description: "TOAD — witness threshold. 0 for unwitnessed."
            constraints:
              min: 0
          - name: "config_traits"
            type: "array[string]"
            required: true
            description: "Operational constraints: EO, DND, DID, RB, NRB"
            constraints:
              enum: ["EO", "DND", "DID", "RB", "NRB"]
          - name: "delegator"
            type: "string"
            required: false
            description: "Delegator AID — if present, creates a delegated identifier (dip instead of icp)"
        invariants:
          - "len(signing_keys) >= integer(signing_threshold) for simple thresholds"
          - "witness_threshold <= len(witnesses)"
          - "If next_key_digests is empty, identifier is non-transferable"
          - "If delegator is present, inception uses dip ilk"

  - name: "EstablishmentEvent"
    description: "Subset of KeyEvent that changes key state — inception or rotation. Excludes interaction events."
    variants:
      - name: "default"
        fields:
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "Must be inception or rotation variant, not interaction"
        invariants:
          - "Only icp, rot, dip, drt ilks — never ixn"
          - "Modifies signing keys, thresholds, witness set, or next key commitments"

  - name: "EventValidated"
    description: "Result of successfully processing and accepting a key event into the KEL."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "The AID whose KEL was updated"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the accepted event"
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the accepted event"
        invariants:
          - "Event has passed signature, witness, and delegation validation"
          - "Key state has been updated to reflect this event"

  - name: "EscrowType"
    description: "Classification of escrow queues for events awaiting different blocking conditions. The canonical set of identity-domain escrow queues, with abbreviation mappings to keripy/protocol shorthand."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            constraints:
              enum: ["OutOfOrder", "UnverifiedWitnessReceipt", "UnverifiedNonTransferableReceipt", "UnverifiedTransferableReceipt", "PartiallySigned", "PartiallyWitnessed", "PartiallyDelegated", "Delegable", "LikelyDuplicitous", "Misfit"]
    abbreviation_map:
      OOE: "OutOfOrder"
      UWE: "UnverifiedWitnessReceipt"
      URE: "UnverifiedNonTransferableReceipt"
      VRE: "UnverifiedTransferableReceipt"
      PSE: "PartiallySigned"
      PWE: "PartiallyWitnessed"
      PDE: "PartiallyDelegated"
      Delegable: "Delegable"
      LDE: "LikelyDuplicitous"
      MFE: "Misfit"
    invariants:
      - "OutOfOrder (OOE) — event sn > expected, prior event not yet received"
      - "UnverifiedWitnessReceipt (UWE) — witness receipt whose event has not yet been accepted into the KEL"
      - "UnverifiedNonTransferableReceipt (URE) — non-transferable receipt whose signing key state has not yet been verified"
      - "UnverifiedTransferableReceipt (VRE) — transferable receipt whose signing key state has not yet been verified"
      - "PartiallySigned (PSE) — insufficient controller signatures for threshold"
      - "PartiallyWitnessed (PWE) — insufficient witness receipts for TOAD"
      - "PartiallyDelegated (PDE) — delegator's approval seal not yet found"
      - "Delegable — delegated event received before the delegator has committed the approval seal; distinct from PDE which holds events whose delegator KEL is known but seal is missing"
      - "LikelyDuplicitous (LDE) — conflicting event detected, held as evidence"
      - "Misfit (MFE) — remote event targeting a local AID, requires local re-sourcing; has no periodic sweep — resolved only when the same event arrives from a local (authorized) source (source-promotion escrow, not time-based retry)"

  - name: "EscrowedEvent"
    description: "An event held in escrow awaiting resolution of its blocking condition."
    variants:
      - name: "default"
        fields:
          - name: "escrow_type"
            type: "types://identity#EscrowType"
            required: true
            description: "Which escrow queue holds this event"
          - name: "aid"
            type: "string"
            required: true
            description: "AID prefix of the escrowed event"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the escrowed event"
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "The escrowed event data"
          - name: "escrowed_at"
            type: "datetime"
            required: true
            description: "When the event was escrowed — used for timeout pruning"
        invariants:
          - "Each event is in exactly one escrow type at a time"
          - "Escrowed events are temporary — promoted to KEL or pruned at timeout"

  - name: "InteractionEvent"
    description: "A Non-Establishment Key Event that anchors data commitments (seals) to the KEL without changing Key State. Field order: v, t, d, i, s, p, a."
    variants:
      - name: "default"
        fields:
          - name: "seal_list"
            type: "array[Seal]"
            description: "List of cryptographic commitments anchored to the KEL at this event"
        invariants:
          - "Does NOT change Key State"
          - "Carries a seal list for data commitments"
          - "Sequence number is one greater than the prior event"
          - "Must be signed by a Signing Threshold-satisfying subset of current signing keys"

  - name: "SequenceNumber"
    description: "A strictly monotonically increasing non-negative integer (hex-encoded) identifying an event's position in the KEL. Distinct from First-Seen Number (fn) which tracks acceptance order. Field label: s."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "integer"
            constraints:
              min: 0
              max: "2^128 - 1"
        invariants:
          - "Inception and Delegated Inception events MUST have s=0"
          - "Each subsequent event's sn MUST be exactly 1 greater than the prior event"
          - "Different from First-Seen Number: sn is position, fn is acceptance order"

  - name: "PriorEventDigest"
    description: "The SAID of the immediately preceding event in the KEL, providing backward hash-chaining. Field label: p. Not present in inception events."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            description: "Qualified SAID (self-addressing identifier) of the prior event"
        invariants:
          - "Must equal the SAID (d field) of the event at sn-1"
          - "Not present in inception events (icp, dip)"
          - "Creates tamper-evident backward chain"

  - name: "RotationConfig"
    description: "Construction parameters for rotating an existing identifier's keys. The symmetric counterpart to InceptionConfig — captures all parameters needed to build a rotation event (rot or drt)."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "AID of the identifier being rotated"
          - name: "new_signing_keys"
            type: "array[PublicKey]"
            required: true
            description: "New signing keys — must match prior next key digest commitments"
            constraints:
              min_length: 1
          - name: "new_signing_threshold"
            type: "string"
            required: true
            description: "New signing threshold expression for the new signing keys"
          - name: "new_next_key_digests"
            type: "array[string]"
            required: true
            description: "Pre-rotation commitments for the NEXT rotation. Empty for abandonment."
          - name: "new_next_threshold"
            type: "string"
            required: true
            description: "Next key threshold. '0' for abandonment."
          - name: "witness_threshold"
            type: "integer"
            required: true
            description: "New TOAD — witness threshold after rotation"
            constraints:
              min: 0
          - name: "witnesses_to_remove"
            type: "array[WitnessAID]"
            required: true
            description: "Witnesses to remove (br field). Empty if no changes."
          - name: "witnesses_to_add"
            type: "array[WitnessAID]"
            required: true
            description: "Witnesses to add (ba field). Empty if no changes."
          - name: "anchors"
            type: "array[Seal]"
            required: true
            description: "Optional seals to anchor in the rotation event (a field)"
        invariants:
          - "For each key in new_signing_keys: digest(key) MUST match one entry in prior next key digest list"
          - "The matched subset must satisfy the prior next threshold (dual threshold check)"
          - "If new_next_key_digests is empty: new_next_threshold MUST be '0' (abandonment)"
          - "new witness set = (prior witnesses - witnesses_to_remove) + witnesses_to_add"
          - "0 <= witness_threshold <= len(new witness set)"

  # ExchangeMessage, QueryMessage, ReplyMessage moved to domain://keri-messaging
