# ubiquitous-language.yaml
domain_ref: "identity/establishment"

imports:
  - term: "Threshold Satisfaction"
    from: "domain://identity/thresholds"
    usage: "Used in step 3 of the event validation pipeline to check if verified signature indices meet the signing threshold, and in step 4 to check the rotation threshold"

  - term: "Witness Threshold Check"
    from: "domain://accountability"
    usage: "Used in step 5 of the event validation pipeline to verify that sufficient witness receipts have been collected before accepting an event"

  - term: "Quorum Calculation"
    from: "domain://accountability/consensus"
    usage: "Used by Event Creation Functions to derive default signing and witness thresholds when not explicitly provided by the caller"

terms:
  - term: "Event Validation Pipeline"
    synonyms: ["processEvent() [keripy]", "process_notice() [keriox]"]
    definition: "The complete step-by-step sequence that validates an incoming key event from receipt to acceptance or escrow. Implemented by the Event Processor (Kevery/EventProcessor). Each step either passes (advancing to the next) or fails with a typed error that routes the event to the appropriate escrow queue."
    invariants:
      - "Step 1: Check if prefix is known. If unknown and event is inception, create new Key Event Verifier. If unknown and not inception, escrow as out-of-order."
      - "Step 2: Check sequence number. If sn > expected, escrow as out-of-order. If sn < expected, check for duplicate (same SAID = idempotent) or duplicity (different SAID = likely duplicitous escrow)."
      - "Step 3: If sn == expected, call full validation (valSigsWigsDel / validate_event)."
      - "Step 4: On validation success, log event to KEL, update key state, emit receipt cue."
      - "Step 5: On validation failure, escrow to appropriate queue based on error type."
      - "The pipeline is re-entrant: escrowed events are reprocessed through the same pipeline when their blocking condition resolves."
    examples:
      - "Rotation at sn=2 arrives: prefix known, sn matches expected -> validate signatures + thresholds + witnesses + delegation -> accept to KEL"
      - "Event at sn=5 arrives but sn=4 is missing -> escrow to out-of-order -> when sn=4 arrives and is accepted, sn=5 is reprocessed from escrow"
    related_terms: ["Dual Threshold Verification", "Signature Verification", "Threshold Satisfaction", "Pre-rotation Binding"]

  - term: "Dual Threshold Verification"
    synonyms: ["valSigsWigsDel() [keripy]", "validate_event() [keriox]"]
    definition: "The core validation logic that checks signatures, witness receipts, and delegation for an event. For rotation events, enforces DUAL threshold: signatures must satisfy BOTH the current signing threshold AND the prior next-key threshold (pre-rotation binding)."
    invariants:
      - "Step 1: Verify signature count -- at least one valid signature required"
      - "Step 2: Verify each signature cryptographically against the event serialization and the corresponding public key (calls Signature Verification)"
      - "Step 3: Check signing threshold satisfaction -- tholder.satisfy(indices) with verified signature indices"
      - "Step 4 (rotation only): Check pre-rotation binding -- ntholder.satisfy(ondices) using exposed next-key indices"
      - "Step 5: Check witness threshold -- toader.satisfy(windices) using verified witness receipt indices"
      - "Step 6 (delegated only): Validate delegation seal -- delegator's KEL must contain an anchor committing to this event"
      - "Failure at any step routes to the appropriate escrow queue (PSE for sigs, PWE for witnesses, PDE for delegation)"
    examples:
      - "Rotation with 2-of-3 threshold: signatures from keys at indices [0, 2] -> tholder.satisfy([0, 2]) with thold=2 -> True"
      - "Same rotation also checks: ondices [0, 2] map to pre-committed next keys -> ntholder.satisfy([0, 2]) -> True"
    related_terms: ["Event Validation Pipeline", "Signature Verification", "Pre-rotation Binding", "Threshold Satisfaction", "Witness Threshold Check", "Delegation Validation"]

  - term: "Signature Verification"
    synonyms: ["verifySigs() [keripy]", "KeyConfig.verify() [keriox]"]
    definition: "Cryptographic verification of each indexed controller signature against the event serialization bytes and the public key at the corresponding index in the current signing key list. Returns the set of indices whose signatures are valid."
    invariants:
      - "Each Indexed Signature carries an index specifying its position in the signing key list"
      - "For each Indexed Signature: verfer_at[siger.index].verify(siger.raw, event_raw) must return True"
      - "Invalid signatures are silently dropped -- only valid indices are collected"
      - "At least one valid signature is required to proceed (otherwise immediate reject)"
      - "The raw bytes verified are the serialized event body (not the full message with attachments)"
    examples:
      - "3-key list, Sigers at indices [0, 2]: verify key[0] against sig[0] -> valid; verify key[2] against sig[2] -> valid; return indices=[0, 2]"
      - "Indexed Signature at index 1 fails verification -> index 1 excluded from the valid set"
    related_terms: ["Dual Threshold Verification", "Threshold Satisfaction", "Indexed Signature"]

  - term: "Pre-rotation Binding"
    synonyms: ["exposeds() [keripy]", "verify_next() / check_threshold() [keriox]"]
    definition: "The mechanism that enforces pre-rotation commitments during key rotation. Each indexed signature in a rotation event carries both an index (position in current key list) and an ondex (position in the prior next-key digest list). The binding is verified by computing the digest of the new signing key and comparing it to the pre-committed digest at the ondex position."
    invariants:
      - "Each Indexed Signature carries index (current key position) and ondex (next key position)"
      - "For each siger: digest(new_key_at[index]) must equal prior_next_digest_at[ondex]"
      - "Only ondices with valid key-digest matches count toward the next threshold"
      - "The next threshold (ntholder) must be satisfied by the matched ondices"
      - "BothSigCodex codes auto-match ondex=index; CurrentSigCodex codes have no ondex (current signing list only)"
      - "This prevents an attacker from rotating to arbitrary keys -- they must use the pre-committed keys"
    examples:
      - "Prior inception committed to next digests [D(N1), D(N2), D(N3)]. Rotation presents keys [N1, N2, N3]. Indexed Signature at index=0 has ondex=0 -> digest(N1) must equal D(N1) -> match."
      - "Attacker tries rotation with unauthorized key K4 at index=0 -> digest(K4) != D(N1) -> no ondex match -> next threshold not satisfied -> rejected"
    related_terms: ["Dual Threshold Verification", "Threshold Satisfaction", "Pre-rotation Commitment", "Ondex"]

  - term: "Delegation Validation"
    synonyms: ["validateDelegation() [keripy]", "validate_seal() / get_delegator_seal() [keriox]"]
    definition: "For delegated events (dip/drt), verification that the delegator's KEL contains an anchoring seal committing to the delegated event. The delegator must have an interaction or rotation event whose anchor field contains an event seal referencing the delegated event's prefix, sequence number, and SAID."
    invariants:
      - "Only applies to delegated event types (dip and drt)"
      - "The delegator's AID is taken from the di field (dip) or inherited from inception (drt)"
      - "The delegator's KEL must contain a seal: {i: delegatee_prefix, s: delegatee_sn, d: delegatee_SAID}"
      - "If the delegator's anchoring event is not yet known, the event is escrowed to PDE"
      - "Cooperative delegation: delegator approves by anchoring the seal in its own KEL"
    examples:
      - "dip event for delegatee D1: check delegator D0's KEL for an ixn/rot containing seal {i: D1, s: '0', d: D1_inception_SAID}"
      - "Delegator's ixn not yet received -> escrow to Partially-Delegated Escrow -> reprocess when delegator's event arrives"
    related_terms: ["Dual Threshold Verification", "Delegation Seal", "Delegator", "Delegatee"]

  - term: "Local Source Protection"
    synonyms: ["Misfit Event Source", "escrowMFEvent() [keripy]"]
    definition: "Security mechanism that prevents remote sources from injecting events for locally-owned, locally-witnessed, or locally-delegated identifiers. Events from remote sources targeting these protected identifiers are escrowed as 'misfits' rather than accepted, forcing re-sourcing through protected channels."
    invariants:
      - "Applies when: event source is remote AND (AID is locally owned OR locally witnessed OR locally delegated)"
      - "Escrowed to misfit queue -- not rejected, but held for local re-sourcing"
      - "Local events (from the controller's own device) bypass this check"
      - "Prevents an attacker from using a compromised network to inject events for identifiers the node controls"
      - "Checked early in the validation pipeline, before signature verification"
    examples:
      - "A rotation event for our own AID arrives from an external network connection -> escrowed as misfit -> must be re-submitted through the local protected channel"
    related_terms: ["Event Validation Pipeline", "Event Locality", "Event Source Record"]

  - term: "Event Field Structure"
    synonyms: ["KED Fields [keripy]", "Key Event Dict", "EventData [keriox]"]
    definition: "The normative field layout for each KERI key event type. Field ordering is significant — serialization must preserve the declared order for deterministic SAID computation. Each event type (ilk) has a fixed set of required fields and a specific field order."
    invariants:
      - "Common fields across all types: v (version string), t (type/ilk), d (SAID), i (identifier prefix), s (sequence number hex)"
      - "Chain field: p (prior event SAID) — present in all events except inception"
      - "Key fields: kt (signing threshold), k (signing keys list), nt (next threshold), n (next key digests list)"
      - "Witness fields: bt (witness threshold/TOAD), b (witness list in inception), br (witnesses removed in rotation), ba (witnesses added in rotation)"
      - "Inception order: v, t, d, i, s, kt, k, nt, n, bt, b, c, a"
      - "Rotation order: v, t, d, i, s, p, kt, k, nt, n, bt, br, ba, c, a"
      - "Interaction order: v, t, d, i, s, p, a"
      - "Delegated inception order: v, t, d, i, s, kt, k, nt, n, bt, b, c, a, di"
    examples:
      - "Inception: {v:'KERI...', t:'icp', d:'ESAID...', i:'EAID...', s:'0', kt:'2', k:[...], nt:'2', n:[...], bt:'3', b:[...], c:[], a:[]}"
      - "Interaction: {v:'KERI...', t:'ixn', d:'ESAID...', i:'EAID...', s:'3', p:'EPREV...', a:[{d:'ECRED...'}]}"
    related_terms: ["Event Serializer", "Field Ordering", "SAID", "Seal Types"]

  - term: "Field Ordering"
    synonyms: ["Normative Field Order", "Canonical Field Order"]
    definition: "The specification-mandated order of fields within each event type. Field ordering is normative because the SAID is computed over the serialized byte representation — reordering fields produces a different digest."
    invariants:
      - "Field order per ilk is defined by the KERI specification and is not configurable"
      - "Reordering fields invalidates the SAID — the digest changes because the byte serialization changes"
      - "JSON serialization must emit fields in declaration order (no sorting)"
      - "CBOR and MGPK must preserve map key insertion order"
      - "Implementation requirement: use ordered maps — Python dict (3.7+), Rust BTreeMap/IndexMap, JS Map"
    examples:
      - "icp: v, t, d, i, s, kt, k, nt, n, bt, b, c, a — version string always first, anchors always last"
      - "rot: v, t, d, i, s, p, kt, k, nt, n, bt, br, ba, c, a — p field appears after s (before key fields)"
    related_terms: ["Event Field Structure", "SAID", "Event Serializer"]

  - term: "Event Creation Functions"
    synonyms: ["incept() [keripy]", "rotate() [keripy]", "interact() [keripy]", "InceptionEvent::new() [keriox]", "RotationEvent::new() [keriox]"]
    definition: "Module-level functions (keripy) or constructors (keriox) that build event serializer objects from typed inputs. Each takes the required fields for its event type, applies normative field ordering, computes the SAID and version string, and returns a serialized event body ready for signing."
    invariants:
      - "incept(): constructs an inception event from keys, thresholds, witnesses, and config traits"
      - "rotate(): constructs a rotation event from new keys, prior state, witness changes (br, ba), and anchors"
      - "interact(): constructs an interaction event from AID, sequence number, prior digest, and seals"
      - "All functions compute the SAID and version string automatically — callers provide logical fields only"
      - "Default thresholds are computed via quorum calculation (ample/simple) when not explicitly provided"
    examples:
      - "serder = incept(keys=['DABC...'], ndigs=['EDEF...'], wits=['BGHI...'], toad=1, code=Master Code Table.Blake3_256)"
      - "serder = rotate(pre='EABC...', keys=new_keys, dig=prior_said, sn=2, cuts=['Bxyz...'], adds=['Bdef...'])"
    related_terms: ["Event Field Structure", "Quorum Calculation", "Seal Types"]

  - term: "Seal Types"
    synonyms: ["Anchor Types", "SealDigest/SealEvent/SealLast [keripy]", "SealDigest/EventSeal/SourceSeal [keriox]"]
    definition: "The specific kinds of seals that can appear in an event's a (anchor) field. Each seal type is a named structure with a fixed set of fields that binds external data or events to the KEL."
    invariants:
      - "Digest Seal (SealDigest): {d: SAID} — binds an arbitrary data digest to the KEL"
      - "Event Seal (SealEvent): {i: prefix, s: sn, d: SAID} — binds a specific event of another AID by prefix, sequence number, and digest"
      - "Latest Establishment Event Seal (SealLast): {i: prefix} — binds to the latest establishment event of another AID without specifying sn"
      - "Root Seal (SealRoot): {rd: root_digest} — binds a Merkle tree root digest"
      - "Multiple seals may appear in a single event's a field as a list"
    examples:
      - "Digest seal: a=[{d: 'ECRED_SAID...'}] — anchoring an ACDC credential issuance"
      - "Event seal for delegation: a=[{i: 'EDELEG_AID...', s: '0', d: 'EDIP_SAID...'}] — delegator approving a delegated inception"
    related_terms: ["Event Field Structure", "Event Creation Functions"]

  - term: "Event Serialization Kinds"
    synonyms: ["Serialization Kind", "Serials [keripy]", "SerializationKind [keriox]"]
    definition: "The binary encoding format used to serialize a KERI event body. KERI supports four kinds: JSON (compact, no whitespace), CBOR, MessagePack (MGPK), and CESR native serialization. The kind is encoded in the version string and directly affects the SAID."
    invariants:
      - "JSON: compact no-whitespace serialization via separators=(',', ':') — deterministic"
      - "CBOR: RFC 8949 deterministic encoding"
      - "MGPK: MessagePack — compact binary encoding"
      - "CESR: native CESR serialization using CESR primitive codes directly"
      - "Changing the serialization kind changes the SAID — same logical event has different SAIDs in different kinds"
      - "All kinds must preserve normative field ordering"
    examples:
      - "JSON kind code: 'JSON' — e.g., version string 'KERICAACAAJSONAAKp.'"
      - "CBOR kind code: 'CBOR' — e.g., version string 'KERICAACAACBORAABC.'"
    related_terms: ["Version String", "SAID", "Event Field Structure"]

  - term: "Signature Accumulation"
    synonyms: ["Idempotent Duplicate Handling", "logEvent(first=False) [keripy]"]
    definition: "When a duplicate event (same SAID) arrives for an already-accepted event, new valid signatures are accumulated via idempotent log update. The duplicate is NOT silently discarded. Both controller and witness signatures are verified and merged into the existing accepted event's signature set. No new first-seen ordinal (fn) is assigned."
    invariants:
      - "Same-SAID duplicates trigger signature merge, not discard"
      - "No new fn is assigned — the event retains its original first-seen ordinal"
      - "Both controller signatures and witness receipts are verified and accumulated"
      - "The event's acceptance status does not change — it remains accepted"
      - "Signature accumulation is idempotent — merging the same signature twice has no additional effect"
    examples:
      - "Event at sn=3 accepted with 2 signatures. Same event arrives with a 3rd valid signature -> signature merged, fn unchanged"
      - "Witness receipt for already-accepted event -> receipt count increases, fn unchanged"
    related_terms: ["Event Validation Pipeline", "Dual Threshold Verification"]

  - term: "Establishment Event Construction"
    definition: "The domain-driven assembly of inception and rotation events. Inception events (icp/dip) establish all four identifier dimensions. Rotation events (rot/drt) modify keys, thresholds, and witness sets while preserving the identifier's core dimensions. Implementations SHOULD provide typed builders that enforce pre-rotation binding, threshold validity, and canonical field ordering."
    invariants:
      - "Inception: sets all dimensions — transferability, delegation, witnessing, signing model"
      - "Rotation: modifies keys (k, kt), next commitments (n, nt), and witness set (br, ba) — cannot change delegation model"
      - "Pre-rotation binding: rotation event's new keys MUST match digests committed in the previous establishment event's n field"
      - "SAID computation: d field computed over the entire event body with d as placeholder"
      - "For inception: i field also computed as SAID (self-certifying identifier)"
    examples:
      - "Inception builder: InceptionEvent.builder().keys(pubkeys).threshold('2').nextKeys(nextDigests).nextThreshold('2').witnesses(wits).toad(2).build()"
      - "Rotation builder: RotationEvent.builder().prior(priorSAID).keys(newKeys).threshold('2').nextKeys(newNextDigests).cutWitnesses(removed).addWitnesses(added).build()"
    related_terms: ["Identifier Type Dimensions", "Pre-rotation Commitment"]

events:
  - name: "ValidationPassed"
    payload: "aid: AID, sn: int, event_type: EventType, said: SAID"
    triggers: "An incoming event passes all validation steps (signatures, thresholds, witnesses, delegation)"

  - name: "ValidationFailed"
    payload: "aid: AID, sn: int, event_type: EventType, failure_step: ValidationStep, reason: ValidationError"
    triggers: "An incoming event fails at a specific validation step, routing it to the appropriate escrow"

  - name: "SignatureThresholdNotMet"
    payload: "aid: AID, sn: int, valid_indices: [int], required_threshold: Threshold"
    triggers: "Verified signature indices do not satisfy the signing threshold"

  - name: "WitnessThresholdNotMet"
    payload: "aid: AID, sn: int, receipt_count: int, toad: int"
    triggers: "Verified witness receipt count is below the witness threshold"

  - name: "DelegationNotFound"
    payload: "aid: AID, sn: int, delegator_aid: AID"
    triggers: "The delegator's anchoring seal is not yet found in its KEL"

rules:
  - "Every event must have at least one cryptographically valid signature to enter validation"
  - "Rotation events must satisfy BOTH the current signing threshold (kt) AND the prior next threshold (nt) -- the dual threshold requirement"
  - "Pre-rotation binding is checked by digest comparison: digest(new_key) must equal the pre-committed digest at the ondex position"
  - "Witness threshold satisfaction uses the same Signing Threshold.satisfy() mechanism as signing threshold"
  - "Delegation validation requires the delegator's KEL to contain a seal referencing the delegated event by prefix, sn, and SAID"
  - "Local source protection is checked before signature verification -- remote events targeting local AIDs are escrowed as misfits"
  - "Validation is stateless given a key state snapshot -- it does not mutate state, only returns accept/reject/escrow-reason"
