domain_ref: "identity/establishment"

types:
  - name: "InceptionEvent"
    description: "Creates a new KERI identifier. Establishes all five type dimensions: transferability, delegation, witnessing, signing model, and operational constraints."
    builder:
      description: "Construct an InceptionEvent via typed parameters. Handles SAID computation, field ordering, and delegation flag automatically."
      required_fields:
        - signing_keys: "array[VerificationKey] — initial signing public keys (k field)"
        - signing_threshold: "string — M-of-N integer or fractional weight list (kt field)"
        - next_key_digests: "array[Digest] — pre-rotation commitments (n field); empty for non-transferable"
        - next_threshold: "string — '0' for non-transferable, threshold expression for transferable (nt field)"
        - witnesses: "array[WitnessAID] — designated witness AIDs (b field); empty for unwitnessed"
        - witness_threshold: "integer — TOAD (bt field); 0 for unwitnessed"
      optional_fields:
        - config_traits: "array[string] — EO, DND, DID, RB, NRB; defaults to [] (c field)"
        - anchors: "array[Seal] — seal list for anchoring at inception; defaults to [] (a field)"
        - delegator: "string — delegator AID; if present, produces dip ilk instead of icp"
      construction_invariants:
        - "len(signing_keys) >= 1"
        - "For simple integer signing_threshold: 1 <= integer(signing_threshold) <= len(signing_keys)"
        - "If next_key_digests is empty: next_threshold MUST be '0' (non-transferable)"
        - "If delegator is present: ilk = 'dip', di field is set to delegator"
        - "If delegator is absent: ilk = 'icp'"
        - "0 <= witness_threshold <= len(witnesses)"
        - "If witnesses is empty: witness_threshold MUST be 0"
        - "SAID computed as: serialize event with d=i=placeholder, hash, insert; for self-addressing, d and i are the same SAID"
        - "Field canonical ordering: v, t, d, i, s, kt, k, nt, n, bt, b, c, a (plus di for delegated)"
        - "s field is always '0' (hex-encoded)"
    variants:
      - name: "non-delegated"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string — protocol, version, serialization kind, size"
            constraints:
              pattern: "KERI[A-Za-z0-9_-]{13}\\."
          - name: "t"
            type: "string"
            required: true
            description: "Message type (ilk)"
            constraints:
              enum: ["icp"]
          - name: "d"
            type: "string"
            required: true
            description: "SAID — self-addressing identifier computed over the event body"
          - name: "i"
            type: "string"
            required: true
            description: "AID prefix — for inception, computed as SAID of the event (self-certifying)"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number — hex-encoded, always '0' for inception"
            constraints:
              enum: ["0"]
          - name: "kt"
            type: "string"
            required: true
            description: "Signing threshold — integer, fractional weight list, or combination expression"
            constraints:
              min: "1"
          - name: "k"
            type: "array[string]"
            required: true
            description: "Current signing public keys — CESR-qualified (qb64)"
            constraints:
              min_length: 1
          - name: "nt"
            type: "string"
            required: true
            description: "Next key threshold — '0' for non-transferable, threshold expression for transferable"
          - name: "n"
            type: "array[string]"
            required: true
            description: "Next key digests — pre-rotation commitments. Empty for non-transferable."
          - name: "bt"
            type: "string"
            required: true
            description: "Witness threshold (TOAD) — hex-encoded"
            constraints:
              min: "0"
          - name: "b"
            type: "array[string]"
            required: true
            description: "Witness AIDs — non-transferable identifiers of designated witnesses"
          - name: "c"
            type: "array[string]"
            required: true
            description: "Configuration traits — operational constraints (EO, DND, DID, RB, NRB)"
            constraints:
              enum: ["EO", "DND", "DID", "RB", "NRB"]
          - name: "a"
            type: "array[map]"
            required: true
            description: "Anchors — seal list for binding external data at inception"
        invariants:
          - "d and i are both computed as SAID of the event body"
          - "len(k) >= integer(kt) when kt is simple integer"
          - "If n is empty and nt is '0', identifier is non-transferable"
          - "If n is non-empty, identifier is transferable"
          - "bt must satisfy: 0 <= integer(bt) <= len(b)"
          - "If b is empty, bt must be '0'"
        examples:
          - format: "json"
            description: "Non-transferable single-key inception (no witnesses, no next keys)"
            value: |
              {"v":"KERI10JSON0000fd_","t":"icp","d":"EPLRRJFe2FHdXKVTkSEX4xb4x-YaPFJ2Xds1vhtNTd4n","i":"DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH","s":"0","kt":"1","k":["DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH"],"nt":"0","n":[],"bt":"0","b":[],"c":[],"a":[]}
            notes: "d and i are both SAIDs — self-certifying. Non-transferable: nt='0', n=[]. From keripy test_eventing.py"
          - format: "json"
            description: "Transferable inception with next key commitment"
            value: |
              {"v":"KERI10JSON00012b_","t":"icp","d":"EAKCxMOuoRzREVHsHCkLilBrUXTvyenBiuM2","i":"EAKCxMOuoRzREVHsHCkLilBrUXTvyenBiuM2","s":"0","kt":"1","k":["DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH"],"nt":"1","n":["EIsKL3B6Zz5ICGxCQp-SoLXjwOrdlSbLJrEn21c2zVaU"],"bt":"0","b":[],"c":[],"a":[]}
            notes: "Transferable: nt='1', n has next key digest. From keripy test_eventing.py"
      - name: "delegated"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            description: "Message type"
            constraints:
              enum: ["dip"]
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "AID prefix (self-certifying SAID)"
          - name: "s"
            type: "string"
            required: true
            constraints:
              enum: ["0"]
            description: "Sequence number — always '0'"
          - name: "kt"
            type: "string"
            required: true
            description: "Signing threshold"
          - name: "k"
            type: "array[string]"
            required: true
            description: "Signing keys"
          - name: "nt"
            type: "string"
            required: true
            description: "Next key threshold"
          - name: "n"
            type: "array[string]"
            required: true
            description: "Next key digests"
          - name: "bt"
            type: "string"
            required: true
            description: "Witness threshold"
          - name: "b"
            type: "array[string]"
            required: true
            description: "Witness AIDs"
          - name: "c"
            type: "array[string]"
            required: true
            description: "Configuration traits"
          - name: "a"
            type: "array[map]"
            required: true
            description: "Anchors"
          - name: "di"
            type: "string"
            required: true
            description: "Delegator AID — the identifier that authorizes this delegation"
        invariants:
          - "All non-delegated invariants apply"
          - "di must be a valid AID prefix with established key state"
          - "Delegator must anchor a seal in their KEL approving this event"
    construction_defaults:
      s: "0"
      c: "[]"
      a: "[]"
    encoding:
      - format: "json"
        notes: "Fields in canonical insertion order. SAID computed with d and i as placeholder strings."
      - format: "cbor"
        notes: "Same field ordering as JSON. CBOR map preserves insertion order."
      - format: "cesr"
        notes: "CESR native encoding uses -G## count code. No embedded version string."

  - name: "RotationEvent"
    description: "Changes the signing keys, next key commitments, and/or witness set for an existing identifier."
    builder:
      description: "Construct a RotationEvent with validated pre-rotation binding, dual threshold check, and witness set delta."
      required_fields:
        - aid: "string — AID prefix of the identifier being rotated (i field)"
        - sn: "integer — next expected sequence number (s field, hex-encoded)"
        - prior_event_said: "string — SAID of the event at sn-1 (p field)"
        - new_signing_keys: "array[VerificationKey] — revealed pre-committed keys (k field)"
        - new_signing_threshold: "string — new signing threshold (kt field)"
        - new_next_key_digests: "array[Digest] — commitments for the NEXT rotation (n field); empty for abandonment"
        - new_next_threshold: "string — '0' for abandonment, threshold expression for transferable (nt field)"
        - witness_threshold: "integer — new TOAD (bt field)"
      optional_fields:
        - witnesses_to_remove: "array[WitnessAID] — witnesses removed (br field); defaults to []"
        - witnesses_to_add: "array[WitnessAID] — witnesses added (ba field); defaults to []"
        - anchors: "array[Seal] — seal list (a field); defaults to []"
        - delegator: "string — delegator AID; if present, produces drt ilk instead of rot"
      construction_invariants:
        - "For each key in new_signing_keys: digest(key) MUST match one of the prior establishment event's n field entries"
        - "The matched indices from prior n must satisfy the prior next threshold (nt) — dual threshold check"
        - "len(new_signing_keys) >= 1 for non-abandonment rotation"
        - "For abandonment: new_next_key_digests = [], new_next_threshold = '0'"
        - "prior_event_said MUST equal the SAID of the event at sn-1"
        - "new witness set = (current witnesses - witnesses_to_remove) + witnesses_to_add"
        - "0 <= witness_threshold <= len(new witness set)"
        - "witnesses_to_remove: each AID MUST currently be in the witness set"
        - "witnesses_to_add: each AID MUST NOT already be in the witness set after removals"
        - "If delegator is present: ilk = 'drt'; requires delegator seal in delegator's KEL"
        - "Field canonical ordering: v, t, d, i, s, p, kt, k, nt, n, bt, br, ba, a (plus any delegated fields)"
    variants:
      - name: "non-delegated"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["rot"]
            description: "Message type"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "AID prefix — must match existing identifier"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number — hex, must be next expected sn"
            constraints:
              min: "1"
          - name: "p"
            type: "string"
            required: true
            description: "Prior event SAID — hash chain link"
          - name: "kt"
            type: "string"
            required: true
            description: "New signing threshold"
          - name: "k"
            type: "array[string]"
            required: true
            description: "New signing keys — must match prior next key digest commitments"
          - name: "nt"
            type: "string"
            required: true
            description: "New next key threshold — '0' with empty n for abandonment"
          - name: "n"
            type: "array[string]"
            required: true
            description: "New next key digests — empty for abandonment"
          - name: "bt"
            type: "string"
            required: true
            description: "Witness threshold"
          - name: "br"
            type: "array[string]"
            required: true
            description: "Witnesses to remove (cut)"
          - name: "ba"
            type: "array[string]"
            required: true
            description: "Witnesses to add"
          - name: "a"
            type: "array[map]"
            required: true
            description: "Anchors"
        invariants:
          - "New keys k must satisfy: for each key, its digest matches one of the prior n commitments"
          - "Prior event SAID p must match the SAID of the event at sn-1"
          - "If n is empty and nt is '0', this is an abandonment — no further events allowed"
          - "Resulting witness set = (prior witnesses - br) + ba"
          - "bt must satisfy: 0 <= integer(bt) <= len(resulting witness set)"
        examples:
          - format: "json"
            description: "Single-key rotation with new next commitment"
            value: |
              {"v":"KERI10JSON000160_","t":"rot","d":"EFl8nvRCbN2xQJI75nBXp-gaXuHJw8zheVjwMN_rB-pb","i":"DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH","s":"1","p":"EJQUyxnzIAtmZPoq9f4fExeGN0qfJmaFnUEKTwIiTBPj","kt":"1","k":["DB4GWvru73jWZKpNgMQp8ayDRin0NG0Ymn_RXQP_v-PQ"],"nt":"1","n":["EIsKL3B6Zz5ICGxCQp-SoLXjwOrdlSbLJrEn21c2zVaU"],"bt":"0","br":[],"ba":[],"a":[]}
            notes: "p links to prior event SAID. New k must match prior n digests. From keripy test_eventing.py"
      - name: "delegated"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["drt"]
            description: "Message type — delegated rotation"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "AID prefix"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number"
          - name: "p"
            type: "string"
            required: true
            description: "Prior event SAID"
          - name: "kt"
            type: "string"
            required: true
            description: "New signing threshold"
          - name: "k"
            type: "array[string]"
            required: true
            description: "New signing keys"
          - name: "nt"
            type: "string"
            required: true
            description: "New next key threshold"
          - name: "n"
            type: "array[string]"
            required: true
            description: "New next key digests"
          - name: "bt"
            type: "string"
            required: true
            description: "Witness threshold"
          - name: "br"
            type: "array[string]"
            required: true
            description: "Witnesses to remove"
          - name: "ba"
            type: "array[string]"
            required: true
            description: "Witnesses to add"
          - name: "a"
            type: "array[map]"
            required: true
            description: "Anchors"
        invariants:
          - "All non-delegated rotation invariants apply"
          - "Delegator must anchor a seal in their KEL approving this rotation"

  - name: "InteractionEvent"
    description: "Anchors data to the identifier's KEL without changing key state. Only allowed for transferable identifiers without the EO (Establishment Only) trait."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["ixn"]
            description: "Message type"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "AID prefix"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number"
          - name: "p"
            type: "string"
            required: true
            description: "Prior event SAID"
          - name: "a"
            type: "array[map]"
            required: true
            description: "Anchors — the data seals being bound to this identifier"
        invariants:
          - "Identifier must be transferable (n was non-empty at inception)"
          - "Identifier must NOT have EO (Establishment Only) trait"
          - "Prior event SAID p must match the SAID at sn-1"
          - "Does NOT change key state — no kt, k, nt, n, bt, b fields"
        examples:
          - format: "json"
            description: "Interaction event with no seals"
            value: |
              {"v":"KERI10JSON0000cb_","t":"ixn","d":"EKKccCumVQdgxvsrSXvuTtjmS28Xqf3zRJ8T6peKgl9J","i":"DFs8BBx86uytIM0D2BhsE5rrqVIT8ef8mflpNceHo4XH","s":"2","p":"ECauhEzA4DJDXVDnNQiGQ0sKXa6sx_GgS8Ebdzm4E-kQ","a":[]}
            notes: "No key state change. p links to prior event. a=[] means no seals. From keripy test_eventing.py"

  - name: "KeyEvent"
    description: "Union type for any event in a Key Event Log. Discriminated by the t (type/ilk) field."
    variants:
      - name: "inception"
        fields:
          - name: "event"
            type: "types://identity/establishment#InceptionEvent"
            required: true
            description: "Non-delegated or delegated inception event (icp/dip)"
        invariants:
          - "t field is 'icp' or 'dip'"
          - "sn is always 0"
      - name: "rotation"
        fields:
          - name: "event"
            type: "types://identity/establishment#RotationEvent"
            required: true
            description: "Non-delegated or delegated rotation event (rot/drt)"
        invariants:
          - "t field is 'rot' or 'drt'"
          - "sn >= 1"
      - name: "interaction"
        fields:
          - name: "event"
            type: "types://identity/establishment#InteractionEvent"
            required: true
            description: "Interaction event (ixn)"
        invariants:
          - "t field is 'ixn'"
          - "Does not change key state"
    construction_defaults: {}

  - name: "WitnessAID"
    description: "A non-transferable AID used to identify a witness. The public key IS the identifier — no key rotation possible."
    variants:
      - name: "default"
        fields:
          - name: "qb64"
            type: "string"
            required: true
            description: "CESR-qualified non-transferable AID prefix (B prefix for Ed25519)"
        invariants:
          - "Must be non-transferable — prefix code indicates non-transferable key type"
          - "B prefix = Ed25519 non-transferable"

  - name: "ValidationPassed"
    description: "Successful validation result confirming an event passed all establishment checks."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "string"
            required: true
            description: "The AID whose event was validated"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the validated event"
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the validated event"
          - name: "event_type"
            type: "string"
            required: true
            description: "Ilk of the validated event (icp, rot, dip, drt, ixn)"
            constraints:
              enum: ["icp", "rot", "dip", "drt", "ixn"]
        invariants:
          - "Signatures satisfy the signing threshold"
          - "Witness receipts satisfy the TOAD (if applicable)"
          - "Delegation seal is confirmed (if delegated)"

  - name: "SignedEventMessage"
    description: "A key event bundled with its attached controller signatures and witness receipts."
    variants:
      - name: "default"
        fields:
          - name: "event"
            type: "types://identity/establishment#KeyEvent"
            required: true
            description: "The key event body"
          - name: "signatures"
            type: "array[Signature]"
            required: true
            description: "Controller signatures over the event"
            constraints:
              min_length: 1
          - name: "witness_receipts"
            type: "array[Receipt]"
            required: true
            description: "Witness receipts (non-transferable signatures from witnesses)"
        invariants:
          - "At least one controller signature must be present"
          - "Witness receipts may be empty if the identifier has no witnesses"

  - name: "ValidationResult"
    description: "The outcome of processing a key event through the establishment validation pipeline. Either the event is accepted (key state updated) or it is routed to an escrow queue for later reprocessing."
    variants:
      - name: "accepted"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the accepted event"
          - name: "first_seen_number"
            type: "integer"
            required: false
            description: "First-seen ordinal assigned to this event. Absent when this is a duplicate event (same SAID) whose new signatures were merged into the existing accepted event — no new fn is assigned."
          - name: "key_state"
            type: "types://identity/state#KeyState"
            required: true
            description: "Updated key state after processing"
        invariants:
          - "When first_seen_number is non-null: event is newly logged to KEL with that fn"
          - "When first_seen_number is null: same-SAID duplicate triggered signature accumulation — new valid signatures merged, no new fn assigned"
          - "Key state reflects the new signing keys, thresholds, and witnesses"
      - name: "escrowed"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "escrow_type"
            type: "string"
            required: true
            description: "Which escrow queue: OOE, PSE, PWE, PDE, Delegable, LDE, Misfit"
            constraints:
              enum: ["OOE", "PSE", "PWE", "PDE", "Delegable", "LDE", "Misfit"]
          - name: "reason"
            type: "string"
            required: true
            description: "Why the event was escrowed"
        invariants:
          - "Key state is NOT updated — prior state remains active"
          - "Event will be reprocessed when the blocking condition resolves"
      - name: "rejected"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the rejected event"
          - name: "error"
            type: "string"
            required: true
            description: "Error name from errors.yaml"
          - name: "reason"
            type: "string"
            required: true
            description: "Human-readable rejection reason"
        invariants:
          - "Event is dropped — not escrowed, not accepted"
          - "No state change occurs"

  - name: "EventSource"
    description: "Per-event metadata flag indicating whether the event was received from a local (trusted/protected) or remote (untrusted) channel. Persisted alongside each event as (prefix, SAID) keyed record."
    variants:
      - name: "default"
        fields:
          - name: "local"
            type: "boolean"
            required: true
            description: "True if the event was received from a local protected channel, false if from a remote source"
        invariants:
          - "Set at the processing facility level and overridable per-event"
          - "Local can promote remote (upgrade trust) but remote cannot demote local"
          - "Persisted alongside each event — survives escrow round-trips"

  - name: "KeyEventBody"
    description: "Parsed key event document with typed field accessors for KERI-specific properties. Extends the generic SAD serialization from cesr/composition with key event awareness — provides typed access to signing keys, next key digests, thresholds, and event metadata. The KERI spec calls this a 'key event message body'; keripy calls it SerderKERI."
    variants:
      - name: "default"
        fields:
          - name: "ked"
            type: "map"
            required: true
            description: "Key Event Dict — the raw ordered field map"
          - name: "said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "Self-Addressing Identifier (digest) of the event body"
          - name: "ilk"
            type: "string"
            required: true
            description: "Event type/ilk (icp, rot, ixn, dip, drt)"
          - name: "pre"
            type: "string"
            required: true
            description: "AID prefix from the i field"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number parsed from the s field"
        invariants:
          - "Extends Sadder from cesr/composition with KERI-specific field accessors"
          - "Computes and caches the SAID, version string, and serialization"
          - "Provides typed access to verfers (signing keys), digers (next key digests), tholder, ntholder"

  - name: "EscrowDecision"
    description: "The routing decision for an event that cannot be immediately accepted. Identifies which escrow queue the event belongs in, why it was escrowed, and what condition must resolve for reprocessing. Note: Escrow queue names (OOE, PSE, PWE, PDE, MFE, LDE) are derived from the keripy reference implementation — the KERI protocol spec defines escrow conditions functionally (insufficient signatures, missing receipts, missing delegation) but does not name specific queues. MDE is consolidated into PDE (remote validator) and Delegable (local delegator) — the distinction is party-role-based."
    variants:
      - name: "out-of-order"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "queue"
            type: "string"
            required: true
            description: "Escrow queue identifier"
            constraints:
              enum: ["OOE", "PSE", "PWE", "PDE", "LDE", "MFE"]
          - name: "expected_sn"
            type: "integer"
            required: true
            description: "The sequence number that must arrive before this event can be reprocessed"
          - name: "received_sn"
            type: "integer"
            required: true
            description: "The sequence number of the escrowed event"
        invariants:
          - "received_sn > expected_sn — the event is ahead of the current log position"
          - "Reprocessed when the gap is filled (events at expected_sn through received_sn-1 arrive)"
      - name: "partially-signed"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "queue"
            type: "string"
            required: true
            description: "Escrow queue identifier"
            constraints:
              enum: ["PSE"]
          - name: "verified_indices"
            type: "array[integer]"
            required: true
            description: "Signature indices verified so far"
          - name: "required_threshold"
            type: "string"
            required: true
            description: "Threshold expression that must be satisfied"
        invariants:
          - "At least one valid signature exists but threshold is not yet satisfied"
          - "Reprocessed when additional signatures arrive for the same event SAID"
      - name: "partially-witnessed"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "queue"
            type: "string"
            required: true
            description: "Escrow queue identifier"
            constraints:
              enum: ["PWE"]
          - name: "receipt_count"
            type: "integer"
            required: true
            description: "Number of witness receipts collected so far"
          - name: "toad"
            type: "integer"
            required: true
            description: "Required witness threshold (TOAD)"
        invariants:
          - "Controller signatures satisfy the threshold but witness receipts do not"
          - "Reprocessed when additional witness receipts arrive"
      - name: "partially-delegated"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "queue"
            type: "string"
            required: true
            description: "Escrow queue identifier"
            constraints:
              enum: ["PDE"]
          - name: "delegator_aid"
            type: "string"
            required: true
            description: "The delegator whose anchoring seal is missing"
        invariants:
          - "Signatures and witnesses are satisfied but the delegator seal is not found"
          - "Reprocessed when the delegator's anchoring event is received"
      - name: "likely-duplicitous"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "queue"
            type: "string"
            required: true
            description: "Escrow queue identifier"
            constraints:
              enum: ["LDE"]
          - name: "accepted_said"
            type: "string"
            required: true
            description: "SAID of the already-accepted event at this sn"
          - name: "sn"
            type: "integer"
            required: true
            description: "The conflicting sequence number"
        invariants:
          - "An event at this (prefix, sn) already exists with a different SAID"
          - "Indicates possible key compromise or Byzantine behavior"
      - name: "misfit"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "queue"
            type: "string"
            required: true
            description: "Escrow queue identifier"
            constraints:
              enum: ["MFE"]
          - name: "reason"
            type: "string"
            required: true
            description: "Why local sourcing is required (owned, witnessed, or delegated)"
        invariants:
          - "Remote source submitted an event for a locally-protected identifier"
          - "Must be re-submitted through the local protected channel"

  - name: "PartialRotation"
    description: "A Rotation that reveals only a subset of pre-committed keys, holding others as Reserve Keys for future use. Behavioral subtype of RotationEvent — has no additional fields beyond RotationEvent. The distinction is in the COUNT of keys revealed relative to the prior n list: fewer revealed keys than total pre-committed keys."
    behavioral_subtype_note: "PartialRotation IS a RotationEvent — same wire format, same Builder. The 'partial' qualifier describes the semantics: the k list reveals fewer keys than the full prior n list. No separate type constructor needed; the RotationEvent Builder produces partial rotation when len(new_signing_keys) < len(prior_n)."
    variants:
      - name: "default"
        invariants:
          - "The revealed subset must satisfy the prior next threshold"
          - "Unrevealed keys remain blinded as Reserve Keys"

  - name: "AugmentedRotation"
    description: "A Rotation that adds new signing keys not previously committed as pre-rotated keys, expanding the current key set beyond the pre-committed set. Behavioral subtype of RotationEvent — no additional fields."
    behavioral_subtype_note: "AugmentedRotation IS a RotationEvent — same wire format. The 'augmented' qualifier means the k list contains keys BEYOND those pre-committed in the prior n list. The extra keys are new additions that bypass the pre-rotation constraint for signing authority augmentation. The RotationEvent Builder accepts additional_signing_keys for this case."
    variants:
      - name: "default"
        invariants:
          - "New keys are added to the current signing key list"
          - "Prior next threshold must still be satisfied by the pre-committed subset"

  - name: "ReserveRotation"
    description: "Recovery from total signing key compromise using previously uncommitted Reserve Keys from an earlier Establishment Event. Behavioral subtype of RotationEvent — no additional fields."
    behavioral_subtype_note: "ReserveRotation IS a RotationEvent — same wire format. The 'reserve' qualifier means the k list reveals keys that were pre-committed but NOT used in the immediately preceding rotation (held back as reserve). Reserve Rotation enables recovery when current signing keys are compromised because the reserve keys were never exposed."
    variants:
      - name: "default"
        invariants:
          - "Uses Reserve Keys that were held back from prior rotations"
          - "Enables recovery even after all current signing keys are compromised"
