domain_ref: "identity/establishment"

types:
  - name: "ValidationResult"
    description: "The outcome of processing a key event through the establishment validation pipeline. Either the event is accepted (key state updated) or it is routed to an escrow queue for later reprocessing."
    variants:
      - name: "accepted"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the accepted event"
          - name: "first_seen_number"
            type: "integer"
            required: true
            description: "First-seen ordinal assigned to this event"
          - name: "key_state"
            type: "types://identity#KeyState"
            required: true
            description: "Updated key state after processing"
        invariants:
          - "Event is logged to KEL with first_seen_number"
          - "Key state reflects the new signing keys, thresholds, and witnesses"
      - name: "escrowed"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "escrow_type"
            type: "string"
            required: true
            description: "Which escrow queue: OOE, PSE, PWE, PDE, LDE, Misfit"
            constraints:
              enum: ["OOE", "PSE", "PWE", "PDE", "LDE", "Misfit"]
          - name: "reason"
            type: "string"
            required: true
            description: "Why the event was escrowed"
        invariants:
          - "Key state is NOT updated — prior state remains active"
          - "Event will be reprocessed when the blocking condition resolves"
      - name: "rejected"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the rejected event"
          - name: "error"
            type: "string"
            required: true
            description: "Error name from errors.yaml"
          - name: "reason"
            type: "string"
            required: true
            description: "Human-readable rejection reason"
        invariants:
          - "Event is dropped — not escrowed, not accepted"
          - "No state change occurs"

  - name: "EscrowDecision"
    description: "The routing decision for an event that cannot be immediately accepted. Identifies which escrow queue the event belongs in, why it was escrowed, and what condition must resolve for reprocessing."
    variants:
      - name: "out-of-order"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "queue"
            type: "string"
            required: true
            description: "Escrow queue identifier"
            constraints:
              enum: ["OOE", "PSE", "PWE", "PDE", "LDE", "MDE", "MFE"]
          - name: "expected_sn"
            type: "integer"
            required: true
            description: "The sequence number that must arrive before this event can be reprocessed"
          - name: "received_sn"
            type: "integer"
            required: true
            description: "The sequence number of the escrowed event"
        invariants:
          - "received_sn > expected_sn — the event is ahead of the current log position"
          - "Reprocessed when the gap is filled (events at expected_sn through received_sn-1 arrive)"
      - name: "partially-signed"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "queue"
            type: "string"
            required: true
            description: "Escrow queue identifier"
            constraints:
              enum: ["PSE"]
          - name: "verified_indices"
            type: "array[integer]"
            required: true
            description: "Signature indices verified so far"
          - name: "required_threshold"
            type: "string"
            required: true
            description: "Threshold expression that must be satisfied"
        invariants:
          - "At least one valid signature exists but threshold is not yet satisfied"
          - "Reprocessed when additional signatures arrive for the same event SAID"
      - name: "partially-witnessed"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "queue"
            type: "string"
            required: true
            description: "Escrow queue identifier"
            constraints:
              enum: ["PWE"]
          - name: "receipt_count"
            type: "integer"
            required: true
            description: "Number of witness receipts collected so far"
          - name: "toad"
            type: "integer"
            required: true
            description: "Required witness threshold (TOAD)"
        invariants:
          - "Controller signatures satisfy the threshold but witness receipts do not"
          - "Reprocessed when additional witness receipts arrive"
      - name: "partially-delegated"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "queue"
            type: "string"
            required: true
            description: "Escrow queue identifier"
            constraints:
              enum: ["PDE"]
          - name: "delegator_aid"
            type: "string"
            required: true
            description: "The delegator whose anchoring seal is missing"
        invariants:
          - "Signatures and witnesses are satisfied but the delegator seal is not found"
          - "Reprocessed when the delegator's anchoring event is received"
      - name: "likely-duplicitous"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "queue"
            type: "string"
            required: true
            description: "Escrow queue identifier"
            constraints:
              enum: ["LDE"]
          - name: "accepted_said"
            type: "string"
            required: true
            description: "SAID of the already-accepted event at this sn"
          - name: "sn"
            type: "integer"
            required: true
            description: "The conflicting sequence number"
        invariants:
          - "An event at this (prefix, sn) already exists with a different SAID"
          - "Indicates possible key compromise or Byzantine behavior"
      - name: "misfit"
        fields:
          - name: "event_said"
            type: "string"
            required: true
            description: "SAID of the escrowed event"
          - name: "queue"
            type: "string"
            required: true
            description: "Escrow queue identifier"
            constraints:
              enum: ["MFE"]
          - name: "reason"
            type: "string"
            required: true
            description: "Why local sourcing is required (owned, witnessed, or delegated)"
        invariants:
          - "Remote source submitted an event for a locally-protected identifier"
          - "Must be re-submitted through the local protected channel"
