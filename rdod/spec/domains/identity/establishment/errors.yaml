# errors.yaml
domain_ref: "identity/establishment"

# Error catalog for the Identity Establishment domain.
# Maps directly to exception classes in keripy/src/keri/kering.py and
# raise sites in keripy/src/keri/core/eventing.py (Kevery.processEvent,
# Kever.valSigsWigsDel, Kever.validateDelegation).
#
# Severity levels:
#   transient  — condition may self-resolve (escrow and retry)
#   recoverable — requires operator or protocol-level action
#   fatal      — unrecoverable; event is permanently rejected

errors:
  - name: "OutOfOrderError"
    description: "Received an event whose sequence number is ahead of the expected next event"
    cause: "Event sn > expected sn for this prefix — prior events have not yet been received or accepted"
    recovery: "escrow"
    escrow_queue: "OOE"
    severity: "transient"
    context:
      - field: "prefix"
        type: "string"
        description: "The AID prefix of the out-of-order event"
      - field: "received_sn"
        type: "integer"
        description: "The sequence number of the received event"
      - field: "expected_sn"
        type: "integer"
        description: "The next expected sequence number for this prefix"
      - field: "said"
        type: "string"
        description: "The SAID of the out-of-order event"
    related_port: "port://identity/establishment/inbound/validate-event"

  - name: "MissingSignatureError"
    description: "Event signatures do not satisfy the signing threshold"
    cause: "Verified signature indices do not satisfy tholder.satisfy() — insufficient controller signatures for this event"
    recovery: "escrow"
    escrow_queue: "PSE"
    severity: "transient"
    context:
      - field: "prefix"
        type: "string"
        description: "The AID prefix"
      - field: "verified_indices"
        type: "array[integer]"
        description: "Indices of signatures that verified successfully"
      - field: "required_threshold"
        type: "string"
        description: "The signing threshold expression that was not satisfied"
      - field: "said"
        type: "string"
        description: "The SAID of the partially-signed event"
    related_port: "port://identity/establishment/inbound/validate-event"

  - name: "MissingWitnessSignatureError"
    description: "Witness receipts do not satisfy the witness threshold (TOAD)"
    cause: "Number of verified witness signatures < toader.num — insufficient witness accountability"
    recovery: "escrow"
    escrow_queue: "PWE"
    severity: "transient"
    context:
      - field: "prefix"
        type: "string"
        description: "The AID prefix"
      - field: "receipt_count"
        type: "integer"
        description: "Number of verified witness receipts"
      - field: "toad"
        type: "integer"
        description: "Required witness threshold (TOAD)"
      - field: "said"
        type: "string"
        description: "The SAID of the partially-witnessed event"
    related_port: "port://identity/establishment/inbound/validate-event"

  - name: "MissingDelegationError"
    description: "Delegated event lacks the required anchoring seal from the delegator's KEL"
    cause: "No matching seal found in delegator's KEL anchoring this delegated event's SAID"
    recovery: "escrow"
    escrow_queue: "PDE"
    severity: "transient"
    context:
      - field: "prefix"
        type: "string"
        description: "The delegated AID prefix"
      - field: "delegator"
        type: "string"
        description: "The delegator's AID prefix"
      - field: "said"
        type: "string"
        description: "The SAID of the event awaiting delegation approval"
    related_port: "port://identity/establishment/inbound/validate-delegation"

  - name: "MissingDelegableApprovalError"
    description: "Delegable event source seal cannot be verified against the delegator"
    cause: "Delegation source seal attachment is present but cannot be matched to a confirmed delegating event in the delegator's KEL"
    recovery: "escrow"
    escrow_queue: "MDE"
    severity: "transient"
    context:
      - field: "prefix"
        type: "string"
        description: "The delegated AID prefix"
      - field: "delegator"
        type: "string"
        description: "The delegator's AID prefix"
      - field: "said"
        type: "string"
        description: "The SAID of the event with unverifiable source seal"
    related_port: "port://identity/establishment/inbound/validate-delegation"

  - name: "LikelyDuplicitousError"
    description: "Received an event at a sequence number that already has a different accepted event"
    cause: "Event at (prefix, sn) with SAID different from the already-accepted event's SAID — possible key compromise or Byzantine behavior"
    recovery: "escrow"
    escrow_queue: "LDE"
    severity: "recoverable"
    context:
      - field: "prefix"
        type: "string"
        description: "The AID prefix"
      - field: "sn"
        type: "integer"
        description: "The conflicting sequence number"
      - field: "received_said"
        type: "string"
        description: "SAID of the new conflicting event"
      - field: "accepted_said"
        type: "string"
        description: "SAID of the previously accepted event at this sn"
    related_port: "port://identity/establishment/inbound/validate-event"

  - name: "MisfitEventSourceError"
    description: "Remote source submitted an event that must be locally sourced"
    cause: "Event for a locally-owned, locally-witnessed, or locally-delegated identifier was submitted from a remote (unprotected) source"
    recovery: "escrow"
    escrow_queue: "MFE"
    severity: "transient"
    context:
      - field: "prefix"
        type: "string"
        description: "The AID prefix"
      - field: "reason"
        type: "string"
        description: "Why this event requires local sourcing (owned, witnessed, or delegated)"
    related_port: "port://identity/establishment/inbound/validate-event"

  - name: "ValidationError"
    description: "Event failed structural or cryptographic validation"
    cause: "Event body is malformed, sith is invalid for key count, sequence number is negative, no verified signatures exist, or stale rotation sn received"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "prefix"
        type: "string"
        description: "The AID prefix (if parseable)"
      - field: "reason"
        type: "string"
        description: "Specific validation failure reason"
      - field: "said"
        type: "string"
        description: "The SAID of the invalid event (if computable)"
    related_port: "port://identity/establishment/inbound/validate-event"
