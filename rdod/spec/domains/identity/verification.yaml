# verification.yaml
domain_ref: "identity"

# Verification properties are language-agnostic invariants.
# Code examples use Python/pytest syntax for illustration — implementations
# in other languages should express equivalent assertions in their native testing framework.

properties:
  # KEL invariants
  - invariant: "KEL immutability with recovery exception: the KEL is append-only — events MUST NOT be modified or deleted once accepted. Exception: superseding recovery (Rule A0) replaces events on the forked branch by designating the recovery rotation's branch as the new trunk. Replaced events are preserved (queryable by fn) but removed from the active KEL sequence."
    term: "KEL"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy(), new_event=key_event_strategy())
        def test_kel_immutability_with_recovery_exception(kel, new_event):
            snapshot = [e.said for e in kel.events]
            kel.append(new_event)
            # Append-only: all prior events unchanged
            for i, said in enumerate(snapshot):
                assert kel.events[i].said == said, (
                    f"Event at index {i} MUST NOT be modified after acceptance"
                )
            # Recovery exception: superseding rotation replaces trunk
            if hasattr(kel, 'apply_superseding'):
                recovery_rot = build_recovery_rotation(kel.aid, sn=new_event.sn)
                kel.apply_superseding(recovery_rot, new_event)
                # Replaced event is off trunk but still queryable by fn
                assert new_event not in [e for e in kel.active_events], (
                    "Superseded event removed from active KEL sequence"
                )
                assert kel.get_by_fn(new_event.fn) is not None, (
                    "Superseded event MUST be preserved and queryable by fn"
                )
    strategy: "kel_strategy(), key_event_strategy()"
    notes: "Append-only with one exception: Rule A0 superseding recovery replaces trunk events. Replaced events preserved queryable by fn."

  - invariant: "Hash-chained — each event includes digest of prior event in p field"
    term: "KEL"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy(min_events=2))
        def test_kel_hash_chain(kel):
            for i in range(1, len(kel.events)):
                assert kel.events[i].p == kel.events[i-1].said
    strategy: "kel_strategy(min_events=2)"
    notes: "Hash chain creates tamper-evidence."

  - invariant: "Exactly one authoritative KEL per AID"
    term: "KEL"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(aid=aid_strategy())
        def test_one_kel_per_aid(aid):
            store = KELStore()
            kel = store.get_or_create(aid)
            kel2 = store.get_or_create(aid)
            assert kel is kel2  # same instance
    strategy: "aid_strategy()"
    notes: "AID-to-KEL mapping is 1:1."

  - invariant: "Deterministic key state derivable from any KEL prefix"
    term: "KEL"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy())
        def test_deterministic_key_state(kel):
            for n in range(1, len(kel.events) + 1):
                prefix = kel.events[:n]
                s1 = compute_key_state_from_events(prefix)
                s2 = compute_key_state_from_events(prefix)
                assert s1 == s2
    strategy: "kel_strategy()"
    notes: "Any prefix of the KEL produces deterministic key state."

  # Key State invariants
  - invariant: "Deterministically computed from the KEL up to the latest establishment event"
    term: "Key State"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy())
        def test_key_state_deterministic(kel):
            state1 = compute_key_state(kel)
            state2 = compute_key_state(kel)
            assert state1 == state2
    strategy: "kel_strategy() generates valid KELs with mixed event types"
    notes: "Determinism is the foundational invariant of key state."

  - invariant: "Only establishment events (icp, rot, dip, drt) modify key state"
    term: "Key State"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_with_ixn_strategy())
        def test_ixn_does_not_change_key_state(kel):
            for i, event in enumerate(kel.events):
                if event.t == 'ixn':
                    state_before = compute_key_state(kel.prefix(i))
                    state_after = compute_key_state(kel.prefix(i + 1))
                    assert state_before.signing_keys == state_after.signing_keys
                    assert state_before.next_digests == state_after.next_digests
                    assert state_before.signing_threshold == state_after.signing_threshold
                    assert state_before.witnesses == state_after.witnesses
    strategy: "kel_with_ixn_strategy() generates KELs containing interaction events"
    notes: "Interaction events advance sn but never touch key state fields."

  # Escrow Type Pattern invariants
  - invariant: "Escrow reprocessing outcomes: when an escrowed event is reprocessed, exactly one of four outcomes MUST occur: (1) ACCEPTED — blocking condition resolved, event moves to KEL; (2) SAME-ESCROW — blocking condition still unresolved, event stays in current escrow; (3) CASCADE — one blocking condition resolved but another discovered, event moves to a different escrow type; (4) PRUNED — timeout exceeded, event discarded permanently."
    term: "Escrow Type Pattern"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(escrowed_event=escrowed_event_strategy())
        def test_escrow_reprocessing_outcomes(escrowed_event):
            result = reprocess(escrowed_event)
            VALID_OUTCOMES = ('accepted', 'same_escrow', 'cascaded', 'pruned')
            assert result.outcome in VALID_OUTCOMES, (
                f"Escrow reprocessing MUST produce one of {VALID_OUTCOMES}, "
                f"got '{result.outcome}'"
            )
            if result.outcome == 'accepted':
                assert result.event in get_kel(escrowed_event.aid).events, (
                    "ACCEPTED: event MUST be in KEL"
                )
            elif result.outcome == 'same_escrow':
                assert result.escrow_type == escrowed_event.escrow_type, (
                    "SAME-ESCROW: event stays in current escrow type"
                )
            elif result.outcome == 'cascaded':
                assert result.escrow_type != escrowed_event.escrow_type, (
                    "CASCADE: event MUST move to a different escrow type"
                )
            elif result.outcome == 'pruned':
                assert result.event not in get_all_escrows(), (
                    "PRUNED: event MUST be permanently discarded from all escrows"
                )
    strategy: "escrowed_event_strategy()"
    notes: "Exactly four outcomes: ACCEPTED (to KEL), SAME-ESCROW (stay), CASCADE (different escrow), PRUNED (discarded)."

  # Escrow Cascade invariants
  - invariant: "Escrow processing order MUST follow the oracle-confirmed 9-step sweep: OOE → UWE → URE → VRE → PDE → PWE → PSE → LDE → QNF. Delegable and MFE are NOT in the standard sweep. OOE first resolves sequence gaps; receipt escrows (UWE, URE, VRE) resolve receipt verification; PDE resolves delegation before witness/signature checks; PWE before PSE because witness receipt arrival may trigger signature re-evaluation; LDE prunes timed-out duplicity evidence; QNF resolves query-not-found last."
    term: "Escrow Cascade"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(st.data())
        def test_escrow_processing_order(data):
            processor = EventProcessor()
            order = processor.get_escrow_processing_order()
            # Verify the complete oracle-confirmed 9-step order
            expected = ['OOE', 'UWE', 'URE', 'VRE', 'PDE', 'PWE', 'PSE', 'LDE', 'QNF']
            assert order == expected, (
                f"Complete escrow processing order MUST be {expected}, got {order}"
            )
            # Verify Delegable and MFE are excluded from sweep
            assert 'Delegable' not in order, (
                "Delegable MUST NOT be in standard sweep — resolves via delegator commit"
            )
            assert 'MFE' not in order, (
                "MFE MUST NOT be in standard sweep — resolves via source-promotion"
            )
            # Key ordering constraints
            assert order.index('OOE') < order.index('UWE'), (
                "OOE MUST be processed before receipt escrows"
            )
            assert order.index('VRE') < order.index('PDE'), (
                "Receipt escrows MUST be processed before PDE"
            )
            assert order.index('PDE') < order.index('PWE'), (
                "PDE MUST be processed before PWE — delegation approval may unblock witness checks"
            )
            assert order.index('PWE') < order.index('PSE'), (
                "PWE MUST be processed before PSE — witness receipt arrival may trigger signature re-evaluation"
            )
    strategy: "Fixed order verification — oracle-confirmed 9-step sweep"
    notes: "OOE → UWE → URE → VRE → PDE → PWE → PSE → LDE → QNF. Delegable and MFE are external-trigger escrows excluded from the sweep."

  # Out-of-Order Escrow invariants
  - invariant: "Triggered when sn > expected_sn for a known prefix, or when the prefix is unknown and the event is not an inception"
    term: "Out-of-Order Escrow"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(expected_sn=st.integers(min_value=0, max_value=10),
               event_sn=st.integers(min_value=1, max_value=100))
        def test_ooe_trigger(expected_sn, event_sn):
            assume(event_sn > expected_sn)
            result = check_sn(event_sn, expected_sn)
            assert result == 'OOE'
    strategy: "st.integers for expected and event sn"
    notes: "sn > expected = OOE."

  - invariant: "Default timeout: 1200 seconds (20 minutes)"
    term: "Out-of-Order Escrow"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        timeout = Int('timeout')
        s = Solver()
        s.add(timeout == 1200)
        s.add(timeout > 0)
        assert s.check() == sat
    notes: "Default OOE timeout is 1200s (20 minutes). Implementation reference: keripy TimeoutOOE."

  # Escrow Timeout invariants
  - invariant: "Escrow timeout semantics: an escrowed item with age A and configured timeout T is active when A < T and MUST be pruned when A >= T. Timeout is checked during each processing cycle. Pruned items are permanently discarded — they cannot re-enter any escrow. Default timeouts: OOE=1200s, PSE=3600s, PWE=3600s, PDE=86400s, LDE=3600s. Reconciliation note (L67-O33): The LDE and PDE timeouts have different semantics — PDE has 86400s (24 hours) because delegation approval may require human action; LDE has 3600s (1 hour) because it holds forensic evidence. Implementations MAY configure LDE to retain events longer (forensic evidence value), but the default is 3600s."
    term: "Escrow Timeout"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(timeout=st.integers(min_value=1, max_value=86400),
               elapsed=st.integers(min_value=0, max_value=172800))
        def test_escrow_timeout_semantics(timeout, elapsed):
            is_expired = elapsed >= timeout
            result = check_timeout(elapsed, timeout)
            assert result.is_pruned == is_expired, (
                f"age={elapsed}, timeout={timeout}: "
                f"is_pruned MUST be {is_expired} (A >= T), got {result.is_pruned}"
            )
            # Boundary: exactly at timeout MUST be pruned
            boundary = check_timeout(timeout, timeout)
            assert boundary.is_pruned == True, (
                f"At exact timeout boundary (A == T == {timeout}): MUST be pruned"
            )
            # One tick before timeout MUST be active
            if timeout > 0:
                before = check_timeout(timeout - 1, timeout)
                assert before.is_pruned == False, (
                    f"One tick before timeout (A={timeout-1}, T={timeout}): MUST be active"
                )
            # Pruned items cannot re-enter escrow
            if result.is_pruned:
                assert not result.can_re_escrow, (
                    "Pruned items MUST NOT re-enter any escrow"
                )

        def test_default_timeouts():
            """Default timeout values for each escrow type."""
            assert OOE_TIMEOUT == 1200, "OOE default timeout MUST be 1200s"
            assert PSE_TIMEOUT == 3600, "PSE default timeout MUST be 3600s"
            assert PWE_TIMEOUT == 3600, "PWE default timeout MUST be 3600s"
            assert PDE_TIMEOUT == 86400, "PDE default timeout MUST be 86400s"
            assert LDE_TIMEOUT == 3600, "LDE default timeout MUST be 3600s (configurable upward for forensic retention)"
    strategy: "st.integers for timeout and elapsed, plus boundary and default checks"
    notes: "Active when A < T, pruned when A >= T. Pruned = permanent discard. Defaults: OOE=1200s, PSE=3600s, PWE=3600s, PDE=86400s, LDE=3600s. PDE is 24h because delegation may require human intervention. LDE is 1h by default but may be extended for forensic value."

  # Misfit Event Escrow invariants
  - invariant: "MFE has no periodic sweep — misfit events are resolved only when the same event arrives from a local (authorized) source, not by timer-based reprocessing. This is a source-promotion escrow, distinct from time-based retry escrows. MFE is NOT included in the standard 9-step escrow sweep order."
    term: "Misfit Event Escrow"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(misfit=misfit_event_strategy())
        def test_misfit_no_auto_reprocess(misfit):
            processor = EventProcessor()
            processor.escrow_misfit(misfit)
            resolved = processor.process_escrows()
            # Misfit events are never in the resolved list from sweep
            assert misfit.said not in [r.said for r in resolved], (
                "MFE events MUST NOT be resolved by periodic sweep — "
                "only by source-promotion from a local channel"
            )
            # Verify MFE is not in the sweep order
            sweep_order = processor.get_escrow_processing_order()
            assert 'MFE' not in sweep_order, (
                "MFE MUST NOT appear in the standard escrow sweep order"
            )
    strategy: "misfit_event_strategy()"
    notes: "MFE is a source-promotion escrow: resolved when the same event SAID arrives from a local source, not by timer or sweep. Distinct from all other escrows which use time-based retry."

  - invariant: "The four-way binding between AID, current controlling keypairs (Key State), the Controller entity, and the KEL MUST be cryptographically consistent. The AID is derived from or anchored to the initial keypair (SCID property). The Key State tracks current authoritative keypairs. The KEL provides verifiable history. The Controller holds the private keys."
    term: "Controller"
    technique: property-based
    formal:
      language: python
      expression: |
        # Property-based test stub — formal expression derivable from spec SCID property
        # TODO: derive complete formal expression from spec section on Tetrad Binding / SCID
        @given(kel=kel_strategy())
        def test_tetrad_binding(kel):
            aid = kel.prefix
            inception = kel.events[0]
            key_state = compute_key_state(kel)
            # 1. AID is self-certifying from inception keys (SCID property)
            if is_self_addressing(inception):
                assert inception.d == aid, "Self-addressing AID must equal inception SAID"
            else:
                # Basic: AID equals the qualified public key
                assert aid == inception.k[0], "Basic AID must equal the inception signing key"
            # 2. Key state is derived from KEL (deterministic)
            key_state_from_replay = compute_key_state(kel)
            assert key_state == key_state_from_replay, "Key state must be deterministic from KEL"
            # 3. All events in KEL are signed by keys whose digests were pre-committed
            for i, event in enumerate(kel.events[1:], 1):
                if event.t in ('rot', 'drt'):
                    prior_est = kel.prior_establishment(i)
                    for key in event.k:
                        assert digest(key) in prior_est.n, "Rotation keys must match prior commitments"
    strategy: "kel_strategy()"
    notes: "The fundamental security invariant of KERI — break any element and the system fails. Also known as the Tetrad Binding. TODO: formal expression is a stub — derive complete SMT encoding from spec."

  - invariant: "Validation rules differ by event locality. A local event comes from a protected, trustable source (e.g., the device running the validation code). A remote event comes from an unprotected, untrustable source. Controllers and Witnesses SHOULD only sign and accept local events. A general Validator MUST verify all signatures regardless of locality."
    term: "Validator"
    technique: property-based
    notes: "Local vs remote determines which validation rules apply per role (controller, witness, delegatee, delegator, general validator)."

  # --- Config Trait Enforcement (Finding KERI-INV-004) ---
  - invariant: "EO (Establishment-Only): validator MUST drop any non-establishment event (ixn) in a KEL with the EO trait. DND (Do-Not-Delegate): validator MUST drop any delegated event (dip, drt) whose Delegator AID has DND trait. RB (Registrar-Backers): establishment event MUST include a Registrar Backer seal for each backer in the backer list when RB trait is set."
    term: "Configuration Traits"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(event=key_event_strategy(), key_state=key_state_strategy())
        def test_config_trait_enforcement(event, key_state):
            if 'EO' in key_state.traits and event['t'] not in ('icp','rot','dip','drt'):
                assert validate(event, key_state) == REJECTED, \
                    "EO: non-establishment event must be rejected"
            if 'DND' in key_state.traits and event['t'] in ('dip', 'drt'):
                assert validate(event, key_state) == REJECTED, \
                    "DND: delegated event must be rejected"
            if 'RB' in key_state.traits and event['t'] in ('icp','rot','dip','drt'):
                backer_count = len(event.get('b', []))
                rb_seal_count = count_registrar_backer_seals(event.get('a', []))
                assert rb_seal_count == backer_count, \
                    f"RB: need {backer_count} registrar backer seals, got {rb_seal_count}"
    strategy: "key_event_strategy() x key_state_strategy() — includes EO/DND/RB traits"
    notes: "Spec L1591-1624. Finding: KERI-INV-004."

  # --- Cryptographic Strength Minimum (Finding KERI-INV-019) ---
  - invariant: "All KERI cryptographic operations MUST preserve a minimum of approximately 128 bits of cryptographic strength. Sequence number maximum value MUST be 2^128-1 (hex ffffffffffffffffffffffffffffffff); any sn exceeding this MUST be rejected."
    term: "SecurityLevel"
    technique: smt
    formal:
      language: z3
      expression: |
        sn = BitVec('sn', 128)
        max_sn = BitVecVal(2**128 - 1, 128)
        s = Solver()
        s.add(ULE(sn, max_sn))
        assert s.check() == sat  # valid range is satisfiable
        # Prove: sn > max_sn is impossible in 128-bit representation
        s2 = Solver()
        s2.add(UGT(sn, max_sn))
        assert s2.check() == unsat  # overflow is impossible
    notes: "Spec L4407, L1471. Finding: KERI-INV-019."

contracts:
  - port_ref: "port://identity/inbound/identity-management"
    preconditions:
      - formal:
          language: python
          expression: "lambda config: config.keys is not None and len(config.keys) >= 1"
        description: "create_inception requires at least one signing key"
      - formal:
          language: python
          expression: "lambda aid, new_keys, new_next: aid is not None and len(new_keys) >= 1"
        description: "create_rotation requires valid AID and new keys"
    postconditions:
      - formal:
          language: python
          expression: "lambda config, result: result.t == 'icp' and result.sn == 0 and result.said is not None"
        description: "create_inception returns icp at sn=0 with SAID"
      - formal:
          language: python
          expression: "lambda aid, new_keys, new_next, result: result.t == 'rot' and result.i == aid"
        description: "create_rotation returns rot for the given AID"

  - port_ref: "port://identity/inbound/event-processing"
    preconditions:
      - formal:
          language: python
          expression: "lambda event, sigs, rcts: event is not None and len(sigs) >= 1"
        description: "At least one signature required"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda event, sigs, rcts, result: (
                isinstance(result, EventValidated) or isinstance(result, ValidationError)
            )
        description: "Returns validated or error"

  - port_ref: "port://identity/inbound/state-query"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid: aid is not None"
        description: "AID required for all queries"
    postconditions:
      - formal:
          language: python
          expression: "lambda aid, kel: len(kel.events) >= 1 and kel.events[0].t in ('icp', 'dip')"
        description: "KEL always starts with inception"

state_machines:
  - name: "EventProcessingOutcome"
    term: "Event Processing"
    states: ["Received", "Validated", "Accepted", "Escrowed", "Rejected"]
    initial_state: "Received"
    terminal_states: ["Accepted", "Rejected"]
    transitions:
      - from: "Received"
        to: "Validated"
        trigger: "Prefix known and sequence number matches expected"
        guard: "sn == expected_sn AND prefix in known AIDs"
      - from: "Received"
        to: "Escrowed"
        trigger: "Sequence number gap or unknown prefix"
        guard: "sn > expected_sn OR (prefix unknown AND event is not inception)"
      - from: "Received"
        to: "Rejected"
        trigger: "Stale or duplicate event"
        guard: "sn < expected_sn AND not a valid recovery rotation"
      - from: "Validated"
        to: "Accepted"
        trigger: "All validation passes (signatures, witnesses, delegation)"
        guard: "Signatures satisfy threshold AND witness receipts satisfy TOAD AND delegation seal verified (if delegated)"
      - from: "Validated"
        to: "Escrowed"
        trigger: "Partial validation — missing signatures, witnesses, or delegation"
        guard: "Signatures below threshold → PSE; witness receipts below TOAD → PWE; delegation seal missing → PDE"
      - from: "Validated"
        to: "Rejected"
        trigger: "Invalid signatures or EO trait violation"
        guard: "No valid signatures OR (event is ixn AND AID has EstOnly trait) OR (event is rot AND sn < last establishment sn for non-delegated)"
      - from: "Escrowed"
        to: "Validated"
        trigger: "Blocking condition resolved — reprocess through validation"
        guard: "Missing dependency arrived (prior event, signatures, receipts, delegation seal)"
      - from: "Escrowed"
        to: "Rejected"
        trigger: "Escrow timeout exceeded"
        guard: "escrowed_at + timeout < current_time"
    invariants:
      - "Every event reaches exactly one terminal state (Accepted or Rejected)"
      - "Escrowed events re-enter at Validated, not Received — no duplicate dispatch"
      - "EO trait violation is immediate rejection — no escrow"
      - "Stale rotation (sn < lastEst.sn for non-delegated) is immediate rejection"
      - "Stale delegated rotation (sn < lastEst.sn) is NOT rejected — may be valid recovery"

# Escrow processing order as declarative constraints.
# The order matters because resolving one escrow type may cascade events
# into the next type. These dependencies define the required processing sequence.
validation_constraints:
  - id: "E1_ooe_first"
    constraint: "Out-of-Order Escrow (OOE) processed first — releases sequence-gapped events that may feed all downstream queues"
    depends_on: []
    on_failure: null

  - id: "E2_uwe_second"
    constraint: "Unverified Witness Receipt Escrow (UWE) processed after OOE — resolve witness receipt verification before event-level threshold checks"
    depends_on: ["E1_ooe_first"]
    on_failure: null

  - id: "E3_ure_third"
    constraint: "Unverified Non-Transferable Receipt Escrow (URE) processed after UWE — resolve non-transferable receipt signer verification"
    depends_on: ["E2_uwe_second"]
    on_failure: null

  - id: "E4_vre_fourth"
    constraint: "Unverified Transferable Receipt Escrow (VRE) processed after URE — resolve transferable receipt signer verification"
    depends_on: ["E3_ure_third"]
    on_failure: null

  - id: "E5_pde_fifth"
    constraint: "Partially-Delegated Escrow (PDE) processed after receipt escrows — delegation approval may unblock witness and signature checks downstream"
    depends_on: ["E4_vre_fourth"]
    on_failure: null

  - id: "E6_pwe_sixth"
    constraint: "Partially-Witnessed Escrow (PWE) processed after PDE — witness receipt arrival may trigger signature re-evaluation"
    depends_on: ["E5_pde_fifth"]
    on_failure: null

  - id: "E7_pse_seventh"
    constraint: "Partially-Signed Escrow (PSE) processed after PWE — events released from witness checks may accumulate signatures here"
    depends_on: ["E6_pwe_sixth"]
    on_failure: null

  - id: "E8_lde_eighth"
    constraint: "Likely-Duplicitous Escrow (LDE) processed near end — prune timed-out duplicity evidence; never auto-resolved"
    depends_on: ["E7_pse_seventh"]
    on_failure: null

  - id: "E9_qnf_ninth"
    constraint: "Query-Not-Found Escrow (QNF) processed last — final sweep target for queries whose responses have not yet arrived"
    depends_on: ["E8_lde_eighth"]
    on_failure: null

  # Delegable and MFE are NOT in the standard sweep
  # - Delegable resolves when the delegator commits the approval seal (external trigger)
  # - MFE resolves only via source-promotion (same event re-submitted from local source)
