# verification.yaml
domain_ref: "identity"

# Verification properties are language-agnostic invariants.
# Code examples use Python/pytest syntax for illustration — implementations
# in other languages should express equivalent assertions in their native testing framework.

properties:
  # KEL invariants
  - invariant: "KEL immutability with recovery exception: the KEL is append-only — events MUST NOT be modified or deleted once accepted. Exception: superseding recovery (Rule A0) replaces events on the forked branch by designating the recovery rotation's branch as the new trunk. Replaced events are preserved (queryable by fn) but removed from the active KEL sequence."
    term: "KEL"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy(), new_event=key_event_strategy())
        def test_kel_immutability_with_recovery_exception(kel, new_event):
            snapshot = [e.said for e in kel.events]
            kel.append(new_event)
            # Append-only: all prior events unchanged
            for i, said in enumerate(snapshot):
                assert kel.events[i].said == said, (
                    f"Event at index {i} MUST NOT be modified after acceptance"
                )
            # Recovery exception: superseding rotation replaces trunk
            if hasattr(kel, 'apply_superseding'):
                recovery_rot = build_recovery_rotation(kel.aid, sn=new_event.sn)
                kel.apply_superseding(recovery_rot, new_event)
                # Replaced event is off trunk but still queryable by fn
                assert new_event not in [e for e in kel.active_events], (
                    "Superseded event removed from active KEL sequence"
                )
                assert kel.get_by_fn(new_event.fn) is not None, (
                    "Superseded event MUST be preserved and queryable by fn"
                )
    strategy: "kel_strategy(), key_event_strategy()"
    notes: "Append-only with one exception: Rule A0 superseding recovery replaces trunk events. Replaced events preserved queryable by fn."

  - invariant: "Hash-chained — each event includes digest of prior event in p field"
    term: "KEL"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy(min_events=2))
        def test_kel_hash_chain(kel):
            for i in range(1, len(kel.events)):
                assert kel.events[i].p == kel.events[i-1].said
    strategy: "kel_strategy(min_events=2)"
    notes: "Hash chain creates tamper-evidence."

  - invariant: "Exactly one authoritative KEL per AID"
    term: "KEL"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(aid=aid_strategy())
        def test_one_kel_per_aid(aid):
            store = KELStore()
            kel = store.get_or_create(aid)
            kel2 = store.get_or_create(aid)
            assert kel is kel2  # same instance
    strategy: "aid_strategy()"
    notes: "AID-to-KEL mapping is 1:1."

  - invariant: "Deterministic key state derivable from any KEL prefix"
    term: "KEL"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy())
        def test_deterministic_key_state(kel):
            for n in range(1, len(kel.events) + 1):
                prefix = kel.events[:n]
                s1 = compute_key_state_from_events(prefix)
                s2 = compute_key_state_from_events(prefix)
                assert s1 == s2
    strategy: "kel_strategy()"
    notes: "Any prefix of the KEL produces deterministic key state."

  # Key State invariants
  - invariant: "Deterministically computed from the KEL up to the latest establishment event"
    term: "Key State"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_strategy())
        def test_key_state_deterministic(kel):
            state1 = compute_key_state(kel)
            state2 = compute_key_state(kel)
            assert state1 == state2
    strategy: "kel_strategy() generates valid KELs with mixed event types"
    notes: "Determinism is the foundational invariant of key state."

  - invariant: "Only establishment events (icp, rot, dip, drt) modify key state"
    term: "Key State"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(kel=kel_with_ixn_strategy())
        def test_ixn_does_not_change_key_state(kel):
            for i, event in enumerate(kel.events):
                if event.t == 'ixn':
                    state_before = compute_key_state(kel.prefix(i))
                    state_after = compute_key_state(kel.prefix(i + 1))
                    assert state_before.signing_keys == state_after.signing_keys
                    assert state_before.next_digests == state_after.next_digests
                    assert state_before.signing_threshold == state_after.signing_threshold
                    assert state_before.witnesses == state_after.witnesses
    strategy: "kel_with_ixn_strategy() generates KELs containing interaction events"
    notes: "Interaction events advance sn but never touch key state fields."

  # Escrow Type Pattern invariants
  - invariant: "Escrow reprocessing outcomes: when an escrowed event is reprocessed, exactly one of four outcomes MUST occur: (1) ACCEPTED — blocking condition resolved, event moves to KEL; (2) SAME-ESCROW — blocking condition still unresolved, event stays in current escrow; (3) CASCADE — one blocking condition resolved but another discovered, event moves to a different escrow type; (4) PRUNED — timeout exceeded, event discarded permanently."
    term: "Escrow Type Pattern"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(escrowed_event=escrowed_event_strategy())
        def test_escrow_reprocessing_outcomes(escrowed_event):
            result = reprocess(escrowed_event)
            VALID_OUTCOMES = ('accepted', 'same_escrow', 'cascaded', 'pruned')
            assert result.outcome in VALID_OUTCOMES, (
                f"Escrow reprocessing MUST produce one of {VALID_OUTCOMES}, "
                f"got '{result.outcome}'"
            )
            if result.outcome == 'accepted':
                assert result.event in get_kel(escrowed_event.aid).events, (
                    "ACCEPTED: event MUST be in KEL"
                )
            elif result.outcome == 'same_escrow':
                assert result.escrow_type == escrowed_event.escrow_type, (
                    "SAME-ESCROW: event stays in current escrow type"
                )
            elif result.outcome == 'cascaded':
                assert result.escrow_type != escrowed_event.escrow_type, (
                    "CASCADE: event MUST move to a different escrow type"
                )
            elif result.outcome == 'pruned':
                assert result.event not in get_all_escrows(), (
                    "PRUNED: event MUST be permanently discarded from all escrows"
                )
    strategy: "escrowed_event_strategy()"
    notes: "Exactly four outcomes: ACCEPTED (to KEL), SAME-ESCROW (stay), CASCADE (different escrow), PRUNED (discarded)."

  # Escrow Cascade invariants
  - invariant: "Escrow processing order MUST be: OOE first (resolves sequence gaps), then PSE (resolves signature deficiency), then PWE (resolves witness deficiency), then PDE (resolves delegation deficiency). This order matters because: OOE resolution may produce events that satisfy PSE conditions; PSE resolution may produce fully-signed events that enter PWE; PWE resolution may produce fully-witnessed events that enter PDE."
    term: "Escrow Cascade"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(st.data())
        def test_escrow_processing_order(data):
            processor = EventProcessor()
            order = processor.get_escrow_processing_order()
            assert order.index('OOE') < order.index('PSE'), (
                "OOE MUST be processed before PSE — OOE resolution may produce "
                "events that satisfy PSE conditions"
            )
            assert order.index('PSE') < order.index('PWE'), (
                "PSE MUST be processed before PWE — PSE resolution may produce "
                "fully-signed events that enter PWE"
            )
            assert order.index('PWE') < order.index('PDE'), (
                "PWE MUST be processed before PDE — PWE resolution may produce "
                "fully-witnessed events that enter PDE"
            )
            # Verify the complete order
            assert order == ['OOE', 'PSE', 'PWE', 'PDE'], (
                f"Complete escrow processing order MUST be [OOE, PSE, PWE, PDE], got {order}"
            )
    strategy: "Fixed order verification"
    notes: "OOE -> PSE -> PWE -> PDE. Each stage may produce events that satisfy the next stage's conditions."

  # Out-of-Order Escrow invariants
  - invariant: "Triggered when sn > expected_sn for a known prefix, or when the prefix is unknown and the event is not an inception"
    term: "Out-of-Order Escrow"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(expected_sn=st.integers(min_value=0, max_value=10),
               event_sn=st.integers(min_value=1, max_value=100))
        def test_ooe_trigger(expected_sn, event_sn):
            assume(event_sn > expected_sn)
            result = check_sn(event_sn, expected_sn)
            assert result == 'OOE'
    strategy: "st.integers for expected and event sn"
    notes: "sn > expected = OOE."

  - invariant: "Default timeout: 1200 seconds (keripy TimeoutOOE)"
    term: "Out-of-Order Escrow"
    technique: smt
    formal:
      language: z3-python
      expression: |
        from z3 import *
        timeout = Int('timeout')
        s = Solver()
        s.add(timeout == 1200)
        s.add(timeout > 0)
        assert s.check() == sat
    notes: "Default OOE timeout is 1200s (20 minutes)."

  # Escrow Timeout invariants
  - invariant: "Escrow timeout semantics: an escrowed item with age A and configured timeout T is active when A < T and MUST be pruned when A >= T. Timeout is checked during each processing cycle. Pruned items are permanently discarded — they cannot re-enter any escrow. Default timeouts: OOE=1200s, PSE=3600s, PWE=3600s, PDE=86400s."
    term: "Escrow Timeout"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(timeout=st.integers(min_value=1, max_value=86400),
               elapsed=st.integers(min_value=0, max_value=172800))
        def test_escrow_timeout_semantics(timeout, elapsed):
            is_expired = elapsed >= timeout
            result = check_timeout(elapsed, timeout)
            assert result.is_pruned == is_expired, (
                f"age={elapsed}, timeout={timeout}: "
                f"is_pruned MUST be {is_expired} (A >= T), got {result.is_pruned}"
            )
            # Boundary: exactly at timeout MUST be pruned
            boundary = check_timeout(timeout, timeout)
            assert boundary.is_pruned == True, (
                f"At exact timeout boundary (A == T == {timeout}): MUST be pruned"
            )
            # One tick before timeout MUST be active
            if timeout > 0:
                before = check_timeout(timeout - 1, timeout)
                assert before.is_pruned == False, (
                    f"One tick before timeout (A={timeout-1}, T={timeout}): MUST be active"
                )
            # Pruned items cannot re-enter escrow
            if result.is_pruned:
                assert not result.can_re_escrow, (
                    "Pruned items MUST NOT re-enter any escrow"
                )

        def test_default_timeouts():
            """Default timeout values for each escrow type."""
            assert OOE_TIMEOUT == 1200, "OOE default timeout MUST be 1200s"
            assert PSE_TIMEOUT == 3600, "PSE default timeout MUST be 3600s"
            assert PWE_TIMEOUT == 3600, "PWE default timeout MUST be 3600s"
            assert PDE_TIMEOUT == 86400, "PDE default timeout MUST be 86400s"
    strategy: "st.integers for timeout and elapsed, plus boundary and default checks"
    notes: "Active when A < T, pruned when A >= T. Pruned = permanent discard. Defaults: OOE=1200s, PSE=3600s, PWE=3600s, PDE=86400s."

  # Misfit Event Escrow invariants
  - invariant: "Events are not automatically reprocessed -- they must be re-submitted from a local source"
    term: "Misfit Event Escrow"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(misfit=misfit_event_strategy())
        def test_misfit_no_auto_reprocess(misfit):
            processor = EventProcessor()
            processor.escrow_misfit(misfit)
            resolved = processor.process_escrows()
            # Misfit events are never in the resolved list
            assert misfit.said not in [r.said for r in resolved]
    strategy: "misfit_event_strategy()"
    notes: "Misfits require manual re-submission."

contracts:
  - port_ref: "port://identity/inbound/identity-management"
    preconditions:
      - formal:
          language: python
          expression: "lambda config: config.keys is not None and len(config.keys) >= 1"
        description: "create_inception requires at least one signing key"
      - formal:
          language: python
          expression: "lambda aid, new_keys, new_next: aid is not None and len(new_keys) >= 1"
        description: "create_rotation requires valid AID and new keys"
    postconditions:
      - formal:
          language: python
          expression: "lambda config, result: result.t == 'icp' and result.sn == 0 and result.said is not None"
        description: "create_inception returns icp at sn=0 with SAID"
      - formal:
          language: python
          expression: "lambda aid, new_keys, new_next, result: result.t == 'rot' and result.i == aid"
        description: "create_rotation returns rot for the given AID"

  - port_ref: "port://identity/inbound/event-processing"
    preconditions:
      - formal:
          language: python
          expression: "lambda event, sigs, rcts: event is not None and len(sigs) >= 1"
        description: "At least one signature required"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda event, sigs, rcts, result: (
                isinstance(result, EventValidated) or isinstance(result, ValidationError)
            )
        description: "Returns validated or error"

  - port_ref: "port://identity/inbound/state-query"
    preconditions:
      - formal:
          language: python
          expression: "lambda aid: aid is not None"
        description: "AID required for all queries"
    postconditions:
      - formal:
          language: python
          expression: "lambda aid, kel: len(kel.events) >= 1 and kel.events[0].t in ('icp', 'dip')"
        description: "KEL always starts with inception"

state_machines: []

# Escrow processing order as declarative constraints.
# The order matters because resolving one escrow type may cascade events
# into the next type. These dependencies define the required processing sequence.
validation_constraints:
  - id: "E1_ooe_first"
    constraint: "Out-of-Order Escrow (OOE) processed first — releases sequence-gapped events that may then need signature/witness/delegation checking"
    depends_on: []
    on_failure: null

  - id: "E2_pse_second"
    constraint: "Partially-Signed Escrow (PSE) processed after OOE — events released from OOE may accumulate new signatures here"
    depends_on: ["E1_ooe_first"]
    on_failure: null

  - id: "E3_pwe_third"
    constraint: "Partially-Witnessed Escrow (PWE) processed after PSE — events that pass signing threshold may still need witness receipts"
    depends_on: ["E2_pse_second"]
    on_failure: null

  - id: "E4_pde_fourth"
    constraint: "Partially-Delegated Escrow (PDE) processed after PWE — delegated events need signatures AND witnesses before delegation check"
    depends_on: ["E3_pwe_third"]
    on_failure: null
