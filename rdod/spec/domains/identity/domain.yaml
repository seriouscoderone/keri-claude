# domain.yaml
template_version: "2.0"
id: "identity"
name: "KERI Identity Management"
description: >
  Create and manage cryptographic identifiers — inception creates an AID bound to initial keys,
  rotation changes the controlling keys via pre-rotation commitment, interaction events commit
  external data to the identity history, and state tracking maintains the current authoritative key configuration.
  This domain merges the event-driven lifecycle of key events (the KEL) with the computed
  key state that results from processing those events. It is the core of what KERI does:
  establishing, evolving, and querying the cryptographic identity of an AID.
version: "0.1.0"
tier: "domain"

source_material:
  - type: document
    reference: "keri-specification.md — sections: Key event messages, Inception/Rotation/Interaction Event Message Body, Key State, Pre-rotation"
  - type: document
    reference: "KERI_WP_2.x.web.md — sections: Key Event Log, Key State, Pre-rotation, Establishment Events"
  - type: document
    reference: "KERI_SecurityDeepDive.web.md — sections: Establishment Subsequence, Combined Arms"
  - type: document
    reference: "keripy — Python reference implementation (Kevery, Kever, SerderKERI, eventing module, Baser storage)"
  - type: document
    reference: "keriox — Rust production implementation (EventProcessor, IdentifierState, KeyConfig, EventStorage)"

published_language:
  - term: "AID"
    description: "Autonomic Identifier — self-certifying cryptographic identifier referenced by all KERI domains"
  - term: "KEL"
    description: "Key Event Log — the append-only identity ledger referenced by credential and service domains"
  - term: "Controller"
    description: "Entity controlling an AID — referenced by all domains that authenticate"
  - term: "Escrow Cascade"
    description: "Event flow between escrow queues as blocking conditions resolve — referenced by accountability, delegation, integrity, thresholds"
  - term: "KelRepository"
    description: "Append-only persistence for the Key Event Log and escrow queues. The IdentityService wraps the KelRepository — the Service IS the guard, the Repository IS the storage. Referenced by credential-lifecycle for the TelRepository."
domain_clients: []

subdomains:
  - ref: "domain://identity/establishment"
    relationship: "Owns the multi-step validation pipeline for inception and rotation events — signature verification, threshold satisfaction, pre-rotation binding, witness checks, delegation approval"
    via_port: "port://identity/establishment/inbound/validate-event"
  - ref: "domain://identity/key-commitment"
    relationship: "Owns pre-rotation mechanics, key configuration (signing keys + next key digests), partial rotation, and transferable/non-transferable classification"
    via_port: "port://identity/key-commitment/inbound/key-commitment"
  - ref: "domain://identity/thresholds"
    relationship: "Owns signing threshold (kt), rotation threshold (nt), dual threshold enforcement, fractionally weighted thresholds, witness threshold (bt/TOAD), and witness configuration"
    via_port: "port://identity/thresholds/inbound/threshold-satisfaction"
  - ref: "domain://identity/state"
    relationship: "Owns the Kever state machine — per-AID state tracking, state reconstruction from the KEL, establishment subsequence management, last establishment data, configuration trait enforcement, and the authoritative answer to 'what is this AID's current key state?'"
    via_port: "port://identity/state/inbound/commit"
  - ref: "domain://identity/anchoring"
    relationship: "Owns interaction events — binding external data to the KEL via cryptographic seals"
    via_port: "port://identity/anchoring/inbound/data-anchoring"

kernels: []

adjacents:
  - ref: "domain://cesr"
    pattern: "conformist"
    relationship: "CESR primitives (Verification Key, Digest, Indexed Signature, AID, SAID) adopted natively in all identity data structures"
  - ref: "domain://keri-messaging"
    pattern: "conformist"
    relationship: "KERI messaging primitives (exn, qry, rpy) adopted natively"
  - ref: "domain://accountability"
    relationship: "Customer-Supplier — identity protocols require witness receipts from accountability for event acceptance"
    pattern: "Customer-Supplier"
    via_port: "port://accountability/receipting/inbound/receipt-lifecycle"
  - ref: "domain://delegation"
    relationship: "Customer-Supplier — delegated identity events require authorization from delegation domain"
    pattern: "Customer-Supplier"
    via_port: "port://delegation/authorization/inbound/binding-lifecycle"
  - ref: "domain://integrity"
    relationship: "Customer-Supplier — identity provides KEL data that integrity monitors for duplicity"
    pattern: "Customer-Supplier"
  - ref: "domain://discovery"
    relationship: "Partnership — identity and discovery collaborate on endpoint publishing and OOBI resolution"
    pattern: "Partnership"

externals:
  - ref: "domain://externals/cryptographic-primitives"
    source: "Ed25519 (event signing), Blake3-256/SHA-256 (SAID computation, prior event digest, seal digests, next key commitments)"
    relationship: "Cryptographic algorithm types appear directly in event fields and key state structures — signatures, digests, public keys, and threshold expressions are kernel types"
  - ref: "domain://externals/persistence"
    relationship: "Append-only persistence for KEL events, signature accumulation, witness receipt accumulation, and escrow queues — the KelRepository outbound port delegates to this external"

implementation_guidance:
  suggested_type: "package"
  language_affinity: "any"
  notes: >
    This domain merges the event log and key state concepts from the original decomposition.
    In keripy, the Kevery class handles event processing and the Kever class tracks per-AID
    key state. In keriox, the EventProcessor and IdentifierState handle these roles. All
    implementations must enforce normative field ordering, SAID computation, and deterministic
    key state derivation per the specification.

    The Service-wraps-Repository pattern: The IdentityService IS the guard — it validates
    events, enforces thresholds, and routes to escrow. The KelRepository IS the storage —
    the append-only log and escrow queues. The adopter interacts with the IdentityService
    (commit events, query state). The KelRepository is an internal persistence detail.

    The same pattern applies to StatusService/TelRepository (credential-lifecycle/status),
    DelegationService (delegation/lifecycle), and VerificationService
    (credential-lifecycle/verification). Each Service owns its domain-specific validation
    logic; each Repository provides persistence underneath.

    Structure — Service (guard): domain logic that validates writes (signature checks,
    threshold satisfaction, witness receipts, delegation approval, duplicity detection);
    Repository (storage): append-only log (the aggregate's source of truth — writes only
    happen after the Service approves) + escrow queues (pending writes — events the Service
    said 'not yet' to, each escrow type corresponds to a specific missing prerequisite,
    re-enters the Service when the prerequisite arrives); raw_persistence:
    domain://externals/persistence adapter (LMDB, DynamoDB, SQLite, etc.).
    Outcomes — accept: Service approves, event committed to the log, domain event published;
    escrow: Service says 'not yet', event stored in escrow queue keyed by blocking condition,
    reprocessed when condition resolves; reject: Service says 'no', event refused, error
    returned to caller.
    Invariants: the log is NEVER written to directly (all writes go through the Service);
    the Service calls domain-specific checkers (it doesn't implement the checks itself);
    escrow is part of the repository, not a separate concern (it's the 'pending writes'
    queue); reprocessing re-enters the Service, not the log (escrowed events are fully
    re-validated); the Service is what makes this a KERI domain, not just a database (the
    acceptance rules ARE the protocol's value).
    Example: IdentityService.commit(event, signatures) -> Accept | Escrow | Reject.

    Identifier Type Dimensions: Every KERI identifier is characterized by five orthogonal
    dimensions (Transferability, Delegation, Witnessing, Signing Model, Operational Constraints) expressed through
    field values in the inception event. Implementations SHOULD provide typed builders that
    make these dimensions explicit rather than exposing raw field map manipulation. Example:
    Identity.builder().transferable().witnessed(witnesses, toad).multiSig(threshold, keys).build()

issues: []

tags: ["identity", "kel", "establishment", "key-commitment", "pre-rotation", "thresholds", "anchoring"]
