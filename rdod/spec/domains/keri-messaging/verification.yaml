# verification.yaml
domain_ref: "keri-messaging"

properties:
  # KRAM invariants
  - invariant: "Every non-KEL message (exn, qry, rpy, xip, pro, bar) MUST include a signature by the sender's current signing keys — unsigned messages MUST be rejected before any content processing"
    term: "KRAM"
    technique: "property-based"
    formal:
      language: python
      expression: |
        @given(message=non_kel_message_strategy())
        def test_kram_signature_required(message):
            unsigned = strip_signatures(message)
            result = verify_kram(unsigned, sender_key_state, now)
            assert not result.accepted, "Unsigned non-KEL message must be rejected"
    strategy: "Generate non-KEL messages with and without signatures"

  - invariant: "Monotonic timestamps: each message from a given AID MUST have a datetime >= all previously seen datetimes from that AID — out-of-order timestamps indicate replay"
    term: "KRAM"
    technique: "property-based"
    formal:
      language: python
      expression: |
        @given(messages=st.lists(timestamped_message_strategy(), min_size=2))
        def test_kram_monotonic_timestamps(messages):
            cache = KRAMCache()
            sorted_msgs = sorted(messages, key=lambda m: m.dt)
            for msg in sorted_msgs:
                cache.accept(msg)
            # Replaying an older message must fail
            older = sorted_msgs[0]
            result = cache.check(older)
            assert result.rejected, "Message with timestamp older than last-seen must be rejected"
    strategy: "Generate sequences of timestamped messages, verify monotonicity"

  - invariant: "Freshness window: message datetime MUST satisfy (receiver_time - drift - lag) <= message_dt <= (receiver_time + drift) — messages outside this window MUST be rejected as stale"
    term: "KRAM"
    technique: "property-based"
    formal:
      language: python
      expression: |
        @given(drift=st.integers(min_value=50, max_value=500),
               lag=st.integers(min_value=1000, max_value=86400000),
               message_age=st.integers(min_value=0, max_value=172800000))
        def test_kram_freshness_window(drift, lag, message_age):
            now = current_time_ms()
            message_dt = now - message_age
            lower_bound = now - drift - lag
            upper_bound = now + drift
            is_fresh = lower_bound <= message_dt <= upper_bound
            result = check_freshness(message_dt, now, drift, lag)
            assert result.fresh == is_fresh
    strategy: "Parameterized drift, lag, and message age"
    notes: "Three auth types determine lag: seal-reference (short), single-key (short), multi-key (long for signature accumulation)"

  - invariant: "Duplicate SAID detection: messages with the same SAID from the same sender MUST be idempotently accepted — the cache prevents reprocessing"
    term: "KRAM"
    technique: "property-based"
    formal:
      language: python
      expression: |
        @given(message=non_kel_message_strategy())
        def test_kram_duplicate_detection(message):
            cache = KRAMCache()
            result1 = cache.accept(message)
            result2 = cache.accept(message)
            assert result1.accepted
            assert result2.duplicate, "Second submission of same SAID must be detected as duplicate"
    strategy: "Submit same message twice, verify idempotent duplicate detection"

  - invariant: "KEL messages (icp, rot, ixn, dip, drt) MUST bypass KRAM — they have built-in ordering via sequence numbers and hash-chain integrity"
    term: "KRAM"
    technique: "property-based"
    formal:
      language: python
      expression: |
        @given(kel_event=kel_event_strategy())
        def test_kel_bypasses_kram(kel_event):
            assert kel_event.ilk in ('icp', 'rot', 'ixn', 'dip', 'drt')
            assert not requires_kram(kel_event), "KEL events must not require KRAM"
    strategy: "Generate KEL events, verify KRAM bypass"

  - invariant: "Multi-key signature accumulation: for multi-key AIDs, signatures are accumulated across deliveries until the signing threshold is satisfied — key state changes between deliveries invalidate accumulated signatures"
    term: "KRAM"
    technique: "property-based"
    formal:
      language: python
      expression: |
        @given(threshold=st.integers(min_value=2, max_value=5),
               sig_count=st.integers(min_value=1, max_value=10))
        def test_kram_multisig_accumulation(threshold, sig_count):
            cache = KRAMCache()
            message = build_multisig_message(threshold=threshold)
            for i in range(min(sig_count, threshold)):
                delivery = add_signature(message, signer_index=i)
                result = cache.accept(delivery)
            if sig_count >= threshold:
                assert result.accepted, "Threshold-satisfying signatures must be accepted"
            else:
                assert result.pending, "Below-threshold signatures must be pending"
    strategy: "Parameterized threshold and signature accumulation count"

  # SKRAP (HTTP-level) invariants
  - invariant: "SKRAP signature base is constructed from exactly four fields in canonical order: Signify-Resource, @method, @path, Signify-Timestamp"
    term: "SKRAP"
    technique: "property-based"
    formal:
      language: python
      expression: |
        @given(method=st.sampled_from(['GET', 'POST', 'PUT', 'DELETE']),
               path=st.text(min_size=1, max_size=100),
               aid=aid_strategy(),
               timestamp=st.datetimes())
        def test_skrap_signature_base(method, path, aid, timestamp):
            base = build_signature_base(method=method, path=path, resource=aid, timestamp=timestamp)
            lines = base.split('\n')
            assert '"signify-resource"' in lines[0] or '"@method"' in lines[0]
            assert len(lines) == 5  # 4 fields + signature-params
    strategy: "Generate HTTP request components, verify canonical signature base"

  - invariant: "SKRAP mutual authentication: client signs requests with Client AID key, agent signs responses with Agent AID key — both sides verify against the other's current key state"
    term: "SKRAP"
    technique: "property-based"
    formal:
      language: python
      expression: |
        @given(request=http_request_strategy(), response=http_response_strategy())
        def test_skrap_mutual_auth(request, response):
            # Client -> Agent
            signed_request = skrap_sign(request, client_keys)
            assert skrap_verify(signed_request, client_key_state), "Agent must verify client signature"
            # Agent -> Client
            signed_response = skrap_sign(response, agent_keys)
            assert skrap_verify(signed_response, agent_key_state), "Client must verify agent signature"
    strategy: "Generate request/response pairs, verify bidirectional signing"

  # --- Key Event Message Field Ordering (Finding KERI-INV-001) ---
  - invariant: "Key event message bodies MUST have fields in exact canonical order per type. icp: [v,t,d,i,s,kt,k,nt,n,bt,b,c,a]. rot: [v,t,d,i,s,p,kt,k,nt,n,bt,br,ba,c,a]. ixn: [v,t,d,i,s,p,a]. dip: [v,t,d,i,s,kt,k,nt,n,bt,b,c,a,di]. drt: [v,t,d,i,s,p,kt,k,nt,n,bt,br,ba,c,a,di]. rct: [v,t,d,i,s]. No extra top-level fields allowed. Attachments via CESR codes only."
    term: "Key Event Message"
    technique: property-based
    formal:
      language: python
      expression: |
        KEY_EVENT_FIELDS = {
            'icp': ['v','t','d','i','s','kt','k','nt','n','bt','b','c','a'],
            'rot': ['v','t','d','i','s','p','kt','k','nt','n','bt','br','ba','c','a'],
            'ixn': ['v','t','d','i','s','p','a'],
            'dip': ['v','t','d','i','s','kt','k','nt','n','bt','b','c','a','di'],
            'drt': ['v','t','d','i','s','p','kt','k','nt','n','bt','br','ba','c','a','di'],
            'rct': ['v','t','d','i','s'],
        }
        @given(event=key_event_strategy())
        def test_key_event_field_order(event):
            ilk = event['t']
            assert ilk in KEY_EVENT_FIELDS, f"Unknown key event type: {ilk}"
            expected = KEY_EVENT_FIELDS[ilk]
            actual = list(event.keys())
            assert actual == expected, f"{ilk}: {actual} != {expected}"
    strategy: "key_event_strategy() — generates all 6 key event types with correct and adversarial field orders"
    notes: "Spec L1944-2366. Covers icp, rot, ixn, dip, drt, rct field ordering and no-extra-fields constraint. Finding: KERI-INV-001."

  # --- Routed Message Field Ordering (Finding KERI-INV-002) ---
  - invariant: "Routed message bodies MUST have fields in exact canonical order per type. qry: [v,t,d,dt,r,rr,q]. rpy: [v,t,d,dt,r,a]. pro: [v,t,d,dt,r,rr,q]. bar: [v,t,d,dt,r,a]. xip: [v,t,d,u,i,ri,dt,r,q,a]. exn: [v,t,d,i,ri,x,p,dt,r,q,a]. No extra top-level fields. Route r field REQUIRED in all routed messages."
    term: "Routed Message"
    technique: property-based
    formal:
      language: python
      expression: |
        ROUTED_MSG_FIELDS = {
            'qry': ['v','t','d','dt','r','rr','q'],
            'rpy': ['v','t','d','dt','r','a'],
            'pro': ['v','t','d','dt','r','rr','q'],
            'bar': ['v','t','d','dt','r','a'],
            'xip': ['v','t','d','u','i','ri','dt','r','q','a'],
            'exn': ['v','t','d','i','ri','x','p','dt','r','q','a'],
        }
        @given(msg=routed_message_strategy())
        def test_routed_message_field_order(msg):
            ilk = msg['t']
            assert ilk in ROUTED_MSG_FIELDS, f"Unknown routed message type: {ilk}"
            expected = ROUTED_MSG_FIELDS[ilk]
            actual = list(msg.keys())
            assert actual == expected, f"{ilk}: {actual} != {expected}"
            assert 'r' in msg, "Route field r MUST be present in all routed messages"
    strategy: "routed_message_strategy() — generates all 6 routed message types"
    notes: "Spec L2653-2900. Finding: KERI-INV-002."

  # --- Version String Rules (Finding KERI-INV-003) ---
  - invariant: "Version string v MUST be the first field in any KERI message. Protocol field MUST be 'KERI'. v2.XX implementations MUST support v1.x format. Message type t MUST be a three-character string from the set [icp,rot,ixn,dip,drt,rct,qry,rpy,pro,bar,xip,exn]."
    term: "Version String"
    technique: property-based
    formal:
      language: python
      expression: |
        VALID_ILKS = {'icp','rot','ixn','dip','drt','rct','qry','rpy','pro','bar','xip','exn'}
        @given(msg=keri_message_strategy())
        def test_version_string_rules(msg):
            assert list(msg.keys())[0] == 'v', "v must be first field"
            vs = parse_version_string(msg['v'])
            assert vs.protocol == 'KERI', f"Protocol must be KERI, got {vs.protocol}"
            assert msg['t'] in VALID_ILKS, f"Unknown ilk: {msg['t']}"
            assert len(msg['t']) == 3, f"Ilk must be 3 chars, got {len(msg['t'])}"

        @given(v1_msg=v1_keri_message_strategy())
        def test_v1_backward_compat(v1_msg):
            parsed = parse_message(v1_msg)
            assert parsed.version.major == 1
            assert len(parsed.version_string) == 17
    strategy: "keri_message_strategy() + v1_keri_message_strategy()"
    notes: "Spec L1317-1356. Finding: KERI-INV-003."

  # --- Receipt SAID Inversion (Finding KERI-INV-005) ---
  - invariant: "In a receipt (rct), the d field MUST be the SAID of the receipted key event, NOT the SAID of the receipt message body itself. This is a semantic inversion from all other KERI message types where d = SAID of the enclosing message."
    term: "Receipt Message"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(key_event=key_event_strategy(), receipt=receipt_strategy())
        def test_receipt_said_inversion(key_event, receipt):
            assert receipt['d'] == said_compute(key_event), \
                "Receipt d must be SAID of receipted key event"
            assert receipt['d'] != said_compute(receipt), \
                "Receipt d must NOT be SAID of receipt body itself"
    strategy: "key_event_strategy() x receipt_strategy()"
    notes: "Spec L2362-2380. Semantic inversion unique to rct. Finding: KERI-INV-005."

  # --- Exchange Transaction Semantics (Finding KERI-INV-006) ---
  - invariant: "Exchange p field MUST be SAID of immediately preceding exchange message in a transaction, or empty string if not in a transaction. Exchange x field MUST be the d field of the first xip message, or empty string if not in a transaction. First message in any exchange transaction MUST be type xip."
    term: "Exchange Message"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(transaction=exchange_transaction_strategy())
        def test_exchange_transaction_semantics(transaction):
            assert transaction[0]['t'] == 'xip', "First message must be xip"
            xip_said = transaction[0]['d']
            for i, msg in enumerate(transaction):
                if i == 0:
                    assert msg.get('p', '') == '', "xip p must be empty"
                else:
                    assert msg['p'] == transaction[i-1]['d'], \
                        f"Message {i} p must be SAID of message {i-1}"
                    assert msg['x'] == xip_said, \
                        f"Message {i} x must be SAID of xip"

        @given(standalone=standalone_exchange_strategy())
        def test_standalone_exchange_empty_fields(standalone):
            assert standalone.get('x', '') == '', "Standalone x must be empty"
            assert standalone.get('p', '') == '', "Standalone p must be empty"
    strategy: "exchange_transaction_strategy() + standalone_exchange_strategy()"
    notes: "Spec L2583-2604. Finding: KERI-INV-006."

  # --- Seal Field Ordering (Finding KERI-INV-009) ---
  - invariant: "Seal field ordering is normative per seal type. Source Event seal: [s,d]. Key Event seal: [i,s,d]. Typed seal: [t,d] where t uses CESR Y code. Registrar Backer seal must appear in same establishment event that designates the backer. Seal encoding differs by serialization kind (JSON vs CESR native)."
    term: "Seal"
    technique: property-based
    formal:
      language: python
      expression: |
        SEAL_FIELDS = {
            'SealDigest': ['d'],
            'SealRoot': ['rd'],
            'SealTrans': ['s', 'd'],
            'SealEvent': ['i', 's', 'd'],
            'SealLast': ['i'],
            'SealTyped': ['t', 'd'],
        }
        @given(seal=seal_strategy())
        def test_seal_field_ordering(seal):
            seal_type = classify_seal(seal)
            expected = SEAL_FIELDS[seal_type]
            actual = list(seal.keys())
            assert actual == expected, f"{seal_type}: {actual} != {expected}"
    strategy: "seal_strategy() — generates all 6 seal types with correct and permuted field orders"
    notes: "Spec L1720-1896. Finding: KERI-INV-009."

  # --- CESR Native KERI Message Format (Finding KERI-INV-012) ---
  - invariant: "In CESR native format, the version field encodes protocol + protocol version + genus version ONLY (not size or serialization kind). Protocol MUST be 'KERI' (4 chars). DateTime MUST be ISO-8601 with microseconds and UTC offset. Route fields containing non-Base64 characters besides slash MUST be converted to Base64. Field ordering is strict per message type."
    term: "CESR Native Message"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(msg=cesr_native_keri_message_strategy())
        def test_cesr_native_format(msg):
            vs = parse_cesr_version_field(msg['v'])
            assert vs.protocol == 'KERI'
            assert vs.size is None, "CESR native version has no size field"
            assert vs.kind is None, "CESR native version has no serialization kind"
            if 'dt' in msg:
                assert matches_rfc3339_microsecond_utc(msg['dt'])
            if 'r' in msg and has_non_base64_chars(msg['r']):
                assert is_base64_encoded(msg['r']), "Route must be Base64-encoded"
    strategy: "cesr_native_keri_message_strategy() — generates KERI messages in CESR native format"
    notes: "Spec L5540-5960. Finding: KERI-INV-012."

contracts:
  - port_ref: "port://keri-messaging/inbound/message-parsing"
    preconditions:
      - formal:
          language: python
          expression: |
            lambda field_map: (
                field_map is not None
                and 'v' in field_map.fields
                and 't' in field_map.fields
                and 'd' in field_map.fields
                and list(field_map.fields.keys())[0] == 'v'
            )
        description: "Input must be a non-null field map with v as the first field, and t and d present"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda result: (
                result.ilk in ('icp','rot','ixn','dip','drt','rct','vrc','qry','rpy','pro','bar','exn','xip','rip','bup','upd')
                and result.said == compute_said(result.body)
            )
        description: "Parsed message has a recognized ilk and its SAID verifies against the body"

  - port_ref: "port://keri-messaging/inbound/message-construction"
    preconditions:
      - formal:
          language: python
          expression: |
            lambda request: (
                request.message_type is not None
                and request.sender_aid is not None
                and len(request.sender_aid) > 0
            )
        description: "Construction request must specify a message type and a valid sender AID"
      - formal:
          language: python
          expression: |
            lambda request: (
                request.message_type.value not in ('qry', 'rpy', 'exn', 'xip')
                or (request.route is not None and len(request.route) > 0)
            )
        description: "Routed message types (qry, rpy, exn, xip) require a non-empty route"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda result: (
                result.body is not None
                and result.body.said == compute_said(result.body)
                and list(result.body.fields.keys())[0] == 'v'
            )
        description: "Constructed message has a valid SAID and canonical field ordering"

  - port_ref: "port://keri-messaging/inbound/kram-validate"
    preconditions:
      - formal:
          language: python
          expression: |
            lambda message: (
                message.body.ilk not in ('icp', 'rot', 'ixn', 'dip', 'drt')
                and len(message.signatures) >= 1
            )
        description: "KRAM validation applies only to non-KEL messages and requires at least one signature"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda result: (
                result.authenticated implies (
                    result.signature_verified
                    and result.timeliness_ok
                    and not result.is_replay
                )
            )
        description: "Authenticated result means all three KRAM checks passed"

  - port_ref: "port://keri-messaging/inbound/route-dispatch"
    preconditions:
      - formal:
          language: python
          expression: |
            lambda message: (
                message.body is not None
                and 'r' in message.body.fields
            )
        description: "Message must have been KRAM-validated and must contain a route field"
    postconditions:
      - formal:
          language: python
          expression: "lambda: True  # void output — side effect is dispatch to handler"
        description: "Message dispatched to the handler for its route prefix"

state_machines: []

# KRAM timeliness cache as a composable constraint graph.
validation_constraints:
  - id: "K1_signature_valid"
    constraint: "Message signature must verify against sender's current key state"
    depends_on: []
    on_failure: "reject — invalid signature"

  - id: "K2_freshness_check"
    constraint: "Message datetime must be within the freshness window for the auth type"
    depends_on: ["K1_signature_valid"]
    on_failure: "reject — stale message"

  - id: "K3_monotonic_check"
    constraint: "Message datetime must be >= last seen datetime from this sender AID"
    depends_on: ["K2_freshness_check"]
    on_failure: "reject — out-of-order timestamp (possible replay)"

  - id: "K4_duplicate_check"
    constraint: "Message SAID must not already exist in the timeliness cache for this sender"
    depends_on: ["K3_monotonic_check"]
    on_failure: "ignore — duplicate delivery (idempotent)"

  - id: "K5_accepted"
    constraint: "All checks passed — message accepted for domain dispatch"
    depends_on: ["K4_duplicate_check"]
    on_failure: null
