# types.yaml
domain_ref: "keri-messaging"

types:
  - name: "ExchangeMessage"
    description: "Generic routed message envelope for peer-to-peer communication. Used by IPEX (credential exchange), multisig coordination, endpoint authorization, and any future peer protocol. The route field determines which domain handles the message. v1 and v2 have different field sets — v2 replaces rp/e with ri/x and changes a from array to map."
    variants:
      - name: "v1"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string (v1: KERI10...)"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["exn"]
            description: "Message type — exchange"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "Sender AID"
          - name: "rp"
            type: "string"
            required: true
            description: "Replay protection nonce"
          - name: "p"
            type: "string"
            required: true
            description: "Prior message SAID — empty for first message"
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime — ISO 8601"
          - name: "r"
            type: "string"
            required: true
            description: "Route — determines which domain handles this message"
          - name: "q"
            type: "map"
            required: true
            description: "Query/modifier data"
          - name: "a"
            type: "array"
            required: true
            description: "Payload — domain-specific data (v1: array)"
          - name: "e"
            type: "map"
            required: true
            description: "Embedded messages — nested SADs (v1 only)"
        invariants:
          - "LEGACY — v1 field order. v2 is the normative format."
      - name: "v2"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string (v2: KERI20...)"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["exn"]
            description: "Message type — exchange"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "Sender AID"
          - name: "ri"
            type: "string"
            required: false
            description: "Registry identifier — SAID of the credential registry (v2, replaces rp)"
          - name: "x"
            type: "string"
            required: true
            description: "Exchange transaction identifier — self-referencing SAID for xip, prior xip SAID for subsequent exn in same transaction"
          - name: "p"
            type: "string"
            required: true
            description: "Prior message SAID — empty for first message in thread"
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime — ISO 8601, subject to KRAM timeliness check"
          - name: "r"
            type: "string"
            required: true
            description: "Route — determines which domain handles this message"
          - name: "q"
            type: "map"
            required: true
            description: "Query/modifier data"
          - name: "a"
            type: "map"
            required: true
            description: "Payload — domain-specific data (v2: map, not array)"
        invariants:
          - "Route (r) determines the handling domain — implementations dispatch by route prefix"
          - "Known route prefixes: /ipex/* (credential exchange), /multisig/* (group coordination), /end/role (discovery), /watcher/* (integrity)"
          - "Prior (p) field links to the previous message's SAID — empty string for first message"
          - "x field enables exchange transaction chaining — xip messages self-reference, subsequent exn reference the xip"
          - "v2 is the normative format per keripy serdering.py:467 (Vrsn_2_0 exn FieldDom)"
          - "Subject to KRAM replay protection — dt must be monotonically increasing per sender"
          - "Must be signed by sender's current keys — provides non-repudiable attribution"
        examples:
          - format: "json"
            description: "IPEX apply message"
            value: |
              {"v":"KERI10JSON000175_","t":"exn","d":"EHVK5cO32UQJCkpK9RqRP_ONViK8u3JNXn73nJ8hdmXr","i":"EMl4RhuR_JxpiMd1N8DEJEhTxM3Ovvn9Xya8AN-tiUbl","rp":"","p":"","dt":"2021-06-27T21:26:21.233257+00:00","r":"/ipex/apply","q":{},"a":{"m":"Please give me a credential","s":"EMQWEcCnVRk1hatTNyK3sIykYSrrFvafX3bHQ9Gkk1kC"}}
            notes: "r=/ipex/apply routes to credential-exchange domain. p='' (first message). From keripy test_protocoling.py"
          - format: "json"
            description: "IPEX spurn message"
            value: |
              {"v":"KERI10JSON000125_","t":"exn","d":"EHijfrof83z7JeFR-wJO9Ptgl-PieQHhKC-FbZIDvGvM","i":"EMl4RhuR_JxpiMd1N8DEJEhTxM3Ovvn9Xya8AN-tiUbl","rp":"","p":"EHVK5cO32UQJCkpK9RqRP_ONViK8u3JNXn73nJ8hdmXr","dt":"2021-06-27T21:26:21.233257+00:00","r":"/ipex/spurn","q":{},"a":{"m":"I reject you"},"e":{}}
            notes: "p references the spurned message's SAID. Terminal message. From keripy test_protocoling.py"
    construction_defaults:
      p: ""
      q: "{}"
      e: "{}"
    encoding:
      - format: "json"
        notes: "Standard KERI serialization. Fields in canonical insertion order."

  - name: "QueryMessage"
    description: "Request for information from another controller or service. Routes determine what is being queried."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["qry"]
            description: "Message type — query"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime"
          - name: "r"
            type: "string"
            required: true
            description: "Route — what is being queried"
            constraints:
              enum: ["logs", "ksn", "mbx", "tels", "tsn"]
          - name: "rr"
            type: "string"
            required: true
            description: "Reply route — where to send the response"
          - name: "q"
            type: "map"
            required: true
            description: "Query parameters (prefix, sn, SAID filters)"
        invariants:
          - "Routes logs/ksn/mbx handled by identity domain"
          - "Routes tels/tsn handled by credential-lifecycle domain"
          - "Subject to KRAM replay protection"
        examples:
          - format: "json"
            description: "Query for KEL logs"
            value: |
              {"v":"KERI10JSON0000c9_","t":"qry","d":"EGN68_seecuzXQO15FFGJLVwZCBCPYW-hy29fjWWPQbp","dt":"2021-01-01T00:00:00.000000+00:00","r":"log","rr":"","q":{"i":"DAvCLRr5luWmp7keDvDuLP0kIqcyBYq79b3Dho1QvrjI"}}
            notes: "r='log' queries for KEL events. q.i is the target AID. From keripy test_eventing.py"

  - name: "ReplyMessage"
    description: "Response to a query or unsolicited state notification. Route determines the content type."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["rpy"]
            description: "Message type — reply"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime"
          - name: "r"
            type: "string"
            required: true
            description: "Route — what type of reply this is"
          - name: "a"
            type: "map"
            required: true
            description: "Reply data payload"
        invariants:
          - "Routes /end/role and /loc/scheme handled by discovery domain"
          - "Route /ksn handled by identity/state domain"
          - "Subject to BADA (Best Available Data Accepted) acceptance policy"
          - "Subject to KRAM replay protection"

  - name: "MessageType"
    description: "KERI message ilk — the 3-character type code in the t field of every KERI message."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            constraints:
              enum: ["icp", "rot", "ixn", "dip", "drt", "rct", "vrc", "qry", "rpy", "pro", "bar", "exn", "xip", "rip", "bup", "upd"]
        invariants:
          - "icp/rot/ixn: inception, rotation, interaction (non-delegated)"
          - "dip/drt: delegated inception, delegated rotation"
          - "rct/vrc: non-transferable receipt, transferable receipt"
          - "qry/rpy: query, reply"
          - "pro/bar: probe, bare (credential lifecycle)"
          - "exn: exchange (peer-to-peer routing)"
          - "xip/rip/bup/upd: KERI v2 exchange types"

  - name: "ProtocolVersion"
    description: "KERI protocol version as a major.minor tuple."
    variants:
      - name: "default"
        fields:
          - name: "major"
            type: "integer"
            required: true
            description: "Major version number"
            constraints:
              min: 1
          - name: "minor"
            type: "integer"
            required: true
            description: "Minor version number"
            constraints:
              min: 0
        invariants:
          - "Currently KERI 1.x (v1) and KERI 2.x (v2) are defined"
          - "Version determines message format: v1 uses 17-char version string, v2 uses 19-char"

  - name: "FieldMap"
    description: "Ordered key-value message body — the serialized content of a KERI event or message."
    variants:
      - name: "default"
        fields:
          - name: "fields"
            type: "map"
            required: true
            description: "Ordered key-value pairs (insertion order is significant)"
          - name: "version"
            type: "string"
            required: true
            description: "Version string (v field) — always the first field"
          - name: "ilk"
            type: "string"
            required: true
            description: "Message type (t field)"
          - name: "said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "Self-addressing identifier (d field)"
        invariants:
          - "Field order must be preserved for SAID computation"
          - "version is always the first field in the map"
          - "said is computed over the serialized fields with d replaced by a placeholder"

  - name: "KeyEventMessage"
    description: "The serialized wire-format representation of a Key Event, composed of the event body (KERI Field Map) plus attached signatures, witness receipts, and other CESR-encoded cryptographic qualifications. A Key Event Message is what is transmitted; the Key Event within it is what is validated and stored."
    variants:
      - name: "default"
        invariants:
          - "Contains exactly one Key Event body"
          - "Includes attached signature groups (indexed or non-indexed)"
          - "May include attached receipt groups"
