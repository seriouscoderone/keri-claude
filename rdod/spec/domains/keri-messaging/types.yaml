# types.yaml
domain_ref: "keri-messaging"

types:
  - name: "ExchangeMessage"
    description: "Generic routed message envelope for peer-to-peer communication. Used by IPEX (credential exchange), multisig coordination, endpoint authorization, and any future peer protocol. The route field determines which domain handles the message."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["exn"]
            description: "Message type — exchange"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "Sender AID — the controller initiating this exchange"
          - name: "rp"
            type: "string"
            required: true
            description: "Replay protection — nonce or reference for anti-replay (v1) or x field (v2)"
          - name: "p"
            type: "string"
            required: true
            description: "Prior message SAID — links messages in a conversation thread. Empty for first message."
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime — ISO 8601, subject to KRAM timeliness check"
          - name: "r"
            type: "string"
            required: true
            description: "Route — determines which domain protocol handles this message"
          - name: "q"
            type: "map"
            required: true
            description: "Query/modifier data"
          - name: "a"
            type: "map"
            required: true
            description: "Payload — the domain-specific data for this exchange"
          - name: "e"
            type: "map"
            required: true
            description: "Embedded messages — nested SADs (credentials, events, etc.)"
        invariants:
          - "Route (r) determines the handling domain — implementations dispatch by route prefix"
          - "Known route prefixes: /ipex/* (credential exchange), /multisig/* (group coordination), /end/role (discovery), /watcher/* (integrity)"
          - "Prior (p) field links to the previous message's SAID in a conversation — empty string for first message"
          - "Subject to KRAM replay protection — dt must be monotonically increasing per sender"
          - "Must be signed by sender's current keys — provides non-repudiable attribution"
    construction_defaults:
      p: ""
      q: "{}"
      e: "{}"
    encoding:
      - format: "json"
        notes: "Standard KERI serialization. Fields in canonical insertion order."

  - name: "QueryMessage"
    description: "Request for information from another controller or service. Routes determine what is being queried."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["qry"]
            description: "Message type — query"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime"
          - name: "r"
            type: "string"
            required: true
            description: "Route — what is being queried"
            constraints:
              enum: ["logs", "ksn", "mbx", "tels", "tsn"]
          - name: "rr"
            type: "string"
            required: true
            description: "Reply route — where to send the response"
          - name: "q"
            type: "map"
            required: true
            description: "Query parameters (prefix, sn, SAID filters)"
        invariants:
          - "Routes logs/ksn/mbx handled by identity domain"
          - "Routes tels/tsn handled by credential-lifecycle domain"
          - "Subject to KRAM replay protection"

  - name: "ReplyMessage"
    description: "Response to a query or unsolicited state notification. Route determines the content type."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["rpy"]
            description: "Message type — reply"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime"
          - name: "r"
            type: "string"
            required: true
            description: "Route — what type of reply this is"
          - name: "a"
            type: "map"
            required: true
            description: "Reply data payload"
        invariants:
          - "Routes /end/role and /loc/scheme handled by discovery domain"
          - "Route /ksn handled by identity/state domain"
          - "Subject to BADA (Best Available Data Accepted) acceptance policy"
          - "Subject to KRAM replay protection"
