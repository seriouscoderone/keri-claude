# types.yaml
domain_ref: "keri-messaging"

types:
  - name: "ExchangeMessage"
    description: "Generic routed message envelope for peer-to-peer communication. Used by IPEX (credential exchange), multisig coordination, endpoint authorization, and any future peer protocol. The route field determines which domain handles the message. v1 and v2 have different field sets — v2 replaces rp/e with ri/x and changes a from array to map."
    variants:
      - name: "v1"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string (v1: KERI10...)"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["exn"]
            description: "Message type — exchange"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "Sender AID"
          - name: "rp"
            type: "string"
            required: true
            description: "Replay protection nonce"
          - name: "p"
            type: "string"
            required: true
            description: "Prior message SAID — empty for first message"
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime — ISO 8601"
          - name: "r"
            type: "string"
            required: true
            description: "Route — determines which domain handles this message"
          - name: "q"
            type: "map"
            required: true
            description: "Query/modifier data"
          - name: "a"
            type: "array"
            required: true
            description: "Payload — domain-specific data (v1: array)"
          - name: "e"
            type: "map"
            required: true
            description: "Embedded messages — nested SADs (v1 only)"
        invariants:
          - "LEGACY — v1 field order. v2 is the normative format."
      - name: "v2"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string (v2: KERI20...)"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["exn"]
            description: "Message type — exchange"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "i"
            type: "string"
            required: true
            description: "Sender AID"
          - name: "ri"
            type: "string"
            required: false
            description: "Registry identifier — SAID of the credential registry (v2, replaces rp)"
          - name: "x"
            type: "string"
            required: true
            description: "Exchange transaction identifier — self-referencing SAID for xip, prior xip SAID for subsequent exn in same transaction"
          - name: "p"
            type: "string"
            required: true
            description: "Prior message SAID — empty for first message in thread"
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime — ISO 8601, subject to KRAM timeliness check"
          - name: "r"
            type: "string"
            required: true
            description: "Route — determines which domain handles this message"
          - name: "q"
            type: "map"
            required: true
            description: "Query/modifier data"
          - name: "a"
            type: "map"
            required: true
            description: "Payload — domain-specific data (v2: map, not array)"
        invariants:
          - "Route (r) determines the handling domain — implementations dispatch by route prefix"
          - "Known route prefixes: /ipex/* (credential exchange), /multisig/* (group coordination), /end/role (discovery), /watcher/* (integrity)"
          - "Prior (p) field links to the previous message's SAID — empty string for first message"
          - "x field enables exchange transaction chaining — xip messages self-reference, subsequent exn reference the xip"
          - "v2 is the normative format per keripy serdering.py:467 (Vrsn_2_0 exn FieldDom)"
          - "Subject to KRAM replay protection — dt must be monotonically increasing per sender"
          - "Must be signed by sender's current keys — provides non-repudiable attribution"
        examples:
          - format: "json"
            description: "IPEX apply message"
            value: |
              {"v":"KERI10JSON000175_","t":"exn","d":"EHVK5cO32UQJCkpK9RqRP_ONViK8u3JNXn73nJ8hdmXr","i":"EMl4RhuR_JxpiMd1N8DEJEhTxM3Ovvn9Xya8AN-tiUbl","rp":"","p":"","dt":"2021-06-27T21:26:21.233257+00:00","r":"/ipex/apply","q":{},"a":{"m":"Please give me a credential","s":"EMQWEcCnVRk1hatTNyK3sIykYSrrFvafX3bHQ9Gkk1kC"}}
            notes: "r=/ipex/apply routes to credential-exchange domain. p='' (first message). From keripy test_protocoling.py"
          - format: "json"
            description: "IPEX spurn message"
            value: |
              {"v":"KERI10JSON000125_","t":"exn","d":"EHijfrof83z7JeFR-wJO9Ptgl-PieQHhKC-FbZIDvGvM","i":"EMl4RhuR_JxpiMd1N8DEJEhTxM3Ovvn9Xya8AN-tiUbl","rp":"","p":"EHVK5cO32UQJCkpK9RqRP_ONViK8u3JNXn73nJ8hdmXr","dt":"2021-06-27T21:26:21.233257+00:00","r":"/ipex/spurn","q":{},"a":{"m":"I reject you"},"e":{}}
            notes: "p references the spurned message's SAID. Terminal message. From keripy test_protocoling.py"
    construction_defaults:
      p: ""
      q: "{}"
      e: "{}"
    encoding:
      - format: "json"
        notes: "Standard KERI serialization. Fields in canonical insertion order."

  - name: "XIPMessage"
    description: "Exchange Inception message (xip) — the first message of a v2 exchange transaction. The x field self-references this message's own SAID, establishing the transaction identifier. All subsequent exn messages in the same transaction reference this xip's SAID in their x field."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string (KERI20...)"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["xip"]
            description: "Message type — exchange inception"
          - name: "d"
            type: "string"
            required: true
            description: "SAID of this xip message"
          - name: "i"
            type: "string"
            required: true
            description: "Sender AID"
          - name: "x"
            type: "string"
            required: true
            description: "Exchange transaction identifier — MUST equal this message's own SAID (d field). Self-referencing SAID."
          - name: "p"
            type: "string"
            required: true
            description: "Prior — empty string for xip (no prior message)"
            constraints:
              enum: [""]
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime — ISO 8601, subject to KRAM timeliness"
          - name: "r"
            type: "string"
            required: true
            description: "Route — determines which domain handles this exchange"
          - name: "q"
            type: "map"
            required: true
            description: "Query/modifier data"
          - name: "a"
            type: "map"
            required: true
            description: "Payload — domain-specific data"
        invariants:
          - "x field MUST equal d field (self-referencing SAID) — this is the transaction anchor"
          - "p field MUST be empty — xip has no prior message"
          - "All subsequent exn in this transaction reference x = this xip's d value"
          - "Subject to KRAM replay protection — dt must be within timeliness window"
          - "Must be signed by sender's current keys"
    notes: |
      L4-O6: XIPMessage (exchange inception) was not previously defined. In KERI v2, the first
      message of an exchange transaction is a xip (not exn). The self-referencing x=d invariant
      is the normative way to establish the transaction identifier without a separate UUID.

  - name: "ReceiptMessage"
    description: "Receipt message (rct or vrc) — acknowledges a Key Event. Non-transferable witnesses produce rct; transferable validators produce vrc. The d field references the SAID of the receipted event (inverted — not the SAID of this receipt message)."
    variants:
      - name: "non-transferable"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["rct"]
            description: "Message type — non-transferable receipt"
          - name: "d"
            type: "string"
            required: true
            description: "SAID of the receipted event — this is the event being receipted, NOT this message's SAID"
          - name: "i"
            type: "string"
            required: true
            description: "AID of the controller whose event is being receipted"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number of the receipted event (hex-encoded)"
        invariants:
          - "d field is the SAID of the receipted event (inversion — not this message's SAID)"
          - "Attached CESR group contains witness non-transferable signatures"
          - "Witness AID must be in the controller's witness pool at the event's sn"
      - name: "transferable"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["vrc"]
            description: "Message type — transferable receipt (validator)"
          - name: "d"
            type: "string"
            required: true
            description: "SAID of the receipted event (inverted — not this message's SAID)"
          - name: "i"
            type: "string"
            required: true
            description: "AID of the controller whose event is being receipted"
          - name: "s"
            type: "string"
            required: true
            description: "Sequence number of the receipted event"
          - name: "a"
            type: "map"
            required: true
            description: "Transferable receipt binding — event SAID + validator AID + sn of validator's current event"
        invariants:
          - "d field is the SAID of the receipted event (inversion invariant)"
          - "a.i is the receipting validator's AID"
          - "a.s is the sn of the validator's KEL event that commits to this receipt"
          - "Attached CESR group contains validator transferable signatures"
    notes: |
      L4-O7: ReceiptMessage was not previously defined. The d field inversion is a normative
      KERI behavior: unlike all other KERI messages where d = SAID of the message itself,
      receipt messages set d = SAID of the event being receipted. This enables efficient
      indexing of receipts by the receipted event's identifier.

  - name: "KRAMCacheEntry"
    description: "A replay-protection cache entry for KRAM (KERI Request Authentication Mechanism). Keyed by a dual-key structure: (sender AID, message SAID). Stores the latest accepted message datetime per sender to enforce monotonic datetime ordering."
    variants:
      - name: "default"
        fields:
          - name: "sender_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the message sender — first key dimension"
          - name: "message_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the authenticated message — second key dimension"
          - name: "accepted_at"
            type: "string"
            required: true
            description: "ISO 8601 datetime of the accepted message — used for timeliness comparison"
          - name: "last_sn"
            type: "integer"
            required: false
            description: "Sender's KEL sn at time of acceptance — used for key state staleness check"
        invariants:
          - "Dual-key: (sender_aid, message_said) uniquely identifies an accepted message"
          - "A message is a replay if its (sender_aid, message_said) pair already exists in cache"
          - "Timeliness: accepted_at of new message must be > accepted_at of previous message from same sender"
          - "Cache entries expire after the KRAM timeliness window (implementation-defined, typically 10 seconds)"
          - "Key state change (multi-sig rotation) invalidates prior cache entries for the sender — last_sn tracks this"
        notes: |
          L4-O8: KRAMCacheEntry was not previously defined. The dual-key structure (sender AID,
          message SAID) is the normative KRAM cache design — SAIDs are content-addressed so replay
          detection by SAID is exact. The sender AID dimension enables per-sender datetime ordering.
          L4-O13: KRAM multi-sig key state change — when the sender's KEL rotation changes their
          signing key set, prior cache entries with the old keys are no longer valid for the new
          key state. Implementations should invalidate cache entries when last_sn < current sender sn.

  - name: "MessageConstructionRequest"
    description: "Typed input for the message-construction port — specifies what kind of KERI message to build and its parameters. Replaces the bare MessageType input with a structured request."
    variants:
      - name: "default"
        fields:
          - name: "message_type"
            type: "types://keri-messaging#MessageType"
            required: true
            description: "The type of KERI message to construct"
          - name: "sender_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the sending controller"
          - name: "target_aid"
            type: "types://cesr/primitives#AID"
            required: false
            description: "AID of the target (for directed messages like qry, exn)"
          - name: "route"
            type: "string"
            required: false
            description: "Route for routed messages (qry, rpy, exn) — determines handling domain"
          - name: "payload"
            type: "map"
            required: false
            description: "Message-type-specific payload fields"
          - name: "prior_said"
            type: "types://cesr/primitives#SAID"
            required: false
            description: "SAID of the prior message in thread (for exn, xip chains)"
        invariants:
          - "message_type determines which fields of payload are required"
          - "sender_aid must have valid key state for signing"
          - "route is required for qry, rpy, and exn message types"
    notes: |
      L4-O9: message-construction port previously had input type MessageType (a bare enum value),
      which does not provide enough information to construct a complete message. MessageConstructionRequest
      is the typed replacement.

  - name: "QueryMessage"
    description: "Request for information from another controller or service. Routes determine what is being queried."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["qry"]
            description: "Message type — query"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime"
          - name: "r"
            type: "string"
            required: true
            description: "Route — what is being queried"
            constraints:
              enum: ["log", "ksn", "mbx", "tels", "tsn"]
          - name: "rr"
            type: "string"
            required: true
            description: "Reply route — where to send the response"
          - name: "q"
            type: "map"
            required: true
            description: "Query parameters (prefix, sn, SAID filters)"
        invariants:
          - "Routes log/ksn/mbx handled by identity domain"
          - "Routes tels/tsn handled by credential-lifecycle domain"
          - "Subject to KRAM replay protection"
        examples:
          - format: "json"
            description: "Query for KEL logs"
            value: |
              {"v":"KERI10JSON0000c9_","t":"qry","d":"EGN68_seecuzXQO15FFGJLVwZCBCPYW-hy29fjWWPQbp","dt":"2021-01-01T00:00:00.000000+00:00","r":"log","rr":"","q":{"i":"DAvCLRr5luWmp7keDvDuLP0kIqcyBYq79b3Dho1QvrjI"}}
            notes: "r='log' queries for KEL events (not 'logs'). q.i is the target AID. From keripy test_eventing.py"
        notes: |
          L4-O12: QueryMessage.r route value check. The KERI spec and keripy use 'log' (not 'logs')
          for KEL event queries. The previous enum ['logs', 'ksn', 'mbx', 'tels', 'tsn'] was incorrect.
          Corrected to ['log', 'ksn', 'mbx', 'tels', 'tsn'] per keripy eventing.py QueryDom definition.

  - name: "ReplyMessage"
    description: "Response to a query or unsolicited state notification. Route determines the content type."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["rpy"]
            description: "Message type — reply"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime"
          - name: "r"
            type: "string"
            required: true
            description: "Route — what type of reply this is"
          - name: "a"
            type: "map"
            required: true
            description: "Reply data payload"
        invariants:
          - "Routes /end/role and /loc/scheme handled by discovery domain"
          - "Route /ksn handled by identity/state domain"
          - "Subject to BADA (Best Available Data Accepted) acceptance policy"
          - "Subject to KRAM replay protection"

  - name: "MessageType"
    description: "KERI message ilk — the 3-character type code in the t field of every KERI message."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            constraints:
              enum: ["icp", "rot", "ixn", "dip", "drt", "rct", "vrc", "qry", "rpy", "pro", "bar", "exn", "xip", "rip", "bup", "upd"]
        invariants:
          - "icp/rot/ixn: inception, rotation, interaction (non-delegated)"
          - "dip/drt: delegated inception, delegated rotation"
          - "rct/vrc: non-transferable receipt, transferable receipt"
          - "qry/rpy: query, reply"
          - "pro/bar: probe, bare (credential lifecycle)"
          - "exn: exchange (peer-to-peer routing)"
          - "xip/rip/bup/upd: KERI v2 exchange types"

  - name: "ProtocolVersion"
    description: "KERI protocol version as a major.minor tuple."
    variants:
      - name: "default"
        fields:
          - name: "major"
            type: "integer"
            required: true
            description: "Major version number"
            constraints:
              min: 1
          - name: "minor"
            type: "integer"
            required: true
            description: "Minor version number"
            constraints:
              min: 0
        invariants:
          - "Currently KERI 1.x (v1) and KERI 2.x (v2) are defined"
          - "Version determines message format: v1 uses 17-char version string, v2 uses 19-char"

  - name: "FieldMap"
    description: "Ordered key-value message body — the serialized content of a KERI event or message."
    variants:
      - name: "default"
        fields:
          - name: "fields"
            type: "map"
            required: true
            description: "Ordered key-value pairs (insertion order is significant)"
          - name: "version"
            type: "string"
            required: true
            description: "Version string (v field) — always the first field"
          - name: "ilk"
            type: "string"
            required: true
            description: "Message type (t field)"
          - name: "said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "Self-addressing identifier (d field)"
        invariants:
          - "Field order must be preserved for SAID computation"
          - "version is always the first field in the map"
          - "said is computed over the serialized fields with d replaced by a placeholder"

  - name: "KeyEventMessage"
    description: "The serialized wire-format representation of a Key Event, composed of the event body (KERI Field Map) plus attached signatures, witness receipts, and other CESR-encoded cryptographic qualifications. A Key Event Message is what is transmitted; the Key Event within it is what is validated and stored."
    variants:
      - name: "default"
        fields:
          - name: "body"
            type: "types://keri-messaging#FieldMap"
            required: true
            description: "The key event body as an ordered field map"
          - name: "signatures"
            type: "array[types://cesr/primitives#Signature]"
            required: true
            description: "Attached signature groups (indexed controller signatures)"
            constraints:
              min_length: 1
          - name: "witness_receipts"
            type: "array[types://cesr/primitives#Signature]"
            required: false
            description: "Attached witness receipt signatures (non-transferable)"
          - name: "delegation_seal_couple"
            type: "types://delegation/authorization#DelegationSealSource"
            required: false
            description: "Source seal couple for delegated events (Fixed-Width Ordinal + Digest CESR attachment)"
        invariants:
          - "Contains exactly one Key Event body"
          - "Includes at least one attached signature group (indexed or non-indexed)"
          - "May include attached receipt groups"
          - "May include delegation source seal couple for dip/drt events"
