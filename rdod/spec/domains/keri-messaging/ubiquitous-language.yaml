# ubiquitous-language.yaml
domain_ref: "keri-messaging"

imports: []

terms:
  - term: "Exchange Message (exn)"
    definition: "Generic routed message envelope for peer-to-peer communication between KERI controllers. Any domain can communicate by constructing an exn with a route field and registering a handler for inbound routes via the Exchanger. The exn message type is the standard carrier for IPEX credential exchange, multisig coordination, endpoint authorization, and any future peer protocol."
    invariants:
      - "Route (r) field determines which domain protocol handles the message"
      - "Known route prefixes: /ipex/* (credential exchange), /multisig/* (group coordination), /end/role and /loc/scheme (discovery), /watcher/* (integrity), /ksn (key state), /tsn/* (credential status)"
      - "Every exn is signed by the sender's AID — provides non-repudiable attribution"
      - "Subject to KRAM replay protection before domain dispatch"
      - "Prior (p) field links messages in multi-step conversations"
    examples:
      - "IPEX grant: exn with route=/ipex/grant, payload=credential data, embeds=ACDC+TEL+seal"
      - "Multisig inception: exn with route=/multisig/icp, payload=inception parameters"
      - "Endpoint authorization: exn with route=/end/role, payload=endpoint data"
    related_terms: ["Exchanger", "KRAM"]

  - term: "Exchanger"
    definition: "Generic message router that dispatches inbound exchange (exn) messages to handlers registered by route prefix. Domains register their route handlers at startup. The Exchanger validates message signatures before dispatching to the appropriate handler. Any domain can participate in peer-to-peer communication by registering a route handler."
    invariants:
      - "Routes incoming exn messages to the handler registered for the message's route field"
      - "Validates message signatures before dispatching"
      - "Escrows messages awaiting prerequisites — never silently drops"
      - "Multiple domains can register handlers simultaneously"
    related_terms: ["Exchange Message (exn)", "KRAM"]

  - term: "KRAM"
    synonyms: ["KERI Request Authentication Method", "Replay Attack Protection"]
    definition: "The authentication mechanism for non-KEL KERI messages (exn, qry, rpy). KRAM ensures that every message is signed by the sender's current keys and is fresh — preventing replay attacks. Verification requires checking the sender's signature against their current key state and validating that the message timestamp falls within an acceptable freshness window."
    invariants:
      - "Every non-KEL message MUST include a signature by the sender's current signing keys"
      - "Signature scope covers the entire message body (SAID + content) — not just a header"
      - "Freshness window: message datetime (dt field) MUST be within an acceptable delta of the verifier's current time"
      - "Monotonic timestamps: each message from a given AID MUST have a datetime >= all previously seen datetimes from that AID"
      - "Stale messages (outside freshness window) MUST be rejected — they may be replays"
      - "Duplicate detection: messages with the same SAID from the same sender MUST be idempotently ignored"
      - "KEL messages (icp, rot, ixn, dip, drt) bypass KRAM — they use sequence numbers for ordering instead"
      - "Verification is stateless given (message, sender_key_state, current_time) — no session state"
    examples:
      - "Signify client signs admin API request with KRAM: timestamp + request body signed by controller keys"
      - "KERIA validates inbound exn: check sender AID key state, verify signature, check dt freshness"
      - "Stale replay rejected: message dt is 5 minutes old, freshness window is 2 minutes"
    related_terms: ["Exchange Message (exn)", "Exchanger", "Key State"]

  - term: "KERI Field Map"
    definition: "The ordered key-value structure of a KERI message body. Field maps use short field labels (v, t, d, i, s, etc.) for wire efficiency, but each field represents a specific domain concept. The presence or absence of optional fields signals semantic meaning — for example, the di field signals delegation, the n field signals transferability. Implementations SHOULD provide domain-typed construction interfaces that map human-readable concepts to field labels."
    invariants:
      - "Field order is canonical per message type — deviations invalidate the SAID"
      - "Required fields MUST always be present; optional fields signal semantic variation"
      - "The d field is always a SAID (self-addressing identifier) computed over the field map"
      - "The v field is always first — enables protocol and version detection"
      - "The t field identifies the message type (ilk)"
    related_terms: ["SAID", "Identifier Type Dimensions"]

  - term: "KERI Message Types"
    synonyms: ["Ilks", "Protocol Messages"]
    definition: "The complete set of KERI protocol message types, identified by the 't' (type/ilk) field. Organized into key events, receipts, queries/replies, and exchanges. Each type is dispatched to the appropriate handler by the Message Parser."
    invariants:
      - "Key Events (-> Event Processor): icp (inception), rot (rotation), ixn (interaction), dip (delegated inception), drt (delegated rotation)"
      - "Receipts (-> Witness Agreement): rct (non-transferable receipt), vrc (transferable receipt)"
      - "Queries & Replies (-> query handler): qry (query), rpy (reply), pro (prod/probe), bar (bare reply)"
      - "Exchanges (-> Exchanger): exn (exchange message — carries IPEX, multi-sig coordination, challenge-response), xip (exchange inception — first message in a multi-exchange transaction set, all subsequent exn messages reference the xip SAID)"
      - "TEL Events (normative v2): rip (registry inception), bup (blindable update — issuance or revocation via ts field), upd (non-blindable update — issuance or revocation via ts field)"
      - "TEL Events v1 (LEGACY — do NOT implement for new systems): vcp, vrt, iss, rev, bis, brv. These exist in keripy/keriox but are superseded by the normative ACDC v2 model."
      - "TEL v1→v2 migration mapping: vcp→rip, iss→upd(ts=issued), bis→bup(ts=issued), rev→upd(ts=revoked), brv→bup(ts=revoked), vrt→(no equivalent — registry config is immutable in v2)"
      - "ACDC Types (-> ACDC Processor): acm (ACDC field map — default labeled message type), act (ACDC fixed field with attribute section — CESR native), acg (ACDC fixed field with aggregate section — CESR native), ace (ACDC with extra fields — experimental), sch (schema)"
      - "The ilk field determines which processing pipeline handles the message"
    examples:
      - "t='icp' -> Kevery.processEvent()"
      - "t='rct' -> Kevery.processReceipt()"
      - "t='exn' -> Exchanger.processEvent() (routes by inner 'r' field to IPEX, multisig, etc.)"
      - "t='rip' -> Tevery.processEvent(), t='bup' -> Tevery.processEvent(), t='upd' -> Tevery.processEvent()"
    related_terms: ["Message Parser", "Event Processor", "Key Event", "Witness", "IPEX"]

  - term: "Domain Event Bus"
    synonyms: ["Notification Bus", "Internal Event Coordination"]
    definition: "The internal counterpart to external messaging. While exn/qry/rpy carry messages between services over the network, the Domain Event Bus coordinates reactions between domains within a single deployment. When a domain accepts a significant state change (e.g., key event accepted, credential issued, duplicity detected), it publishes a domain event. Other domains that need to react — collecting witness receipts, reprocessing escrows, triggering queries — subscribe to relevant events."
    invariants:
      - "Every domain's events: section defines what domain events it publishes"
      - "Domain events are the trigger mechanism for cross-domain protocol steps"
      - "The bus is an abstraction — implementations choose the mechanism (cue queues, observer pattern, channels, event emitters)"
      - "Events MUST be delivered reliably within a processing cycle — no silent drops"
      - "A domain event carries: event kind, source domain, payload (event data), and context"
    examples:
      - "identity publishes KeyEventAccepted → accountability reacts by collecting witness receipts"
      - "credential-lifecycle publishes CredentialIssued → credential-exchange can now grant it"
      - "integrity publishes DuplicityDetected → validators are alerted, DEL is updated"
    related_terms: ["Exchange Message (exn)", "Exchanger"]

  - term: "External Messaging"
    definition: "Messages that travel over the network between services or controllers — exn, qry, rpy. These are CESR-encoded, signed by the sender's AID, subject to KRAM replay protection, and routed by the Exchanger. External messaging is the wire protocol."
    invariants:
      - "Always CESR-encoded"
      - "Always signed by sender's current keys"
      - "Subject to KRAM timeliness check"
      - "Dispatched by route (exn) or route+type (qry, rpy)"
    related_terms: ["Exchange Message (exn)", "KRAM", "Domain Event Bus"]

  - term: "Internal Domain Events"
    definition: "Events published within a deployment when a domain completes a significant operation. Unlike external messages, these do not travel over the network, are not CESR-encoded, and are not signed. They trigger cross-domain reactions within the same process or service boundary."
    invariants:
      - "Do not leave the deployment boundary"
      - "Not CESR-encoded — format is implementation-specific"
      - "Not signed — trust is implicit within a deployment"
      - "Common event kinds: KeyEventAccepted, ReceiptCollected, EscrowResolved, DuplicityDetected, CredentialIssued, OOBIResolved"
    related_terms: ["Domain Event Bus", "External Messaging"]

  - term: "Message Dispatch Pipeline"
    definition: "The sequence of checks applied to every inbound KERI message before domain-specific processing. Deserialization → version validation → SAID verification → ilk classification → domain dispatch."
    invariants:
      - "Every message passes through the same pipeline regardless of ilk"
      - "KRAM replay protection is applied to non-KEL messages (qry, rpy, exn) after deserialization"
      - "KEL messages (icp, rot, ixn, dip, drt) bypass KRAM — they have built-in ordering via sequence numbers"
    related_terms: ["KERI Message Types", "KRAM", "KERI Field Map"]

events: []

