# domain.yaml
template_version: "2.0"
id: "keri-messaging"
name: "KERI Messaging"
description: >
  Peer domain providing the cross-cutting messaging primitives used by every
  domain that communicates over the KERI protocol. Defines the exchange message
  envelope (exn), query/reply message types (qry/rpy), the Exchanger routing
  pattern, KRAM replay protection, and KERI field map conventions.
version: "0.1.0"
tier: "domain"

source_material:
  - type: document
    reference: "keri-specification.md — sections: Exchange Message, Query Message, Reply Message, KRAM"
  - type: implementation
    reference: "keripy — src/keri/core/eventing.py (exchange, query, reply), src/keri/core/kraming.py (Kramer), src/keri/peer/exchanging.py (Exchanger)"

published_language:
  - term: "Exchange Message (exn)"
    description: "Generic routed message envelope for peer-to-peer communication"
  - term: "Exchanger"
    description: "Generic message router dispatching exn messages by route prefix"
  - term: "KRAM"
    description: "Replay protection mechanism for non-KEL messages"
  - term: "Query Message (qry)"
    description: "Request for information from another controller or service"
  - term: "Reply Message (rpy)"
    description: "Response to a query or unsolicited state notification"
  - term: "KERI Field Map"
    description: "Ordered key-value message structure with short field labels"
  - term: "Domain Event Bus"
    description: "Internal coordination between domains within a deployment — the internal counterpart to external messaging"

domain_clients: []
subdomains: []

kernels: []

adjacents:
  - ref: "domain://cesr"
    pattern: "conformist"
    relationship: "All KERI protocol messages are CESR-encoded — CESR types used natively"
externals: []

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    This kernel provides the messaging primitives that all communicating domains
    adopt natively. In keripy: eventing.py (exchange, query, reply functions),
    kraming.py (Kramer class), exchanging.py (Exchanger). Every domain that sends
    or receives exn/qry/rpy messages depends on this kernel.

issues: []
tags: ["messaging", "exn", "qry", "rpy", "kram"]
