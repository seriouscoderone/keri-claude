# errors.yaml
domain_ref: "keri-messaging"

errors:
  - name: "ProtocolVersionMismatchError"
    description: "Message version string indicates an unsupported protocol version"
    cause: "The v field's protocol version (Mmm segment) does not match any version supported by this implementation"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "received_version"
        type: "string"
        description: "The version string from the message"
      - field: "supported_versions"
        type: "array[string]"
        description: "List of protocol versions this implementation supports"
    related_port: "port://keri-messaging/inbound/message-parsing"

  - name: "UnsupportedEventTypeError"
    description: "Message type (ilk) is not recognized by the KERI protocol"
    cause: "The t field contains an ilk that is not in the set of known KERI message types (icp, rot, ixn, dip, drt, rct, qry, rpy, exn, xip, pro, bar)"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "ilk"
        type: "string"
        description: "The unrecognized message type"
      - field: "known_ilks"
        type: "array[string]"
        description: "List of recognized ilks"
    related_port: "port://keri-messaging/inbound/message-parsing"

  - name: "InvalidPrefixError"
    description: "AID prefix in the message is malformed or uses an unsupported CESR code"
    cause: "The i field does not parse as a valid CESR-qualified identifier prefix"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "prefix"
        type: "string"
        description: "The invalid prefix value"
      - field: "reason"
        type: "string"
        description: "Why it's invalid (unsupported code, wrong length, not Base64url)"
    related_port: "port://keri-messaging/inbound/message-parsing"

  - name: "SAIDVerificationError"
    description: "Message SAID (d field) does not match the computed digest of the message body"
    cause: "The d field value does not equal the SAID computed over the message with d as placeholder — the message has been tampered with or incorrectly constructed"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "claimed_said"
        type: "string"
        description: "The d field value in the message"
      - field: "computed_said"
        type: "string"
        description: "The SAID computed from the message body"
    related_port: "port://keri-messaging/inbound/message-parsing"

  - name: "FieldOrderingError"
    description: "Message fields are not in canonical insertion order"
    cause: "The serialized field map has fields in an order that does not match the canonical order defined for this message type — SAID computation would produce a different result"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "ilk"
        type: "string"
        description: "The message type"
      - field: "expected_order"
        type: "array[string]"
        description: "The canonical field order for this ilk"
      - field: "received_order"
        type: "array[string]"
        description: "The actual field order received"
    related_port: "port://keri-messaging/inbound/message-parsing"

  - name: "InvalidFieldOrderError"
    description: "Message construction failed due to invalid field ordering"
    cause: "The MessageConstructionRequest produced fields in an order that violates the canonical ordering for the requested message type"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "message_type"
        type: "string"
        description: "The message type being constructed"
      - field: "canonical_order"
        type: "array[string]"
        description: "The required canonical field order"
    related_port: "port://keri-messaging/inbound/message-construction"

  - name: "MissingRequiredFieldError"
    description: "Message construction failed because a required field is absent"
    cause: "The MessageConstructionRequest is missing a field required for the requested message type"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "message_type"
        type: "string"
        description: "The message type being constructed"
      - field: "missing_field"
        type: "string"
        description: "The name of the missing required field"
    related_port: "port://keri-messaging/inbound/message-construction"

  - name: "KRAMSignatureError"
    description: "KRAM validation failed — message signature does not verify"
    cause: "The attached signature does not verify against the sender's current key state"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "sender_aid"
        type: "string"
        description: "AID of the message sender"
      - field: "message_said"
        type: "string"
        description: "SAID of the message that failed signature verification"
    related_port: "port://keri-messaging/inbound/kram-validate"

  - name: "KRAMTimelinessError"
    description: "KRAM validation failed — message datetime outside timeliness window"
    cause: "The message dt field is more than the configured timeliness window (default: 10 seconds) from the current time"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "message_datetime"
        type: "string"
        description: "The dt field of the rejected message"
      - field: "window_seconds"
        type: "integer"
        description: "Configured timeliness window in seconds"
    related_port: "port://keri-messaging/inbound/kram-validate"

  - name: "KRAMReplayError"
    description: "KRAM validation failed — message SAID already accepted (replay attack detected)"
    cause: "The (sender_aid, message_said) pair already exists in the KRAM cache — this message was already processed"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "sender_aid"
        type: "string"
        description: "AID of the message sender"
      - field: "message_said"
        type: "string"
        description: "SAID of the replayed message"
    related_port: "port://keri-messaging/inbound/kram-validate"

  - name: "KRAMKeyStateError"
    description: "KRAM validation failed — sender key state unavailable or stale"
    cause: "The sender's current key state cannot be retrieved from the identity domain, or the sender has rotated since the message was signed"
    recovery: "escrow"
    severity: "transient"
    context:
      - field: "sender_aid"
        type: "string"
        description: "AID whose key state is unavailable"
    related_port: "port://keri-messaging/inbound/kram-validate"

  - name: "UnknownRouteError"
    description: "Message route does not match any registered handler"
    cause: "The message's r field (route) does not match any known route prefix in the route dispatch table"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "route"
        type: "string"
        description: "The unrecognized route"
      - field: "message_said"
        type: "string"
        description: "SAID of the unroutable message"
    related_port: "port://keri-messaging/inbound/route-dispatch"

  - name: "MissingRouteHandlerError"
    description: "Route is known but no handler is configured for it in this deployment"
    cause: "The route prefix is recognized but the handler for this domain is not registered — configuration or startup error"
    recovery: "abort"
    severity: "recoverable"
    context:
      - field: "route"
        type: "string"
        description: "The route with missing handler"
    related_port: "port://keri-messaging/inbound/route-dispatch"
