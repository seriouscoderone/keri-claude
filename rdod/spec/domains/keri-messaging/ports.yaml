# ports.yaml
domain_ref: "keri-messaging"

ports:
  - id: "port://keri-messaging/inbound/message-parsing"
    type: inbound
    name: "Message Parsing"
    contract: "parse(raw_bytes) -> (MessageType, FieldMap, Attachments); validate_version(version_string) -> ProtocolVersion; validate_said(field_map) -> bool"
    protocol: "method-call"
    refs: []

  - id: "port://keri-messaging/inbound/message-construction"
    type: inbound
    name: "Message Construction"
    contract: "exchange(route, payload, sender, embeds?) -> ExchangeMessage; query(route, query_params) -> QueryMessage; reply(route, data) -> ReplyMessage"
    protocol: "method-call"
    refs: []
