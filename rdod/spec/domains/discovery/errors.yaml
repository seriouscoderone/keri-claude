# errors.yaml
domain_ref: "discovery"

# Error catalog for the Discovery domain.
# Maps to exception classes in keripy/src/keri/kering.py and raise sites in
# keripy/src/keri/app/oobiing.py (Oobiery, OobiDoer) and
# keripy/src/keri/core/routing.py (Router.processReply).
#
# Severity levels:
#   transient  — condition may self-resolve (escrow and retry)
#   recoverable — requires operator or protocol-level action
#   fatal      — unrecoverable; resolution is permanently rejected

errors:
  - name: "ValidationError"
    description: "OOBI reply message failed structural validation"
    cause: "The rpy message has an unsupported route, is missing required attributes (cid, role, eid), or contains an invalid URL scheme"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "oobi_url"
        type: "string"
        description: "The OOBI URL that produced the invalid reply"
      - field: "route"
        type: "string"
        description: "The reply route (/end/role, /loc/scheme, /ksn)"
      - field: "reason"
        type: "string"
        description: "Specific validation failure (unsupported route, missing element, invalid url scheme)"
    related_port: "port://discovery/inbound/discovery"

  - name: "UnverifiedReplyError"
    description: "OOBI introduction reply could not be cryptographically verified"
    cause: "The rpy message signatures do not verify against the signer's key state — the introduction is untrusted"
    recovery: "escrow"
    recovery_target: "RPE"
    severity: "transient"
    context:
      - field: "oobi_url"
        type: "string"
        description: "The OOBI URL that produced the unverified reply"
      - field: "signer_aid"
        type: "string"
        description: "The AID of the reply signer (if parseable)"
      - field: "reply_said"
        type: "string"
        description: "The SAID of the unverified reply message"
    related_port: "port://discovery/inbound/discovery"

  - name: "ConfigurationError"
    description: "OOBI resolution infrastructure is not configured to handle this type"
    cause: "The Oobiery instance was not configured to handle rpy introductions — missing introduction handler configuration"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "oobi_url"
        type: "string"
        description: "The OOBI URL that triggered the configuration error"
      - field: "reason"
        type: "string"
        description: "Configuration limitation description"
    related_port: "port://discovery/inbound/discovery"

  - name: "StaleReplyError"
    description: "Reply data rejected by Best Available Data Accepted (BADA) policy"
    cause: "The rpy message's datetime or sequence number is not newer than the currently accepted data for this route — BADA RUN logic rejects stale updates"
    recovery: "abort"
    severity: "recoverable"
    context:
      - field: "route"
        type: "string"
        description: "The reply route (/end/role, /loc/scheme, /ksn)"
      - field: "signer_aid"
        type: "string"
        description: "The AID of the reply signer"
      - field: "current_datetime"
        type: "string"
        description: "Datetime of the currently accepted data"
      - field: "received_datetime"
        type: "string"
        description: "Datetime of the rejected reply"
    related_port: "port://discovery/inbound/discovery"

  - name: "OOBIResolutionTimeoutError"
    description: "OOBI URL could not be resolved within the retry window"
    cause: "The OOBI endpoint is unreachable, the remote service returned invalid data, or the returned KEL fails validation after multiple retry attempts"
    recovery: "retry"
    severity: "transient"
    context:
      - field: "oobi_url"
        type: "string"
        description: "The OOBI URL that failed to resolve"
      - field: "reason"
        type: "string"
        description: "Last failure reason (connection timeout, invalid KEL, signature mismatch)"
    related_port: "port://discovery/outbound/url-resolution"

  - name: "EndRoleValidationError"
    description: "End-role authorization reply has missing or invalid attributes"
    cause: "The /end/role rpy message is missing required fields (cid, role, eid) or the AID/endpoint values are malformed"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "aid"
        type: "string"
        description: "The AID whose endpoint was being authorized"
      - field: "role"
        type: "string"
        description: "The role being authorized (witness, watcher, agent, etc.)"
      - field: "missing_field"
        type: "string"
        description: "The specific field that was missing or invalid"
    related_port: "port://discovery/inbound/discovery"

  - name: "MissingRouteHandlerError"
    description: "No handler registered for the reply route"
    cause: "The rpy message route does not match any registered resource handler in the Router"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "route"
        type: "string"
        description: "The unhandled reply route"
    related_port: "port://discovery/inbound/discovery"

  - name: "StaleKSNError"
    description: "Key State Notification rejected by BADA monotonic-sn policy"
    cause: "The KSN's sn is <= the currently stored sn for the AID — BADA requires sn to be monotonically increasing"
    recovery: "abort"
    severity: "recoverable"
    context:
      - field: "aid"
        type: "string"
        description: "AID whose KSN was rejected"
      - field: "received_sn"
        type: "integer"
        description: "sn of the rejected KSN"
      - field: "current_sn"
        type: "integer"
        description: "Currently accepted sn for this AID"
    related_port: "port://discovery/inbound/accept-ksn"

  - name: "InvalidKSNSignatureError"
    description: "Key State Notification signature verification failed"
    cause: "The KSN rpy message signature does not verify against the source AID's current keys"
    recovery: "escrow"
    recovery_target: "RPE"
    severity: "transient"
    context:
      - field: "aid"
        type: "string"
        description: "AID whose KSN failed verification"
      - field: "source_aid"
        type: "string"
        description: "AID of the watcher or witness that provided the KSN"
    related_port: "port://discovery/inbound/accept-ksn"

  - name: "KELNotFoundError"
    description: "KEL for the required AID is not available when verifying endpoint authorization"
    cause: "The identity domain does not have the KEL for the controller AID — BADA signature verification cannot proceed"
    recovery: "escrow"
    recovery_target: "RPE"
    severity: "transient"
    context:
      - field: "aid"
        type: "string"
        description: "AID whose KEL is missing"
    related_port: "port://discovery/outbound/identity-state"

  - name: "KeyStateUnavailableError"
    description: "Key state for the required AID is not available"
    cause: "Identity domain cannot provide current key state for the AID — key state needed for BADA reply verification"
    recovery: "escrow"
    recovery_target: "RPE"
    severity: "transient"
    context:
      - field: "aid"
        type: "string"
        description: "AID whose key state is unavailable"
    related_port: "port://discovery/outbound/identity-state"

  - name: "ReResolutionTimeoutError"
    description: "Re-resolution of a previously resolved OOBI URL timed out"
    cause: "The OOBI endpoint that previously resolved is now unreachable within the retry window"
    recovery: "retry"
    severity: "transient"
    context:
      - field: "oobi_url"
        type: "string"
        description: "The OOBI URL that failed to re-resolve"
      - field: "reason"
        type: "string"
        description: "Last failure reason"
    related_port: "port://discovery/inbound/re-resolve"

  - name: "StaleReReplyError"
    description: "Re-resolution reply rejected by BADA — endpoint data is not newer than cached"
    cause: "The fresh reply messages returned during re-resolution are not newer (by datetime) than the currently cached endpoint data"
    recovery: "abort"
    severity: "recoverable"
    context:
      - field: "route"
        type: "string"
        description: "The reply route (/end/role, /loc/scheme)"
      - field: "cached_datetime"
        type: "string"
        description: "Datetime of the currently cached data"
      - field: "received_datetime"
        type: "string"
        description: "Datetime of the fresh reply"
    related_port: "port://discovery/inbound/re-resolve"

  - name: "ReResolutionValidationError"
    description: "Re-resolution reply failed structural validation"
    cause: "The fresh reply messages from the OOBI endpoint are malformed or missing required fields"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "oobi_url"
        type: "string"
        description: "The OOBI URL being re-resolved"
      - field: "reason"
        type: "string"
        description: "Validation failure reason"
    related_port: "port://discovery/inbound/re-resolve"
