domain_ref: "discovery"

protocols:
  - name: "OOBIResolution"
    description: "Resolve an Out-of-Band Introduction URL to establish key state for a remote identifier. Bootstraps trust by fetching and validating a remote AID's KEL."
    participants:
      - domain: "domain://discovery"
        role: "Resolves the OOBI URL and processes reply messages"
      - domain: "domain://identity/establishment"
        role: "Validates the fetched KEL events"
      - domain: "domain://identity/state"
        role: "Stores the resulting key state"
      - domain: "domain://accountability/receipting"
        role: "Validates witness receipts included in the KEL replay"
    trigger: "User or system provides an OOBI URL for a remote identifier"
    steps:
      - seq: 1
        domain: "domain://discovery"
        action: "fetch_oobi"
        port: "port://discovery/inbound/discovery"
        input:
          description: "OOBI URL (e.g., http://witness.example.com/oobi/{aid}/{role}/{eid})"
          types:
            - ref: "types://discovery#OOBI/role-based"
              fields: ["url", "aid", "role"]
        output:
          description: "KEL replay stream + end-role reply messages"
        preconditions:
          - "verification://discovery#OOBI"
        on_failure:
          - error: "OOBIResolutionError"
            ref: "errors://discovery#OOBIResolutionTimeoutError"
            action: "retry"
            compensation: "Retry with exponential backoff up to 3 attempts"
      - seq: 2
        domain: "domain://identity/establishment"
        action: "validate_kel_replay"
        port: "port://identity/establishment/inbound/validate-event"
        input:
          description: "Stream of KEL events from the OOBI response"
        output:
          description: "Each event validated and accepted to local database"
        depends_on: [1]
        preconditions:
          - "verification://identity/establishment#Event Validation Pipeline"
        on_failure:
          - error: "ValidationError"
            ref: "errors://identity/establishment#ValidationError"
            action: "abort"
            compensation: "Reject entire OOBI — do not partially accept a KEL"
      - seq: 3
        domain: "domain://accountability/receipting"
        action: "validate_witness_receipts"
        port: "port://accountability/receipting/inbound/receipt-lifecycle"
        input:
          description: "Witness receipts included in the replay"
        output:
          description: "Receipts verified — events are fully witnessed"
        depends_on: [2]
        preconditions:
          - "verification://accountability/receipting#Receipt"
      - seq: 4
        domain: "domain://identity/state"
        action: "establish_key_state"
        port: "port://identity/state/inbound/state-tracking"
        input:
          description: "Validated KEL events"
        output:
          description: "Remote AID's key state available locally"
          type: "types://identity#KeyState"
        depends_on: [3]
      - seq: 5
        domain: "domain://discovery"
        action: "process_endpoint_replies"
        port: "port://discovery/inbound/discovery"
        input:
          description: "End-role reply messages from OOBI response"
          types:
            - ref: "types://discovery#EndRole"
              fields: ["cid", "role", "eid"]
        output:
          description: "Remote AID's service endpoints stored locally (witness URLs, agent URLs, etc.)"
          type: "types://discovery#LocationScheme"
        depends_on: [4]
        preconditions:
          - "verification://discovery#BADA"
        on_failure:
          - error: "BADARejectError"
            ref: "errors://discovery#StaleReplyError"
            action: "abort"
            compensation: "Endpoint data rejected as stale — key state still valid"
    timeout: "30s for HTTP fetch, then standard event processing timeouts"
    terminal_states:
      success: "Remote AID's key state and service endpoints available locally — can now communicate"
      failure: "OOBI unresolvable or KEL invalid — remote AID not trusted"

  - name: "EndpointDiscoveryRegistration"
    description: "Publish a service endpoint so others can discover it. The controller signs reply messages declaring which AIDs serve which roles at which URLs — making the endpoints discoverable and verifiable via OOBI resolution."
    participants:
      - domain: "domain://identity/anchoring"
        role: "Controller signs the endpoint declaration (end-role reply) using their current keys"
      - domain: "domain://discovery"
        role: "Processes the signed replies, applies BADA acceptance policy, stores the endpoint mapping for OOBI resolution"
      - domain: "domain://identity/state"
        role: "Provides the controller's current key state for reply signature verification"
    trigger: "Controller wants to declare a service endpoint for their AID"
    steps:
      - seq: 1
        domain: "domain://identity/anchoring"
        action: "construct_endpoint_seal"
        port: "port://identity/anchoring/inbound/data-anchoring"
        input:
          description: "AID, role (witness/agent/watcher/etc.), endpoint URL, endpoint AID"
          types:
            - ref: "types://discovery#EndRole"
              fields: ["cid", "role", "eid"]
        output:
          description: "Interaction event with endpoint authorization seal"
          type: "types://identity#InteractionEvent"
        preconditions:
          - "verification://identity/anchoring#Seal"
      - seq: 2
        domain: "domain://discovery"
        action: "construct_end_role_reply"
        port: "port://discovery/inbound/discovery"
        input:
          description: "Signed reply message (rpy) with route=/end/role containing endpoint data"
          types:
            - ref: "types://discovery#EndRole"
        output:
          description: "Reply message ready for dissemination"
        depends_on: [1]
        preconditions:
          - "verification://discovery#Endpoint Authorization"
      - seq: 3
        domain: "domain://identity/state"
        action: "verify_reply_signature"
        port: "port://identity/state/inbound/state-query"
        input:
          description: "Reply message + controller's current key state"
        output:
          description: "Signature verified — controller authorized this endpoint"
        depends_on: [2]
        on_failure:
          - error: "EndRoleAuthorizationError"
            ref: "errors://discovery#EndRoleValidationError"
            action: "abort"
            compensation: "Reply rejected — endpoint not stored"
      - seq: 4
        domain: "domain://discovery"
        action: "store_endpoint"
        port: "port://discovery/inbound/discovery"
        input:
          description: "Verified reply with endpoint data"
          types:
            - ref: "types://discovery#LocationScheme"
              fields: ["eid", "scheme", "url"]
        output:
          description: "Endpoint mapping stored — discoverable via OOBI"
          type: "types://discovery#LocationScheme"
        depends_on: [3]
        preconditions:
          - "verification://discovery#BADA"
        on_failure:
          - error: "BADARejectError"
            ref: "errors://discovery#StaleReplyError"
            action: "abort"
            compensation: "Reply is stale — a newer endpoint already exists"
    timeout: "30s"
    terminal_states:
      success: "Endpoint authorized and discoverable via OOBI for the specified AID/role"
      failure: "Authorization rejected — endpoint not stored"
