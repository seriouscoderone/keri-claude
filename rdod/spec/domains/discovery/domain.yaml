# domain.yaml
template_version: "2.0"
id: "discovery"
name: "Discovery"
description: >
  How you find others — bootstrap discovery for KERI identifiers via Out-of-Band
  Introductions (OOBIs) that resolve to service endpoints. OOBIs provide URLs that
  resolve to service endpoints for an AID, enabling initial contact without prior
  KEL access. BADA (Best Available Data Accepted) policy governs endpoint authorization.
version: "0.1.0"
tier: "domain"

source_material:
  - type: document
    reference: "keri-specification.md — OOBI and BADA sections"
  - type: document
    reference: "keridoc-llms-full.md — OOBI documentation"

domain_clients:
  - ref: "domain://identity"
    relationship: "KERI uses OOBIs to bootstrap identifier discovery and resolve endpoints"
    via_port: "port://discovery/inbound/discovery"

subdomains: []

kernels: []

adjacents:
  - ref: "domain://cesr"
    pattern: "conformist"
    relationship: "CESR primitives (AID, SAID, Identifier Prefix) adopted natively for OOBI resolution and endpoint authorization"
  - ref: "domain://keri-messaging"
    pattern: "conformist"
    relationship: "KERI messaging primitives (exn, qry, rpy) adopted natively"
  - ref: "domain://identity"
    relationship: "Partnership — OOBIs resolve to KERI endpoints; BADA authorizations are anchored in KELs"
    pattern: "Partnership"
    is_cross_cutting: false

externals:
  - name: "URL Resolution"
    abstraction: "Adapter"
    ref: "port://discovery/outbound/url-resolution"
    implementation_notes: "HTTP GET to OOBI URLs to retrieve endpoint data and KEL bootstraps"

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: "Typically implemented as a module within the KERI agent, not a standalone service.\n\nOOBI Endpoint Independence: An OOBI endpoint can be served by any HTTP service with KEL data — witnesses, watchers, agents, or standalone services. The minimum requirement is read access to an identifier repository. No signing keys or infrastructure role required. In keripy, end/ending.py:OOBIEnd only needs a Habery instance. This enables standalone OOBI services, percolation caches, and CDN-like deployments."

issues: []

tags: ["discovery", "bootstrap", "endpoints"]
