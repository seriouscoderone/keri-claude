domain_ref: "discovery"

types:
  - name: "OOBI"
    description: "Out-of-Band Introduction — a URL that bootstraps trust by pairing a network location with an identifier (AID or SAID). An OOBI is untrusted by design — the data it returns must always be cryptographically verified by the resolver. Any service with KEL data can serve OOBIs; resolution is purely client-side."
    variants:
      - name: "role-based"
        fields:
          - name: "url"
            type: "string"
            required: true
            description: "HTTP(S) URL to the OOBI endpoint"
            constraints:
              pattern: "^https?://.+/oobi/.+"
          - name: "cid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Controller AID — the identifier being introduced"
          - name: "role"
            type: "string"
            required: true
            description: "The role of the endpoint provider"
            constraints:
              enum: ["witness", "watcher", "agent", "controller", "mailbox"]
          - name: "eid"
            type: "types://cesr/primitives#AID"
            required: false
            description: "Endpoint AID — the specific provider's identifier (optional, narrows to one provider)"
        invariants:
          - "URL pattern: /oobi/{cid}/{role} or /oobi/{cid}/{role}/{eid}"
          - "Returns signed reply messages (end-role + loc-scheme) plus KEL replay for the cid"
          - "If eid is specified, only returns data for that specific provider"
          - "keripy regex: OOBI_RE = /oobi/(?P<cid>[^/]+)/(?P<role>[^/]+)(?:/(?P<eid>[^/]+))?"
      - name: "data"
        fields:
          - name: "url"
            type: "string"
            required: true
            description: "HTTP(S) URL to the data endpoint"
          - name: "said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the content-addressed data (schema, credential, etc.)"
        invariants:
          - "URL pattern: /oobi/{said}"
          - "Returns the content identified by the SAID (e.g., JSON Schema for ACDC)"
          - "Verification: compute SAID of returned content, compare to the requested SAID"
          - "Content is immutable — SAIDs are content-addressed, so the data never changes"
          - "keripy regex: DOOBI_RE = /oobi/(?P<said>[^/]+)"
      - name: "well-known"
        fields:
          - name: "url"
            type: "string"
            required: true
            description: "Well-known URL following RFC 8615"
            constraints:
              pattern: "^https?://.+/.well-known/keri/oobi/.+"
          - name: "cid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Controller AID embedded in the well-known path"
        invariants:
          - "URL pattern: /.well-known/keri/oobi/{cid}"
          - "Follows RFC 8615 well-known URI convention"
          - "May return a redirect to the actual OOBI endpoint or serve KEL directly"
          - "keripy regex: WOOBI_RE = /.well-known/keri/oobi/(?P<cid>[^/]+)"
      - name: "blind"
        fields:
          - name: "url"
            type: "string"
            required: true
            description: "Bare OOBI URL with no identifier"
            constraints:
              pattern: "^https?://.+/oobi$"
          - name: "name"
            type: "string"
            required: false
            description: "Optional query parameter hint for the endpoint's alias"
        invariants:
          - "URL pattern: /oobi (no AID, no role)"
          - "Returns the service's own AID as a self-introduction"
          - "Used for bootstrapping — when you know a URL but not what AID it serves"
          - "If the service has a default AID configured, returns that AID's KEL"
          - "If no default AID, returns HTTP 404"
          - "Optional ?name=X query parameter provides a human-friendly alias hint"
    encoding:
      - format: "url"
        notes: "OOBIs are primarily exchanged as URLs — in QR codes, messages, emails, or any text channel. The URL IS the OOBI."

  - name: "EndRole"
    description: "An authorized endpoint for an AID — declares that a specific service (witness, watcher, agent) serves this identifier at a given URL."
    variants:
      - name: "default"
        fields:
          - name: "cid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Controller AID — who authorized this endpoint"
          - name: "role"
            type: "string"
            required: true
            description: "Service role"
            constraints:
              enum: ["witness", "watcher", "agent", "controller", "mailbox"]
          - name: "eid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Endpoint AID — the service's identifier"
        invariants:
          - "Authorization via signed reply message (route=/end/role/add)"
          - "Revocation via signed reply message (route=/end/role/cut)"
          - "Subject to BADA acceptance policy — newer datetime replaces older"

  - name: "LocationScheme"
    description: "A physical network endpoint for a service — maps an AID + scheme to a URL."
    variants:
      - name: "default"
        fields:
          - name: "eid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Service endpoint AID"
          - name: "scheme"
            type: "string"
            required: true
            description: "URL scheme"
            constraints:
              enum: ["http", "https", "tcp", "ws", "wss"]
          - name: "url"
            type: "string"
            required: true
            description: "Full URL for this endpoint"
        invariants:
          - "Authorization via signed reply message (route=/loc/scheme)"
          - "Subject to BADA acceptance policy"
