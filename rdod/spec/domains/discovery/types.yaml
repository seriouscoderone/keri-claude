domain_ref: "discovery"

types:
  - name: "OOBI"
    description: "Out-of-Band Introduction — a URL that bootstraps trust by pairing a network location with an identifier (AID or SAID). An OOBI is untrusted by design — the data it returns must always be cryptographically verified by the resolver. Any service with KEL data can serve OOBIs; resolution is purely client-side."
    variants:
      - name: "role-based"
        fields:
          - name: "url"
            type: "string"
            required: true
            description: "HTTP(S) URL to the OOBI endpoint"
            constraints:
              pattern: "^https?://.+/oobi/.+"
          - name: "cid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Controller AID — the identifier being introduced"
          - name: "role"
            type: "string"
            required: true
            description: "The role of the endpoint provider"
            constraints:
              enum: ["witness", "watcher", "agent", "controller", "mailbox"]
          - name: "eid"
            type: "types://cesr/primitives#AID"
            required: false
            description: "Endpoint AID — the specific provider's identifier (optional, narrows to one provider)"
        invariants:
          - "URL pattern: /oobi/{cid}/{role} or /oobi/{cid}/{role}/{eid}"
          - "Returns signed reply messages (end-role + loc-scheme) plus KEL replay for the cid"
          - "If eid is specified, only returns data for that specific provider"
          - "keripy regex: OOBI_RE = /oobi/(?P<cid>[^/]+)/(?P<role>[^/]+)(?:/(?P<eid>[^/]+))?"
      - name: "data"
        fields:
          - name: "url"
            type: "string"
            required: true
            description: "HTTP(S) URL to the data endpoint"
          - name: "said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the content-addressed data (schema, credential, etc.)"
        invariants:
          - "URL pattern: /oobi/{said}"
          - "Returns the content identified by the SAID (e.g., JSON Schema for ACDC)"
          - "Verification: compute SAID of returned content, compare to the requested SAID"
          - "Content is immutable — SAIDs are content-addressed, so the data never changes"
          - "keripy regex: DOOBI_RE = /oobi/(?P<said>[^/]+)"
      - name: "well-known"
        fields:
          - name: "url"
            type: "string"
            required: true
            description: "Well-known URL following RFC 8615"
            constraints:
              pattern: "^https?://.+/.well-known/keri/oobi/.+"
          - name: "cid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Controller AID embedded in the well-known path"
        invariants:
          - "URL pattern: /.well-known/keri/oobi/{cid}"
          - "Follows RFC 8615 well-known URI convention"
          - "May return a redirect to the actual OOBI endpoint or serve KEL directly"
          - "keripy regex: WOOBI_RE = /.well-known/keri/oobi/(?P<cid>[^/]+)"
      - name: "blind"
        fields:
          - name: "url"
            type: "string"
            required: true
            description: "Bare OOBI URL with no identifier"
            constraints:
              pattern: "^https?://.+/oobi$"
          - name: "name"
            type: "string"
            required: false
            description: "Optional query parameter hint for the endpoint's alias"
        invariants:
          - "URL pattern: /oobi (no AID, no role)"
          - "Returns the service's own AID as a self-introduction"
          - "Used for bootstrapping — when you know a URL but not what AID it serves"
          - "If the service has a default AID configured, returns that AID's KEL"
          - "If no default AID, returns HTTP 404"
          - "Optional ?name=X query parameter provides a human-friendly alias hint"
    encoding:
      - format: "url"
        notes: "OOBIs are primarily exchanged as URLs — in QR codes, messages, emails, or any text channel. The URL IS the OOBI."

  - name: "EndRole"
    description: "An authorized endpoint for an AID — declares that a specific service (witness, watcher, agent) serves this identifier at a given URL."
    variants:
      - name: "default"
        fields:
          - name: "cid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Controller AID — who authorized this endpoint"
          - name: "role"
            type: "string"
            required: true
            description: "Service role"
            constraints:
              enum: ["witness", "watcher", "agent", "controller", "mailbox"]
          - name: "eid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Endpoint AID — the service's identifier"
        invariants:
          - "Authorization via signed reply message (route=/end/role/add)"
          - "Revocation via signed reply message (route=/end/role/cut)"
          - "Subject to BADA acceptance policy — newer datetime replaces older"

  - name: "LocationScheme"
    description: "A physical network endpoint for a service — maps an AID + scheme to a URL."
    variants:
      - name: "default"
        fields:
          - name: "eid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Service endpoint AID"
          - name: "scheme"
            type: "string"
            required: true
            description: "URL scheme"
            constraints:
              enum: ["http", "https", "tcp", "ws", "wss"]
          - name: "url"
            type: "string"
            required: true
            description: "Full URL for this endpoint"
        invariants:
          - "Authorization via signed reply message (route=/loc/scheme)"
          - "Subject to BADA acceptance policy"

  - name: "ServiceEndpoint"
    description: "A resolved service endpoint — a service AID paired with its role and network URL. Produced by combining EndRole authorization with LocationScheme resolution."
    variants:
      - name: "default"
        fields:
          - name: "service_aid"
            type: "string"
            required: true
            description: "Service AID (e.g., non-transferable witness AID, agent AID)"
          - name: "url"
            type: "string"
            required: true
            description: "HTTP(S) URL where the service is reachable"
          - name: "role"
            type: "string"
            required: true
            description: "Service role — determines what protocol the endpoint speaks"
            constraints:
              enum: ["witness", "watcher", "agent", "controller", "mailbox"]
        invariants:
          - "Resolved from end-role + loc-scheme reply messages"
          - "URL is verified via BADA acceptance policy"
          - "Role must match one of the KERI-defined service roles"

  - name: "ResolvedEndpoint"
    description: "Complete result of OOBI resolution — an identifier's verified endpoints and key state."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "The resolved identifier"
          - name: "endpoints"
            type: "array[types://discovery#ServiceEndpoint]"
            required: true
            description: "Verified service endpoints for this identifier"
          - name: "key_state"
            type: "types://identity/state#KeyState"
            required: true
            description: "Cryptographically verified key state from the resolved KEL"
        invariants:
          - "key_state is derived from processing the KEL returned during resolution"
          - "endpoints are verified via BADA acceptance policy"
          - "Resolution is untrusted until the KEL is cryptographically verified"

  - name: "DiscoveryReplyMessage"
    description: "A signed reply message (rpy) used in endpoint authorization. Routes /end/role and /loc/scheme carry endpoint data; route /ksn carries key state notifications. Subject to BADA acceptance policy."
    variants:
      - name: "end-role"
        fields:
          - name: "route"
            type: "string"
            required: true
            description: "Reply route"
            constraints:
              enum: ["/end/role/add", "/end/role/cut"]
          - name: "cid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Controller AID authorizing this endpoint"
          - name: "role"
            type: "string"
            required: true
            description: "Service role"
            constraints:
              enum: ["witness", "watcher", "agent", "controller", "mailbox"]
          - name: "eid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Endpoint service AID"
          - name: "dt"
            type: "string"
            required: true
            description: "ISO 8601 datetime — BADA uses this for staleness comparison"
        invariants:
          - "Must be signed by the controller AID (cid) whose endpoint this authorizes"
          - "BADA: accepted if dt >= last accepted dt for this (cid, role, eid) triple"
      - name: "loc-scheme"
        fields:
          - name: "route"
            type: "string"
            required: true
            constraints:
              enum: ["/loc/scheme"]
          - name: "eid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Service AID whose location is being declared"
          - name: "scheme"
            type: "string"
            required: true
            constraints:
              enum: ["http", "https", "tcp", "ws", "wss"]
          - name: "url"
            type: "string"
            required: true
            description: "Full URL for the service"
          - name: "dt"
            type: "string"
            required: true
            description: "ISO 8601 datetime — BADA staleness comparison"
        invariants:
          - "Must be signed by the service AID (eid)"
          - "BADA: accepted if dt >= last accepted dt for this (eid, scheme) pair"
    notes: |
      L67-O23: DiscoveryReplyMessage (ReplyMessage) was not previously defined in the discovery
      domain. The keri-messaging domain has ReplyMessage as a generic type; this is the
      discovery-domain-specific variant carrying endpoint authorization data.

  - name: "BADAComparisonKey"
    description: "Discriminated union of the key types used for BADA (Best Available Data Accepted) staleness comparison. Each route has a different key structure."
    variants:
      - name: "end-role-key"
        fields:
          - name: "cid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Controller AID"
          - name: "role"
            type: "string"
            required: true
            description: "Service role"
          - name: "eid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Endpoint service AID"
        invariants:
          - "Triple (cid, role, eid) uniquely identifies an end-role authorization"
          - "BADA: new message accepted if its dt > stored dt for this triple"
      - name: "loc-scheme-key"
        fields:
          - name: "eid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Endpoint service AID"
          - name: "scheme"
            type: "string"
            required: true
            description: "URL scheme (http, https, tcp, etc.)"
        invariants:
          - "Pair (eid, scheme) uniquely identifies a location scheme binding"
          - "BADA: new message accepted if its dt > stored dt for this pair"
      - name: "ksn-key"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Controller AID whose key state notification is being stored"
          - name: "watcher_aid"
            type: "types://cesr/primitives#AID"
            required: false
            description: "Watcher AID that produced this KSN (present for watcher-sourced KSNs)"
        invariants:
          - "BADA: new KSN accepted if its sn > stored sn for this aid"
          - "Different watchers can provide KSNs for the same AID — compared by sn not dt"
    notes: |
      L67-O24: BADAComparisonKey was not previously defined. The discriminated union makes
      explicit that different BADA-governed routes use different comparison key structures.
      end-role and loc-scheme use datetime (dt) for staleness; KSN uses sequence number (sn).

  - name: "KSNAcceptanceInput"
    description: "Input for accepting a Key State Notification (KSN) reply from a watcher or witness. The KSN carries the latest observed key state for an AID."
    variants:
      - name: "default"
        fields:
          - name: "aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID whose key state is being reported"
          - name: "key_state"
            type: "types://identity/state#KeyState"
            required: true
            description: "Key state as reported by the source"
          - name: "source_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the watcher or witness providing this KSN"
          - name: "said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the rpy message carrying this KSN"
        invariants:
          - "KSN must be signed by source_aid"
          - "key_state.sn must be >= current stored sn for this aid (BADA monotonic)"
          - "key_state must be cryptographically verifiable against the aid's KEL"
