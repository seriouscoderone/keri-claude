# ubiquitous-language.yaml
domain_ref: "discovery"

imports:
  - term: "AID"
    from: "domain://identity"
    usage: "OOBIs resolve to AID key state"
  - term: "KEL"
    from: "domain://identity"
    usage: "OOBI resolution fetches and validates a remote AID's KEL"
  - term: "SAID"
    from: "domain://cesr/primitives"
    usage: "End-role replies are SAIDified for integrity"

terms:
  - term: "OOBI"
    synonyms: ["Out-of-Band Introduction"]
    definition: "A URL that associates an AID with a network endpoint, enabling initial discovery. The introduction itself carries no trust — trust is established by resolving the OOBI and verifying the AID's KEL."
    invariants:
      - "Format: URL containing AID prefix and optional role/endpoint-type"
      - "An OOBI is a hint, not a proof — always verify the KEL after resolution"
      - "Multiple OOBIs may exist for the same AID (different endpoints, roles)"
    examples:
      - "http://witness1.example.com/oobi/EDP1vHsw... — witness endpoint for an AID"
      - "http://agent.example.com/.well-known/keri/oobi/EDP1vHsw... — well-known OOBI"
    related_terms: ["BADA", "Endpoint Authorization", "Well-Known OOBI"]

  - term: "BADA"
    synonyms: ["Best Available Data Accepted"]
    definition: "Policy for accepting and superseding endpoint authorization data. Prefers the most recent, most authoritative data available."
    invariants:
      - "Signed authorizations supersede unsigned"
      - "More recent timestamps supersede older"
      - "Authorizations anchored in KEL supersede unanchored"
    examples:
      - "A new endpoint authorization with a later date supersedes a previous one"
    related_terms: ["Endpoint Authorization", "OOBI"]

  - term: "Endpoint Authorization"
    synonyms: ["Endpoint Auth", "OKEA"]
    definition: "A signed declaration by an AID's controller authorizing specific network endpoints for specific roles (witness, agent, watcher, controller)."
    invariants:
      - "Signed by the AID's current signing keys"
      - "Anchored to the KEL via interaction event seal"
      - "Specifies role, endpoint URL, and optionally the endpoint AID"
    examples:
      - "Controller authorizes witness endpoint at ws://witness1.example.com:5632"
    related_terms: ["BADA", "Seal", "AID"]

  - term: "Well-Known OOBI"
    synonyms: [".well-known OOBI"]
    definition: "An OOBI URL discoverable at the RFC 8615 .well-known path convention."
    invariants:
      - "Path: /.well-known/keri/oobi/{aid}"
      - "Enables discovery without prior out-of-band communication"
    examples:
      - "https://example.com/.well-known/keri/oobi/EDP1vHsw..."
    related_terms: ["OOBI"]

  - term: "OOBI Resolution"
    synonyms: ["Resolution"]
    definition: "The process of fetching data from an OOBI URL, retrieving the AID's KEL from the discovered endpoint, and verifying it."
    invariants:
      - "Resolution is not complete until the KEL is verified"
      - "Failed verification means the OOBI is untrusted, not that it's invalid"
      - "Key rotation during OOBI resolution: if the controller's keys rotate between the time the OOBI URL is shared and the time the resolver fetches the KEL, the resolver receives the updated key state — OOBI resolution always produces the CURRENT key state, not the key state at OOBI creation time. The resolver MUST verify the full KEL, which includes the rotation event."
    examples:
      - "Resolve OOBI → GET KEL from witness → verify KEL → establish key state"
    related_terms: ["OOBI", "Validator"]

  - term: "Role"
    synonyms: ["Endpoint Role"]
    definition: "The function an endpoint serves for an AID — witness, controller, agent, watcher, or mediator."
    invariants:
      - "Roles constrain what operations the endpoint can perform"
      - "Role must match the endpoint authorization"
    examples:
      - "witness role: endpoint receipts events"
      - "agent role: endpoint manages AID on behalf of controller"
    related_terms: ["Endpoint Authorization", "OOBI"]

  - term: "Reply Escrow"
    synonyms: ["RPE", ".rpes [keripy]"]
    definition: "Holds OOBI reply messages whose signatures cannot yet be verified because the signer's key state is not available. Replies are reprocessed when the signer's KEL is resolved."
    invariants:
      - "Triggered when an rpy message signature cannot be verified against the signer's current key state"
      - "Reprocessed when the signer's KEL becomes available via OOBI resolution or direct fetch"
      - "Default timeout: 3600 seconds"
    related_terms: ["OOBI Resolution", "BADA"]

  - term: "Percolated Discovery"
    synonyms: ["PID", "Percolated Information Discovery"]
    definition: "The design principle that anyone who has verified KERI data can re-serve it via their own OOBI endpoint. Discovery percolates through the network — each resolver can become a new source. This works because all KERI data is end-verifiable: signatures, digest chains, and BADA policy ensure integrity regardless of the serving intermediary."
    invariants:
      - "Re-served data is indistinguishable from original — same signatures, same digests"
      - "No trust required in intermediaries — verification traces back to the controller's keys"
      - "An OOBI endpoint can be a witness, watcher, agent, or ANY standalone HTTP service with KEL data"
      - "The percolation model enables CDN-like caching of KERI data without trust delegation"
    examples:
      - "Alice resolves Bob's OOBI from a witness, caches Bob's KEL locally, then re-serves it to Carol via Alice's own OOBI endpoint"
      - "A KERI CDN service polls witnesses periodically, caches verified KELs, and serves them at high availability"
    related_terms: ["OOBI", "End-Verifiability", "BADA"]

  - term: "Blind OOBI"
    synonyms: ["Self-Introduction", "Bootstrap OOBI"]
    definition: "An OOBI URL with no identifier — just the bare endpoint path /oobi. Used for bootstrapping when you know a service's URL but not what AID it serves. The service responds with its own AID (self-introduction), enabling the resolver to then construct role-specific OOBI queries."
    invariants:
      - "URL has no AID or SAID component — just scheme://host:port/oobi"
      - "Service returns its default AID if configured, or HTTP 404 if no default"
      - "Optional ?name=X query parameter provides a human-friendly alias hint"
      - "The returned AID is NOT trusted — it must be verified via KEL validation like any OOBI"
    examples:
      - "QR code at a conference booth: http://demo.keri.one/oobi — scanning initiates self-introduction"
      - "Private network bootstrapping: curl http://192.168.1.100:8080/oobi — discover the service's AID"
    related_terms: ["OOBI", "Percolated Discovery"]

  - term: "Data OOBI"
    synonyms: ["DOOBI", "Content-Addressed OOBI"]
    definition: "An OOBI that discovers content-addressed data identified by a SAID rather than an AID. Used to find schemas, well-known credentials, and other immutable content. Verification is simple: compute the SAID of the returned content and compare to the requested SAID."
    invariants:
      - "URL pattern: /oobi/{SAID} — the SAID identifies the content, not a controller"
      - "Returned content is immutable — SAIDs are content-addressed digests"
      - "Verification: SAID(returned_content) == requested_SAID"
      - "Common use: ACDC schema discovery (JSON Schema documents identified by SAID)"
    examples:
      - "Schema discovery: http://schemas.vlei.org/oobi/EBfdlu8R27Fbx... — returns the JSON Schema"
      - "Well-known credential: http://registry.vlei.org/oobi/SAID-of-QVI-credential"
    related_terms: ["OOBI", "SAID"]

  - term: "Principal Controller"
    synonyms: ["Principal"]
    definition: "In the OKEA authorization model, the AID whose Controller authorizes other component AIDs (Players) to act in Roles on its behalf. The Principal Controller signs Role authorization messages that bind Players to Roles."
    invariants:
      - "Authorizes Players via signed Role authorization messages"
      - "May implicitly authorize Players through KEL designations (e.g., Witness backers)"
    related_terms: ["Player", "Role", "Endpoint Authorization", "Controller"]

  - term: "Player"
    synonyms: []
    definition: "In the OKEA authorization model, a component AID authorized by a Principal Controller to act in a specific Role. Each Player is itself a Controller of its own AID. A Player provides services at an Endpoint for its associated Role on behalf of the Principal."
    invariants:
      - "Must be authorized by a Principal Controller (explicitly via signed message or implicitly via KEL designation)"
      - "Signs its own Endpoint authorization messages for service URLs"
      - "Is itself a Controller of its own AID"
    related_terms: ["Principal Controller", "Role", "Endpoint Authorization"]

  - term: "RUN"
    synonyms: ["Read Update Nullify"]
    definition: "The peer-to-peer data management paradigm replacing traditional CRUD (Create, Read, Update, Delete). In RUN: there is no Create (only Update of vacuous records from the source Peer), no Delete (only Nullify — marking invalid without erasing). Combined with BADA monotonicity, RUN ensures replay-resistant and deletion-resistant authentic data management."
    invariants:
      - "No Create — the source Peer Updates, the destination Peer stores"
      - "No Delete — only Nullify (mark invalid without erasing the record)"
      - "All updates follow BADA monotonicity rules"
    related_terms: ["BADA", "Endpoint Authorization"]

  - term: "OOBI Endpoint Independence"
    definition: "The architectural property that any service with stored KEL data can serve OOBIs, independent of any specific KERI infrastructure role. An OOBI endpoint only needs read access to KEL data — it does not need signing keys, witness status, or agent registration. This enables standalone OOBI services, caching proxies, and percolated re-serving."
    invariants:
      - "Minimum requirement: an identifier repository (Habery/equivalent) with KEL data"
      - "No private keys required — serving is read-only"
      - "No witness/watcher/agent status required — any HTTP service can mount OOBI endpoints"
      - "The serving endpoint only responds for AIDs it has data for (own AIDs or AIDs it witnessed)"
      - "Blind OOBI requires a configured default AID"
    related_terms: ["Percolated Discovery", "OOBI"]

events:
  - name: "OOBIResolved"
    payload: "aid: AID, endpoint: URL, role: Role, kel_verified: bool"
    triggers: "An OOBI URL is fetched and the AID's KEL is retrieved and verified"

  - name: "EndpointAuthorizationUpdated"
    payload: "aid: AID, role: Role, new_endpoint: URL, timestamp: DateTime"
    triggers: "Controller publishes a new endpoint authorization superseding the previous"

rules:
  - "Never trust an OOBI without verifying the KEL — OOBIs are introductions, not attestations"
  - "BADA policy: accept the most recent, most authoritative endpoint data available"
  - "Endpoint authorizations must be signed by the AID's current controller keys"
