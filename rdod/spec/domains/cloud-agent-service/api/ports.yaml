# ports.yaml
domain_ref: "cloud-agent-service/api"

ports:
  # === PORT 3903: BOOT ===
  - id: "port://cloud-agent-service/api/inbound/boot"
    type: inbound
    name: "Boot API"
    contract: "provision_agent(icp, sig, key_params) -> Operation — creates cloud agent for a controller AID"
    protocol: "REST"
    refs: ["domain://signify-client"]

  # === PORT 3901: ADMIN API ===
  - id: "port://cloud-agent-service/api/inbound/admin-api"
    type: inbound
    name: "Admin API"
    contract: >
      create_identifier(config) -> AID;
      rotate(aid) -> RotationEvent;
      interact(aid, seals) -> InteractionEvent;
      list_credentials() -> [Credential];
      get_credential(said) -> Credential;
      resolve_oobi(url) -> Result;
      list_contacts() -> [Contact];
      list_notifications() -> [Notification];
      mark_notification(id, read) -> Result;
      get_operation(name) -> Operation;
      authorize_endrole(aid, role, eid) -> Operation
    protocol: "REST"
    refs: ["domain://signify-client", "domain://cloud-agent-service"]

  # === PORT 3902: MESSAGE ROUTER ===
  - id: "port://cloud-agent-service/api/inbound/message-router"
    type: inbound
    name: "Message Router"
    contract: "receive_message(keri_message) -> Result — routes protocol messages to agent instances by target AID"
    protocol: "REST"
    refs: []

  # Outbound HTTP server defined at parent: port://cloud-agent-service/outbound/http-server
