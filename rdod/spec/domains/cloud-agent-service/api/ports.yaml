# ports.yaml
domain_ref: "cloud-agent-service/api"

ports:
  # === PORT 3903: BOOT ===
  - id: "port://cloud-agent-service/api/inbound/boot"
    type: inbound
    name: "Boot API"
    semantics: command
    idempotent: false
    contract:
      input: "types://cloud-agent-service/api#BootRequest"
      output: "types://signify-client#Operation"
      errors:
        - "errors://cloud-agent-service/api#InvalidBootInceptionError"
        - "errors://cloud-agent-service/provisioning#AgentAlreadyExistsError"
    refs: ["domain://signify-client"]

  # === PORT 3901: ADMIN API ===
  - id: "port://cloud-agent-service/api/inbound/admin-api"
    type: inbound
    name: "Admin API"
    semantics: command
    idempotent: false
    contract:
      input: "types://cloud-agent-service/api#AdminRequest"
      output: "types://signify-client#Operation"
      errors:
        - "errors://cloud-agent-service/api#AuthNError"
        - "errors://cloud-agent-service/api#MissingSignifyResourceError"
        - "errors://cloud-agent-service/api#AgentNotFoundError"
        - "errors://cloud-agent-service/api#InvalidAgentConfigurationError"
        - "errors://cloud-agent-service/api#IdentifierNotFoundError"
        - "errors://cloud-agent-service/api#MissingParameterError"
        - "errors://cloud-agent-service/api#ForbiddenSignatureError"
        - "errors://cloud-agent-service/api#OperationNotFoundError"
        - "errors://cloud-agent-service/api#ConfigurationError"
    refs: ["domain://signify-client", "domain://cloud-agent-service"]

  # === PORT 3902: MESSAGE ROUTER ===
  - id: "port://cloud-agent-service/api/inbound/message-router"
    type: inbound
    name: "Message Router"
    semantics: command
    idempotent: false
    contract:
      input: "CESR-encoded KERI protocol message"
      output: "Routing result"
      errors: []
    refs: []

  # Outbound HTTP server defined at parent: port://cloud-agent-service/outbound/http-server
