# ports.yaml
domain_ref: "cloud-agent-service/api"

ports:
  # === PORT 3903: BOOT ===
  - id: "port://cloud-agent-service/api/inbound/boot"
    type: inbound
    name: "Boot API"
    semantics: command
    idempotent: false
    contract:
      input: "types://cloud-agent-service/api#BootRequest"
      output: "types://signify-client/resources#OperationStatus"
      errors:
        - "errors://cloud-agent-service/api#InvalidBootInceptionError"
        - "errors://cloud-agent-service/provisioning#AgentAlreadyExistsError"
    refs: ["domain://signify-client"]

  # === PORT 3901: ADMIN API ===
  - id: "port://cloud-agent-service/api/inbound/admin-api"
    type: inbound
    name: "Admin API"
    semantics: command
    idempotent: false
    contract:
      input: "types://cloud-agent-service/api#AdminRequest"
      output: "types://signify-client/resources#OperationStatus"
      errors:
        - "errors://cloud-agent-service/api#AuthNError"
        - "errors://cloud-agent-service/api#MissingSignifyResourceError"
        - "errors://cloud-agent-service/api#AgentNotFoundError"
        - "errors://cloud-agent-service/api#InvalidAgentConfigurationError"
        - "errors://cloud-agent-service/api#IdentifierNotFoundError"
        - "errors://cloud-agent-service/api#MissingParameterError"
        - "errors://cloud-agent-service/api#ForbiddenSignatureError"
        - "errors://cloud-agent-service/api#OperationNotFoundError"
        - "errors://cloud-agent-service/api#ConfigurationError"
    refs: ["domain://signify-client", "domain://cloud-agent-service"]

  # === PORT 3902: MESSAGE ROUTER ===
  # [H-O11] DEFERRED — input/output/errors are untyped placeholders.
  # When specified, this port contract SHOULD contain:
  #   input:  A typed CESR-encoded KERI protocol message from the keri-messaging
  #           domain (e.g., multisig coordination exchanges, credential revocation
  #           notices, delegation approval requests). The type should reference
  #           keri-messaging primitives, not raw bytes.
  #   output: A routing disposition value type with variants:
  #           - delivered (message routed to target agent mailbox)
  #           - queued   (target agent offline; message held for later delivery)
  #           - rejected (message refused due to policy or validation failure)
  #   errors:
  #     - UnknownTargetAidError    — no agent provisioned for the target AID
  #     - MalformedCesrError       — input fails CESR stream parsing
  #     - InvalidAuthenticationError — Signify-Auth header missing or invalid
  #
  # This port receives external KERI protocol messages (port 3902) and routes
  # them to the appropriate agent's mailbox. Unlike the Admin API (port 3901),
  # callers are external participants (other controllers, witnesses, watchers),
  # not the agent's own Signify client.
  - id: "port://cloud-agent-service/api/inbound/message-router"
    type: inbound
    name: "Message Router"
    semantics: command
    idempotent: false
    contract:
      input: "CESR-encoded KERI protocol message"
      output: "Routing result"
      errors: []
    refs: ["domain://keri-messaging"]

  # Outbound HTTP server defined at parent: port://cloud-agent-service/outbound/http-server
