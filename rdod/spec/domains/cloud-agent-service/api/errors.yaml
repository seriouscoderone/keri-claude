# errors.yaml
domain_ref: "cloud-agent-service/api"

# Error catalog for the Cloud Agent Service API domain.
# Maps to exception classes in keria/src/keria/core/authing.py (Authenticater),
# keria/src/keria/app/agenting.py (AgentResourceEnd, BootEnd, OperationResourceEnd),
# and keria/src/keria/app/aiding.py (IdentifierResourceEnd, IdentifierCollectionEnd).
#
# Severity levels:
#   transient  — condition may self-resolve (escrow and retry)
#   recoverable — requires operator or protocol-level action
#   fatal      — unrecoverable; request is permanently rejected

errors:
  - name: "AuthNError"
    keripy_class: "kering.AuthNError"
    description: "HTTP request signature verification failed"
    cause: "The Signature and Signature-Input headers do not verify against the controller's current key state, or the Signify-Resource AID is unknown"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "controller_aid"
        type: "string"
        description: "The AID from the Signify-Resource header"
      - field: "reason"
        type: "string"
        description: "Specific auth failure (unknown or invalid controller, Signature for {inputage} invalid)"
    related_port: "port://cloud-agent-service/api/inbound/admin-api"
    keripy_raise_site: "authing.py:Authenticater.verify — 'unknown or invalid controller', 'Signature for {} invalid'"

  - name: "MissingSignifyResourceError"
    keripy_class: "ValueError"
    description: "Signify-Resource header is missing from the HTTP request"
    cause: "The request does not include the required Signify-Resource header identifying the controller AID"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "endpoint"
        type: "string"
        description: "The API endpoint path that was called"
    related_port: "port://cloud-agent-service/api/inbound/admin-api"
    keripy_raise_site: "authing.py:Authenticater.resource — 'Missing signify resource header'"

  - name: "AgentNotFoundError"
    keripy_class: "falcon.HTTPNotFound"
    description: "No agent exists for the specified controller AID"
    cause: "The controller has not provisioned an agent via the /boot endpoint, or the agent AID does not match"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "controller_aid"
        type: "string"
        description: "The controller AID that was looked up"
    related_port: "port://cloud-agent-service/api/inbound/admin-api"
    keripy_raise_site: "aiding.py:AgentResourceEnd.on_get — 'not agent found for controller {caid}'"

  - name: "InvalidAgentConfigurationError"
    keripy_class: "falcon.HTTPBadRequest"
    description: "Agent or controller configuration is invalid"
    cause: "The agent's AID prefix is not found in kevers, or the controller AID does not match the agent's caid"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "agent_aid"
        type: "string"
        description: "The agent's AID prefix"
      - field: "controller_aid"
        type: "string"
        description: "The controller's AID"
      - field: "reason"
        type: "string"
        description: "Specific configuration failure"
    related_port: "port://cloud-agent-service/api/inbound/admin-api"
    keripy_raise_site: "aiding.py:AgentResourceEnd.on_get — 'invalid agent configuration', 'invalid controller configuration'"

  - name: "InvalidBootInceptionError"
    keripy_class: "falcon.HTTPBadRequest"
    description: "Agent bootstrap inception event is invalid"
    cause: "The /boot POST request contains an invalid inception event — wrong event type, missing fields, invalid agent AID derivation, or agent already exists for this controller"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "reason"
        type: "string"
        description: "Specific inception failure (invalid inception, agent already exists, multisig groups not supported)"
    related_port: "port://cloud-agent-service/api/inbound/admin-api"
    keripy_raise_site: "agenting.py:BootEnd.on_post — 'invalid inception', 'agent already exists'"

  - name: "IdentifierNotFoundError"
    keripy_class: "falcon.HTTPNotFound"
    description: "Requested identifier does not exist under this agent"
    cause: "The identifier name or prefix referenced in the request has not been incepted for this agent"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "identifier_name"
        type: "string"
        description: "The human-readable identifier name or prefix"
      - field: "agent_aid"
        type: "string"
        description: "The agent's AID"
    related_port: "port://cloud-agent-service/api/inbound/admin-api"
    keripy_raise_site: "aiding.py:IdentifierResourceEnd — 'name is not a valid reference to an identifier'"

  - name: "MissingParameterError"
    keripy_class: "falcon.HTTPBadRequest"
    description: "Required request body parameter is missing"
    cause: "POST or PUT request body does not contain a required field (rot, sigs, sxlt, keys, ixn, etc.)"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "parameter_name"
        type: "string"
        description: "The missing parameter name"
      - field: "endpoint"
        type: "string"
        description: "The API endpoint path"
    related_port: "port://cloud-agent-service/api/inbound/admin-api"
    keripy_raise_site: "aiding.py:multiple — 'required field {name} missing from body'"

  - name: "ForbiddenSignatureError"
    keripy_class: "falcon.HTTPForbidden"
    description: "Request signature is present but invalid"
    cause: "The request includes Signature headers but the signature does not verify against the controller's current key state"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "controller_aid"
        type: "string"
        description: "The controller's AID"
    related_port: "port://cloud-agent-service/api/inbound/admin-api"
    keripy_raise_site: "aiding.py:AgentResourceEnd.on_put — 'invalid signature on request'"

  - name: "OperationNotFoundError"
    keripy_class: "falcon.HTTPNotFound"
    description: "Requested long-running operation does not exist"
    cause: "The operation name does not correspond to any tracked asynchronous operation (e.g., witness receipt collection, multisig coordination, delegation approval)"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "operation_name"
        type: "string"
        description: "The operation identifier that was not found"
    related_port: "port://cloud-agent-service/api/inbound/admin-api"
    keripy_raise_site: "agenting.py:OperationResourceEnd — operation lookup in opr database"

  - name: "ConfigurationError"
    keripy_class: "kering.ConfigurationError"
    description: "Agent configuration is invalid for the requested operation"
    cause: "The agent type is incompatible (e.g., non-SignifyHab instance), or the agent AID does not match the controller AID"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "agent_aid"
        type: "string"
        description: "The agent's AID"
      - field: "reason"
        type: "string"
        description: "Specific configuration failure"
    related_port: "port://cloud-agent-service/api/inbound/admin-api"
    keripy_raise_site: "agenting.py — 'invalid agent aid', aiding.py — 'agent only allows SignifyHab instances'"
