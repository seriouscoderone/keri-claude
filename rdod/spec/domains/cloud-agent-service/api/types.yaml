domain_ref: "cloud-agent-service/api"

types:
  - name: "BootRequest"
    description: "Agent provisioning request sent to the boot endpoint (POST /boot). The key strategy is a discriminated union — exactly one variant is provided."
    variants:
      - name: "salty"
        fields:
          - name: "icp"
            type: "types://identity/establishment#InceptionEvent"
            required: true
            description: "Agent inception event"
          - name: "sig"
            type: "string"
            required: true
            description: "Controller signature over the inception event"
          - name: "salt"
            type: "string"
            required: true
            description: "CESR-qualified salt (Salter qb64) — the root secret for deterministic key derivation"
          - name: "tier"
            type: "string"
            required: true
            description: "Argon2 stretching tier: low, med, or high"
            constraints:
              enum: ["low", "med", "high"]
          - name: "stem"
            type: "string"
            required: true
            description: "Derivation path stem for hierarchical key generation"
        invariants:
          - "Deterministic key derivation — same salt + tier + stem produces same keys"
          - "icp must be a valid inception event with correct version string"
          - "sig must verify against the keys in the inception event"
      - name: "randy"
        fields:
          - name: "icp"
            type: "types://identity/establishment#InceptionEvent"
            required: true
            description: "Agent inception event"
          - name: "sig"
            type: "string"
            required: true
            description: "Controller signature over the inception event"
        invariants:
          - "Random key generation — no derivation path, no recovery from lost keys"
          - "icp must be a valid inception event with correct version string"
          - "sig must verify against the keys in the inception event"

  - name: "AdminRequest"
    description: "Authenticated request to the admin API (port 3901). All requests must include HTTP Signature headers."
    variants:
      - name: "default"
        fields:
          - name: "method"
            type: "string"
            required: true
            constraints:
              enum: ["GET", "POST", "PUT", "DELETE"]
          - name: "path"
            type: "string"
            required: true
            description: "API endpoint path"
          - name: "body"
            type: "map"
            required: false
            description: "Request body (JSON) — schema varies by endpoint path. Typed per-endpoint request schemas are defined by the resource domain that owns each endpoint (identifiers → identity, credentials → credential-lifecycle, registries → credential-lifecycle/registry, exchanges → credential-exchange, etc.)"
          - name: "auth"
            type: "types://signify-client/key-management#SignifyAuth"
            required: true
            description: "HTTP Signature authentication"
        invariants:
          - "auth.signify_resource must match the agent's controller AID"
          - "auth.signature must verify against controller's current key state"
          - "auth.signify_timestamp must pass KRAM timeliness check against kram_timeliness_window"

  - name: "KramConfig"
    description: "Configuration parameters for KRAM (Key Rate-limited Authentication Method) request validation. KRAM is defined by the Signify protocol, not core KERI — timeliness is a configurable deployment parameter, not a protocol constant."
    variants:
      - name: "default"
        fields:
          - name: "kram_timeliness_window"
            type: "integer"
            required: true
            description: "Maximum allowed age of a KRAM signature timestamp in seconds before the request is considered stale. Recommended default deferred to keria oracle."
        invariants:
          - "Requests with signify_timestamp older than kram_timeliness_window are rejected"
          - "Value is implementation-configurable — not a protocol-normative constant"
          - "Must balance replay protection (shorter) vs clock skew tolerance (longer)"
