# ubiquitous-language.yaml
domain_ref: "cloud-agent-service"

imports:
  - term: "AID"
    from: "domain://cesr/primitives"
    usage: "Agents are provisioned per controller AID"
  - term: "KRAM"
    from: "domain://identity"
    usage: "Admin API uses KRAM for replay protection on authenticated requests"
  - term: "Exchange Message (exn)"
    from: "domain://identity"
    usage: "Message router processes inbound exn messages"

terms:
  - term: "KERIA"
    synonyms: ["Cloud Agent", "KERI Agent"]
    definition: "Server-side cloud agent hosting KERI identifiers on behalf of controllers. The orchestrating service that delegates provisioning (Agency boot), API exposure (Admin API, Message Router), and async processing (Doers, Monitor, escrows) to its three subdomains. Never holds private keys."
    invariants:
      - "Zero access to private signing or decryption keys"
      - "Can store, forward, and assemble — but never sign"
      - "Delegates provisioning to cloud-agent-service/provisioning"
      - "Delegates API exposure to cloud-agent-service/api"
      - "Delegates async processing to cloud-agent-service/processing"
    examples:
      - "A KERIA deployment on AWS hosting 500 agent instances"
      - "keria start --config-dir scripts --config-file demo-witness-oobis"
    related_terms: []

# All other terms moved to subdomains:
#   provisioning/ — Agency, Agent Instance, Multi-tenancy, Credential Wallet, Contact Book
#   api/          — Admin API, Message Router, KERIA (three-port ref), Notification, End-Role Authorization
#   processing/   — Processing Unit, Message Queue, Escrow, Long-running Operation, Counselor, Boatswain, Registrar,
#                   Credentialer, Seeker, Postman, Multi-sig Assembly

events:
  # Orchestrating events only — subdomain-specific events moved to subdomain files
  - name: "AgentProvisioned"
    payload: "agent_id: string, controller_aid: AID, boot_config: AgentConfig"
    triggers: "Signify client sends POST /boot with controller inception event"

  - name: "AgentDestroyed"
    payload: "agent_id: string, controller_aid: AID"
    triggers: "Controller or operator destroys the agent instance"

rules:
  - "KERIA can NEVER produce a valid signature — all signing delegated to edge"
  - "Agent instances are isolated — one controller's data is inaccessible to another"
  - "Three endpoints share agent state and persistence — they are ports, not separate services"
  - "Edge client polls for notifications and operations — agent cannot push to edge"
