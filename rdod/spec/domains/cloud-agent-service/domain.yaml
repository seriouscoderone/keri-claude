# domain.yaml
template_version: "2.0"
id: "cloud-agent-service"
name: "Cloud Agent Service (KERIA)"
description: >
  Service-tier domain for cloud-hosted AID management. Multi-tenant infrastructure
  where each controller gets an isolated agent instance. Hosts AIDs, processes events,
  coordinates multi-sig, stores credentials, routes protocol messages — but NEVER holds
  private keys. Three service endpoints: boot (agency), admin API, message router.
  The Signify protocol boundary lives here (KRAM authentication on admin API).
  Implementation: keria (Python), serious-keri (TypeScript/Lambda).

  File guide — errors and types live in child subdomains (api, provisioning,
  processing). AgentProvisioning protocol is here because the parent
  orchestrates the provisioning flow across children.
version: "0.1.0"
tier: "service"

source_material:
  - type: document
    reference: "KERIArchGroupIssuance.md — group issuance and multi-sig coordination"
  - type: document
    reference: "keridoc-llms-full.md — KERIA architecture documentation"
  - type: user-input
    reference: "CLAUDE.md — KERIA service architecture (ports 3901/3902/3903)"

domain_clients:
  - ref: "domain://signify-client"
    relationship: "Customer-Supplier — thin wallets drive the cloud agent via Signify protocol (signify-client/resources/outbound/cloud-agent-comms -> cloud-agent-service/api/inbound/admin-api)"
    via_port: "port://cloud-agent-service/api/inbound/admin-api"

subdomains:
  - ref: "domain://cloud-agent-service/provisioning"
    relationship: "Owns multi-tenant agent lifecycle — provisioning, isolation, and destruction of per-controller agent instances via the Agency boot endpoint"
    via_port: "port://cloud-agent-service/provisioning/inbound/agent-lifecycle"
  - ref: "domain://cloud-agent-service/api"
    relationship: "Owns the three service endpoints — Admin API (KRAM-authenticated management), Message Router (protocol message routing), notification/end-role systems"
    via_port: "port://cloud-agent-service/api/inbound/admin-api"
  - ref: "domain://cloud-agent-service/processing"
    relationship: "Owns the async event processing pipeline — Processing Units, Message Queues, escrow management, long-running operation tracking, and specialized processing components"
    via_port: "port://cloud-agent-service/processing/inbound/process-work"

kernels: []

adjacents:
  - ref: "domain://cesr"
    pattern: "conformist"
    relationship: "Conformist — all events and messages encoded in CESR format"
  - ref: "domain://keri-messaging"
    pattern: "conformist"
    relationship: "KERI messaging primitives (exn, qry, rpy) adopted natively"
  - ref: "domain://identity"
    relationship: "Conformist — runs KERI protocol stack on behalf of controllers"
    pattern: "Conformist"
    via_port: "port://identity/inbound/identity-management"
    is_cross_cutting: false
  - ref: "domain://credential-lifecycle"
    relationship: "Conformist — issues, stores, and presents ACDC credentials"
    pattern: "Conformist"
    via_port: "port://credential-lifecycle/inbound/state-management"
    is_cross_cutting: false
  - ref: "domain://discovery"
    relationship: "Customer-Supplier — resolves OOBIs for endpoint discovery and contact resolution"
    pattern: "Customer-Supplier"
    via_port: "port://discovery/inbound/discovery"
    is_cross_cutting: false
  - ref: "domain://witness-service"
    relationship: "Customer-Supplier — forwards events to witnesses, collects receipts"
    pattern: "Customer-Supplier"
    via_port: "port://witness-service/api/inbound/event-submission"
    is_cross_cutting: false
  - ref: "domain://watcher-service"
    relationship: "Customer-Supplier — queries watchers for duplicity status and KEL verification"
    pattern: "Customer-Supplier"
    via_port: "port://watcher-service/api/inbound/kel-query"
    is_cross_cutting: false

externals:
  - ref: "domain://externals/persistence"
    relationship: "Agent instances, credential wallets, contact books, and pending operations per provisioned controller — the agent-repository outbound port delegates to this external"
  - ref: "domain://externals/transport"
    relationship: "Boot, admin, and message router HTTP endpoints on separate ports — the http-server outbound port delegates to this external"

implementation_guidance:
  suggested_type: "service"
  language_affinity: "any"
  notes: >
    Reference implementation is keria (Python, Falcon + hio, LMDB). Serverless
    implementation is serious-keri (TypeScript, AWS Lambda + DynamoDB). The three
    endpoints (boot, admin, message router) are ports on the same service, not
    separate services — they share agent state and persistence.

issues: []

tags: ["cloud-agent", "keria", "service", "multi-tenant", "signify"]

# --- Application-Layer Open Items (deferred to design0-ecosystem) ---
# These items are intentionally deferred. This domain's spec is thin by design —
# full specification will be produced by the design0-ecosystem skill when
# ecosystem-level service design is performed.
#
# [H-O11] message-router port untyped input/output — inbound and outbound types
#         on the message-router port are not yet specified
# [H-O12] RESOLVED — DeckName renamed to WorkQueueName; 'witners' typo fixed to 'witnesses'
# [H-O13] AgentConfig name collision with signify-client/resources — the type
#         name AgentConfig conflicts with a type of the same name in the
#         signify-client resources subdomain; needs disambiguation
# [L811-O20] Timedout state contradicts done XOR invariant — the operation FSM
#            includes a Timedout terminal state that is not accounted for in the
#            done-XOR constraint on OperationStatus
# [L811-O21] process-work port conflates enqueue and get-operation — the
#            process-work inbound port bundles two distinct responsibilities
#            (enqueueing work and retrieving operation results) that should be
#            separate ports
# [L811-O22] No explicit agent-isolation invariant — the multi-tenant isolation
#            guarantee (one agent per controller, no cross-agent state leakage)
#            is described in prose but not captured as a formal invariant
# [L811-O23] AdminAPI KRAM authentication contract unspecified — the KRAM
#            authentication scheme on the admin-api inbound port lacks a typed
#            contract (header names, signature algorithm, nonce handling)
