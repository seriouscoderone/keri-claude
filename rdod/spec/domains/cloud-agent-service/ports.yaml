# ports.yaml
domain_ref: "cloud-agent-service"

ports:
  # Inbound ports are defined in subdomains:
  #   - provisioning: port://cloud-agent-service/provisioning/inbound/agent-lifecycle (boot)
  #   - api: port://cloud-agent-service/api/inbound/admin-api (admin API)
  #   - api: port://cloud-agent-service/api/inbound/message-router (message routing)

  # Outbound — repository, HTTP server, witness/watcher interaction
  - id: "port://cloud-agent-service/outbound/agent-repository"
    type: outbound
    name: "Agent Repository"
    description: >
      Manages agent lifecycle, credential storage, contacts, and notifications for
      cloud-hosted identifiers. Each agent represents one provisioned Signify client
      session with its associated state.
    contract: "store_agent(agent: Agent) -> Result; get_agent(agent_id: AgentID) -> Agent; remove_agent(agent_id: AgentID) -> Result; store_credential(aid: AID, credential: Credential) -> Result; list_credentials(aid: AID) -> [Credential]; store_contact(contact: Contact) -> Result; get_contacts(aid: AID) -> [Contact]; enqueue_notification(notification: Notification) -> Result; get_notifications(agent_id: AgentID, since?: Timestamp) -> [Notification]"
    protocol: "method-call"
    refs: ["persistence"]

  - id: "port://cloud-agent-service/outbound/http-server"
    type: outbound
    name: "HTTP Server"
    contract: "listen(boot_port, admin_port, router_port) -> Server"
    protocol: "method-call"
    refs: ["transport"]

  - id: "port://cloud-agent-service/outbound/witness-forward"
    type: outbound
    name: "Witness Event Forwarding"
    contract: "forward_event(event, witness_aids) -> [Receipt]; collect_receipts(event, witness_threshold) -> ReceiptSet"
    protocol: "HTTP"
    refs: ["domain://witness-service"]

  - id: "port://cloud-agent-service/outbound/watcher-query"
    type: outbound
    name: "Watcher Query"
    contract: "query_kel(aid) -> KELState; query_duplicity(aid) -> DuplicityStatus"
    protocol: "HTTP"
    refs: ["domain://watcher-service"]
