# errors.yaml
domain_ref: "cloud-agent-service"

# Parent-level errors for the cloud agent service.
# Subdomain-specific errors are in api/, provisioning/, and processing/.
# These are orchestration-level errors that span subdomains.

errors:
  - name: "AgentUnavailableError"
    description: "Agent instance exists but is not currently reachable or ready"
    cause: "Agent is initializing, shutting down, or in a degraded state"
    recovery: "retry"
    severity: "transient"
    context:
      - field: "agent_aid"
        type: "string"
        description: "The agent AID that is unavailable"

  - name: "UnauthorizedRequestError"
    description: "Request failed KRAM/SKRAP authentication — signature invalid or sender not authorized for this agent"
    cause: "Invalid signature, unknown sender AID, or sender is not the agent's controller"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "sender_aid"
        type: "string"
        description: "The AID that attempted the request"
      - field: "reason"
        type: "string"
        description: "Why authentication failed"
