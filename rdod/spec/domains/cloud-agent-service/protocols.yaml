domain_ref: "cloud-agent-service"

protocols:
  - name: "AgentProvisioning"
    description: "Bootstrap a new cloud agent for a controller. The controller generates their keys at the edge (Signify), then provisions an agent that will manage identifiers on their behalf."
    participants:
      - domain: "domain://cloud-agent-service/provisioning"
        role: "Creates and configures the agent instance"
      - domain: "domain://cloud-agent-service/api"
        role: "Provides the boot endpoint for provisioning"
      - domain: "domain://signify-client/key-management"
        role: "Generates edge keys and inception event"
      - domain: "domain://identity/establishment"
        role: "Validates the agent's inception event"
    trigger: "Controller's Signify client sends POST /boot with inception event"
    steps:
      - seq: 1
        domain: "domain://signify-client/key-management"
        action: "generate_agent_keys"
        port: "port://signify-client/key-management/inbound/key-ops"
        input:
          description: "Controller passcode, salt, key tier"
          types:
            - ref: "types://signify-client#KeyTier"
        output:
          description: "Agent inception event signed with edge keys"
          type: "types://identity#InceptionEvent"
        preconditions:
          - "verification://signify-client/key-management#Passcode"
      - seq: 2
        domain: "domain://cloud-agent-service/api"
        action: "receive_boot_request"
        port: "port://cloud-agent-service/api/inbound/admin-api"
        input:
          description: "POST /boot with signed inception event"
          types:
            - ref: "types://cloud-agent-service/api#BootRequest"
        output:
          description: "Request validated for structure"
        on_failure:
          - error: "MissingParameterError"
            ref: "errors://cloud-agent-service/api#MissingParameterError"
            action: "abort"
      - seq: 3
        domain: "domain://cloud-agent-service/provisioning"
        action: "create_agent"
        port: "port://cloud-agent-service/provisioning/inbound/agent-lifecycle"
        input:
          description: "Controller AID, inception event"
        output:
          description: "Agent instance created with dedicated databases (Identifier Repository, Registry Manager, Event Database)"
        depends_on: [2]
        preconditions:
          - "verification://cloud-agent-service/provisioning#Agency"
        on_failure:
          - error: "AgentAlreadyExistsError"
            ref: "errors://cloud-agent-service/provisioning#AgentAlreadyExistsError"
            action: "abort"
            compensation: "Return existing agent reference"
      - seq: 4
        domain: "domain://identity/establishment"
        action: "validate_agent_inception"
        port: "port://identity/establishment/inbound/validate-event"
        input:
          description: "Agent's inception event"
          types:
            - ref: "types://identity#InceptionEvent"
        output:
          description: "Agent AID established with key state"
          type: "types://identity#KeyState"
        depends_on: [3]
      - seq: 5
        domain: "domain://cloud-agent-service/provisioning"
        action: "register_controller_mapping"
        port: "port://cloud-agent-service/provisioning/inbound/agent-lifecycle"
        input:
          description: "Controller AID → Agent AID mapping"
        output:
          description: "Agent discoverable by controller AID"
        depends_on: [4]
        preconditions:
          - "verification://cloud-agent-service/provisioning#Multi-tenancy"
    timeout: "30s — provisioning is synchronous"
    terminal_states:
      success: "Agent running, databases initialized, controller can authenticate via Signify signatures"
      failure: "Boot request rejected — no agent created"
