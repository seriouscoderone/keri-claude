# ubiquitous-language.yaml
domain_ref: "cloud-agent-service/processing"

imports:
  - term: "Counselor"
    from: "domain://identity/thresholds"
    usage: "Monitor queries Counselor to detect multi-sig group operation completion; processes group queue work items"

  - term: "Boatswain"
    from: "domain://delegation"
    usage: "Monitor queries Boatswain to detect delegation operation completion; processes delegation queue work items"

  - term: "Registrar"
    from: "domain://credential-lifecycle"
    usage: "TEL Registrar manages registry TEL events; has processEscrows() called by Escrow Processing Worker; integrates with Monitor for registry/credential operations"

  - term: "Credentialer"
    from: "domain://credential-lifecycle"
    usage: "Issues and manages ACDC credentials; Monitor queries Credentialer to detect credential operation completion"

  - term: "Seeker"
    from: "domain://credential-lifecycle"
    usage: "Credential search index triggered by Verifier cues when credentials are saved; queried by API handlers"

terms:
  - term: "Processing Unit"
    synonyms: ["Async Worker", "Doer (HIO in keripy)", "DoDoer (composite, HIO in keripy)"]
    definition: "Event-driven processing unit in the async processing framework. Each Processing Unit has a periodic work cycle called repeatedly by the scheduler. The Agent is a Composite Processing Unit composing many sub-workers. No threads — concurrency via cooperative scheduling."
    invariants:
      - "Non-blocking — each work cycle processes available work and returns"
      - "Processing Units drain work from Message Queues (FIFO queues)"
      - "Key workers: Witnesser (witness receipting), Delegator (delegation events), Escrow Processor (escrow processing), Parser Worker (message parsing)"
      - "No threads — concurrency via cooperative scheduling"
    examples:
      - "Witnesser work cycle: pops from witness queue, sends receipt requests"
      - "Escrow Processing Worker (Escrower in keripy): calls processEscrows() on Identity Event Processor (Kevery in keripy), Credential Event Processor (Tevery in keripy), Exchanger, Verifier"
    related_terms: ["Message Queue", "Escrow", "Long-running Operation"]

  - term: "Message Queue"
    synonyms: ["Work Queue", "Cue Queue", "Deck (HIO in keripy)"]
    definition: "Thread-safe FIFO deque used to queue work items between processing units. The standard pattern is: producer appends to queue, consumer processing unit drains in its work cycle."
    invariants:
      - "Pattern: while queue: item = queue.popleft(); process(item)"
      - "Key queues on Agent: cues, groups, anchors, witnesses, queries"
      - "Producers: API handlers, message router, escrow reprocessing"
      - "Consumers: Processing Unit subclasses (Witnesser, Delegator, Escrow Processor, etc.)"
    examples:
      - "Admin API appends to witness queue -> Witnesser processing unit drains and processes"
      - "Message Router appends to groups queue -> Counselor-related processing unit processes"
    related_terms: ["Processing Unit", "Escrow"]

  - term: "Escrow"
    synonyms: ["Pending Escrow"]
    definition: "Temporary storage for incomplete or out-of-order operations — partial multi-sig events, unverified receipts, pending IPEX exchanges. Each component maintains its own escrows, processed periodically by the Escrow Processing Worker."
    invariants:
      - "Escrowed items have a timeout after which they are discarded"
      - "Items automatically complete when missing data arrives"
      - "Multiple escrow types: partial signature, out-of-order event, unverified receipt"
      - "Each component (Identity Event Processor [Kevery in keripy], Credential Event Processor [Tevery in keripy], Exchanger, Verifier, Registrar, Credentialer) maintains its own escrows"
      - "Escrows are swept once per work cycle by the processing loop — each domain's escrow queue is checked for items whose blocking conditions have resolved or whose timeout has expired"
    examples:
      - "A multi-sig event with 1 of 3 required signatures is escrowed until others arrive"
      - "An out-of-order event escrowed until its predecessor is received"
    related_terms: ["Processing Unit", "Multi-sig Assembly", "Counselor"]

  - term: "Long-running Operation"
    synonyms: ["Operation", "Monitor"]
    definition: "An async task tracked by KERIA's Monitor — witness receipting, delegation approval, group formation, credential issuance, registry anchoring, OOBI resolution, end-role setup. Edge clients poll via GET /operations/{name}."
    invariants:
      - "Operations named {type}.{oid} — type identifies the workflow, oid the resource"
      - "Types: witness, delegation, group, query, registry, credential, endrole, oobi"
      - "Monitor checks completion by querying the relevant component (Counselor for group, Boatswain for delegation, etc.)"
      - "Operations have a done flag, optional error, and response payload"
      - "Returned as HTTP 202 Accepted with operation handle"
    examples:
      - "POST /identifiers returns op name 'witness.EDP1...' — poll until done"
      - "POST /credentials returns op name 'credential.EDP1...' — poll until TEL anchored"
    related_terms: ["Processing Unit", "Counselor", "Boatswain", "Registrar", "Credentialer"]

  - term: "Postman"
    synonyms: ["Message Sender"]
    definition: "Routes peer-to-peer messages (exchange messages, multi-sig requests, credentials) to remote agents. Wraps content in KERI protocol format and delivers via HTTP."
    invariants:
      - "send(hab, dest, topic, serder, attachment) — delivers to destination AID's agent"
      - "Uses resolved OOBI endpoints for routing"
      - "Messages arrive at the recipient's message router (port 3902)"
    examples:
      - "Postman delivers multi-sig partial signature to co-signer's agent"
      - "Postman delivers IPEX grant to credential recipient's agent"
    related_terms: ["Processing Unit", "Message Queue"]

  - term: "Multi-sig Assembly"
    synonyms: ["Signature Assembly", "Group Signing"]
    definition: "Process of collecting partial signatures from multiple edge clients for group AID events. Assembles when the signing threshold is satisfied."
    invariants:
      - "Each partial signature arrives independently via message router"
      - "Assembly is threshold-aware (kt satisfaction check)"
      - "Incomplete signature sets escrowed with timeout"
      - "Assembled event forwarded to witnesses once complete"
    examples:
      - "3-of-5 group inception: 5 controllers sign independently, KERIA assembles when 3 arrive"
      - "Group credential issuance: partial signatures collected, ACDC issued when threshold met"
    related_terms: ["Counselor", "Escrow", "Message Queue"]

events:
  - name: "OperationCreated"
    payload: "name: string, type: OpType, oid: string"
    triggers: "An async operation is submitted to the Monitor"

  - name: "OperationCompleted"
    payload: "name: string, type: OpType, done: true, response: object"
    triggers: "Monitor detects completion via component query (Counselor, Boatswain, etc.)"

  - name: "MultisigAssembled"
    payload: "aid: AID, event_type: string, sequence: int, signers: [AID]"
    triggers: "All required partial signatures collected — threshold satisfied"

  - name: "EscrowProcessed"
    payload: "component: string, items_processed: int"
    triggers: "Escrower doer runs processEscrows() on a component"

  - name: "CredentialReceived"
    payload: "said: SAID, issuer: AID, schema: SAID, holder_aid: AID"
    triggers: "IPEX grant received and admitted — credential added to wallet"

  - name: "CredentialIndexed"
    payload: "said: SAID, schema: SAID, fields_indexed: int"
    triggers: "Seeker indexes a newly saved credential from Verifier cue"

rules:
  - "All async work flows through Message Queues (Decks in HIO/keripy) — producers append, consumer Processing Units drain in their work cycle"
  - "Long-running operations are the ONLY mechanism for tracking async completion — no callbacks to edge"
  - "Incomplete events are escrowed with timeout, not rejected — escrows processed periodically by Processing Units"
  - "Each component (Identity Event Processor [Kevery in keripy], Credential Event Processor [Tevery in keripy], Exchanger, Verifier, Registrar, Credentialer) maintains its own escrows"
  - "Monitor checks completion by querying the relevant specialized component"
  - "Credential search indexes are rebuilt from schema structure — each scalar attribute becomes a searchable field"
  - "Credential wallet operations (present, revoke) require edge-signed authorization — the agent cannot present credentials unilaterally"
  - "Multi-sig assembly is threshold-aware — incomplete signature sets are escrowed, not rejected"
