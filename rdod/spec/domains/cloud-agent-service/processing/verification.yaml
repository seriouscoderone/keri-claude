# verification.yaml
domain_ref: "cloud-agent-service/processing"

# Verification properties are language-agnostic invariants.
# Code examples use Python/pytest syntax for illustration — implementations
# in other languages should express equivalent assertions in their native testing framework.

# Formalized invariants from ubiquitous_language terms
properties:
  - invariant: "Each work cycle (recur call) MUST process available work items and return within 1 second; the processing loop MUST NOT block on I/O or wait for external events — it drains the deck and returns"
    term: "Processing Unit"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(work_items=st.lists(st.binary(min_size=1), max_size=100))
        def test_doer_recur_nonblocking(work_items):
            doer = create_test_doer()
            for item in work_items:
                doer.deck.append(item)
            start = time.monotonic()
            doer.recur(tyme=0.0)
            elapsed = time.monotonic() - start
            # recur must return within a bounded time — no blocking
            assert elapsed < 1.0  # 1 second upper bound for cooperative scheduling
    strategy: "st.lists(st.binary()) for work item queues of varying size"
    notes: "Cooperative scheduling requires each work cycle to be non-blocking"

  - invariant: "Pattern: while queue: item = queue.popleft(); process(item)"
    term: "Message Queue"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(items=st.lists(st.integers(), min_size=1, max_size=100))
        def test_deck_fifo_drain(items):
            deck = Deck()
            for item in items:
                deck.append(item)
            drained = []
            while deck:
                drained.append(deck.popleft())
            assert drained == items  # FIFO order preserved
            assert len(deck) == 0   # Fully drained
    strategy: "st.lists(st.integers()) for work items — FIFO ordering must be preserved"
    notes: "Message Queue (Deck in HIO/keripy) is a FIFO deque — items come out in the order they were appended"

  - invariant: "Escrowed items with age >= configured timeout MUST be pruned: OOE timeout=1200s, PSE/PWE timeout=3600s, PDE timeout=86400s. Pruned items are permanently discarded and cannot re-enter any escrow."
    term: "Escrow"
    technique: smt
    formal:
      language: z3
      expression: |
        timeout = Real('timeout')
        escrow_age = Real('escrow_age')
        is_active = Bool('is_active')
        s = Solver()
        # Escrow is active when age < timeout
        s.add(is_active == (escrow_age < timeout))
        s.add(timeout > 0)
        # Prove: if age >= timeout, escrow is not active
        s.add(escrow_age >= timeout)
        s.add(is_active == True)
        assert s.check() == unsat  # Cannot be active after timeout
    strategy: ""
    notes: "SMT proof that escrow timeout is strictly enforced — no expired items remain active"

  - invariant: "Operations named {type}.{oid} — type identifies the workflow, oid the resource"
    term: "Long-running Operation"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(
            op_type=st.sampled_from(['witness', 'delegation', 'group', 'query', 'registry', 'credential', 'endrole', 'oobi']),
            oid=st.text(min_size=1, max_size=44, alphabet=st.characters(whitelist_categories=('L', 'N')))
        )
        def test_operation_naming(op_type, oid):
            op = create_operation(op_type, oid)
            assert op.name == f"{op_type}.{oid}"
            parts = op.name.split('.', 1)
            assert parts[0] in VALID_OP_TYPES
            assert len(parts[1]) > 0
    strategy: "st.sampled_from for valid operation types, st.text for resource OIDs"
    notes: "Operation naming convention is deterministic and parseable"

  - invariant: "Completed operations carry a result; failed operations carry an error; incomplete operations carry neither"
    term: "Long-running Operation"
    technique: property-based
    formal:
      language: pseudocode
      expression: |
        for any op_type in [witness, delegation, group, credential]:
          for any oid:
            op = create_operation(op_type, oid)
            # Poll the operation and verify the behavioral contract
            status = poll_operation(op.name)
            if status.done and status has no error:
              # Successful completion must produce a usable result
              result = status.result
              assert result is not null
              assert result can be deserialized to the expected type for op_type
            elif status.done and status has error:
              # Failed completion must produce a diagnostic error
              assert status.error.code is not null
              assert status.error.message is not empty
              assert status.result is null
            else:
              # Incomplete operations have no final result yet
              assert not status.done
        # The behavioral guarantee: polling an operation always returns a
        # self-consistent status — done+success implies result, done+error
        # implies diagnostic, not-done implies still processing.
    strategy: "All valid operation types, arbitrary OIDs"
    notes: "Operation lifecycle contract — the done/error/result triple is always internally consistent"

  - invariant: "Multi-sig assembly MUST check threshold satisfaction: the event is assembled (complete) when collected signatures >= threshold; collected < threshold MUST result in the event remaining escrowed; collected == 0 with threshold > 0 MUST NOT trigger assembly"
    term: "Multi-sig Assembly"
    technique: smt
    formal:
      language: z3
      expression: |
        threshold = Int('threshold')
        collected = Int('collected')
        total_members = Int('total_members')
        is_assembled = Bool('is_assembled')
        s = Solver()
        s.add(threshold > 0)
        s.add(threshold <= total_members)
        s.add(total_members > 0)
        s.add(collected >= 0)
        s.add(collected <= total_members)
        # Assembly requires meeting threshold
        s.add(is_assembled == (collected >= threshold))
        # Prove: cannot assemble with fewer than threshold signatures
        s.add(collected < threshold)
        s.add(is_assembled == True)
        assert s.check() == unsat  # Cannot assemble below threshold
    strategy: ""
    notes: "SMT proof that multi-sig assembly requires at least threshold signatures"

  - invariant: "Signature sets where collected < threshold MUST be escrowed (not rejected); escrowed partial signatures MUST be accumulated until threshold is met or timeout expires; zero signatures submitted MUST result in an empty escrow entry"
    term: "Multi-sig Assembly"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(
            threshold=st.integers(min_value=2, max_value=10),
            collected=st.integers(min_value=0, max_value=10)
        )
        def test_incomplete_multisig_escrowed(threshold, collected):
            assume(collected < threshold)
            group = create_group(threshold=threshold)
            for i in range(collected):
                group.submit_partial_sig(make_siger(i))
            assert group.is_escrowed()
            assert not group.is_assembled()
    strategy: "st.integers for threshold and collected signature counts"
    notes: "Below-threshold signature sets must be escrowed, not rejected"

  - invariant: "Monitor delegates completion checks to the correct specialized component for each operation type"
    term: "Long-running Operation"
    technique: property-based
    formal:
      language: pseudocode
      expression: |
        for each op_type in [group, delegation, credential, registry, witness]:
          monitor = create_monitor()
          # Create an operation that is NOT yet done
          op = create_operation(op_type, unique_oid())
          # Complete the operation via its specific workflow
          complete_workflow(op_type, op.oid)
          # Monitor must detect the completion by polling the correct component
          status = monitor.check_completion(op)
          assert status.done == true
          # Verify the monitor queried the right subsystem by checking
          # the result contains type-specific completion evidence:
          if op_type == "group":
            assert status.result contains multi-sig assembly result
          elif op_type == "delegation":
            assert status.result contains delegation approval commitment
          elif op_type == "credential":
            assert status.result contains credential SAID and TEL event
          elif op_type == "registry":
            assert status.result contains registry prefix
          elif op_type == "witness":
            assert status.result contains witness receipt count >= toad
        # The behavioral guarantee: monitor produces correct completion
        # evidence for each operation type, proving it delegated to the
        # right component.
    strategy: "All operation types with type-specific completion workflows"
    notes: "Monitor dispatches completion checks to the correct specialized component — verified by type-specific result content"

  - invariant: "Indexes built from credential schema — each schema field becomes a searchable index"
    term: "Seeker"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(
            fields=st.dictionaries(
                keys=st.text(min_size=1, max_size=20, alphabet=st.characters(whitelist_categories=('L',))),
                values=st.text(min_size=1, max_size=50),
                min_size=1, max_size=10
            )
        )
        def test_seeker_indexes_all_schema_fields(fields):
            schema = create_schema(fields)
            credential = create_credential(schema, fields)
            seeker = create_seeker()
            seeker.index(credential)
            for field_name, field_value in fields.items():
                results = seeker.find({f'-a-{field_name}': field_value})
                assert credential.said in results
    strategy: "st.dictionaries for credential payload fields"
    notes: "Every scalar field in a credential schema must become a searchable index"

# Formalized port contracts
contracts:
  - port_ref: "port://cloud-agent-service/processing/inbound/process-work"
    preconditions:
      - formal:
          language: python
          expression: "lambda deck, item: deck in VALID_DECK_NAMES and item is not None"
        description: "enqueue_work requires a valid deck name and non-null work item"
      - formal:
          language: pseudocode
          expression: "name is not null AND name contains '.' AND split(name, '.', limit=2) yields [valid_type, non_empty_oid]"
        description: "get_operation requires a valid operation name in {type}.{oid} format"
    postconditions:
      - formal:
          language: python
          expression: "lambda deck, item, result: result.success and item in get_deck(deck)"
        description: "After enqueue, item is present in the specified deck"
      - formal:
          language: pseudocode
          expression: |
            op.name == name
            AND (op.done == true OR op.done == false)
            AND (op.done AND op.error is null implies op.result is not null)
            AND (op.done AND op.error is not null implies op.result is null)
        description: "get_operation returns the operation with correct name and consistent done/error/result state"

  - port_ref: "port://cloud-agent-service/processing/inbound/multisig"
    preconditions:
      - formal:
          language: python
          expression: "lambda group_aid, siger, event: group_aid is not None and siger.valid() and event.valid()"
        description: "submit_partial_signature requires valid group AID, signature, and event"
    postconditions:
      - formal:
          language: python
          expression: |
            lambda group_aid, siger, result:
                result.success
                and (result.assembled if siger_count(group_aid) >= threshold(group_aid) else result.escrowed)
        description: "Partial signature accepted — if threshold met, event assembled; otherwise escrowed"

  - port_ref: "port://cloud-agent-service/processing/inbound/credential-ops"
    preconditions:
      - formal:
          language: python
          expression: "lambda schema, issuer, issuee, data: schema is not None and issuer is not None and data is not None"
        description: "issue_credential requires schema SAID, issuer AID, and credential data"
    postconditions:
      - formal:
          language: pseudocode
          expression: "result.name starts with 'credential.' AND result.done is a boolean AND poll_operation(result.name) returns a valid status"
        description: "Returns a long-running operation with credential type prefix that is pollable"

  - port_ref: "port://cloud-agent-service/processing/outbound/escrow-repository"
    preconditions:
      - formal:
          language: python
          expression: "lambda type, key, item, timeout: type in VALID_ESCROW_TYPES and key is not None and timeout.total_seconds() > 0"
        description: "store_escrow requires valid escrow type, non-null key, and positive timeout"
    postconditions:
      - formal:
          language: python
          expression: "lambda type, key: get_escrowed(type) contains item with key"
        description: "After store, escrowed item is retrievable by type and key"

# State machine: Long-running Operation lifecycle
state_machines:
  - name: "LongRunningOperation"
    term: "Operation Lifecycle"
    states: ["Submitted", "Processing", "Done", "Failed", "Timedout"]
    initial_state: "Submitted"
    terminal_states: ["Done", "Failed", "Timedout"]
    transitions:
      - from: "Submitted"
        to: "Processing"
        trigger: "Operation picked up by processing loop"
        guard: "Operation type is recognized (oobi, witness, delegation, group, query, registry, credential, endrole)"
      - from: "Processing"
        to: "Done"
        trigger: "All prerequisites met"
        guard: "Depends on type: witness receipts >= TOAD, or group sigs >= threshold, or OOBI resolved, etc."
      - from: "Processing"
        to: "Failed"
        trigger: "Unrecoverable error during processing"
        guard: "Fatal error encountered"
      - from: "Processing"
        to: "Timedout"
        trigger: "Operation exceeded maximum processing time"
        guard: "elapsed_time > operation_timeout"
    invariants:
      - "Client polls via GET /operations/{name} — returns 200 with done=true or 202 with done=false"
      - "Done operations include the result payload"
      - "Failed operations include error details (code, message)"
      - "Operations are persisted — survive agent restart"
      - "Operation names are immutable once created — {type}.{oid} never changes"
      - "An operation in 'Processing' state is being actively monitored by the Monitor"
      - "Monitor dispatches completion checks to correct component (Counselor for group, Boatswain for delegation, etc.)"
