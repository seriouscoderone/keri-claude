# ports.yaml
domain_ref: "cloud-agent-service/processing"

ports:
  # Inbound — what clients call
  - id: "port://cloud-agent-service/processing/inbound/process-work"
    type: inbound
    name: "Work Processing"
    semantics: command
    idempotent: false
    contract:
      input: "types://cloud-agent-service/processing#WorkItem"
      output: "types://cloud-agent-service/processing#ServerOperation"
      errors:
        - "errors://cloud-agent-service/processing#OperationLookupError"
    refs: ["domain://cloud-agent-service"]

  - id: "port://cloud-agent-service/processing/inbound/multisig"
    type: inbound
    name: "Multi-sig Assembly"
    semantics: command
    idempotent: false
    contract:
      input: "types://cloud-agent-service/processing#SignedEventMessage"
      output: "types://cloud-agent-service/processing#GroupStatus"
      errors:
        - "errors://cloud-agent-service/processing#EscrowTimeoutError"
    refs: ["domain://cloud-agent-service"]

  - id: "port://cloud-agent-service/processing/inbound/credential-ops"
    type: inbound
    name: "Credential Operations"
    semantics: command
    idempotent: false
    contract:
      input: "types://cloud-agent-service/processing#CredentialFilter"
      output: "types://cloud-agent-service/processing#ServerOperation"
      errors:
        - "errors://cloud-agent-service/processing#OperationLookupError"
    refs: ["domain://cloud-agent-service"]

  # Outbound — what processing calls
  - id: "port://cloud-agent-service/processing/outbound/escrow-repository"
    type: outbound
    name: "Escrow Repository"
    semantics: command
    idempotent: false
    description: >
      Manages time-bounded escrow of partially-complete protocol exchanges (e.g.,
      partial signatures awaiting threshold, credentials pending presentation).
      Items expire after a configurable timeout.
    contract:
      input: "types://cloud-agent-service/processing#EscrowedItem"
      output: "types://cloud-agent-service/processing#EscrowedItem"
      errors:
        - "errors://cloud-agent-service/processing#EscrowTimeoutError"
    refs: ["domain://externals/persistence"]

  - id: "port://cloud-agent-service/processing/outbound/operation-repository"
    type: outbound
    name: "Operation Repository"
    semantics: command
    idempotent: false
    description: >
      Tracks long-running operations so clients can poll for completion.
      Operations represent async workflows like witness receipting or credential issuance.
    contract:
      input: "types://cloud-agent-service/processing#ServerOperation"
      output: "types://cloud-agent-service/processing#ServerOperation"
      errors:
        - "errors://cloud-agent-service/processing#OperationLookupError"
    refs: ["domain://externals/persistence"]

  - id: "port://cloud-agent-service/processing/outbound/credential-index-repository"
    type: outbound
    name: "Credential Index Repository"
    semantics: command
    idempotent: false
    description: >
      Searchable index over credential attributes. Allows clients to find credentials
      by schema, issuer, issuee, or any indexed attribute field.
    contract:
      input: "types://cloud-agent-service/processing#CredentialFilter"
      output: "array[types://cesr/primitives#SAID]"
      errors: []
    refs: ["domain://externals/persistence"]

  - id: "port://cloud-agent-service/processing/outbound/timer"
    type: outbound
    name: "Timer"
    semantics: command
    idempotent: true
    contract:
      input: "Timer key and duration"
      output: "boolean"
      errors: []
    refs: ["domain://externals/persistence"]
