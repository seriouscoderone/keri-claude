# domain.yaml
template_version: "2.0"
id: "cloud-agent-service/processing"
name: "Agent Processing"
description: >
  The async event processing pipeline — Processing Units, Message Queues, escrow management,
  long-running operation tracking (Monitor), and the specialized processing components
  (Counselor, Boatswain, Registrar, Credentialer, Seeker, Postman). Owns the cooperative
  scheduling model where producers append to Message Queues and consumer Processing Units drain work in
  their periodic work cycles. Tracks all async operations via the Monitor for edge-client polling.
  Implementation: keria (Python), serious-keri (TypeScript/Lambda).
version: "0.1.0"
tier: "service"

source_material:
  - type: document
    reference: "keridoc-llms-full.md — Doer architecture, escrow processing, operation tracking"
  - type: document
    reference: "KERIArchGroupIssuance.md — group issuance, multi-sig coordination, Counselor, Boatswain"
  - type: document
    reference: "keria — agenting.py: Agent (DoDoer), Witnesser, Delegator, Escrower; monitoring.py: Monitor; ending.py: Counselor, Boatswain, Registrar, Credentialer"
  - type: user-input
    reference: "CLAUDE.md — HIO orchestration, Doer/Deck pattern"

domain_clients:
  - ref: "domain://cloud-agent-service"
    relationship: "Parent domain delegates async event processing to this subdomain"
    via_port: "port://cloud-agent-service/processing/inbound/process-work"

subdomains: []

kernels: []

adjacents: []

externals:
  - ref: "domain://externals/persistence"
    relationship: "Escrow storage, operation tracking, and credential index — the escrow-repository, operation-repository, and credential-index-repository outbound ports delegate to this external"

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    In keria, the Agent class is a DoDoer composing many sub-doers (Witnesser, Delegator,
    Escrower, ParserDoer). Each doer's recur() method drains its assigned Deck. The Monitor
    class (monitoring.py) tracks operations and queries specialized components (Counselor,
    Boatswain, Registrar, Credentialer) for completion status. In serious-keri, the cooperative
    scheduling model maps to Lambda invocations with DynamoDB-backed work queues.

issues: []

tags: ["processing", "processing-unit", "message-queue", "escrow", "monitor", "async"]
