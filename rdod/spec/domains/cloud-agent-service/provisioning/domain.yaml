# domain.yaml
template_version: "1.0"
id: "cloud-agent-service/provisioning"
name: "Agent Provisioning"
description: >
  Multi-tenant agent lifecycle — provisioning, isolation, and destruction of per-controller
  agent instances via the Agency boot endpoint. Manages the bidirectional controller-AID to
  agent-AID mappings, enforces one-agent-per-controller invariant, and scopes all agent-owned
  resources (managed AIDs, credential wallet, contact book) to the provisioned instance.
  Implementation: keria (Python), serious-keri (TypeScript/Lambda).
version: "0.1.0"

source_material:
  - type: document
    reference: "keridoc-llms-full.md — Agency architecture, agent provisioning, multi-tenancy"
  - type: document
    reference: "keria — agenting.py: Agency class, Agent class, AgencyBaser (.agnt, .ctrl, .aids)"
  - type: user-input
    reference: "CLAUDE.md — KERIA service architecture (port 3903 boot endpoint)"

domain_clients:
  - ref: "domain://cloud-agent-service"
    relationship: "Parent domain delegates agent lifecycle management to this subdomain"
    via_port: "port://cloud-agent-service/provisioning/inbound/agent-lifecycle"

subdomains: []

kernels: []

adjacents: []

externals:
  - name: "Agent Registry"
    abstraction: "Repository"
    ref: "port://cloud-agent-service/provisioning/outbound/agent-registry"
    implementation_notes: "Stores agent instances and bidirectional controller-AID to agent-AID mappings."

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    Provisioning is triggered via POST /boot. Each provisioned agent gets its own isolated
    set of identifiers, credentials, and processing state. The agent registry enforces
    the one-agent-per-controller invariant and provides bidirectional lookup.

issues: []

tags: ["provisioning", "multi-tenant", "agency", "agent-lifecycle", "boot"]
