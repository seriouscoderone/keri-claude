domain_ref: "cloud-agent-service/provisioning"

errors:
  - name: "AgentAlreadyExistsError"
    description: "Attempting to provision an agent for a controller that already has one"
    cause: "POST /boot for a controller AID that is already mapped to an existing agent"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "controller_aid"
        type: "string"
        description: "The controller AID"
      - field: "existing_agent_aid"
        type: "string"
        description: "The AID of the already-provisioned agent"

  - name: "InvalidBootInceptionError"
    description: "The inception event in the boot request is malformed or invalid"
    cause: "Boot request body contains an inception event that fails structural validation"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "reason"
        type: "string"
        description: "Specific inception validation failure"

  - name: "AgentInitializationError"
    description: "Agent was created but failed to initialize its internal components"
    cause: "Database creation, key store initialization, or processor startup failed"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "controller_aid"
        type: "string"
        description: "The controller AID"
      - field: "component"
        type: "string"
        description: "Which component failed (database, keystore, processor)"
      - field: "reason"
        type: "string"
        description: "Initialization failure details"

  - name: "AgentNotFoundError"
    description: "Requested agent does not exist for the given controller"
    cause: "Lookup by controller AID or agent AID returns no match"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "lookup_key"
        type: "string"
        description: "The AID used for lookup"
      - field: "lookup_type"
        type: "string"
        description: "controller_aid or agent_aid"

  - name: "AgentDeletionError"
    description: "Agent could not be cleanly torn down"
    cause: "Database cleanup, key material destruction, or deregistration failed during agent deletion"
    recovery: "escalate"
    severity: "recoverable"
    context:
      - field: "agent_aid"
        type: "string"
        description: "The agent being deleted"
      - field: "component"
        type: "string"
        description: "Which cleanup step failed"
