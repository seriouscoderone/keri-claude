# ports.yaml
domain_ref: "cloud-agent-service/provisioning"

ports:
  # Inbound — what clients call
  - id: "port://cloud-agent-service/provisioning/inbound/agent-lifecycle"
    type: inbound
    name: "Agent Lifecycle"
    semantics: command
    idempotent: false
    contract:
      input: "types://cloud-agent-service/provisioning#AgentConfig"
      output: "types://cloud-agent-service/provisioning#AgentInstance"
      errors:
        - "errors://cloud-agent-service/provisioning#AgentAlreadyExistsError"
        - "errors://cloud-agent-service/provisioning#AgentInitializationError"
        - "errors://cloud-agent-service/provisioning#AgentDeletionError"
    refs: ["domain://cloud-agent-service"]

  # Outbound — what provisioning calls
  - id: "port://cloud-agent-service/provisioning/outbound/agent-registry"
    type: outbound
    name: "Agent Registry"
    semantics: command
    idempotent: false
    contract:
      input: "types://cloud-agent-service/provisioning#ControllerAgentMapping"
      output: "types://cloud-agent-service/provisioning#AgentInstance"
      errors:
        - "errors://cloud-agent-service/provisioning#AgentAlreadyExistsError"
    refs: ["domain://externals/persistence"]
