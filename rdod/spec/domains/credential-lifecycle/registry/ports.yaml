# ports.yaml
domain_ref: "credential-lifecycle/registry"

ports:
  # Inbound -- what the parent domain calls
  - id: "port://credential-lifecycle/registry/inbound/registry-management"
    type: inbound
    name: "Registry Management"
    semantics: command
    idempotent: true  # rip is effectively idempotent by SAID determinism — submitting the same rip twice returns the existing registry
    contract:
      input: "types://credential-lifecycle/registry#RegistryInceptionRequest"
      output: "types://credential-lifecycle/registry#RegistryStateSnapshot"
      errors:
        - "errors://credential-lifecycle/registry#RegistryAlreadyExistsError"
        - "errors://credential-lifecycle/registry#RegistryNotOwnedError"
        - "errors://credential-lifecycle/registry#InvalidBackerConfigError"
        - "errors://credential-lifecycle/registry#MissingKELSealError"
        # ConfigTraitMutationError removed — LEGACY v1 ONLY (v2 rip has no c field)
    refs: ["domain://credential-lifecycle"]

  # Outbound -- what registry calls
  - id: "port://credential-lifecycle/registry/outbound/registry-repository"
    type: outbound
    name: "Registry Repository"
    semantics: command
    idempotent: true
    contract:
      input: "types://credential-lifecycle/registry#RegistryRecord"
      output: "types://credential-lifecycle/registry#RegistryRecord"
      errors: []
    refs: ["domain://externals/persistence"]
    invariants:
      - "Name uniqueness: each registry name maps to exactly one registry record"
      - "SAID uniqueness: each registry SAID maps to exactly one registry record"
      - "State is a materialized view: can be reconstructed from the registry's TEL events"
