# ports.yaml
domain_ref: "credential-lifecycle/registry"

ports:
  # Inbound -- what the parent domain calls
  - id: "port://credential-lifecycle/registry/inbound/registry-management"
    type: inbound
    name: "Registry Management"
    contract: "create_registry(issuer_aid: AID, name: str, config_traits: [str], backers: [AID]?, toad: int?) -> REGID; rotate_registry(regid: REGID, cuts: [AID]?, adds: [AID]?, toad: int?) -> RegistryRotationEvent; get_registry(regid: REGID) -> RegistryStateSnapshot; get_registry_by_name(name: str) -> RegistryStateSnapshot"
    protocol: "method-call"
    refs: ["domain://credential-lifecycle"]

  # Outbound -- what registry calls
  - id: "port://credential-lifecycle/registry/outbound/registry-repository"
    type: outbound
    name: "Registry Repository"
    contract: "save_registry(name: str, record: RegistryRecord) -> Result; load_registry_by_name(name: str) -> Option<RegistryRecord>; load_registry_by_said(registry_said: SAID) -> Option<RegistryRecord>; save_state(registry_said: SAID, state: RegistryStateSnapshot) -> Result; load_state(registry_said: SAID) -> Option<RegistryStateSnapshot>"
    protocol: "method-call"
    refs: ["persistence"]
    invariants:
      - "Name uniqueness: each registry name maps to exactly one registry record"
      - "SAID uniqueness: each registry SAID maps to exactly one registry record"
      - "State is a materialized view: can be reconstructed from the registry's TEL events"
