# domain.yaml
template_version: "1.0"
id: "credential-lifecycle/registry"
name: "Credential Registry"
description: >
  Creating and managing credential registries — the containers that track groups
  of credentials. A registry is initialized via a registry inception (vcp/rip) event,
  rotated via registry rotation (vrt) events, and identified by its REGID (the SAID
  of its inception event). Registry configuration (backer mode, backer list, threshold)
  is established at inception and governs all subsequent credential events within the
  registry.
version: "0.1.0"

source_material:
  - type: document
    reference: "acdc-specification.md — Transaction Event Logs (TELs) as ACDC State Registries section"
  - type: document
    reference: "acdc-specification.md — Registry Inception, Registry Rotation, Backer Configuration sections"
  - type: implementation
    reference: "keripy — src/keri/vdr/eventing.py: Regery (registry collection manager), Registry class, VCP/VRT event handling"
  - type: implementation
    reference: "keriox/teliox — src/state.rs: ManagerTelState, registry management event processing"

ubiquitous_language:
  - term: "Registry Inception"
    definition: "The initialization event for a TEL registry, establishing its REGID, binding it to an issuer AID, and setting configuration traits"
    invariants:
      - "Message type t field must be 'rip' (or 'vcp' in legacy format)"
      - "SAID of this event becomes the REGID"
      - "Config traits (e.g., NoBackers) are immutable after inception"

  - term: "Registry Rotation"
    definition: "A management event that updates a registry's backer configuration — adding or removing backer witnesses and adjusting the threshold"
    invariants:
      - "Only valid for registries with backers (not NoBackers)"
      - "Does not affect credential state — only registry management state"

domain_clients:
  - ref: "domain://credential-lifecycle"
    relationship: "Parent credential lifecycle domain delegates registry creation and management to this subdomain"
    via_port: "port://credential-lifecycle/registry/inbound/registry-management"

subdomains: []

kernels: []

adjacents:
  - ref: "domain://identity"
    relationship: "Registries anchor to the issuer's KEL — the issuer AID in the rip event must have verifiable key state"
    pattern: "Conformist"
    via_port: "port://identity/inbound/identity-management"
    is_cross_cutting: false

externals:
  - name: "Registry Persistence"
    abstraction: "Repository"
    ref: "port://credential-lifecycle/registry/outbound/registry-store"
    implementation_notes: "Store for registry metadata, name-to-REGID mappings, and cached management state. Implementations: LMDB subdbs (.regs, .states) in keripy Reger, TelEventDatabase trait in keriox"

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    This is a leaf domain focused on registry lifecycle management. In keripy,
    the Regery class manages registry creation (makeRegistry), lookup by name
    (registryByName), and management event processing. The Registry class
    represents a single registry instance. In keriox, ManagerTelState tracks
    the registry's management state. The key insight is that registry configuration
    (backer mode) is immutable after inception and constrains all subsequent
    credential events within that registry.

issues: []

tags: ["registry", "inception", "rotation", "backer-configuration", "regid", "credential-lifecycle"]
