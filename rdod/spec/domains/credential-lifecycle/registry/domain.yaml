# domain.yaml
template_version: "2.0"
id: "credential-lifecycle/registry"
name: "Credential Registry"
description: >
  Creating and managing credential registries — the containers that track groups
  of credentials. A registry is initialized via a registry inception (rip) event
  and identified by its REGID (the SAID of its inception event). Registry
  configuration (blindability mode, backer list, threshold) is established at
  inception and is immutable — there is no registry rotation in v2. All
  subsequent credential events within the registry are governed by the inception
  configuration. LEGACY (v1 -- do NOT implement): vcp inception, vrt rotation events.
version: "0.1.0"
tier: "domain"

source_material:
  - type: document
    reference: "acdc-specification.md — Transaction Event Logs (TELs) as ACDC State Registries section"
  - type: document
    reference: "acdc-specification.md — Registry Inception, Registry Rotation, Backer Configuration sections"
  - type: implementation
    reference: "keripy — src/keri/vdr/eventing.py: Regery (registry collection manager), Registry class, rip event handling. LEGACY (v1 -- do NOT implement): VCP/VRT event handling"
  - type: implementation
    reference: "keriox/teliox — src/state.rs: ManagerTelState, registry management event processing"

domain_clients:
  - ref: "domain://credential-lifecycle"
    relationship: "Parent credential lifecycle domain delegates registry creation and management to this subdomain"
    via_port: "port://credential-lifecycle/registry/inbound/registry-management"

subdomains: []

kernels: []

adjacents:
  - ref: "domain://identity"
    relationship: "Registries are authorized via the issuer's KEL — the issuer AID in the rip event must have verifiable key state"
    pattern: "Conformist"
    via_port: "port://identity/inbound/identity-management"
    is_cross_cutting: false

externals:
  - name: "Registry Repository"
    abstraction: "Repository"
    ref: "port://credential-lifecycle/registry/outbound/registry-repository"
    implementation_notes: "Stores registry metadata, name-to-REGID mappings, and cached management state."

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    This is a leaf domain focused on registry lifecycle management. In keripy,
    the Regery class manages registry creation (makeRegistry), lookup by name
    (registryByName), and management event processing. The Registry class
    represents a single registry instance. In keriox, ManagerTelState tracks
    the registry's management state. The key insight is that registry configuration
    (blindability mode) is immutable after inception and constrains all subsequent
    credential events within that registry. In v2 there is no rotation event --
    the rip inception event is the only management event.
    LEGACY (v1 -- do NOT implement): vcp/vrt events, NoBackers trait, backer rotation.

issues: []

tags: ["registry", "inception", "blindable", "non-blindable", "backer-configuration", "regid", "credential-lifecycle"]
