# verification.yaml
domain_ref: "credential-lifecycle/registry"

properties:
  - invariant: "Registry inception event (rip) MUST have sequence number n == 0; any rip event with n != 0 MUST be rejected"
    term: "Registry Inception"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([event],
          Implies(event.t == 'rip',
            And(event.n == 0,
                Implies(event.n != 0, Not(is_valid_rip(event))))))
    notes: "Inception event is always the first in the registry management TEL. Boundary: n=0 is the only valid value."

  - invariant: "REGID MUST equal the SAID of the inception event; changing any field in the rip event MUST produce a different REGID; two registries with different inception content MUST have different REGIDs"
    term: "REGID"
    technique: smt
    formal:
      language: z3
      expression: |
        And(
          Implies(is_registry(r), r.regid == said_compute(r.rip_event)),
          Implies(And(is_registry(r1), is_registry(r2), r1.rip_event != r2.rip_event),
                  r1.regid != r2.regid)
        )
    notes: "REGID is cryptographically derived from inception content — uniqueness is guaranteed by the collision resistance of the SAID digest."

  - invariant: "Config traits set at inception (c field, e.g., NoBackers, EstOnly) MUST be immutable; any rotation event (vrt) that attempts to modify config traits MUST be rejected; config_traits(registry) MUST equal config_traits(rip_event) for all time"
    term: "Backer Configuration"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(inception_traits=st.lists(st.sampled_from(['NoBackers', 'EstOnly', 'DoNotDelegate']),
                                          min_size=0, max_size=3, unique=True),
               vrt_count=st.integers(min_value=1, max_value=5))
        def test_config_traits_immutable(inception_traits, vrt_count):
            registry = create_registry(config_traits=inception_traits)
            for _ in range(vrt_count):
                registry = apply_rotation(registry)
                assert registry.config_traits == inception_traits, (
                    f"Config traits must remain {inception_traits} after rotation, "
                    f"got {registry.config_traits}"
                )
    strategy: "st.lists of traits x st.integers for rotation count"
    notes: "Config traits are set once at inception and never change — even after multiple rotations."

  - invariant: "A VRT event on a registry with NoBackers trait MUST be rejected; only registries without NoBackers trait can accept rotation events"
    term: "Registry Rotation"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(has_nobackers=st.booleans())
        def test_vrt_requires_backers(has_nobackers):
            traits = ['NoBackers'] if has_nobackers else []
            registry = create_registry(config_traits=traits)
            vrt = build_vrt_event(registry)
            if has_nobackers:
                with pytest.raises(ValidationError, match='NoBackers registry cannot rotate'):
                    apply_vrt(registry, vrt)
            else:
                apply_vrt(registry, vrt)  # Must not raise
    strategy: "st.booleans() for NoBackers presence"
    notes: "Backerless registries have no backer set to rotate — VRT is structurally invalid for them."

  - invariant: "Every registry management event (rip, vrt) MUST be anchored via a seal in the issuer's KEL; an event without a corresponding KEL seal MUST be rejected"
    term: "Registry Inception"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(has_seal=st.booleans())
        def test_kel_seal_required(has_seal):
            registry = create_registry()
            event = build_registry_event(registry)
            if has_seal:
                kel = build_kel_with_seal(event)
                validate_registry_event(event, kel)  # Must not raise
            else:
                kel = build_kel_without_seal(event)
                with pytest.raises(ValidationError, match='missing KEL seal'):
                    validate_registry_event(event, kel)
    strategy: "st.booleans() for seal presence"
    notes: "KEL seal is the cryptographic anchor — without it, the registry event is unauthenticated."

  - invariant: "VRT event sequence number MUST equal current registry sn + 1; sn gaps and sn duplicates MUST be rejected"
    term: "Registry Rotation"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(current_sn=st.integers(min_value=0, max_value=100),
               delta=st.sampled_from([-1, 0, 1, 2, 5]))
        def test_vrt_sn_must_increment(current_sn, delta):
            registry = create_registry_at_sn(current_sn)
            vrt = build_vrt_event(registry, sn=current_sn + delta)
            if delta == 1:
                apply_vrt(registry, vrt)  # Must not raise
            else:
                with pytest.raises(ValidationError, match='sequence number'):
                    apply_vrt(registry, vrt)
    strategy: "st.integers for current sn, st.sampled_from for delta values"
    notes: "Strict sn increment by 1. No gaps, no duplicates, no reversals."

contracts:
  - port_ref: "port://credential-lifecycle/registry/inbound/registry-management"
    preconditions:
      - formal:
          language: python
          expression: "is_valid_aid(issuer_aid) and isinstance(name, str) and len(name) > 0"
        description: "Valid issuer AID and non-empty registry name required"
    postconditions:
      - formal:
          language: python
          expression: "is_valid_said(result) and get_registry(result).issuer == issuer_aid"
        description: "create_registry returns a valid REGID bound to the issuer"

  - port_ref: "port://credential-lifecycle/registry/inbound/registry-management"
    preconditions:
      - formal:
          language: python
          expression: "is_valid_said(regid) and not has_nobackers_trait(get_registry(regid))"
        description: "Registry must exist and have backers for rotation"
    postconditions:
      - formal:
          language: python
          expression: "result.sn == get_registry(regid).sn + 1"
        description: "Rotation increments the registry's management sequence number"
