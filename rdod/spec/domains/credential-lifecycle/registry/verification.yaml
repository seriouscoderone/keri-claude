# verification.yaml
domain_ref: "credential-lifecycle/registry"

properties:
  - invariant: "Registry inception event (rip) MUST have sequence number n == 0; any rip event with n != 0 MUST be rejected"
    term: "Registry Inception"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([event],
          Implies(event.t == 'rip',
            And(event.n == 0,
                Implies(event.n != 0, Not(is_valid_rip(event))))))
    notes: "Inception event is always the first in the registry management TEL. Boundary: n=0 is the only valid value."

  - invariant: "REGID MUST equal the SAID of the inception event; changing any field in the rip event MUST produce a different REGID; two registries with different inception content MUST have different REGIDs"
    term: "REGID"
    technique: smt
    formal:
      language: z3
      expression: |
        And(
          Implies(is_registry(r), r.regid == said_compute(r.rip_event)),
          Implies(And(is_registry(r1), is_registry(r2), r1.rip_event != r2.rip_event),
                  r1.regid != r2.regid)
        )
    notes: "REGID is cryptographically derived from inception content — uniqueness is guaranteed by the collision resistance of the SAID digest."

  - invariant: "Config traits set at inception (c field, e.g., EstOnly, DoNotDelegate) MUST be immutable; registry configuration cannot be changed after inception — there is no registry rotation event in v2"
    term: "Backer Configuration"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(inception_traits=st.lists(st.sampled_from(['EstOnly', 'DoNotDelegate']),
                                          min_size=0, max_size=2, unique=True))
        def test_config_traits_immutable(inception_traits):
            registry = create_registry(config_traits=inception_traits)
            assert registry.config_traits == inception_traits, (
                f"Config traits must equal inception traits {inception_traits}, "
                f"got {registry.config_traits}"
            )
    strategy: "st.lists of valid v2 traits"
    notes: "Config traits are set once at inception and never change. In v2 registry config is immutable — no rotation event exists. LEGACY (v1 -- do NOT implement): NoBackers was a config trait; vrt rotation events could change backer sets."

  - invariant: "LEGACY (v1 -- do NOT implement): VRT registry rotation events do not exist in v2. Registry configuration is immutable after rip inception. The v1 concept of NoBackers trait and backer rotation via vrt is superseded by the blindable/non-blindable registry model where configuration is permanently fixed at inception."
    term: "Registry Rotation"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(event_type=st.just('vrt'))
        def test_vrt_rejected_in_v2(event_type):
            registry = create_registry()
            vrt = build_event(registry, t=event_type)
            with pytest.raises(ValidationError, match='unknown event type'):
                apply_event(registry, vrt)
    strategy: "Attempt vrt event on any registry"
    notes: "v2 has no registry rotation. Registry config (blindable/non-blindable) is immutable after rip inception. LEGACY (v1 -- do NOT implement): vrt events rotated backer sets; NoBackers registries rejected vrt."

  - invariant: "Every registry management event (rip) MUST be anchored via a seal in the issuer's KEL; an event without a corresponding KEL seal MUST be rejected"
    term: "Registry Inception"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(has_seal=st.booleans())
        def test_kel_seal_required(has_seal):
            registry = create_registry()
            event = build_registry_event(registry)
            if has_seal:
                kel = build_kel_with_seal(event)
                validate_registry_event(event, kel)  # Must not raise
            else:
                kel = build_kel_without_seal(event)
                with pytest.raises(ValidationError, match='missing KEL seal'):
                    validate_registry_event(event, kel)
    strategy: "st.booleans() for seal presence"
    notes: "KEL seal is the cryptographic anchor — without it, the registry event is unauthenticated."

  - invariant: "LEGACY (v1 -- do NOT implement): VRT event sequence number handling does not apply in v2. Registry management TEL has only the rip inception event (sn == 0). There is no registry rotation in v2 — registry config is immutable after inception."
    term: "Registry Rotation"
    technique: property-based
    formal:
      language: python
      expression: |
        def test_registry_management_tel_has_single_event():
            registry = create_registry()
            management_tel = get_management_tel(registry.regid)
            assert len(management_tel) == 1, "v2 registry management TEL has exactly one event (rip)"
            assert management_tel[0].t == 'rip'
            assert management_tel[0].n == 0
    strategy: "Verify management TEL length after creation"
    notes: "v2 registry management TEL is a single rip event. LEGACY (v1 -- do NOT implement): vrt events incremented sn for backer rotation."

contracts:
  - port_ref: "port://credential-lifecycle/registry/inbound/registry-management"
    preconditions:
      - formal:
          language: python
          expression: "is_valid_aid(issuer_aid) and isinstance(name, str) and len(name) > 0"
        description: "Valid issuer AID and non-empty registry name required"
    postconditions:
      - formal:
          language: python
          expression: "is_valid_said(result) and get_registry(result).issuer == issuer_aid"
        description: "create_registry returns a valid REGID bound to the issuer"

  # LEGACY (v1 -- do NOT implement): Registry rotation contract removed.
  # In v2, registry config is immutable after rip inception. There is no vrt event
  # and no NoBackers trait check. The registry management TEL has exactly one event (rip at sn 0).
