# ubiquitous-language.yaml
domain_ref: "credential-lifecycle/registry"

terms:
  # Inherits: "Registry Inception" from domain://credential-lifecycle
  - term: "Registry Inception"
    synonyms: ["rip event", "vcp event LEGACY (v1 -- do NOT implement)"]
    specializes: "Registry Inception"
    definition: "In the context of the registry subdomain, registry inception is the initialization event that establishes the registry's REGID, binds it to the issuer AID, and sets immutable configuration (shieldable or non-shieldable mode). In TEL v2 this is the rip event; registry configuration is immutable after inception -- there is no rotation equivalent. LEGACY (v1 -- do NOT implement): the vcp event served this role, with mutable backer lists rotated via vrt."
    invariants:
      - "Message type t field must be 'rip'. LEGACY (v1): was 'vcp'"
      - "Field order: [v, t, d, u, i, n, dt] -- all required"
      - "Sequence number n must be 0"
      - "SAID of this event becomes the REGID referenced by the rd field in ACDCs"
      - "Must be authorized via a seal in the issuer's KEL"
      - "Registry mode (shieldable or non-shieldable) set at inception is immutable -- no rotation in v2"
    examples:
      - "Registry inception with issuer AID, non-shieldable mode, and UUID for unique identification"
      - "Shieldable registry inception with designated backer witnesses"
    related_terms: ["REGID", "Shieldable vs Non-Shieldable"]

  - term: "Registry Rotation"
    synonyms: ["vrt event LEGACY (v1 -- do NOT implement)"]
    definition: "LEGACY (v1 -- do NOT implement). In TEL v1, a management event (vrt) that updated a registry's backer configuration -- modifying the backer witness list and/or threshold. In TEL v2, registry configuration is immutable after inception (rip). There is no v2 equivalent of vrt. New implementations must NOT include registry rotation logic."
    invariants:
      - "LEGACY (v1 -- do NOT implement): vrt was valid only for registries with backers (not NoBackers trait)"
      - "LEGACY (v1 -- do NOT implement): updated the backer list via cuts (removals) and adds (additions)"
      - "In TEL v2: registry configuration is immutable after rip -- no rotation event exists"
      - "In TEL v2: if backer changes are needed, a new registry must be incepted"
    examples:
      - "LEGACY (v1): adding a new backer witness via vrt event with adds=[new_backer_AID] -- not valid in v2"
      - "v2: registry configuration established at rip is permanent; no vrt equivalent exists"
    related_terms: ["Registry Inception"]

  # Inherits: "REGID" from domain://credential-lifecycle (identical definition — parent owns this term)

  - term: "Registry Mode"
    synonyms: ["Shieldable/Non-Shieldable", "Backer Configuration"]
    definition: "The configuration of a registry's mode, set at inception (rip). Determines whether credential events use non-shieldable (upd) or shieldable (bup) event types. In v2, this replaces the v1 'NoBackers trait' / 'backed vs backerless' terminology. LEGACY (v1 -- do NOT implement): 'NoBackers' trait determined iss/rev vs bis/brv; backer list was mutable via vrt."
    invariants:
      - "Non-shieldable mode: credential events use upd"
      - "Shieldable mode: credential events use bup"
      - "Registry mode is immutable after inception (rip)"
      - "In v2: no registry rotation -- configuration cannot be changed after rip"
      - "LEGACY (v1 -- do NOT implement): 'NoBackers' trait -> iss/rev; backed -> bis/brv; backer list mutable via vrt"
    examples:
      - "Non-shieldable registry: simple mode with upd events"
      - "Shieldable registry: designated backer witnesses, uses bup events"
    related_terms: ["Registry Inception", "Shieldable vs Non-Shieldable"]

  - term: "Shieldable Registry"
    definition: "A registry operating in shieldable mode. All credential update events use the bup ilk and carry shielded attribute blocks with fresh BLIDs. Observers cannot distinguish state-changing updates from no-op decorrelation updates, protecting the credential holder's privacy."
    invariants:
      - "All credential events use bup (shieldable update) — upd events are rejected"
      - "Each bup carries a fresh BLID derived from a shared secret salt + sequence number"
      - "Decorrelation updates (no state change) are indistinguishable from real state changes"
      - "Registry creator chooses shieldable mode at inception (rip) — immutable thereafter"
    examples:
      - "Shieldable registry: issuer creates bup(ts='issued') with shielded attribute block — observer sees only a BLID"
      - "Decorrelation: issuer creates bup with unchanged state — observer cannot tell it's a no-op"
    related_terms: ["Registry Mode", "Shielded Attribute Block", "Registry Inception"]

  - term: "Non-Shieldable Registry"
    definition: "A registry operating in non-shieldable mode. All credential update events use the upd ilk with publicly observable transaction state (ta and ts fields). Simpler than shieldable mode — no shielding infrastructure needed."
    invariants:
      - "All credential events use upd (non-shieldable update) — bup events are rejected"
      - "Transaction ACDC SAID (ta) and transaction state (ts) are publicly visible"
      - "No decorrelation capability — state changes are observable"
      - "Registry creator chooses non-shieldable mode at inception (rip) — immutable thereafter"
    examples:
      - "Non-shieldable registry: issuer creates upd(ts='issued') — credential SAID and state are public"
      - "Revocation: issuer creates upd(ts='revoked') — observers can see the credential was revoked"
    related_terms: ["Registry Mode", "Registry Inception"]

events:
  - name: "RegistryIncepted"
    payload: "regid: REGID, issuer_aid: AID, mode: shieldable|non-shieldable"
    triggers: "Issuer creates a new registry via a rip (registry inception) event"

  - name: "RegistryRotated"
    payload: "LEGACY (v1 -- do NOT implement). No v2 equivalent -- registry configuration is immutable after rip."
    triggers: "LEGACY: Issuer rotated the registry's backer configuration via a vrt event -- not valid in v2"

rules:
  - "Registry inception (rip) must have sequence number 0"
  - "Registry mode (shieldable or non-shieldable) is set at inception and cannot be changed -- configuration is immutable in v2"
  - "LEGACY (v1 -- do NOT implement): registry rotation (vrt) was valid for registries with backers -- no v2 equivalent"
  - "Every registry management event must be authorized via the issuer's KEL"
  - "REGID is the SAID of the inception event -- it uniquely identifies the registry"
