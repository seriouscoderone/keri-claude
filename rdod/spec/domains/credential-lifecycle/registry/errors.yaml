# errors.yaml
domain_ref: "credential-lifecycle/registry"

# Error catalog for the Registry Management domain.
# Covers registry inception (rip) and backer configuration validation.
# In v2, registry config is immutable after inception — no rotation event exists.
# LEGACY (v1 -- do NOT implement): vcp inception, vrt rotation, NoBackers trait.
#
# Severity levels:
#   transient  — condition may self-resolve (escrow and retry)
#   recoverable — requires operator or protocol-level action
#   fatal      — unrecoverable; event is permanently rejected

errors:
  - name: "RegistryAlreadyExistsError"
    description: "Attempted to create a registry with a REGID that already exists"
    cause: "A registry inception event (rip) was submitted but a registry with this REGID is already established"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "regid"
        type: "string"
        description: "The duplicate REGID"
    related_port: "port://credential-lifecycle/registry/inbound/registry-management"

  - name: "RegistryNotOwnedError"
    description: "Issuer AID does not match the registry's owner"
    cause: "Credential issuance or registry rotation attempted by an AID that is not the registry's designated issuer"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "regid"
        type: "string"
        description: "The registry REGID"
      - field: "issuer_aid"
        type: "string"
        description: "The AID that attempted the operation"
      - field: "owner_aid"
        type: "string"
        description: "The registry's actual owner"
    related_port: "port://credential-lifecycle/registry/inbound/registry-management"

  - name: "InvalidBackerConfigError"
    description: "Registry backer configuration is invalid"
    cause: "Backer threshold exceeds backer count, or backer configuration is inconsistent with registry blindability mode"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "regid"
        type: "string"
        description: "The registry REGID"
      - field: "backer_count"
        type: "integer"
        description: "Number of backers"
      - field: "backer_threshold"
        type: "integer"
        description: "Configured threshold"
    related_port: "port://credential-lifecycle/registry/inbound/registry-management"

  # LEGACY (v1 -- do NOT implement): NoBackersRotationError removed.
  # In v2 there is no vrt rotation event and no NoBackers trait.
  # Registry config is immutable after rip inception.

  # LEGACY (v1 -- do NOT implement): RegistrySequenceError for VRT removed.
  # In v2 the registry management TEL has exactly one event (rip at sn 0).
  # There is no registry rotation, so no sequence number validation for management events beyond inception.

  - name: "MissingKELSealError"
    description: "Registry management event is not anchored in the issuer's KEL"
    cause: "A registry inception (rip) event was submitted without a corresponding anchor seal in the issuer's KEL"
    recovery: "escrow"
    recovery_target: "MAE"
    severity: "transient"
    context:
      - field: "regid"
        type: "string"
        description: "The registry REGID"
      - field: "issuer_aid"
        type: "string"
        description: "The issuer whose KEL lacks the seal"
      - field: "event_said"
        type: "string"
        description: "The SAID of the unanchored registry event"
    related_port: "port://credential-lifecycle/registry/inbound/registry-management"

  - name: "ConfigTraitMutationError"
    description: "Attempted to modify immutable config traits after registry inception"
    cause: "An event attempted to change config traits (e.g., EstOnly, DoNotDelegate) that were set at inception and are immutable — in v2 registry config cannot be changed after rip inception"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "regid"
        type: "string"
        description: "The registry REGID"
      - field: "inception_traits"
        type: "array[string]"
        description: "The config traits set at inception"
      - field: "attempted_traits"
        type: "array[string]"
        description: "The config traits in the rotation event"
    related_port: "port://credential-lifecycle/registry/inbound/registry-management"
