domain_ref: "credential-lifecycle/registry"

types:
  - name: "RegistryInceptionEvent"
    description: "Creates a new credential registry (rip). All credentials issued under this registry reference its REGID. This is the ACDC v2 normative event type."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["rip"]
            description: "Message type — registry inception"
          - name: "d"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID — becomes the REGID (self-addressing identifier of this event)"
          - name: "u"
            type: "string"
            required: false
            description: "UUID — shielding nonce for privacy (absent for public registries)"
          - name: "i"
            type: "types://cesr/primitives#AID"
            required: true
            description: "Issuer's AID prefix — identifies the controller who owns this registry. NOT equal to d; d is the REGID (SAID of the event), i is the issuer's AID."
          - name: "n"
            type: "string"
            required: true
            constraints:
              enum: ["0"]
            description: "Sequence number — hex-encoded, always '0' for inception"
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime — ISO 8601 timestamp"
        invariants:
          - "Field order: [v, t, d, u, i, n, dt]"
          - "d is the REGID (SAID of the event); i is the issuer's AID prefix — they are NOT equal"
          - "Must be authorized in the issuer's KEL via a seal"
          - "n is the sequence number field (not s as in legacy vcp events)"

  - name: "ShieldableUpdateEvent"
    description: "A shieldable update event (bup) for registries that support shielding. Carries a BLID (blinded attribute block digest) for decorrelation. The shielded state is NOT visible in the event body — state discovery requires the shared secret salt via the privacy/blinding domain."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["bup"]
            description: "Message type — shieldable update"
          - name: "d"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of this event"
          - name: "rd"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "Registry delegation — REGID of the managing registry"
          - name: "n"
            type: "string"
            required: true
            description: "Sequence number — hex-encoded, must equal prior sn + 1"
          - name: "p"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "Prior TEL event SAID — hash chain linkage"
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime — ISO 8601 timestamp"
          - name: "b"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "BLID — blinded attribute block digest. The shielded state is NOT visible in the event body; state discovery requires the shared secret salt via the privacy/blinding domain"
        invariants:
          - "Field order: [v, t, d, rd, n, p, dt, b]"
          - "bup does NOT carry ta or ts fields — those belong to upd (non-shieldable) events only"
          - "Each bup event carries a fresh BLID with new UUID for decorrelation"
          - "An observer cannot distinguish state-changing updates from no-op decorrelation updates"
          - "Must be authorized in the issuer's KEL via a seal"
          - "Builder: UpdateEvent.builder().shieldable().registry(regid).blid(blid).build()"

  - name: "NonShieldableUpdateEvent"
    description: "A non-shieldable update event (upd) for registries without shielding. Used for both issuance and revocation — the transaction state (ts) field determines the state transition."
    variants:
      - name: "default"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "t"
            type: "string"
            required: true
            constraints:
              enum: ["upd"]
            description: "Message type — non-shieldable update"
          - name: "d"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of this event"
          - name: "rd"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "Registry delegation — REGID of the managing registry"
          - name: "n"
            type: "string"
            required: true
            description: "Sequence number — hex-encoded, must equal prior sn + 1"
          - name: "p"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "Prior TEL event SAID — hash chain linkage"
          - name: "dt"
            type: "string"
            required: true
            description: "Datetime — ISO 8601 timestamp"
          - name: "ta"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "Transaction ACDC SAID — the credential this event applies to"
          - name: "ts"
            type: "string"
            required: true
            description: "Transaction state — the target state after this update"
            constraints:
              enum: ["issued", "revoked"]
        invariants:
          - "Field order: [v, t, d, rd, n, p, dt, ta, ts]"
          - "No shielding — credential state transitions are publicly observable"
          - "ts determines the credential state transition — not the event type"
          - "Must be authorized in the issuer's KEL via a seal"
          - "Builder: UpdateEvent.builder().nonShieldable().registry(regid).credential(said).state('revoked').build()"

  - name: "RegistryRotationEvent"
    description: "LEGACY v1 registry rotation (vrt) event type marker, retained for migration compatibility."
    variants:
      - name: "default"
        fields:
          - name: "note"
            type: "string"
            required: true
            description: "LEGACY — v1 vrt event, no v2 equivalent. Registries in v2 are immutable after inception."

  - name: "RegistryInceptionRequest"
    description: "Parameters for creating a new credential registry — pairs the issuer AID with registry configuration options."
    variants:
      - name: "default"
        fields:
          - name: "issuer_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the issuer who will own this registry"
          - name: "name"
            type: "string"
            required: true
            description: "Human-readable name for the registry"
          - name: "mode"
            type: "string"
            required: true
            description: "Whether the registry supports shielding"
            constraints:
              enum: ["shieldable", "non-shieldable"]
        invariants:
          - "Produces a RegistryInceptionEvent (rip) authorized in the issuer's KEL"

  - name: "RegistryRecord"
    description: "Stored metadata for a credential registry, persisted when the registry is created."
    variants:
      - name: "default"
        fields:
          - name: "registry_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "REGID — SAID of the registry inception event"
          - name: "issuer_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the issuer who owns this registry"
          - name: "mode"
            type: "string"
            required: true
            description: "Whether the registry supports shielding"
            constraints:
              enum: ["shieldable", "non-shieldable"]
          - name: "created_at"
            type: "string"
            required: true
            description: "ISO 8601 datetime when the registry was created"
        invariants:
          - "Immutable after creation — registry mode cannot change"
          - "mode determines whether credentials use bup (shieldable) or upd (non-shieldable) events"

  - name: "RegistryStateSnapshot"
    description: "The current state of a credential registry — derived from processing rip and update events."
    variants:
      - name: "default"
        fields:
          - name: "registry_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "REGID"
          - name: "issuer_aid"
            type: "types://cesr/primitives#AID"
            required: true
            description: "AID of the registry owner/issuer"
          - name: "sn"
            type: "integer"
            required: true
            description: "Registry management TEL sequence number"
          - name: "shieldable"
            type: "boolean"
            required: true
            description: "Whether this registry supports shielding (bup events) or not (upd events)"
        invariants:
          - "Derived from processing rip event and subsequent updates"
          - "sn tracks the registry management TEL sequence number. For a standard registry, sn is always 0 (single rip event). The credential-level TEL events (bup/upd) have their own sequence numbers tracked in credential-lifecycle/status, not here."
