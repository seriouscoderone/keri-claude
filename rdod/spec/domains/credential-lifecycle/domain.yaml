# domain.yaml

template_version: "2.0"

id: "credential-lifecycle"

name: "Credential Lifecycle"

description: >
  Issue, track, and revoke credentials — managing a credential from creation
  through revocation. Transaction Event Logs (TELs) provide hash-chained event
  structures authorized by the issuer's identity history that track dynamic ACDC
  state without requiring direct signatures on TEL events. TELs support both
  public (unblinded) and private (blinded) state registries.

  Boundary guide for consumers — three sibling domains cover credentials:
  credential-lifecycle owns the state machine (issue, revoke, verify status).
  credential-exchange owns sharing credentials with others (IPEX negotiation).
  privacy owns controlling what gets revealed (graduated disclosure, blinding).
  If you need to create/revoke/check a credential, you're here. If you need
  to send it to someone, go to credential-exchange. If you need to control
  what's visible, go to privacy.

version: "0.1.0"
tier: "domain"

source_material:
  - type: document
    reference: "acdc-specification.md — Transaction Event Logs (TELs) as ACDC State Registries section"
  - type: document
    reference: "acdc-specification.md — Binding to Key State at Time of ACDC State Change section"
  - type: document
    reference: "KERIArchGroupIssuance.md — KERI architectures for group issuance"
  - type: implementation
    reference: "keripy — src/keri/vdr/viring.py (Reger: TEL database), src/keri/vdr/eventing.py (Tever/Tevery: TEL state/processor, Regery: registry collection)"
  - type: implementation
    reference: "keriox/teliox — src/state.rs (TelState, ManagerTelState), src/processor.rs (TelEventProcessor), src/event/verifiable_event.rs (VerifiableEvent), src/database/mod.rs (TelEventDatabase trait)"

published_language:
  - term: "ACDC"
    description: "Authentic Chained Data Container — the credential type used across exchange, lifecycle, and privacy domains"
  - term: "Credential Type Dimensions"
    description: "Six orthogonal credential classification dimensions — referenced by all ACDC subdomains"
  - term: "Issuee"
    description: "Credential recipient AID — referenced in exchange and privacy domains"
  - term: "Issuer"
    description: "Credential creator AID — referenced in lifecycle, exchange, and privacy domains"
  - term: "TEL Registrar"
    description: "TEL Registrar — maintains and publishes registry TEL state updates"
  - term: "Credentialer"
    description: "Issues and manages ACDC credentials — validates schemas, creates credential events"
  - term: "Seeker"
    description: "Credential search index — full-text search for credentials by schema, issuer, subject"
  - term: "TEL"
    description: "Transaction Event Log — hash-chained log tracking ACDC state"
  - term: "Registry"
    description: "Verifiable Container/Credential Registry — tracks issuance and revocation state"

domain_clients: []

subdomains:
  - ref: "domain://credential-lifecycle/status"
    relationship: "Credential and registry state machines — tracks lifecycle (NotIssued -> Issued -> Revoked) and registry management state"
  - ref: "domain://credential-lifecycle/verification"
    relationship: "Multi-step validation pipeline for TEL events — KEL authorization verification, escrow management, escrow reprocessing triggers"
  - ref: "domain://credential-lifecycle/registry"
    relationship: "Credential registry management — creating, configuring, and managing the containers that track groups of credentials"

kernels: []

adjacents:
  - ref: "domain://cesr"
    pattern: "conformist"
    relationship: "CESR primitives (SAID, AID, Diger) adopted natively in credential and TEL data structures"
  - ref: "domain://credential-exchange"
    relationship: "Partnership — credential-lifecycle issues credentials that credential-exchange shares with verifiers"
    pattern: "Partnership"
  - ref: "domain://privacy"
    relationship: "Partnership — credential-lifecycle creates credentials with privacy properties that privacy domain governs during disclosure"
    pattern: "Partnership"
  - ref: "domain://identity"
    relationship: "Conformist — credential status changes are authorized by the issuer's identity history via the IdentityService"
    pattern: "Conformist"
    via_port: "port://identity/anchoring/inbound/data-anchoring"

externals:
  - name: "Credential Store"
    abstraction: "Repository"
    ref: "port://credential-lifecycle/outbound/credential-store"
    implementation_notes: >
      Stores raw ACDC credential bytes keyed by SAID, with indexes by issuer,
      subject, and schema. Separate from the TelRepository (which stores TEL
      events and escrow queues) — this stores the credential content itself.
      The StatusService manages TEL events via TelRepository; this store holds
      the actual credential payloads that those events refer to.

implementation_guidance:
  suggested_type: "module"
  language_affinity: "any"
  notes: >
    The TEL is implemented alongside the KEL in KERI infrastructure. Registry events
    use ACDC protocol version strings and message types (rip, bup, upd). The key
    insight is that TEL events derive their non-repudiability from the issuer's
    identity history authorization, not from direct signatures. Blinded registries
    require a shared secret salt between issuer and discloser for hierarchically
    deterministic UUID derivation.

    Service-wraps-Repository pattern (TEL): The StatusService applies the same
    Service-wraps-Repository pattern defined in domain://identity (see
    identity/domain.yaml implementation_guidance for the full pattern). The
    StatusService validates credential state changes (KEL authorization verification,
    registry state transitions, escrow management) before committing to the
    TelRepository.

issues: []

tags: ["state", "registry", "revocation", "issuance", "credential-lifecycle"]
