# ports.yaml
domain_ref: "credential-lifecycle/verification"

ports:
  # Inbound -- what clients call
  - id: "port://credential-lifecycle/verification/inbound/validate-tel-event"
    type: inbound
    name: "TEL Event Validation"
    semantics: command
    idempotent: false
    contract:
      input: "types://credential-lifecycle/verification#VerifiableEvent"
      output: "types://credential-lifecycle/verification#TelValidationPassed"
      errors:
        - "errors://credential-lifecycle/verification#TELChainBrokenError"
        - "errors://credential-lifecycle/verification#SchemaValidationError"
        - "errors://credential-lifecycle/verification#RevokedCredentialError"
        - "errors://credential-lifecycle/verification#RegistryStateUnavailableError"
        - "errors://credential-lifecycle/verification#MissingSealError"
        - "errors://credential-lifecycle/verification#IssuerKELUnavailableError"
        - "errors://credential-lifecycle/verification#InvalidTransitionError"
        - "errors://credential-lifecycle/verification#OutOfOrderTELError"
        - "errors://credential-lifecycle/verification#IncompleteVerifiableEventError"
    refs: ["domain://credential-lifecycle"]

  - id: "port://credential-lifecycle/verification/inbound/process-escrows"
    type: inbound
    name: "Escrow Processing"
    semantics: command
    idempotent: false
    contract:
      input: "types://credential-lifecycle/verification#TelNotification"
      output: "types://credential-lifecycle/verification#TelEscrowReprocessed"
      errors:
        - "errors://credential-lifecycle/verification#EscrowTimeoutError"
    refs: ["domain://credential-lifecycle"]

  # Outbound -- what verification calls
  - id: "port://credential-lifecycle/verification/outbound/kel-and-state-lookup"
    type: outbound
    name: "KEL and State Lookup"
    semantics: query
    idempotent: true
    contract:
      input: "types://cesr/primitives#SAID"
      output: "types://credential-lifecycle/status#LifecycleStateSnapshot"
      errors: []
    refs: ["persistence"]
    invariants:
      - "Read-only: this port never mutates state, only queries it"
      - "Consistency: returned state reflects all events processed up to the point of the query"

  - id: "port://credential-lifecycle/verification/outbound/escrow-repository"
    type: outbound
    name: "Verification Escrow Repository"
    semantics: command
    idempotent: false
    contract:
      input: "types://credential-lifecycle/verification#VerifiableEvent"
      output: "types://credential-lifecycle/verification#VerifiableEvent"
      errors: []
    refs: ["persistence"]
    invariants:
      - "Escrow is transient: events are removed once the blocking condition is resolved"
      - "Escrow type partitioning: each escrow type is an independent namespace"
      - "Filter support: get_escrowed accepts filters by registry SAID, sequence number, or event SAID"
