# ports.yaml
domain_ref: "credential-lifecycle/verification"

ports:
  # Inbound -- VerificationService interface
  - id: "port://credential-lifecycle/verification/inbound/verify"
    type: inbound
    name: "Verify Credential"
    semantics: command
    idempotent: false
    description: >
      Primary VerificationService operation — verifies the full authorization
      chain for a credential: was it authorized by a valid issuer whose identity
      history commits the authorization? Checks registry state, schema
      conformance, edge chain integrity, and issuer key state.
    contract:
      input: "types://credential-lifecycle/verification#VerifiableEvent"
      output: "types://credential-lifecycle/verification#TelValidationPassed"
      errors:
        - "errors://credential-lifecycle/verification#TELChainBrokenError"
        - "errors://credential-lifecycle/verification#SchemaValidationError"
        - "errors://credential-lifecycle/verification#RevokedCredentialError"
        - "errors://credential-lifecycle/verification#RegistryStateUnavailableError"
        - "errors://credential-lifecycle/verification#MissingSealError"
        - "errors://credential-lifecycle/verification#IssuerKELUnavailableError"
        - "errors://credential-lifecycle/verification#InvalidTransitionError"
        - "errors://credential-lifecycle/verification#OutOfOrderTELError"
        - "errors://credential-lifecycle/verification#IncompleteVerifiableEventError"
    refs: ["domain://credential-lifecycle"]

  - id: "port://credential-lifecycle/verification/inbound/reprocess-pending"
    type: inbound
    name: "Reprocess Pending Verifications"
    semantics: command
    idempotent: false
    description: >
      Drains verification escrow queues — re-verifies credentials whose
      blocking condition (missing registry, missing chain, missing schema) may
      have been resolved.
    contract:
      input: "types://credential-lifecycle/verification#TelNotification"
      output: "types://credential-lifecycle/verification#TelEscrowReprocessed"
      errors:
        - "errors://credential-lifecycle/verification#EscrowTimeoutError"
    refs: ["domain://credential-lifecycle"]

  # Outbound -- VerificationService dependencies
  - id: "port://credential-lifecycle/verification/outbound/authorization-lookup"
    type: outbound
    name: "Authorization Lookup"
    semantics: query
    idempotent: true
    description: >
      Queries the IdentityService and StatusService to check whether the
      authorization chain for a credential is complete — issuer's identity
      history, credential status, and registry state.
    contract:
      input: "types://cesr/primitives#SAID"
      output: "types://credential-lifecycle/status#LifecycleStateSnapshot"
      errors: []
    refs: ["domain://externals/persistence"]
    invariants:
      - "Read-only: this port never mutates state, only queries it"
      - "Consistency: returned state reflects all events processed up to the point of the query"

  - id: "port://credential-lifecycle/verification/outbound/verification-repository"
    type: outbound
    name: "Verification Repository"
    semantics: command
    idempotent: false
    description: >
      Persistence for credentials pending verification — partitioned by missing
      prerequisite type (missing registry, missing chain, missing schema).
    contract:
      input: "types://credential-lifecycle/verification#VerifiableEvent"
      output: "types://credential-lifecycle/verification#VerifiableEvent"
      errors: []
    refs: ["domain://externals/persistence"]
    invariants:
      - "Escrow is transient: events are removed once the blocking condition is resolved"
      - "Escrow type partitioning: each escrow type is an independent namespace"
      - "Filter support: get_escrowed accepts filters by registry SAID, sequence number, or event SAID"
