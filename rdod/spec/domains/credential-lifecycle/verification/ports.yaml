# ports.yaml
domain_ref: "credential-lifecycle/verification"

ports:
  # Inbound -- what clients call
  - id: "port://credential-lifecycle/verification/inbound/validate-tel-event"
    type: inbound
    name: "TEL Event Validation"
    contract: "validate_event(verifiable_event: VerifiableEvent, registry_state: RegistryStateSnapshot, credential_state: CredentialStateSnapshot) -> Result<TelValidationPassed, TelValidationEscrowed|InvalidTransitionError>"
    protocol: "method-call"
    refs: ["domain://credential-lifecycle"]

  - id: "port://credential-lifecycle/verification/inbound/process-escrows"
    type: inbound
    name: "Escrow Processing"
    contract: "process_escrows(escrow_type: EscrowType) -> [Result<TelEscrowReprocessed>]; notify(notification: TelNotification) -> void"
    protocol: "method-call"
    refs: ["domain://credential-lifecycle"]

  # Outbound -- what verification calls
  - id: "port://credential-lifecycle/verification/outbound/kel-and-state-lookup"
    type: outbound
    name: "KEL and State Lookup"
    contract: "get_kel_event(issuer_aid: AID, sn: int) -> Result<KeyEvent, NotFound>; get_registry_state(registry_said: SAID) -> Result<RegistryStateSnapshot, NotFound>; get_credential_state(registry_said: SAID, credential_said: SAID) -> Result<CredentialStateSnapshot, NotFound>"
    protocol: "method-call"
    refs: ["persistence"]
    invariants:
      - "Read-only: this port never mutates state, only queries it"
      - "Consistency: returned state reflects all events processed up to the point of the query"

  - id: "port://credential-lifecycle/verification/outbound/escrow-repository"
    type: outbound
    name: "Verification Escrow Repository"
    contract: "escrow_event(escrow_type: EscrowType, verifiable_event: VerifiableEvent) -> Result; get_escrowed(escrow_type: EscrowType, filter: EscrowFilter) -> [VerifiableEvent]; remove_escrowed(escrow_type: EscrowType, event_said: SAID) -> Result"
    protocol: "method-call"
    refs: ["persistence"]
    invariants:
      - "Escrow is transient: events are removed once the blocking condition is resolved"
      - "Escrow type partitioning: each escrow type is an independent namespace"
      - "Filter support: get_escrowed accepts filters by registry SAID, sequence number, or event SAID"
