# errors.yaml
domain_ref: "credential-lifecycle/verification"

# Error catalog for the TEL Verification domain.
# Covers the five-step TEL Validation Pipeline, KEL anchor verification,
# escrow routing, and credential state transitions.
#
# Severity levels:
#   transient  — condition may self-resolve (escrow and retry)
#   recoverable — requires operator or protocol-level action
#   fatal      — unrecoverable; event is permanently rejected

errors:
  - name: "TELChainBrokenError"
    description: "TEL event cannot be verified because the chain back to the KEL is broken"
    cause: "The TEL event references a KEL seal that does not exist in the issuer's KEL, or the issuer's KEL is not available"
    recovery: "escrow"
    recovery_target: "MAE"
    severity: "transient"
    context:
      - field: "credential_said"
        type: "types://cesr/primitives#SAID"
        description: "The credential being verified"
      - field: "missing_component"
        type: "string"
        description: "What's missing: issuer_kel, kel_seal, tel_event"
    related_port: "port://credential-lifecycle/verification/inbound/verify"

  - name: "SchemaValidationError"
    description: "Credential attributes do not conform to the declared schema"
    cause: "The ACDC's attribute section does not pass JSON Schema 2020-12 validation against the schema identified by the s field"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "credential_said"
        type: "types://cesr/primitives#SAID"
        description: "The invalid credential's SAID"
      - field: "schema_said"
        type: "types://cesr/primitives#SAID"
        description: "The schema SAID"
      - field: "validation_errors"
        type: "array[string]"
        description: "Schema validation error messages"
    related_port: "port://credential-lifecycle/verification/inbound/verify"

  - name: "RevokedCredentialError"
    description: "Credential is in Revoked state and cannot be used for presentation"
    cause: "The TEL shows a revocation event for this credential — it is no longer valid"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "credential_said"
        type: "types://cesr/primitives#SAID"
        description: "The revoked credential"
      - field: "revocation_datetime"
        type: "string"
        description: "When the credential was revoked"
    related_port: "port://credential-lifecycle/verification/inbound/verify"

  - name: "RegistryStateUnavailableError"
    description: "The registry's rip/management TEL is not yet available"
    cause: "TEL validation pipeline step 2 failed — registry state cannot be computed because the registry inception event (rip) has not been received"
    recovery: "escrow"
    recovery_target: "MRE"
    severity: "transient"
    context:
      - field: "regid"
        type: "types://cesr/primitives#SAID"
        description: "The REGID of the unknown registry"
      - field: "event_said"
        type: "types://cesr/primitives#SAID"
        description: "The SAID of the TEL event awaiting registry state"
    related_port: "port://credential-lifecycle/verification/inbound/verify"

  - name: "MissingSealError"
    description: "The issuer's KEL event exists but does not contain the expected anchor seal"
    cause: "TEL validation pipeline step 3 failed — the KEL event at the stated position does not contain a seal matching the TEL event's sn and SAID"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "regid"
        type: "types://cesr/primitives#SAID"
        description: "The registry REGID"
      - field: "tel_event_said"
        type: "types://cesr/primitives#SAID"
        description: "The SAID of the TEL event"
      - field: "kel_event_sn"
        type: "integer"
        description: "The KEL event sequence number that was checked"
      - field: "issuer_aid"
        type: "types://cesr/primitives#AID"
        description: "The issuer's AID"
    related_port: "port://credential-lifecycle/verification/inbound/verify"

  - name: "IssuerKELUnavailableError"
    description: "The issuer's KEL event at the anchor seal point has not been received"
    cause: "TEL validation pipeline step 3 failed — the issuer's KEL event at the sequence number stated in the attached seal is not yet available"
    recovery: "escrow"
    recovery_target: "MIE"
    severity: "transient"
    context:
      - field: "issuer_aid"
        type: "types://cesr/primitives#AID"
        description: "The issuer's AID"
      - field: "kel_sn"
        type: "integer"
        description: "The KEL sequence number that is missing"
      - field: "tel_event_said"
        type: "types://cesr/primitives#SAID"
        description: "The SAID of the TEL event awaiting issuer KEL"
    related_port: "port://credential-lifecycle/verification/inbound/verify"

  - name: "InvalidTransitionError"
    description: "TEL event represents an invalid credential state transition"
    cause: "TEL validation pipeline step 5 failed — the event violates State Transition Rules (e.g., revoking a credential that is not in Issued state, or issuing a credential that is already Issued)"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "credential_said"
        type: "types://cesr/primitives#SAID"
        description: "The credential SAID"
      - field: "current_state"
        type: "string"
        description: "The credential's current state (NotIssued, Issued, Revoked)"
      - field: "attempted_transition"
        type: "string"
        description: "The transition the event attempted (e.g., upd with ts='issued', upd with ts='revoked', bup with ts='issued', bup with ts='revoked')"
    related_port: "port://credential-lifecycle/verification/inbound/verify"

  - name: "OutOfOrderTELError"
    description: "TEL event sequence number does not match the expected next sequence number"
    cause: "A preceding TEL event is missing — the event's sn is ahead of the current TEL state"
    recovery: "escrow"
    recovery_target: "OOT"
    severity: "transient"
    context:
      - field: "regid"
        type: "types://cesr/primitives#SAID"
        description: "The registry REGID"
      - field: "received_sn"
        type: "integer"
        description: "The sequence number of the received TEL event"
      - field: "expected_sn"
        type: "integer"
        description: "The expected next sequence number"
    related_port: "port://credential-lifecycle/verification/inbound/verify"

  - name: "IncompleteVerifiableEventError"
    description: "TEL event is missing its attached KEL anchor seal"
    cause: "The VerifiableEvent bundle is incomplete — the TEL event was received without its AttachedSourceSeal, making validation impossible"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "event_said"
        type: "types://cesr/primitives#SAID"
        description: "The SAID of the TEL event"
      - field: "missing_field"
        type: "string"
        description: "The missing component (attached_seal, seal.s, seal.d)"
    related_port: "port://credential-lifecycle/verification/inbound/verify"

  - name: "InsufficientBackerSignaturesError"
    description: "Backer signatures on the TEL event do not meet the registry's backer threshold"
    cause: "A bup event was received with fewer backer signatures than required by the registry's backer threshold expression — partial signatures are escrowed until the threshold is met"
    recovery: "escrow"
    recovery_target: "PWE"
    severity: "transient"
    context:
      - field: "event_said"
        type: "types://cesr/primitives#SAID"
        description: "The SAID of the bup event with insufficient backer signatures"
      - field: "received_count"
        type: "integer"
        description: "Number of verified backer signatures received so far"
      - field: "required_threshold"
        type: "string"
        description: "The backer signature threshold expression that was not satisfied"
      - field: "registry_said"
        type: "types://cesr/primitives#SAID"
        description: "The REGID of the registry whose backer threshold was not met"
    related_port: "port://credential-lifecycle/verification/inbound/verify"

  - name: "EscrowTimeoutError"
    description: "Escrowed TEL event exceeded its time-to-live and was pruned"
    cause: "The blocking condition for an escrowed event did not resolve within the configured TTL"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "escrow_type"
        type: "types://credential-lifecycle/verification#EscrowType"
        description: "The escrow queue type (OOT, MRE, MIE, MAE, MSE, MCE, PWE)"
      - field: "event_said"
        type: "types://cesr/primitives#SAID"
        description: "The SAID of the pruned event"
      - field: "age_seconds"
        type: "integer"
        description: "How long the event was escrowed before pruning"
    related_port: "port://credential-lifecycle/verification/inbound/reprocess-pending"
