# verification.yaml
domain_ref: "credential-lifecycle"

properties:
  - invariant: "Events are hash-chained via prior event SAID (p field)"
    term: "TEL"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([i], Implies(
          And(i > 0, i < tel_length),
          tel_event(i).p == said_compute(tel_event(i - 1))
        ))
    notes: "Backward hash-chain integrity — each event references the preceding event's SAID"

  - invariant: "Sequence numbers (n field) are monotonically increasing, hex-encoded, zero-based"
    term: "TEL"
    technique: smt
    formal:
      language: z3
      expression: |
        And(
          tel_event(0).n == 0,
          ForAll([i], Implies(
            And(i > 0, i < tel_length),
            tel_event(i).n == tel_event(i - 1).n + 1
          ))
        )
    notes: "Strict monotonic sequence with no gaps, starting at zero"

  - invariant: "Each event must be authorized via a seal in the controlling KEL"
    term: "TEL"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda tel_event, kel: exists_seal_in_kel(
          kel, issuer_aid=tel_event.i,
          seal_sn=tel_event.n, seal_said=said_compute(tel_event)
        )
    strategy: "Generate TEL events with and without KEL seals; verify only sealed events accepted"
    notes: "KEL seal is the cryptographic authorization for TEL events"

  - invariant: "Registry inception rip event must have sequence number 0"
    term: "Registry Inception"
    technique: smt
    formal:
      language: z3
      expression: "Implies(event.t == 'rip', event.n == 0)"
    notes: "Inception event is always the first in the TEL"

  - invariant: "SAID of the rip event is the registry's unique identifier (REGID)"
    term: "Registry"
    technique: smt
    formal:
      language: z3
      expression: "Implies(is_registry(r), r.regid == said_compute(r.rip_event))"
    notes: "REGID is cryptographically derived from inception content"

  - invariant: "Cannot mix modes within a single registry — all credential events follow the registry's blindability mode"
    term: "Blindable vs Non-blindable"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda registry, events: (
          mode := 'non-blindable' if is_non_blindable(registry) else 'blindable',
          non_blindable_types := {'upd'},
          blindable_types := {'bup'},
          valid_types := non_blindable_types if mode == 'non-blindable' else blindable_types,
          all(e.t in valid_types for e in events if e.t not in {'rip'})
        )[-1]
    strategy: "Generate registries with both modes; attempt cross-mode events; verify rejected"
    notes: "Mode set at inception, enforced on all subsequent credential events. LEGACY (v1 -- do NOT implement): NoBackers trait mapped to iss/rev (backerless), backed mapped to bis/brv, vrt for rotation"

  - invariant: "Credential update events MUST use t == 'upd' (non-blindable) or t == 'bup' (blindable) with a ts field indicating the target state ('issued' or 'revoked'); the ts field distinguishes issuance from revocation within the same event type"
    term: "Update Event"
    technique: property-based
    formal:
      language: python
      expression: |
        @given(event=tel_event_strategy(), tamper_type=st.booleans())
        def test_update_event_ilk(event):
            if event.is_credential_update():
                assert event.get('t') in ('upd', 'bup'), (
                    f"Credential update event must have t in ('upd', 'bup'), got '{event.get('t')}'"
                )
                assert event.get('ts') in ('issued', 'revoked'), (
                    f"Credential update event must have ts in ('issued', 'revoked'), got '{event.get('ts')}'"
                )
            # Events with wrong ilk for their purpose must be rejected
            if event.get('t') not in ('rip', 'upd', 'bup'):
                with pytest.raises(ValidationError, match='unknown event type'):
                    validate_tel_event(event)
    strategy: "tel_event_strategy() generating all TEL event types"
    notes: "v2 TEL has three recognized ilks: rip (inception), upd (non-blindable update), bup (blindable update). The ts field carries the target state. LEGACY (v1 -- do NOT implement): iss, bis, rev, brv, vcp, vrt were separate ilks."

  - invariant: "State is determined by the latest transaction event in the TEL"
    term: "Credential State"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda tel_events, expected_state: (
          replay_state(tel_events) == expected_state
        )
    strategy: "Generate TEL event sequences; verify final state matches replay result"
    notes: "State is a function of the complete event log"

contracts:
  - port_ref: "port://credential-lifecycle/inbound/state-management"
    preconditions:
      - formal:
          language: python
          expression: "is_valid_aid(issuer_aid)"
        description: "Issuer AID must be valid for registry creation"
    postconditions:
      - formal:
          language: python
          expression: "is_valid_said(result) and result == said_compute(rip_event)"
        description: "create_registry returns a REGID equal to the rip event's SAID"

  - port_ref: "port://credential-lifecycle/inbound/state-management"
    preconditions:
      - formal:
          language: python
          expression: "is_valid_said(regid) and is_valid_said(acdc_said) and get_state(regid, acdc_said) == 'NotIssued'"
        description: "Registry must exist and credential must be in NotIssued state for issuance"
    postconditions:
      - formal:
          language: python
          expression: "result.t in ('upd', 'bup') and get_state(regid, acdc_said) == 'Issued'"
        description: "Issue produces an update event and transitions credential to Issued state"

  - port_ref: "port://credential-lifecycle/outbound/kel-sealing"
    preconditions:
      - formal:
          language: python
          expression: "is_valid_aid(issuer_aid) and event_sn >= 0 and is_valid_said(event_said)"
        description: "Valid issuer AID, non-negative sequence number, valid event SAID"
    postconditions:
      - formal:
          language: python
          expression: |
            any(
              seal.s == event_sn and seal.d == event_said
              for seal in result.anchors
            )
        description: "Returned KEL event contains a seal matching the TEL event's sn and SAID"

validation_constraints:
  - id: "C1_registry_known"
    constraint: "Registry REGID must resolve to a known registry with management TEL"
    depends_on: []
    on_failure: "escrow — registry rip event not yet received"

  - id: "C2_credential_identified"
    constraint: "Credential SAID must be extractable from the TEL event"
    depends_on: ["C1_registry_known"]
    on_failure: "reject — malformed TEL event"

  - id: "C3_state_transition_valid"
    constraint: "Requested state transition must be valid per the credential state machine (NotIssued→Issued, Issued→Revoked)"
    depends_on: ["C1_registry_known", "C2_credential_identified"]
    on_failure: "reject — InvalidCredentialStateTransition"

  - id: "C4_kel_authorization_verified"
    constraint: "Issuer's KEL must contain an authorization seal binding this TEL event"
    depends_on: ["C2_credential_identified"]
    on_failure: "escrow — issuer's KEL not yet available"

  - id: "C5_accept"
    constraint: "All constraints satisfied — TEL event accepted, credential state updated"
    depends_on: ["C3_state_transition_valid", "C4_kel_authorization_verified"]
    on_failure: null
