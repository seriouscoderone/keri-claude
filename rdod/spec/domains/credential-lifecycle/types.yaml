domain_ref: "credential-lifecycle"

types:
  - name: "CredentialState"
    description: "The state machine for a credential's lifecycle within a registry."
    variants:
      - name: "default"
        fields:
          - name: "state"
            type: "string"
            required: true
            description: "Current lifecycle state"
            constraints:
              enum: ["NotIssued", "Issued", "Revoked"]
          - name: "credential_said"
            type: "string"
            required: true
            description: "The ACDC SAID"
          - name: "registry_said"
            type: "string"
            required: true
            description: "The REGID"
          - name: "sn"
            type: "integer"
            required: true
            description: "TEL sequence number of the latest state-changing event"
          - name: "issued_at"
            type: "string"
            required: false
            description: "ISO 8601 datetime of issuance (absent if NotIssued)"
          - name: "revoked_at"
            type: "string"
            required: false
            description: "ISO 8601 datetime of revocation (absent if not Revoked)"
        invariants:
          - "State transitions: NotIssued → Issued (via bup/upd with ts='issued') → Revoked (via bup/upd with ts='revoked')"
          - "No reverse transitions — Revoked is terminal"
          - "Cannot skip states — must issue before revoking"
        notes: |
          Explicit FSM (L5-O23):
            NotIssued --[upd/bup ts='issued']--> Issued
            Issued    --[upd/bup ts='revoked']--> Revoked
            Revoked   --[any]--> REJECTED (guard failure, event permanently rejected)

          L2-O15 / L5-O15: REJECTED is NOT a credential state. It is a guard failure classification
          returned by the StatusService when a TEL event requests an invalid state transition
          (e.g., revoking a NotIssued credential, or re-issuing an already-Issued credential).
          REJECTED events are returned as StatusWriteOutcome.rejected — they are never stored in
          the TEL and do not modify the credential's lifecycle state. The credential remains in
          its current state (NotIssued or Revoked) after a REJECTED outcome.

  # ACDC credential types
  - name: "Credential"
    description: "An Authentic Chained Data Container (ACDC). Formal verifiable credential with six orthogonal type dimensions expressed through field presence/absence."
    variants:
      - name: "public-untargeted"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string — ACDC protocol, version, serialization kind, size"
            constraints:
              pattern: "ACDC[A-Za-z0-9_-]{13}\\."
          - name: "d"
            type: "string"
            required: true
            description: "SAID — self-addressing identifier of this credential"
          - name: "i"
            type: "string"
            required: true
            description: "Issuer AID — the identifier that issued this credential"
          - name: "s"
            type: "string"
            required: true
            description: "Schema SAID — reference to the JSON Schema defining this credential's structure"
          - name: "a"
            type: "map"
            required: true
            description: "Attribute section — contains the credential's claims. Has its own d (SAID) field."
        invariants:
          - "No u field — credential content is public (discoverable)"
          - "No i field in attribute section — credential is untargeted (bearer)"
          - "Lowercase a (not uppercase A) — direct attribute disclosure, not selective"
        examples:
          - format: "json"
            description: "Public targeted ACDC credential"
            value: |
              {"v":"ACDC10JSON000197_","d":"EElymNmgs1u0mSaoCeOtSsNOROLuqOz103V3-4E-ClXH","i":"EMl4RhuR_JxpiMd1N8DEJEhTxM3Ovvn9Xya8AN-tiUbl","ri":"EB-u4VAF7A7_GR8PXJoAVHv5X9vjtXew8Yo6Z3w9mQUQ","s":"EMQWEcCnVRk1hatTNyK3sIykYSrrFvafX3bHQ9Gkk1kC","a":{"d":"EO9_6NattzsFiO8Fw1cxjYmDjOsKKSbootn-wXn9S3iB","dt":"2021-06-27T21:26:21.233257+00:00","i":"EMl4RhuR_JxpiMd1N8DEJEhTxM3Ovvn9Xya8AN-tiUbl","LEI":"254900OPPU84GM83MG36"}}
            notes: "Public (no u field), targeted (a.i present), with registry (ri). From keripy test_protocoling.py"

      - name: "private-targeted"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "u"
            type: "string"
            required: true
            description: "UUID — high-entropy shielding factor for privacy"
            constraints:
              min_length: 22
          - name: "i"
            type: "string"
            required: true
            description: "Issuer AID"
          - name: "s"
            type: "string"
            required: true
            description: "Schema SAID"
          - name: "a"
            type: "map"
            required: true
            description: "Attribute section — must include u (shielding), i (issuee), d (SAID)"
        invariants:
          - "Top-level u field present with >= 128 bits of entropy — content is private"
          - "Attribute section a must contain u field (shielding factor) and i field (issuee AID)"
          - "Attribute section a.i is the issuee — credential is targeted to this AID"

      - name: "private-targeted-selective"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "u"
            type: "string"
            required: true
            description: "UUID — shielding factor"
          - name: "i"
            type: "string"
            required: true
            description: "Issuer AID"
          - name: "s"
            type: "string"
            required: true
            description: "Schema SAID"
          - name: "A"
            type: "string"
            required: true
            description: "Attribute aggregate — AGID commitment to the set of selectively-disclosable attributes"
        invariants:
          - "Uppercase A field (not lowercase a) — selective disclosure via aggregate"
          - "A field value is the AGID (Aggregate Identifier) — digest of concatenated attribute SAIDs"
          - "Cannot have both a and A fields simultaneously"
          - "Individual attributes disclosed via inclusion proofs against the AGID"

      - name: "metadata"
        fields:
          - name: "v"
            type: "string"
            required: true
            description: "Version string"
          - name: "d"
            type: "string"
            required: true
            description: "SAID"
          - name: "u"
            type: "string"
            required: true
            description: "UUID — EMPTY string (not absent, not high-entropy)"
            constraints:
              enum: [""]
          - name: "i"
            type: "string"
            required: true
            description: "Issuer AID"
          - name: "s"
            type: "string"
            required: true
            description: "Schema SAID"
          - name: "a"
            type: "map"
            required: true
            description: "Attribute section"
        invariants:
          - "u field is present but EMPTY — this is a metadata credential"
          - "Metadata credentials provide structural commitment without content correlation"
          - "Used in chain-link confidentiality — offer what's available before disclosing"
    construction_defaults:
      v: "Computed from protocol version and serialization kind"
      d: "Computed as SAID after all fields are set"
    encoding:
      - format: "json"
        notes: "Fields in canonical insertion order. SAID computed with d as placeholder."
      - format: "cbor"
        notes: "Same field ordering as JSON."
      - format: "cesr"
        notes: "CESR native with -G## count code."

  - name: "CredentialSection"
    description: "Optional sections that can be attached to any ACDC variant to add chaining, governance, or registry linkage."
    variants:
      - name: "edges"
        fields:
          - name: "e"
            type: "map"
            required: true
            description: "Edge section — references to other ACDCs forming a credential chain (trust graph)"
        invariants:
          - "Each edge references another ACDC by its SAID"
          - "Edges create a directed acyclic graph (DAG) of credential dependencies"
          - "Edge section has its own d (SAID) field"
      - name: "rules"
        fields:
          - name: "r"
            type: "map"
            required: true
            description: "Rules section — Ricardian contract terms governing credential usage"
        invariants:
          - "Rules section has its own d (SAID) field"
          - "Human and machine readable legal/usage terms"
      - name: "registry"
        fields:
          - name: "rd"
            type: "string"
            required: true
            description: "Registry delegation — SAID of the credential registry managing this credential's lifecycle"
        invariants:
          - "Links this credential to a TEL registry for status tracking (issuance/revocation)"

  - name: "REGID"
    description: "Registry Identifier — the SAID of a registry inception event (rip). Uniquely identifies a credential registry."
    variants:
      - name: "default"
        fields:
          - name: "qb64"
            type: "string"
            required: true
            description: "CESR-qualified registry SAID"
        invariants:
          - "Computed as the SAID of the registry inception (rip) event"
          - "Immutable — does not change across registry updates"

  - name: "CredentialStateSnapshot"
    description: "The current state of a credential at a point in time — derived from processing TEL events."
    variants:
      - name: "default"
        fields:
          - name: "credential_said"
            type: "string"
            required: true
            description: "SAID of the credential"
          - name: "registry_said"
            type: "string"
            required: true
            description: "REGID of the registry this credential belongs to"
          - name: "state"
            type: "string"
            required: true
            description: "Current lifecycle state"
            constraints:
              enum: ["NotIssued", "Issued", "Revoked"]
          - name: "sn"
            type: "integer"
            required: true
            description: "TEL sequence number of the latest event"
          - name: "latest_event_said"
            type: "string"
            required: true
            description: "SAID of the latest TEL event"
        invariants:
          - "Derived from processing TEL events — not directly authored"
          - "State transitions: NotIssued → Issued → Revoked (no reverse)"

  - name: "UpdateEvent"
    description: "Wrapper for credential state-change events (upd or bup), unifying both update variants for callers that don't need to distinguish shieldable from non-shieldable."
    variants:
      - name: "default"
        fields:
          - name: "event_type"
            type: "string"
            required: true
            description: "Which TEL update event type this wraps"
            constraints:
              enum: ["upd", "bup"]
          - name: "registry_said"
            type: "string"
            required: true
            description: "REGID of the registry managing this credential"
          - name: "credential_said"
            type: "string"
            required: true
            description: "SAID of the credential this event applies to"
          - name: "transaction_state"
            type: "string"
            required: true
            description: "Target credential state after this update"
            constraints:
              enum: ["issued", "revoked"]
        invariants:
          - "Wraps either a ShieldableUpdateEvent or NonShieldableUpdateEvent"
          - "event_type determines which underlying TEL event was produced"

  - name: "SealRequest"
    description: "Parameters for creating a KEL interaction event that anchors a seal — pairs an issuer AID with the seal to anchor. The seal encodes the SAID and sequence number of the TEL event being authorized."
    variants:
      - name: "default"
        fields:
          - name: "issuer_aid"
            type: "string"
            required: true
            description: "AID of the issuer whose KEL will contain the anchor seal"
          - name: "seal"
            type: "types://cesr/primitives#Seal"
            required: true
            description: "The seal to anchor in the issuer's KEL — contains TEL event SAID and sn"
          - name: "registry_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "REGID of the registry whose TEL event is being authorized"
          - name: "tel_event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the TEL event that this seal authorizes"
        invariants:
          - "Produces an interaction event (ixn) in the issuer's KEL with this seal in the anchors field"
          - "The seal SAID must match tel_event_said for consistency verification"
    notes: |
      L811-O10: SealRequest was previously undefined. This type specifies the complete parameter
      set for anchoring a TEL event in the issuer's KEL. The StatusService constructs this from
      the authorized TEL event and passes it to the commit-authorization outbound port.

  - name: "BackerConfiguration"
    description: "Configuration of the backer (witness-equivalent) set for a shieldable registry. Backers authorize bup (shieldable update) events in the same way witnesses authorize KEL events."
    variants:
      - name: "default"
        fields:
          - name: "backers"
            type: "array[types://cesr/primitives#AID]"
            required: true
            description: "Ordered list of authorized backer AIDs for this registry"
          - name: "threshold"
            type: "string"
            required: true
            description: "Backer signature threshold — integer (e.g., '2') or fractional (e.g., '1/2')"
          - name: "registry_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "REGID this configuration applies to"
        invariants:
          - "Threshold must be satisfied by indexed signatures from the backers list"
          - "Backers are non-transferable AIDs — they do not rotate (analogous to witnesses)"
          - "Configuration is established at registry inception (rip) and immutable thereafter"
          - "Bup events require BackerSignatureBundle satisfying this threshold before acceptance"
        builder:
          name: "BackerConfiguration.builder()"
          required_fields:
            - "registry(regid) — the registry this configuration belongs to"
            - "backers([aid1, aid2, ...]) — ordered backer AID list"
            - "threshold(expr) — threshold expression (integer or fractional string)"
          invariants:
            - "len(backers) >= threshold_integer if threshold is integer"
            - "Threshold expression must parse as a valid KERI threshold"
    notes: |
      L811-O1: BackerConfiguration was missing. This type captures the backer set for a
      shieldable registry. It is embedded in or referenced from the RegistryInceptionEvent
      (rip) and is the basis for bup event threshold verification (L2-O16).

  - name: "TELEscrowType"
    description: "Classification of TEL escrow queues for credential events awaiting different blocking conditions."
    variants:
      - name: "default"
        fields:
          - name: "value"
            type: "string"
            required: true
            constraints:
              enum: ["OutOfOrder", "PartialWitness", "MissingAnchor", "MissingSignatures", "MissingRegistry", "MissingChain", "MissingSchema"]
        invariants:
          - "OutOfOrder (OOT) — TEL event sn > expected, prior event not yet received"
          - "PartialWitness (PWE) — insufficient backer signatures for threshold"
          - "MissingAnchor (MAE) — KEL anchor seal not yet found"
          - "MissingSignatures (MSE) — controller signatures incomplete"
          - "MissingRegistry (MRE) — registry inception event not yet received"
          - "MissingChain — chained ACDC dependency not yet resolved"
          - "MissingSchema — credential schema not yet available"

  - name: "TELEscrowedEvent"
    description: "A TEL event held in escrow awaiting resolution of its blocking condition."
    variants:
      - name: "default"
        fields:
          - name: "registry_said"
            type: "string"
            required: true
            description: "REGID of the registry this event belongs to"
          - name: "sn"
            type: "integer"
            required: true
            description: "TEL sequence number"
          - name: "event"
            type: "bytes"
            required: true
            description: "Serialized TEL event data"
          - name: "escrowed_at"
            type: "datetime"
            required: true
            description: "When the event was escrowed — used for timeout pruning"
        invariants:
          - "Escrow is transient — events are promoted or pruned"
          - "Each event is in exactly one escrow type at a time"

  - name: "CredentialEdge"
    description: "A directed link block within the Edge Section referencing a far-node ACDC by SAID (n field), with optional Schema constraint (s field) and Operator (o field). Distinguished from EdgeGroup by the presence of a node field."
    variants:
      - name: "default"
        fields:
          - name: "d"
            type: "string"
            required: true
            description: "SAID of this edge block — universally unique edge identifier"
          - name: "u"
            type: "string"
            required: false
            description: "UUID — shielding factor for private edges"
          - name: "n"
            type: "string"
            required: true
            description: "Node — SAID of the far-node ACDC this edge points to"
          - name: "s"
            type: "string"
            required: false
            description: "Schema — SAID of additional Schema constraint on the far node"
          - name: "o"
            type: "string"
            required: false
            description: "Operator — unary operator (I2I, NI2I, DI2I, NOT)"
          - name: "w"
            type: "string"
            required: false
            description: "Weight — numeric weight for weighted aggregation operators"
        invariants:
          - "MUST have n field — distinguishes CredentialEdge from EdgeGroup"
          - "Default operator is I2I when far node is targeted, NI2I when untargeted"
          - "Schema s field enables forward-compatible edge constraints"

  - name: "EdgeGroup"
    description: "An aggregation block within the Edge Section composing multiple CredentialEdges or nested EdgeGroups via an m-ary Operator (AND, OR, NAND, NOR, AVG, WAVG). Distinguished from CredentialEdge by the absence of a node field."
    variants:
      - name: "default"
        fields:
          - name: "d"
            type: "string"
            required: true
            description: "SAID of this edge-group block"
          - name: "u"
            type: "string"
            required: false
            description: "UUID — shielding factor for private edge-groups"
          - name: "o"
            type: "string"
            required: false
            description: "Operator — m-ary operator (AND, OR, NAND, NOR, AVG, WAVG). Default: AND"
          - name: "w"
            type: "string"
            required: false
            description: "Weight — for weighted operators. MUST NOT appear on top-level Edge Section"
        invariants:
          - "MUST NOT have n field — distinguishes EdgeGroup from CredentialEdge"
          - "Default m-ary operator is AND when o field absent"
          - "Nested blocks are labeled per Schema — type-is-schema determines block types"

  - name: "SectionMessage"
    description: "An independently transmittable CESR message carrying a single ACDC section, enabling section-level caching and reuse across ACDC instances sharing the same section content."
    variants:
      - name: "default"
        fields:
          - name: "message_type"
            type: "string"
            required: true
            description: "Section message type identifier"
            constraints:
              enum: ["sch", "att", "agg", "edg", "rul"]
          - name: "section_said"
            type: "string"
            required: true
            description: "SAID of the section content — must match corresponding compact ACDC field"
          - name: "section_content"
            type: "map"
            required: true
            description: "Full expanded section content"
        invariants:
          - "Section SAID must match the corresponding field value in the associated compact ACDC"
          - "All designated fields are required — no optional fields (empty values via CESR empty primitives)"
          - "Enables caching — same section content across multiple ACDCs transmits once"
