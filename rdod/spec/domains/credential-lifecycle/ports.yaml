# ports.yaml
domain_ref: "credential-lifecycle"

ports:
  # Inbound — what the parent domain calls
  - id: "port://credential-lifecycle/inbound/state-management"
    type: inbound
    name: "Credential State Management"
    contract: "create_registry(issuer_aid) -> REGID; issue(regid, acdc_said) -> UpdateEvent; revoke(regid, acdc_said) -> UpdateEvent; get_state(regid, acdc_said) -> CredentialState; get_tel(regid) -> TEL"
    protocol: "method-call"
    refs: ["domain://credential-lifecycle"]

  - id: "port://credential-lifecycle/inbound/blinded-state"
    type: inbound
    name: "Blinded State Management"
    contract: "create_blinded_update(regid, acdc_said, state, shared_salt, sn) -> BlindableUpdateEvent; unblind_state(blid, shared_salt, sn, possible_states) -> CredentialState; update_blind(regid, sn) -> BlindableUpdateEvent"
    protocol: "method-call"
    refs: ["domain://credential-lifecycle"]
    delegates_to: "port://privacy/blinding/inbound/blinded-state"

  # Outbound — what credential-lifecycle calls (delegated to subdomains)
  - id: "port://credential-lifecycle/outbound/kel-sealing"
    type: outbound
    name: "KEL Sealing"
    contract: "anchor_tel_seal(issuer_aid, event_sn, event_said) -> InteractionEvent; verify_tel_seal(issuer_aid, key_event_sn, seal) -> Result<Valid, MissingKELSealError>"
    protocol: "method-call"
    refs: ["domain://identity"]

  - id: "port://credential-lifecycle/outbound/tel-event-repository"
    type: outbound
    name: "TEL Event Repository"
    contract: "append_tel_event(registry_said: SAID, event: TELEvent) -> Result — append-only, rejects duplicates by sequence number; get_tel_event_by_sn(registry_said: SAID, sn: int) -> Option<TELEvent>; get_tel_event_by_said(event_said: SAID) -> Option<TELEvent>; get_tel(registry_said: SAID) -> [TELEvent] — full TEL ordered by sequence number; get_anchor_seal(registry_said: SAID, event_said: SAID) -> Option<Seal>; put_timestamp(registry_said: SAID, event_said: SAID, datetime: DateTime) -> Result — immutable once set, subsequent writes for same key are no-ops"
    protocol: "method-call"
    refs: ["persistence"]
    invariants:
      - "Append-only: events for a registry are ordered by sequence number and never modified or deleted"
      - "Idempotent append: re-appending an event with the same registry SAID and sequence number is a no-op"
      - "Timestamp immutability: once a timestamp is recorded for an event, it cannot be overwritten"
      - "Sequence continuity: get_tel returns events in unbroken ascending sequence number order"

  - id: "port://credential-lifecycle/outbound/credential-repository"
    type: outbound
    name: "Credential Repository"
    contract: "store_credential(credential_said: SAID, credential: bytes) -> Result — stores ACDC bytes keyed by SAID; get_credential(credential_said: SAID) -> Option<bytes>; find_by_issuer(issuer_aid: AID) -> [SAID]; find_by_subject(subject_aid: AID) -> [SAID]; find_by_schema(schema_said: SAID) -> [SAID]; mark_processed(credential_said: SAID) -> Result — idempotent marker indicating credential has been fully processed"
    protocol: "method-call"
    refs: ["persistence"]
    invariants:
      - "Credential immutability: once stored, credential bytes for a SAID cannot be modified"
      - "Index consistency: storing a credential automatically indexes it by issuer, subject, and schema"
      - "Idempotent processing marker: calling mark_processed multiple times for the same SAID is a no-op"

  - id: "port://credential-lifecycle/outbound/tel-escrow-repository"
    type: outbound
    name: "TEL Escrow Repository"
    contract: "escrow(escrow_type: TELEscrowType, registry_said: SAID, sn: int, event: bytes, escrowed_at: DateTime) -> Result; get_escrowed(escrow_type: TELEscrowType, registry_said: SAID) -> [TELEscrowedEvent]; remove(escrow_type: TELEscrowType, registry_said: SAID, sn: int) -> Result"
    protocol: "method-call"
    refs: ["persistence"]
    invariants:
      - "Escrow is transient: events are removed once the missing dependency is satisfied"
      - "Escrow type partitioning: each escrow type is an independent namespace"
      - "Temporal ordering: escrowed events within a type are retrievable in escrowed_at order"
