# ports.yaml
domain_ref: "credential-lifecycle"

ports:
  # Inbound — what the parent domain calls
  - id: "port://credential-lifecycle/inbound/state-management"
    type: inbound
    name: "Credential State Management"
    semantics: command
    idempotent: false
    contract:
      input: "types://credential-lifecycle/status#TELEvent"
      output: "types://credential-lifecycle#CredentialState"
      errors:
        - "errors://credential-lifecycle#SchemaResolutionError"
        - "errors://credential-lifecycle#MutualExclusionError"
        - "errors://credential-lifecycle#IssuerKeyStateError"
        - "errors://credential-lifecycle#CredentialSAIDError"
    refs: ["domain://credential-lifecycle"]

  - id: "port://credential-lifecycle/inbound/blinded-state"
    type: inbound
    name: "Blinded State Management"
    semantics: command
    idempotent: false
    contract:
      input: "types://credential-lifecycle/registry#BlindableUpdateEvent"
      output: "types://credential-lifecycle#CredentialState"
      errors: []
    refs: ["domain://credential-lifecycle"]
    delegates_to: "port://privacy/blinding/inbound/blinded-state"

  # Outbound — what credential-lifecycle calls (delegated to subdomains)
  - id: "port://credential-lifecycle/outbound/commit-authorization"
    type: outbound
    name: "Commit Authorization"
    semantics: command
    idempotent: false
    description: >
      Requests the issuer's IdentityService to commit an authorization for a
      credential operation (issuance, revocation) to their identity history.
      This is how the issuer authorizes TEL state changes — by committing a
      seal to their own event log via the IdentityService.
    contract:
      input: "types://credential-lifecycle#SealRequest"
      output: "types://identity/establishment#InteractionEvent"
      errors:
        - "errors://credential-lifecycle/registry#MissingKELSealError"
    refs: ["domain://identity"]

  - id: "port://credential-lifecycle/outbound/credential-store"
    type: outbound
    name: "Credential Store"
    semantics: command
    idempotent: true
    description: >
      Stores raw ACDC credential bytes keyed by SAID. Separate from the
      TelRepository (which the StatusService manages for TEL events and escrow).
      This store holds the actual credential payloads — the content that TEL
      events refer to.
    contract:
      input: "types://credential-lifecycle#Credential"
      output: "types://credential-lifecycle#CredentialStateSnapshot"
      errors: []
    refs: ["domain://externals/persistence"]
    invariants:
      - "Credential immutability: once stored, credential bytes for a SAID cannot be modified"
      - "Index consistency: storing a credential automatically indexes it by issuer, subject, and schema"
      - "Idempotent: re-storing the same credential SAID is a no-op"
