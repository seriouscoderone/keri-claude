# ports.yaml
domain_ref: "credential-lifecycle/status"

ports:
  # Inbound -- StatusService interface
  - id: "port://credential-lifecycle/status/inbound/authorize"
    type: inbound
    name: "Authorize State Change"
    semantics: command
    idempotent: false
    description: >
      Primary StatusService operation — validates a credential lifecycle state
      change (registry existence, issuer key state, KEL authorization, schema,
      edge chain) and authorizes it. Produces a StatusWriteOutcome: accepted
      (committed to TEL), escrowed (held pending missing prerequisites), or
      rejected.
    contract:
      input: "types://credential-lifecycle/status#StateQueryInput"
      output: "types://credential-lifecycle/status#StatusWriteOutcome"
      errors:
        - "errors://credential-lifecycle/status#InvalidCredentialStateError"
        - "errors://credential-lifecycle/status#MissingRegistryError"
        - "errors://credential-lifecycle/status#MissingAuthorizationError"
        - "errors://credential-lifecycle/status#MissingIssuerError"
        - "errors://credential-lifecycle/status#MissingSchemaError"
        - "errors://credential-lifecycle/status#FailedSchemaValidationError"
        - "errors://credential-lifecycle/status#MissingChainError"
        - "errors://credential-lifecycle/status#RevokedChainError"
        - "errors://credential-lifecycle/status#ValidationError"
    refs: ["domain://credential-lifecycle"]

  - id: "port://credential-lifecycle/status/inbound/state-reconstruction"
    type: inbound
    name: "State Reconstruction"
    semantics: query
    idempotent: true
    contract:
      input: "types://credential-lifecycle/status#StateReconstructionInput"
      output: "types://credential-lifecycle/status#LifecycleStateSnapshot"
      errors: []
    refs: ["domain://credential-lifecycle"]

  # Outbound -- what state calls
  - id: "port://credential-lifecycle/status/outbound/state-snapshot-repository"
    type: outbound
    name: "State Snapshot Repository"
    semantics: command
    idempotent: true
    contract:
      input: "types://credential-lifecycle/status#LifecycleStateSnapshot"
      output: "types://credential-lifecycle/status#LifecycleStateSnapshot"
      errors: []
    refs: ["persistence"]
    invariants:
      - "Last-write-wins: saving a snapshot overwrites any previous snapshot for the same key"
      - "Snapshot is a materialized view: it can always be reconstructed from the underlying TEL events"
      - "Registry keyed by SAID: all lookups use the registry's self-addressing identifier"

  - id: "port://credential-lifecycle/status/outbound/tel-repository"
    type: outbound
    name: "TelRepository"
    semantics: command
    idempotent: false
    description: >
      TelRepository — append-only persistence for the Transaction Event Log and
      escrow queues. The StatusService IS the guard; the TelRepository IS the
      storage. All writes go through the StatusService, never directly to the
      repository.
    contract:
      input: "types://credential-lifecycle/status#TELEvent"
      output: "types://credential-lifecycle/status#StatusWriteOutcome"
      errors:
        - "errors://credential-lifecycle/status#StatusServiceStateError"
        - "errors://credential-lifecycle/status#StatusServiceValidationError"
    refs: ["external://persistence"]
