# ports.yaml
domain_ref: "credential-lifecycle/status"

ports:
  # Inbound -- what clients call
  - id: "port://credential-lifecycle/status/inbound/state-query"
    type: inbound
    name: "State Query and Computation"
    contract: "get_credential_state(regid: REGID, acdc_said: SAID) -> CredentialStateSnapshot; get_registry_state(regid: REGID) -> RegistryStateSnapshot; apply_event(verifier: TelEventVerifier, event: TelEvent) -> Result<StateChanged, InvalidTransition>"
    protocol: "method-call"
    refs: ["domain://credential-lifecycle"]

  - id: "port://credential-lifecycle/status/inbound/state-reconstruction"
    type: inbound
    name: "State Reconstruction"
    contract: "reconstruct_credential_state(regid: REGID, acdc_said: SAID, events: [TelEvent]) -> CredentialStateSnapshot; reconstruct_registry_state(regid: REGID, events: [TelEvent]) -> RegistryStateSnapshot"
    protocol: "method-call"
    refs: ["domain://credential-lifecycle"]

  # Outbound -- what state calls
  - id: "port://credential-lifecycle/status/outbound/state-snapshot-repository"
    type: outbound
    name: "State Snapshot Repository"
    contract: "save_credential_state(registry_said: SAID, credential_said: SAID, snapshot: CredentialStateSnapshot) -> Result; load_credential_state(registry_said: SAID, credential_said: SAID) -> Option<CredentialStateSnapshot>; save_registry_state(registry_said: SAID, snapshot: RegistryStateSnapshot) -> Result; load_registry_state(registry_said: SAID) -> Option<RegistryStateSnapshot>"
    protocol: "method-call"
    refs: ["persistence"]
    invariants:
      - "Last-write-wins: saving a snapshot overwrites any previous snapshot for the same key"
      - "Snapshot is a materialized view: it can always be reconstructed from the underlying TEL events"
      - "Registry keyed by SAID: all lookups use the registry's self-addressing identifier"
