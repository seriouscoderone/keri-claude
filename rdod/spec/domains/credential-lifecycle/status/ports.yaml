# ports.yaml
domain_ref: "credential-lifecycle/status"

ports:
  # Inbound -- what clients call
  - id: "port://credential-lifecycle/status/inbound/state-query"
    type: inbound
    name: "State Query and Computation"
    semantics: query
    idempotent: true
    contract:
      input: "types://credential-lifecycle/status#StateQueryInput"
      output: "types://credential-lifecycle/status#StateChanged"
      errors:
        - "errors://credential-lifecycle/status#InvalidCredentialStateError"
        - "errors://credential-lifecycle/status#MissingRegistryError"
        - "errors://credential-lifecycle/status#MissingAnchorError"
        - "errors://credential-lifecycle/status#MissingIssuerError"
        - "errors://credential-lifecycle/status#MissingSchemaError"
        - "errors://credential-lifecycle/status#FailedSchemaValidationError"
        - "errors://credential-lifecycle/status#MissingChainError"
        - "errors://credential-lifecycle/status#RevokedChainError"
        - "errors://credential-lifecycle/status#ValidationError"
    refs: ["domain://credential-lifecycle"]

  - id: "port://credential-lifecycle/status/inbound/state-reconstruction"
    type: inbound
    name: "State Reconstruction"
    semantics: query
    idempotent: true
    contract:
      input: "types://credential-lifecycle/status#StateReconstructionInput"
      output: "types://credential-lifecycle/status#LifecycleStateSnapshot"
      errors: []
    refs: ["domain://credential-lifecycle"]

  # Outbound -- what state calls
  - id: "port://credential-lifecycle/status/outbound/state-snapshot-repository"
    type: outbound
    name: "State Snapshot Repository"
    semantics: command
    idempotent: true
    contract:
      input: "types://credential-lifecycle/status#LifecycleStateSnapshot"
      output: "types://credential-lifecycle/status#LifecycleStateSnapshot"
      errors: []
    refs: ["persistence"]
    invariants:
      - "Last-write-wins: saving a snapshot overwrites any previous snapshot for the same key"
      - "Snapshot is a materialized view: it can always be reconstructed from the underlying TEL events"
      - "Registry keyed by SAID: all lookups use the registry's self-addressing identifier"
