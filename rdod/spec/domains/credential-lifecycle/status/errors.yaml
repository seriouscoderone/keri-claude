# errors.yaml
domain_ref: "credential-lifecycle/status"

# Error catalog for the Credential Lifecycle Status domain.
# Maps to exception classes in keripy/src/keri/kering.py and raise sites in
# keripy/src/keri/vdr/credentialing.py (Regery.revoke, Registrar.issue/revoke)
# and keripy/src/keri/vdr/verifying.py (Verifier.processCredential).
#
# Severity levels:
#   transient  — condition may self-resolve (escrow and retry)
#   recoverable — requires operator or protocol-level action
#   fatal      — unrecoverable; event is permanently rejected

errors:
  - name: "InvalidCredentialStateError"
    description: "Credential is in an invalid state for the requested operation"
    cause: "The credential has not been issued or has already been revoked — the TEL state machine rejects the transition"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "credential_said"
        type: "string"
        description: "The SAID of the credential"
      - field: "current_state"
        type: "string"
        description: "Current state (not issued, issued, revoked)"
      - field: "attempted_operation"
        type: "string"
        description: "The operation that was rejected (upd with ts='issued', upd with ts='revoked', bup with ts='issued', bup with ts='revoked')"
    related_port: "port://credential-lifecycle/status/inbound/state-query"

  - name: "MissingRegistryError"
    description: "Registry identifier not found in the Tevers (TEL event verifiers)"
    cause: "The registry REGID referenced by a TEL event or credential is not in the local Tevers — the registry inception event (rip) has not been received or processed"
    recovery: "escrow"
    escrow_queue: "MRE"
    severity: "transient"
    context:
      - field: "registry_id"
        type: "string"
        description: "The REGID of the missing registry"
      - field: "credential_said"
        type: "string"
        description: "The credential SAID referencing the missing registry"
    related_port: "port://credential-lifecycle/status/inbound/state-query"

  - name: "MissingAnchorError"
    description: "TEL event lacks a verified anchor seal in the issuer's KEL"
    cause: "The issuer's KEL does not contain a seal binding this TEL event — non-repudiability cannot be established until the anchor appears"
    recovery: "escrow"
    escrow_queue: "MAE"
    severity: "transient"
    context:
      - field: "issuer_aid"
        type: "string"
        description: "The issuer's AID prefix"
      - field: "registry_id"
        type: "string"
        description: "The REGID of the registry"
      - field: "tel_event_said"
        type: "string"
        description: "The SAID of the TEL event awaiting anchor"
    related_port: "port://credential-lifecycle/status/inbound/state-query"

  - name: "MissingIssuerError"
    description: "Issuer AID not found in the Kevers (key event verifiers)"
    cause: "The issuer's KEL has not been received — cannot verify credential issuance without the issuer's key state"
    recovery: "escrow"
    escrow_queue: "MRI"
    severity: "transient"
    context:
      - field: "issuer_aid"
        type: "string"
        description: "The issuer AID that is missing from the Kevers"
      - field: "credential_said"
        type: "string"
        description: "The SAID of the credential from the missing issuer"
    related_port: "port://credential-lifecycle/status/inbound/state-query"

  - name: "MissingSchemaError"
    description: "Credential schema SAID not found in the local cache"
    cause: "The JSON schema referenced by the credential's 's' field SAID has not been resolved — typically requires a data OOBI resolution first"
    recovery: "escrow"
    escrow_queue: "MSE"
    severity: "transient"
    context:
      - field: "schema_said"
        type: "string"
        description: "The SAID of the missing schema"
      - field: "credential_said"
        type: "string"
        description: "The SAID of the credential referencing the schema"
    related_port: "port://credential-lifecycle/status/inbound/state-query"

  - name: "FailedSchemaValidationError"
    description: "Credential does not validate against its declared JSON schema"
    cause: "The credential body fails JSON Schema validation against the schema identified by its 's' field SAID"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "credential_said"
        type: "string"
        description: "The SAID of the invalid credential"
      - field: "schema_said"
        type: "string"
        description: "The SAID of the schema that was validated against"
      - field: "reason"
        type: "string"
        description: "Schema validation failure details"
    related_port: "port://credential-lifecycle/status/inbound/state-query"

  - name: "MissingChainError"
    description: "Chained credential in the edge section cannot be verified"
    cause: "A credential referenced in the 'e' (edge) section has not been received or its status cannot be confirmed"
    recovery: "escrow"
    escrow_queue: "MCE"
    severity: "transient"
    context:
      - field: "credential_said"
        type: "string"
        description: "The SAID of the credential with the unresolved chain"
      - field: "chain_said"
        type: "string"
        description: "The SAID of the missing chained credential"
      - field: "edge_label"
        type: "string"
        description: "The edge label identifying the chain"
    related_port: "port://credential-lifecycle/status/inbound/state-query"

  - name: "RevokedChainError"
    description: "A credential in the edge chain has been revoked"
    cause: "A credential referenced in the 'e' (edge) section exists but its TEL state is revoked — the chain of trust is broken"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "credential_said"
        type: "string"
        description: "The SAID of the credential whose chain is broken"
      - field: "revoked_chain_said"
        type: "string"
        description: "The SAID of the revoked chained credential"
      - field: "edge_label"
        type: "string"
        description: "The edge label identifying the revoked chain"
    related_port: "port://credential-lifecycle/status/inbound/state-query"

  - name: "ValidationError"
    description: "TEL event or credential failed structural validation"
    cause: "TEL event body is malformed, sequence number is invalid, backer configuration is invalid, or duplicate backers detected"
    recovery: "abort"
    severity: "fatal"
    context:
      - field: "registry_id"
        type: "string"
        description: "The REGID (if parseable)"
      - field: "reason"
        type: "string"
        description: "Specific validation failure reason"
    related_port: "port://credential-lifecycle/status/inbound/state-query"
