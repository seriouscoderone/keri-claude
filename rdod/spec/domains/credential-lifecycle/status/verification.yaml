# verification.yaml
domain_ref: "credential-lifecycle/status"

properties:
  - invariant: "Exactly three states: NotIssued, Issued, Revoked"
    term: "Credential State"
    technique: property-based
    formal:
      language: python
      expression: "lambda state: state in ('NotIssued', 'Issued', 'Revoked')"
    strategy: "Generate all possible state values; verify only three accepted"
    notes: "Exhaustive state enumeration"

  - invariant: "Transitions are strictly one-directional: NotIssued -> Issued -> Revoked"
    term: "Credential State"
    technique: symbolic
    formal:
      language: python
      expression: |
        lambda old_state, new_state: (
          (old_state == 'NotIssued' and new_state == 'Issued') or
          (old_state == 'Issued' and new_state == 'Revoked')
        )
    notes: "Only two valid transitions exist — verified by exhaustive state machine exploration"

  - invariant: "No transition back from Revoked to Issued, or from Issued to NotIssued"
    term: "Credential State"
    technique: smt
    formal:
      language: z3
      expression: |
        And(
          Not(valid_transition('Revoked', 'Issued')),
          Not(valid_transition('Revoked', 'NotIssued')),
          Not(valid_transition('Issued', 'NotIssued')),
          Not(valid_transition('Revoked', 'Revoked'))
        )
    notes: "Negative transitions proven impossible by SMT"

  - invariant: "Sequence number must be exactly current_sn + 1 for the next event (monotonically increasing, no gaps)"
    term: "State Transition Rules"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([event, current_sn],
          Implies(
            is_valid_next_event(event, current_sn),
            event.sn == current_sn + 1
          )
        )
    notes: "No gaps or duplicates in sequence numbers"

  - invariant: "The p (prior event SAID) field must match the digest of the immediately preceding event in the TEL"
    term: "State Transition Rules"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([event, prior_event],
          Implies(
            And(event.sn == prior_event.sn + 1, event.sn > 0),
            event.p == said_compute(prior_event)
          )
        )
    notes: "Hash-chain integrity verification"

  - invariant: "An upd/bup event with ts='issued' is only valid when credential state is NotIssued"
    term: "State Transition Rules"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([event, state],
          Implies(
            And(event.t in ('upd', 'bup'), event.ts == 'issued', is_valid_transition(event, state)),
            state == 'NotIssued'
          )
        )
    notes: "Issuance precondition — v2 uses upd/bup with ts='issued' instead of LEGACY (v1 -- do NOT implement) iss/bis"

  - invariant: "An upd/bup event with ts='revoked' is only valid when credential state is Issued"
    term: "State Transition Rules"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([event, state],
          Implies(
            And(event.t in ('upd', 'bup'), event.ts == 'revoked', is_valid_transition(event, state)),
            state == 'Issued'
          )
        )
    notes: "Revocation precondition — v2 uses upd/bup with ts='revoked' instead of LEGACY (v1 -- do NOT implement) rev/brv"

  - invariant: "No event is valid when credential state is Revoked (terminal state)"
    term: "State Transition Rules"
    technique: smt
    formal:
      language: z3
      expression: |
        ForAll([event],
          Implies(
            current_state == 'Revoked',
            Not(is_valid_transition(event, 'Revoked'))
          )
        )
    notes: "Terminal state — no further transitions possible"

  - invariant: "Registry shieldability mode must match the event type: non-shieldable -> upd, shieldable -> bup"
    term: "State Transition Rules"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda registry, event: (
          (is_non_shieldable(registry) and event.t == 'upd')
          or (is_shieldable(registry) and event.t == 'bup')
        )
    strategy: "Generate registries with both modes and all event types; verify mode matching"
    notes: "Mode mismatch is rejected — non-shieldable registries use upd, shieldable registries use bup. LEGACY (v1 -- do NOT implement): NoBackers trait mapped to iss/rev, backed mapped to bis/brv"

  - invariant: "Replaying the same TEL events in order always produces the same state (deterministic)"
    term: "State Reconstruction"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda events: replay_state(events) == replay_state(events)
    strategy: "Replay TEL events multiple times; verify identical state output"
    notes: "Determinism of state reconstruction"

  - invariant: "Cached state snapshots must always be reproducible by TEL replay — replay is ground truth"
    term: "State Reconstruction"
    technique: property-based
    formal:
      language: python
      expression: |
        lambda cached_state, events: cached_state == replay_state(events)
    strategy: "Generate state snapshots and their source events; verify replay matches cache"
    notes: "Cache consistency check — replay is authoritative"

contracts:
  - port_ref: "port://credential-lifecycle/status/inbound/authorize"
    preconditions:
      - formal:
          language: python
          expression: "is_valid_said(regid) and is_valid_said(acdc_said)"
        description: "Registry ID and credential SAID must be valid"
    postconditions:
      - formal:
          language: python
          expression: "result.state in ('NotIssued', 'Issued', 'Revoked')"
        description: "Returned state is one of the three valid credential states"
      - formal:
          language: python
          expression: "result == replay_state(get_events(regid, acdc_said))"
        description: "Returned snapshot matches what TEL replay would produce"

  - port_ref: "port://credential-lifecycle/status/inbound/authorize"
    preconditions:
      - formal:
          language: python
          expression: |
            is_valid_tel_event(event) and (
              (event.t in ('upd', 'bup') and event.ts == 'issued' and verifier.vc_state(event.acdc_said) == 'NotIssued') or
              (event.t in ('upd', 'bup') and event.ts == 'revoked' and verifier.vc_state(event.acdc_said) == 'Issued')
            )
        description: "apply_event: event must be valid upd/bup with appropriate ts field and current state must allow the transition"
    postconditions:
      - formal:
          language: python
          expression: |
            (event.t in ('upd', 'bup') and event.ts == 'issued' and result.new_state == 'Issued') or
            (event.t in ('upd', 'bup') and event.ts == 'revoked' and result.new_state == 'Revoked')
        description: "upd/bup events with ts='issued' transition state to Issued; upd/bup events with ts='revoked' transition state to Revoked"

  - port_ref: "port://credential-lifecycle/status/inbound/state-reconstruction"
    preconditions:
      - formal:
          language: python
          expression: "is_valid_said(regid) and len(events) > 0 and events[0].t == 'rip'"
        description: "Events must start with rip inception and be a non-empty list"
    postconditions:
      - formal:
          language: python
          expression: "result == replay_state(events)"
        description: "Reconstruction produces the same state as sequential replay"

  - port_ref: "port://credential-lifecycle/status/inbound/authorize"
    preconditions:
      - description: "TEL event must reference an existing registry"
        formal:
          language: "pseudocode"
          expression: "registry_exists(event.ri OR event.ra.i)"
      - description: "TEL event must be anchored in the issuer's KEL"
        formal:
          language: "pseudocode"
          expression: "kel_contains_seal(issuer_aid, seal_of(tel_event))"
      - description: "State transition must be valid per the credential FSM"
        formal:
          language: "pseudocode"
          expression: "(current_state == NotIssued AND event.t in ['upd','bup'] AND event.ts == 'issued') OR (current_state == Issued AND event.t in ['upd','bup'] AND event.ts == 'revoked')"
    postconditions:
      - description: "On issuance: credential transitions to Issued state"
        formal:
          language: "pseudocode"
          expression: "event.t in ['upd','bup'] AND event.ts == 'issued' implies credential_state(event.i) == Issued"
      - description: "On revocation: credential transitions to Revoked state (terminal)"
        formal:
          language: "pseudocode"
          expression: "event.t in ['upd','bup'] AND event.ts == 'revoked' implies credential_state(event.i) == Revoked"
      - description: "On escrow: TEL event stored pending missing prerequisite"
        formal:
          language: "pseudocode"
          expression: "escrowed implies tel_escrow_queue(event) in [OOT, MRE, MAE, MRI, MSE, MCE]"

state_machines:
  - name: "CredentialLifecycle"
    term: "Credential State"
    states: ["NotIssued", "Issued", "Revoked"]
    initial_state: "NotIssued"
    terminal_states: ["Revoked"]
    transitions:
      - from: "NotIssued"
        to: "Issued"
        trigger: "Update event (upd with ts='issued' for non-shieldable, bup with ts='issued' for shieldable) accepted to TEL"
        guard: "Registry exists AND issuer key state valid AND KEL anchor present AND event sn == current_sn + 1 AND p field matches prior event SAID AND registry shieldability mode matches event type (upd/bup)"
      - from: "Issued"
        to: "Revoked"
        trigger: "Update event (upd with ts='revoked' for non-shieldable, bup with ts='revoked' for shieldable) accepted to TEL"
        guard: "Credential in Issued state AND issuer key state valid AND KEL anchor present AND event sn == current_sn + 1 AND p field matches prior event SAID AND registry shieldability mode matches event type (upd/bup)"
      # Explicit rejection transitions — what happens on invalid attempts
      - from: "NotIssued"
        to: "REJECTED"
        trigger: "Revocation event received for a NotIssued credential"
        guard: "ts='revoked' but credential has no prior issuance event — InvalidTransition"
      - from: "Issued"
        to: "REJECTED"
        trigger: "Duplicate issuance event for already-Issued credential"
        guard: "ts='issued' but credential is already Issued — InvalidTransition"
      - from: "Revoked"
        to: "REJECTED"
        trigger: "Any state change attempt on a Revoked credential"
        guard: "Credential is Revoked (terminal) — all events rejected"
    invariants:
      - "No reverse transitions — Revoked is permanent and terminal"
      - "No skip transitions — cannot go directly from NotIssued to Revoked"
      - "No self-transitions — re-issuing an already Issued credential is an error"
      - "REJECTED is not a credential state — it means the event was refused, credential state unchanged"
      - "Only the original issuer (registry owner) can trigger state transitions"
      - "Every transition requires a valid TEL event sealed in the issuer's KEL"
      - "State is deterministic given the same event sequence"

  - name: "RegistryLifecycle"
    term: "Registry State"
    states: ["Uninitialized", "Active"]
    initial_state: "Uninitialized"
    terminal_states: []
    transitions:
      - from: "Uninitialized"
        to: "Active"
        trigger: "rip event processed"
        guard: "Event sn == 0 AND issuer AID is valid"
    invariants:
      - "Registry must be Active before any credential events can be processed"
      - "Registry configuration is immutable after inception — no v2 equivalent of vrt exists"
      - "All credentials under this registry remain in their current state"
      - "LEGACY (v1 -- do NOT implement): vrt rotation events, NoBackers trait, Rotated state. In v2 registry config is immutable after rip inception."

# TEL event acceptance as a composable constraint graph.
# An AI reads this as a DAG: C1 → C2 → C3 → C4 → C5 (sequential with escrow at each stage).
validation_constraints:
  - id: "C1_registry_exists"
    constraint: "Registry identified by ri (or ra.i) must exist and be in Active state"
    depends_on: []
    on_failure: "escrow to MRE — missing registry escrow"

  - id: "C2_issuer_key_state"
    constraint: "Issuer's current key state must be available and event signatures must verify"
    depends_on: ["C1_registry_exists"]
    on_failure: "escrow to MRI — missing registry issuer key state"

  - id: "C3_kel_anchor"
    constraint: "TEL event must be anchored in the issuer's KEL via a seal"
    depends_on: ["C2_issuer_key_state"]
    on_failure: "escrow to MAE — missing authorization (KEL anchor event)"

  - id: "C4_sequence_valid"
    constraint: "Event sequence number must equal current_sn + 1 with p field matching prior event SAID"
    depends_on: ["C3_kel_anchor"]
    on_failure: "escrow to OOT — out-of-order TEL event"

  - id: "C5_state_transition_valid"
    constraint: "State transition must be valid per credential FSM (NotIssued→Issued or Issued→Revoked)"
    depends_on: ["C4_sequence_valid"]
    on_failure: "reject — invalid state transition"
