# ubiquitous-language.yaml
domain_ref: "credential-lifecycle/status"

terms:
  # Inherits: "Credential State" from domain://credential-lifecycle
  - term: "Credential State"
    synonyms: ["Transaction State", "VC State"]
    specializes: "Credential State"
    definition: "In the context of the status subdomain, credential state is the finite state machine tracking an ACDC's lifecycle within its registry TEL. Specializes the parent definition with the explicit three-state model (NotIssued -> Issued -> Revoked), one-directional transition rules, and the TEL replay mechanism for state determination."
    invariants:
      - "Exactly three states: NotIssued, Issued, Revoked"
      - "Transitions are strictly one-directional: NotIssued -> Issued -> Revoked"
      - "No transition back from Revoked to Issued, or from Issued to NotIssued"
      - "A credential with no TEL events is implicitly NotIssued"
      - "State is bound to the issuer's key state at the time of the anchoring KEL seal"
      - "For issuance/revocation registries: state values are 'issued' or 'revoked' (ts field strings in upd/bup events)"
    examples:
      - "A newly created ACDC before any upd/bup event with ts='issued': state is NotIssued"
      - "After processing an upd event with ts='issued': state transitions to Issued"
      - "After processing an upd event with ts='revoked' for an Issued credential: state transitions to Revoked"
      - "Attempting to process an upd event with ts='issued' for an already Issued credential: rejected as invalid transition"
    related_terms: ["Credential State Snapshot", "State Transition Rules", "TEL Event Verifier"]

  - term: "Credential State Snapshot"
    synonyms: []
    definition: "A materialized snapshot of a credential's lifecycle state at a specific point in the TEL. Contains credential SAID, registry SAID, sequence number, latest event digest, registry anchor, KEL anchor, datetime, and the event type that produced this state (upd or bup with ts field indicating issued/revoked). LEGACY (v1 -- do NOT implement): et was one of iss/bis/rev/brv. The Issued variant carries the event digest for hash-chain verification."
    invariants:
      - "Includes credential SAID (i), registry SAID (ri), sequence number (s), event digest (d), and the event type (et) that produced this state"
      - "Registry anchor seal and KEL anchor seal are both tracked"
      - "Issued state carries the event digest for hash-chain continuity"
      - "NotIssued is the default/initial state; Revoked is terminal"
      - "State snapshots are persisted for fast lookup but can be recomputed from the TEL"
      - "State transitions are one-directional only: NotIssued -> Issued -> Revoked, no backtracking"
    examples:
      - "Snapshot with et='upd', ts='issued', s='0', credential SAID, registry SAID -- credential just issued (non-blindable registry)"
      - "Snapshot with et='upd', ts='revoked', s='1', credential SAID -- credential revoked after issuance"
      - "Snapshot with et='bup', ts='issued', s='0' -- credential issued in a blindable registry"
      - "Issued state carrying event digest ELvaU6Z... for chain verification"
      - "Revoked -- terminal state after upd(ts='revoked') event processing"
    related_terms: ["Credential State", "Registry State Snapshot", "TEL Event Verifier", "State Reconstruction"]

  - term: "Registry State Snapshot"
    synonyms: []
    definition: "A materialized snapshot of a registry's management state. Tracks the registry's management TEL: registry SAID (REGID), current sequence number, latest management event digest, issuer AID, and registry mode (blindable or non-blindable). In TEL v2, registry configuration is immutable after inception (rip) -- there is no registry rotation event. LEGACY (v1 -- do NOT implement): updated by VCP (inception) and VRT (rotation) management events with mutable backer lists."
    invariants:
      - "Tracks the registry's management TEL state: REGID, sequence number, latest event digest"
      - "Includes issuer AID and registry mode (blindable or non-blindable)"
      - "Registry configuration is immutable after inception (rip) in v2 -- no rotation equivalent"
      - "Updated only by the rip (registry inception) event -- credential events (upd/bup) do not affect registry state"
      - "Fields: version, REGID, sequence number, digest, issuer AID, datetime, event type, config traits"
      - "LEGACY (v1 -- do NOT implement): backer threshold (toad) and backer list (b) fields existed for VCP/VRT rotation"
    examples:
      - "Registry state snapshot after rip inception: sn=0, non-blindable mode, issuer AID set"
      - "Non-blindable registry: credential events use upd (not bup)"
      - "Blindable registry: credential events use bup"
      - "LEGACY (v1): registry state after vrt rotation with updated backer list -- not valid in v2"
    related_terms: ["Credential State Snapshot", "TEL Event Verifier", "State Transition Rules"]

  - term: "TEL Event Verifier"
    synonyms: []
    definition: "State machine tracking one registry's complete TEL state: the management TEL (registry configuration, sequence number) and per-credential TELs (issuance/revocation lifecycle). Holds registry prefix, issuer AID, current sequence number, latest event, last event type, and a per-credential state map. In v2: registry configuration is immutable after rip -- only credential events (upd/bup) advance per-credential state."
    invariants:
      - "One TEL Event Verifier instance per registry, keyed by REGID"
      - "Maintains the current management sequence number and latest management event digest"
      - "Tracks issuer AID and registry mode (blindable or non-blindable)"
      - "Exposes per-credential state keyed by credential SAID"
      - "Provides a full Registry State Snapshot on request"
      - "Enforces NotIssued -> Issued(digest) -> Revoked transition only"
      - "Tracks sequence number and issuer for the management TEL"
      - "Registry inception (rip) establishes registry-level state; credential events (upd/bup) update per-credential state"
      - "LEGACY (v1 -- do NOT implement): management events VCP/VRT updated registry state; credential events iss/bis/rev/brv updated per-credential state"
    examples:
      - "TEL Event Verifier initialized from a rip event: sn=0, non-blindable mode, no credentials yet"
      - "Querying credential state for 'ELvaU6Z...' returning snapshot with et='upd', ts='issued'"
      - "Management state set at rip: sn=0, issuer bound, configuration immutable"
      - "LEGACY (v1): TEL Event Verifier advancing management sn after vrt event -- not valid in v2"
    related_terms: ["Credential State Snapshot", "Registry State Snapshot", "State Transition Rules", "State Reconstruction"]

  - term: "State Transition Rules"
    synonyms: []
    definition: "The set of conditions governing when each TEL state transition is valid. Enforces sequence number ordering, digest chaining, mode matching (blindable vs non-blindable), and one-directional credential lifecycle progression."
    invariants:
      - "Sequence number must be exactly current_sn + 1 for the next event (monotonically increasing, no gaps)"
      - "The p (prior event SAID) field must match the digest of the immediately preceding event in the TEL"
      - "Credential state transitions must follow the one-directional rule: NotIssued -> Issued -> Revoked"
      - "An upd(ts='issued') or bup(ts='issued') event is only valid when credential state is NotIssued"
      - "An upd(ts='revoked') or bup(ts='revoked') event is only valid when credential state is Issued"
      - "No event is valid when credential state is Revoked (terminal state)"
      - "Blindable events (bup) require backer signatures meeting the threshold"
      - "Non-blindable events (upd) must not include backer signature attachments"
      - "Registry mode must match the event type: non-blindable -> upd, blindable -> bup"
      - "Registry configuration is immutable after inception (rip) in v2 -- no management rotation events"
      - "LEGACY (v1 -- do NOT implement): iss/rev for backerless, bis/brv for backed, VRT for registry rotation"
    examples:
      - "upd event with ts='issued' at sn=1 with p=SAID_of_event_at_sn_0: valid if credential is NotIssued and registry is non-blindable"
      - "upd event with ts='revoked' for Issued credential: valid -- transitions to Revoked"
      - "upd event with ts='issued' for already-Issued credential: rejected -- invalid state transition"
      - "bup event on a non-blindable registry: rejected -- mode mismatch"
      - "Event with sn=3 when current sn=1: rejected or escrowed as out-of-order (sn=2 missing)"
    related_terms: ["Credential State", "TEL Event Verifier", "Blindable vs Non-Blindable"]

  - term: "State Reconstruction"
    synonyms: ["TEL Replay"]
    definition: "The process of recomputing current credential and registry state by replaying all TEL events from the registry inception (rip) through the latest event. Analogous to KEL state reconstruction for key state. Enables stateless verification -- any validator can reconstruct state from the TEL alone without relying on cached snapshots."
    invariants:
      - "Replaying the same TEL events in order always produces the same state (deterministic)"
      - "Starts from the registry inception event (rip) which establishes initial registry state"
      - "The rip event establishes registry state; credential events (upd/bup) update per-credential state"
      - "Each event is validated against State Transition Rules during replay"
      - "Any validator can independently reconstruct state from a complete TEL copy"
      - "Cached state snapshots are an optimization -- reconstruction is the ground truth"
      - "Hash-chain integrity (p field) is verified during replay to detect tampering"
      - "LEGACY (v1 -- do NOT implement): management events VCP/VRT updated registry state; credential events iss/bis/rev/brv updated per-credential state"
    examples:
      - "Reconstructing credential state: replay rip -> upd(ts='issued') -> result is Issued"
      - "Reconstructing registry state: replay rip -> result is ManagerTelState with immutable configuration"
      - "A new validator bootstrapping by replaying the complete TEL from rip to compute all current state"
      - "State reconstructed by iterating stored events for a credential SAID"
    related_terms: ["Credential State Snapshot", "Registry State Snapshot", "TEL Event Verifier", "State Transition Rules"]

  - term: "Missing Anchor Escrow"
    synonyms: ["MAE"]
    definition: "Holds TEL events whose anchor seal in the issuer's KEL has not yet been verified. The issuer's KEL does not yet contain the seal binding the TEL event. Reprocessed when the issuer's KEL is updated with a potential anchoring event."
    invariants:
      - "Triggered when no matching seal is found in the issuer's KEL at the expected position"
      - "Distinct from MIE: MAE has the issuer's KEL but the seal is missing; MIE does not have the issuer's KEL event at all"
    related_terms: ["TEL Event Verifier", "State Transition Rules"]

  - term: "Missing Issuer Escrow"
    synonyms: ["MRI"]
    definition: "Holds credentials whose issuer AID is not found in the local Kevers. The issuer's KEL has not been received, so credential issuance cannot be verified. Reprocessed when the issuer's KEL becomes available."
    invariants:
      - "Triggered when the issuer AID referenced in a credential is not in the local Kevers"
      - "Reprocessed when the issuer's KEL is fetched (typically via OOBI resolution)"
      - "Default timeout: 3600 seconds"
    related_terms: ["TEL Event Verifier", "Credential State"]

  - term: "Missing Chain Escrow"
    synonyms: ["MCE"]
    definition: "Holds credentials whose edge section references chained credentials that have not yet been received or verified. The credential chain cannot be validated until all referenced credentials are available."
    invariants:
      - "Triggered when a credential in the edge (e) section has not been received or its status cannot be confirmed"
      - "Reprocessed when the blocking credential chain dependency resolves — the chained credential is accepted to the TEL"
    related_terms: ["TEL Event Verifier", "Credential State"]

  - term: "Missing Schema Escrow"
    synonyms: ["MSE"]
    definition: "Holds credential events whose schema SAID cannot be resolved — the schema has not yet been fetched or cached. The credential cannot be validated until its schema is available for structural verification."
    invariants:
      - "Triggered when the credential's schema SAID is not found in the local schema cache"
      - "Reprocessed when the schema is fetched and cached"
    related_terms: ["TEL Event Verifier", "Credential State"]

events:
  - name: "CredentialStateChanged"
    payload: "regid: REGID, acdc_said: SAID, old_state: CredentialState, new_state: CredentialState, event_sn: int, event_said: SAID"
    triggers: "A credential TEL event (upd/bup) is processed and the credential's state transitions"

  - name: "RegistryStateChanged"
    payload: "regid: REGID, old_sn: int, new_sn: int, event_type: EventType, new_digest: SAID"
    triggers: "A registry inception (rip) event is processed and the registry's management state is established"

  - name: "StateReconstructed"
    payload: "regid: REGID, credential_count: int, management_sn: int"
    triggers: "A full TEL replay completes, reconstructing all state from the event log"

rules:
  - "State transitions are strictly one-directional: NotIssued -> Issued -> Revoked -- no reversal"
  - "Sequence numbers must be monotonically increasing with no gaps"
  - "Prior event digest (p field) must match the SAID of the preceding event -- hash-chain integrity"
  - "Registry mode (blindable vs non-blindable) constrains which credential event types are valid: non-blindable -> upd, blindable -> bup"
  - "Registry inception (rip) establishes registry state; credential events (upd/bup) affect only credential state"
  - "Cached state snapshots must always be reproducible by TEL replay -- replay is ground truth"
  - "Revoked is a terminal state -- no further state changes are possible for that credential"
