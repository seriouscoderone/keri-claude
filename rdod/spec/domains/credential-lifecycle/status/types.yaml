domain_ref: "credential-lifecycle/status"

types:
  - name: "TelEventUnion"
    description: "Union type for any event in a Transaction Event Log. Discriminated by the t field. Formerly TELEvent — renamed for clarity against TelEventId. At Layer 0, event variant fields use opaque SAID references for registry types — resolved to concrete imports at Layer 6."
    variants:
      - name: "registry_inception"
        fields:
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the registry inception event (rip) — forward reference to registry domain"
          - name: "ilk"
            type: "string"
            required: true
            description: "Event type discriminator"
            constraints:
              enum: ["rip"]
        invariants:
          - "t field is 'rip'"
      - name: "blindable_update"
        fields:
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the blindable update event (bup) — forward reference to registry domain"
          - name: "ilk"
            type: "string"
            required: true
            description: "Event type discriminator"
            constraints:
              enum: ["bup"]
        invariants:
          - "t field is 'bup'"
      - name: "non_blindable_update"
        fields:
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the non-blindable update event (upd) — forward reference to registry domain"
          - name: "ilk"
            type: "string"
            required: true
            description: "Event type discriminator"
            constraints:
              enum: ["upd"]
        invariants:
          - "t field is 'upd'"

  - name: "TelEventId"
    description: "The identifying tuple for any TEL event (rip, upd, or bup) — type, registry SAID, credential SAID, sequence number. Formerly TelEvent — renamed for clarity against TelEventUnion."
    variants:
      - name: "default"
        fields:
          - name: "ilk"
            type: "string"
            required: true
            description: "Event type discriminator"
            constraints:
              enum: ["rip", "upd", "bup"]
          - name: "said"
            type: "string"
            required: true
            description: "SAID of this TEL event"
          - name: "registry_said"
            type: "string"
            required: true
            description: "REGID of the registry this event belongs to"
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number within the registry's TEL"

  - name: "LifecycleStateSnapshot"
    description: "Materialized view of credential lifecycle state at a point in time, derived from TEL event replay. Cached for query performance; always reconstructable by replaying all TEL events."
    variants:
      - name: "default"
        fields:
          - name: "registry_said"
            type: "string"
            required: true
            description: "REGID of the registry this snapshot belongs to"
          - name: "credential_said"
            type: "string"
            required: true
            description: "SAID of the credential this state snapshot covers"
          - name: "state"
            type: "string"
            required: true
            description: "Current lifecycle state"
            constraints:
              enum: ["NotIssued", "Issued", "Revoked"]
          - name: "last_sn"
            type: "integer"
            required: true
            description: "Sequence number of the last TEL event applied to produce this snapshot"
        invariants:
          - "Deterministic: the same sequence of TEL events always produces identical snapshots"
          - "Reconstructable: snapshot must equal the result of replaying all TEL events from inception"
          - "last_sn matches the sn of the most recently applied TelEvent"
          - "A cache miss is never an error — reconstruct from TEL and cache the result"

  - name: "StateQueryInput"
    description: "Parameters for authorizing a credential lifecycle state change within a registry. The service derives current state internally from the TEL (CQRS pattern) — the caller provides the TEL event to authorize, not a snapshot."
    variants:
      - name: "default"
        fields:
          - name: "registry_said"
            type: "string"
            required: true
            description: "REGID of the registry to query"
          - name: "tel_event"
            type: "types://credential-lifecycle/status#TelEventUnion"
            required: true
            description: "The TEL event to authorize — the service reconstructs current state from the TEL"
        invariants:
          - "Registry must exist and be resolvable by REGID"
          - "Service derives current state internally — caller does not provide a snapshot"

  - name: "StateReconstructionInput"
    description: "Parameters for reconstructing the current state of a registry or credential from its TEL event history."
    variants:
      - name: "default"
        fields:
          - name: "registry_said"
            type: "string"
            required: true
            description: "REGID of the registry whose state is being reconstructed"
          - name: "events"
            type: "array[types://credential-lifecycle/status#TelEventId]"
            required: true
            description: "Ordered list of TEL events to replay for state reconstruction"
        invariants:
          - "Events must be in ascending sequence number order"
          - "First event must be a registry inception (rip) if reconstructing registry state"

  - name: "TelEventVerifier"
    description: "Verifier instance bound to a specific registry, tracking expected sequence number for state transitions."
    variants:
      - name: "default"
        fields:
          - name: "registry_said"
            type: "string"
            required: true
            description: "REGID of the registry being verified"
          - name: "issuer_aid"
            type: "string"
            required: true
            description: "AID of the registry's issuer"
          - name: "current_sn"
            type: "integer"
            required: true
            description: "Next expected sequence number (highest processed sn + 1)"
        invariants:
          - "current_sn advances monotonically as events are applied"
          - "Rejects events with sn != current_sn (out-of-order)"

  - name: "InvalidTransition"
    description: "A rejected state transition that violates the credential lifecycle state machine."
    variants:
      - name: "default"
        fields:
          - name: "current_state"
            type: "string"
            required: true
            description: "State the credential was in when the transition was attempted"
          - name: "attempted_state"
            type: "string"
            required: true
            description: "State the event tried to transition to"
          - name: "reason"
            type: "string"
            required: true
            description: "Human-readable explanation of why the transition is invalid"
        invariants:
          - "Common case: attempting to issue an already-issued credential, or revoke a not-yet-issued one"

  - name: "StatusWriteOutcome"
    description: "Result of submitting a credential lifecycle state change to the StatusService. The StatusService validates and authorizes the change before committing to the TelRepository."
    variants:
      - name: "accepted"
        fields:
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the accepted TEL event"
          - name: "state_changed"
            type: "boolean"
            required: true
            description: "Whether the credential lifecycle state changed (e.g., NotIssued → Issued)"
        invariants:
          - "The TEL event is appended and the credential state snapshot is updated"
      - name: "escrowed"
        fields:
          - name: "event_said"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "SAID of the escrowed TEL event"
          - name: "escrow_reason"
            type: "string"
            required: true
            description: "Blocking condition — missing registry, missing authorization, missing issuer key state, missing schema, missing chain"
        invariants:
          - "Stored in escrow queue keyed by blocking condition (MRE, MAE, MRI, MSE, MCE, OOT)"
          - "Re-enters the guard when the blocking condition resolves"
      - name: "rejected"
        fields:
          - name: "reason"
            type: "string"
            required: true
            description: "Why the TEL event was permanently rejected"
        invariants:
          - "Invalid state transition (e.g., revoking a not-yet-issued credential) or failed schema validation"

  - name: "StateChanged"
    description: "Notification that a credential's lifecycle state changed after applying a TEL event."
    variants:
      - name: "default"
        fields:
          - name: "credential_said"
            type: "string"
            required: true
            description: "SAID of the credential whose state changed"
          - name: "new_state"
            type: "string"
            required: true
            description: "The state after the transition"
            constraints:
              enum: ["Issued", "Revoked"]
          - name: "sn"
            type: "integer"
            required: true
            description: "Sequence number of the event that caused the state change"

  - name: "Creder"
    description: "ACDC credential facade — extends the generic SAD serializer (Sadder from cesr/composition) with ACDC-specific field accessors: issuer AID, schema SAID, subject, status, edges, rules. Provides the credential-domain view of a self-addressing data structure."
    variants:
      - name: "default"
        fields:
          - name: "sad"
            type: "types://cesr/composition#Sadder"
            required: true
            description: "The underlying generic SAD serializer"
          - name: "issuer"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "Issuer AID (i field)"
          - name: "schema"
            type: "types://cesr/primitives#SAID"
            required: true
            description: "Schema SAID (s field)"
          - name: "subject"
            type: "map"
            required: false
            description: "Attribute section (a field) — may be compact SAID"
          - name: "status"
            type: "types://cesr/primitives#SAID"
            required: false
            description: "Registry SAID for credential status (ri field)"
        invariants:
          - "Extends Sadder with ACDC-specific field accessors"
          - "SAID computed using the Sadder's saidify algorithm"
          - "All ACDC-specific fields are derived from the underlying SAD field map"
